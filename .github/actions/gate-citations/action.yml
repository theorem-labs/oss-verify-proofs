# gate-citations: the publishing gate's citations of its build checks of one commit, for `oft plan --gate-citations`
# (release-check.yml's and weekly.yml's plan jobs).
#
# The publishing gate, outside this repository, checks each unit's build part (statements and proofs, in the release
# checker image) on the build service (builds-ossv).  For a commit it passed, it writes a file of citations in
# tools/oft/offloaded-checks.tsv's form, one row per unit it checked (part `build`, the key at that commit, its job, the
# SHA-256 of the job's result, the date), to citations/<commit>.tsv on the branch gate-citations, and then creates a
# check run CHECK on that commit with its own GitHub App (APP_ID), whose summary names the file and its SHA-256:
#
#   citations: citations/<commit>.tsv
#   sha256: <64 lowercase hex digits>
#   scope: full | routed
#   units: <the number of rows>
#   gate run: <the gate's run>
#
# Only a check run of that name made by that App counts (any account or workflow with write access can create a check
# run of any name; one is bound to the App whose token created it), and its newest on exactly the commit decides, so
# the gate can withdraw citations by creating another.  The file is anyone's to push to that branch; the App's check
# run binds its bytes by SHA-256, and a file that differs fails this step.  No check run, or one that is not a success:
# no file, and the plan checks every planned part in a job, as without citations.  `oft plan` takes a row only at the
# part's current key, so a part is either cited at its own key or checked in a job, never neither.
name: gate-citations
description: >-
  The publishing gate's citations of its build checks of a commit, from its App's check run on that commit, checked
  against the SHA-256 the check run names.
inputs:
  commit:
    description: the full commit id whose citations are read
    required: true
  file:
    description: where to write the citations
    required: true
outputs:
  file:
    description: the file written, or empty when the gate cites nothing on this commit
    value: ${{ steps.cite.outputs.file }}
  check-run:
    description: the gate's check run read, as a URL, or empty
    value: ${{ steps.cite.outputs.check_run }}
  scope:
    description: the gate run's scope (full or routed), or empty
    value: ${{ steps.cite.outputs.scope }}
runs:
  using: composite
  steps:
    - id: cite
      shell: bash
      env:
        COMMIT: ${{ inputs.commit }}
        OUT: ${{ inputs.file }}
        GH_TOKEN: ${{ github.token }}
        CHECK: ossv-gate/citations
        APP_ID: "5447700"
        BRANCH: gate-citations
      run: |
        set -euo pipefail
        [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit $COMMIT is not a full commit id"; exit 1; }
        none() { echo "the publishing gate cites nothing on $COMMIT: $1"; { echo "file="; echo "check_run="; echo "scope="; } >> "$GITHUB_OUTPUT"; exit 0; }
        # every check run of that name and App on exactly this commit; the newest (the highest id) decides
        gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/commits/$COMMIT/check-runs" \
            -f check_name="$CHECK" -f app_id="$APP_ID" -f filter=all -f per_page=100 --jq \
            '.check_runs[] | select(.name == env.CHECK and (.app.id | tostring) == env.APP_ID and .head_sha == env.COMMIT)
             | {id, status, conclusion, html_url, summary: (.output.summary // "")}' \
          | jq -s 'sort_by(.id) | last // empty' > "$RUNNER_TEMP/gate-check.json"
        [ -s "$RUNNER_TEMP/gate-check.json" ] || none "no $CHECK check run by App $APP_ID"
        read -r status conclusion url < <(jq -r '"\(.status) \(.conclusion // "none") \(.html_url)"' "$RUNNER_TEMP/gate-check.json")
        [ "$status/$conclusion" = completed/success ] || none "its newest $CHECK check run, $url, is $status $conclusion"
        field() { jq -r .summary "$RUNNER_TEMP/gate-check.json" | sed -n "s/^$1: *//p" | head -n 1; }
        path="$(field citations)" sha="$(field sha256)" scope="$(field scope)"
        [ "$path" = "citations/$COMMIT.tsv" ] || { echo "::error::$url names the file '$path', not citations/$COMMIT.tsv"; exit 1; }
        [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::$url names no SHA-256 of its file"; exit 1; }
        gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/$path?ref=$BRANCH" > "$OUT"
        got="$(sha256sum "$OUT" | cut -d ' ' -f 1)"
        [ "$got" = "$sha" ] || { echo "::error::$path on $BRANCH has SHA-256 $got, and $url names $sha"; exit 1; }
        { echo "file=$OUT"; echo "check_run=$url"; echo "scope=$scope"; } >> "$GITHUB_OUTPUT"
        echo "the publishing gate's citations of $COMMIT: $path on $BRANCH ($(grep -vc '^#' "$OUT") lines with its header), from $url, scope $scope"
