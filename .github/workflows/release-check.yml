# release-check.yml: what a commit changes, checked on that commit alone; the README's badge.
#
#   plan           the base (this commit's parent), the paths the commit changes, and the parts to
#                  check of every harness with a committed proof (proofs/<p>/<h>/<s>/proof.yaml) or
#                  finding (findings/<p>/<h>/<slug>/finding.yaml, also on a harness that withholds
#                  every build), through `oft plan`.  With tools that have content keys
#                  (tools/oft/keys.py), a part is kept when its key differs from its key at the base;
#                  with tools that predate them (a release line's older tools), the changed paths are
#                  mapped onto harnesses by `oft plan --changed`: a changed proofs/<p>/<h>/,
#                  findings/<p>/<h>/, counterexamples/<p>/<h>/ or projects/<p>/ marks that harness or
#                  that project's harnesses, and nothing else marks any.  A weekly or dispatched run, a
#                  push with no usable parent, and a change that reaches every harness (FULL below) plan
#                  every part instead (a full plan).  The plan also names the planned binaries in a
#                  release that a read-only token cannot see (a draft), and which group needs each
#   fetch-drafts   each of those binaries once, checked against its pin, as an artifact
#                  of its own (skipped when there is none)
#   check          each group of harnesses: fetch (a draft from its artifact), build the
#                  images and statements, every proof and its assumptions against the
#                  allowlist, every counterexample and every finding
#                  (tools/oft/ci/check-units.sh)
#   release-check  the one required check: it always runs, and fails if any job failed, if a planned
#                  harness was not checked, or if a full plan named no harness at all
#
# What each commit's own diff decides.  A commit that changes only CHANGELOG.md, docs/,
# .github/workflows/, or release.yaml's version and date plans no proof job and is green in minutes; a
# commit that changes one unit's proofs, counterexamples, findings or facts re-checks that unit, and
# never more than the full plan.  Which router decides depends on the commit's own tools, which are
# what the check job runs:
#   - content keys, when `oft plan` has them (it takes --store): a change to the checker image pin
#     (release.yaml images.checker), theories/, toolchain/allowed-axioms.txt or dune-project changes
#     every build key, and so re-checks every build.  What no key holds takes the full plan (FULL):
#     tools/ (the checker the check job copies and runs), toolchain/ (the files that build the
#     images), a .gitattributes, and .github/actions/ (whose place-drafts the check job runs).  A
#     hand-written dune file that could change a build is refused by the plan (keys.check_hand_dune).
#   - the diff alone, with older tools: a change to a project's project.yaml or any of its
#     harness.yaml files re-checks that project (`oft fetch` checks the project's archive against
#     every harness's builds).  A change that every harness reads -- theories/, toolchain/,
#     dune-project, a .gitattributes, a hand-written dune file, tools/, .github/actions/, or a
#     release.yaml that names another checker or runner image -- re-checks every one (FULL).
# A path git quotes ('"', '\' or a control character in its name) is read by no rule here, and is
# FULL too.
#
# A change under .github/workflows/ plans no proof.  What it can break is the workflows themselves, and
# pr.yml's run of the same push to main lints the tree and runs the tools' own tests, which read these
# workflow files; re-compiling every proof would say nothing more about it.  This is also the rule the
# publishing gate's own router follows.
#
# No earlier push is credited.  The plan judges this commit against its parent and reads no record of
# passes (`oft plan --store`), and each commit's run has a concurrency group of its own, so a new push
# never cancels the run that is checking the push before it: every commit of main is decided and
# checked on its own.
#
# The parts are planned with THIS commit's statements and tools (`--pr-kind release`, `--tools HEAD`),
# which are what the check job runs (it copies work/tools out of the tree it checks).  pr.yml instead
# judges a pull request with the base's tools, which a reviewer has read.
#
# It runs on every push to main, weekly and on request.  pr.yml checks what a pull request touches;
# the weekly run and a workflow_dispatch check every committed proof and finding, so the badge rests on
# a full re-check at least once a week.  The proof checks
# run on ubuntu-24.04-16core, a 16-core/64 GB GitHub-hosted larger runner (a proof
# check peaks at 14.5-19.4 GiB on 16 cores).
#
# A token with contents: read cannot see a draft release, and a release's new
# binaries stay drafts until release.yml publishes them.  So fetch-drafts alone
# has contents: write; it checks out nothing and runs no script from the tree,
# only `gh release download` of the pins the plan listed and a SHA-256 check of
# each.  Its YAML is the checked commit's fetch-drafts.yml: this workflow runs
# on a push to main, on a schedule and on a request by someone with write
# access (of main or another branch), never for a pull request.  Every other
# job has read access only.
#
# Caches, which make a run cheaper, never more trusting:
#   - dune's own content-addressed cache, for what `dune build` makes: the
#     images, the statements and each harness's proof library
#     (proofs/<p>/<h>/lib/).  dune reuses a file only when its sources, its
#     dependencies, the rules and the Rocq binary hash the same.  The key names
#     the checker image's digest and the job's harnesses
#     (tools/oft/ci/cache-key.sh); only a push to main or a maintainer's
#     workflow_dispatch saves it, never a pull request, and nothing outside
#     this repository's own runs writes it.  Each proof itself, and the wrapper
#     that ties it to its statement and prints its assumptions, is compiled
#     afresh every run (oft check compiles them with `rocq compile` in fresh
#     directories).  No proof check restores this cache now (OSSV-218: the
#     check job's restore step says why); it is still saved.
#   - the release assets, keyed by their pinned SHA-256; `oft fetch` checks every
#     archive and file against the facts before using it.
# A job that read a draft saves neither cache: a pull request can restore a
# cache saved on main, and both hold the binaries' bytes, which would then
# outlive the draft's one-day artifact.  weekly.yml's sweep reads no cache.
# The artifact widens who can read a draft binary, for one day: a draft release
# is visible only with write access, an artifact to anyone who can read the
# repository, which for a public repository is anyone signed in to GitHub.
# That is accepted: the facts already publish each archive's SHA-256, a project
# held by its status pins no asset and a findings-<project> release holds only
# the project a finding holds back (tools/oft/rules.py), the publishing gate
# outside this repository refuses any asset of a project it holds back, and the
# files are the ones the release is to publish; if publishing is refused, they
# were still readable for that day.
name: release-check
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      units:
        description: "PROJECT/HARNESS ... to check instead of every harness with a proof or a finding (not on main: the badge says every one)"
        default: ""
permissions:
  contents: read
  packages: read   # to pull the pinned checker and runner images from ghcr.io
concurrency:
  # Each push has a run of its own that nothing cancels, keyed by the branch as well as
  # the commit: a second push to main never cancels the run of the commit a release
  # tags.  A schedule or workflow_dispatch run of the same commit waits for that run
  # (a later one of the same commit replaces it in the queue).  A dispatch for named
  # units is its own group, so it never replaces or waits for the run behind the badge.
  group: release-check-${{ format('{0}-{1}-{2}', github.ref, github.sha, inputs.units) }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: "1"
  # The commit this one is judged against: main before the push (all zeros when the push made the
  # branch).  A schedule or a dispatch has none, and plans every part of every harness with a committed
  # proof or finding.
  EVENT_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      plan: ${{ steps.drafts.outputs.plan }}
      units: ${{ steps.plan.outputs.units }}
      full: ${{ steps.plan.outputs.full }}
      draft_legs: ${{ steps.drafts.outputs.draft_legs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # Every file but the proof libraries, as pr.yml's plan job takes them: proofs/<p>/<h>/lib/ is
          # most of the tree and nothing this job reads is under it.  The diff below reads the two
          # trees, not the worktree, so it still lists every changed path, one under lib/ included.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/proofs/*/*/lib/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet --require-hashes -r tools/oft/requirements.txt
      - name: plan
        id: plan
        env:
          UNITS: ${{ inputs.units }}
        run: |
          set -euo pipefail
          # Every harness with a committed proof or finding, each as the directory a change to it would
          # name; a tree may have either without the other.  This is what a full plan checks.
          : > "$RUNNER_TEMP/every.txt"
          if [ -d proofs ]; then
            find proofs -mindepth 4 -maxdepth 4 -name proof.yaml \
              | sed -E 's|^(proofs/[^/]+/[^/]+)/[^/]+/proof\.yaml$|\1/|' | sort -u >> "$RUNNER_TEMP/every.txt"
          fi
          if [ -d findings ]; then
            find findings -mindepth 4 -maxdepth 4 -name finding.yaml \
              | sed -E 's|^(findings/[^/]+/[^/]+)/[^/]+/finding\.yaml$|\1/|' | sort -u >> "$RUNNER_TEMP/every.txt"
          fi
          [ -s "$RUNNER_TEMP/every.txt" ] || { echo "::error::no committed proof or finding: nothing to check"; exit 1; }
          if [ -n "${UNITS:-}" ]; then
            [ "$GITHUB_REF" != refs/heads/main ] || { echo "::error::on main every harness is checked: the badge says so"; exit 1; }
            read -r -a units <<< "$UNITS"
            for u in "${units[@]}"; do
              grep -qxF -e "proofs/$u/" -e "findings/$u/" "$RUNNER_TEMP/every.txt" \
                || { echo "::error::$u has no committed proof or finding"; exit 1; }
            done
            for u in "${units[@]}"; do printf 'proofs/%s/\nfindings/%s/\n' "$u" "$u"; done \
              | grep -xF -f - "$RUNNER_TEMP/every.txt" > "$RUNNER_TEMP/named.txt"
            mv "$RUNNER_TEMP/named.txt" "$RUNNER_TEMP/every.txt"
          fi
          # the same harnesses as PROJECT/HARNESS, for `oft plan --units`
          sed -E 's|^[^/]+/([^/]+/[^/]+)/$|\1|' "$RUNNER_TEMP/every.txt" | sort -u > "$RUNNER_TEMP/units.txt"
          # The commit this one is judged against: main's tip before this push, which is the commit's
          # parent for a fast-forward and the tip it replaced for a force-push (whose own run checked
          # it).  Without one -- a schedule, a dispatch, or a push that made the branch -- every part is
          # planned.
          base="${EVENT_BASE:-}"
          case "$base" in 0000000000000000000000000000000000000000) base= ;; esac
          if [ -n "$base" ]; then
            # the checkout is one commit deep, so the base is fetched the same way; only the two trees
            # are read.  A base the repository no longer has (a force-push, a pruned commit) takes the
            # full plan rather than a wrong one.
            git cat-file -e "$base^{commit}" 2>/dev/null \
              || git fetch --no-tags --depth=1 origin "$base" 2>/dev/null \
              || { echo "::warning::$base is not in the repository: every part is planned"; base=; }
          fi
          # Which router: content keys when this commit's tools have them (`oft plan --store` comes with
          # tools/oft/keys.py), else the diff mapped onto harnesses, for a release line whose tools predate
          # them.  Both are this commit's own tools, which the check job runs.
          PYTHONPATH=tools python -m oft plan --help > "$RUNNER_TEMP/plan-help.txt"
          keyed=false
          if grep -q -- --store "$RUNNER_TEMP/plan-help.txt"; then keyed=true; fi
          full=true
          if [ -n "$base" ] && [ -z "${UNITS:-}" ]; then
            # --no-renames: a renamed file is its old path and its new one; with renames git lists only
            # the new.  core.quotePath=false: a name with a byte above 0x7f is listed as it is.  Every
            # grep of the list runs with LC_ALL=C, so that it reads bytes: under a UTF-8 locale GNU grep
            # drops a line that is not valid UTF-8 ("binary file matches") and plans as if it were not
            # there.  The dune filter reads bytes too, and splits on newlines alone.
            git -c core.quotePath=false diff --no-renames --name-only "$base" HEAD > "$RUNNER_TEMP/diff.txt"
            echo "changed paths: $(wc -l < "$RUNNER_TEMP/diff.txt")"
            if [ "$keyed" = true ]; then
              # What no content key holds, so that a change to it takes the full plan: tools/, the checker
              # the check job copies and runs (keys.py holds one tools/ id, which is the same on both
              # sides of a comparison, so no key can tell this change); a .gitattributes, since a rule of
              # one aimed at tools/ changes the bytes the checker is checked out as, and the keys hold the
              # attributes of the keyed paths only; toolchain/, whose Dockerfiles build the
              # images a check runs in; .github/actions/, whose place-drafts the check job runs.  A
              # path git still quotes ('"', '\' or a control character in its name) cannot be read by
              # this pattern, and takes the full plan too.  .github/workflows/ is NOT here: a change to a
              # workflow plans no proof, since pr.yml's run of the same push lints the tree and runs the
              # tools' tests, which are what such a change can break.
              if LC_ALL=C grep -qE '^(toolchain/|tools/|\.github/actions/|")|(^|/)\.gitattributes$' "$RUNNER_TEMP/diff.txt"; then
                echo "a change under toolchain/, tools/ or .github/actions/, or a .gitattributes: every part is planned"
              else
                full=false
              fi
            else
              # A dune file dune reads for any build, which could declare a theory a build finds before the
              # installed one (dune looks in the workspace first).  The generated ones cannot: each names
              # only its own unit's theories, and `oft lint` holds them to their rendering.  Which ones are
              # generated is tools/oft/paths.py's to say (is_gen, the `gen` rows, whose placeholders refuse
              # a segment such as bin/ or lib/ that is not a name); a pattern here would be wider.  Every
              # other dune file is hand-written, so it is FULL.
              dune=$({ LC_ALL=C grep -E '(^|/)(dune|dune-project|dune-workspace|dune-file)$' "$RUNNER_TEMP/diff.txt" \
                       || [ $? -eq 1 ]; } \
                     | PYTHONPATH=tools python -c 'import sys
          from oft import paths
          names = [b.decode("utf-8", "surrogateescape") for b in sys.stdin.buffer.read().split(b"\n") if b]
          sys.stdout.buffer.write(b" ".join(n.encode("utf-8", "surrogateescape") for n in names if not paths.is_gen(n)))')
              # FULL: what every harness reads, so that a change to it re-checks every one.  theories/,
              # toolchain/, dune-project, a .gitattributes and a quoted path are `oft plan`'s own full
              # rules (tools/oft/check.py, plan).  The rest mark no harness in `oft plan`, so they are
              # named here: tools/, the checker the check job copies out of the tree and runs;
              # .github/actions/, whose place-drafts the check job runs; a hand-written dune file; and a
              # release.yaml that names another checker or runner image, the images every check runs in.
              # (`oft check` also reads the rest of release.yaml through the facts' rules, which can only
              # turn a pass into a failure, and pr.yml's lint runs those rules on every push.)
              if LC_ALL=C grep -qE '^(theories/|toolchain/|tools/|\.github/actions/|dune-project$|")|(^|/)\.gitattributes$' \
                   "$RUNNER_TEMP/diff.txt"; then
                echo "a change every harness reads (theories/, toolchain/, tools/, .github/actions/, dune-project, .gitattributes)"
              elif [ -n "${dune// /}" ]; then
                echo "a hand-written dune file, which dune reads for any build: $dune"
              elif LC_ALL=C grep -qxF release.yaml "$RUNNER_TEMP/diff.txt" && ! python - "$base" <<'PY'
          import subprocess, sys
          import yaml
          KEYS = (("images", "checker"), ("images", "runner"))
          def images(text):
              """(checker, runner) as release.yaml names them, or None when it cannot be read: a file that
              cannot be parsed, or that lacks either key, counts as another image."""
              try:
                  data = yaml.safe_load(text)
              except yaml.YAMLError:
                  return None
              out = []
              for key in KEYS:
                  at = data
                  for k in key:
                      if not isinstance(at, dict) or k not in at:
                          return None
                      at = at[k]
                  out.append(str(at))
              return out
          base = subprocess.run(["git", "show", "%s:release.yaml" % sys.argv[1]], capture_output=True, text=True)
          with open("release.yaml", encoding="utf-8") as f:
              head = f.read()
          was = images(base.stdout) if base.returncode == 0 else None
          sys.exit(0 if was is not None and was == images(head) else 1)
          PY
              then
                echo "release.yaml names another checker or runner image"
              else
                full=false
              fi
            fi
          fi
          # 256 jobs, the matrix limit: oft plan deals units to jobs round-robin by name, blind to how long each
          # takes, and at 32 jobs it put cgif/cgif_rgb_fuzzer (188 min) and openssl/hashtable (120 min) in one
          # job, close to the 6 hours a GitHub-hosted job cannot exceed.  max-parallel (the check job) is unchanged.
          if [ "$keyed" = true ]; then
            args=(--units "$RUNNER_TEMP/units.txt" --max-jobs 256)
            if [ "$full" = false ]; then
              # Content keys (tools/oft/keys.py): a part is checked when the key of what its check reads
              # differs from its key at the base.  --pr-kind release and --tools HEAD name what the check
              # job runs: this commit's own statements, and the tools it copies out of the tree it checks
              # (the base's are the same bytes here, since a change under tools/ took the full plan above).
              # No record of passes is read (--store): a pass of an earlier push credits nothing.
              args+=(--base "$base" --pr-kind release --tools HEAD)
            fi
            PYTHONPATH=tools python -m oft plan "${args[@]}" > "$RUNNER_TEMP/plan.json"
          else
            if [ "$full" = true ]; then
              cp -- "$RUNNER_TEMP/every.txt" "$RUNNER_TEMP/changed.txt"
            else
              # A project's own generated files, which no check reads: its README.md and its .opam file
              # (a proof re-renders the README, so every proof commit carries one).  `oft plan` reads any
              # path `projects/<p>/<file>` as every harness of <p>, so without this a one-proof commit
              # would re-check its whole project.
              # A harness.yaml is the other way round: `oft plan` marks only its own harness, but
              # `oft fetch <p>` checks the project's archive against the builds of every harness of <p>
              # (tools/oft/fetch.py), so it is read by every check of the project and is planned as
              # projects/<p>/project.yaml is.
              { LC_ALL=C grep -vE '^projects/[^/]+/(README\.md|[^/]+\.opam)$' "$RUNNER_TEMP/diff.txt" || [ $? -eq 1 ]; } \
                | LC_ALL=C sed -E 's|^(projects/[^/]+)/[^/]+/harness\.yaml$|\1/project.yaml|' > "$RUNNER_TEMP/reach-changed.txt"
              PYTHONPATH=tools python -m oft plan --changed "$RUNNER_TEMP/reach-changed.txt" --max-jobs 256 \
                > "$RUNNER_TEMP/reach.json"
              # The harnesses this change reaches that have a committed proof or finding.  A diff plan
              # never names one the full plan would not: `oft plan` maps a changed projects/<p>/ file onto
              # every harness of <p>, published build or not, and this workflow is about what is committed.
              jq -r '.units[]' "$RUNNER_TEMP/reach.json" \
                | awk '{ printf "proofs/%s/\nfindings/%s/\n", $0, $0 }' > "$RUNNER_TEMP/reached.txt"
              : > "$RUNNER_TEMP/changed.txt"
              if [ -s "$RUNNER_TEMP/reached.txt" ]; then
                { grep -xF -f "$RUNNER_TEMP/reached.txt" "$RUNNER_TEMP/every.txt" || [ $? -eq 1 ]; } \
                  > "$RUNNER_TEMP/changed.txt"
              fi
            fi
            PYTHONPATH=tools python -m oft plan --changed "$RUNNER_TEMP/changed.txt" --max-jobs 256 > "$RUNNER_TEMP/plan.json"
          fi
          n="$(jq '.units | length' "$RUNNER_TEMP/plan.json")"
          if [ "$full" = true ] && [ "$n" -eq 0 ]; then
            echo "::error::the committed proofs and findings name no harness to check"; exit 1
          fi
          # the plan output is written by the next step, with each group's draft binaries in its entry
          { echo "units=$n"
            echo "full=$full"; } >> "$GITHUB_OUTPUT"
          { if [ "$full" = true ]; then echo "### every harness with a committed proof or finding: $n"
            else echo "### harnesses this commit changes: $n"; fi
            jq -r '.units[]' "$RUNNER_TEMP/plan.json"
            # a content-keyed plan says why each part is or is not checked; an older plan has no parts
            if jq -e 'has("parts")' "$RUNNER_TEMP/plan.json" > /dev/null; then
              echo "### parts checked, and why"
              jq -r '.parts[] | select(.check) | "- \(.unit) \(.part): \(.why)"' "$RUNNER_TEMP/plan.json"
              echo "### parts not checked: $(jq '[.parts[] | select(.check | not)] | length' "$RUNNER_TEMP/plan.json")"
              jq -r '[.parts[] | select(.check | not) | .why] | group_by(.) | .[] | "- \(.[0]): \(length)"' \
                "$RUNNER_TEMP/plan.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: for each group of the plan, its binaries in a release this read-only token cannot see (a draft)
        id: drafts
        # a local action resolves in the workspace (`./`): the checkout of this workflow's own commit
        uses: ./.github/actions/plan-drafts
        with:
          plan-file: ${{ runner.temp }}/plan.json
          tools: ${{ github.workspace }}/tools
          root: ${{ github.workspace }}

  # Each leg a call of fetch-drafts.yml, which GitHub runs from this workflow's own commit; a called workflow runs with
  # the token the calling job grants, here contents: write and nothing else.
  fetch-drafts:
    needs: plan
    if: needs.plan.outputs.draft_legs != '[]'
    name: fetch-drafts ${{ matrix.leg.index }}
    permissions:
      contents: write   # the only permission with which the workflow's token sees a draft release; nothing is written
    strategy:
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.draft_legs) }}
    uses: ./.github/workflows/fetch-drafts.yml
    with:
      pins: ${{ toJSON(matrix.leg.pins) }}

  check:
    needs: [plan, fetch-drafts]
    # fetch-drafts is skipped when no planned binary is a draft, and a job whose need was skipped is skipped too unless
    # its condition says otherwise: run when fetch-drafts passed or had nothing to do, never when it failed or was
    # cancelled.  A plan that names no harness (a commit that changes nothing a check reads) runs no check job at all,
    # and release-check says so.
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.units != '0'
      && (needs.fetch-drafts.result == 'success' || needs.fetch-drafts.result == 'skipped')
    name: check ${{ matrix.job.index }}
    # the proof runner and its limit: pr.yml's check job says how to change them
    runs-on: ${{ vars.PROOF_RUNNER || 'ubuntu-24.04-16core' }}
    timeout-minutes: ${{ fromJSON(vars.PROOF_TIMEOUT_MINUTES || '360') }}
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.plan) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: work
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: the tools' dependencies (PyYAML, idna), hash-pinned
        run: |
          set -euo pipefail
          python -m pip install --quiet --require-hashes -r work/tools/oft/requirements.txt
          python -m pip install --quiet --require-hashes --target "$RUNNER_TEMP/pydeps" -r work/tools/oft/requirements.txt
      - name: the tools, copied out of the tree they check
        run: cp -r -- work/tools "$RUNNER_TEMP/tools"
      - name: cache keys
        id: keys
        env:
          UNITS: ${{ matrix.job.units }}
          PROJECTS: ${{ matrix.job.projects }}
          FINDINGS: ${{ matrix.job.findings }}
        run: |
          set -euo pipefail
          read -r -a units <<< "$UNITS"
          bash "$RUNNER_TEMP/tools/oft/ci/cache-key.sh" work/release.yaml "${units[@]}" >> "$GITHUB_OUTPUT"
          read -r -a projects <<< "$PROJECTS"
          read -r -a finding_units <<< "$FINDINGS"
          read -r -a finding_projects <<< "$(printf '%s\n' "${finding_units[@]%%/*}" | sort -u | tr '\n' ' ')"
          # the assets this job fetches, named by their pinned SHA-256: the binaries and the unpatched binaries the
          # findings run on, which check-units.sh keeps in the same directory
          {
            if [ "${#projects[@]}" -gt 0 ]; then
              PYTHONPATH="$RUNNER_TEMP/tools" python -m oft --root work fetch --list "${projects[@]}"
            fi
            if [ "${#finding_projects[@]}" -gt 0 ]; then
              PYTHONPATH="$RUNNER_TEMP/tools" python -m oft --root work fetch --findings --list "${finding_projects[@]}"
            fi
          } | awk '$2 ~ /-bin\.tar\.zst$/ {print $3}' | sort > "$RUNNER_TEMP/asset-shas.txt"
          [ -s "$RUNNER_TEMP/asset-shas.txt" ] || { echo "::error::no binary asset listed for: $PROJECTS $FINDINGS"; exit 1; }
          echo "assets=$(sha256sum < "$RUNNER_TEMP/asset-shas.txt" | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - name: the release assets, by their pinned SHA-256
        id: assets
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/assets
          key: release-check-assets-${{ steps.keys.outputs.assets }}
      # Only the archives this group's projects pin in a draft, from this group's plan entry, each from its own
      # artifact, laid over what the cache restored (.github/actions/place-drafts, from work: this workflow's own
      # commit).
      - name: the draft binaries this group needs, which fetch-drafts checked and this job's read-only token cannot download
        if: join(matrix.job.drafts, ',') != ''
        uses: ./work/.github/actions/place-drafts
        with:
          drafts: ${{ toJSON(matrix.job.drafts) }}
          assets: ${{ runner.temp }}/assets
      - name: dune's cache, from earlier runs
        # Off, and it stays off (OSSV-218).  Measured 27 October 02:22Z: a valid Statements.vo of different statements,
        # put in a filled cache under the same key, made doctored proofs pass check-units.sh.  dune restores
        # files/<digest> without hashing the bytes again (ocaml/dune 72f6fefe, src/dune_cache/shared.ml:313-319,
        # 329-348), and the kernel does not check a compiled file again when a proof loads it.  Hashing the restored
        # files would not catch a rewritten metadata entry, and verifying by rebuilding saves nothing.
        if: false
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/dune-cache
          key: ${{ steps.keys.outputs.key }}
          restore-keys: ${{ steps.keys.outputs.restore }}
      - name: sign in to ghcr.io, where the pinned images are (needed while their packages are private)
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: check
        env:
          WORK: ${{ github.workspace }}/work
          TOOLS: ${{ runner.temp }}/tools
          UNITS: ${{ matrix.job.check_units }}
          PROOF_UNITS: ${{ toJSON(matrix.job.proof_units) }}  # JSON: check-units.sh refuses null, a plan without it
          PROJECTS: ${{ matrix.job.projects }}
          CX_UNITS: ${{ matrix.job.counterexamples }}
          FINDINGS: ${{ matrix.job.findings }}
          ASSETS: ${{ runner.temp }}/assets
          PYDEPS: ${{ runner.temp }}/pydeps
          CACHE: ${{ runner.temp }}/dune-cache
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/tools/oft/ci/check-units.sh"
      # Saved only by a push to main or a maintainer's workflow_dispatch: this workflow has no pull_request trigger,
      # and a dispatch on another branch saves into that branch's scope, which main cannot restore. Never by a job
      # that read a draft.
      - name: keep dune's cache
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && join(matrix.job.drafts, ',') == ''
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/dune-cache
          key: ${{ steps.keys.outputs.key }}
      - name: keep the release assets
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.assets.outputs.cache-hit != 'true'
          && join(matrix.job.drafts, ',') == ''
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/assets
          key: release-check-assets-${{ steps.keys.outputs.assets }}

  release-check:
    needs: [plan, fetch-drafts, check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every job green, and every planned harness checked
        env:
          UNITS: ${{ needs.plan.outputs.units }}
          FULL: ${{ needs.plan.outputs.full }}
          DRAFTS_LISTED: ${{ needs.plan.outputs.draft_legs != '[]' }}
          PLAN_RESULT: ${{ needs.plan.result }}
          DRAFTS_RESULT: ${{ needs.fetch-drafts.result }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          set -euo pipefail
          [ "$PLAN_RESULT" = success ] || { echo "::error::the plan failed: nothing was checked"; exit 1; }
          if [ "$DRAFTS_LISTED" = true ]; then
            [ "$DRAFTS_RESULT" = success ] || { echo "::error::fetching the draft binaries failed or did not run"; exit 1; }
          else
            [ "$DRAFTS_RESULT" = skipped ] || { echo "::error::no draft binary listed, yet fetch-drafts ran"; exit 1; }
          fi
          # A full plan says every committed proof and finding; a tree that names none is not a release tree.
          if [ "$FULL" = true ] && [ "${UNITS:-0}" -eq 0 ]; then
            echo "::error::no harness with a committed proof or finding was checked"; exit 1
          fi
          if [ "${UNITS:-0}" -gt 0 ]; then
            [ "$CHECK_RESULT" = success ] || { echo "::error::a check failed or did not run"; exit 1; }
          else
            # a skipped job reports success, so this job, not the matrix, says that nothing ran
            [ "$CHECK_RESULT" = skipped ] || { echo "::error::no harness planned, yet check ran"; exit 1; }
          fi
          echo "harnesses checked: ${UNITS:-0} (full plan: ${FULL:-unknown})"
