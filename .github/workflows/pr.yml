            github.workspace }}/reviewed-oft-3/tools:${{ github.workspace }}/reviewed-oft-4/tools:${{
            github.workspace }}/reviewed-oft-5/tools:${{ github.workspace }}/reviewed-oft-6/tools:${{
            github.workspace }}/reviewed-oft-7/tools:${{ github.workspace }}/reviewed-oft-8/tools:${{
            github.workspace }}/reviewed-oft-9/tools:${{ github.workspace }}/reviewed-oft-10/tools:${{
            github.workspace }}/reviewed-oft-11/tools:${{ github.workspace }}/reviewed-oft-12/tools:${{
            github.workspace }}/reviewed-oft-13/tools:${{ github.workspace }}/reviewed-oft-14/tools:${{
            github.workspace }}/reviewed-oft-15/tools
        run: python -m unittest discover -s tools/publish/tests

  # Each leg a call of fetch-drafts.yml, which GitHub runs from this workflow's own commit (for a pull request, its merge
  # commit: the boundary is in the header); a called workflow runs with the token the calling job grants, here contents:
  # write and nothing else.  It waits for lint: a draft binary is downloaded, and kept as an artifact, only for facts
  # that lint accepted (no GPL binary without its source).
  fetch-drafts:
    needs: [plan, lint]
    # as the tests job: !cancelled() and plan's and lint's own results, not the default success(), which a skipped
    # queue_run ancestor (every event but a push the queue checked) would make false and so skip this job; and only
    # for check, which the hold step holds back on a draft or without the label `check`, and which never runs for the
    # tree the base pins with a deferred check, nor for a merge queue group or a pull request checked on a VM
    # (`checked_elsewhere`, the plan job's elsewhere step)
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success'
      && needs.plan.outputs.draft_legs != '[]' && needs.plan.outputs.hold == 'none'
      && needs.plan.outputs.checked_elsewhere != 'true' }}
    name: fetch-drafts ${{ matrix.leg.index }}
    permissions:
      contents: write   # the only permission with which the workflow's token sees a draft release; nothing is written
    strategy:
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.draft_legs) }}
    uses: ./.github/workflows/fetch-drafts.yml
    with:
      pins: ${{ toJSON(matrix.leg.pins) }}

  check:
    # the change's proofs are compiled here: only after lint has accepted the paths and the proof text it changes.
    # A change that is not a release is checked on a worktree of the base with only this change's proofs,
    # counterexamples and findings in it (their folders in either layout: the step below), so its plan names only the
    # harnesses whose files under those it changes: for every other harness this job would compile the base's bytes a
    # second time.  A release pull request, a push to main and a merge queue group bring their own facts: plan reads
    # them by the release rules (every harness the change reaches) and this job checks them on the change's own tree.
    # fetch-drafts is skipped when no group has a draft, and a job whose need was skipped is skipped too unless its
    # condition says otherwise: run when fetch-drafts passed or had nothing to do, never when it failed, was cancelled
    # or was skipped because lint failed.  As the tests job: !cancelled() and plan's and lint's own results (a failed
    # plan sets no units, and '' != '0' would start this job with no matrix).  Never for the tree the base pins with a
    # deferred check: its check of record is outside this workflow (the plan step says why).  Never, either, for a
    # merge queue group or a pull request whose every pull request was already checked on a VM and whose change can
    # move no verdict (`checked_elsewhere`, the plan job's elsewhere step): those checks would compile the same proofs
    # for the same answer.
    needs: [plan, lint, fetch-drafts]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success'
      && needs.plan.outputs.units != '0' && needs.plan.outputs.hold == 'none'
      && needs.plan.outputs.checked_elsewhere != 'true'
      && (needs.fetch-drafts.result == 'success'
      || (needs.fetch-drafts.result == 'skipped' && needs.plan.outputs.draft_legs == '[]')) }}
    name: check ${{ matrix.job.index }}
    # a proof check peaks at 14.5-19.4 GiB on 16 cores: the 16-core/64 GB GitHub-hosted larger runner.  360 minutes
    # is the ceiling a GitHub-hosted job runs to, and it is also the merge queue's window: a group is checked like a
    # push to main and must report within 360 minutes of the group's creation, runner waits included, so a group
    # whose checks run longer leaves the queue unmerged.
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read   # the pinned checker and runner images from ghcr.io (the workflow's own, which this replaces)
      actions: write   # the merge queue group's watch: `gh run cancel` of this run once its group is gone
    strategy:
      fail-fast: false
      # the plan's --max-jobs 20 (the plan step says why not more), all at once
      max-parallel: 20
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.plan) }}
    steps:
      # The merge queue group's watch, the same step as the lint job's (the concurrency comment says why)
      - name: cancel this run once its merge queue group is gone
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          EVERY: "120"
          CONFIRM: "10"
        run: |
          set -euo pipefail
          # In the background for the rest of the job, whose end stops it (the runner stops a job's leftover
          # processes).  It reads the branch over git's own protocol, not the REST API, so it spends none of the
          # token's API budget; with the token in a header, as tools/oft/ci/facts-review-gather passes it, never in a
          # URL or an argument; from RUNNER_TEMP, outside every checkout, whose persisted header would be a second one.
          cat > "$RUNNER_TEMP/group-watch" <<'EOF'
          #!/bin/bash
          set -uo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_TERMINAL_PROMPT=0
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          cd "$RUNNER_TEMP" || exit 1
          # 2 is git ls-remote --exit-code's answer for a branch that does not exist (measured: 0 for a live group's
          # branch, 2 for a dropped group's, 128 without a usable token); any other failure is no answer
          gone() {
            local rc=0
            git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF" > /dev/null 2>&1 || rc=$?
            [ "$rc" -eq 2 ]
          }
          while :; do
            if gone && sleep "$CONFIRM" && gone; then
              echo "$(date -u +%FT%TZ) $GITHUB_REF does not exist, twice $CONFIRM s apart: the queue dropped this group, so run $GITHUB_RUN_ID is cancelled"
              gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
              exit
            fi
            sleep "$EVERY"
          done
          EOF
          chmod +x "$RUNNER_TEMP/group-watch"
          setsid "$RUNNER_TEMP/group-watch" >> "$RUNNER_TEMP/group-watch.log" 2>&1 < /dev/null &
          echo "watching $GITHUB_REF every $EVERY s: this run is cancelled once that branch is gone"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
      - name: statements from the base; proofs, counterexamples and findings from this change
        id: work
        run: |
          set -euo pipefail
          trap 'df -h "$GITHUB_WORKSPACE"' EXIT
          base="${{ needs.plan.outputs.base }}"
          git -C head fetch --no-tags --depth=1 origin "$base"
          git -C head worktree add --detach "$GITHUB_WORKSPACE/base" "$base"
          if [ "$KIND" = release ]; then
            # a release pull request brings new facts; they were checked against the base's rendering
            echo "work=$GITHUB_WORKSPACE/head" >> "$GITHUB_OUTPUT"
          else
            # This change's proofs, counterexamples and findings replace the base's, in either layout: each folder
            # proofs/, counterexamples/, findings/, projects/<p>/<h>/proofs/, projects/<p>/<h>/counterexamples/ and
            # projects/<p>/<h>/findings/, and each projects/<p>/unpatched.yaml, that head or base has.  What the change
            # deleted is deleted.  Nothing else under projects/ is copied: the statements stay the base's.
            # The next step writes the tree's generated files, and a link would carry a write out of the tree; a link on
            # the way to a folder under projects/ would have this copy take what it points at.
            if [ -e head/projects ] || [ -L head/projects ]; then
              links="$(find head/projects -maxdepth 2 -type l)"
              [ -z "$links" ] || { echo "::error::symbolic links on the way to the change's folders: $links"; exit 1; }
            fi
            shopt -s nullglob
            declare -A roots=()
            for side in head base; do
              for r in "$side"/{proofs,counterexamples,findings} "$side"/projects/*/*/{proofs,counterexamples,findings} \
                       "$side"/projects/*/unpatched.yaml; do
                if [ -e "$r" ] || [ -L "$r" ]; then roots["${r#"$side"/}"]=1; fi
              done
            done
            for r in "${!roots[@]}"; do
              if [ -e "head/$r" ] || [ -L "head/$r" ]; then
                links="$(find "head/$r" -type l)"
                [ -z "$links" ] || { echo "::error::symbolic links in $r: $links"; exit 1; }
              fi
              rm -rf -- "base/$r"
              if [ -e "head/$r" ]; then
                mkdir -p -- "$(dirname -- "base/$r")"
                cp -a -- "head/$r" "base/$r"
              fi
            done
            echo "work=$GITHUB_WORKSPACE/base" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: the tools' dependencies (PyYAML, idna), hash-pinned, for this runner and for the containers
        run: |
          set -euo pipefail
          python -m pip install --quiet --require-hashes -r base/tools/oft/requirements.txt
          python -m pip install --quiet --require-hashes --target "$RUNNER_TEMP/pydeps" -r base/tools/oft/requirements.txt
      # the host and the check's containers run these tools, from outside the tree they check
      - name: the tools, copied out of the tree they check
        # the base's, except where the plan step measured that they cannot read this tree's facts at all
        run: cp -r -- "${{ needs.plan.outputs.tools }}/tools" "$RUNNER_TEMP/tools"
      # Every generated file of that tree, rendered by the base's tools from the base's facts and this change's proofs.
      # dune-project defines each project's proofs package, and a project's first proofs bring one that the base's
      # dune-project lacks, so without this dune stops at the first proof's dune file.
      - name: the generated files of that tree, by the base's tools
        if: env.KIND != 'release'
        run: PYTHONPATH="$RUNNER_TEMP/tools" python -m oft --root base generate
      - name: sign in to ghcr.io, where the pinned images are (needed while their packages are private)
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # Only the archives this group's projects pin in a draft, from this group's plan entry, each from its own
      # artifact, into ASSETS. The action is the base's copy, as at plan; the tools the steps above ran are the ones
      # the plan job named, which for the change the base pins are that change's own.
      - name: the draft binaries this group needs, which fetch-drafts checked and this job's read-only token cannot download
        if: join(matrix.job.drafts, ',') != ''
        uses: ./base/.github/actions/place-drafts
        with:
          drafts: ${{ toJSON(matrix.job.drafts) }}
          assets: ${{ runner.temp }}/assets
      - name: check
        env:
          WORK: ${{ steps.work.outputs.work }}
          TOOLS: ${{ runner.temp }}/tools
          UNITS: ${{ matrix.job.check_units }}
          # as JSON, so that a plan without the field (null) is told from one whose job has no proof (""): check-units.sh
          # refuses null
          PROOF_UNITS: ${{ toJSON(matrix.job.proof_units) }}
          PROJECTS: ${{ matrix.job.projects }}
          CX_UNITS: ${{ matrix.job.counterexamples }}
          FINDINGS: ${{ matrix.job.findings }}
          CPUS: ${{ matrix.job.cpus }}
          ASSETS: ${{ runner.temp }}/assets
          PYDEPS: ${{ runner.temp }}/pydeps
          GH_TOKEN: ${{ github.token }}
          CHECK_LOGS: ${{ runner.temp }}/check-logs
        run: |
          set -euo pipefail
          # oft check keeps each build's dune and rocq logs in its temporary folder (oft-check-*), and a failed build's
          # message names only that log ("does not compile (see PATH)"), which went with the container.  So the check runs
          # through a docker of this step's: a `docker run` that mounts a writable /work (a unit's view) gets
          # CHECK_LOGS/tmp, mounted at /oft-check-logs, as its temporary folder, and when that container exits, every file
          # there but the logs (*.log) is removed; any other call goes to docker as it is.  check-units.sh is not changed
          # for this: it is the checker (keys.NOT_THE_CHECKER), whose ids are in every unit's key.
          : "${CHECK_LOGS:?}"
          rm -rf -- "$CHECK_LOGS" "$CHECK_LOGS.bin"
          mkdir -p -- "$CHECK_LOGS/tmp" "$CHECK_LOGS.bin"
          CHECK_LOGS_DOCKER="$(command -v docker)" || { echo "::error::no docker on PATH"; exit 1; }
          export CHECK_LOGS_DOCKER
          cat > "$CHECK_LOGS.bin/docker" <<'EOF'
          #!/bin/bash
          : "${CHECK_LOGS:?}" "${CHECK_LOGS_DOCKER:?}"
          if [ "${1:-}" = run ]; then
            prev=
            for a in "$@"; do
              if [ "$prev" = -v ] && [[ "$a" == *:/work ]]; then
                shift
                rc=0
                "$CHECK_LOGS_DOCKER" run -v "$CHECK_LOGS/tmp:/oft-check-logs" -e TMPDIR=/oft-check-logs "$@" || rc=$?
                find "$CHECK_LOGS/tmp" -type f ! -name '*.log' -delete
                find "$CHECK_LOGS/tmp" -mindepth 1 -type d -empty -delete
                exit "$rc"
              fi
              prev=$a
            done
          fi
          exec "$CHECK_LOGS_DOCKER" "$@"
          EOF
          chmod +x "$CHECK_LOGS.bin/docker"
          rc=0
          PATH="$CHECK_LOGS.bin:$PATH" bash "$TOOLS/oft/ci/check-units.sh" 2>&1 | tee "$CHECK_LOGS/check-units.log" || rc=$?
          if [ "$rc" -ne 0 ]; then
            # The Rocq error can sit 140k lines up a 362k-line dune log.  Of each log a failure names (`(see PATH)`), or,
            # when none it names is here, of each log that holds an `Error` line: the first 40 `File ..., line N` and
            # `Error` blocks, with 5 lines of context, as the stream's check-pod tool prints them; 8,000 bytes in all.
            # A Rocq error is a `File "...", line N, characters ...:` line and an `Error: ...` line under it, and a dune
            # log holds many warnings of the same `File` form: in a proof library's log on the check runner, warnings
            # filled the 8,000 bytes 32,000 lines before its one error.  So in a log that holds an `Error` line, the
            # first 40 of those lines are printed, each with the 6 lines above it (its `File` line among them) and the 5
            # below; a log with none gets the check-pod tool's `File` and `Error` lines.
            logs=()
            while IFS= read -r rel; do
              [ -f "$CHECK_LOGS/tmp/$rel" ] && logs+=("$CHECK_LOGS/tmp/$rel")
            done < <(grep -oE '\(see /oft-check-logs/[^)]+\)' "$CHECK_LOGS/check-units.log" \
                       | sed -E 's|^\(see /oft-check-logs/||; s|\)$||' | awk '!seen[$0]++' || true)
            if [ "${#logs[@]}" -eq 0 ]; then
              mapfile -t logs < <(grep -rlE --include='*.log' '^Error' -- "$CHECK_LOGS/tmp" | sort || true)
            fi
            for f in "${logs[@]}"; do
              echo "== the first errors of ${f#"$CHECK_LOGS/tmp/"} ($(wc -l < "$f") lines):"
              if grep -qE '^Error' -- "$f"; then
                grep -nE -m 40 -B 6 -A 5 '^Error' -- "$f" || true
              else
                grep -nE -m 40 -C 5 '^File .*, line [0-9]+|^Error' -- "$f" || true
              fi
            done > "$CHECK_LOGS/errors.txt"
            echo "== the first errors of the logs the failures name; the whole logs are this job's artifact check-logs-*"
            head -c 8000 -- "$CHECK_LOGS/errors.txt"
            size="$(wc -c < "$CHECK_LOGS/errors.txt")"
            [ "$size" -le 8000 ] || printf '\n== cut at 8000 of %d bytes\n' "$size"
          fi
          exit "$rc"
      # also when the job is cancelled, as GitHub cancels one that reaches timeout-minutes: the check step is then
      # stopped inside a container, whose other temporary files are still there, so only the logs are taken
      - name: oft check's logs, when the check failed or was stopped
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: check-logs-${{ matrix.job.index }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/check-logs/**/*.log
            ${{ runner.temp }}/check-logs/errors.txt
          if-no-files-found: ignore
          retention-days: 30
      # what the merge queue group's watch saw, also when it cancelled this run
      - name: the merge queue group's watch, its log
        if: always() && github.event_name == 'merge_group'
        run: cat -- "$RUNNER_TEMP/group-watch.log" 2> /dev/null || true

  controls:
    # the change's own tests/check.sh and dune files: only after lint has accepted the paths it changes
    needs: [plan, lint]
    # as the tests job: !cancelled() and plan's and lint's own results (that job says why)
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success'
      && needs.plan.outputs.controls == 'true' }}
    # Disk: on a private repository's ubuntu-24.04 runner, pulling the checker image beside the tree ran out of disk
    # ('no space left on device' while registering its layers); on the public repository the same job fits.  The
    # 4-core larger runner has 150 GB (this job took a median 7.2 minutes on 16 cores over 24-28 October).
    runs-on: ubuntu-24.04-4core
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          persist-credentials: false   # the change's code runs here, and this job fetches nothing more
      - name: the checker image release.yaml pins, by digest (fail closed)
        id: image
        env:
          IMG: ${{ needs.plan.outputs.checker }}
        run: |
          set -euo pipefail
          [[ "$IMG" =~ ^ghcr\.io/theorem-labs/oss-fuzz-theorems-checker@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::release.yaml must name the checker image by digest in images.checker, got '$IMG'"; exit 1; }
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
      - name: sign in to ghcr.io, where the pinned images are
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: positive controls pass, negative controls are refused (tests/check.sh)
        run: |
          set -euo pipefail
          docker pull --quiet "${{ steps.image.outputs.image }}"
          docker run --rm --network none -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE/head:/work" -w /work "${{ steps.image.outputs.image }}" \
            bash -c 'dune build --root . @theories/default @tests/default && ./tests/check.sh'

  stream_tools:
    # The OSS Verify stream's operational tools (dev/stream/README.md), which the boxes run and no check job opens:
    # their own check, over the change's own code, so only after lint has accepted the paths it changes.  It deploys
    # nothing: a box takes a merged commit by itself, through `ossv-tools deploy`.
    needs: [plan, lint]
    # as the tests job: !cancelled() and plan's and lint's own results (that job says why)
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success'
      && needs.plan.outputs.stream_tools == 'true' }}
    # A pull request's new push cancels this job's run, as the workflow's own group does for the run; a push to main
    # and a merge queue group are keyed by the branch and the commit, and nothing cancels them.  The group differs
    # from the workflow's, which this run already holds.
    concurrency:
      group: stream-tools-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    # 45, not 30: the bin/ and lane/ tests step below adds about ten minutes (Dispatch issue OSSV-276).
    timeout-minutes: 45
    permissions:
      # The lazy blob fetches of the blobless checkout below, against a private repository.  The baselines the
      # checker reads -- each revision of the import's record (dev/stream/manifest.d/, and MANIFEST.tsv before it)
      # for each commit that wrote a row, `git show
      # <commit>:./<path>` for each file whose bytes drifted from its row -- are not in that clone, and each one
      # is fetched when it is asked for.  This is all the job may do: it reads this repository and nothing else.
      contents: read
    env:
      # A fetch with no usable credential must fail, not wait.  Without this, git with no terminal asks an askpass
      # helper and then the terminal, and the job sits there: three local runs of the check over an
      # unauthenticated promisor clone were killed at 900 s, 500 s and 420 s where the same run takes 210 s
      # (the round 3 review of pull request 496, F3-1).  A job that fails names the blob it could not read; a job
      # that hangs names nothing and spends the 30 minutes above.
      GIT_TERMINAL_PROMPT: "0"
      # The two trees the lane/tools tests read in the proofs clone below (NS_TEST_REPO), named by commit and not by
      # branch, so that a run reads the same bytes whatever the branches do (Dispatch issue OSSV-276).  Both are in
      # main's history, so main keeps them fetchable: NS_TEST_OLD d5def76244e7, main's head on 2026-11-03 before part 2
      # of the rename (the zlib/checksum_fuzzer unit in layout L2, an oft that reads no
      # namespace), and NS_TEST_T1 c06521233121, part 2's rename commit (pull request 617, merged as f9ec0f61e551),
      # whose oft reads release.yaml's namespace.  The tests default to the same two commits.
      NS_TEST_OLD: d5def76244e7c36f51d2f952027a8ffd105d5126
      NS_TEST_T1: c0652123312159143d06a319f74559a50eab2143
    steps:
      # The checker reads an imported file against the bytes it was imported with: the history of
      # manifest.d/, and of MANIFEST.tsv before it, for the commit that wrote the file's row and the path the tools tree had at it, then
      # `git show <commit>:<path>` for the file there (dev/stream/src/ossv/tools_check.py).  That blob is in git
      # whether or not the box the bytes came off, or the VM that ran the import, can still be reached, which is
      # why this is the baseline; one commit deep there is no row history to read and the run fails naming the
      # file.  So this job needs the whole history OF THIS BRANCH, and of nothing else.
      #
      # `fetch-depth: 0` is not that: actions/checkout then fetches +refs/heads/*, every branch of the
      # repository.  This one is 11.5 GB (`gh api repos/$GITHUB_REPOSITORY --jq .size`, 11,764,990 KB) over
      # 26,090 branches (`git ls-remote --heads`), most of them `cold/*` lane snapshots, and `filter: blob:none`
      # does not save it: the commits and trees of 26,090 branches are themselves gigabytes.  Three runs of this
      # job on pull request 581 died with `System.IO.IOException: No space left on device` in the runner's own
      # _diag writer, while `tests` (16 min) and `lint` (16 min) passed on the same pool.
      #
      # So: check out one commit, then deepen THIS COMMIT alone, naming it in the refspec as the ledger step of
      # the check job does (`git -C head fetch ... origin "$BASE" "$(git -C head rev-parse HEAD)"`, above).  A
      # bare `git fetch --unshallow` is not that either: actions/checkout configures the default
      # `+refs/heads/*:refs/remotes/origin/*` on the remote it adds, so the bare form walks every branch, and in
      # run 41288971566 it printed 26,265 `[new branch]` lines (pull request 581, round 1, F2).
      #
      # And it checks out THREE directories, not the tree: the working tree of this repository is 251,126 files,
      # and writing it is what filled the runner in the run after the one above (`cannot create directory at
      # 'projects/spirv-tools/.../provenance': No space left on device`, in actions/checkout itself).  This job
      # reads dev/stream/ and nothing else, except that dev/stream/tests/test_repo_checks.py reads
      # .github/workflows/pr.yml -- these very lines -- and tools/oft/lint.py (LINKS_ALLOWED, which the
      # checker's LANE_MIRROR must equal), and either read would drop its check in silence where the file
      # is not there.  So the cone is those three; tools/oft is 121 files, 2.8 MB.  The checker's baselines
      # are objects, read by `git show`, and need no file in the working tree.
      #
      # The filter makes this a promisor clone, so the checker's `git show` reads go to the remote and need a
      # token: the clone keeps the one the checkout fetched with, and `contents: read` above is the whole of
      # what it can do.  One blob per commit that wrote a MANIFEST.tsv row (29 on this branch), one per manifest.d/ entry the record's history holds, and one per
      # imported file whose bytes differ from its row (39 on this branch, none in a change that imports
      # nothing).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          # the token the lazy blob fetches need.  The change's own code runs in this job, so it can use that
          # token -- with contents: read, on the repository the change is already in, and the plan job above runs
          # this same code with contents: read and pull-requests: read.
          persist-credentials: true
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            dev/stream
            .github
            tools/oft
      - name: this commit's whole history, and no other branch's
        working-directory: head
        run: |
          set -euo pipefail
          git fetch --filter=blob:none --no-tags --unshallow origin "$(git rev-parse HEAD)"
          # A shallow clone here would make every baseline read fail by name rather than be read, so the run must
          # not go on with one: the history of manifest.d/ and of MANIFEST.tsv is what names the commit each row was
          # written at, and the path the tools tree had there.
          [ "$(git rev-parse --is-shallow-repository)" = false ] || {
            echo "::error::the clone is still shallow: no import-record history to read baselines against"
            exit 1; }
          echo "history: $(git rev-list --count HEAD) commit(s), of which"\
               "$(git rev-list --count HEAD -- dev/stream/manifest.d dev/stream/MANIFEST.tsv stream/MANIFEST.tsv)"\
               "wrote a row of the import's record"
          # main squash-merges, so a merge queue group's commit has main as its only parent and none of the history
          # the rows were written in. That history is the tag's (dev/stream/HISTORY_ROOT, docs/import.md), fetched
          # here as commits and trees only. A fetch that fails is not this step's verdict: where the history is
          # needed and the tag is not here, the checker fails naming the tag (tools_check.history_starts).
          tag=refs/tags/ossv/stream-tools-history
          git fetch --filter=blob:none --no-tags origin "+$tag:$tag" ||
            echo "::warning::$tag could not be fetched; the check fails by name if it needs it"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: ruff, pytest, uv and shellcheck, which the check and the tests need, pinned and hashed
        run: |
          set -euo pipefail
          # This job's verdict is whatever these tools say, so they are pinned by version and by the hash of the
          # file pip installs.  Unpinned, a release that renames a message or adds a rule turns a red tree green
          # or a green tree red with no commit here: the pull request that added this job records one such case,
          # where `ruff format --check` was read for a phrase ruff 0.17.3 no longer prints.  `--only-binary`
          # keeps pip to the wheels those hashes name.
          #
          # The versions and hashes are NOT written here.  dev/stream/uv.lock is what resolves this package's
          # environment, so the list the job installs is a group of dev/stream/pyproject.toml (`ci`) exported
          # from that lock.  Written out here instead, the list is a second copy of the lock, and the copy
          # drifts: it pinned pytest 8.4.2 while the lock resolved 9.2.0, a major apart, under a comment
          # claiming the two agreed (the quality review of pull request 496, round 5).  Raise a version with
          # `uv lock --upgrade-package <name>` in dev/stream and this job takes it with no edit.
          #
          # uv itself is the one pin this file writes, because uv is what reads the lock and so cannot come out
          # of it: it resolves this repository's dependencies rather than being one of them.  It is installed
          # for its own sake too -- uv builds the environment a box runs from (src/ossv/tools.py,
          # install_package), and without it a deploy falls back to `python3 -m venv` and pip and resolves
          # afresh; tests/test_ossv_tools.py takes the same branch, so a job without uv proves only the
          # fallback.  The hash is the manylinux x86_64 wheel, which is what a GitHub runner takes.
          cat > "$RUNNER_TEMP/uv-requirement.txt" <<'UV_REQUIREMENT'
          uv==0.13.6 \
              --hash=sha256:22759b8895e1103578de6fb4cd27e94b4399d021023378d29f01333717751fba
          UV_REQUIREMENT
          python -m pip install --quiet --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/uv-requirement.txt"
          # `--locked`: refuse to re-resolve AND fail when the lock no longer matches pyproject.toml, so a `ci`
          # group changed without `uv lock` fails the job instead of quietly installing the old list.  `--frozen`
          # alone is only the first half: measured, an unlocked `ci` dependency exports the stale set and exits 0,
          # while `--locked` exits 2 with "The lockfile at uv.lock needs to be updated" (496, round 5.2, R5-3).
          uv export --project head/dev/stream --locked --only-group ci --no-emit-project \
            --output-file "$RUNNER_TEMP/stream-tools-requirements.txt"
          python -m pip install --quiet --require-hashes --only-binary=:all: \
            -r "$RUNNER_TEMP/stream-tools-requirements.txt"
          # ubuntu-24.04 carries shellcheck; install it where a runner image does not, rather than check less
          command -v shellcheck > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          ruff --version && shellcheck --version && uv --version && python -m pytest --version
      # The paths under dev/stream/ this change touches, and the lines where the plan job's reach step knows them: a
      # `dev/stream/<path>` row, or a `dev/stream/<path>:<start>-<end>` row per hunk.  The checker reads an imported
      # file only where this change wrote it, so the hunks are what make a tool this pull request rewrites answer for
      # the lines it rewrote; without them the measured debt could never fall (dev/stream/src/ossv/tools_check.py).
      # This job runs only when that list names a path, so an artifact that is missing fails here, never reads as
      # "everything".
      - name: the paths under dev/stream/ this change touches, from the plan job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: stream-changed
          path: ${{ runner.temp }}/stream-changed
      - name: the stream tools' check
        working-directory: head
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/stream-changed/stream-changed.txt"
          echo "the change touches $(grep -c . "$changed" || true) path(s) under dev/stream/"
          ./dev/stream/bin/ossv-tools-check --require-tools --changed-paths "$changed"
      # !cancelled(): a failure of the checker above must not hide this answer, and this step reads nothing the checker
      # writes.  The two were one `set -e` script until run 41359875763 (pull request 682): the checker failed on 254
      # findings of its own, and the tests, which no run on this branch had yet reached, did not run either.  One red
      # with one cause hid a check with another purpose.  The job still fails when the checker fails -- a failed step
      # fails the job whatever runs after it, and `required` reads the job's result (stream_tools=true needs
      # `success`) -- so this shows both answers and lets neither one excuse the other.  It does read what the install
      # step above put there: without pytest and the `ci` group the run fails on its imports, not on the tree.
      - name: the stream tools' tests
        if: ${{ !cancelled() }}
        working-directory: head
        run: python -m pytest dev/stream/tests
      # The proofs clone the lane/tools tests of the namespace rename read (NS_TEST_REPO): test_combine_rewrite,
      # test_merge_pr_checkeronly, test_ns_imagetools and test_oft_calls read NS_TEST_OLD (and test_oft_calls
      # NS_TEST_T1, both in the job's env above); test_ns_generators reads hub commit 10ae79ead9 (zreloc.DONOR_COMMIT),
      # test_axiom_diff commit 8d1244e48efc (OFT_COMMIT).  Without the clone those cases skip and test nothing.
      #
      # It is not the head checkout above: the tests read other commits, and refs added to head are refs the checker
      # would see.  Four commits at depth 1, trees only (15 MB), then in one fetch the blobs of the paths the tests
      # read (981 blobs).  A blob not in that list is still fetched when a test asks for it, one at a time, with the
      # token the checkout keeps.  The tests run `git archive --worktree-attributes`: plain `git archive REV -- PATHS`
      # reads attributes from an index of REV's whole tree and so fetched every blob of it, 2.5 GB, in a local run.
      # Measured locally with this clone and no credential (so no lazy fetch could happen): every case ran and passed,
      # test_combine_rewrite in 226 s, the other six files in 7 to 34 s each, and .git stayed at 15 MB.
      - name: a proofs clone of the four commits the lane/tools tests read
        if: ${{ !cancelled() }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: proofs
          ref: ${{ env.NS_TEST_OLD }}
          persist-credentials: true
          fetch-depth: 1
          filter: blob:none
          # one file in the working tree, the root's: the tests read commits, not files
          sparse-checkout: /release.yaml
          sparse-checkout-cone-mode: false
      - name: the other three commits, and the blobs the tests read
        if: ${{ !cancelled() }}
        working-directory: proofs
        run: |
          set -euo pipefail
          hub=10ae79ead9f8846eae27df0e4d2ee867a22e37aa   # test_ns_generators: zreloc.DONOR_COMMIT
          oft=8d1244e48efce2f4240a1fb7c78f519bb7743a68   # test_axiom_diff: OFT_COMMIT
          git fetch --filter=blob:none --no-tags --depth=1 origin "$NS_TEST_T1" "$hub" "$oft"
          { git ls-tree -r "$NS_TEST_OLD" -- release.yaml dune-project dune dune-file dune-workspace theories \
              toolchain projects/zlib/project.yaml projects/zlib/checksum_fuzzer tools
            git ls-tree -r "$NS_TEST_T1" -- tools
            git ls-tree -r "$hub" -- release.yaml proofs/zlib/checksum_fuzzer/lib
            git ls-tree -r "$oft" -- tools/oft
          } | awk '$2 == "blob" {print $3}' | sort -u > "$RUNNER_TEMP/proofs-blobs.txt"
          echo "blobs the tests read: $(wc -l < "$RUNNER_TEMP/proofs-blobs.txt")"
          git fetch --no-tags --no-write-fetch-head --stdin origin < "$RUNNER_TEMP/proofs-blobs.txt"
          du -sh .git
      # The test files outside dev/stream/tests: bin/ and lane/ hold about a hundred, which nothing ran until
      # Dispatch issue OSSV-276, and bin/test_ossv_vm_delete_gate.py failed 23 of 24 on main after two ossv-vm changes
      # (df5625836d, abc7236f9b) that nothing saw.  dev/stream/tests/outside_tests.tsv names every one of them and says
      # how it runs, or why it does not; tests/test_outside_tests_listed.py, in the step above, fails when a file is in
      # no row.  A case that needs a lane VM or gcloud skips naming it (-rs prints each skip), and a file that collects
      # nothing fails.  NS_TEST_REPO is the proofs clone above; a revision it lacks fails the case, naming it.  One
      # process per file, three at a time.  !cancelled() for the reason above.
      - name: the bin/ and lane/ tests that need no lane VM
        if: ${{ !cancelled() }}
        working-directory: head
        env:
          NS_TEST_REPO: ${{ github.workspace }}/proofs
        run: python dev/stream/tests/run_outside_tests.py --jobs 3
      # The defect no test of dev/stream/tests can hold: an entry point whose import form works where its tests run
      # and not in the layout it is deployed into.  Commit eee39305fbc copied three files off the box whole, and the
      # box's copies use flat imports (`import ossv_dashboard_page`, `import ossv_statements`) of modules this
      # directory keeps in the package `ossv` (src/ossv/).  Every one of those files passed its tests, because pytest
      # reads `pythonpath = ["src"]` AND prepends each test file's own directory, so bin/ is on the path there; and
      # `python -m pytest dev/stream/tests` above never runs an entry point at all.  The breakage lives in the
      # relationship between an entry point's import form and the package root it runs from, so only an entry point
      # run from that root can see it.  `--help` is the cheapest thing that forces a file's module-level imports,
      # and on every one of the 11 subjects it touches nothing else: no subprocess, no socket, no file opened for
      # writing, about a quarter of a second a file.  That is measured, not assumed -- a `sys.addaudithook`
      # sitecustomize over `subprocess.Popen`, `socket.*`, `os.system` and write-mode `open` reports zero events
      # for all 11.  It was NOT true when this step was written: the stream-numbers tool scanned sys.argv by
      # hand with no parser on its default path, so `--help` fell into the measurement and made two `git fetch`
      # calls to github.com, a `git init --bare` and 12 git subprocesses in 12.5 s, under this very comment
      # saying it touched nothing (the review of pull request 667, finding 3d).  That tool now has a parser.
      # A subject that acquires such a path again must be given a line of its own here, never a skip; `timeout 60`
      # is what makes it fail the job rather than hang it, and note that a tool's own timeout may be longer than
      # 60 s (`statements.GIT_TIMEOUT` is 300), so the step's timeout is a backstop and not that tool's.
      #
      # !cancelled(): a failure of the checker or of pytest above must not hide this answer, and this step reads
      # nothing either of them writes.  It does read what the install step above put there: without `pyyaml` four
      # subjects fail on `import yaml` inside src/ossv/statements.py, so a failed install is read here as four
      # layout failures.  The install step is pinned and hashed and fails loudly of itself.
      - name: every entry point that names the ossv package runs in the deployed layout
        if: ${{ !cancelled() }}
        working-directory: head/dev/stream
        run: |
          set -euo pipefail
          # The subjects.  Two shapes name the package:
          #   * `from ossv import` / `import ossv` -- the second deliberately loose, because `import ossv_statements`
          #     is the flat form of exactly the same dependency and is the defect this step exists for;
          #   * `"ossv-launch"` -- the five launchers of pyproject.toml's [project.scripts], which hold no import of
          #     their own and reach the package through bin/ossv-launch (its header says why).
          # bin/ossv-launch itself is no subject and is skipped by neither rule: it is a bootstrap, not a tool, and
          # exits 1 by design when run by name.  The five launchers run it, so it is checked five times over.
          subjects="$RUNNER_TEMP/deployed-layout-subjects.txt"
          : > "$subjects"
          for f in bin/*; do
            [ -f "$f" ] || continue
            grep -q 'from ossv import\|import ossv\|"ossv-launch"' "$f" || continue
            printf '%s\n' "$f" >> "$subjects"
          done
          count=$(grep -c . "$subjects" || true)
          echo "entry points that name the ossv package: $count"
          sed 's/^/  /' "$subjects"
          # A loop over a glob that matches nothing exits 0 and reads exactly like a pass, so the subjects are
          # asserted before any of them runs.  Three bars, because the first two of them do not bite on their own:
          #
          #   * non-zero.  Cleared by a pattern that decayed to matching one file.
          #   * every name of [project.scripts].  This was the whole floor until the review of pull request 667
          #     (finding 3c) ran the case neither its author nor its reviewer had: a bin/ decayed to exactly the
          #     five launchers PASSES it, reporting "all 5 entry point(s) import" while exercising one import path
          #     five times -- the shape of failure this step exists to prevent.  It is kept because it names which
          #     half of the subject rule broke, and it is not the floor.
          #   * DEPLOYED_LAYOUT_SUBJECTS, below: what dev/stream/bin held when it was last measured.  This is the
          #     floor.  A subject that leaves the set fails the step, naming the number and this line, as the
          #     checker's own FLOORS table does for the tree it reads (src/ossv/tools_check.py).  Nothing moves it
          #     by itself: tests/test_repo_checks.py holds it EQUAL to the subjects the tree holds, so adding one
          #     and dropping one both end here, in a line a reader of the change sees.
          DEPLOYED_LAYOUT_SUBJECTS=16   # measured 2026-11-04 on dev/stream/bin by this step's own rule (with the find tool, the proof search index's record tool, and the gate service's tools and tests)
          [ "$count" -gt 0 ] || { echo "::error::no file of dev/stream/bin names the ossv package: this check ran nothing"; exit 1; }
          python - "$subjects" <<'DEPLOYED_LAYOUT_FLOOR'
          import sys, tomllib
          from pathlib import Path
          subjects = set(Path(sys.argv[1]).read_text(encoding="utf-8").split())
          scripts = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["scripts"]
          absent = sorted(n for n in scripts if f"bin/{n}" not in subjects)
          if absent:
              print(f"::error::[project.scripts] declares {len(scripts)} entry point(s) and this check did not "
                    f"collect {', '.join(absent)}: its subject rule no longer reaches the package's own launchers")
              raise SystemExit(1)
          print(f"all {len(scripts)} [project.scripts] launcher(s) are among the subjects")
          DEPLOYED_LAYOUT_FLOOR
          [ "$count" -ge "$DEPLOYED_LAYOUT_SUBJECTS" ] || {
            echo "::error::dev/stream/bin named the ossv package in $DEPLOYED_LAYOUT_SUBJECTS file(s) when this"\
                 "floor was measured and names it in $count now. A check that reads less than it was measured"\
                 "from reports less, so this is a failure and not a clean run. When bin/ changed on purpose,"\
                 "measure it again and write the new number in DEPLOYED_LAYOUT_SUBJECTS, in this step."
            exit 1; }
          echo "floor: $count subject(s), and this step was measured from $DEPLOYED_LAYOUT_SUBJECTS"
          # PYTHONPATH=src is the deployed layout: the package importable as `ossv`, and nothing of bin/ on the path
          # beyond the directory python itself adds for the script it runs.  `< /dev/null` because the loop's own
          # stdin is the worklist: a subject that read stdin would eat the subjects after it and the step would
          # report a short list as a pass.  None reads stdin today.
          failed=""
          while read -r f; do
            if PYTHONPATH=src timeout 60 python "$f" --help < /dev/null > /dev/null 2> "$RUNNER_TEMP/deployed-layout-err.txt"; then
              echo "ok    $f"
            else
              echo "::error::FAILS in the deployed layout: $f"
              sed 's/^/      /' "$RUNNER_TEMP/deployed-layout-err.txt"
              failed="$failed $f"
            fi
          done < "$subjects"
          [ -z "$failed" ] || { echo "::error::deployed layout:$failed"; exit 1; }
          echo "all $count entry point(s) import in the deployed layout"
  farm_tests:
    # The test files of dev/stream/bin/ that the stream_tools job leaves out (dev/stream/tests/outside_tests.tsv): the
    # farm runner's, whose one process takes over 900 s, and the N6 driver's.  Until this job nothing in CI ran them,
    # and authors ran the first by hand in 6 build-farm shards (pull request 1713).  The plan's reach step names the
    # legs, one {file, index, count} each, from its farm suites table (which says what each file reads, and why its
    # count): only the files whose paths, or this job, changed.  Every leg of a file collects the same cases, in the
    # file's order, and runs every count-th of them from its own index, so the legs together run each case exactly
    # once and no list of cases is kept anywhere to fall behind the file.
    name: farm_tests (${{ matrix.leg.file }}, ${{ matrix.leg.index }})
    needs: [plan, lint]
    # as the tests job: !cancelled() and plan's and lint's own results (that job says why)
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success'
      && needs.plan.outputs.farm_tests == 'true' }}
    strategy:
      # a failure in one leg must not cancel the others: each leg's answer is about other cases
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.farm_legs) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # dev/stream/ alone, one commit: the tests read their files of bin/, conftest.py and pyproject.toml, and no history
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: dev/stream
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: pytest, pinned and hashed, as the stream_tools job installs it
        run: |
          set -euo pipefail
          # the stream_tools job's install step says why uv is pinned here and everything else comes from
          # dev/stream/uv.lock's `ci` group, with --locked
          cat > "$RUNNER_TEMP/uv-requirement.txt" <<'UV_REQUIREMENT'
          uv==0.13.6 \
              --hash=sha256:22759b8895e1103578de6fb4cd27e94b4399d021023378d29f01333717751fba
          UV_REQUIREMENT
          python -m pip install --quiet --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/uv-requirement.txt"
          uv export --project dev/stream --locked --only-group ci --no-emit-project \
            --output-file "$RUNNER_TEMP/stream-tools-requirements.txt"
          python -m pip install --quiet --require-hashes --only-binary=:all: \
            -r "$RUNNER_TEMP/stream-tools-requirements.txt"
          python -m pytest --version
      # From dev/stream, as tests/run_outside_tests.py runs a pytest row, so conftest.py points every live-path default
      # at /nonexistent/, with a git identity (the N6 cases commit in scratch repositories, and a runner has none):
      # GitHub Actions' own bot's, whose noreply address is the one shape of address lint's private-data rule takes.
      # A collection that fails, or a leg left with no case, fails the leg; --durations=0 prints each case's time,
      # which is what the reach step's counts were measured from.
      - name: this leg's share of its file's tests
        working-directory: dev/stream
        env:
          FILE: ${{ matrix.leg.file }}
          LEG: ${{ matrix.leg.index }}
          LEGS: ${{ matrix.leg.count }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          [[ "$FILE" =~ ^test_[a-z0-9_]+\.py$ && -f "bin/$FILE" ]] || { echo "::error::no test file bin/$FILE"; exit 1; }
          pytest=(python -m pytest -p no:cacheprovider -o testpaths=)
          "${pytest[@]}" -q --collect-only "bin/$FILE" > "$RUNNER_TEMP/collected.txt"
          grep '::' "$RUNNER_TEMP/collected.txt" > "$RUNNER_TEMP/all.txt" || true
          awk -v leg="$LEG" -v legs="$LEGS" '(NR - 1) % legs == leg' "$RUNNER_TEMP/all.txt" > "$RUNNER_TEMP/leg.txt"
          echo "bin/$FILE, leg $LEG of $LEGS (from 0): $(grep -c . "$RUNNER_TEMP/leg.txt" || true) of $(grep -c . "$RUNNER_TEMP/all.txt" || true) case(s)"
          [ -s "$RUNNER_TEMP/leg.txt" ] || { echo "::error::leg $LEG of $LEGS has no case to run"; exit 1; }
          mapfile -t cases < "$RUNNER_TEMP/leg.txt"
          "${pytest[@]}" -q -rs --durations=0 "${cases[@]}"

  # Rule D11 (OSS Verify, OSSV-162): until the platform tag, and outside an announced re-key window, nothing that moves
  # keys.checker merges into main, since the checker's id is in every unit's key and a new one re-keys every unit
  # (on 2026-11-03 #605 and #602 moved it twice after OSSV-162 part 2, a894ad9d to aef8df57 to 05744fab).  So for a
  # pull request and a merge queue group this job computes three ids: keys.checker of the base by the base's tools,
  # and of this change's head twice, by the base's tools and by the change's own tools (the id its check jobs
  # record).  The base's tools judge the change, as everywhere in this file: a change supplies the code of checker()
  # and of what it imports, so its own tools could give the base's id for a tree whose checker moved; and every file
  # of that code is a checker file by the base's rule, so the base's tools see any change to it as a move.  It fails
  # when either head id differs from the base's and OSSV_REKEY_WINDOW is not exactly `open`: an absent variable is a
  # closed window.  The vars context does not say where a variable is set: it gives an environment's, else the
  # repository's, else the organization's, and this job names no environment, so an organization variable of that
  # name would open the window too where the repository has none; reading the repository's alone needs the REST
  # variables endpoint, which no GITHUB_TOKEN permission grants.  So the CI/CD lead sets it on the repository and no
  # organization variable takes that name.  The same rule holds for every head, a release/* one too.  It holds a
  # merge into main of this repository only: a pull request into another base, and theorem-labs/oss-verify-proofs,
  # whose checker moves only by releases cut here, get the ids and a notice.  It sees pull requests and merge queue
  # groups only: a push to main by a ruleset bypass skips it, as it skips every check of record.  All three ids are
  # in the job summary, equal or not.  It reads git objects and tools/oft alone, no tree beside them; it runs the
  # change's own code (its keys.py), so only after lint has accepted the change, as the tests job does, and a draft,
  # which lint skips, skips it too (required says when that passes).  required reads its result.
  rekey:
    needs: [plan, lint]
    # as the tests job: !cancelled() and plan's and lint's own results (that job says why)
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success'
      && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read   # the base commit, and the lazy blob fetches of the blobless checkouts below
    steps:
      # tools/oft alone, blobless: keys.checker lists tools/ from the commit's tree, and the import needs only oft
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          filter: blob:none
          sparse-checkout: tools/oft
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: the base's tools, beside this change
        id: base
        env:
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          set -euo pipefail
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the plan named no base commit ('$BASE')"; exit 1; }
          git -C head fetch --no-tags --depth=1 --filter=blob:none origin "$BASE"
          git -C head worktree add --no-checkout --detach "$GITHUB_WORKSPACE/base" "$BASE"
          git -C base sparse-checkout set --cone tools/oft
          git -C base checkout --detach "$BASE"
      - name: the tools' dependencies (PyYAML, idna), hash-pinned, from the base
        run: python -m pip install --quiet --require-hashes -r base/tools/oft/requirements.txt
      - name: keys.checker moves only in an announced re-key window (rule D11)
        id: rekey
        env:
          BASE: ${{ needs.plan.outputs.base }}
          # a pull request's base branch (empty for a merge queue group, which is main's)
          BASE_REF: ${{ github.base_ref }}
          # the CI/CD lead sets it to `open` on the repository for an announced re-key window, and back after it
          # (the header says why no organization variable may take the name)
          WINDOW: ${{ vars.OSSV_REKEY_WINDOW }}
        run: |
          set -euo pipefail
          # keys.checker of a commit of head/, by the tools at $1: one id of 64 hexadecimal characters, or a failure
          checker_of() {
            local out
            out=$(PYTHONPATH="$1" python -c 'import sys; from oft import keys
          print(keys.checker(sys.argv[1], sys.argv[2]))' head "$2") || return 1
            [[ "$out" =~ ^[0-9a-f]{64}$ ]] || return 1
            echo "$out"
          }
          head=$(git -C head rev-parse HEAD)
          from=$(checker_of base/tools "$BASE") ||
            { echo "::error::the base's tools could not compute keys.checker of the base $BASE"; exit 1; }
          to_base=$(checker_of base/tools "$head") ||
            { echo "::error::the base's tools could not compute keys.checker of this change's head $head"; exit 1; }
          to_own=$(checker_of head/tools "$head") ||
            { echo "::error::this change's tools could not compute keys.checker of its head $head"; exit 1; }
          echo "keys.checker of the base $BASE (the base's tools): $from"
          echo "keys.checker of this change $head (the base's tools): $to_base"
          echo "keys.checker of this change $head (its own tools): $to_own"
          { echo "### keys.checker (rule D11)"
            echo "- the base $BASE, by the base's tools: \`$from\`"
            echo "- this change $head, by the base's tools: \`$to_base\`"
            echo "- this change $head, by its own tools: \`$to_own\`"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$from" = "$to_base" ] && [ "$from" = "$to_own" ]; then
            echo "keys.checker is unchanged: this change re-keys no unit" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # the id a move goes to: the base's tools' reading first, since they judge the change
          to=$to_base
          [ "$to" != "$from" ] || to=$to_own
          moves="this change moves keys.checker from $from to $to (re-keys every unit)"
          if [ "$to_base" != "$to_own" ]; then
            echo "::warning::the base's tools and this change's own give its head different ids: $to_base and $to_own"
            echo "the base's tools and this change's own give its head different ids: $to_base and $to_own" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$GITHUB_REPOSITORY" = theorem-labs/oss-verify-proofs ] ||
             { [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$BASE_REF" != main ]; }; then
            echo "::notice::$moves; rule D11 holds a merge into main of the internal repository, and this is none"
            echo "$moves; rule D11 holds a merge into main of the internal repository, and this is none" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$WINDOW" = open ]; then
            echo "::notice::$moves; the re-key window is open (OSSV_REKEY_WINDOW=open)"
            echo "$moves; the re-key window is open (OSSV_REKEY_WINDOW=open)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          said="$moves; it can merge only in an announced re-key window (rule D11); ask the CI/CD lead"
          echo "::error::$said"
          echo "$said" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  prove:
    # The head's own facts are planned as a release in this job, so a change to a symbol fact alone or to a project's
    # own file alone reaches its units; never the long check, since the report reads only the two commits and their
    # symbol facts.  The verdict plan remains its own step: this report-only plan cannot fail required or main-gate.
    needs: plan
    # !cancelled() and plan's own result, not the default success(): plan's ancestor queue_run is skipped on every
    # pull request, and the default would skip this job with it (the tests job says the same)
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    # 40, not 30: over 2026-10-28 to 11-04 the longest of 105 successful prove jobs took 29.5 minutes (run
    # 41706023094), half a minute from a 30-minute limit; the next two took 18.7 and 18.1.
    timeout-minutes: 40
    permissions:
      contents: read   # the checkout and the base's commit
      checks: write    # the check run on the pull request's head
    steps:
      # the change's commit as git objects alone: no file of the change is read but by the base's tools, as data
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          filter: blob:none
          sparse-checkout: .github
      - name: the base branch's tools, which report on this change
        id: tools
        env:
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          set -euo pipefail
          git -C head fetch --no-tags --depth=1 --filter=blob:none origin "$BASE"
          git -C head worktree add --no-checkout --detach "$GITHUB_WORKSPACE/base" "$BASE"
          git -C base sparse-checkout set --cone tools/oft
          git -C base checkout --detach "$BASE"
          if [ -x base/tools/oft/ci/prove-pr ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "the base branch's tools have no tools/oft/ci/prove-pr: no report and no check"
          fi
      - if: steps.tools.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: the tools' dependencies (PyYAML, idna), hash-pinned, from the base
        if: steps.tools.outputs.run == 'true'
        run: python -m pip install --quiet --require-hashes -r base/tools/oft/requirements.txt
      - name: the units theorem prove reports on
        id: units
        if: steps.tools.outputs.run == 'true'
        env:
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          set -euo pipefail
          # The report plan reads the head's facts (release kind), with the base's tools.  It needs every fact but no
          # proof library, as the plan job's ordinary change checkout does.
          git -C head sparse-checkout set --no-cone '/*' '!/proofs/*/*/lib/' '!/projects/*/*/proofs/lib/'
          PYTHONPATH="$GITHUB_WORKSPACE/base/tools" python -m oft --root "$GITHUB_WORKSPACE/head" \
            plan --pr-kind release --base "$BASE" > "$RUNNER_TEMP/prove-plan.json"
          echo "unit_list=$(jq -r '.units | join(" ")' "$RUNNER_TEMP/prove-plan.json")" >> "$GITHUB_OUTPUT"

      - name: theorem prove, and the check on the pull request's head
        if: steps.tools.outputs.run == 'true'
        working-directory: base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ needs.plan.outputs.base }}
          # the merge commit the plan judged; the check goes on the pull request's head
          HEAD: ${{ github.sha }}
          SHA: ${{ github.event.pull_request.head.sha }}
          UNITS: ${{ steps.units.outputs.unit_list }}
        # The report is the head's data: no line of it may be a workflow command.
        run: |
          set -uo pipefail
          resume="$(openssl rand -hex 16)"
          echo "::stop-commands::$resume"
          code=0
          tools/oft/ci/prove-pr || code=$?
          echo "::$resume::"
          exit "$code"

  required:
    needs: [queue_run, plan, lint, tests, fetch-drafts, check, controls, stream_tools, rekey, farm_tests]
    # always: on a push whose jobs queue_run skipped, it collects queue_run's finding, the merge queue runs that passed
    # main-gate on the commits of this push, and names those runs (its step below)
    if: always()
    runs-on: ubuntu-24.04
    # the stale base steps of a pull request no merge queue checks again take a sparse checkout of this change and
    # fetch two trees of the base branch, which on this tree is about a minute
    timeout-minutes: 10
    permissions:
      # a check held for the label: the pull request's comments, for merge-pr.sh's evidence comment (GitHub's "List
      # issue comments" accepts this scope)
      pull-requests: read
      # the base branch's tip and the two trees the stale base step compares, and its checkout of this change
      contents: read
    steps:
      - name: a pull request into theorem-labs/oss-verify-proofs is a pull request into main
        if: github.repository == 'theorem-labs/oss-verify-proofs' && github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: '[ "$BASE" = main ] || { echo "::error::the base is $BASE: this repository takes pull requests into main"; exit 1; }'
      # Every job of this run read the base as it was when the run started: the first parent of the merge commit
      # GitHub built for it, refs/pull/<n>/merge.  The base's tools ran the plan, the lint and the check, the base's
      # facts were the statements each proof was checked against, and the base's copy of .github/actions/ ran inside
      # the jobs.  (This workflow is the merge commit's copy, as GitHub runs a pull request's workflow; a base change
      # to it is in the merge that lands and in every run after this one.)  When the base then takes such a change,
      # this run's green is about a base that is gone, and nothing re-checks it: a pull request into a branch with no
      # merge queue merges on the verdict of its own run (#438 passed its tools' tests on the base before #416 and
      # failed on the line after it).  So this step compares that base with the tip of the base branch now and fails
      # when they differ in a path the checks read (tools/oft/tests/stale_base.py says which, and why those).  A base
      # that moved only by another fuzz target's proofs, counterexamples or findings, or by the pages a merge
      # renders, passes.
      # A pull request that a merge queue checks again after this run (QUEUED in the last step: a pull request into
      # main, but on theorem-labs/oss-verify-proofs) skips these steps: the queue's group run judges it on the base as
      # it is then, with the base's tools of then.
      # The runner is the base's copy, like the tools every other judging step runs (the plan job's base step, whose
      # words are "nothing trusted to judge with"): a GitHub App can change tools/ with the Contents permission
      # alone, and this file only with the Workflows permission as well, so a change's own copy of the runner must
      # not decide whether that change may merge.  As with the shared actions, it must land on the base before the
      # step that calls it, and the step says so when it has not.
      - name: the change, and the base's copy of the runner that judges it
        if: >-
          github.event_name == 'pull_request'
          && (github.event.pull_request.base.ref != 'main' || github.repository == 'theorem-labs/oss-verify-proofs')
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          # the runner and the module it reads the change files from (tools/oft/layout.py); the diff it makes reads
          # the two trees, which it fetches with no blob
          filter: blob:none
          sparse-checkout: tools/oft
      - name: the base's tools, as the plan job takes them
        if: >-
          github.event_name == 'pull_request'
          && (github.event.pull_request.base.ref != 'main' || github.repository == 'theorem-labs/oss-verify-proofs')
        run: |
          set -euo pipefail
          # the first parent of the merge commit checked out, read as the plan job's base step reads it: a commit
          # names its parents even in a clone one commit deep, while `git rev-parse HEAD^1` there answers nothing
          # (.git/shallow hides them).  A HEAD with one parent is no merge commit and must not pass as one.
          read -r -a parents <<< "$(git -C head cat-file -p HEAD | sed -n 's/^parent //p' | tr '\n' ' ')"
          [ "${#parents[@]}" = 2 ] || {
            echo "::error::HEAD has ${#parents[@]} parent(s): not the merge commit GitHub builds for a pull request"; exit 1; }
          base="${parents[0]}"
          git -C head fetch --no-tags --depth=1 --filter=blob:none origin "$base"
          git -C head worktree add --no-checkout --detach "$GITHUB_WORKSPACE/base" "$base"
          git -C base sparse-checkout set --cone tools/oft
          git -C base checkout --detach "$base"
          [ -f base/tools/oft/tests/stale_base.py ] || {
            echo "::error::the base branch has no tools/oft/tests/stale_base.py: required runs the base's copy of the runner, so it must land on the base first"; exit 1; }
      - name: the base this run was built on is still the tip of the base branch
        if: >-
          github.event_name == 'pull_request'
          && (github.event.pull_request.base.ref != 'main' || github.repository == 'theorem-labs/oss-verify-proofs')
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          # what the plan's reach step answered: whether this run read every file of the tree
          PLANNED_TESTS: ${{ needs.plan.outputs.tests }}
          PLANNED_REPOSITORY_LINT: ${{ needs.plan.outputs.repository_lint }}
        run: |
          set -euo pipefail
          # A run that ran the tools' tests read every file of the tree (the whole-tree lint among them), so a move
          # of the base in any fuzz target's facts can change what it found; a run that did not read only its own
          # fuzz targets' facts.  Anything but a plain `false` from the plan is read as "it did" (a plan that
          # failed or answered nothing must not narrow the rule).
          whole=(--whole-tree)
          if [ "$PLANNED_TESTS" = false ] && [ "$PLANNED_REPOSITORY_LINT" = false ]; then whole=(); fi
          PYTHONPATH="$GITHUB_WORKSPACE/base/tools" python3 -m oft.tests.stale_base \
            --root head --repo "$GITHUB_REPOSITORY" --base-ref "$BASE_REF" "${whole[@]}"
      # A push whose jobs queue_run skipped: its commits' verdicts are the merge queue runs that checked each of them
      # against its own parent, and this step says which runs those are.  Nothing else ran here to collect.
      - name: a push the merge queue checked, by the merge queue runs of its commits
        if: needs.queue_run.outputs.checked == 'true'
        env:
          QUEUE_RESULT: ${{ needs.queue_run.result }}
          QUEUE_RUNS: ${{ needs.queue_run.outputs.runs }}
        run: |
          set -euo pipefail
          [ "$QUEUE_RESULT" = success ] || { echo "::error::queue_run did not succeed ($QUEUE_RESULT)"; exit 1; }
          [[ "$QUEUE_RUNS" =~ ^[0-9]+( [0-9]+)*$ ]] || { echo "::error::queue_run named no merge queue run ('$QUEUE_RUNS')"; exit 1; }
          for run in $QUEUE_RUNS; do
            echo "merge queue run $run passed main-gate on a commit of this push, made on that commit's parent"
            echo "a check of this push: merge queue run $run ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run)" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: every job green, and something checked when the plan named anything
        if: needs.queue_run.outputs.checked != 'true'
        env:
          DRAFTS_LISTED: ${{ needs.plan.outputs.draft_legs != '[]' }}
          FETCH_DRAFTS_RESULT: ${{ needs.fetch-drafts.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          TESTS: ${{ needs.plan.outputs.tests }}
          CONTROLS: ${{ needs.plan.outputs.controls }}
          REPOSITORY_LINT: ${{ needs.plan.outputs.repository_lint }}
          UNITS: ${{ needs.plan.outputs.units }}
          HOLD: ${{ needs.plan.outputs.hold }}
          # whether a merge queue checks this pull request after this run: a pull request into main, except on
          # theorem-labs/oss-verify-proofs, whose main merges with no queue (no other base has one)
          QUEUED: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
            && github.repository != 'theorem-labs/oss-verify-proofs' }}
          PLANNED_TOOLS: ${{ needs.plan.outputs.tools }}
          LINT_RESULT: ${{ needs.lint.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CONTROLS_RESULT: ${{ needs.controls.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          STREAM_TOOLS: ${{ needs.plan.outputs.stream_tools }}
          STREAM_TOOLS_RESULT: ${{ needs.stream_tools.result }}
          # of a matrix, the result of every leg together: success only when each leg succeeded
          FARM_TESTS: ${{ needs.plan.outputs.farm_tests }}
          FARM_TESTS_RESULT: ${{ needs.farm_tests.result }}
          # a check held for the label: merge-pr.sh's evidence comment on this pull request, for this head (below)
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VM_EVIDENCE_BY: sjawhar-agent[bot]
          # the parts this run planned and a check of record outside it checked: its note (below)
          CHECKED_ELSEWHERE: ${{ needs.plan.outputs.checked_elsewhere }}
          CHECKED_ELSEWHERE_NOTE: ${{ needs.plan.outputs.checked_elsewhere_note }}
        run: |
          set -euo pipefail
          [ "$PLAN_RESULT" = success ] || { echo "::error::the plan failed"; exit 1; }
          # The router's answers, each one it must give: an empty or other answer would read as "not needed" below and
          # pass a job that did not run, so it fails here.
          for answer in "tests=$TESTS" "controls=$CONTROLS" "repository_lint=$REPOSITORY_LINT" \
                        "checked_elsewhere=$CHECKED_ELSEWHERE" "stream_tools=$STREAM_TOOLS" "farm_tests=$FARM_TESTS"; do
            case "${answer#*=}" in true|false) ;; *)
              echo "::error::the plan answered ${answer%%=*} '${answer#*=}', neither true nor false"; exit 1 ;;
            esac
          done
          [[ "$UNITS" =~ ^[0-9]+$ ]] || { echo "::error::the plan answered units '$UNITS', not a count"; exit 1; }
          # which tools lint and check ran (the plan step's migration pin): the base's or, where the base pins it, this
          # change's
          case "$PLANNED_TOOLS" in base|head) ;; *)
            echo "::error::the plan answered tools '$PLANNED_TOOLS', neither base nor head"; exit 1 ;;
          esac
          case "$HOLD" in none|draft|label) ;; *)
            echo "::error::the plan answered hold '$HOLD', none of none, draft and label"; exit 1 ;;
          esac
          # the whole-tree lint test is one of the tools' tests: it cannot run when they do not
          [ "$REPOSITORY_LINT" = false ] || [ "$TESTS" = true ] || {
            echo "::error::the plan answered repository_lint true and tests false"; exit 1; }
          # A draft: lint did not run, nor any job after it (lint's `if:`, and the header's paragraph on the hold).  Each
          # must have been skipped.  As for a held check: into this repository's main the merge queue group, which a
          # draft cannot enter and which is never held, lints the change and runs every other job before it merges,
          # so this run passes and says so; into any other base nothing judges it after this run, so it fails until
          # the pull request is marked ready for review, which runs this workflow again in full.
          if [ "$HOLD" = draft ]; then
            for job in "lint=$LINT_RESULT" "tests=$TESTS_RESULT" "controls=$CONTROLS_RESULT" \
                       "stream_tools=$STREAM_TOOLS_RESULT" "farm_tests=$FARM_TESTS_RESULT" \
                       "fetch-drafts=$FETCH_DRAFTS_RESULT" "check=$CHECK_RESULT"; do
              [ "${job#*=}" = skipped ] || { echo "::error::a draft, yet ${job%%=*} ran (${job#*=})"; exit 1; }
            done
            if [ "$QUEUED" != true ]; then
              echo "::error::a draft: lint and the jobs after it did not run at this head; mark it ready for review"
              echo "a draft: lint and the jobs after it did not run at this head; mark it ready for review" \
                >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "lint skipped: a draft (the merge queue lints it and runs every other job; marking it ready for review runs them here)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$LINT_RESULT" = success ] || { echo "::error::lint failed"; exit 1; }
          if [ "$TESTS" = true ]; then
            [ "$TESTS_RESULT" = success ] || { echo "::error::the tools' tests failed or did not run"; exit 1; }
          else
            [ "$TESTS_RESULT" = skipped ] || { echo "::error::nothing the tools' tests read changed, yet they ran"; exit 1; }
          fi
          if [ "$DRAFTS_LISTED" = true ] && [ "$HOLD" = none ]; then
            [ "$FETCH_DRAFTS_RESULT" = success ] || { echo "::error::fetching the draft binaries failed or did not run"; exit 1; }
          else
            [ "$FETCH_DRAFTS_RESULT" = skipped ] || { echo "::error::no draft binary listed (or check held), yet fetch-drafts ran"; exit 1; }
          fi
          if [ "$CONTROLS" = true ]; then
            [ "$CONTROLS_RESULT" = success ] || { echo "::error::the controls failed or did not run"; exit 1; }
          else
            [ "$CONTROLS_RESULT" = skipped ] || { echo "::error::no input of the controls changed, yet they ran"; exit 1; }
          fi
          if [ "$STREAM_TOOLS" = true ]; then
            [ "$STREAM_TOOLS_RESULT" = success ] || {
              echo "::error::the stream tools' check failed or did not run"; exit 1; }
          else
            [ "$STREAM_TOOLS_RESULT" = skipped ] || {
              echo "::error::nothing under dev/stream/ changed, yet the stream tools' check ran"; exit 1; }
          fi
          if [ "$FARM_TESTS" = true ]; then
            [ "$FARM_TESTS_RESULT" = success ] || {
              echo "::error::the farm runner's tests failed or did not run"; exit 1; }
          else
            [ "$FARM_TESTS_RESULT" = skipped ] || {
              echo "::error::nothing the farm runner's tests read changed, yet they ran"; exit 1; }
          fi
          if [ "$CHECKED_ELSEWHERE" = true ]; then
            # The parts this run planned and did not check here, because a check of record outside it checked them
            # (the plan job's elsewhere step, which says what it measured): the tree the base pins with a deferred
            # check, whichever tools judged it, or a merge queue group or a pull request whose every pull request
            # was checked on a VM at a tree with these parts' keys.  Whatever the hold (a draft was answered above),
            # since a check of record answers for them, and with no check job and no fetch-drafts leg run: the plan
            # file is empty.
            [ "$CHECK_RESULT" = skipped ] || { echo "::error::the checks are of record elsewhere, yet check ran"; exit 1; }
            [ "$FETCH_DRAFTS_RESULT" = skipped ] || {
              echo "::error::the checks are of record elsewhere, yet fetch-drafts ran"; exit 1; }
            [ -n "$CHECKED_ELSEWHERE_NOTE" ] || {
              echo "::error::the checks are of record elsewhere, and the plan named no check of record"; exit 1; }
            echo "checks not run here: $UNITS harnesses planned; $CHECKED_ELSEWHERE_NOTE" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$UNITS" != 0 ] && [ "$HOLD" != none ]; then
            # check held: a draft, or no label `check` (the header says why)
            [ "$CHECK_RESULT" = skipped ] || { echo "::error::check was held ($HOLD), yet it ran"; exit 1; }
            why="$([ "$HOLD" = draft ] && echo "a draft" || echo "no label \`check\`")"
            if [ "$QUEUED" != true ]; then
              # no merge queue checks it after this run: it must not look green without its checks.  Held for the label
              # only (never a draft): the held check is accepted when merge-pr.sh's evidence comment is on this pull
              # request, posted by its App (user.type Bot), whose first line is exactly the marker for this head.  The
              # step checks that comment, not the VM check it reports.  A marker for another commit never counts; any
              # other comment, or comments that cannot be read, leave the failure below.
              if [ "$HOLD" = label ]; then
                VM_PR="$PR" VM_HEAD="$HEAD_SHA"
                # vm evidence
                # merge-pr.sh's VM evidence comment on pull request VM_PR for the commit VM_HEAD: posted by the App
                # (user.type Bot), its first line exactly `<!-- vm-evidence head=<VM_HEAD> mode=<pvc|xh|checklog> -->`,
                # and changed since by nobody but the App either (GitHub keeps every editor in userContentEdits, which only
                # GraphQL gives).  `said` becomes that comment's "(mode): <its url>", its node id, and one
                # `key <unit> <key>` line for each `<!-- vm-evidence-key unit=<project>/<harness> key=<64 hex> -->` line
                # after the marker in it, the unit's build key at the tree its check of record ran on.  Of the comments
                # that carry the marker the newest answers, since a later run of merge-pr.sh posts a later comment:
                # --slurp hands the whole list to one jq program, so `last` is the newest of every page, not of each;
                # the CLI refuses --slurp with its own --jq, so the pages go through jq here, with HEAD_SHA exported.
                # A marker for another commit, by anyone else, or not on the first line counts for nothing, and so does
                # a comment anyone else changed and a read that fails: `said` is empty then.  What is checked is the
                # comment, not the VM check it reports.
                # shellcheck disable=SC2016  # a jq program: $lines and $mode are jq's, not the shell's
                said="$(export HEAD_SHA="$VM_HEAD"
                  gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$VM_PR/comments?per_page=100" | jq -r '
                  [ .[][] | select(.user.login == env.VM_EVIDENCE_BY and .user.type == "Bot")
                    | (.body | split("\n")) as $lines
                    | first(("pvc", "xh", "checklog")
                            | select($lines[0] == "<!-- vm-evidence head=\(env.HEAD_SHA) mode=\(.) -->")) as $mode
                    | {mode: $mode, url: .html_url, node: .node_id,
                       keys: [$lines[1:][]
                              | capture("^<!-- vm-evidence-key unit=(?<unit>[^ ]+) key=(?<key>[0-9a-f]{64}) -->$")]}
                  ] | last // empty
                  | "(\(.mode)): \(.url)", "node \(.node)", (.keys[] | "key \(.unit) \(.key)")')" || said=
                if [ -n "$said" ]; then
                  # The comment's author and every editor of it are the App: GraphQL names an App `Bot` and gives its
                  # login without the `[bot]` REST appends, so the author must be a Bot whose login and `[bot]` is
                  # VM_EVIDENCE_BY and every editor a Bot of that same login.  An edit list that is no list, more edits
                  # than this one page holds, and a read that fails all count as a stranger; a read that fails says so
                  # with the error, since a token refused this field would otherwise look like a comment someone changed.
                  err="$(mktemp)"   # the read's stderr, apart from its answer: a warning on success must not change it
                  # shellcheck disable=SC2016  # a GraphQL query: $id is GraphQL's, not the shell's
                  strangers="$(gh api graphql -f query='query($id: ID!) { node(id: $id) { ... on IssueComment {
                      author { __typename login }
                      userContentEdits(first: 100) { totalCount nodes { editor { __typename login } } } } } }' \
                    -F id="$(sed -n 's/^node //p' <<< "$said" | head -n 1)" \
                    --jq '.data.node as $c | ($c.author.login // "") as $who
                          | [ (if $c.author.__typename == "Bot" and ($who + "[bot]") == env.VM_EVIDENCE_BY
                               then 0 else 1 end),
                              (if ($c.userContentEdits.nodes | type) == "array" then 0 else 1 end),
                              (if ($c.userContentEdits.totalCount // 0) > 100 then 1 else 0 end),
                              ([$c.userContentEdits.nodes[]?
                                | select(.editor.__typename != "Bot" or (.editor.login // "") != $who)] | length)
                           ] | add' 2> "$err")" \
                   || { echo "::warning::the editors of pull request $VM_PR's evidence comment cannot be read:"\
                          "$(tr '\r\n' '  ' < "$err")"; strangers=unread; }
                  rm -f "$err"
                  [ "$strangers" = 0 ] || said=
                fi
                # end of vm evidence
                evidence="${said%%$'\n'*}"
                if [ -n "$evidence" ]; then
                  echo "held check accepted on merge-pr.sh's VM evidence comment $evidence" | tee -a "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
              fi
              echo "::error::planned checks not run at this head ($why, $UNITS harnesses planned): add the label \`check\` and re-run all jobs"
              echo "planned checks not run at this head ($why, $UNITS harnesses planned): add the label \`check\` and re-run all jobs" \
                >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "checks skipped: $why ($UNITS harnesses planned; the merge queue checks them; add the label \`check\` and re-run all jobs to check them here)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$UNITS" != 0 ]; then
            [ "$CHECK_RESULT" = success ] || { echo "::error::a check failed or did not run"; exit 1; }
            echo "harnesses checked: $UNITS"
          else
            [ "$CHECK_RESULT" = skipped ] || { echo "::error::no harness planned, yet check ran"; exit 1; }
            echo "harnesses checked: $UNITS"
          fi
      # Rule D11: the rekey job's verdict, on a pull request and a merge queue group, the events it runs for (that job
      # says why).  A draft skips it with lint, and the step above already judged the draft: it passes only into a
      # main whose merge queue group, which runs rekey, is still to come.
      - name: keys.checker moved only in an announced re-key window (rule D11)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          REKEY_RESULT: ${{ needs.rekey.result }}
          HOLD: ${{ needs.plan.outputs.hold }}
        run: |
          set -euo pipefail
          [ "$REKEY_RESULT" = success ] && exit 0
          [ "$REKEY_RESULT" = skipped ] && [ "$HOLD" = draft ] && exit 0
          echo "::error::the re-key guard (job rekey, rule D11) did not pass ($REKEY_RESULT): its log says why"
          exit 1
      # Last, with no `if:`: it runs only once every step before it passed, so a failed job still shows as its own
      # failure first.  The plan's hold step read the label from the pull request as it was then (see the header); a
      # push and a merge queue group carry no label, and a push whose jobs queue_run skipped has no plan, so this
      # passes on each of them.
      - name: a pull request with the label do-not-merge does not pass
        env:
          DO_NOT_MERGE: ${{ needs.plan.outputs.do_not_merge }}
        run: |
          if [ "$DO_NOT_MERGE" = true ]; then
            echo "::error::this pull request has the label do-not-merge (a rehearsal or a pipeline test): remove the label, then re-run all jobs of this head's newest run, or push"
            exit 1
          fi

  # The status a main that merges through a merge queue requires, of each pull request into main, each queue group and
  # each push to main.  On a pull request into any other base it is skipped: required is that run's verdict, and a
  # main-gate that failed there for its base alone (on a pull request into another branch, where required passed)
  # made its red mean nothing.  A skipped job reports success, so the skipped job takes another name and leaves its
  # head no main-gate: a pull request made green against another branch and then retargeted at main (which starts no
  # run, see the header) must not carry that green into the merge queue, whose group runs as a release (KIND), where
  # lint's paths rules for a pull request's kind and the check on the base's statements are not applied.  GitHub names
  # a skipped job by its `name:` as written, unevaluated (github.com/orgs/community/discussions/13261), which is not
  # main-gate either.  Both conditions read the event name first: a merge queue group and a push have no pull_request
  # and so no base.ref (github.base_ref is empty on both), and they run main-gate.  GitHub's == ignores case, and the
  # base step does not, so a pull request into a branch named Main still fails here.
  main-gate:
    name: >-
      ${{ (github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'main') && 'main-gate'
      || 'main-gate (skipped: the base is not main)' }}
    needs: [required]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: required passed
        env:
          REQUIRED: ${{ needs.required.result }}
        run: '[ "$REQUIRED" = success ] || { echo "::error::required did not pass"; exit 1; }'
      - name: a pull request's base is main
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: '[ "$BASE" = main ] || { echo "::error::the base is $BASE, not main"; exit 1; }'
