          ref: ${{ steps.reviewed.outputs.ref14 }}
          path: reviewed-oft-14
          sparse-checkout: tools/oft
          persist-credentials: false
      - name: reviewed oft 15 of 15, for the publishing tools' tests
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ steps.reviewed.outputs.repo15 }}
          ref: ${{ steps.reviewed.outputs.ref15 }}
          path: reviewed-oft-15
          sparse-checkout: tools/oft
          persist-credentials: false
