# pr.yml: every pull request, every merge queue group and every push to main.  ledger.yml judges a push to a proofs/
# branch.
#
# The rules come from the base branch, never from the pull request.  The lint,
# the generator, the plan and the check all run from a worktree of the base, and the
# statements they check are the base's: a pull request contributes only its
# proofs, counterexamples and findings (proofs/, counterexamples/ and findings/, or
# in the per-project layout projects/<p>/<h>/proofs/, counterexamples/ and findings/
# and projects/<p>/unpatched.yaml) and, for a release pull request, its facts.  For
# any other pull request, the check renders the generated files of that tree again,
# with the base's tools.  One change is judged by the tools it
# brings instead, and only where the base itself names it: tools/oft/migration-pin.yaml,
# on the base, carries the digest of the approved change's tools/ and theories/, and the
# plan job compares it with this tree before anything of the change runs (see that step,
# and that file).  The same file may defer a proof check to a check of record outside
# this workflow, for the one tree it names, whichever tools judge that tree: then no
# check job runs, and required passes with 'checks not run here: ...' and names it.
# No repository secret is used, the untrusted compile runs in the checker image
# with no network, and no job but fetch-drafts has more than read access to the
# repository's contents.  lint and check may also cancel their own run (actions:
# write, for a merge queue group's watch: the concurrency comment below says why);
# the checker's containers have no network, so no token is of use there, and the
# boundary below holds for this permission as well.  A
# token with contents: read cannot see a draft release, and a release pull
# request's new binaries stay drafts until release.yml publishes them, which it
# does only once the publishing check has passed the tagged commit.  So fetch-drafts alone has
# contents: write; it checks out nothing and runs no script from the tree, only
# `gh release download` of the pins plan listed and a SHA-256 check of each.
# Its YAML is the pull request's own copy of fetch-drafts.yml, as this file is
# (GitHub reads a pull request's workflows from its merge commit).  That is the
# boundary: only a branch of this repository gets a write token, and its author
# already has write access; a pull request from a fork gets a read-only token,
# so fetch-drafts cannot read a draft for it, and plan says so.
# No job of this workflow saves a cache (nothing compiled is cached, and the release assets are cached only by
# release-check.yml, never from a job that read a draft), so a draft binary's bytes do not outlive the draft's one-day
# artifact that way.
# The artifact widens who can read a draft binary, for one day: a draft release
# is visible only with write access, an artifact to anyone who can read the
# repository, which for a public repository is anyone signed in to GitHub.
# That is accepted: the facts already publish each archive's SHA-256, a project
# held by its status pins no asset and a findings-<project> release holds only
# the project a finding holds back (tools/oft/rules.py), the publishing check
# outside this repository refuses any asset of a project it holds back, and the
# files are the ones the release is to publish; if publishing is refused, they
# were still readable for that day.
#
#   plan          the base, which tools judge this change (the pin, above), and the parts of harnesses to
#                 check (oft plan, from those tools, for this change's kind): each part whose content key
#                 (tools/oft/keys.py) differs from its key at the base (none for a push to main on
#                 theorem-labs/oss-verify-proofs, which release-check.yml checks); the
#                 planned binaries in a release that a read-only token cannot see (a draft), and which group
#                 needs each; whether the change can alter what `oft lint` finds when run with the change's own
#                 tools, whether it touches an input of the controls, whether it touches what the tools'
#                 tests read, and the paths under dev/stream/ it touches
#   lint          the repository's rules (tools/oft/README.md), from the tools the plan job named: every
#                 rule over every file of the change's tree for a pull request into a base other than main and
#                 for a push with no base to compare with (the base step says which); for a change into main (a
#                 pull request into main, a merge queue group, a push to main) the same, except that the
#                 per-file text rules read only the files the change touches (--changed-only), or every file
#                 when it touches a fact (but CHANGELOG.md), a finding's finding.yaml, a build record, a
#                 .gitattributes or tools/oft/lint-exceptions.yaml; the findings ledger over the change's history
#                 (oft ledger; the tip's whole history for a push with no base to compare with); where
#                 tools/publish/ exists (the internal repository), the base's name scan over the proof files the
#                 change adds or changes; generated files equal their rendering, except the shared ones
#                 (tools/oft/paths.py SHARED), which index.yml renders after the merge
#   tests         the tools' own tests, at this change, one process per test class
#                 (tools/oft/tests/parallel.py), when plan says the change touches tools/, .claude/skills/,
#                 .github/ or release.yaml (or runs in full: the reach step); their test of this whole
#                 repository under the change's tools only when plan says the change can alter what that finds
#   fetch-drafts  each draft binary once, checked against its pin, as an artifact of its own, after
#                 lint passed (skipped when there is none)
#   check         the planned parts in up to 20 jobs, 20 at once: fetch (a draft from its artifact), build,
#                 every proof through its wrapper with its assumptions against the allowlist,
#                 counterexamples, findings on the unpatched binaries.  A change that is not a release is
#                 checked on a worktree of the base that takes only the change's proofs, counterexamples and
#                 findings (in either layout), with its generated files rendered again by the base's tools,
#                 and the base's tools run the check, so only those three can change a key.
#   controls      tests/: positive controls pass and negative controls fail, when plan says the
#                 change touches what they read
#   stream_tools  dev/stream/, the OSS Verify stream's operational tools (dev/stream/README.md): their own check
#                 (the stream tools' own checker with --require-tools, over the paths under dev/stream/ this change
#                 touches, which plan found) and their tests, when plan says the change touches that directory
#                 and only then.  It deploys nothing: a box takes a merged commit itself.  dev/stream/ is in no
#                 part's key (keys.checker reads tools/ alone), so such a change plans no proof
#   rekey         rule D11, on a pull request and a merge queue group, after lint: keys.checker of the base (by
#                 its tools) and of the head (by the base's tools and by the change's own), all in the job summary;
#                 when a head id differs from the base's, a merge into main here fails unless the repository
#                 variable OSSV_REKEY_WINDOW is `open` (an announced re-key window; absent means closed)
#   farm_tests    the test files of dev/stream/bin/ that stream_tools leaves out: the farm runner's (one process takes
#                 over 900 s) and the N6 driver's, each split by test over its own legs of a matrix, for each file
#                 whose paths plan says the change touches (or all, when it touches this job), and only then
#   prove         a pull request's report, when the base's tools have tools/oft/ci/prove-pr: for each unit the plan
#                 names that has a symbol fact, `theorem prove` (its command, its report and its check run's page in
#                 the log) and the check `theorem/prove: <unit>` on the pull request's head, posted with this run's
#                 token (checks: write).  It waits for plan alone, and blocks nothing: no job waits for it and no rule
#                 requires its check.  A pull request from a fork gets a read-only token, so this job is skipped there
#   required      fails if anything failed, or if the plan named harnesses and none was checked, or named the
#                 controls, the stream tools' check or the farm runner's tests and they did not pass, or, on a
#                 pull request no merge queue checks again (into a base other than main, and into main on
#                 theorem-labs/oss-verify-proofs), if the base branch has moved, since this run was built, in a
#                 path the checks read from it (tools/oft/tests/stale_base.py); on
#                 theorem-labs/oss-verify-proofs, where it is the status main's ruleset requires, also when a
#                 pull request's base is not main
#   main-gate     the status a main that merges through a merge queue requires, of a pull request into main, of
#                 each queue group and of a push to main: required passed (skipped, under another name, on a
#                 pull request into any other base, where required is the verdict)
#   queue_run     a push to main only: the merge queue runs of this workflow that passed main-gate on the very
#                 commits pushed, each made on that commit's parent, if every commit has one (below)
#
# After queue_run (which a pull request and a merge queue group skip at once), plan runs first: it is the router, which
# decides once, for every job, the base the change is judged against, whether the change is routed by its paths, which
# tools judge it, and which jobs its paths reach; lint waits for it and takes its base.  check (which compiles the
# change's proofs), tests and controls (which run the change's own code: its tools' tests, its tests/check.sh)
# wait for lint as well: nothing from a pull request runs before lint has accepted it, except, for the change
# the base pins, the tools the pin names, which the plan job runs to count what they read of this tree and to
# plan it; every other code of a pull request waits for lint.  fetch-drafts waits for lint too, so a draft is downloaded only for facts lint
# accepted, and check waits for fetch-drafts when a group needs a draft.  This file runs as the change has it, as
# GitHub runs any pull request's workflows (a pull request from a fork gets a read-only token whatever it says), so
# a change to it needs a reviewer's eye before its run is trusted; the local actions it uses come from the base, as
# the tools do: a GitHub App can change .github/actions/ with the Contents permission alone, and this file only
# with the Workflows permission as well.  So a change to an action takes effect for the pull requests after it
# lands.  A push to main is decided by its own change, as every other run is (below), unless merge queue runs of
# this workflow already passed each commit it pushed, when the push reuses those runs instead (queue_run, below);
# release-check.yml, when enabled, checks on it what that push changes, and weekly.yml every committed proof
# and finding after each release.  On theorem-labs/oss-verify-proofs a push to main checks no harness, since
# release-check.yml checks there what that push changes, on that commit alone, and a second check of the same parts
# would say nothing more.  A merge queue group is the commit main becomes, and is checked as a push to main is in
# any other repository: its harnesses too.
#
# A main that takes commits through a merge queue moves, when a group passes, to the very commit that group's run
# tested: the same SHA (measured on one pull request: its merge queue run tested a commit, which main then
# became, and main's push run checked the same commit again for 77 billable minutes).  That merge queue run
# is that commit's CI, and it judged exactly that commit's change: a group commit's one parent is the queue's base.
# So when every commit the push brings, from main before the push to the pushed commit by one parent each, has a merge
# queue run of this workflow that passed main-gate on that commit and was made on that commit's parent (queue_run finds
# them all), the push run checks nothing again: queue_run skips plan, lint and every job after them, while required and
# main-gate still run, as they always do, and pass by naming those merge queue runs (required's step for it).  A queue
# that merges several groups in one push (the ruleset's max_entries_to_merge) brings one such commit per group, each on
# the one before it.  What this repository's CI says of such a commit is then queue_run's conditions alone: never
# loosen them.  Publishing is decided elsewhere: release.yml tags a commit only when the newest check run on exactly
# it of the publishing workflow (ossv-publish/checked) or, until the gate's publish path retires, of the gate
# (ossv-gate/publish), both by GitHub App 5447700, passed, which is evidence of its own and not a run of this
# workflow.  Any other push (one with a commit no merge queue run passed on its parent, as a push past the queue, or
# one to a main with no queue, as on theorem-labs/oss-verify-proofs) is checked by its own diff, as below; on
# theorem-labs/oss-verify-proofs its harnesses are left to release-check.yml (above).
#
# Every other run is decided by its own change: a pull request by the diff from its base, a merge queue group by the
# diff from the queue's base, and a push to main for which queue_run found no merge queue run by the diff from main
# before the push.  So such a push that changes only CHANGELOG.md plans no harness, runs neither the tools' tests nor
# the controls, and lints that one file by the per-file rules (and the tree by the rest).  The tools' tests and the
# controls run whatever the paths for a change to the workflows, a .gitattributes file or a path git quotes, and the
# tests' whole-tree lint for the last two; a change to the workflows alone leaves the tools the base's, whose lint the
# lint job ran (plan's reach step says why).  A push with no base to compare with (one that made main, or
# whose base cannot be fetched: the base step) is a change of every path, which also plans every part.  A run's
# verdict rests on its own checks of its own change against the base it names, with one exception, which queue_run
# bounds: in a push run whose jobs queue_run skips, required passes on the merge queue runs that checked each commit of
# that push, once, against that commit's own parent.  It is the only run whose success rests on other runs' checks.
# Such a push's diff from main before it is everything that push changed, whether it came through the merge queue or
# not; a push whose base's run failed is still judged on its own change, and that failed run stays failed.
# release-check.yml, when enabled, checks on main what each push changes that this workflow's merge queue runs did not
# (its header says which); weekly.yml checks every committed proof and finding from nothing after each release.
#
# required has no condition that skips it, and main-gate none but a pull request into a base other than main, since a
# skipped job reports success: there main-gate is skipped under another name (its job says why).
#
# A pull request runs on opened, synchronize, reopened and ready_for_review, and not on `edited`.
# GitHub sends `edited` for a new title or description, which changes nothing a job reads, as well as for a new base,
# and a workflow's `on:` cannot tell them apart, so every edit started a run.  That run could only restate the verdict
# of the run that
# checked the head; when that run was still checking, the restate ended cancelled, and the merge queue then read the
# head's newest run, which had no main-gate verdict ('Required status check "main-gate" is expected'), until someone
# re-ran it (twice, on 2026-10-26 and 27).  A new base starts no run either, and that fails closed: main-gate
# judges the base the run's event named, so a pull request made green against another branch and then retargeted
# at main has no main-gate on its head ('Required status check "main-gate" is expected') until a push, or closing and
# reopening it, runs it against main (the base step then also requires the merge commit to be on main).  A pull
# request retargeted from main to another branch keeps the verdicts it earned against main; that branch's own
# rules decide what they are worth there.
#
# A pull request's check job, the matrix of 16-core proof checks, and the fetch-drafts legs that feed it run only when
# the pull request is not a draft and carries the label `check`: the plan job's hold step reads both from the pull
# request as it is when the step runs, and answers `draft`, `label` or `none`.  On a draft (`draft`) lint does not run
# either, and so neither does any job that waits for it (tests, controls, stream_tools, farm_tests): a draft's pushes
# are not the head that merges, and marking it ready for review runs this workflow again in full.  Every other job runs
# on every pull request.  The author adds `check` when the head is final and then re-runs the head's run (gh run rerun)
# or pushes.
# When the plan named harnesses and check was held, required passes on a pull request into this repository's main with
# the summary 'checks skipped: ...', since the merge queue group, never held, checks the change in full before it
# merges; into any other base, and on theorem-labs/oss-verify-proofs (no queue), it fails ('planned checks not run at
# this head: add the label `check` and re-run all jobs').  A draft is read the same way: required passes on a draft
# into this repository's main ('lint skipped: a draft ...'), since a draft cannot enter the merge queue and the group
# lints it (and runs every other job) before it merges, and fails into any other base ('a draft: ... mark it ready for
# review').  Re-running only the failed jobs does not re-run plan, whose
# hold step reads the label.  There one route accepts a check held for the label (never a draft): merge-pr.sh's
# evidence comment.  merge-pr.sh posts it as sjawhar-agent[bot] only after every one of its checks passed for this
# head, on the VM evidence it merges on; its first line is exactly
# `<!-- vm-evidence head=<the head's full sha> mode=<pvc|xh|checklog> -->`.  merge-pr.sh then re-runs this job, which
# passes and names that comment.  required checks the comment, not the VM check it reports.  Because the comment is
# posted only after those checks passed, a marker left by an earlier attempt at the same head still counts.  A marker
# for another commit, by anyone else, or not on the first line, counts for nothing.  Measured over 21-27 October:
# 79865 16-core check minutes, 46332 of them on runs later cancelled, and 8904 on draft pull requests into main.  The
# label `do-not-merge` (a rehearsal's or a pipeline test's facts pull request: enroll.yml's publish job puts it on)
# makes required fail while the pull request has it, into any base, and with it main-gate: the same hold step reads it
# (`do_not_merge`), and required's last step fails on it, after every check of the other jobs' results, so a failed job
# still shows as its own failure first.  A draft marked ready for review runs this workflow again, and the label still
# fails it.  The label only makes a pull request safer; enroll.yml puts it on only for the label statements-rehearsal
# on the oss-verify pull request, which only a member of theorem-labs or one of its Apps can put there.  A merge queue
# group and a push are never held and carry no label.  A label, `check` or `do-not-merge`, starts no run of this
# workflow: a run for a label would be the head's newest run, and the merge queue reads that run's main-gate, which a
# run that checks nothing cannot honestly give (the paragraph above).  So a label put on or taken off counts from the
# pull request's next run, whose hold step reads it: re-run all jobs of the head's newest run, or push.
#
# The same evidence answers for a merge queue group, which is never held, when three things are measured, not
# assumed (the plan job's elsewhere step).  First, every path of the group's diff from its base is one whose change
# the parts' keys already hold or that no check opens (plan.paths_a_check_reads says which, and is the authority);
# a statement, theories/, toolchain/, .github/, release.yaml, dune-project, a counterexample, a finding and a
# projects/<p>/unpatched.yaml are not among them, and each leaves the group its checks.  Second,
# every pull request of the group carries that marker for its own head now, changed since by nobody but the App.
# Third, every part the plan marks for checking is a unit's build whose content key at this group head, by the
# base's tools, is the build key the pull request's comment recorded for that unit at its check of record
# (`<!-- vm-evidence-key unit=<project>/<harness> key=<64 hex> -->`); a key holds everything that part's check
# reads, its proofs folder included, so equal keys say that nothing it reads moved between the two trees -- that,
# not the paths, is what makes the skip safe.  Then the check jobs would compile the same proofs against the same
# statements with the same checker, for the same answer: no check job and no fetch-drafts leg runs, and required
# passes with 'checks not run here: ...', naming a comment per pull request (the OSS Verify lead, 2026-11-01: a
# re-check of unchanged proofs is forbidden).  Anything else -- another path, a pull request without the marker or
# with an edit by someone else, a planned counterexamples or findings part, a unit with no key line, a read that
# fails -- leaves the group its checks.  A unit whose key moved is the one answer that leaves the group nothing:
# when the pull request that recorded it is the entry this group's branch names, the plan job fails, so the queue
# takes that entry out for its owner to measure it again, rather than hold every entry behind it for a check of a
# tree nobody measured; an earlier entry's moved key leaves this group its checks, since a failing group takes out
# the entry its branch names and no other.  A pull request that is no draft is judged by the same three, as a group
# whose one entry it is: its own comments for the head its merge commit merges, and the plan's keys over that merge
# commit; a key that moved there leaves it its checks (no queue entry to take out), and a draft is left as it was.
# required reads one pair for both changes whose checks are of record elsewhere, this one and the pinned tree's
# deferred check: `checked_elsewhere` and its note.
name: pr
on:
  pull_request:
    # the default list and ready_for_review; no `edited` (above), no `labeled` (the paragraph above)
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read   # to pull the pinned checker and runner images from ghcr.io
concurrency:
  # A pull request's runs share one group, `pr-<number>`.  A push (`synchronize`, and `opened` for the first)
  # cancels the run in progress there, which checks a head nobody will merge.  A reopen and a mark of ready for review
  # carry no new commit, so cancel-in-progress is false for them: the new run waits for the run in progress instead
  # of killing it (GitHub keeps at most one pending run per group, and a later push replaces the one that waits).
  # Measured on this repository over 2026-10-24 to 31: of the 28 runs cancelled on their own head (221
  # runner-minutes), a reopen or a mark of ready for review cancelled 17, 175 of those minutes, and 8 of the 17
  # were the run the merge needed, the pull request having merged at that same head; one of the 8 lost 47.9
  # minutes of check (pull request #245).
  # Waiting costs runner time rather than saving it: the waiting run checks the head again from the start, and
  # while it waits the base may move (which its own stale base step refuses where no merge queue checks it again).
  # What it buys is the verdict and the wall clock: the run that was cancelled was the one the merge was waiting for.
  # The one case the first paragraph does not cover: a pull request pushed to while it was closed gets no
  # `synchronize`, so its reopen is the first event of a new head and waits behind a run of the older head.
  # A push to main and a merge queue group each have a run of their own that no other run cancels, keyed by the branch
  # and the commit, so a commit of main keeps the verdict its own run reached.
  # A merge queue group's run outlives its group, though: when the queue drops a group (an entry ahead of it failed or
  # left and the queue rebuilt the groups behind it on a new base, or its own entry was taken out, or a later group
  # merged it), GitHub deletes the group's branch and nothing stops the run.  Measured over 2026-10-28 to 11-04: 24
  # merge queue runs went on for 1208 runner-minutes after their group was gone, 1035 of them on 16 cores (about
  # US$68); 771 minutes followed an entry taken out of the queue, 437 a rebuild.  One check job (run 41293385792) ran
  # 4.8 hours past its group's removal, to its timeout.  So the lint and check jobs of a merge queue group start a
  # watch first (their step `cancel this run once its merge queue group is gone`, the same text in both): every 120
  # seconds it asks git for the group's branch, and when two answers 10 seconds apart both say the branch does not
  # exist (git ls-remote's exit status 2; an error is no answer), it cancels this run.  A branch that exists never
  # reads as gone, so a group the queue still holds is never cancelled.  Measured over the same week, the watch in
  # these two jobs would have stopped 1099 of the 1208 minutes: lint runs before every job but plan, and check is
  # 857 of the minutes.  The rest is mostly tests, controls and stream_tools of runs whose lint had ended before the
  # group was dropped.  The cancelled run's required and main-gate still run (always()) and fail, which no one
  # reads: the queue judges a group by its own head commit, and a rebuilt group is a new commit with a run of its
  # own; queue_run counts only a run that passed.  A check job's concurrency keyed by the pull request's number (a
  # job's concurrency may read `needs`, so plan could output it) was measured and refused: it fires only when the
  # rebuilt group's own check job starts, after its plan and lint, never for an entry taken out or a group whose plan
  # checks nothing, and would have stopped 94 of the 1035 16-core minutes; and it cancels whichever job of the key
  # came first, so a dropped group's check that started after the live group's would cancel the live one.
  group: pr-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: >-
    ${{ github.event.action != 'reopened' && github.event.action != 'ready_for_review' }}
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: "1"
  # The kind of change, from the event alone, so that every job reads the same.  A push to main is a pull request
  # that was checked and reviewed: release; so is a merge queue group, the commit main becomes.  An owner, member
  # or collaborator is a maintainer, and so is a branch of this repository, which only someone with write access
  # can push (a GitHub App's pull requests come with association NONE or CONTRIBUTOR); a maintainer's branch
  # release/* is a release (startsWith ignores case, so Release/* is one too).  Anyone else is a contributor.
  KIND: >-
    ${{ (github.event_name == 'push' || github.event_name == 'merge_group') && 'release'
    || (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
        || github.event.pull_request.head.repo.full_name == github.repository)
       && (startsWith(github.head_ref, 'release/') && 'release' || 'maintainer')
    || 'contributor' }}
  # The commit the change is judged against, for a merge queue group its base and for a push main before the push
  # (all zeros when the push made the branch: then the pushed commit itself).  A pull request has none here: its base
  # is the first parent of the merge commit GitHub built for this run (refs/pull/<n>/merge, which actions/checkout
  # checks out), read in the jobs' base steps, which also make sure that commit is on the base branch the pull
  # request names now.  The event's base.sha can be older than that commit: a pull request reopened right after its
  # base moved was sent the base before the move, and the moved base's own commits were then judged as the change's.
  # And the merge commit can be older than a change of base branch, which GitHub rebuilds it for in the background.
  EVENT_BASE: >-
    ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha
    || github.event_name == 'push' && github.event.before || '' }}

jobs:
  # A push to main of commits merge queue runs of this workflow already passed: those runs are these commits' CI, and
  # plan, lint and every job after them are skipped (the header says why), and required names those runs.  This job's
  # conditions are then the whole of what this repository's CI says of such a commit, so never loosen them;
  # publishing reads the gate's own check run instead (the header says where).  `checked` is true only when every
  # commit the push brings to main, walked back from the
  # pushed commit by its one parent until main before the push, has a merge queue run of this workflow for that very
  # commit that ended with main-gate passed and whose group was made on that commit's parent in main's own queue (the
  # queue names its branch gh-readonly-queue/main/pr-<n>-<base>, with the group's base at its end).  A queue merges up
  # to max_entries_to_merge groups in one push, each group's commit on the one before it (measured: one push brought
  # the commits of two groups, each passed by its own merge queue run), so each run judged exactly
  # what its commit changed, and together they judged everything the push changed.  A push with a commit no merge
  # queue run passed on that commit's parent (one past the queue), a merge commit, or a call that fails leaves
  # `checked` false, and the push is checked by its own diff; so does a walk that has not reached main before the push
  # after 20 commits, more than a queue merges in one push (it also stops a push whose `before` is no ancestor of the
  # pushed commit, a rewind or a force push, which only a ruleset bypass can make).  Another event skips this job,
  # which leaves it empty.  The step's text between `# queue chain` and `# end of queue chain` is release-check.yml's
  # queue step's too (tools/oft/tests/test_lint.py checks it).
  queue_run:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read  # the pushed commits' parents
      actions: read   # the merge queue runs of this workflow for those commits
    outputs:
      checked: ${{ steps.queue.outputs.checked }}
      runs: ${{ steps.queue.outputs.runs }}
    steps:
      - name: a merge queue run of this workflow passed main-gate on each commit this push brings
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # queue chain
          # The commits this push brings, oldest first, each as <commit>:<its one parent>: walked back from the pushed
          # commit until main before the push.  Empty when the walk does not reach it.
          chain=()
          case "$BEFORE" in ''|0000000000000000000000000000000000000000)
            echo "this push made the branch: no main before it to walk back to, so it is checked by its own change" ;;
          *)
            commit="$GITHUB_SHA"
            while :; do
              if [ "${#chain[@]}" -ge 20 ]; then
                echo "20 commits back from $GITHUB_SHA the walk has not reached main before the push, $BEFORE: this push brings more than a merge queue merges at once, or $BEFORE is no ancestor of it (a rewind or a force push), so it is checked by its own change"
                chain=(); break
              fi
              parents="$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit" --jq '[.parents[].sha] | join(" ")')" || parents=
              if ! [[ "$parents" =~ ^[0-9a-f]{40}$ ]]; then
                echo "$commit has the parents '${parents:-unknown}', not one: this push is not a line of merge queue commits from $BEFORE, so it is checked by its own change"
                chain=(); break
              fi
              chain=("$commit:$parents" "${chain[@]}")
              [ "$parents" != "$BEFORE" ] || break
              commit="$parents"
            done ;;
          esac
          # For each, a merge queue run of pr.yml on that commit, made on that parent, that passed main-gate.
          runs=()
          for link in "${chain[@]}"; do
            commit="${link%%:*}"
            parent="${link##*:}"
            found=
            ids="$(COMMIT="$commit" PARENT="$parent" gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/pr.yml/runs?event=merge_group&head_sha=$commit&status=success&per_page=20" \
              --jq '.workflow_runs[] | select(.head_sha == env.COMMIT and (.head_branch | startswith("gh-readonly-queue/main/pr-") and endswith("-" + env.PARENT))) | .id')" || ids=
            for id in $ids; do
              # every page of the run's jobs: with up to 256 fetch-drafts legs and 20 checks, main-gate can be past
              # the first 100
              verdict="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                --jq '.jobs[] | select(.name == "main-gate") | .conclusion // empty')" || continue
              verdict="${verdict%%$'\n'*}"
              if [ "$verdict" = success ]; then found="$id"; break; fi
            done
            if [ -z "$found" ]; then
              echo "no merge queue run of pr.yml passed main-gate on $commit made on its parent $parent: this push is checked by its own change"
              runs=(); break
            fi
            echo "merge queue run $found passed main-gate on $commit, made on its parent $parent"
            runs+=("$found")
          done
          checked=false
          if [ "${#chain[@]}" -gt 0 ] && [ "${#runs[@]}" -eq "${#chain[@]}" ]; then
            checked=true
            echo "every commit of this push from $BEFORE to $GITHUB_SHA passed its own merge queue run: ${runs[*]}"
            for id in "${runs[@]}"; do echo "run $id (merge queue) checked a commit of this push" >> "$GITHUB_STEP_SUMMARY"; done
          fi
          { echo "checked=$checked"; echo "runs=$([ "$checked" = true ] && echo "${runs[*]}" || true)"; } >> "$GITHUB_OUTPUT"
          # end of queue chain

  plan:
    # not on a push whose commit a merge queue run of this workflow already passed (queue_run): that run checked it
    needs: [queue_run]
    if: ${{ !cancelled() && needs.queue_run.outputs.checked != 'true' }}
    # One CPU and 95 MB of files (below): `oft plan` loads the facts and maps the changed paths onto harnesses.
    # A 16-core runner minute costs seven standard ones, and this job needs neither the cores nor the disk.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read   # the hold step: the pull request's draft state and labels as they are now
    outputs:
      plan: ${{ steps.drafts.outputs.plan }}
      units: ${{ steps.plan.outputs.units }}
      # which tools planned, and so which the check jobs run: `base` or `head` (the plan step says why)
      tools: ${{ steps.plan.outputs.tools }}
      # The parts of this change that this run plans and does not check here, because a check of record outside it
      # checked them: the tree the base pins with a deferred check, or a merge queue group or a pull request whose
      # every pull request was checked on a VM at a tree with these parts' keys.  `checked_elsewhere` is `true` or
      # `false`, and its note names that check of record, one line (the elsewhere step says when each holds).
      # check, fetch-drafts and required read this pair and nothing else of the two.
      checked_elsewhere: ${{ steps.elsewhere.outputs.checked_elsewhere }}
      checked_elsewhere_note: ${{ steps.elsewhere.outputs.checked_elsewhere_note }}
      base: ${{ steps.base.outputs.base }}
      draft_legs: ${{ steps.drafts.outputs.draft_legs }}
      # whether the change is routed by its paths (false: no base to compare with, and the base is the commit itself)
      routed: ${{ steps.base.outputs.routed }}
      # whether lint's per-file rules read only the changed files (the lint_gate step), which is also which
      # runner the lint job needs
      lint_changed_only: ${{ steps.lint_gate.outputs.lint_changed_only }}
      # whether the lint job checks out the tree without the proof libraries (the lint_gate step says when)
      lint_files_left_out: ${{ steps.lint_gate.outputs.lint_files_left_out }}
      # the cache key of this pull request's last passing lint, when its record holds (the plan's lint_since step),
      # which the lint job restores and checks again; empty otherwise
      lint_record: ${{ steps.lint_since.outputs.record }}
      repository_lint: ${{ steps.reach.outputs.repository_lint }}
      tests: ${{ steps.reach.outputs.tests }}
      controls: ${{ steps.reach.outputs.controls }}
      # whether the stream's operational tools changed (dev/stream/README.md): their own check runs
      stream_tools: ${{ steps.reach.outputs.stream_tools }}
      # (the paths under dev/stream/ this change touches, which that check reads as the change, are the artifact
      # stream-changed of this run: the reach step writes them and the stream_tools job reads them)
      # whether a file one of the farm_tests job's test files reads, or that job, changed (`true` or `false`), and the
      # legs it then runs, a JSON list of {file, index, count} (the reach step's farm suites table)
      farm_tests: ${{ steps.reach.outputs.farm_tests }}
      farm_legs: ${{ steps.reach.outputs.farm_legs }}
      checker: ${{ steps.reach.outputs.checker }}
      # whether check and fetch-drafts are held on this pull request, and why: `draft`, `label` (no label `check`) or
      # `none`
      hold: ${{ steps.hold.outputs.hold }}
      # whether the pull request has the label do-not-merge, which fails required: `true` or `false`
      do_not_merge: ${{ steps.hold.outputs.do_not_merge }}
    steps:
      # A merge queue group and a push are never held, and carry no label.  A pull request's draft state and labels are
      # read as they are now, not from the event: a re-run keeps its first event, which may predate the label `check`
      # or still have do-not-merge.  If the read fails, the event's own values answer, with a warning.  GitHub label
      # names ignore case, and so does this step.
      - name: a pull request's proofs are checked only when it is not a draft and carries the label check
        id: hold
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            { echo "hold=none"; echo "do_not_merge=false"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! state="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '{draft, labels}')"; then
            echo "::warning::could not read pull request $PR: its draft state and labels are the event's"
            state="$(jq -n --arg d "$EVENT_DRAFT" --argjson l "$EVENT_LABELS" '{draft: ($d == "true"), labels: $l}')"
          fi
          hold="$(jq -r 'if .draft == true then "draft"
            elif any(.labels[]?; .name | ascii_downcase == "check") then "none" else "label" end' <<< "$state")"
          do_not_merge="$(jq -r 'any(.labels[]?; .name | ascii_downcase == "do-not-merge")' <<< "$state")"
          { echo "hold=$hold"; echo "do_not_merge=$do_not_merge"; } >> "$GITHUB_OUTPUT"
          [ "$do_not_merge" = false ] || echo "the label do-not-merge: required fails while the pull request has it"
          case "$hold" in
            draft) echo "a draft: check waits until it is ready for review and labelled check" ;;
            label) echo "no label check: check waits until the label is added and this run re-run (or a push)" ;;
          esac
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          # Every file but the proof libraries: proofs/<p>/<h>/lib/ (projects/<p>/<h>/proofs/lib/ in the per-project
          # layout) is 4.56 GB of the tree's 4.66 GB, and nothing this job reads is under it.  `oft plan` loads
          # release.yaml, projects/, the proof.yaml of each statement's proof folder (proofs/<p>/<h>/<s>/ or
          # projects/<p>/<h>/proofs/<s>/; and checks that its Proof.v or Refutation.v is there), the counterexamples
          # and the findings, and hashes theories/; facts.load records no error on a tree without lib/, and plan never
          # reads proof_libs, the one field that directory fills.  blob:none leaves the rest of the blobs in the
          # remote; the base worktree below takes its tools the same way.  The diff below reads the two trees, not the
          # worktree, so it still lists every changed path, one under lib/ included.
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/proofs/*/*/lib/
            !/projects/*/*/proofs/lib/
      # The router's base: the one this run's every job judges the change against, and whether the change is routed by
      # its paths (the job's `base` and `routed` outputs, which the lint job takes).  The block between `# routing` and
      # `# end of routing` that lists the paths is the lint job's too (tools/oft/tests/test_keys.py checks it).
      - name: the base branch, whose tools judge this change
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          trap 'df -h "$GITHUB_WORKSPACE"' EXIT
          # routed: the change is the diff from the base to HEAD, and the jobs are routed by the paths in it.  A push
          # with no base to compare with is not routed: one that made the branch (EVENT_BASE all zeros), or one whose
          # base cannot be fetched (a force push that dropped it, or a fetch that failed).  Its base is then the pushed
          # commit itself, a commit of main with main's own tools, and every path of its tree counts as changed: the
          # run is full (lint reads every file, the findings ledger reads the tip's whole history, the tests run with
          # their whole-tree lint, the controls run, and every part is planned).  Only a push falls back so: a pull
          # request's or a merge queue group's base holds the tools that judge it, and without that base it fails.
          head="$(git -C head rev-parse HEAD)"
          base="$EVENT_BASE"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # the first parent of the merge commit checked out (EVENT_BASE says why); a commit names its parents even
            # in a clone one commit deep
            read -r -a parents <<< "$(git -C head cat-file -p HEAD | sed -n 's/^parent //p' | tr '\n' ' ')"
            [ "${#parents[@]}" = 2 ] || {
              echo "::error::HEAD has ${#parents[@]} parent(s): not the merge commit GitHub builds for a pull request"; exit 1; }
            base="${parents[0]}"
            # and that commit is on the base branch the pull request names now, as the API gives it: not the event's
            # base.ref, which for the top pull request of a stack names the stack's trunk (measured: the events of
            # #714, #724 and #765 named main while each pull request's base was the branch below it, and their plan
            # jobs failed here); the base branch is that commit or after it.  Or, for a pull request of a stack, GitHub
            # builds the merge commit on the merge commit of the pull request below it, the base branch merged into
            # all that is below it (measured on stack #873: #864's merge commit was built on 6ed2b55805cf, #562's
            # merge commit, whose parents are main and #562's head): that commit then holds the base branch's tip as
            # its second parent, and the compare says the base branch is behind it.  Its first parent must then pass
            # the same rule against the base branch of the open pull request whose head is the base branch, and so on
            # down the stack: a merge whose first parent is the base branch and one more commit, with the base
            # branch's tip as its second parent, would hide that commit from the change while its tools judge it
            # (#864's base 6ed2b55805cf has main as its first parent, and #562's base is main)
            BASE_REF="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .base.ref)"
            [ -n "$BASE_REF" ] || { echo "::error::the API named no base branch for pull request $PR"; exit 1; }
            commit="$base" ref="$BASE_REF"
            while :; do
              on=$(gh api "repos/$GITHUB_REPOSITORY/compare/$commit...$ref" --jq '"\(.status) \(.merge_base_commit.sha)"')
              case "$on" in
                "identical $commit" | "ahead $commit") break ;;
                "behind "*)
                  tip="${on#behind }"
                  below="$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit" --jq '[.parents[].sha] | join(" ")')"
                  read -r -a below <<< "$below"
                  [ "${#below[@]}" = 2 ] && [ "${below[1]}" = "$tip" ] || {
                    echo "::error::this run's merge commit was built on $base, whose commit $commit holds $ref's tip $tip but is not the merge commit of the pull request below (its parents: ${below[*]}): GitHub had not rebuilt it for the pull request's base when this run started, and a re-run checks the same commit; push, or close and reopen the pull request"
                    exit 1; }
                  down="$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=${GITHUB_REPOSITORY%%/*}:$ref&state=open" --jq '.[0].base.ref // empty')"
                  [ -n "$down" ] || {
                    echo "::error::this run's merge commit was built on $base, which holds $ref's tip $tip as a merge, but no open pull request has $ref as its head: push, or close and reopen the pull request"
                    exit 1; }
                  commit="${below[0]}" ref="$down" ;;
                *)
                  echo "::error::this run's merge commit was built on $base, which is not on $ref (at $commit: $on): GitHub had not rebuilt it for the pull request's base when this run started, and a re-run checks the same commit; push, or close and reopen the pull request"
                  exit 1 ;;
              esac
            done
          fi
          routed=true
          case "$base" in ''|0000000000000000000000000000000000000000) base="$head"; routed=false ;; esac
          # one commit each of the change and its base: this step compares two trees and reads no history (the lint
          # job's ledger step fetches the history it reads), and a clone of every branch's history does not fit
          # beside the two trees on the runner's disk
          if [ "$routed" = true ] && ! git -C head fetch --no-tags --depth=1 origin "$base"; then
            [ "$GITHUB_EVENT_NAME" = push ] || { echo "::error::the base $base cannot be fetched"; exit 1; }
            echo "::warning::$base, main before this push, cannot be fetched: every path of the tree counts as changed"
            base="$head"
            routed=false
          fi
          if [ "$KIND" = release ]; then
            # a release's pins are its own facts (head), so this job reads only the base's tools and the local
            # actions it runs; cone mode also keeps the files at the top of the tree
            git -C head worktree add --no-checkout --detach "$GITHUB_WORKSPACE/base" "$base"
            git -C base sparse-checkout set --cone tools .github/actions
            git -C base checkout --detach "$base"
          else
            # any other change's check jobs fetch the base's pins, which the drafts step reads from the base's facts:
            # every file but the proof libraries of either layout, as head is checked out above
            git -C head worktree add --no-checkout --detach "$GITHUB_WORKSPACE/base" "$base"
            git -C base sparse-checkout set --no-cone '/*' '!/proofs/*/*/lib/' '!/projects/*/*/proofs/lib/'
            git -C base checkout --detach "$base"
          fi
          [ -d base/tools/oft ] || { echo "::error::the base branch has no tools/oft: nothing trusted to judge with"; exit 1; }
          # this workflow runs the base's copy of its shared actions, so they land on the base before a workflow uses them
          for a in plan-drafts place-drafts; do
            [ -f "base/.github/actions/$a/action.yml" ] || {
              echo "::error::the base branch has no .github/actions/$a/action.yml: this workflow runs the base's copy of its shared actions, so they must land on the base first"; exit 1; }
          done
          # routing
          if [ "$routed" = true ]; then
            # --no-renames: a renamed file is its old path and its new one; with renames, git lists only the new.
            # core.quotePath=false: a name with a byte above 0x7f is listed as it is, not quoted.
            git -c core.quotePath=false -C head diff --no-renames --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          else
            # every path of the tree, listed as the diff lists a changed one
            git -c core.quotePath=false -C head ls-tree -r --name-only HEAD > "$RUNNER_TEMP/changed.txt"
            echo "no base to compare with: every path of the tree counts as changed"
          fi
          { echo "base=$base"; echo "routed=$routed"; } >> "$GITHUB_OUTPUT"
          echo "changed paths: $(wc -l < "$RUNNER_TEMP/changed.txt"); kind of change: $KIND"
          # end of routing
          if [ "$routed" = true ]; then
            echo "### the change: $(wc -l < "$RUNNER_TEMP/changed.txt") path(s) from $base to $head" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### the change: every path of $head (no base to compare with)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: the tools' dependencies (PyYAML, idna), hash-pinned, from the base
        run: python -m pip install --quiet --require-hashes -r base/tools/oft/requirements.txt

      - name: plan
        id: plan
        env:
          BASE: ${{ steps.base.outputs.base }}
          ROUTED: ${{ steps.base.outputs.routed }}
        run: |
          set -euo pipefail
          # On theorem-labs/oss-verify-proofs, release-check.yml checks a push to main on that commit alone: the parts
          # whose content key the push changes, the same parts this run would check.  So this run plans none (an empty
          # plan: no check job, no draft), and lint, tests and controls still run in full (the reach step's merge path).
          # It gives every answer the required job reads: no unit, no deferred check, and the base's tools.
          if [ "${GITHUB_REPOSITORY:-}" = theorem-labs/oss-verify-proofs ] && [ "${GITHUB_EVENT_NAME:-}" = push ]; then
            echo '{"all": false, "units": [], "check_units": [], "parts": [], "jobs": []}' > "$RUNNER_TEMP/plan.json"
            { echo "units=0"; echo "deferred=false"; echo "tools=base"; } >> "$GITHUB_OUTPUT"
            echo "### no part planned: release-check.yml checks a push to main" >> "$GITHUB_STEP_SUMMARY"
            echo "no part planned: release-check.yml checks a push to main, on that commit alone"
            exit 0
          fi
          if [ ! -e head/release.yaml ]; then
            echo 'plan=[]' >> "$GITHUB_OUTPUT"; echo "units=0" >> "$GITHUB_OUTPUT"
            echo "deferred=false" >> "$GITHUB_OUTPUT"; echo "tools=base" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Which tools plan and, with them, lint and check.  The base's, so that a change cannot judge itself --
          # except for the one change they cannot read at all: a change that brings the tools and the facts those
          # tools read together, where the base's tools read no proof of any fuzz target, so their plan would check
          # no proof while saying it checked everything it planned.  (They may still read some fuzz targets: a
          # project whose project.yaml and harness.yaml have the base's shape loads, while its proofs, in a layout the
          # base does not know, do not; the count is of fuzz targets with a proof.)
          #
          # A change may not name itself for that.  The base names it, in base/tools/oft/migration-pin.yaml, by a
          # digest of the approved change's tools/ and theories/ (below): setting that file is its own reviewed pull
          # request, and the pin is compared with this tree before anything of the change runs.  Two counts must
          # agree with it: the base's tools read no fuzz target with a proof in this tree, and the change's own read
          # some.  The counts are a symptom, not the authority -- the pin is -- and neither count says the facts are
          # sound: what judges the tree is the lint, the plan and the check that follow, by the pinned tools.
          # What the pin names: every file of tools/ and theories/ of this tree, with its mode, its object id and its
          # path, in git's order, and the attributes git checks those files out with (a .gitattributes change alters
          # the bytes without changing a blob, as keys.CHECKOUT_ATTRIBUTES says), digested.  The pin file itself is
          # left out, since its own content is what the digest would otherwise have to predict.  This is the pull
          # request's merge commit, so it is the tree the jobs read, not the branch's.
          head_digest() {
            local files
            files=$(git -C head ls-tree -r HEAD -- tools theories | grep -v $'\ttools/oft/migration-pin\\.yaml$')
            { echo "$files"
              cut -f2 <<< "$files" | git -C head check-attr --stdin --source=HEAD \
                text eol crlf filter ident working-tree-encoding
            } | sha256sum | cut -d' ' -f1
          }
          # The tree a deferred check's pin names (below): every file of this tree, with its mode, its object id and its
          # path, in git's order, the pin file left out as above, digested.  tools/oft/ci/pin-digests.sh prints both
          # digests of a commit, for the pull request that sets the pin.
          tree_digest() {
            git -C head ls-tree -r HEAD | { grep -v $'\ttools/oft/migration-pin\\.yaml$' || [ $? -eq 1 ]; } \
              | sha256sum | cut -d' ' -f1
          }
          # The pin, read once: digest, check, tree and check_of_record, one line each ('' for a key it does not
          # have, and for a base with no pin file or a pin of another schema); a value that is not one line of text
          # fails, rather than read as some other answer, and a digest that is not 64 hexadecimal characters is ''
          # (nothing else names a tree of tools/ and theories/).
          pinned() {
            python - <<'PY'
          import sys, yaml
          try:
              pin = yaml.safe_load(open("base/tools/oft/migration-pin.yaml")) or {}
          except FileNotFoundError:
              pin = {}
          if not isinstance(pin, dict) or pin.get("schema") != "oss-fuzz-theorems/migration-pin/1":
              pin = {}
          for key in ("digest", "check", "tree", "check_of_record"):
              value = pin.get(key)
              if value is None:
                  value = ""
              if not isinstance(value, str) or "\n" in value or "\r" in value:
                  sys.exit("the base's migration pin: %s is not one line of text" % key)
              if key == "digest" and not (len(value) == 64 and set(value) <= set("0123456789abcdef")):
                  value = ""
              print(value)
          PY
          }
          # A count is a reading only when the probe exits 0 and prints one number: a probe that fails, or prints
          # anything else, read nothing.  It counts the fuzz targets of this tree that have a statement with a proof,
          # as the tools at PYTHONPATH load them.
          cat > "$RUNNER_TEMP/count-units.py" <<'PY'
          from oft import facts
          print(sum(1 for h in facts.load("head").harnesses() if any(s.proof for s in h.statements.values())))
          PY
          count() {
            local out
            out=$(PYTHONPATH="$1" python "$RUNNER_TEMP/count-units.py") || return 1
            case "$out" in ''|*[!0-9]*) return 1 ;; esac
            echo "$out"
          }
          pinned > "$RUNNER_TEMP/pin.txt" || { echo "::error::the base's migration pin cannot be read"; exit 1; }
          # each value exactly as the pin has it: `deferred ` is another word
          { IFS= read -r pin; IFS= read -r pin_check; IFS= read -r pin_tree; IFS= read -r pin_record; } \
            < "$RUNNER_TEMP/pin.txt"
          tools=base/tools
          if [ -n "$pin" ]; then
            here=$(head_digest)
            echo "the base pins the tools and theories of one change: $pin; this change has $here"
            if [ "$pin" = "$here" ]; then
              # The count is of fuzz targets with a proof, so the pinned change takes its own tools exactly when the
              # base's tools read no proof in this tree, however many fuzz targets of their shape they still load.
              base_units=$(count base/tools) ||
                { echo "::error::the base's tools could not count the fuzz targets of this tree"; exit 1; }
              echo "fuzz targets with a proof in this tree, read by the base's tools: $base_units"
              if [ "$base_units" -eq 0 ]; then
                # only now does any code of the change run: the base pinned this very tree, and its own tools read
                # no proof in it
                head_units=$(count head/tools) || head_units=
                echo "read by the change's own tools: ${head_units:-(no count)}"
                if [ -n "$head_units" ] && [ "$head_units" -gt 0 ]; then
                  tools=head/tools
                  echo "::notice::the base pins this change's tools, its own tools read no proof in this tree, and"\
                    "the change's read $head_units fuzz target(s) with a proof: this change's tools plan every part"\
                    "of it, lint it and check it"
                else
                  # A plan from here would check no proof, and the run would report that it checked everything it
                  # planned.
                  echo "::error::the base pins this change's tools, and no tools read a proof in this tree:"\
                    "the base's read $base_units and the change's own ${head_units:-gave no count}, so a plan here"\
                    "would check no proof"
                  exit 1
                fi
              else
                echo "::notice::the base's tools read $base_units fuzz target(s) with a proof in this tree, so they"\
                  "judge it, pin or no pin"
              fi
            fi
          fi
          # The pin may defer a proof check, too: the pin's `check: deferred` names a check of record outside this
          # workflow (`check_of_record`), because every part of a whole tree does not fit in a merge queue group's
          # 360 minutes (a release line's join; a change that re-keys every part of the corpus).  Then every part is
          # planned below, and no check job runs here (`deferred`, which check, fetch-drafts and required read).
          # Only for the tree the pin names (`tree`, the whole tree but the pin file), and the tree alone says it:
          # a deferral turns off the check jobs, not the rules that judge the tree, so it holds whichever tools the
          # digest above named, the base's or the change's own.  Any other tree -- a commit merged into the base
          # after the pin, or another change -- is checked here as usual; with the pinned tools it fails instead,
          # before a check job is planned, since those tools were pinned for the tree the pin names.
          deferred=false
          case "$pin_check" in
            '') ;;
            deferred)
              here_tree=$(tree_digest)
              echo "the base pins tree ${pin_tree:-(none)} for a deferred check; this tree is $here_tree"
              if [ "$pin_tree" = "$here_tree" ]; then
                [ -n "$pin_record" ] || {
                  echo "::error::the base pins a deferred check of this tree and names no check of record"; exit 1; }
                deferred=true
                echo "::notice::the base pins this tree for a deferred check: every part is planned, and none is"\
                  "checked here; the check of record: $pin_record"
              elif [ "$tools" = head/tools ]; then
                echo "::error::the base pins tree ${pin_tree:-(none)} for a deferred check, and this tree is $here_tree"
                exit 1
              else
                echo "::notice::the base pins another tree for a deferred check: this tree is checked here as usual"
              fi ;;
            *)
              echo "::error::the base's migration pin says check '$pin_check', neither deferred nor empty"; exit 1 ;;
          esac
          echo "tools=${tools%%/*}" >> "$GITHUB_OUTPUT"
          echo "deferred=$deferred" >> "$GITHUB_OUTPUT"
          # 20 jobs, as before: each job pays about 2 minutes of checkout, base worktree, cache and image before its
          # first proof (measured: median 125 s outside the check step), so more jobs buy a shorter
          # full re-check for more billed 16-core minutes (64 jobs: about 2.2 hours of that per full re-check against
          # 40 minutes; 256: 9 hours).
          PYTHONPATH=$tools python -m oft plan --help > "$RUNNER_TEMP/plan-help.txt"
          if grep -q -- --store "$RUNNER_TEMP/plan-help.txt"; then
            # Content keys (tools/oft/keys.py): each part of each harness has the key of what its check reads, with
            # the statements this run checks (the base's, unless KIND is release), this change's proofs,
            # counterexamples and findings (in either layout), and the checker the check jobs run.  A part is checked
            # when its key differs from its key at the base, so a change to the tools or the workflows checks nothing
            # here.  With no base to compare with (not routed: the base step), no part has a key to equal, and every
            # part is checked; oft plan refuses that for a change that is not a release, which judges by the base's
            # statements.
            args=(--pr-kind "$KIND" --max-jobs 20)
            if [ "$tools" = base/tools ]; then
              # the base's tools judge this change; --base only when the base step routed it
              if [ "$ROUTED" = true ]; then
                args+=(--base "$BASE")
              else
                echo "no base to compare with: every part is planned"
              fi
            else
              # the change's own tools judge it (the base pins them, above): the base is left out, since its keys say
              # what the old tools read of this tree, which is nothing, and --tools HEAD keys every part by the
              # checker the check jobs run, so every part is checked
              args+=(--tools HEAD)
            fi
            PYTHONPATH=$tools python -m oft --root head plan "${args[@]}" > "$RUNNER_TEMP/plan.json"
            { echo "### parts checked, and why"
              jq -r '.parts[] | select(.check) | "- \(.unit) \(.part): \(.why)"' "$RUNNER_TEMP/plan.json"
              echo "### parts not checked: $(jq '[.parts[] | select(.check | not)] | length' "$RUNNER_TEMP/plan.json")"
              jq -r '[.parts[] | select(.check | not) | .why] | group_by(.) | .[] | "- \(.[0]): \(length)"' \
                "$RUNNER_TEMP/plan.json"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # The base's tools predate content keys, and the per-project layout with them: they read the old layout
            # alone, proofs/, counterexamples/ and findings/.  The plan maps the changed paths onto harnesses.
            changed="$RUNNER_TEMP/changed.txt"
            if [ "$KIND" != release ]; then
              # The check job renders the dune-project of the tree it builds itself, from the base's facts and this
              # change's proofs, so no check job reads this change's own. A project's first proofs package comes with
              # the proofs/<p>/<h>/ paths that mark its harnesses; counted as a change, it would mark every harness.
              # (With content keys, a build key reads the dune-project of the facts the check takes, the base's.)
              { grep -vx 'dune-project' "$changed" || [ $? -eq 1 ]; } > "$RUNNER_TEMP/plan-nodune.txt"
              changed="$RUNNER_TEMP/plan-nodune.txt"
            fi
            # A file's checked-out bytes are its blob and its attributes.  changed.txt holds every path whose blob
            # differs; a changed .gitattributes file is translated here into the paths whose attributes it alters,
            # and then dropped, so the plan marks those paths' harnesses and not every one.  The reach step below
            # reads the untranslated list, so such a change still runs the tests and the controls in full.
            if grep -qE '(^|/)\.gitattributes$' "$changed"; then
              read_by_the_check=(projects proofs counterexamples findings theories toolchain dune-project release.yaml
                                 .github/workflows tools/oft)
              { git -C head ls-tree -r -z --name-only HEAD -- "${read_by_the_check[@]}"
                git -C head ls-tree -r -z --name-only "$BASE" -- "${read_by_the_check[@]}"
              } | sort -z -u > "$RUNNER_TEMP/tracked.z"
              git -C head check-attr -z --all --source=HEAD --stdin < "$RUNNER_TEMP/tracked.z" \
                | tr '\0' '\n' | paste -d '\t' - - - > "$RUNNER_TEMP/attr-head.tsv"
              git -C head check-attr -z --all --source="$BASE" --stdin < "$RUNNER_TEMP/tracked.z" \
                | tr '\0' '\n' | paste -d '\t' - - - > "$RUNNER_TEMP/attr-base.tsv"
              sort "$RUNNER_TEMP/attr-head.tsv" "$RUNNER_TEMP/attr-base.tsv" | uniq -u | cut -f1 | sort -u \
                > "$RUNNER_TEMP/attr-changed.txt"
              { grep -vE '(^|/)\.gitattributes$' "$changed" || [ $? -eq 1 ]; } > "$RUNNER_TEMP/plan-changed.txt"
              changed="$RUNNER_TEMP/plan-changed.txt"
              cat "$RUNNER_TEMP/attr-changed.txt" >> "$changed"
              echo "a .gitattributes change: $(wc -l < "$RUNNER_TEMP/attr-changed.txt") path(s) whose attributes differ"
            fi
            args=(--changed "$changed" --max-jobs 20)
            if [ -e base/release.yaml ] && grep -q -- --base-release "$RUNNER_TEMP/plan-help.txt"; then
              args+=(--base-release base/release.yaml)
            fi
            if grep -q -- --pr-kind "$RUNNER_TEMP/plan-help.txt"; then
              args+=(--pr-kind "$KIND")
            else
              echo "the base's tools have no plan --pr-kind: every harness this change reaches is planned"
            fi
            PYTHONPATH=$tools python -m oft --root head plan "${args[@]}" > "$RUNNER_TEMP/plan.json"
          fi
          # the plan output is written by the drafts step, with each group's draft binaries in its entry
          echo "units=$(jq '.units | length' "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          if [ "$deferred" = true ]; then
            # The parts are planned and counted (units, above), and none is checked here: the drafts step (the base's
            # action) writes plan=[] and draft_legs=[] for an empty plan file, so no check job and no fetch-drafts
            # leg has a group to start.
            { echo "### harnesses planned: $(jq '.units | length' "$RUNNER_TEMP/plan.json")"
              echo "### no part is checked here: the tree the base pins for a deferred check"
              echo "The check of record: $pin_record"; } >> "$GITHUB_STEP_SUMMARY"
            echo "check_of_record=$pin_record" >> "$GITHUB_OUTPUT"
            : > "$RUNNER_TEMP/plan.json"
          else
            { echo "### harnesses to check"; jq -r '.units[]' "$RUNNER_TEMP/plan.json"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # The parts this run plans and does not check here, because a check of record outside it checked them
      # (`checked_elsewhere` and its note, which check, fetch-drafts and required read).  Two changes have one:
      #
      #   * the tree the base pins with a deferred check (the plan step above): the pin names that tree and the
      #     check of record, and the tree alone says it, whichever tools judge that tree (the stream owner's
      #     decision for the W2 train);
      #   * a merge queue group, or a pull request that is no draft, whose proofs were each already checked on a VM,
      #     at a tree whose content keys are this run's: its check jobs would compile the same proofs against the
      #     same statements with the same checker a second time, for the same answer (the OSS Verify lead,
      #     2026-11-01: those re-checks are forbidden re-checks of unchanged proofs).  A pull request's run reads its
      #     own comments, for the head its merge commit merges, and its keys are the plan's over that merge commit:
      #     #1478 was proved on the farm and re-checked here for two hours otherwise.
      #
      # For a group, four conditions, each of which must hold, and any read that fails leaves it false (a pull
      # request's run: the same four, with the pull request itself as the group's one entry, and a key that differs
      # leaves it its checks rather than failing, since no queue entry is there to take out):
      #   * a merge queue group, or a pull request that is no draft, routed by its paths (so changed.txt is the
      #     change's diff from its base: github.event.merge_group.base_sha, or the merge commit's first parent);
      #   * every changed path is one whose change the parts' keys already hold or that no check opens, which
      #     plan.paths_a_check_reads decides, by the base's own tools: its docstring is the list, and the key
      #     comparison below catches any change to a path whose id a key holds.  What it does not name still
      #     counts, so a statement, theories/, toolchain/, .github/, release.yaml, dune-project, a counterexample,
      #     a finding and a projects/<p>/unpatched.yaml all leave the group its checks;
      #   * every pull request of the group carries merge-pr.sh's VM evidence comment for that pull request's head
      #     now.  The group's entries are cumulative: the queue branch names the last one
      #     (gh-readonly-queue/main/pr-<n>-<base>, with the group's base at its end, as queue_run reads it), and each
      #     commit from the base to this one names its own, `(#n)` at the end of its first line; the commits must
      #     name as many pull requests as the group has commits, and the last commit must name the branch's.  (The
      #     association API would answer this at one call per commit; these are two calls for the group.)  The
      #     comment rule is the one the required step's held-check acceptance applies, in the shared text between
      #     `# vm evidence` and `# end of vm evidence`: posted by the App (user.type Bot), first line exactly
      #     `<!-- vm-evidence head=<that pull request's head sha> mode=<pvc|xh|checklog> -->`, and changed since by
      #     nobody else;
      #   * every part the plan marks for checking is a unit's build whose key here equals the key that unit's
      #     evidence line recorded at its check of record (plan.vm_evidence_keys, with the base's tools).  A part's
      #     content key holds everything its check reads, so equal keys say that nothing moved between the two
      #     trees: the unit's own files, every proof library its check may read, theories/,
      #     toolchain/allowed-axioms.txt, its project's rows, the images and the checker.  A planned counterexamples
      #     or findings part, a unit with no key line, and two lines for one unit that disagree (two pull requests
      #     of one group touching it) leave the group its checks.  A key that differs is the one answer that leaves
      #     the group nothing: the evidence that pull request carries was measured on another tree, so the step
      #     fails, the queue drops that entry, and its owner measures it again at its new head and queues it again
      #     (the OSS Verify lead, 2026-11-01).  A full check of such an entry holds the queue for every entry
      #     behind it: #613 held six approved pull requests for three hours on 2026-11-01.  A group that fails
      #     takes out the entry its branch names and no other (GitHub, "Managing a merge queue"), so the step
      #     fails for that entry's own stale key alone; an earlier entry's leaves this group its checks and is
      #     taken out by the group its own branch names.
      - name: the parts a check of record outside this run checked
        id: elsewhere
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.base.outputs.base }}
          ROUTED: ${{ steps.base.outputs.routed }}
          REF_NAME: ${{ github.ref_name }}
          GROUP_HEAD: ${{ github.sha }}
          VM_EVIDENCE_BY: sjawhar-agent[bot]
          # a pull request's run: its number, the head its merge commit merges, and its hold (a draft is left as it is)
          PR: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HOLD: ${{ steps.hold.outputs.hold }}
          DEFERRED: ${{ steps.plan.outputs.deferred }}
          CHECK_OF_RECORD: ${{ steps.plan.outputs.check_of_record }}
        run: |
          set -euo pipefail
          # fail closed: the parts this run planned are checked here, as they are today
          no() { echo "the checks run here: $1"; echo "checked_elsewhere=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$DEFERRED" = true ]; then
            # the tree the base pins with a deferred check: the pin names that tree, and what it defers is the check
            # jobs, not the rules that judged it, so it holds whichever tools the plan step named (the stream
            # owner's decision for the W2 train)
            [ -n "$CHECK_OF_RECORD" ] || { echo "::error::a deferred check with no check of record"; exit 1; }
            { echo "checked_elsewhere=true"; echo "checked_elsewhere_note=the check of record: $CHECK_OF_RECORD"
            } >> "$GITHUB_OUTPUT"
            echo "the tree the base pins for a deferred check; the check of record: $CHECK_OF_RECORD"
            exit 0
          fi
          case "$GITHUB_EVENT_NAME" in
            merge_group) ;;
            pull_request)
              # a draft's check waits until it is ready for review, and required reads it as a draft first: unchanged
              [ "$HOLD" != draft ] || no "a draft"
              case "$PR" in ''|*[!0-9]*) no "no pull request number" ;; esac
              [[ "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]] || no "the event gave no head commit for pull request $PR"
              # the tree the plan keyed is the merge commit checked out in head/, so it must merge that very head: its
              # second parent, read from the commit itself as the base step reads its first (a clone one commit deep
              # gives HEAD no parents to rev-parse)
              merged=$(git -C head cat-file -p HEAD | sed -n 's/^parent //p' | sed -n 2p) || merged=
              [ "$merged" = "$PR_HEAD" ] || \
                no "this run's merge commit merges ${merged:-no second parent}, not the event's head $PR_HEAD" ;;
            *) no "neither a pull request nor a merge queue group" ;;
          esac
          [ "$ROUTED" = true ] || no "no base to compare with"
          [ -s "$RUNNER_TEMP/changed.txt" ] || no "no changed path read from the change's diff"
          # the paths, by the base's tools (plan.py, which keys.NOT_THE_CHECKER leaves out of every key)
          PYTHONPATH=base/tools python -c 'import sys; from oft import plan
          for path in plan.paths_a_check_reads(open(sys.argv[1]).read().splitlines()): print(path)' \
            "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/vm-paths.txt" || no "the change's paths cannot be read"
          if [ -s "$RUNNER_TEMP/vm-paths.txt" ]; then
            no "$(wc -l < "$RUNNER_TEMP/vm-paths.txt") changed path(s) a check reads, the first $(head -n 1 "$RUNNER_TEMP/vm-paths.txt")"
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # a pull request's run: the pull request itself, for the head this run's merge commit merges
            prs="$PR" last="$PR" of="pull request $PR"
          else
            # the pull requests of the group: the queue branch's own, and one per commit from the base to this commit
            case "$REF_NAME" in
              gh-readonly-queue/*/pr-*-"$BASE") last="${REF_NAME##*/pr-}"; last="${last%-"$BASE"}" ;;
              *) no "the queue branch $REF_NAME does not name this group's base $BASE" ;;
            esac
            case "$last" in ''|*[!0-9]*) no "the queue branch $REF_NAME names no pull request" ;; esac
            gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$GROUP_HEAD" > "$RUNNER_TEMP/vm-compare.json" \
              || no "the group's commits cannot be read"
            jq -e 'type == "object" and (.commits | type) == "array"' "$RUNNER_TEMP/vm-compare.json" > /dev/null 2>&1 \
              || no "the compare of this group is no commit list"
            total=$(jq -r '.total_commits // ""' "$RUNNER_TEMP/vm-compare.json")
            read_commits=$(jq -r '.commits | length' "$RUNNER_TEMP/vm-compare.json")
            case "$total" in ''|*[!0-9]*) no "the compare of $BASE with this commit gave no count" ;; esac
            [ "$total" = "$read_commits" ] || \
              no "the group has $total commit(s) and one page of the compare read $read_commits"
            [ "$total" -gt 0 ] || no "the group has no commit of its own"
            prs=$(jq -r '.commits[].commit.message | split("\n")[0]' "$RUNNER_TEMP/vm-compare.json" \
              | sed -n 's/.*(#\([0-9][0-9]*\))$/\1/p')
            [ "$(grep -c '^[0-9]' <<< "$prs" || true)" = "$total" ] || \
              no "a commit of the group names no pull request at the end of its first line"
            # one pull request per commit, and the queue branch's is the last commit's: a group is one commit per entry
            [ "$(sort -nu <<< "$prs" | grep -c '^[0-9]' || true)" = "$total" ] || \
              no "the group's $total commit(s) name fewer pull requests: $(tr '\n' ' ' <<< "$prs")"
            [ "$(tail -n 1 <<< "$prs")" = "$last" ] || \
              no "the queue branch names pull request $last and the group's last commit names $(tail -n 1 <<< "$prs")"
            prs=$(sort -nu <<< "$prs") of="every pull request of this group"
          fi
          evidence=
          # one `<pull request> <unit> <key>` line per evidence key line: the pull request names whose entry a key
          # that differs belongs to, and the two last fields alone are what plan.vm_evidence_keys reads
          : > "$RUNNER_TEMP/vm-key-prs.txt"
          for VM_PR in $prs; do
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              VM_HEAD="$PR_HEAD"
            else
              VM_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$VM_PR" --jq '.head.sha') \
                || no "pull request $VM_PR cannot be read"
              [[ "$VM_HEAD" =~ ^[0-9a-f]{40}$ ]] || no "pull request $VM_PR gave no head commit"
            fi
            # vm evidence
            # merge-pr.sh's VM evidence comment on pull request VM_PR for the commit VM_HEAD: posted by the App
            # (user.type Bot), its first line exactly `<!-- vm-evidence head=<VM_HEAD> mode=<pvc|xh|checklog> -->`,
            # and changed since by nobody but the App either (GitHub keeps every editor in userContentEdits, which only
            # GraphQL gives).  `said` becomes that comment's "(mode): <its url>", its node id, and one
            # `key <unit> <key>` line for each `<!-- vm-evidence-key unit=<project>/<harness> key=<64 hex> -->` line
            # after the marker in it, the unit's build key at the tree its check of record ran on.  Of the comments
            # that carry the marker the newest answers, since a later run of merge-pr.sh posts a later comment:
            # --slurp hands the whole list to one jq program, so `last` is the newest of every page, not of each;
            # the CLI refuses --slurp with its own --jq, so the pages go through jq here, with HEAD_SHA exported.
            # A marker for another commit, by anyone else, or not on the first line counts for nothing, and so does
            # a comment anyone else changed and a read that fails: `said` is empty then.  What is checked is the
            # comment, not the VM check it reports.
            # shellcheck disable=SC2016  # a jq program: $lines and $mode are jq's, not the shell's
            said="$(export HEAD_SHA="$VM_HEAD"
              gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$VM_PR/comments?per_page=100" | jq -r '
              [ .[][] | select(.user.login == env.VM_EVIDENCE_BY and .user.type == "Bot")
                | (.body | split("\n")) as $lines
                | first(("pvc", "xh", "checklog")
                        | select($lines[0] == "<!-- vm-evidence head=\(env.HEAD_SHA) mode=\(.) -->")) as $mode
                | {mode: $mode, url: .html_url, node: .node_id,
                   keys: [$lines[1:][]
                          | capture("^<!-- vm-evidence-key unit=(?<unit>[^ ]+) key=(?<key>[0-9a-f]{64}) -->$")]}
              ] | last // empty
              | "(\(.mode)): \(.url)", "node \(.node)", (.keys[] | "key \(.unit) \(.key)")')" || said=
            if [ -n "$said" ]; then
              # The comment's author and every editor of it are the App: GraphQL names an App `Bot` and gives its
              # login without the `[bot]` REST appends, so the author must be a Bot whose login and `[bot]` is
              # VM_EVIDENCE_BY and every editor a Bot of that same login.  An edit list that is no list, more edits
              # than this one page holds, and a read that fails all count as a stranger; a read that fails says so
              # with the error, since a token refused this field would otherwise look like a comment someone changed.
              err="$(mktemp)"   # the read's stderr, apart from its answer: a warning on success must not change it
              # shellcheck disable=SC2016  # a GraphQL query: $id is GraphQL's, not the shell's
              strangers="$(gh api graphql -f query='query($id: ID!) { node(id: $id) { ... on IssueComment {
                  author { __typename login }
                  userContentEdits(first: 100) { totalCount nodes { editor { __typename login } } } } } }' \
                -F id="$(sed -n 's/^node //p' <<< "$said" | head -n 1)" \
                --jq '.data.node as $c | ($c.author.login // "") as $who
                      | [ (if $c.author.__typename == "Bot" and ($who + "[bot]") == env.VM_EVIDENCE_BY
                           then 0 else 1 end),
                          (if ($c.userContentEdits.nodes | type) == "array" then 0 else 1 end),
                          (if ($c.userContentEdits.totalCount // 0) > 100 then 1 else 0 end),
                          ([$c.userContentEdits.nodes[]?
                            | select(.editor.__typename != "Bot" or (.editor.login // "") != $who)] | length)
                       ] | add' 2> "$err")" \
               || { echo "::warning::the editors of pull request $VM_PR's evidence comment cannot be read:"\
                      "$(tr '\r\n' '  ' < "$err")"; strangers=unread; }
              rm -f "$err"
              [ "$strangers" = 0 ] || said=
            fi
            # end of vm evidence
            [ -n "$said" ] || \
              no "pull request $VM_PR has no VM evidence comment for its head $VM_HEAD (or its comments cannot be read)"
            { grep '^key ' <<< "$said" || [ $? -eq 1 ]; } | sed "s/^key /$VM_PR /" >> "$RUNNER_TEMP/vm-key-prs.txt"
            evidence="${evidence:+$evidence, }#$VM_PR $VM_HEAD $(head -n 1 <<< "$said")"
          done
          cut -d' ' -f2,3 "$RUNNER_TEMP/vm-key-prs.txt" > "$RUNNER_TEMP/vm-keys.txt"
          # every planned part is a unit's build, with the key its check of record ran on (plan.vm_evidence_keys)
          [ -s "$RUNNER_TEMP/plan.json" ] || no "the plan left no parts to read"
          # A unit whose pull request's evidence recorded another key: the comment is the App's (above) and was
          # measured on another tree, so a check here would measure a tree its owner never measured, and would hold
          # every entry behind it meanwhile.  That entry leaves the queue instead: a group that fails takes out the
          # entry its branch names and no other (GitHub, "Managing a merge queue"), so this group may fail for its
          # own last entry alone; an earlier entry's stale key leaves this group its checks, and the group its own
          # branch names takes it out.  Only a unit one pull request recorded, under one key, answers here: a unit
          # two pull requests recorded, or one recorded under two keys, is left to the key comparison below.
          stale=$(PYTHONPATH=base/tools python -c 'import json, sys; from oft import plan
          recorded = {}
          for line in open(sys.argv[2]):
              number, unit, key = line.split()
              recorded.setdefault(unit, set()).add((number, key))
          for part in json.load(open(sys.argv[1])).get("parts", []):
              if not part.get("check") or part.get("part") != "build":
                  continue
              rows = recorded.get(part["unit"], set())
              if len(rows) != 1:
                  continue
              (number, was), = rows
              if was != part["key"] and not plan.rulings_allow(part["components"], was):
                  print(number, part["unit"], was, part["key"])' \
            "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/vm-key-prs.txt") \
            || no "the planned parts' keys cannot be read"
          if [ -n "$stale" ]; then
            # only the shape this step prints answers, as the verdict below takes only its two words: anything
            # else is a reading that did not happen, and the checks run here
            while read -r line; do
              [[ "$line" =~ ^[0-9]+\ [^\ ]+\ [0-9a-f]{64}\ [0-9a-f]{64}$ ]] \
                || no "a key that differs was not read as one pull request, one unit and two keys: $line"
            done <<< "$stale"
            # A pull request's run: its evidence was measured on another tree (its head moved after that check, or
            # something the check reads moved on the base), so the check runs here, on this run's tree
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              read -r stale_pr stale_unit stale_was stale_key <<< "$(head -n 1 <<< "$stale")"
              stale_said="pull request $stale_pr's VM evidence recorded key $stale_was for $stale_unit"
              no "$stale_said and this run's key for it is $stale_key"
            fi
            # the last entry's own, if it has one: that is the entry a failure here takes out
            own=$(awk -v last="$last" '$1 == last { print; exit }' <<< "$stale")
            read -r stale_pr stale_unit stale_was stale_key <<< "${own:-$(head -n 1 <<< "$stale")}"
            stale_said="pull request $stale_pr's VM evidence recorded key $stale_was for $stale_unit and this"
            stale_said="$stale_said group's key for it is $stale_key"
            if [ -n "$own" ]; then
              echo "::error::$stale_said: this entry leaves the merge queue, for its owner to measure"\
                "$stale_unit again at its new head and queue it again"
              echo "### this entry leaves the merge queue: $stale_said" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            no "$stale_said, and pull request $stale_pr is not this group's last entry $last, the one a failure"\
              "here would take out"
          fi
          verdict=$(PYTHONPATH=base/tools python -c 'import json, sys; from oft import plan
          ok, why = plan.vm_evidence_keys(json.load(open(sys.argv[1])).get("parts", []),
                                          open(sys.argv[2]).read().splitlines())
          print(("ok " if ok else "no ") + why)' "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/vm-keys.txt") \
            || no "the planned parts' keys cannot be read"
          case "$verdict" in
            ok\ *) echo "${verdict#ok }" ;;
            no\ *) no "${verdict#no }" ;;
            *) no "the planned parts' keys were not read ($verdict)" ;;
          esac
          { echo "checked_elsewhere=true"
            echo "checked_elsewhere_note=merge-pr.sh's VM evidence, each planned part's key equal to its check of"\
              "record's: $evidence"; } >> "$GITHUB_OUTPUT"
          # as a deferred check does: an empty plan file leaves the drafts step plan=[] and draft_legs=[], so no
          # check job and no fetch-drafts leg (whose token has contents: write) has a group to start
          : > "$RUNNER_TEMP/plan.json"
          echo "::notice::$of was checked on a VM, at a tree with these parts' keys: no check job runs here;"\
            "the evidence: $evidence"
          { echo "### no part is checked here: $of was checked on a VM, at a tree with these parts' keys"
            echo "The evidence: $evidence"; } >> "$GITHUB_STEP_SUMMARY"
      - name: for each group of the plan, its binaries in a release this read-only token cannot see (a draft)
        id: drafts
        # The action is the base's, like the tools: a GitHub App can change .github/actions/ with the Contents
        # permission alone, while this file needs the Workflows permission too, so the change's copy of the action
        # is not trusted.  The tools it reads the pins with are the ones the check jobs run, which the step above
        # named: the base's, or, for the change the base pins, that change's own, which alone can read its facts.
        uses: ./base/.github/actions/plan-drafts
        with:
          plan-file: ${{ runner.temp }}/plan.json
          tools: ${{ github.workspace }}/${{ steps.plan.outputs.tools }}/tools
          # the pins the check jobs read, by the tools they run: a release pull request's own facts, any
          # other change's base's
          root: ${{ github.workspace }}/${{ env.KIND == 'release' && 'head' || 'base' }}
      # A fork's pull request gets a read-only token whatever a job asks for, so fetch-drafts could not read the drafts.
      - name: a pull request from a fork needs no draft binary
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          DRAFT_LEGS: ${{ steps.drafts.outputs.draft_legs }}
        run: |
          set -euo pipefail
          [ "$DRAFT_LEGS" = '[]' ] || {
            echo "::error::this change needs draft binaries, which a pull request from a fork cannot read: its token is read-only. A maintainer runs the change again from a branch in this repository. A fork's pull request that needs no draft binary is unaffected."; exit 1; }
          echo "a pull request from a fork, and no draft binary needed"
      - name: what the change can reach beyond the harnesses it names
        id: reach
        env:
          BASE: ${{ steps.base.outputs.base }}
          ROUTED: ${{ steps.base.outputs.routed }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed.txt"
          # Every event is routed by its own change, the paths changed.txt lists: a push to main and a merge queue
          # group as a pull request is.  The tools' tests (with their whole-tree lint) and the controls run whatever
          # the paths for a change to the workflows, which run as the change has them; to a .gitattributes file, which
          # changes how git checks out any file (line ends, encoding); for a path git still quotes (one with a '"', a
          # '\' or a control character), which no pattern below can read; and for a push with no base to compare with
          # (not routed: the base step), whose every path counts as changed (the lint job reads every file for it too).
          full=false
          if [ "$ROUTED" != true ] || grep -qE '^(\.github/|")|(^|/)\.gitattributes$' "$changed"; then
            full=true
          fi

          # The tests' whole-repository lint (test_this_repository_is_clean).  lint runs the base's tools over the
          # change's tree.  The change's own tools differ from the base's only in what the change touches under
          # tools/; if that is only data under tools/oft/tests/ (fixtures, which both runs read only as files of the
          # tree; no Python file, since a test module runs in the same process as that test and could change what it
          # sees), tools/oft/ci/ (shell scripts) or tools/oft/README.md, the two runs are the same code, and lint's run
          # covers the test's: over the whole tree, or, with --changed-only, over the changed files with each other
          # file's verdict as at the base (the lint step says when that holds).  Anything else under tools/ runs that
          # test.  So does a .gitattributes, which can change the bytes checkout writes for the change's tools; a
          # path git quotes, which no pattern here can read; and a run with no base to compare with.  A change to
          # .github/ alone does not (unlike the tests and the controls, above and below): the workflows are no code of
          # the tools that lint, so the test would run the base's lint over the same tree a second time, on a whole
          # checkout and a 16-core runner (the tests job), where the lint job has read it already.  Before 2026-11-03
          # it did: 7 of the 44 changes to main of 1-3 November that ran this test changed .github/ and no tool.
          if [ "$ROUTED" != true ] || grep -qE '^"|(^|/)\.gitattributes$' "$changed" ||
             grep -qP '^tools/(?!oft/(tests/(?!.*\.py$)|ci/|README\.md$))' "$changed"; then
            echo "repository_lint=true" >> "$GITHUB_OUTPUT"
            echo "the tests lint the whole tree with this change's tools"
          else
            echo "repository_lint=false" >> "$GITHUB_OUTPUT"
            echo "tools/ unchanged but for test data, ci/ and README.md: lint's run covers the tests' whole-tree lint"
          fi

          # The tools' own tests.  They read tools/ (their code, fixtures and scripts), the workflow files whose
          # steps they run (tools/oft/tests/test_keys.py the plan steps of .github/workflows/pr.yml and
          # release-check.yml, tools/oft/tests/test_lint.py the lint step of pr.yml, and
          # tools/oft/tests/test_facts_review_gate.py facts-review.yml), the composite action the plan job runs,
          # .github/actions/plan-drafts, whose step tools/oft/tests/test_workflow_verdicts.py reads, .github/CODEOWNERS,
          # the facts review's skill, .claude/skills/review-facts/SKILL.md, and what that review checks, review.md
          # (tools/oft/tests/test_facts_review_scripts.py), the released-proof index's builder, .github/proof-index.py
          # (tools/oft/tests/test_proof_index.py), the repository's release.yaml (tools/enroll/tests/test_facts.py, run
          # by tools/oft/tests/test_enroll_tools.py), .gitattributes (tools/oft/tests/test_layout.py), and the
          # repository-root wrapper ./oft (tools/oft/tests/test_wrapper.py, which holds its list of the packages
          # requirements.txt pins to that file); the one test
          # that reads the rest of the tree, test_this_repository_is_clean, is skipped below unless repository_lint, and
          # lint's run covers it.  That is every file of the repository they open: run under strace -f with that test
          # skipped, the tests open nothing else outside tools/.  A change that touches none of these runs the same
          # tests over the same bytes as its base, so they do not run again (a change under .github/ or to a
          # .gitattributes runs them in full, above).
          if [ "$full" = true ] || grep -qE '^(tools|\.claude/skills)/|^(oft|release\.yaml|review\.md)$' "$changed"; then
            echo "tests=true" >> "$GITHUB_OUTPUT"
            echo "the tools' tests run"
          else
            echo "tests=false" >> "$GITHUB_OUTPUT"
            echo "nothing under tools/, .claude/skills/ or .github/, and no oft, release.yaml or review.md, changed: the tools' tests do not run"
          fi

          # The controls: `dune build @theories/default @tests/default` and tests/check.sh in the checker image that
          # release.yaml's images.checker names.  They read theories/, tests/, toolchain/ and that image; dune also
          # reads every dune, dune-project and dune-workspace file of the tree.  A change that touches none of these
          # leaves their outcome as it is at its base, the same bytes in the same image,
          # so they do not run again.  Whether a changed release.yaml names another image is the base's tools' to say
          # (plan.images_differ, which compares images.checker and images.runner, the keys a check reads); an
          # error there, such as base tools older than that function, counts as another image.
          new_image=false
          if grep -qxF release.yaml "$changed" && ! PYTHONPATH=base/tools python -c 'import sys; from oft import plan
          sys.exit(int(plan.images_differ("head/release.yaml", "base/release.yaml")))'; then
            new_image=true
          fi
          # A proof directory's dune file (proofs/<p>/<h>/<s>/dune and proofs/<p>/<h>/lib/dune; in the per-project
          # layout projects/<p>/<h>/proofs/<s>/dune and projects/<p>/<h>/proofs/lib/dune, with the barrier dune files
          # projects/<p>/<h>/proofs/dune and projects/<p>/<h>/counterexamples/dune, tools/oft/layout.py) is generated:
          # lint's `oft generate --check` holds it equal to its rendering, which declares that proof's own theory (or,
          # for a barrier, shuts the folder out of the statement theory above it) and nothing the controls build, so on
          # its own it leaves their outcome as the base's.  It counts when the renderer, tools/oft/, changes with it.
          # (Measured on release/pau-projects-recipes: every proof pull request ran the controls for this file alone,
          # about 8 minutes each.)
          # proofs/lib/ (the old shared proof library, which no path pattern admits now) is hand-written: its dune files
          # always count.
          dune='^(proofs/(?!lib/)[^/]+/[^/]+/[^/]+|projects/[^/]+/[^/]+/proofs(/[^/]+)?'
          dune+='|projects/[^/]+/[^/]+/counterexamples)/dune$'
          grep -q '^tools/oft/' "$changed" && generated='^$' || generated=$dune
          # LC_ALL=C: grep reads bytes; under a UTF-8 locale it drops a line that is not valid UTF-8, which then could
          # never run the controls
          LC_ALL=C grep -vP "$generated" "$changed" > "$RUNNER_TEMP/controls-changed.txt" || true
          if [ "$full" = true ] || [ "$new_image" = true ] ||
             grep -qE '^(theories|tests|toolchain)/|(^|/)dune(-project|-workspace)?$' \
               "$RUNNER_TEMP/controls-changed.txt"; then
            echo "controls=true" >> "$GITHUB_OUTPUT"
            echo "the controls run"
          else
            echo "controls=false" >> "$GITHUB_OUTPUT"
            echo "no input of the controls changed: they do not run"
          fi

          # The stream tools check: a change under dev/stream/ runs it, and a change that touches no path under
          # dev/stream/ does not (Dispatch issue OSSV-276).  dev/stream/ holds the stream's operational tools, which
          # run on the stream's boxes from the commit `ossv-tools deploy` deployed and which no other job of this
          # workflow reads: a part's key holds projects/, proofs/, counterexamples/, findings/, theories/,
          # toolchain/allowed-axioms.txt, dune-project, the two image digests and the checker, which keys.checker
          # reads from tools/ alone, so no path of dev/stream/ is in any key (dev/stream/README.md) and such a change plans
          # no harness and reaches no enrollment either.  This answer alone does not follow `full`, so that a change
          # under .github/ or to a .gitattributes does not make every pull request pay for it; a push with no base
          # to compare with still runs it, since there every path of the tree counts as changed.
          # The paths under dev/stream/ this change touches go to that job as well, with the lines where the change
          # knows them.  Its checker reads an imported file against the bytes it was imported with: one whose
          # bytes still hash to its manifest.d/ entry carries nothing anybody here wrote, and one whose bytes
          # moved away is read on the lines that differ from that import, together with the lines named here
          # (dev/stream/src/ossv/tools_check.py, its lint_scope).  So a row is `dev/stream/<path>` or
          # `dev/stream/<path>:<start>-<end>`, one of the latter per run of written lines; without them a tool this
          # pull request rewrites would answer for the import's lines alone and nothing of what it wrote here.
          # A file this change ADDS carries no hunk row: for this repository's own code that costs nothing (it
          # is read whole), and an imported file is judged against its row, not against a base that never held
          # it.
          # Why this step works the lines out, when the stream_tools job now takes the whole history and could
          # work them out itself: one parser of `git diff --unified=0` in this repository instead of two — the
          # awk that used to stand here was the second, and the `++ ` defect below is what two parsers cost —
          # and this step resolves the base once for every job of the run, so a second reader of the change
          # does not grow a second answer to what the base is.  Neither reason is necessity; the shape is the
          # right one regardless.
          # `^"?dev/stream/`: git quotes a path holding a '"', a '\' or a control character whatever core.quotePath
          # says, and a quoted line that did not match '^dev/stream/' used to skip this job altogether while `required`
          # stayed satisfied, which was widest for the worst names.
          if grep -qE '^"?dev/stream/' "$changed"; then
            echo "stream_tools=true" >> "$GITHUB_OUTPUT"
            echo "the stream tools check runs"
            stream_changed="$RUNNER_TEMP/stream-changed-plan.txt"
            grep -E '^"?dev/stream/' "$changed" > "$stream_changed"
            # The hunk rows come from the checker's own parser of `git diff --unified=0`
            # (dev/stream/src/ossv/tools_check.py, parse_diff), which `--write-changed` runs over the diff from
            # $BASE and writes as those rows; this step reads that output nowhere itself.  The awk that used to
            # parse it here was a second parser of the same five rules, and it took a changed line whose own
            # text begins `++ ` for a `+++ b/path` header, so that file's every later hunk was attributed to a
            # name which is not a file and was read on no line (the review of pull request 496, round 2).
            # This is the one place the change's own code runs in this job, whose every other answer comes from
            # the base's tools, so it runs with the workflow's command channel out of its environment: it writes
            # rows on its stdout and can set no output, no variable and no step summary of this job.
            # A change under dev/stream/ that this branch's base cannot route has no base to diff against, which
            # is the one case with no hunk rows to write; the checker itself is part of the tree, and a change
            # that deletes it fails here rather than passing with the paths alone.
            if [ "$ROUTED" = true ]; then
              env -u GITHUB_OUTPUT -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_STATE -u GITHUB_STEP_SUMMARY \
                -u GH_TOKEN python head/dev/stream/bin/ossv-tools-check \
                --root head/dev/stream --changed-since "$BASE" --write-changed - >> "$stream_changed"
            fi
            echo "the stream tools check reads $(grep -c ':[0-9]*-[0-9]*$' "$stream_changed" || true) hunk(s)"
            # The rows go to the stream_tools job as this run's artifact `stream-changed`, not as a job output: a
            # change that brings dev/stream/ whole writes a row per file and per hunk, and as an output that list
            # became the environment of the job's step, which failed to start ("Argument list too long", run
            # 41439353720 of pull request 496, the first into main).
            mkdir -p "$RUNNER_TEMP/stream-changed"
            mv "$stream_changed" "$RUNNER_TEMP/stream-changed/stream-changed.txt"
          else
            echo "stream_tools=false" >> "$GITHUB_OUTPUT"
            echo "nothing under dev/stream/ changed: the stream tools check does not run"
          fi
          # The test files of dev/stream/bin/ that the stream_tools job leaves out because one process of them takes
          # too long or once failed there (dev/stream/tests/outside_tests.tsv), which the farm_tests job runs instead,
          # each in its own legs, when a path it reads changes.  The table below names each file, its legs and the
          # paths it reads (an ERE over changed.txt); dev/stream/tests/test_repo_checks.py holds each row's paths to
          # the files its tests run, and holds those to the standard library's imports.  Every pytest run also reads
          # dev/stream/conftest.py and pyproject.toml, with the pytest dev/stream/uv.lock pins.
          #   test_ossv_job_farm.py, the farm runner's: it runs bin/ossv-job and bin/ossv-job-farm as subprocesses and
          #     loads both with importlib.  One process took over 900 s, 79 of 119 cases done when CI stopped it on
          #     2026-11-03 (the run of pull request 961).  6 legs: in run 41810453064 of pull request 1758 main's 213
          #     cases took 3,145 s on the standard runner, 639, 769, 802 and 934 s in 4 legs (the slowest 15.6 min),
          #     and in run 41814246039, 6 legs, 676, 549, 487, 675, 290 and 506 s (11.3 min, 58 billed minutes as for 4).
          #   test_ossv_n6.py, the N6 driver's: it runs bin/ossv-n6-farm, bin/ossv-n6-pod and bin/ossv-n6-shards, and
          #     bin/ossv-job-farm through a wrapper the driver takes as $OSSV_JOB (every case points that at a stand-in,
          #     so bin/ossv-job is not read).  1 leg: its 120 cases took 121 s in one process on a box at load 300.
          # A change to the farm_tests job, or to this table, runs every row: the job's parsed text and the table's
          # lines at the head against the base's (read from git: a release's base worktree holds no
          # .github/workflows), so a comment elsewhere or another job's change does not, and a read that fails counts
          # as a change.  A run with no base lists every path as changed and so runs every row.  A change to .github/
          # alone does not, unlike the tools' tests above: pr.yml changed in 152 of main's 1,265 merges of 2026-10-21
          # to 11-04, and none of those could reach these tests unless it changed this job.  A row whose file is not in
          # the tree runs nothing (theorem-labs/oss-verify-proofs: the release cut removes dev/stream/).
          # farm suites
          farm_suites=(
            'test_ossv_job_farm.py 6 ^dev/stream/(bin/(ossv-job|ossv-job-farm|test_ossv_job_farm\.py)|conftest\.py|pyproject\.toml|uv\.lock)$'
            'test_ossv_n6.py 1 ^dev/stream/(bin/(ossv-job|ossv-job-farm|ossv-n6-farm|ossv-n6-pod|ossv-n6-shards|test_ossv_n6\.py)|conftest\.py|pyproject\.toml|uv\.lock)$'
          )
          # end of farm suites
          # the comparison only where a row's file is in the tree: a tree with none runs no row whatever pr.yml says
          farm_here=false
          for suite in "${farm_suites[@]}"; do [ ! -f "head/dev/stream/bin/${suite%% *}" ] || farm_here=true; done
          farm_job=false
          if [ "$farm_here" = true ] && [ "$ROUTED" = true ] && grep -qxF .github/workflows/pr.yml "$changed"; then
            if ! git -C head show "$BASE:.github/workflows/pr.yml" > "$RUNNER_TEMP/base-pr.yml" ||
               ! python -c 'import re, sys, yaml
          def farm(path):
              text = open(path, encoding="utf-8").read()
              table = re.search(r"\n *# farm suites\n(.*?)\n *# end of farm suites\n", text, re.S)
              return (yaml.safe_load(text) or {}).get("jobs", {}).get("farm_tests"), table and table.group(1)
          sys.exit(int(farm(sys.argv[1]) != farm(sys.argv[2])))' head/.github/workflows/pr.yml "$RUNNER_TEMP/base-pr.yml"; then
              farm_job=true
            fi
          fi
          # one matrix leg per {file, index, count}: the farm_tests job runs case i of the file when i % count == index
          farm_legs='[]'
          for suite in "${farm_suites[@]}"; do
            read -r file count paths <<< "$suite"
            [ -f "head/dev/stream/bin/$file" ] || continue
            if [ "$farm_job" = true ]; then
              why="the farm_tests job or its table changed"
            elif grep -qE "$paths" "$changed"; then
              why="a file they read changed"
            else
              echo "nothing the tests of bin/$file read changed: they do not run"
              continue
            fi
            farm_legs=$(jq -c --arg file "$file" --argjson count "$count" \
              '. + [range($count) as $i | {file: $file, index: $i, count: $count}]' <<< "$farm_legs")
            echo "the tests of bin/$file run in $count leg(s) ($why)"
          done
          echo "farm_legs=$farm_legs" >> "$GITHUB_OUTPUT"
          echo "farm_tests=$([ "$farm_legs" != '[]' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          { echo "### beyond the harnesses (full: $full)"
            grep -E '^(repository_lint|tests|controls|stream_tools|farm_tests|farm_legs)=' "$GITHUB_OUTPUT" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          # The image the controls run in, read here with the base's PyYAML; anything but a checker digest is left out,
          # and the controls job refuses an empty one.
          checker=$(python -c 'import yaml; print(yaml.safe_load(open("head/release.yaml"))["images"]["checker"])') || true
          [[ "$checker" =~ ^ghcr\.io/theorem-labs/oss-fuzz-theorems-checker@sha256:[0-9a-f]{64}$ ]] || checker=
          echo "checker=$checker" >> "$GITHUB_OUTPUT"
      - name: the paths under dev/stream/ this change touches, for the stream_tools job
        if: ${{ steps.reach.outputs.stream_tools == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: stream-changed
          path: ${{ runner.temp }}/stream-changed/stream-changed.txt
          if-no-files-found: error
          retention-days: 7

      # THE LAST PASSING LINT OF THIS PULL REQUEST.  A push to a pull request is linted against the tree its last
      # passing lint read, when that lint's record holds, so that a file no push since then changed is not read
      # again: the per-file text rules give a file the same verdict when its bytes, its attributes, the tools that
      # judge it and the files every verdict reads are the same, and lint --changed-only falls back to every file
      # when one of the last two differs (tools/oft/lint.py, read_by_every_verdict).  The lint job writes the record
      # after its lint step passed with the base's tools, before any step runs the change's own code: the pull
      # request's number, the kind of change (KIND), the branch it goes into (INTO), the base's tools/ tree id, and
      # the two parents and the tree of the merge commit it linted.
      # It is kept in the Actions cache under that pull request's ref, which no other pull request, merge queue
      # group or push can read (GitHub scopes a cache to the ref that saved it, and lets a run read its own ref's,
      # its base branch's and the default branch's; the key names the pull request as well).  So the merge queue's
      # lint, which is the one main takes, never reads one.  A record is read only when every part of it holds:
      #   - it names this pull request, this run's kind of change and the branch the pull request goes into: lint
      #     reads other paths for a contributor than for a maintainer (--pr-kind), an author's association can
      #     change between two pushes, and a lint into main reads only the files changed since the base, so its
      #     pass says nothing of a whole tree that a pull request retargeted at another branch must pass;
      #   - the base's tools/ tree id it names is this run's.  The licence-pending entries the lint reads from the
      #     base (--pending-base) are in tools/oft/lint-exceptions.yaml, inside tools/, so they are part of that id;
      #   - its two parents can be fetched, merge with no conflict (git merge-tree, as GitHub builds the merge
      #     commit of a pull request), and merge to exactly the tree it names;
      #   - no file of a fuzz target that a licence-pending entry names (layout.unit_of, as lint maps a finding to
      #     its unit; the entries of the base, which --pending-base reads, and of this tree, which lint applies)
      #     differs from that tree.  Whether such an entry is still needed ("unit U has no licence finding: its
      #     licence series removes its licence-pending entry") only a lint of every file says (tools/oft/lint.py,
      #     apply_pending), so a push that fixed the unit's last licence line and kept its entry would pass
      #     against a record where, into a branch other than main, the rule without one fails it.
      # Anything else (no record, a cache that cannot be read, a part that does not hold) is no record, and lint
      # reads as it would without one: the rule at the lint step.  The tree is made a commit here, never pushed,
      # for lint --changed-only to compare with.  The lint job runs the same step on the record this job read
      # (its key, the `lint_record` output), and takes the verdict from its own reading.
      - name: the key of this pull request's lint records, by the base's tools
        id: lint_record_key
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ steps.base.outputs.base }}
          PR: ${{ github.event.pull_request.number }}
          INTO: >-
            ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.event.pull_request.base.ref)
            || github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.ref }}
        run: |
          set -euo pipefail
          tools=$(git -C head rev-parse --verify --quiet "$BASE:tools") || tools=
          [[ "$tools" =~ ^[0-9a-f]{40}$ ]] || { echo "the base has no tools/ tree: no lint record is read"; exit 0; }
          # a cache key holds no comma; the record names INTO as it is
          echo "prefix=lint-pass-3-pr$PR-$KIND-${INTO//,/%2C}-$tools-" >> "$GITHUB_OUTPUT"
      - name: the record of this pull request's last passing lint, by the base's tools
        id: lint_record_restore
        if: steps.lint_record_key.outputs.prefix != ''
        # A cache that cannot be read is no record (lint_since then reads none), never a failed plan.
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/lint-record
          # no entry has this key: restore-keys takes the newest entry of this pull request and these tools
          key: ${{ steps.lint_record_key.outputs.prefix }}none
          restore-keys: ${{ steps.lint_record_key.outputs.prefix }}
      - name: the tree of the last passing lint, when its record holds
        id: lint_since
        if: github.event_name == 'pull_request'
        env:
          MATCHED: ${{ steps.lint_record_restore.outputs.cache-matched-key }}
          RECORD: ${{ runner.temp }}/lint-record/record
          BASE: ${{ steps.base.outputs.base }}
          PR: ${{ github.event.pull_request.number }}
          INTO: >-
            ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.event.pull_request.base.ref)
            || github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.ref }}
        run: |
          set -euo pipefail
          since= record=
          none() { echo "no lint record is read: $1"; }
          hex='^[0-9a-f]{40}$'
          if [ -z "$MATCHED" ]; then
            none "none was restored (no lint of this pull request with these tools passed, or the cache was not read)"
          elif [ ! -f "$RECORD" ]; then
            none "the entry $MATCHED holds no record"
          else
            r_pr= r_kind= r_into= r_tools= r_p1= r_p2= r_tree=
            while read -r k v w; do
              case "$k" in
                pr) r_pr=$v ;; kind) r_kind=$v ;; into) r_into=$v ;; tools) r_tools=$v ;;
                parents) r_p1=$v; r_p2=$w ;; tree) r_tree=$v ;;
              esac
            done < "$RECORD"
            tools=$(git -C head rev-parse --verify --quiet "$BASE:tools") || tools=
            if [ "$r_pr" != "$PR" ]; then
              none "the record names pull request '$r_pr', not $PR"
            elif [ "$r_kind" != "$KIND" ]; then
              none "the record names the kind of change '$r_kind', and this run's is $KIND"
            elif [ "$r_into" != "$INTO" ]; then
              none "the record is of a lint into '$r_into', and this run's is into $INTO"
            elif ! [[ "$r_tools" =~ $hex && "$r_p1" =~ $hex && "$r_p2" =~ $hex && "$r_tree" =~ $hex ]]; then
              none "the record does not name four object ids"
            elif [ "$r_tools" != "$tools" ]; then
              none "the record's base tools/ tree is $r_tools, and this run's is ${tools:-unreadable}"
            else
              deepen=()
              [ "$(git -C head rev-parse --is-shallow-repository)" != true ] || deepen=(--unshallow)
              if ! git -C head fetch --no-tags --filter=blob:none "${deepen[@]}" origin "$r_p1" "$r_p2"; then
                none "the parents the record names, $r_p1 and $r_p2, cannot be fetched"
              elif ! tree=$(git -C head merge-tree --write-tree --no-messages "$r_p1" "$r_p2"); then
                none "the parents the record names do not merge cleanly"
              elif [ "$tree" != "$r_tree" ]; then
                none "the parents the record names merge to $tree, not to the tree $r_tree it names"
              elif ! held=$(git -c core.quotePath=false -C head diff --no-renames --name-only "$tree" HEAD \
                  | PYTHONPATH=base/tools python -c '
          import sys
          from oft import layout, lint
          units = set(lint.base_pending_entries("base")) | set(lint.base_pending_entries("head"))
          changed = sys.stdin.buffer.read().decode("utf-8", "surrogateescape").splitlines()
          print(" ".join(sorted({u for u in map(layout.unit_of, changed) if u is not None and u in units})))'); then
                none "the licence-pending entries of the base and of this tree cannot be read"
              elif [ -n "$held" ]; then
                none "a file of $held, which a licence-pending entry names, differs from that tree"
              else
                since=$(git -C head -c user.name=pr.yml -c user.email=pr.yml@invalid commit-tree "$tree" \
                  -m "the tree the last passing lint of pull request $PR read (made here, never pushed)")
                record=$MATCHED
                echo "lint record $MATCHED holds: lint compares with the tree $tree, as commit $since"
              fi
            fi
          fi
          { echo "since=$since"; echo "record=$record"; } >> "$GITHUB_OUTPUT"

      # Whether lint's per-file text rules will read ONLY the changed files, which is which runner the lint
      # job needs: the per-file arm is minutes of work, the whole-tree arm some 36 CPU-minutes over proofs/.
      # The lint job cannot answer it before it starts, so this job answers it for its `runs-on`; the lint
      # step keeps its own rule and gives the verdict.  This answer is the stricter of the two: the lint
      # step's clauses (a record that holds, or routed; and the base's tools take --changed-only)
      # and two more, the plan's `tools` answer (`head` brings a second whole-tree lint with the change's own
      # tools) and whether a changed path is one a verdict on another file may read (lint.read_by_every_verdict,
      # which has lint fall back to the whole tree).  A changed path is one that differs from what the lint
      # step compares with: the last passing lint's tree when the record holds (the lint job restores the record
      # this job read, by its key), the base otherwise.  So `true` puts a whole-tree lint on the small runner in
      # one case only: the lint job's own reading of the record does not hold where this job's did (the entry
      # was evicted in between, or a parent could not be fetched there).  Its lint step then takes the rule
      # without a record, which (when a path read_by_every_verdict names changed since the base, or the change is
      # not routed) is every file: the same verdict as on the larger runner, slower (50.3
      # minutes against 15.0, run 40788123995 against run 41330868783), and the lint job's step "the record the
      # plan read still holds here" warns of it.  `false` costs only the larger runner for a per-file lint.
      - name: whether lint reads only the changed files
        id: lint_gate
        env:
          ROUTED: ${{ steps.base.outputs.routed }}
          PLANNED_TOOLS: ${{ steps.plan.outputs.tools }}
          SINCE: ${{ steps.lint_since.outputs.since }}
        run: |
          set -euo pipefail
          answer=false
          # what the lint step compares with, the paths that differ from it, and whether it takes --changed-only
          compared=
          if [ -n "$SINCE" ]; then
            git -c core.quotePath=false -C head diff --no-renames --name-only "$SINCE" HEAD > "$RUNNER_TEMP/changed-since.txt"
            compared="$RUNNER_TEMP/changed-since.txt"
          elif [ "$ROUTED" = true ]; then
            compared="$RUNNER_TEMP/changed.txt"
          fi
          if [ -n "$compared" ] && [ "$PLANNED_TOOLS" != head ] \
              && grep -q -- '"--changed-only"' base/tools/oft/__main__.py \
              && PYTHONPATH=base/tools python -c '
          import sys
          from oft import lint
          changed = open(sys.argv[1], encoding="utf-8", errors="surrogateescape").read().splitlines()
          every = [rel for rel in changed if rel and lint.read_by_every_verdict(rel)]
          if every:
              print("a verdict on another file may read %s: lint reads every file" % every[0])
          sys.exit(1 if every else 0)' "$compared"; then
            answer=true
          fi
          echo "lint_changed_only=$answer" >> "$GITHUB_OUTPUT"
          echo "lint reads only the changed files: $answer"
          # Whether the lint job checks out the tree without the proof libraries (4.56 GB of the 4.66 GB this job's
          # own checkout leaves out, the checkout step above): only for a pull request whose lint reads only the
          # changed files, and only when the base's tools judge the names of the files such a checkout leaves out
          # (lint.check_paths takes `unread`).  The lint job then checks out every left-out file that differs from
          # what it compares with, so lint reads the bytes of every changed file, and an unchanged file keeps the
          # verdict its bytes had there.  A merge queue group and a push to main keep the whole tree: their lint reads
          # every file's bytes, so nothing reaches main that a whole-tree lint did not read.  The full checkout took
          # 1468 s of lint job 126178235205's 1580 s (2026-11-03 20:15Z); this one takes seconds (the step above).
          left_out=false
          if [ "$answer" = true ] && [ "${GITHUB_EVENT_NAME:-}" = pull_request ] \
              && PYTHONPATH=base/tools python -c '
          import inspect, sys
          from oft import lint
          sys.exit(0 if "unread" in inspect.signature(lint.check_paths).parameters else 1)'; then
            left_out=true
          fi
          echo "lint_files_left_out=$left_out" >> "$GITHUB_OUTPUT"
          echo "lint checks out the tree without the proof libraries: $left_out"

  lint:
    # The plan job decides which tools judge this change (its `tools` output), and queue_run says whether a merge
    # queue run already checked this push; lint waits for both.  Not on a draft (the plan's hold step reads it from the
    # pull request as it is now): a draft's head is not the one that merges, and lint, which every job after it waits
    # for, takes them all with it; marking it ready for review runs this workflow again in full (the header says how
    # required reads such a run).
    needs: [plan, queue_run]
    if: ${{ !cancelled() && needs.queue_run.outputs.checked != 'true' && needs.plan.outputs.hold != 'draft' }}
    # Which runner: the plan job's `lint_changed_only`, the one answer to "will the per-file text rules read
    # only the changed files?" (its lint_gate step lists every clause).  The per-file arm is minutes of work
    # (lint step median 0.27 min on 16 cores), so it takes the 4-core larger runner, where the whole job
    # measured 8.93 minutes against a median 5.3 on 16 (run 41336282390 against runs 41314662044 and
    # 41331348741): US$0.108 a run instead of US$0.252.  Every other change keeps 16 cores, because the
    # whole-tree arm is some 36 CPU-minutes over proofs/ and does NOT get cheaper by moving: 50.3 minutes on
    # 4 cores against 15.0 on 16 (run 40788123995 against run 41330868783), US$0.612 against US$0.630, for
    # 3.4 times the wall time on a job the whole run waits for.  Since 2026-11-03 a routed pull request into
    # any branch, not only main, takes the per-file arm (the lint step's comment says why the gate into main is
    # unchanged): before, 152 of 158 lint jobs into other branches in 14:00-22:00Z 2026-11-02 were whole-tree.
    # Disk, which is why neither arm is a standard runner: on a private repository's ubuntu-24.04 runner
    # this job ran out of disk at about 13.5 GB written (4.0 GB of history, the 8.46 GB head tree and
    # 1.03 GB of the base worktree); the 4-core larger runner has 150 GB and the 16-core one 600 GB.
    # Most of what is left is the checkout, not the runner: 4.95 of the 4-core job's 6.57 minutes is
    # actions/checkout of the 8.46 GB tree (4.08-4.38 of 5.3 on 16 cores), and the lint work itself is 0.63.
    # The checkout step below records the two ways of cutting it that were measured and refused.
    # To put every lint back on 16 cores, delete the condition.  A lint whose checkout leaves out the proof
    # libraries (the plan's `lint_files_left_out`) holds about 0.1 GB of files, so it takes the standard runner.
    runs-on: >-
      ${{ needs.plan.outputs.lint_files_left_out == 'true' && 'ubuntu-24.04'
      || needs.plan.outputs.lint_changed_only == 'true' && 'ubuntu-24.04-4core' || 'ubuntu-24.04-16core' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read   # the workflow's own, which a job's permissions replace
      actions: write   # the merge queue group's watch: `gh run cancel` of this run once its group is gone
    steps:
      # The merge queue group's watch, the same step as the check job's (the concurrency comment says why)
      - name: cancel this run once its merge queue group is gone
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          EVERY: "120"
          CONFIRM: "10"
        run: |
          set -euo pipefail
          # In the background for the rest of the job, whose end stops it (the runner stops a job's leftover
          # processes).  It reads the branch over git's own protocol, not the REST API, so it spends none of the
          # token's API budget; with the token in a header, as tools/oft/ci/facts-review-gather passes it, never in a
          # URL or an argument; from RUNNER_TEMP, outside every checkout, whose persisted header would be a second one.
          cat > "$RUNNER_TEMP/group-watch" <<'EOF'
          #!/bin/bash
          set -uo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_TERMINAL_PROMPT=0
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          cd "$RUNNER_TEMP" || exit 1
          # 2 is git ls-remote --exit-code's answer for a branch that does not exist (measured: 0 for a live group's
          # branch, 2 for a dropped group's, 128 without a usable token); any other failure is no answer
          gone() {
            local rc=0
            git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF" > /dev/null 2>&1 || rc=$?
            [ "$rc" -eq 2 ]
          }
          while :; do
            if gone && sleep "$CONFIRM" && gone; then
              echo "$(date -u +%FT%TZ) $GITHUB_REF does not exist, twice $CONFIRM s apart: the queue dropped this group, so run $GITHUB_RUN_ID is cancelled"
              gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
              exit
            fi
            sleep "$EVERY"
          done
          EOF
          chmod +x "$RUNNER_TEMP/group-watch"
          setsid "$RUNNER_TEMP/group-watch" >> "$RUNNER_TEMP/group-watch.log" 2>&1 < /dev/null &
          echo "watching $GITHUB_REF every $EVERY s: this run is cancelled once that branch is gone"
      # The whole tree, in a plain checkout, for every lint but a pull request's that reads only the changed files
      # (the plan's lint_gate step).  This step is most of the job: 4.95 of 6.57 minutes in run 41354738882, and
      # 1468 s of 1580 s in lint job 126178235205 (2026-11-03 20:15Z).  filter: blob:none alone was measured and
      # refused: every blob then arrives in a lazy fetch, 14.63 minutes against 4.95 on the same runner (run
      # 41360188391 against run 41354738882).
      - if: needs.plan.outputs.lint_files_left_out != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
      # The plan job's checkout, without the proof libraries but their generated dune files (oft generate --check
      # below compares those).  check_paths judges the names of the files it leaves out (lint.left_out), and the
      # step after lint_since checks out each of them that differs from what lint compares with.
      - if: needs.plan.outputs.lint_files_left_out == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/proofs/*/*/lib/*
            /proofs/*/*/lib/dune
            !/projects/*/*/proofs/lib/*
            /projects/*/*/proofs/lib/dune
      # The base and whether the change is routed are the plan job's (its base step decides them, once, for every
      # job); this step checks the base out (its tools and findings ledger too) and lists the paths from it, with the
      # plan's listing text (between `# routing` and `# end of routing`, which tools/oft/tests/test_keys.py holds
      # equal to the plan's).
      - name: the base branch, whose tools judge this change
        id: base
        env:
          PLAN_BASE: ${{ needs.plan.outputs.base }}
          PLAN_ROUTED: ${{ needs.plan.outputs.routed }}
        run: |
          set -euo pipefail
          trap 'df -h "$GITHUB_WORKSPACE"' EXIT
            head="$(git -C head rev-parse HEAD)"
            base="$PLAN_BASE"
            routed="$PLAN_ROUTED"
            [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the plan named no base ('$base')"; exit 1; }
            case "$routed" in
              # one commit of the base: this step compares two trees and reads no history (the ledger step fetches the
              # history it reads), and a clone of every branch's history does not fit beside the two trees on the disk.
              # Its trees but not its files (blob:none): the worktree below checks out only the base's tools/, findings
              # and top-level files, and git fetches just those blobs for it.  Fetching every file of the base took
              # 148-366 s of this step; without them it takes 1-3 s, with the same findings (measured 2026-10-31)
              true) git -C head fetch --no-tags --depth=1 --filter=blob:none origin "$base" || {
                      echo "::error::the base $base, which the plan judged this change against, cannot be fetched"; exit 1; } ;;
              # no base to compare with (the plan's base step): the base is the commit itself, and every path is changed
              false) [ "$base" = "$head" ] || {
                       echo "::error::the plan routed nothing, yet named the base $base, not this commit $head"; exit 1; } ;;
              *) echo "::error::the plan answered routed '$routed', neither true nor false"; exit 1 ;;
            esac
          # this job reads the base's trusted tools and findings ledger (findings/, or in the per-project layout
          # projects/<p>/unpatched.yaml and projects/<p>/<h>/findings/), and the files at the top of the tree the tools
          # need (release.yaml, whose runner the ledger comparison reads); nothing else
          git -C head worktree add --no-checkout --detach "$GITHUB_WORKSPACE/base" "$base"
          git -C base sparse-checkout set --no-cone '/*' '!/*/' '/tools/' '/findings/' '/projects/*/unpatched.yaml' '/projects/*/*/findings/'
          git -C base checkout --detach "$base"
          [ -d base/tools/oft ] || { echo "::error::the base branch has no tools/oft: nothing trusted to judge with"; exit 1; }
          # routing
          if [ "$routed" = true ]; then
            # --no-renames: a renamed file is its old path and its new one; with renames, git lists only the new.
            # core.quotePath=false: a name with a byte above 0x7f is listed as it is, not quoted.
            git -c core.quotePath=false -C head diff --no-renames --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          else
            # every path of the tree, listed as the diff lists a changed one
            git -c core.quotePath=false -C head ls-tree -r --name-only HEAD > "$RUNNER_TEMP/changed.txt"
            echo "no base to compare with: every path of the tree counts as changed"
          fi
          { echo "base=$base"; echo "routed=$routed"; } >> "$GITHUB_OUTPUT"
          echo "changed paths: $(wc -l < "$RUNNER_TEMP/changed.txt"); kind of change: $KIND"
          # end of routing
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: the tools' dependencies (PyYAML, idna), hash-pinned, from the base
        run: python -m pip install --quiet --require-hashes -r base/tools/oft/requirements.txt
      - name: the findings ledger over the change's history, by the base's rules
        env:
          BASE: ${{ steps.base.outputs.base }}
          ROUTED: ${{ steps.base.outputs.routed }}
        run: |
          set -euo pipefail
          # tools older than oft ledger judge only the two trees, in the lint step
          [ -f base/tools/oft/ledger.py ] || { echo "the base's tools have no oft ledger"; exit 0; }
          # base..HEAD as commits and trees, without file contents (11 MiB for main and proofs/make, where one
          # checkout of either is 4.6 GB); git fetches the few finding.yaml and unpatched.yaml the ledger reads, and
          # release.yaml at the tip and where the tip's history meets the base
          # GitHub at times fails to serve an old tree of main ("bad tree object", then "bad pack header"; seen four
          # times on 2026-11-02, each passing on a re-run), so the fetch is tried 3 times, 30 s then 90 s apart.  A
          # failed try can leave the clone unshallowed, and --unshallow on a complete clone is an error, so each try
          # asks git whether the clone is still shallow.
          for attempt in 1 2 3; do
            unshallow=()
            [ "$(git -C head rev-parse --is-shallow-repository)" = true ] && unshallow=(--unshallow)
            if git -C head fetch --no-tags --filter=blob:none "${unshallow[@]}" origin "$BASE" "$(git -C head rev-parse HEAD)"; then
              break
            fi
            [ "$attempt" = 3 ] && { echo "::error::the history fetch failed 3 times"; exit 1; }
            echo "::warning::the history fetch failed (attempt $attempt of 3); GitHub's intermittent tree-serving fault of 2026-11-02 (bad tree object) is the known cause; trying again"
            sleep $((attempt == 1 ? 30 : 90))
          done
          ledger_base="$BASE"
          if [ "$ROUTED" != true ]; then
            # No base to compare with (the base step): the ledger reads the tip's whole history, judged from a commit
            # with no files and no history (made here, never pushed), so every commit of the tip is in BASE..TIP and
            # every record is held from its anchor on.  It fails closed: a record whose runs were recorded again
            # under a later runner image (which a base would have let through) is a finding here, and a run of the
            # push once its base can be fetched again judges it from that base.
            ledger_base="$(git -C head -c user.name=pr.yml -c user.email=pr.yml@invalid commit-tree \
              "$(git -C head hash-object -t tree -w /dev/null)" -m "no base: the tip's whole history is the change")"
            echo "no base to compare with: the findings ledger reads the tip's whole history"
          fi
          PYTHONPATH=base/tools python -m oft --root head ledger --base "$ledger_base"
      # The last passing lint of this pull request (the plan job's lint_since step says what a record is and when
      # one holds): the record the plan job read, by its exact key, and the same step, run here on this job's own
      # checkout, which the lint step takes its answer from.
      - name: the record of this pull request's last passing lint, by the base's tools
        id: lint_record_restore
        if: github.event_name == 'pull_request' && needs.plan.outputs.lint_record != ''
        # A cache that cannot be read is no record (lint_since then reads none), never a failed lint job.
        continue-on-error: true
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/lint-record
          key: ${{ needs.plan.outputs.lint_record }}
      - name: the tree of the last passing lint, when its record holds
        id: lint_since
        if: github.event_name == 'pull_request'
        env:
          MATCHED: ${{ steps.lint_record_restore.outputs.cache-matched-key }}
          RECORD: ${{ runner.temp }}/lint-record/record
          BASE: ${{ steps.base.outputs.base }}
          PR: ${{ github.event.pull_request.number }}
          INTO: >-
            ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.event.pull_request.base.ref)
            || github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.ref }}
        run: |
          set -euo pipefail
          since= record=
          none() { echo "no lint record is read: $1"; }
          hex='^[0-9a-f]{40}$'
          if [ -z "$MATCHED" ]; then
            none "none was restored (no lint of this pull request with these tools passed, or the cache was not read)"
          elif [ ! -f "$RECORD" ]; then
            none "the entry $MATCHED holds no record"
          else
            r_pr= r_kind= r_into= r_tools= r_p1= r_p2= r_tree=
            while read -r k v w; do
              case "$k" in
                pr) r_pr=$v ;; kind) r_kind=$v ;; into) r_into=$v ;; tools) r_tools=$v ;;
                parents) r_p1=$v; r_p2=$w ;; tree) r_tree=$v ;;
              esac
            done < "$RECORD"
            tools=$(git -C head rev-parse --verify --quiet "$BASE:tools") || tools=
            if [ "$r_pr" != "$PR" ]; then
              none "the record names pull request '$r_pr', not $PR"
            elif [ "$r_kind" != "$KIND" ]; then
              none "the record names the kind of change '$r_kind', and this run's is $KIND"
            elif [ "$r_into" != "$INTO" ]; then
              none "the record is of a lint into '$r_into', and this run's is into $INTO"
            elif ! [[ "$r_tools" =~ $hex && "$r_p1" =~ $hex && "$r_p2" =~ $hex && "$r_tree" =~ $hex ]]; then
              none "the record does not name four object ids"
            elif [ "$r_tools" != "$tools" ]; then
              none "the record's base tools/ tree is $r_tools, and this run's is ${tools:-unreadable}"
            else
              deepen=()
              [ "$(git -C head rev-parse --is-shallow-repository)" != true ] || deepen=(--unshallow)
              if ! git -C head fetch --no-tags --filter=blob:none "${deepen[@]}" origin "$r_p1" "$r_p2"; then
                none "the parents the record names, $r_p1 and $r_p2, cannot be fetched"
              elif ! tree=$(git -C head merge-tree --write-tree --no-messages "$r_p1" "$r_p2"); then
                none "the parents the record names do not merge cleanly"
              elif [ "$tree" != "$r_tree" ]; then
                none "the parents the record names merge to $tree, not to the tree $r_tree it names"
              elif ! held=$(git -c core.quotePath=false -C head diff --no-renames --name-only "$tree" HEAD \
                  | PYTHONPATH=base/tools python -c '
          import sys
          from oft import layout, lint
          units = set(lint.base_pending_entries("base")) | set(lint.base_pending_entries("head"))
          changed = sys.stdin.buffer.read().decode("utf-8", "surrogateescape").splitlines()
          print(" ".join(sorted({u for u in map(layout.unit_of, changed) if u is not None and u in units})))'); then
                none "the licence-pending entries of the base and of this tree cannot be read"
              elif [ -n "$held" ]; then
                none "a file of $held, which a licence-pending entry names, differs from that tree"
              else
                since=$(git -C head -c user.name=pr.yml -c user.email=pr.yml@invalid commit-tree "$tree" \
                  -m "the tree the last passing lint of pull request $PR read (made here, never pushed)")
                record=$MATCHED
                echo "lint record $MATCHED holds: lint compares with the tree $tree, as commit $since"
              fi
            fi
          fi
          { echo "since=$since"; echo "record=$record"; } >> "$GITHUB_OUTPUT"
      # The plan job read a record and, by it, chose the 4-core runner for this job; this job reads the same entry by
      # its exact key, with the same base and tools, so the two readings agree unless the entry was evicted in
      # between or a parent could not be fetched here.  Then the lint step reads by the rule without a record: the
      # verdict is the same, only slower (a whole-tree lint on the 4-core runner took 50.3 minutes, run 40788123995,
      # inside this job's 90).  This says so, so that a slow run is explained and not taken for a fault.
      - name: the record the plan read still holds here
        if: >-
          github.event_name == 'pull_request' && needs.plan.outputs.lint_record != ''
          && needs.plan.outputs.lint_changed_only == 'true' && steps.lint_since.outputs.since == ''
        env:
          RECORD_KEY: ${{ needs.plan.outputs.lint_record }}
        run: |
          echo "::warning::the plan job read lint record $RECORD_KEY and chose this job's runner by it, but it does not hold here (see the step above): lint reads by the rule without a record, on the runner the plan chose"
      # A checkout without the proof libraries (the plan's lint_files_left_out): lint reads the bytes of every file
      # that differs from the commit the lint step compares with (its --changed-only), so this step checks each such
      # file out; lint fails a changed file that is still left out.
      # Where the record the plan read does not hold here (the step above), the lint step compares with the base
      # instead and may read every file, which this checkout cannot answer: the whole tree on this standard runner
      # is about 15 minutes of lazy fetches and ran out of disk at about 13.5 GB (the lint job's comment).  So this
      # job fails and says to re-run it: the new run's plan job reads the record again and chooses the runner by
      # what it finds, and a run whose record is gone takes the whole-tree checkout on the larger runner.
      - name: the left-out files lint reads
        if: needs.plan.outputs.lint_files_left_out == 'true'
        env:
          BASE: ${{ steps.base.outputs.base }}
          SINCE: ${{ steps.lint_since.outputs.since }}
          RECORD_KEY: ${{ needs.plan.outputs.lint_record }}
        run: |
          set -euo pipefail
          if [ -n "$RECORD_KEY" ] && [ -z "$SINCE" ]; then
            echo "::error title=re-run this run::the plan job read lint record $RECORD_KEY and chose this job's checkout by it, and that record does not hold here (the step above says why), so lint would read files this checkout leaves out. Re-run the whole run (gh run rerun <id>, not --failed, which keeps the plan job's old answers): its plan job reads the record again and chooses the checkout and the runner by what it finds."
            exit 1
          fi
          python - "${SINCE:-$BASE}" <<'EOF'
          import os, subprocess, sys
          git = ["git", "-C", "head", "-c", "core.quotePath=false"]
          diff = subprocess.run(git + ["diff", "--no-renames", "--name-only", "-z", sys.argv[1], "HEAD", "--"],
                                check=True, capture_output=True).stdout.split(b"\0")
          listed = subprocess.run(git + ["ls-files", "-z", "-t", "--cached"], check=True, capture_output=True).stdout
          skipped = {rec[2:] for rec in listed.split(b"\0") if rec.startswith(b"S ")}
          want = sorted(p for p in diff if p and p in skipped)
          print("%d file(s) that differ from %s are left out of the checkout: checked out here" % (len(want), sys.argv[1]))
          if want:
              subprocess.run(git + ["checkout", "--ignore-skip-worktree-bits", "--pathspec-from-file=-",
                                    "--pathspec-file-nul", "HEAD", "--"],
                             input=b"\0".join(want) + b"\0", check=True, env=dict(os.environ, GIT_LITERAL_PATHSPECS="1"))
          EOF
      # The verdict is the base's rules, except for the one change they cannot give a verdict on: a change that
      # brings the tools and the facts those tools read together, where the base's tools do not know the new facts'
      # shape and so read no proof at all.  Which change that is, the plan job measured (its `tools` output,
      # `base` or `head`, and the reason is in its log); this step follows it, so that a run has one answer.  For a
      # `head` answer the base's rules still run and their exit status is reported, and the change's own tools, the
      # same ones its check jobs run, give the verdict over every file.  Nothing goes unchecked: the tools that
      # judge the tree are the tools that land with it, and the tests job runs the whole-tree lint with them too.
      - name: lint, by the base's rules
        env:
          ROUTED: ${{ steps.base.outputs.routed }}
          BASE: ${{ steps.base.outputs.base }}
          PLANNED_TOOLS: ${{ needs.plan.outputs.tools }}
          # the tree of this pull request's last passing lint, as a commit, when its record holds (lint_since)
          SINCE: ${{ steps.lint_since.outputs.since }}
        run: |
          set -euo pipefail
          args=(--changed "$RUNNER_TEMP/changed.txt" --pr-kind "$KIND")
          # the findings ledger is compared with the base's when the base has one, in either layout; tools older than
          # findings/ take no --base
          ledger_base=false
          if [ -d base/findings ] || compgen -G 'base/projects/*/unpatched.yaml' > /dev/null \
              || compgen -G 'base/projects/*/*/findings' > /dev/null; then
            ledger_base=true
            args+=(--base "$GITHUB_WORKSPACE/base")
          fi
          # before the first release is exported there are no facts, and the text rules still run
          [ -e head/release.yaml ] || args+=(--skeleton)
          # The licence-pending entries a pull request may keep are those of the base commit: lint reads them through
          # git from this checkout of the base, so a pull request that changes proof files adds none
          # (tools/oft/lint.py, apply_pending).  Tools older than --pending-base take none.  The change's own tools,
          # when the plan names them (below), read the tree's own entries, as the tests job's whole-tree lint does.
          if grep -q -- '"--pending-base"' base/tools/oft/__main__.py; then
            args+=(--pending-base "$GITHUB_WORKSPACE/base")
          fi
          # A routed change (the base step: a pull request into main or into any other branch, a merge queue group, a
          # push to main): the per-file text rules (private data, links, proofs, licence) read only the files that differ from
          # the base (--changed-only), or every file when one of them is a fact (but CHANGELOG.md), a finding's
          # finding.yaml, a build record, a .gitattributes or tools/oft/lint-exceptions.yaml (a margin over the four
          # files a verdict reads and the build record that decides its own fuzz target's licence verdicts:
          # tools/oft/lint.py, read_by_every_verdict).  So an unchanged file gets the verdict it has at the base: the
          # same rules (the base's; a change to tools/ gets the tests job's whole-tree lint with its own tools) over the
          # same blobs and attributes, and the same facts.  Into main, each commit of main was judged so on its own
          # change, from main as its push runs linted it whole before this routing on.  Into another branch (a stacked
          # one, a lane's branch) the base's files may never have been linted whole, and that is accepted: such a
          # branch reaches main only through a pull request into main, whose own lint reads every file that differs
          # from main, so the gate into main is unchanged.  Before 2026-11-03 a pull request into another branch
          # linted every file: 152 of 158 such lint jobs in 14:00-22:00Z 2026-11-02 were whole-tree 16-core lints,
          # US$95.66 of the job's US$115.69 (Dispatch INFRA-991).  Every other rule still runs over the whole tree:
          # paths (every path, what this kind of change may
          # touch, the findings ledger), schema and the rules between facts, free text, withheld, and whether each lint
          # exception is used.  A push with no base to compare with lints every file, and so do tools older than
          # --changed-only.  One cost: a per-file finding on main, which only a commit whose run failed could leave
          # there, fails no later change that leaves that file as it is; the run that let it in stays failed.
          # A push to a pull request whose last passing lint's record holds (the lint_since step above): the
          # per-file text rules read only the files that differ from the tree that lint read, or every file when
          # one of them is one read_by_every_verdict names, as above.  The record names the base's tools/ tree, so
          # the rules are the ones that lint ran, and the files every verdict reads are the same or read whole.  It
          # comes before the rule for main, and holds for a pull request into any branch: a file of the tree that
          # no push since that lint changed was judged then, by the same rules, over the same bytes.
          # The plan job's lint_gate step answers the same question before this job starts, to choose its
          # runner: its clauses are these and two more (the plan's `tools` answer, and whether a changed path
          # is one read_by_every_verdict, which has lint read every file anyway).  Its answer is `true` only where
          # this step takes --changed-only, unless this job's reading of the record the plan read
          # does not hold (the step "the record the plan read still holds here" warns of it): this step then takes
          # the rule without a record, which can be a whole-tree lint on the small runner, slower, with the same
          # verdict.  The verdict is this step's alone: it reads ROUTED, the record and the base's tools from this
          # job's own checkout, as the ledger step above does.
          if [ -n "$SINCE" ] && [ "$PLANNED_TOOLS" != head ] \
              && grep -q -- '"--changed-only"' base/tools/oft/__main__.py; then
            args+=(--changed-only "$SINCE")
          elif [ "$ROUTED" = true ] \
              && grep -q -- '"--changed-only"' base/tools/oft/__main__.py; then
            args+=(--changed-only "$BASE")
          fi
          # the plan job's answer: `head` only for the change the base pins, whose facts the base's tools read as
          # nothing and whose own tools read some (that step says which, and why)
          by_head=false
          [ "$PLANNED_TOOLS" != head ] || by_head=true
          base_rc=0
          PYTHONPATH=base/tools python -m oft --root head lint "${args[@]}" || base_rc=$?
          if [ "$by_head" != true ]; then
            exit "$base_rc"
          fi
          echo "::notice::the base pins this change's tools: the base's rules gave $base_rc, and the change's own"\
            "tools give the verdict; both runs are in this log"
          { echo "### lint by the base's rules: exit $base_rc"
            echo "The plan job recorded that the base's tools read no proof of this tree, so what they say of its"
            echo "facts is about facts they cannot read; their other rules (private data, links, proofs, paths)"
            echo "read it as any other tree. That run is above, and stands. The pin names this change's tools for"
            echo "the verdict, which is below: every file of the same tree, by those tools."
          } >> "$GITHUB_STEP_SUMMARY"
          # the change's own rules, over every file: no --changed-only, since the base's whole-tree lint ran under
          # other rules than these
          head_args=(--changed "$RUNNER_TEMP/changed.txt" --pr-kind "$KIND")
          [ "$ledger_base" != true ] || head_args+=(--base "$GITHUB_WORKSPACE/base")
          [ -e head/release.yaml ] || head_args+=(--skeleton)
          PYTHONPATH=head/tools python -m oft --root head lint "${head_args[@]}"
      # The internal repository alone has tools/publish/ (tools/oft/paths.py), and with it ossv-binscan, the scan the
      # publishing check runs over every published byte. A proof file that names an internal name would stop a later
      # publication of its project, so the name is caught here, in the pull request that brings it. The scan and its
      # reviewed exceptions are the base's, as the lint rules are; it reads each file this change adds or changes under
      # projects/<p>/<h>/proofs/ (a deleted file publishes nothing), and fails on a flag-tier hit no exception clears.
      # A hit in Rocq code outside a comment is listed, not blocking. hashFiles reads paths under the workspace, where
      # the base's tree is base/.
      - name: the proof files this change adds or changes name nothing internal (the base's ossv-binscan)
        if: hashFiles('base/tools/publish/ossv-binscan') != ''
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          scan="$RUNNER_TEMP/binscan-in"
          mkdir -p "$scan"
          # NUL-separated, so a name git would quote is read as it is
          git -C head diff -z --no-renames --diff-filter=d --name-only "$BASE" HEAD -- ':(glob)projects/*/*/proofs/**' \
            > "$RUNNER_TEMP/binscan-changed"
          # regular files only: a symbolic link is refused by lint, and its target is no file of this change
          ( cd head && while IFS= read -r -d '' f; do
              if [ -f "$f" ] && [ ! -L "$f" ]; then printf '%s\0' "$f"; fi
            done ) < "$RUNNER_TEMP/binscan-changed" > "$RUNNER_TEMP/binscan-files"
          n="$(tr -cd '\0' < "$RUNNER_TEMP/binscan-files" | wc -c)"
          if [ "$n" = 0 ]; then
            echo "no file under projects/<p>/<h>/proofs/ added or changed: nothing to scan"; exit 0
          fi
          # a copy of just those files, at their paths, so the scan labels each file by its path in the repository
          ( cd head && xargs -0 cp --parents -t "$scan" -- ) < "$RUNNER_TEMP/binscan-files"
          echo "scanning $n file(s) this change adds or changes under projects/<p>/<h>/proofs/"
          rc=0
          ( cd "$scan" && python "$GITHUB_WORKSPACE/base/tools/publish/ossv-binscan" "$RUNNER_TEMP/binscan" projects ) \
            || rc=$?
          case "$rc" in
            0) ;;
            1) echo "::error::ossv-binscan exited 1: each FLAGGED line above is a proof file this change adds or changes that names something internal (take the name out, or have the hit reviewed into the base's exceptions list in tools/publish/); with no FLAGGED line, the scan refused to run, and its message above says why" ;;
            *) echo "::error::ossv-binscan exited $rc: the scan did not finish, so nothing is passed" ;;
          esac
          exit "$rc"
      # The record of this lint, for the next push of this pull request (the plan job's lint_since step says what
      # it is and when it holds): written only when the lint step above passed with the base's tools, and before
      # the step below, the first in this job that runs the change's own code.
      - name: the record of this lint, for the pull request's next push
        id: lint_record
        if: success() && github.event_name == 'pull_request' && needs.plan.outputs.tools != 'head'
        env:
          BASE: ${{ steps.base.outputs.base }}
          PR: ${{ github.event.pull_request.number }}
          INTO: >-
            ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.event.pull_request.base.ref)
            || github.event_name == 'merge_group' && github.event.merge_group.base_ref || github.ref }}
        run: |
          set -euo pipefail
          tools=$(git -C head rev-parse --verify --quiet "$BASE:tools") || tools=
          [[ "$tools" =~ ^[0-9a-f]{40}$ ]] || { echo "the base has no tools/ tree: no record is kept"; exit 0; }
          read -r -a parents <<< "$(git -C head cat-file -p HEAD | sed -n 's/^parent //p' | tr '\n' ' ')"
          [ "${#parents[@]}" = 2 ] || { echo "HEAD is not a merge commit: no record is kept"; exit 0; }
          tree=$(git -C head rev-parse 'HEAD^{tree}')
          mkdir -p "$RUNNER_TEMP/lint-record"
          printf 'pr %s\nkind %s\ninto %s\ntools %s\nparents %s %s\ntree %s\n' "$PR" "$KIND" "$INTO" "$tools" \
            "${parents[0]}" "${parents[1]}" "$tree" > "$RUNNER_TEMP/lint-record/record"
          # a cache key holds no comma; the record names INTO as it is
          echo "key=lint-pass-3-pr$PR-$KIND-${INTO//,/%2C}-$tools-$tree" >> "$GITHUB_OUTPUT"
          echo "the record of this lint: $(tr '\n' ' ' < "$RUNNER_TEMP/lint-record/record")"
      - name: keep the record of this lint
        if: steps.lint_record.outputs.key != ''
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/lint-record
          key: ${{ steps.lint_record.outputs.key }}
      # The change's own code runs last: the generator, for a maintainer's change to tools/ (the tools' tests run in the
      # tests job).  It runs as this job's user in this workspace, so it could rewrite base/; no step after it reads base/.
      - name: generated files equal their rendering
        run: |
          set -euo pipefail
          [ -e head/release.yaml ] || { echo "no facts yet: nothing is rendered"; exit 0; }
          # A maintainer's change to the tools is rendered with the tools it brings,
          # and reviewed; any other change, with the base's.
          tools=base/tools
          if [ "$KIND" != contributor ] && grep -q '^tools/oft/' "$RUNNER_TEMP/changed.txt"; then
            tools=head/tools
          fi
          # The shared generated files (tools/oft/paths.py SHARED) are the line's render's: no pull request, merge
          # queue group or push carries them.  Tools older than --skip-shared compare every file.
          skip=()
          if grep -q -- '"--skip-shared"' "$tools/oft/__main__.py"; then skip=(--skip-shared); fi
          PYTHONPATH="$tools" python -m oft --root head generate --check "${skip[@]}"
      # A unit's made-from record (projects/<p>/<h>/proofs/provenance/) is written by a generator that sits beside it,
      # made_from.py, whose --check reruns it on this checkout and compares (curl's #1723: about 70 s for fuzz_bufq and
      # 14 s for fuzz_fnmatch).  So a change that touches a unit's provenance tree is held to its own generator here,
      # in the pull request and in the merge queue group alike.  A run the plan did not route has BASE at the commit
      # itself, so the diff is empty and this step checks nothing, as the rest of the job does on such a run.
      # The script is the head's, the change's own file, as
      # the record it checks is: the base's could not know a generator the change brings.  The generator may read the
      # head's tools (curl's #1784 reads tools/oft/rocq.py), and this job's checkout always holds them: the whole-tree
      # checkout above keeps every file, and the lint_files_left_out one is a non-cone sparse set of `/*` less the
      # proof libraries alone (`!/proofs/*/*/lib/*`, `!/projects/*/*/proofs/lib/*`), so nothing under tools/ is left
      # out either way (tools/oft/tests/test_workflow_verdicts.py holds that).
      #
      # What this job holds while the change's script runs, and what the step does about it:
      #   * The job's permissions are contents: read, packages: read and actions: write (the watch above cancels this
      #     run with it).  Neither checkout of head/ sets persist-credentials: false, so actions/checkout left that
      #     token in head/.git/config as an http extraheader.  So the step unsets that header before it runs anything
      #     of the change's: this is the last step of the job that touches head's git remote (only the watch's log, a
      #     cat, follows), and actions/checkout's post step reads the header before unsetting it, so the cleanup
      #     still works.  The token itself is the runner's, not on disk after that.
      #   * KIND=contributor: the script is not run at all, as the step above takes a contributor's tools from the
      #     base.  Code an outside contributor brings runs only in the tests job.  The unit is still held to having a
      #     generator beside its record (below), which opens no file of the change.
      #   * --check only reads and writes no file, and this step runs after every step that reads base/ or keeps a
      #     record, as the generator above does.
      #   * Everything the script writes, on stdout and stderr alike, is printed between ::stop-commands:: and its
      #     token, so a generator cannot make the runner act on a workflow command of its own.
      #   * Each generator gets 900 s; one that does not finish fails the step, rather than holding the job, and the
      #     merge queue group with it, to the job's 90 minutes.
      #   * The sparse checkout this job may take leaves out exactly what a made-from record is made from: the
      #     unit's proof library (projects/<p>/<h>/proofs/lib/, the `!` lines of that set).  A generator run on such
      #     a tree reads no proof and answers `-` for nearly every row of its record: before #1784 that was a red
      #     step for a change that touched any curl provenance tree, and after it an exit 2, a warning that decides
      #     nothing (run 41933939559 on #1784: both units almost all `-` rows in 0.2 s).  So each touched unit's
      #     proofs are written back out of HEAD, for those units alone and before the token goes (that checkout is
      #     blob:none, so the write-back fetches those blobs from the promisor remote and needs the credential),
      #     and the job's sparse patterns are left as they are, so the rest of the checkout stays sparse.
      #
      # Its exit: 0 the record matches, 1 it does not (its output lists the rows + and -), 2 the check could not
      # decide (an argparse error is 2 too), which warns and passes; 124 the timeout; any other exit fails.  A unit
      # whose provenance tree holds a made-from.tsv and no made_from.py fails too: deleting the generator must not
      # turn the check off.  A unit deleted whole has neither, and passes with one line.
      #
      # What the failure says, and what it must not say: a record that differs from its generator is a question for
      # the unit's owner, not a file to regenerate.  curl/fuzz_bufq's own exit 1 (lib/AgreeZlib.v and lib/U/
      # AgreeZlib.v) is a true failure that stays red until the Release lane settles where that source came from
      # (OSSV-162), and `made_from.py --apply` today would write a wrong origin and could move a licence grant onto
      # files whose content came from somewhere else.  So the error names the rows and says not to clear it with
      # --apply; it never tells anyone to rerun the generator and commit what it writes.
      - name: each made-from record this change touches equals its generator's (the head's made_from.py --check)
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          # NUL-separated, so a name git would quote is read as it is; a deletion counts, since it changes the record
          git -C head diff -z --no-renames --name-only "$BASE" HEAD -- ':(glob)projects/*/*/proofs/provenance/**' \
            > "$RUNNER_TEMP/made-from-changed"
          units=()
          while IFS= read -r -d '' u; do units+=("$u"); done < <(
            cut -z -d/ -f1-3 < "$RUNNER_TEMP/made-from-changed" | sort -zu)
          if [ "${#units[@]}" = 0 ]; then
            echo "no file under projects/<p>/<h>/proofs/provenance/ changed: no made-from record to check"; exit 0
          fi
          run=true
          if [ "$KIND" = contributor ]; then
            run=false
            echo "KIND=contributor: no made_from.py of this change is run in this job, as the step above takes a contributor's tools from the base; code an outside contributor brings runs only in the tests job. Each touched unit is still held to having a generator beside its record."
          fi
          # The touched units' own proofs, which the job's sparse checkout leaves out and the records are made from
          # (the comment above).  This runs before the token goes, below: that checkout is `filter: blob:none`, so a
          # proof library's blobs are not in the clone and writing them out of HEAD fetches them from the promisor
          # remote, which on this private repository needs the credential actions/checkout persisted.  git is not
          # the change's code, and the step that gives lint the files it reads does the same checkout earlier in
          # this job.  Only units that have a generator, since only a generator reads them, and none at all for
          # KIND=contributor, which runs none.  Written with --ignore-skip-worktree-bits, as that step does: the
          # sparse patterns stay as they are, so no other file of this checkout moves, and on a whole-tree checkout
          # this writes back the bytes already there.  Measured: 1633 files and 31.8 MiB for curl/fuzz_bufq, 2420
          # and 63.6 MiB for curl/fuzz_fnmatch, about a second each; proofs/lib over the whole tree is 11.12 GiB,
          # which is why only the touched units are written and this arm's runner still has room (it ran out once
          # at about 13.5 GB, the lint job's comment).
          if [ "$run" = true ]; then
            for u in "${units[@]}"; do
              [ -d "head/$u/proofs/provenance" ] || continue
              [ -n "$(find "head/$u/proofs/provenance" -name made_from.py -type f -print -quit)" ] || continue
              started=$(date +%s)
              if ! printf '%s\0' "$u/proofs" | GIT_LITERAL_PATHSPECS=1 git -C head checkout \
                   --ignore-skip-worktree-bits --pathspec-from-file=- --pathspec-file-nul HEAD --; then
                echo "::error::$u/proofs could not be written out of HEAD, so its generator would read a tree this job left incomplete"
                exit 1
              fi
              echo "$u/proofs: $(find "head/$u/proofs" -type f | wc -l) file(s) in the working tree for the generator, $(( $(date +%s) - started )) s"
            done
          fi
          # the job's token, which both checkouts of head/ persisted in head/.git/config (the comment above)
          git -C head config --unset-all http.https://github.com/.extraheader 2> /dev/null || true
          # one line of a workflow command: GitHub reads %0A as a new line
          escape() { local s=${1//'%'/'%25'}; s=${s//$'\r'/'%0D'}; printf '%s' "${s//$'\n'/'%0A'}"; }
          rc=0
          for u in "${units[@]}"; do
            scripts=()
            records=()
            if [ -d "head/$u/proofs/provenance" ]; then
              while IFS= read -r -d '' s; do scripts+=("$s"); done < <(
                find "head/$u/proofs/provenance" -name made_from.py -type f -print0 | sort -z)
              while IFS= read -r -d '' r; do records+=("$r"); done < <(
                find "head/$u/proofs/provenance" -name made-from.tsv -type f -print0 | sort -z)
            fi
            if [ "${#scripts[@]}" = 0 ]; then
              if [ "${#records[@]}" != 0 ]; then
                echo "::error::$u holds ${#records[@]} made-from record(s) under proofs/provenance/ and no made_from.py, so nothing can check them; deleting a generator does not turn this check off. Keep the generator beside its record, or delete the record with it."
                rc=1
              else
                echo "$u: its provenance tree changed, and it has no made_from.py and no made-from.tsv: nothing to check"
              fi
              continue
            fi
            [ "$run" = true ] || continue
            for s in "${scripts[@]}"; do
              rel=${s#head/}
              echo "checking $rel"
              src=0
              # stdout and stderr both, so nothing the script writes reaches the log outside the block below
              out=$(timeout 900 python3 "$s" --check 2>&1) || src=$?
              if [ -n "$out" ]; then
                # the runner reads no workflow command between these two, and the token is this run's alone
                token=$(od -An -tx1 -N16 /dev/urandom | tr -d ' \n')
                echo "::stop-commands::$token"
                printf '%s\n' "$out"
                echo "::$token::"
              fi
              case "$src" in
                0) echo "$rel --check: the record matches its generator" ;;
                1) echo "::error::$rel --check exited 1: the record differs from what its generator gives (the rows + and - above). Do not run made_from.py --apply to clear this; the unit's owner decides the record (see the unit's provenance docs)"; rc=1 ;;
                2) echo "::warning::$rel --check exited 2, so the check could not decide; nothing is failed:%0A$(escape "$out")" ;;
                124) echo "::error::$rel --check did not finish within 900 s and was stopped, so nothing is passed; a generator that needs longer belongs in a job of its own"; rc=1 ;;
                *) echo "::error::$rel --check exited $src: the check did not finish, so nothing is passed"; rc=1 ;;
              esac
            done
          done
          exit "$rc"
      # what the merge queue group's watch saw, also when it cancelled this run
      - name: the merge queue group's watch, its log
        if: always() && github.event_name == 'merge_group'
        run: cat -- "$RUNNER_TEMP/group-watch.log" 2> /dev/null || true

  tests:
    # the change's own code: only after lint has accepted the paths it changes
    needs: [plan, lint]
    # only when the change touches what the tests read (plan's reach step says what that is)
    # !cancelled() and plan's and lint's own results, not the default: GitHub counts a job whose ancestor was skipped
    # as skipped too, and queue_run is skipped for every event but a push (measured: a run where plan and
    # lint ran and this job was skipped all the same); plan's result as well, so that no job after a failed plan starts
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success'
      && needs.plan.outputs.tests == 'true' }}
    # One process per test class (tools/oft/tests/parallel.py).  The whole-tree lint test
    # (test_this_repository_is_clean) takes one process per CPU by itself and sets this job's floor, so where it runs
    # the job keeps a larger runner: 16 cores, as lint, since that test lints every file of the tree (15.1 minutes
    # for this job on 16 cores, measured on the release line); without it the tests read only tools/ and run on the
    # standard runner.
    #
    # WHERE IT RUNS.  Wherever a merge queue does NOT check this change again, whenever the change touches what the
    # tests read (plan's `repository_lint`): a merge queue group, a push to main, a pull request into a base other
    # than main, and every pull request on theorem-labs/oss-verify-proofs, whose main merges with no queue (the
    # `QUEUED` condition of the `required` job, negated; the header says which pull requests a queue re-checks).
    # So every commit that reaches a main is read by a whole-tree lint with the change's own tools, which is the
    # check of record, before it lands there.
    # It does NOT run on a pull request into this repository's main: the group's own run is that check, and a tools
    # change that breaks the whole-tree lint fails the group and takes the head out of the queue
    # (tools/oft/tests/test_lint.py, TestsJobCheckout).  The cost: 69 of the 74 `tests` jobs of the
    # 284 pull-request runs created 2026-11-03 17:00-20:42Z took the 16-core runner, US$61.03 of the job's US$61.32,
    # a median of 24.5 minutes against 9.5 on the standard runner; job 126172236153 spent 813 s of its 28.2 minutes
    # in the whole-tree checkout (the step below) and 871 s in the tests.
    runs-on: >-
      ${{ needs.plan.outputs.repository_lint == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main'
          || github.repository == 'theorem-labs/oss-verify-proofs')
      && 'ubuntu-24.04-16core' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      # The whole tree where the tests lint it whole: test_this_repository_is_clean reads every file.
      - if: >-
          needs.plan.outputs.repository_lint == 'true'
          && (github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main'
              || github.repository == 'theorem-labs/oss-verify-proofs')
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          persist-credentials: false   # the change's code runs here, and this job fetches nothing more
      # Otherwise every file but the proof libraries, as plan checks out: proofs/<p>/<h>/lib/ (in the per-project
      # layout projects/<p>/<h>/proofs/lib/) is 4.56 GB of the tree's 4.66 GB, and with the whole-tree lint test
      # skipped no test reads under it (the tests read tools/, .github/, the contributor skill files and release.yaml).
      # Measured: the same 653 tests run and pass either way, and the checkout takes 3-4 s (95 MB, 12,074 files) against
      # 89-116 s for the whole tree (4.5 GB, 71,119 files), or 5-7 s against 8.2-8.9 minutes for a proofs/ branch's.  A
      # file under lib/ is not on disk, so a test that opened one would fail, not pass on bytes it never read.
      - if: >-
          needs.plan.outputs.repository_lint != 'true'
          || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
              && github.repository != 'theorem-labs/oss-verify-proofs')
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          persist-credentials: false   # the change's code runs here, and this job fetches nothing more
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/proofs/*/*/lib/
            !/projects/*/*/proofs/lib/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: the tools' dependencies (PyYAML, idna), hash-pinned, at this change
        run: python -m pip install --quiet --require-hashes -r head/tools/oft/requirements.txt
      - name: the tools' own tests, at this change, one process per test class
        working-directory: head/tools
        env:
          OFT_SKIP_REPOSITORY_LINT: >-
            ${{ needs.plan.outputs.repository_lint == 'true'
            && (github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'main'
                || github.repository == 'theorem-labs/oss-verify-proofs')
            && '0' || '1' }}
        run: python -B -m oft.tests.parallel
      # tools/publish/ is the internal repository's alone (tools/oft/paths.py): its tests run where it exists. One case
      # hashes each oft that gate-job's proof split was reviewed against. The commits are listed in
      # tools/publish/tests/reviewed-ofts.tsv, not here: this file ships, most of them are internal, and the publishing
      # check refuses a shipped file that names an internal commit. The first step reads the list into its outputs; one
      # checkout per row follows, and the tests get the checkouts in OSSV_REVIEWED_OFTS.
      - name: the ofts the proof split was reviewed against, from tools/publish/tests/reviewed-ofts.tsv
        id: reviewed
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        run: |
          set -euo pipefail
          n=0
          # rows as the tests' reviewed_ofts() reads them: a last line without its newline counts, and a line that is
          # blank or white space, or starts with '#', does not
          while IFS=$'\t' read -r commit repo _tree _what || [ -n "$commit" ]; do
            case "${commit//[[:space:]]/}" in ''|'#'*) continue ;; esac
