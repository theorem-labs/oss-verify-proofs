        with:
          repository: ${{ steps.reviewed.outputs.repo1 }}
          ref: ${{ steps.reviewed.outputs.ref1 }}
          path: reviewed-oft-1
          sparse-checkout: tools/oft
          persist-credentials: false
      - name: reviewed oft 2 of 15, for the publishing tools' tests
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ steps.reviewed.outputs.repo2 }}
          ref: ${{ steps.reviewed.outputs.ref2 }}
          path: reviewed-oft-2
          sparse-checkout: tools/oft
          persist-credentials: false
      - name: reviewed oft 3 of 15, for the publishing tools' tests
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ steps.reviewed.outputs.repo3 }}
          ref: ${{ steps.reviewed.outputs.ref3 }}
          path: reviewed-oft-3
          sparse-checkout: tools/oft
          persist-credentials: false
      - name: reviewed oft 4 of 15, for the publishing tools' tests
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ steps.reviewed.outputs.repo4 }}
          ref: ${{ steps.reviewed.outputs.ref4 }}
          path: reviewed-oft-4
          sparse-checkout: tools/oft
          persist-credentials: false
      - name: reviewed oft 5 of 15, for the publishing tools' tests
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ steps.reviewed.outputs.repo5 }}
          ref: ${{ steps.reviewed.outputs.ref5 }}
          path: reviewed-oft-5
          sparse-checkout: tools/oft
          persist-credentials: false
      - name: reviewed oft 6 of 15, for the publishing tools' tests
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ steps.reviewed.outputs.repo6 }}
          ref: ${{ steps.reviewed.outputs.ref6 }}
          path: reviewed-oft-6
          sparse-checkout: tools/oft
          persist-credentials: false
      - name: reviewed oft 7 of 15, for the publishing tools' tests
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ steps.reviewed.outputs.repo7 }}
          ref: ${{ steps.reviewed.outputs.ref7 }}
          path: reviewed-oft-7
          sparse-checkout: tools/oft
          persist-credentials: false
      - name: reviewed oft 8 of 15, for the publishing tools' tests
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ steps.reviewed.outputs.repo8 }}
          ref: ${{ steps.reviewed.outputs.ref8 }}
          path: reviewed-oft-8
          sparse-checkout: tools/oft
          persist-credentials: false
      - name: reviewed oft 9 of 15, for the publishing tools' tests
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ steps.reviewed.outputs.repo9 }}
          ref: ${{ steps.reviewed.outputs.ref9 }}
          path: reviewed-oft-9
          sparse-checkout: tools/oft
          persist-credentials: false
      - name: reviewed oft 10 of 15, for the publishing tools' tests
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ steps.reviewed.outputs.repo10 }}
          ref: ${{ steps.reviewed.outputs.ref10 }}
          path: reviewed-oft-10
          sparse-checkout: tools/oft
          persist-credentials: false
      - name: reviewed oft 11 of 15, for the publishing tools' tests
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ steps.reviewed.outputs.repo11 }}
          ref: ${{ steps.reviewed.outputs.ref11 }}
          path: reviewed-oft-11
          sparse-checkout: tools/oft
          persist-credentials: false
      - name: reviewed oft 12 of 15, for the publishing tools' tests
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ steps.reviewed.outputs.repo12 }}
          ref: ${{ steps.reviewed.outputs.ref12 }}
          path: reviewed-oft-12
          sparse-checkout: tools/oft
          persist-credentials: false
      - name: reviewed oft 13 of 15, for the publishing tools' tests
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ steps.reviewed.outputs.repo13 }}
          ref: ${{ steps.reviewed.outputs.ref13 }}
          path: reviewed-oft-13
          sparse-checkout: tools/oft
          persist-credentials: false
      - name: reviewed oft 14 of 15, for the publishing tools' tests
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
