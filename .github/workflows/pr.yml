          ref: ${{ steps.reviewed.outputs.ref14 }}
          path: reviewed-oft-14
          sparse-checkout: tools/oft
          persist-credentials: false
      - name: reviewed oft 15 of 15, for the publishing tools' tests
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ steps.reviewed.outputs.repo15 }}
          ref: ${{ steps.reviewed.outputs.ref15 }}
          path: reviewed-oft-15
          sparse-checkout: tools/oft
          persist-credentials: false
      # the base's tools/oft with its oft fixture: test_dry_run clears for its run only the scan hits the base's own
      # files have, so a hit this change adds to tools/oft still fails it
      - name: the base's tools/oft, for the publishing tools' tests
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.base }}
          path: base-oft
          sparse-checkout: tools/oft
          persist-credentials: false
      - name: the publishing tools' own tests, at this change
        if: hashFiles('head/tools/publish/tests/*.py') != ''
        working-directory: head
        env:
          OSSV_BASE_OFT: ${{ github.workspace }}/base-oft
          OSSV_REVIEWED_OFTS: >-
            ${{ github.workspace }}/reviewed-oft-1/tools:${{ github.workspace }}/reviewed-oft-2/tools:${{
            github.workspace }}/reviewed-oft-3/tools:${{ github.workspace }}/reviewed-oft-4/tools:${{
            github.workspace }}/reviewed-oft-5/tools:${{ github.workspace }}/reviewed-oft-6/tools:${{
            github.workspace }}/reviewed-oft-7/tools:${{ github.workspace }}/reviewed-oft-8/tools:${{
            github.workspace }}/reviewed-oft-9/tools:${{ github.workspace }}/reviewed-oft-10/tools:${{
            github.workspace }}/reviewed-oft-11/tools:${{ github.workspace }}/reviewed-oft-12/tools:${{
            github.workspace }}/reviewed-oft-13/tools:${{ github.workspace }}/reviewed-oft-14/tools:${{
            github.workspace }}/reviewed-oft-15/tools
        run: python -m unittest discover -s tools/publish/tests

  # Each leg a call of fetch-drafts.yml, which GitHub runs from this workflow's own commit (for a pull request, its merge
  # commit: the boundary is in the header); a called workflow runs with the token the calling job grants, here contents:
  # write and nothing else.  It waits for lint: a draft binary is downloaded, and kept as an artifact, only for facts
  # that lint accepted (no GPL binary without its source).
  fetch-drafts:
    needs: [plan, lint]
    # as the tests job: !cancelled() and plan's and lint's own results, not the default success(), which a skipped
    # queue_run ancestor (every event but a push the queue checked) would make false and so skip this job; and only
    # for check, which the hold step holds back on a draft or without the label `check`, and which never runs for the
    # tree the base pins with a deferred check, nor for a merge queue group or a pull request checked on a VM
    # (`checked_elsewhere`, the plan job's elsewhere step)
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success'
      && needs.plan.outputs.draft_legs != '[]' && needs.plan.outputs.hold == 'none'
      && needs.plan.outputs.checked_elsewhere != 'true' }}
    name: fetch-drafts ${{ matrix.leg.index }}
    permissions:
      contents: write   # the only permission with which the workflow's token sees a draft release; nothing is written
    strategy:
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.draft_legs) }}
    uses: ./.github/workflows/fetch-drafts.yml
    with:
      pins: ${{ toJSON(matrix.leg.pins) }}

  check:
    # the change's proofs are compiled here: only after lint has accepted the paths and the proof text it changes.
    # A change that is not a release is checked on a worktree of the base with only this change's proofs,
    # counterexamples and findings in it (their folders in either layout: the step below), so its plan names only the
    # harnesses whose files under those it changes: for every other harness this job would compile the base's bytes a
    # second time.  A release pull request, a push to main and a merge queue group bring their own facts: plan reads
    # them by the release rules (every harness the change reaches) and this job checks them on the change's own tree.
    # fetch-drafts is skipped when no group has a draft, and a job whose need was skipped is skipped too unless its
    # condition says otherwise: run when fetch-drafts passed or had nothing to do, never when it failed, was cancelled
    # or was skipped because lint failed.  As the tests job: !cancelled() and plan's and lint's own results (a failed
    # plan sets no units, and '' != '0' would start this job with no matrix).  Never for the tree the base pins with a
    # deferred check: its check of record is outside this workflow (the plan step says why).  Never, either, for a
    # merge queue group or a pull request whose every pull request was already checked on a VM and whose change can
    # move no verdict (`checked_elsewhere`, the plan job's elsewhere step): those checks would compile the same proofs
    # for the same answer.
    needs: [plan, lint, fetch-drafts]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success'
      && needs.plan.outputs.units != '0' && needs.plan.outputs.hold == 'none'
      && needs.plan.outputs.checked_elsewhere != 'true'
      && (needs.fetch-drafts.result == 'success'
      || (needs.fetch-drafts.result == 'skipped' && needs.plan.outputs.draft_legs == '[]')) }}
    name: check ${{ matrix.job.index }}
    # a proof check peaks at 14.5-19.4 GiB on 16 cores: the 16-core/64 GB GitHub-hosted larger runner.  360 minutes
    # is the ceiling a GitHub-hosted job runs to, and it is also the merge queue's window: a group is checked like a
    # push to main and must report within 360 minutes of the group's creation, runner waits included, so a group
    # whose checks run longer leaves the queue unmerged.
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read   # the pinned checker and runner images from ghcr.io (the workflow's own, which this replaces)
      actions: write   # the merge queue group's watch: `gh run cancel` of this run once its group is gone
    strategy:
      fail-fast: false
      # the plan's --max-jobs 20 (the plan step says why not more), all at once
      max-parallel: 20
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.plan) }}
    steps:
      # The merge queue group's watch, the same step as the lint job's and the made_from job's (the concurrency comment
      # says why)
      - name: cancel this run once its merge queue group is gone
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          EVERY: "120"
          CONFIRM: "10"
        run: |
          set -euo pipefail
          # In the background for the rest of the job, whose end stops it (the runner stops a job's leftover
          # processes).  It reads the branch over git's own protocol, not the REST API, so it spends none of the
          # token's API budget; with the token in a header, as tools/oft/ci/facts-review-gather passes it, never in a
          # URL or an argument; from RUNNER_TEMP, outside every checkout, whose persisted header would be a second one.
          cat > "$RUNNER_TEMP/group-watch" <<'EOF'
          #!/bin/bash
          set -uo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_TERMINAL_PROMPT=0
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          cd "$RUNNER_TEMP" || exit 1
          # 2 is git ls-remote --exit-code's answer for a branch that does not exist (measured: 0 for a live group's
          # branch, 2 for a dropped group's, 128 without a usable token); any other failure is no answer
          gone() {
            local rc=0
            git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF" > /dev/null 2>&1 || rc=$?
            [ "$rc" -eq 2 ]
          }
          while :; do
            if gone && sleep "$CONFIRM" && gone; then
              echo "$(date -u +%FT%TZ) $GITHUB_REF does not exist, twice $CONFIRM s apart: the queue dropped this group, so run $GITHUB_RUN_ID is cancelled"
              gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
              exit
            fi
            sleep "$EVERY"
          done
          EOF
          chmod +x "$RUNNER_TEMP/group-watch"
          setsid "$RUNNER_TEMP/group-watch" >> "$RUNNER_TEMP/group-watch.log" 2>&1 < /dev/null &
          echo "watching $GITHUB_REF every $EVERY s: this run is cancelled once that branch is gone"
      # The object store of main (.github/workflows/images.yml, git_objects); the lint job's two steps say what it is and
      # what a run that finds none does.  The base's worktree below is fetched into the same head/.git, so its
      # fetch starts from the store too.  What this job compiles is unchanged: the store carries no build output,
      # and the proof compile has no dune cache (reusing compiled files is left to the build service's cache, Dispatch
      # issue INFRA-2895).
      - id: git_objects
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: head/.git
          key: git-objects-v1-
          restore-keys: git-objects-v1-
      - if: steps.git_objects.outputs.cache-matched-key != ''
        name: the object store this checkout starts from
        env:
          STORE: ${{ steps.git_objects.outputs.cache-matched-key }}
        run: echo "$STORE, $(du -sh head/.git | cut -f1), main at $(git -C head rev-parse refs/ossv-git-cache/base)"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
      - name: statements from the base; proofs, counterexamples and findings from this change
        id: work
        run: |
          set -euo pipefail
          trap 'df -h "$GITHUB_WORKSPACE"' EXIT
          base="${{ needs.plan.outputs.base }}"
          git -C head fetch --no-tags --depth=1 origin "$base"
          git -C head worktree add --detach "$GITHUB_WORKSPACE/base" "$base"
          # the commits whose statement files the check compiles, read before any tool runs (statements_committed)
          echo "base_sha=$(git -C base rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git -C head rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$KIND" = release ]; then
            # a release pull request brings new facts; they were checked against the base's rendering
            echo "work=$GITHUB_WORKSPACE/head" >> "$GITHUB_OUTPUT"
          else
            # This change's proofs, counterexamples and findings replace the base's, in either layout: each folder
            # proofs/, counterexamples/, findings/, projects/<p>/<h>/proofs/, projects/<p>/<h>/counterexamples/ and
            # projects/<p>/<h>/findings/, and each projects/<p>/unpatched.yaml, that head or base has.  What the change
            # deleted is deleted.  Nothing else under projects/ is copied: the statements stay the base's.
            # The next step writes the tree's generated files, and a link would carry a write out of the tree; a link on
            # the way to a folder under projects/ would have this copy take what it points at.
            if [ -e head/projects ] || [ -L head/projects ]; then
              links="$(find head/projects -maxdepth 2 -type l)"
              [ -z "$links" ] || { echo "::error::symbolic links on the way to the change's folders: $links"; exit 1; }
            fi
            shopt -s nullglob
            declare -A roots=()
            for side in head base; do
              for r in "$side"/{proofs,counterexamples,findings} "$side"/projects/*/*/{proofs,counterexamples,findings} \
                       "$side"/projects/*/unpatched.yaml; do
                if [ -e "$r" ] || [ -L "$r" ]; then roots["${r#"$side"/}"]=1; fi
              done
            done
            for r in "${!roots[@]}"; do
              if [ -e "head/$r" ] || [ -L "head/$r" ]; then
                links="$(find "head/$r" -type l)"
                [ -z "$links" ] || { echo "::error::symbolic links in $r: $links"; exit 1; }
              fi
              rm -rf -- "base/$r"
              if [ -e "head/$r" ]; then
                mkdir -p -- "$(dirname -- "base/$r")"
                cp -a -- "head/$r" "base/$r"
              fi
            done
            echo "work=$GITHUB_WORKSPACE/base" >> "$GITHUB_OUTPUT"
          fi
          # The job's token, which actions/checkout persisted in head/.git/config as an http extraheader.  The fetch
          # and the worktree above are the last of this job to need it; base/ is a worktree of head/.git, so the two
          # trees the steps below read hold no credential while the check runs this change's code.
          git -C head config --unset-all http.https://github.com/.extraheader 2> /dev/null || true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: the tools' dependencies (PyYAML, idna), hash-pinned, for this runner and for the containers
        run: |
          set -euo pipefail
          python -m pip install --quiet --require-hashes -r base/tools/oft/requirements.txt
          python -m pip install --quiet --require-hashes --target "$RUNNER_TEMP/pydeps" -r base/tools/oft/requirements.txt
      # the host and the check's containers run these tools, from outside the tree they check
      - name: the tools, copied out of the tree they check
        # the base's, except where the plan step measured that they cannot read this tree's facts at all
        run: cp -r -- "${{ needs.plan.outputs.tools }}/tools" "$RUNNER_TEMP/tools"
      # The base's own tools, for the step that holds the build files above the statements (below), copied before any
      # code of the change runs in this job: base/ is the worktree of the plan's base, into which the work step copies
      # only the change's proofs, counterexamples and findings folders and its unpatched.yaml files, never tools/.
      - name: the base's tools, copied out before any code of the change runs
        run: cp -r -- base/tools "$RUNNER_TEMP/base-tools"
      # Every generated file of that tree, rendered by the base's tools from the base's facts and this change's proofs.
      # dune-project defines each project's proofs package, and a project's first proofs bring one that the base's
      # dune-project lacks, so without this dune stops at the first proof's dune file.
      - name: the generated files of that tree, by the base's tools
        if: env.KIND != 'release'
        run: PYTHONPATH="$RUNNER_TEMP/tools" python -m oft --root base generate
      # The statements that tree compiles are the committed ones (OSSV-688).  The step above renders every generated
      # file again, with the tools the plan named; a template or a comparison an earlier merge changed in tools/ would
      # otherwise have these proofs checked against a statement no committed file holds.  So every .v file and
      # dune file of a statement folder, and its images/dune, which names the ELF each image is made from, must be
      # the committed one, byte for byte, and a regular file.  The render writes no other file there for this
      # change's proofs (it adds a proofs package to dune-project, and dune files under proofs/).  The committed
      # files are the base's; where the plan named this change's tools, this change's own, since a change that is not
      # a release changes no fact, so its tools render the base's facts into its own files.  The commit is the one
      # the work step read before any tool ran, and its files are read as stored, with no replace object and no
      # filter, so a commit, an index or a git setting the render leaves behind changes nothing here.  A tool that
      # does more than write files (rewrites git's objects or a later step's environment) runs everything after it
      # too, the checker included: no step of this job can judge that, and review must.
      - name: the statements that tree compiles are the committed ones
        id: statements_committed
        if: env.KIND != 'release'
        env:
          TOOLS: ${{ needs.plan.outputs.tools }}
          BASE_SHA: ${{ steps.work.outputs.base_sha }}
          HEAD_SHA: ${{ steps.work.outputs.head_sha }}
        run: |
          set -euo pipefail
          case "$TOOLS" in
            base) want=$BASE_SHA ;;
            head) want=$HEAD_SHA ;;
            *) echo "::error::the plan named tools '$TOOLS', neither base nor head"; exit 1 ;;
          esac
          [[ "$want" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]] || {
            echo "::error::the work step recorded no commit id for the $TOOLS: '$want'"; exit 1; }
          python - "$want" <<'PY'
          import os, re, subprocess, sys
          want = sys.argv[1]
          # a file of a statement folder: projects/<p>/<h>/<name>.v, projects/<p>/<h>/dune, projects/<p>/<h>/images/dune
          name = re.compile(r"projects/[^/]+/[^/]+/(?:[^/]+\.v|dune|images/dune)")
          env = dict(os.environ, GIT_NO_REPLACE_OBJECTS="1", GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL=os.devnull)
          def git(*args, data=None):
              return subprocess.run(["git", "-C", "base", *args], input=data, env=env, check=True,
                                    capture_output=True).stdout
          listed = git("ls-tree", "-r", "-z", "--full-tree", "--name-only", want, "--", "projects").decode()
          committed = {p for p in listed.split("\0") if name.fullmatch(p)}
          def entries(d):
              try:
                  return list(os.scandir(d))
              except (FileNotFoundError, NotADirectoryError):
                  return []
          now, odd = {}, []
          for p in entries("base/projects"):
              for h in (entries(p.path) if p.is_dir(follow_symlinks=False) else []):
                  if not h.is_dir(follow_symlinks=False):
                      continue
                  found = [(f, "projects/%s/%s/%s" % (p.name, h.name, f.name)) for f in entries(h.path)]
                  images = [f for f, _ in found if f.name == "images" and f.is_dir(follow_symlinks=False)]
                  found += [(g, "projects/%s/%s/images/%s" % (p.name, h.name, g.name))
                            for d in images for g in entries(d.path)]
                  for f, rel in found:
                      if not name.fullmatch(rel):
                          continue
                      if f.is_file(follow_symlinks=False):
                          now[rel] = f.path
                      else:
                          odd.append(rel)
          both = sorted(committed & set(now))
          out = git("cat-file", "--batch", data="".join("%s:%s\n" % (want, rel) for rel in both).encode())
          differ, i = [], 0
          for rel in both:
              j = out.index(b"\n", i)
              head = out[i:j].split()
              if len(head) != 3 or head[1] != b"blob":
                  differ.append(rel)
                  i = j + 1
                  continue
              size = int(head[2])
              blob, i = out[j + 1:j + 1 + size], j + 1 + size + 1
              with open(now[rel], "rb") as f:
                  if f.read() != blob:
                      differ.append(rel)
          bad = [("changed", r) for r in differ] + [("added", r) for r in sorted(set(now) - committed)]
          bad += [("deleted", r) for r in sorted(committed - set(now))] + [("not a regular file", r) for r in sorted(odd)]
          for why, rel in bad:
              print("%s: %s" % (rel, why))
          if bad:
              print("::error::%d file(s) above, as the %s's tools render them for this check, are not the committed "
                    "ones of %s: the rendering changed what a statement says with no committed statement file changed "
                    "with it" % (len(bad), os.environ["TOOLS"], want[:12]))
              sys.exit(1)
          print("the %d statement files this check compiles are the committed ones of %s" % (len(both), want[:12]))
          PY
      # The build files above each unit's statements are the tools' own rendering, for every unit this job checks.
      # oft check holds them so itself only when it builds the unit's proof library: the statement folder's dune,
      # which is the statement theory, and the proofs folder's barrier dune must be exactly its rendering, and no
      # other build file may stand in a directory above the library (tools/oft/check.py, _lib_targets), since dune
      # takes its rules from every directory above a file it builds.  A unit with no proof library got neither: 2,097
      # of the 2,192 units with a Statements.v on 2026-11-16, and a change may give one its first proof without one.
      # A release's tree (a merge queue group, a push, a release pull request) is checked as it is committed, with no
      # rendering here, and its generated files are held to their rendering by lint's `generate --check` alone, which
      # runs the change's own tools when the change touches tools/oft/ (that step says why).  So a change that touches
      # tools/oft/ could bring a statement folder's dune of its own, and a dune file decides what the statements are
      # compiled from and with which flags.  The rule here is check.py's, by the base's tools (the copy above), never
      # the tools the plan named: where the base pins this change's own tools (the plan step's migration pin), those
      # would judge their own rendering, and a change to generate.harness_dune or layout.DUNE_FILES would pass it.
      # Nothing of the change runs in this job before this step, but in one case: a change the base pins that is not
      # a release, whose generated files the step above renders with its own tools, which then run everything after
      # them (the statements_committed step says so); its merge queue group, a release, runs nothing of it before
      # this step.  For a change that is not a release the tree's generated files are the rendering above, so with
      # the base's tools it holds for them already.  Both renderings are keys.checker's (tools/oft/generate.py and
      # its dune templates), so a change to either is a re-key, and the check of a unit with a library refuses its
      # new files as this step does: such a change is checked by its check of record, which the base's migration pin
      # names with `check: deferred` (tools/oft/ci/pin-digests.sh prints the digests it takes), and no check job runs.
      - name: the build files above each unit's statements are the base's tools' rendering
        env:
          UNITS: ${{ matrix.job.check_units }}
          WORK: ${{ steps.work.outputs.work }}
        run: exec bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/head/.github/scripts/pr/check-build-files.sh"
      - name: sign in to ghcr.io, where the pinned images are (needed while their packages are private)
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # Only the archives this group's projects pin in a draft, from this group's plan entry, each from its own
      # artifact, into ASSETS. The action is the base's copy, as at plan; the tools the steps above ran are the ones
      # the plan job named, which for the change the base pins are that change's own.
      - name: the draft binaries this group needs, which fetch-drafts checked and this job's read-only token cannot download
        if: join(matrix.job.drafts, ',') != ''
        uses: ./base/.github/actions/place-drafts
        with:
          drafts: ${{ toJSON(matrix.job.drafts) }}
          assets: ${{ runner.temp }}/assets
      - name: check
        env:
          WORK: ${{ steps.work.outputs.work }}
          TOOLS: ${{ runner.temp }}/tools
          UNITS: ${{ matrix.job.check_units }}
          # as JSON, so that a plan without the field (null) is told from one whose job has no proof (""): check-units.sh
          # refuses null
          PROOF_UNITS: ${{ toJSON(matrix.job.proof_units) }}
          PROJECTS: ${{ matrix.job.projects }}
          CX_UNITS: ${{ matrix.job.counterexamples }}
          FINDINGS: ${{ matrix.job.findings }}
          CPUS: ${{ matrix.job.cpus }}
          ASSETS: ${{ runner.temp }}/assets
          PYDEPS: ${{ runner.temp }}/pydeps
          GH_TOKEN: ${{ github.token }}
          CHECK_LOGS: ${{ runner.temp }}/check-logs
        run: |
          set -euo pipefail
          # oft check keeps each build's dune and rocq logs in its temporary folder (oft-check-*), and a failed build's
          # message names only that log ("does not compile (see PATH)"), which went with the container.  So the check runs
          # through a docker of this step's: a `docker run` that mounts a writable /work (a unit's view) gets
          # CHECK_LOGS/tmp, mounted at /oft-check-logs, as its temporary folder, and when that container exits, every
          # file there but the logs (*.log) is removed, and every symbolic link with them: the build writes that folder
          # itself, and this job's artifact step uploads check-logs/**/*.log with actions/upload-artifact, which follows
          # a link (search.ts: `followSymbolicLinks: true`, and its filter is `fs.stat`, not `lstat`), so a `*.log` link
          # a failing build leaves would carry the bytes of any file of this runner -- ~/.docker/config.json, which the
          # ghcr.io login step above writes with this job's token, among them -- to everyone who can read the pull
          # request's artifacts.  Any other call goes to docker as it is.  check-units.sh is not changed for this: it is
          # the checker (keys.NOT_THE_CHECKER), whose ids are in every unit's key.
          : "${CHECK_LOGS:?}"
          rm -rf -- "$CHECK_LOGS" "$CHECK_LOGS.bin"
          mkdir -p -- "$CHECK_LOGS/tmp" "$CHECK_LOGS.bin"
          CHECK_LOGS_DOCKER="$(command -v docker)" || { echo "::error::no docker on PATH"; exit 1; }
          export CHECK_LOGS_DOCKER
          cat > "$CHECK_LOGS.bin/docker" <<'EOF'
          #!/bin/bash
          : "${CHECK_LOGS:?}" "${CHECK_LOGS_DOCKER:?}"
          if [ "${1:-}" = run ]; then
            prev=
            for a in "$@"; do
              if [ "$prev" = -v ] && [[ "$a" == *:/work ]]; then
                shift
                rc=0
                "$CHECK_LOGS_DOCKER" run -v "$CHECK_LOGS/tmp:/oft-check-logs" -e TMPDIR=/oft-check-logs "$@" || rc=$?
                find "$CHECK_LOGS/tmp" \( -type l -o -type f ! -name '*.log' \) -delete
                find "$CHECK_LOGS/tmp" -mindepth 1 -type d -empty -delete
                exit "$rc"
              fi
              prev=$a
            done
          fi
          exec "$CHECK_LOGS_DOCKER" "$@"
          EOF
          chmod +x "$CHECK_LOGS.bin/docker"
          rc=0
          PATH="$CHECK_LOGS.bin:$PATH" bash "$TOOLS/oft/ci/check-units.sh" 2>&1 | tee "$CHECK_LOGS/check-units.log" || rc=$?
          if [ "$rc" -ne 0 ]; then
            # The Rocq error can sit 140k lines up a 362k-line dune log.  Of each log a failure names (`(see PATH)`), or,
            # when none it names is here, of each log that holds an `Error` line: the first 40 `File ..., line N` and
            # `Error` blocks, with 5 lines of context, as the stream's check-pod tool prints them; 8,000 bytes in all.
            # A Rocq error is a `File "...", line N, characters ...:` line and an `Error: ...` line under it, and a dune
            # log holds many warnings of the same `File` form: in a proof library's log on the check runner, warnings
            # filled the 8,000 bytes 32,000 lines before its one error.  So in a log that holds an `Error` line, the
            # first 40 of those lines are printed, each with the 6 lines above it (its `File` line among them) and the 5
            # below; a log with none gets the check-pod tool's `File` and `Error` lines.
            # The path is taken only from a `^FAIL ` line, which oft check itself writes (tools/oft/check.py), never
            # from free text: a proof controls part of its own error message, so an unanchored read would let it name
            # any file of this runner to be printed here.  A path that is not under /oft-check-logs/, or that holds a
            # `..` segment, is refused in one line and not read (OSSV-366).  A build writes its own logs: /oft-check-logs
            # is the TMPDIR of the container the check runs in, so a `*.log` the build leaves there can be a symbolic
            # link to any file of this runner, which `[ -f ]` would follow.  So a path is read only when it resolves to
            # itself: a regular file, under this run's own log folder, reached through no link.
            # the log paths the failures name
            logs=()
            refused=()
            linked=()
            root="$(realpath -e -- "$CHECK_LOGS/tmp")"
            while IFS= read -r p; do
              case "$p" in
                /oft-check-logs/*) rel=${p#/oft-check-logs/} ;;
                *) refused+=("$p"); continue ;;
              esac
              case "/$rel" in
                */../*|*/..) refused+=("$p"); continue ;;
              esac
              held="$CHECK_LOGS/tmp/$rel"
              # a path this run left nothing at is passed over in silence, as a build whose log is not here
              [ -e "$held" ] || [ -L "$held" ] || continue
              if [ "$(realpath -e -- "$held" 2> /dev/null || true)" != "$root/$rel" ] || [ ! -f "$held" ]; then
                linked+=("$p")
                continue
              fi
              logs+=("$held")
            done < <(grep -E '^FAIL ' -- "$CHECK_LOGS/check-units.log" \
                       | grep -oE '\(see [^)]+\)' \
                       | sed -E 's|^\(see ||; s|\)$||' | awk '!seen[$0]++' || true)
            for p in ${refused[@]+"${refused[@]}"}; do
              echo "== refused the log path a failure names, it is not a file of this run's log folder: $p"
            done
            for p in ${linked[@]+"${linked[@]}"}; do
              echo "== refused the log path a failure names, it does not resolve to a regular file of this run's own log folder: $p"
            done
            # end of the log paths the failures name
            if [ "${#logs[@]}" -eq 0 ]; then
              # The build names its own folders, and a folder's name can hold a line break: a list split on lines would
              # read `<folder>\n/any/runner/file.log` as two paths, the second outside this run's log folder.  So the
              # list is NUL-separated, and each path is read only when it resolves to itself, as a named path above is.
              found=()
              mapfile -d '' -t found < <(grep -rlZE --include='*.log' '^Error' -- "$CHECK_LOGS/tmp" | sort -z || true)
              for held in ${found[@]+"${found[@]}"}; do
                rel=${held#"$CHECK_LOGS/tmp/"}
                if [ "$(realpath -e -- "$held" 2> /dev/null || true)" = "$root/$rel" ] && [ -f "$held" ]; then
                  logs+=("$held")
                fi
              done
            fi
            for f in "${logs[@]}"; do
              echo "== the first errors of ${f#"$CHECK_LOGS/tmp/"} ($(wc -l < "$f") lines):"
              if grep -qE '^Error' -- "$f"; then
                grep -nE -m 40 -B 6 -A 5 '^Error' -- "$f" || true
              else
                grep -nE -m 40 -C 5 '^File .*, line [0-9]+|^Error' -- "$f" || true
              fi
            done > "$CHECK_LOGS/errors.txt"
            echo "== the first errors of the logs the failures name; the whole logs are this job's artifact check-logs-*"
            head -c 8000 -- "$CHECK_LOGS/errors.txt"
            size="$(wc -c < "$CHECK_LOGS/errors.txt")"
            [ "$size" -le 8000 ] || printf '\n== cut at 8000 of %d bytes\n' "$size"
          fi
          exit "$rc"
      # The build writes its own logs into /oft-check-logs (CHECK_LOGS/tmp, its TMPDIR), and the upload below follows
      # a symbolic link, so a `*.log` link it leaves would be uploaded with the bytes of what it points at.  The
      # docker wrapper above drops every link as each container exits, but three paths get past it.  A directory the
      # build chmods against the runner (the containers run as the runner's uid): the wrapper's `find` cannot unlink
      # inside it, and the wrapper's status is the container's, so nothing is said.  A cancelled job: the check step
      # is killed inside the container, so the wrapper never returns and its cleanup never runs, while the upload
      # still runs on `cancelled()`.  And `docker run` is only a client: a build that ignores the signals the
      # runner's cancellation forwards keeps running under the daemon, holding the mount, and plants its link again
      # after any sweep and before the upload globs.  So the writers go first.  `docker kill` is SIGKILL from the
      # daemon, which a build cannot trap, and `--rm` then takes the container away; killing every container is right
      # here, because this job has no `container:` and no `services:`, its runner is a GitHub-hosted larger runner of
      # its own (the job's `runs-on` comment), and the only containers on it are check-units.sh's, which run in the
      # foreground and are already gone on every path but cancellation.  Then the folder is made the runner's to walk
      # again and every link left in it goes; a real log is a file and stays.  A job that failed before the check
      # step has no folder to sweep and ends at once, rather than failing a second step on `find`'s missing path.
      - name: the build's symbolic links, out of the logs this job uploads
        if: failure() || cancelled()
        run: |
          [ -d "$RUNNER_TEMP/check-logs" ] || exit 0
          docker ps -q | xargs -r docker kill > /dev/null 2>&1 || true
          chmod -R u+rwX -- "$RUNNER_TEMP/check-logs" || true
          find "$RUNNER_TEMP/check-logs" -type l -delete
      # also when the job is cancelled, as GitHub cancels one that reaches timeout-minutes: the check step is then
      # stopped inside a container, whose other temporary files are still there, so only the logs are taken
      - name: oft check's logs, when the check failed or was stopped
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: check-logs-${{ matrix.job.index }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/check-logs/**/*.log
            ${{ runner.temp }}/check-logs/errors.txt
          if-no-files-found: ignore
          retention-days: 30
      # what the merge queue group's watch saw, also when it cancelled this run
      - name: the merge queue group's watch, its log
        if: always() && github.event_name == 'merge_group'
        run: cat -- "$RUNNER_TEMP/group-watch.log" 2> /dev/null || true

  controls:
    # the change's own tests/check.sh and dune files: only after lint has accepted the paths it changes
    needs: [plan, lint]
    # as the tests job: !cancelled() and plan's and lint's own results (that job says why)
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success'
      && needs.plan.outputs.controls == 'true' }}
    # Disk: on a private repository's ubuntu-24.04 runner, pulling the checker image beside the tree ran out of disk
    # ('no space left on device' while registering its layers); on the public repository the same job fits.  The
    # 4-core larger runner has 150 GB (this job took a median 7.2 minutes on 16 cores over 24-28 October).
    runs-on: ubuntu-24.04-4core
    timeout-minutes: 120
    steps:
      # The object store of main (.github/workflows/images.yml, git_objects); the lint job's two steps say what it is and
      # what a run that finds none does.  The controls themselves are unchanged: dune builds in the container
      # below, from the tree this checkout writes, with no build cache of any kind.
      - id: git_objects
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: head/.git
          key: git-objects-v1-
          restore-keys: git-objects-v1-
      - if: steps.git_objects.outputs.cache-matched-key != ''
        name: the object store this checkout starts from
        env:
          STORE: ${{ steps.git_objects.outputs.cache-matched-key }}
        run: echo "$STORE, $(du -sh head/.git | cut -f1), main at $(git -C head rev-parse refs/ossv-git-cache/base)"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          persist-credentials: false   # the change's code runs here, and this job fetches nothing more
      - name: the checker image release.yaml pins, by digest (fail closed)
        id: image
        env:
          IMG: ${{ needs.plan.outputs.checker }}
        run: |
          set -euo pipefail
          [[ "$IMG" =~ ^ghcr\.io/theorem-labs/oss-fuzz-theorems-checker@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::release.yaml must name the checker image by digest in images.checker, got '$IMG'"; exit 1; }
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
      - name: sign in to ghcr.io, where the pinned images are
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # tests/check.sh checks its instance controls with `python3 -m oft.check --instance-control` (tests/README.md),
      # and oft check imports PyYAML, which the checker image does not hold.  So the change's own requirements are
      # installed, hash-pinned, for the image's CPython 3.12, into a folder the container reads on PYTHONPATH, as the
      # checks job gives them to its containers; the container still has no network.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: the tools' dependencies (PyYAML, idna), hash-pinned, for the container
        run: |
          set -euo pipefail
          python -m pip install --quiet --require-hashes --only-binary=:all: --target "$RUNNER_TEMP/pydeps" \
            -r head/tools/oft/requirements.txt
      - name: positive controls pass, negative controls are refused (tests/check.sh)
        run: |
          set -euo pipefail
          docker pull --quiet "${{ steps.image.outputs.image }}"
          docker run --rm --network none -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$RUNNER_TEMP/pydeps:/pydeps:ro" -e PYTHONPATH=/pydeps \
            -v "$GITHUB_WORKSPACE/head:/work" -w /work "${{ steps.image.outputs.image }}" \
            bash -c 'dune build --root . @theories/default @tests/default && ./tests/check.sh'

  lps_pin:
    # A change to release.yaml, toolchain/ or theories/ against the model and the checker and runner images this
    # repository pins, and nothing else.  Every proof is checked in the image release.yaml's images.checker names, and
    # toolchain/checker.Dockerfile is that image's build definition: it pins the base image by digest, Rocq and
    # every opam package by version (OPAM_PACKAGES), and the Linux process semantics by LPS_TREE_SHA256, the hash of
    # the model's files which the image build refuses to differ from, cut by toolchain/lps-core.paths from the
    # commit release.yaml's semantics.commit names.  images.yml builds the image from these files on main alone,
    # and attests each build.  theories/ is the statement core (OSSVerify.Core) every harness and every proof
    # requires, written against that model.  This job holds:
    #   - the two pins of the model, semantics.commit and LPS_TREE_SHA256, to one hash, on this change's files;
    #   - the image release.yaml names to images.yml's build attestation, made on main;
    #   - on a repin (the plan's checker_repin: images.checker is not the base's; in release-check.yml, not the one
    #     main pinned before the push, or the parent's on a run by hand), the image to this change's build
    #     definition: the commit images.yml built it at has this change's toolchain/checker.Dockerfile and
    #     toolchain/lps-core.paths, byte for byte, and the image holds each opam package OPAM_PACKAGES pins, at its
    #     version.  Comparing with this change, and not only with the commit the attestation names, refuses a
    #     rollback to an image of an older reviewed definition: an image of stock Rocq 9.2.0 accepts public proofs
    #     of False (Dispatch issue OSSV-644);
    #   - when theories/ changes or the image moves, the image's own model files to LPS_TREE_SHA256, and this
    #     change's theories/ to compile in that image;
    #   - the runner image release.yaml's images.runner names, which every counterexample and finding runs in
    #     (tools/oft/ci/check-units.sh takes the container's exit status as the verdict, and a counterexample that
    #     passes gives its statement the status counterexample, which counts as a proof does), to images.yml's build
    #     attestation, made on main, and on a repin (the plan's runner_repin, read as checker_repin is) to this
    #     change's toolchain/runner.Dockerfile and tests/toy/ (its self-test, which the build runs as root), byte for
    #     byte.  Without it a change could repin images.runner to any image, one in which a fake counterexample
    #     passes, and only images.yml's daily verify-pins, after the merge, would refuse it.  A change that moves
    #     images.runner changes release.yaml, so this job runs on every one.
    # Where an image's pin is unchanged, that image is not compared with this change's definition.  It was
    # compared when it was pinned, and toolchain/ lands on main before an image built from it can be pinned
    # (images.yml builds on main alone), so that comparison would fail every change between the two, and every
    # push to main (release-check.yml runs this job too), until the repin lands.  A theories/ change in that
    # window is held as before: the image's model files must hash to this change's LPS_TREE_SHA256, so a theories/
    # change after a change of the model and before its repin fails until the repin lands.
    #
    # It waits for the plan and for nothing else, where the controls -- the one other job that compiles theories/ --
    # wait for lint.  A draft skips lint and with it the controls, and a theories/-only change plans no unit, so
    # the check jobs have nothing to run either: #2360, a draft whose one change was theories/Premises.v written
    # against LPS 727298f3, planned 0 units, skipped every build job, and passed required and main-gate with
    # nothing having compiled it (run 42509915684, 2026-11-08; the red team's finding, Dispatch issue OSSV-440).  A
    # theories/ change no job compiled is a failure here, never a pass with everything skipped, so this job runs
    # on a draft too, and `required` fails when the plan says this job runs and it did not pass.
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.lps_pin == 'true' }}
    # Disk: pulling the checker image beside a checkout ran a private repository's standard runner out of space
    # ('no space left on device' while registering its layers: the controls job says where).  This checkout is
    # theories/ and what dune reads beside it, not the tree, but the image is the same, so the runner is the
    # controls job's 4-core larger one.  The build itself is four files: 7 s on 8 cores, measured on this tree in
    # the pinned image on 2026-11-08.
    runs-on: ubuntu-24.04-4core
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read       # the pinned checker image from ghcr.io
      attestations: read   # images.yml's build attestations of the pinned checker and runner images
    steps:
      # theories/ with the dune-project that declares its package, and release.yaml and toolchain/ for the two pins.
      # Not the tree: no other dune file takes part in `dune build @theories/default`, and the proof libraries are
      # gigabytes.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          persist-credentials: false   # theories/ is the change's own; the attestation step's fetch sends its own header
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /dune-project
            /release.yaml
            /theories/
            /toolchain/
      # The PyYAML that reads release.yaml, from the tools' requirements.txt of the commit the plan judges this change
      # against (its `base`), never from the change's own.  This job judges the pins, and what it installs runs on its
      # runner before it judges anything: the change writes its requirements' hashes itself, a source distribution
      # among them runs its build hooks as the runner's user, and a wheel can install a .pth file that every later
      # `python` runs, so the change's requirements could replace what every later step runs (gh, jq, docker, the
      # Python they import) and the steps would no longer be this workflow's.  --only-binary :all: keeps the base's
      # named pins to the wheels they list, which run nothing as they install.  The change's own requirements are
      # installed where its own code runs: the tests and the controls (tools/oft/tests/test_workflow_verdicts.py,
      # LpsPinVerifierTest).  With no commit before this change to take them from, the job fails (the step below):
      # actions/checkout given no ref checks out this run's own commit, and there is no other trusted list.
      - name: the plan named a commit before this change to take the verifier's requirements from (fail closed)
        env:
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          set -euo pipefail
          # pr.yml's plan names the merge commit's first parent, the merge queue group's base or main before the
          # push, and this very commit for a run with no base to compare with (a push that made the branch, or one
          # whose base cannot be fetched); release-check.yml's names main before the push, or the parent, and nothing
          # where the repository holds neither.
          [[ "$BASE" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]] || {
            echo "::error::the plan named no commit before this change ('$BASE'): there are no requirements but the change's own to read release.yaml with, and this job runs none of the change's code before it judges the pins"
            exit 1; }
          head=$(git -C head rev-parse HEAD)
          [ "$BASE" != "$head" ] || {
            echo "::error::the plan's base is this run's own commit $head (no base to compare with): its requirements are the change's own, and this job runs none of the change's code before it judges the pins"
            exit 1; }
          echo "the verifier's requirements come from $BASE, the commit before this change ($head)"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: verifier
          ref: ${{ needs.plan.outputs.base }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/oft/requirements.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: the base's tools' dependencies (PyYAML, idna), hash-pinned, wheels only
        run: python -m pip install --quiet --require-hashes --only-binary ':all:' -r verifier/tools/oft/requirements.txt
      - name: release.yaml's model and toolchain/checker.Dockerfile's LPS_TREE_SHA256 are one pin
        id: pin
        working-directory: head
        run: |
          set -euo pipefail
          read -r repo commit < <(python -c 'import yaml; s = yaml.safe_load(open("release.yaml"))["semantics"]; print(s["repository"], s["commit"])')
          [ "$repo" = https://github.com/theorem-labs/rocq-linux-process-semantics ] ||
            { echo "::error::release.yaml's semantics.repository is '$repo'"; exit 1; }
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::release.yaml's semantics.commit is '$commit'"; exit 1; }
          # One ARG LPS_TREE_SHA256 line, and it is a sha256: a second line, empty or continued, would be the
          # argument the image build actually hashes against, and a check of the first would say nothing of it.
          declared=$(grep -c '^ARG LPS_TREE_SHA256' toolchain/checker.Dockerfile || true)
          [ "$declared" = 1 ] ||
            { echo "::error::toolchain/checker.Dockerfile declares ARG LPS_TREE_SHA256 $declared time(s): the checker image pins one hash of the model's files"; exit 1; }
          pin=$(sed -n 's/^ARG LPS_TREE_SHA256=\([0-9a-f]\{64\}\)$/\1/p' toolchain/checker.Dockerfile)
          [ -n "$pin" ] ||
            { echo "::error::toolchain/checker.Dockerfile's ARG LPS_TREE_SHA256 is not one sha256 of 64 hexadecimal characters"; exit 1; }
          # The model as the image build takes it: the commit release.yaml names, cut to the pathspecs of
          # toolchain/lps-core.paths by `git archive` (the `lps` build context, images.yml's step of the same
          # words), hashed as toolchain/checker.Dockerfile hashes that context before it pins the package.
          git init -q "$RUNNER_TEMP/lps-repo"
          git -C "$RUNNER_TEMP/lps-repo" fetch -q --depth=1 "$repo" "$commit"
          mkdir "$RUNNER_TEMP/lps"
          grep -v -e '^#' -e '^$' toolchain/lps-core.paths |
            xargs -d '\n' git -C "$RUNNER_TEMP/lps-repo" archive "$commit" -- | tar -x -C "$RUNNER_TEMP/lps"
          files=$(find "$RUNNER_TEMP/lps" -type f | wc -l)
          got=$(cd "$RUNNER_TEMP/lps" && find . -type f -printf '%P\n' | LC_ALL=C sort |
            xargs -d '\n' -r sha256sum | sha256sum | cut -c1-64)
          echo "release.yaml's semantics.commit $commit, cut to toolchain/lps-core.paths ($files files), hashes to $got"
          echo "toolchain/checker.Dockerfile pins LPS_TREE_SHA256 $pin"
          { echo "### the model this change's theories/ is compiled against"
            echo "- release.yaml \`semantics.commit\` \`$commit\`, cut to \`toolchain/lps-core.paths\` ($files files), hashes to \`$got\`"
            echo "- toolchain/checker.Dockerfile \`LPS_TREE_SHA256\`: \`$pin\`"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$got" = "$pin" ] || {
            echo "::error::the two pins name different models: release.yaml's semantics.commit $commit hashes to $got, and toolchain/checker.Dockerfile pins LPS_TREE_SHA256 $pin"
            echo "the two pins name different models: \`$got\` against \`$pin\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1; }
          echo "the two pins are one model"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: the checker image release.yaml pins, by digest (fail closed)
        id: image
        working-directory: head
        run: |
          set -euo pipefail
          img=$(python -c 'import yaml; print(yaml.safe_load(open("release.yaml"))["images"]["checker"])')
          [[ "$img" =~ ^ghcr\.io/theorem-labs/oss-fuzz-theorems-checker@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::release.yaml must name the checker image by digest in images.checker, got '$img'"; exit 1; }
          echo "image=$img" >> "$GITHUB_OUTPUT"
      # The image release.yaml names is one images.yml built and attested on main, verified with the command at the
      # top of images.yml, with images.yml's signer and gh check (its image job's verify step says why each is as it
      # is).  On a repin, the commit that attestation names must hold this change's toolchain/checker.Dockerfile and
      # toolchain/lps-core.paths: the image was built from the definition this change is reviewed with, and from no
      # older or other one.  The two files are compared by their git object ids, which are one for two files exactly
      # when their bytes are one, so the attested commit is fetched one commit deep and without its blobs.  The
      # fetch goes over git with the job's token in a header, never in a URL or an argument, and spends none of the
      # token's API budget.  verify-pins in images.yml verifies the same digests daily, after the fact; this step
      # verifies one before the change that pins it can merge.
      - name: images.yml built and attested the pinned checker image on main, from this change's toolchain/ on a repin
        working-directory: head
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.image }}
          REPIN: ${{ needs.plan.outputs.checker_repin }}
        run: |
          set -euo pipefail
          case "$REPIN" in true|false) ;; *)
            echo "::error::the plan answered checker_repin '$REPIN', neither true nor false"; exit 1 ;; esac
          # images.yml stores each attestation in the repository it ran in and does not push it beside the image,
          # since it names that private repository; a token of the public repository reads none of them.  The
          # public repository takes release.yaml from that repository's main, by a release, and this step holds
          # images.checker there.
          if [ "$GITHUB_REPOSITORY" = theorem-labs/oss-verify-proofs ]; then
            echo "theorem-labs/oss-verify-proofs holds no attestation of $IMAGE: the repository whose images.yml built it verifies it"
            echo "- the checker image's attestation: not read in theorem-labs/oss-verify-proofs, which holds none" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh_version=$(gh --version)
          echo "$gh_version"
          gh_version=${gh_version%%$'\n'*}
          if ! [[ "$gh_version" =~ ^gh\ version\ ([0-9]+)\.([0-9]+)\. ]] ||
             (( 10#${BASH_REMATCH[1]} < 2 || (10#${BASH_REMATCH[1]} == 2 && 10#${BASH_REMATCH[2]} < 67) )); then
            echo "::error::gh 2.67 or newer is needed, not '$gh_version': gh 2.49 to 2.66 could exit 0 for a digest" \
              "with no attestation of the predicate type asked for (CVE-2025-25204)"
            exit 1
          fi
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/images.yml@refs/heads/main"
          # three tries, 10 and 20 s apart, for a passing error of the API or the registry
          verified=
          for try in 1 2 3; do
            if gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY" --cert-identity "$identity" \
                 --source-ref refs/heads/main --format json > "$RUNNER_TEMP/attestation.json"; then
              verified=1
              break
            fi
            [ "$try" = 3 ] || sleep $((try * 10))
          done
          [ -n "$verified" ] || {
            echo "::error::gh attestation verify refused $IMAGE in 3 tries: release.yaml's images.checker is no image images.yml built and attested on main"
            echo "- the checker image's attestation: refused" >> "$GITHUB_STEP_SUMMARY"
            exit 1; }
          # An unchanged images.checker: gh's exit status is the verdict, and nothing it printed is read.
          if [ "$REPIN" = false ]; then
            echo "attested: gh attestation verify passed $IMAGE, built by images.yml on refs/heads/main"
            echo "- the checker image's attestation: verified, images.yml on refs/heads/main" >> "$GITHUB_STEP_SUMMARY"
            echo "images.checker is unchanged by this change, and was held to its build definition when it was pinned: its attestation alone is verified here"
            exit 0
          fi
          # The commit each attestation says images.yml built the image at: its signing certificate's source
          # repository digest.  With --format json, gh prints a JSON array on stdout, one object per verified
          # attestation, whose verificationResult is sigstore-go's VerificationResult; its signature.certificate is
          # the certificate's summary, with the Fulcio extensions inline (cli/cli v2.103.3, the runner image's gh:
          # pkg/cmd/attestation/verification/sigstore.go:28-31 and verify/verify.go:321, and its log lines go to
          # stderr, and only to a terminal, io/handler.go:45-50; sigstore-go v1.3.0, which that gh builds with:
          # pkg/verify/signed_entity.go:256 and 263, pkg/fulcio/certificate/summarize.go:26-30 and extensions.go:111).
          # A build of the same files gives another digest each time (images.yml's header), so one image has one
          # such commit; each one named is held to the same rule.
          commits=$(jq -r '[.[].verificationResult.signature.certificate.sourceRepositoryDigest] | unique | .[]' \
            "$RUNNER_TEMP/attestation.json") || commits=
          [ -n "$commits" ] || {
            echo "::error::gh attestation verify passed $IMAGE and named no commit images.yml built it at"; exit 1; }
          for c in $commits; do
            [[ "$c" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::the attestation of $IMAGE names '$c' as the commit images.yml built it at, not a commit"; exit 1; }
          done
          echo "attested: images.yml built $IMAGE on refs/heads/main at $commits"
          echo "- the checker image's attestation: images.yml on refs/heads/main, at \`$commits\`" >> "$GITHUB_STEP_SUMMARY"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          built="$RUNNER_TEMP/built-from"
          git init -q "$built"
          git -C "$built" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          refused=0
          for c in $commits; do
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" GIT_CONFIG_VALUE_0="$auth" \
              GIT_TERMINAL_PROMPT=0 git -C "$built" fetch -q --no-tags --depth=1 --filter=blob:none origin "$c" || {
                echo "::error::$c, the commit images.yml built $IMAGE at, cannot be fetched from $GITHUB_REPOSITORY"
                exit 1; }
            for f in toolchain/checker.Dockerfile toolchain/lps-core.paths; do
              there=$(git -C "$built" rev-parse -q --verify "$c:$f") || there="no such file"
              here=$(git rev-parse -q --verify "HEAD:$f") || here="no such file"
              if [ "$there" = "$here" ] && [ "$here" != "no such file" ]; then
                echo "$f: the file images.yml built $IMAGE from at $c ($here)"
              else
                echo "::error::$IMAGE was built from another $f than this change's: images.yml built it at $c, whose $f is $there, and this change's is $here"
                echo "- $f differs from the one the image was built from at \`$c\`" >> "$GITHUB_STEP_SUMMARY"
                refused=1
              fi
            done
          done
          [ "$refused" = 0 ] || exit 1
          echo "the repinned checker image was built from this change's toolchain/checker.Dockerfile and toolchain/lps-core.paths" |
            tee -a "$GITHUB_STEP_SUMMARY"
      - name: the runner image release.yaml pins, by digest (fail closed)
        id: runner_image
        working-directory: head
        run: |
          set -euo pipefail
          img=$(python -c 'import yaml; print(yaml.safe_load(open("release.yaml"))["images"]["runner"])')
          [[ "$img" =~ ^ghcr\.io/theorem-labs/oss-fuzz-theorems-runner@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::release.yaml must name the runner image by digest in images.runner, got '$img'"; exit 1; }
          echo "image=$img" >> "$GITHUB_OUTPUT"
      # The runner image release.yaml names, which every counterexample and finding runs in, held as the checker's
      # attestation step above holds the checker image: images.yml built and attested it on main, verified with the
      # same command, signer and gh check, whether or not this change moves it.  On a repin (the plan's
      # runner_repin), the commit that attestation names must hold this change's toolchain/runner.Dockerfile and
      # tests/toy/, compared by git object id as there (a tree id for tests/toy/, which neither may lack unless both
      # do): an image of an older or another runner definition is refused before the change that pins it can merge.
      # tests/toy/ is the image's self-test, and is an input of the image although it is mounted and not copied in:
      # the build runs its make_elf.py as root in the stage it ships, so a script there could rewrite qemu or
      # anything else the image holds.  The build's arguments are the Dockerfile's own: images.yml's step `build and
      # self-test (toolchain/<image>.Dockerfile)` gives the runner build its two build contexts and its labels and no
      # --build-arg, so DEBIAN_BASE and DEBIAN_SNAPSHOT take the defaults the Dockerfile compared here sets.  That is
      # images.yml as this change has it; the run that built the image ran images.yml at the commit it names.  The
      # runner's last input, the `oft-tools` build context, is not compared here: the step after the sign-in says
      # why, and what it reads instead.
      - name: images.yml built and attested the pinned runner image on main, from this change's toolchain/runner.Dockerfile and tests/toy/ on a repin
        working-directory: head
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.runner_image.outputs.image }}
          REPIN: ${{ needs.plan.outputs.runner_repin }}
        run: |
          set -euo pipefail
          case "$REPIN" in true|false) ;; *)
            echo "::error::the plan answered runner_repin '$REPIN', neither true nor false"; exit 1 ;; esac
          # As for the checker image: the public repository holds no attestation, and takes release.yaml from this
          # repository's main, by a release, where this step holds images.runner.
          if [ "$GITHUB_REPOSITORY" = theorem-labs/oss-verify-proofs ]; then
            echo "theorem-labs/oss-verify-proofs holds no attestation of $IMAGE: the repository whose images.yml built it verifies it"
            echo "- the runner image's attestation: not read in theorem-labs/oss-verify-proofs, which holds none" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh_version=$(gh --version)
          echo "$gh_version"
          gh_version=${gh_version%%$'\n'*}
          if ! [[ "$gh_version" =~ ^gh\ version\ ([0-9]+)\.([0-9]+)\. ]] ||
             (( 10#${BASH_REMATCH[1]} < 2 || (10#${BASH_REMATCH[1]} == 2 && 10#${BASH_REMATCH[2]} < 67) )); then
            echo "::error::gh 2.67 or newer is needed, not '$gh_version': gh 2.49 to 2.66 could exit 0 for a digest" \
              "with no attestation of the predicate type asked for (CVE-2025-25204)"
            exit 1
          fi
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/images.yml@refs/heads/main"
          # three tries, 10 and 20 s apart, for a passing error of the API or the registry
          verified=
          for try in 1 2 3; do
            if gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY" --cert-identity "$identity" \
                 --source-ref refs/heads/main --format json > "$RUNNER_TEMP/runner-attestation.json"; then
              verified=1
              break
            fi
            [ "$try" = 3 ] || sleep $((try * 10))
          done
          [ -n "$verified" ] || {
            echo "::error::gh attestation verify refused $IMAGE in 3 tries: release.yaml's images.runner is no image images.yml built and attested on main"
            echo "- the runner image's attestation: refused" >> "$GITHUB_STEP_SUMMARY"
            exit 1; }
          # An unchanged images.runner: gh's exit status is the verdict, and nothing it printed is read.
          if [ "$REPIN" = false ]; then
            echo "attested: gh attestation verify passed $IMAGE, built by images.yml on refs/heads/main"
            echo "- the runner image's attestation: verified, images.yml on refs/heads/main" >> "$GITHUB_STEP_SUMMARY"
            echo "images.runner is unchanged by this change, and was held to its build definition when it was pinned: its attestation alone is verified here"
            exit 0
          fi
          # The commit each attestation names, read as the checker's step reads it.
          commits=$(jq -r '[.[].verificationResult.signature.certificate.sourceRepositoryDigest] | unique | .[]' \
            "$RUNNER_TEMP/runner-attestation.json") || commits=
          [ -n "$commits" ] || {
            echo "::error::gh attestation verify passed $IMAGE and named no commit images.yml built it at"; exit 1; }
          for c in $commits; do
            [[ "$c" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::the attestation of $IMAGE names '$c' as the commit images.yml built it at, not a commit"; exit 1; }
          done
          echo "attested: images.yml built $IMAGE on refs/heads/main at $commits"
          echo "- the runner image's attestation: images.yml on refs/heads/main, at \`$commits\`" >> "$GITHUB_STEP_SUMMARY"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          built="$RUNNER_TEMP/runner-built-from"
          git init -q "$built"
          git -C "$built" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          refused=0
          for c in $commits; do
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" GIT_CONFIG_VALUE_0="$auth" \
              GIT_TERMINAL_PROMPT=0 git -C "$built" fetch -q --no-tags --depth=1 --filter=blob:none origin "$c" || {
                echo "::error::$c, the commit images.yml built $IMAGE at, cannot be fetched from $GITHUB_REPOSITORY"
                exit 1; }
            # the Dockerfile's blob id, and tests/toy/'s tree id: the fetch above has every tree of the commit
            for f in toolchain/runner.Dockerfile tests/toy; do
              there=$(git -C "$built" rev-parse -q --verify "$c:$f") || there=none
              here=$(git rev-parse -q --verify "HEAD:$f") || here=none
              if [ "$there" = "$here" ] && { [ "$here" != none ] || [ "$f" = tests/toy ]; }; then
                echo "$f: the one images.yml built $IMAGE from at $c ($here)"
              else
                echo "::error::$IMAGE was built from another $f than this change's: images.yml built it at $c, whose $f is $there, and this change's is $here"
                echo "- $f differs from the one the image was built from at \`$c\`" >> "$GITHUB_STEP_SUMMARY"
                refused=1
              fi
            done
          done
          [ "$refused" = 0 ] || exit 1
          echo "the repinned runner image was built from this change's toolchain/runner.Dockerfile and tests/toy/" |
            tee -a "$GITHUB_STEP_SUMMARY"
      - name: sign in to ghcr.io, where the pinned images are
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # The runner's `oft-tools` build context: the tools/oft of the public repository's main (images.yml's header),
      # with the PyYAML its requirements.txt pins installed into /opt/oss-fuzz-theorems/pydeps/.  That input is bound
      # to the public repository's main, which this repository's release process writes, and not to this change, so
      # it is not compared here.  CI mounts the checkout's tools over the image's copy, but not over pydeps/, and the
      # build ran the copy (`oft --help`, the tools' own tests) in the stages it ships.  images.yml labels each runner
      # with the git tree of that tools/oft (oss-fuzz-theorems.tools.tree) and the public commit it took it from
      # (oss-fuzz-theorems.tools.commit).  On a repin this step holds the image to naming a git tree there, read as
      # images.yml's daily plan reads it, so that a later step can compare it with the tools/oft tree of the public
      # release this change's tree is cut for, or with the one images.yml's plan finds on the public main.
      - name: on a runner repin, the runner image names the git tree of the tools/oft it carries
        env:
          IMAGE: ${{ steps.runner_image.outputs.image }}
          REPIN: ${{ needs.plan.outputs.runner_repin }}
        run: |
          set -euo pipefail
          case "$REPIN" in
            false)
              echo "images.runner is unchanged by this change: its labels are not read here"
              exit 0 ;;
            true) ;;
            *) echo "::error::the plan answered runner_repin '$REPIN', neither true nor false"; exit 1 ;;
          esac
          labels=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Image.Config.Labels}}') || {
            echo "::error::the labels of the runner image $IMAGE cannot be read"; exit 1; }
          tree=$(jq -r '."oss-fuzz-theorems.tools.tree" // "none"' <<< "$labels") || tree=none
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::the runner image $IMAGE names no git tree of the tools/oft it carries: its label oss-fuzz-theorems.tools.tree is '$tree'"
            exit 1; }
          echo "the runner image carries the tools/oft of git tree $tree (its label oss-fuzz-theorems.tools.tree)" |
            tee -a "$GITHUB_STEP_SUMMARY"
      # On a repin, the image holds the opam packages this change's toolchain/checker.Dockerfile pins, each at its
      # version: Rocq, its libraries and dune, as OPAM_PACKAGES lists them.  The image's own opam answers, run as the
      # image's user, whose switch the build installed into, with no network.  The checker's attestation step ties the
      # image to the Dockerfile by images.yml's attestation; this one reads what the image holds, so a list the build
      # did not install as written, or an argument given to the build in its place, is named here package by package.
      - name: on a repin, the checker image holds each opam package toolchain/checker.Dockerfile pins, at its version
        working-directory: head
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          REPIN: ${{ needs.plan.outputs.checker_repin }}
        run: |
          set -euo pipefail
          case "$REPIN" in
            false)
              echo "images.checker is unchanged by this change, and was held to its build definition when it was pinned: its packages are not read here"
              exit 0 ;;
            true) ;;
            *) echo "::error::the plan answered checker_repin '$REPIN', neither true nor false"; exit 1 ;;
          esac
          # One ARG OPAM_PACKAGES with a value: a second would be the list a stage of the image build installs, and
          # a check of the first would say nothing of it.
          declared=$(grep -c '^ARG OPAM_PACKAGES=' toolchain/checker.Dockerfile || true)
          [ "$declared" = 1 ] || {
            echo "::error::toolchain/checker.Dockerfile gives ARG OPAM_PACKAGES a value $declared time(s): the checker image pins one list of opam packages"
            exit 1; }
          read -r -a pinned <<< "$(sed -n 's/^ARG OPAM_PACKAGES="\([^"]*\)"$/\1/p' toolchain/checker.Dockerfile)"
          [ "${#pinned[@]}" -gt 0 ] || {
            echo "::error::toolchain/checker.Dockerfile's ARG OPAM_PACKAGES is not one quoted list of NAME.VERSION"; exit 1; }
          docker pull --quiet "$IMAGE"
          installed=$(docker run --rm --network none "$IMAGE" opam list --installed --short --columns=package) || {
            echo "::error::opam cannot list the packages installed in the checker image $IMAGE"; exit 1; }
          # `--short` prints no header, and `--columns=package` one NAME.VERSION per line, with no padding: opam pads
          # every column but the last, and cuts a line only at a terminal's width, which this output is not (ocaml/opam
          # 2.6.1 and 2.1.0, src/client/opamListCommand.ml's Package column and display, src/core/opamStd.ml's
          # align_table and terminal_columns).  An opam package's name is letters, digits, '-', '_' and '+' (the opam
          # manual), so NAME.VERSION splits at its first '.'.
          declare -A have=()
          while read -r line; do
            if [ -n "$line" ]; then have["${line%%.*}"]=${line#*.}; fi
          done <<< "$installed"
          refused=0
          for p in "${pinned[@]}"; do
            name=${p%%.*} version=${p#*.}
            if [ "$name" = "$p" ] || [ -z "$name" ] || [ -z "$version" ]; then
              echo "::error::toolchain/checker.Dockerfile's OPAM_PACKAGES names '$p', not NAME.VERSION"
              refused=1
            elif [ -z "${have[$name]+set}" ]; then
              echo "::error::the checker image $IMAGE holds no opam package $name, and toolchain/checker.Dockerfile pins $p"
              refused=1
            elif [ "${have[$name]}" != "$version" ]; then
              echo "::error::the checker image $IMAGE holds $name.${have[$name]}, and toolchain/checker.Dockerfile pins $p"
              refused=1
            else
              echo "$p: installed"
            fi
          done
          [ "$refused" = 0 ] || {
            echo "- the checker image's opam packages differ from toolchain/checker.Dockerfile's OPAM_PACKAGES" >> "$GITHUB_STEP_SUMMARY"
            exit 1; }
          echo "the checker image holds each of the ${#pinned[@]} opam packages toolchain/checker.Dockerfile pins, at its version" |
            tee -a "$GITHUB_STEP_SUMMARY"
      # The image's model, and this change's theories/ compiled in it, when theories/ changes or the image moves.  A
      # change that does neither leaves both as the base had them: the image was held to the model when it was
      # pinned, and theories/ compiled in it then.
      - name: this change's theories/ compiles against the model the pin names
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          PIN: ${{ steps.pin.outputs.pin }}
          THEORIES: ${{ needs.plan.outputs.theories }}
          REPIN: ${{ needs.plan.outputs.checker_repin }}
        run: |
          set -euo pipefail
          case "$THEORIES $REPIN" in
            "false false")
              echo "theories/ unchanged and images.checker unchanged by this change: the image's model and theories/ are as they were before it"
              exit 0 ;;
            "true true" | "true false" | "false true") ;;
            *) echo "::error::the plan answered theories '$THEORIES' and checker_repin '$REPIN', each to be true or false"; exit 1 ;;
          esac
          [[ "$PIN" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the pin step gave no hash ('$PIN')"; exit 1; }
          docker pull --quiet "$IMAGE"
          # The image is pinned by digest and the pins agree, but a digest alone says nothing of the model inside
          # it: a change could move semantics.commit and LPS_TREE_SHA256 together and leave images.checker at an
          # image built from the model before them.  The image keeps the files it was built from, in ~opam/lps,
          # and the build refused them unless they hashed to its LPS_TREE_SHA256, so hashing them here, the way
          # that build does, ties the image to the commit release.yaml names.
          got=$(docker run --rm --network none -u "$(id -u):$(id -g)" -e HOME=/tmp "$IMAGE" \
            bash -c 'cd ~opam/lps && find . -type f -printf "%P\n" | LC_ALL=C sort |
              xargs -d "\n" -r sha256sum | sha256sum | cut -c1-64') || {
                echo "::error::the model's files cannot be read in the checker image $IMAGE"; exit 1; }
          echo "the checker image's own model files hash to $got"
          echo "- the checker image's own model files hash to \`$got\`" >> "$GITHUB_STEP_SUMMARY"
          [ "$got" = "$PIN" ] || {
            echo "::error::the checker image release.yaml pins was built from another model: its files hash to $got, and the pin is $PIN"
            echo "the checker image was built from another model: \`$got\` against \`$PIN\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1; }
          # The theory whole, not the changed files alone: a Rocq file compiles with its siblings or not at all.
          # Every theories/*.v must leave its .vo: `dune build @theories/default` passes over a theories/ with no
          # dune file, or over a file no stanza names, having compiled nothing, and on a draft this job is the
          # only one that compiles theories/ at all.  No network, as every check of this repository compiles.
          docker run --rm --network none -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE/head:/work" -w /work "$IMAGE" \
            bash -c 'dune build --root . @theories/default &&
              for v in theories/*.v; do
                [ -f "_build/default/${v%.v}.vo" ] ||
                  { echo "no _build/default/${v%.v}.vo: @theories/default compiled nothing for $v"; exit 1; }
              done &&
              echo "compiled: $(find _build/default/theories -name "*.vo" | wc -l) theory file(s)"' || {
              echo "::error::this change's theories/ does not compile against the model release.yaml and toolchain/checker.Dockerfile pin (the hashes are in the step above): it is written for another model, or theories/ builds nothing"
              echo "theories/ does not compile against the pinned model" >> "$GITHUB_STEP_SUMMARY"
              exit 1; }
          echo "theories/ compiles against the pinned model"
          echo "theories/ compiles against the pinned model" >> "$GITHUB_STEP_SUMMARY"

  stream_tools:
    # The OSS Verify stream's operational tools (dev/stream/README.md), which the boxes run and no check job opens:
    # their own check, over the change's own code, so only after lint has accepted the paths it changes.  It deploys
    # nothing: a box takes a merged commit by itself, through `ossv-tools deploy`.
    needs: [plan, lint]
    # as the tests job: !cancelled() and plan's and lint's own results (that job says why)
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success'
      && needs.plan.outputs.stream_tools == 'true' }}
    # A pull request's new push cancels this job's run, as the workflow's own group does for the run; a push to main
    # and a merge queue group are keyed by the branch and the commit, and nothing cancels them.  The group differs
    # from the workflow's, which this run already holds.
    concurrency:
      group: stream-tools-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    # 75, not 45: the bin/ and lane/ tests step adds about ten minutes (Dispatch issue OSSV-276), and on 2026-11-08 a
    # merge group's run of this job (#2210, run 42429602984) hit 45 minutes and was cancelled while the same job ran in
    # 25-34 minutes in the other groups of the night, so 45 left no room for a slower runner.
    timeout-minutes: 75
    permissions:
      # The checker's fetch step, against a private repository.  The baselines the checker reads -- each revision of
      # the import's record (dev/stream/manifest.d/, and MANIFEST.tsv before it) for each commit that wrote a row,
      # and each revision of each file whose bytes drifted from its row -- are not in the blobless checkout below.
      # Before any check runs, the checker fetches the ones it will read in one step, with the token the checkout
      # persisted, and says DID NOT RUN for a check whose blobs it cannot fetch.  This is all the job may do: it
      # reads this repository and nothing else.
      contents: read
    env:
      # A fetch with no usable credential must fail, not wait.  Without this, git with no terminal asks an askpass
      # helper and then the terminal, and the job sits there: three local runs of the check over an
      # unauthenticated promisor clone were killed at 900 s, 500 s and 420 s where the same run takes 210 s
      # (the round 3 review of pull request 496, F3-1).  The checker sets this itself for its fetch step, and its
      # other git reads fetch nothing; the job's other fetches, and the git reads of the tests below, take it from
      # here.
      GIT_TERMINAL_PROMPT: "0"
      # The two trees the lane/tools tests read in the proofs clone below (NS_TEST_REPO), named by commit and not by
      # branch, so that a run reads the same bytes whatever the branches do (Dispatch issue OSSV-276).  Both are in
      # main's history, so main keeps them fetchable: NS_TEST_OLD d5def76244e7, main's head on 2026-11-03 before part 2
      # of the rename (the zlib/checksum_fuzzer unit in layout L2, an oft that reads no
      # namespace), and NS_TEST_T1 c06521233121, part 2's rename commit (pull request 617, merged as f9ec0f61e551),
      # whose oft reads release.yaml's namespace.  The tests default to the same two commits.
      NS_TEST_OLD: d5def76244e7c36f51d2f952027a8ffd105d5126
      NS_TEST_T1: c0652123312159143d06a319f74559a50eab2143
    # The PostgreSQL with pgvector that the database cases of dev/stream/tests read (OSSV_FIND_TEST_PG for
    # bin/ossv-find's, OSSV_TEST_PG for bin/ossv-find-embed's, both set on the tests step below).  Without it they
    # skipped here, and from 2026-11-06 ossv-find's search by meaning asked for partitions ossv-find-embed never
    # creates while every check of this job passed (Dispatch issue OSSV-686, R4 and R5).  Pinned by digest, pg16, the
    # image those cases were last run against.  Trust authentication, so no password is written here: the service
    # lives as long as this job, on a runner this job alone uses, and holds only what the tests write.
    services:
      pgvector:
        image: pgvector/pgvector@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      # The checker reads an imported file against the bytes it was imported with: the history of
      # manifest.d/, and of MANIFEST.tsv before it, for the commit that wrote the file's row and the path the tools tree had at it, then
      # `git show <commit>:<path>` for the file there (dev/stream/src/ossv/tools_check.py).  That blob is in git
      # whether or not the box the bytes came off, or the VM that ran the import, can still be reached, which is
      # why this is the baseline; one commit deep there is no row history to read and the run fails naming the
      # file.  So this job needs the whole history OF THIS BRANCH, and of nothing else.
      #
      # `fetch-depth: 0` is not that: actions/checkout then fetches +refs/heads/*, every branch of the
      # repository.  This one is 11.5 GB (`gh api repos/$GITHUB_REPOSITORY --jq .size`, 11,764,990 KB) over
      # 26,090 branches (`git ls-remote --heads`), most of them `cold/*` lane snapshots, and `filter: blob:none`
      # does not save it: the commits and trees of 26,090 branches are themselves gigabytes.  Three runs of this
      # job on pull request 581 died with `System.IO.IOException: No space left on device` in the runner's own
      # _diag writer, while `tests` (16 min) and `lint` (16 min) passed on the same pool.
      #
      # So: check out one commit, then deepen THIS COMMIT alone, naming it in the refspec as the ledger step of
      # the check job does (`git -C head fetch ... origin "$BASE" "$(git -C head rev-parse HEAD)"`, above).  A
      # bare `git fetch --unshallow` is not that either: actions/checkout configures the default
      # `+refs/heads/*:refs/remotes/origin/*` on the remote it adds, so the bare form walks every branch, and in
      # run 41288971566 it printed 26,265 `[new branch]` lines (pull request 581, round 1, F2).
      #
      # And it checks out FIVE directories, not the tree: the working tree of this repository is 251,126 files,
      # and writing it is what filled the runner in the run after the one above (`cannot create directory at
      # 'projects/spirv-tools/.../provenance': No space left on device`, in actions/checkout itself).  This job
      # reads dev/stream/ and nothing else, except for the files that these tests and tools read:
      #   - dev/stream/tests/test_repo_checks.py reads .github/workflows/pr.yml (these very lines) and
      #     tools/oft/lint.py (LINKS_ALLOWED, which the checker's LANE_MIRROR must equal).
      #   - dev/stream/bin/test_held_match.py reads all four of tools/publish/held-match-cases.tsv, withheld.yaml,
      #     private-harnesses.txt (these two through read_held) and release_pins.py.
      #   - dev/stream/bin/test_ossv_binscan_held.py reads tools/publish/held-match-cases.tsv (held_cases).
      #   - dev/stream/bin/test_ossv_gate_release_internal.py reads tools/oft/release_tree.py, and
      #     dev/stream/bin/test_ossv_n6.py reads tools/oft/requirements.txt.  Each of the two skips its case where
      #     the file is not there.
      #   - dev/stream/bin/ossv-rust-census measures a binary with tools/enroll/ci/size.py, imported from the tree so
      #     that it measures exactly as the enrollment does, and its sizes-check, its selftest and their tests die
      #     where that file is not there.
      # Where one of these files is not there, its test fails, or its check stops in silence.  Without
      # tools/publish/, 4 of the tests of test_held_match.py failed and 2 skipped (run 42460746706 of internal pull
      # request 2283, Dispatch issue OSSV-424).  So the cone is those five directories: at internal pull request
      # 2621, tools/oft is 192 files, 6.1 MB, tools/publish 61 files, 2.6 MB,
      # and tools/enroll/ci 22 files, 0.5 MB.  The checker's baselines are objects, read by `git show`, and need no
      # file in the working tree.
      #
      # The filter makes this a promisor clone: every commit and tree of this branch, and only the blobs of the five
      # directories.  Before any check runs, the checker fetches the blobs it will read and this clone has not got
      # (and the tag, when the step below could not fetch it) in one step, in batches of 1,000 ids, with the token
      # the checkout persisted, and `contents: read` above is the whole of what that token can do.  Its other git
      # reads fetch nothing (git 2.44 and later).  A check whose blobs it cannot fetch says DID NOT RUN, and the
      # report names the file that lists them and the command that fetches them.  The blobs are one per commit that
      # wrote a MANIFEST.tsv row (29 on this branch), one per manifest.d/ entry the record's history holds, and the
      # revisions of each imported file whose bytes differ from its row (39 such files on this branch, none in a
      # change that imports nothing).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          # the token the checker's fetch step uses, and the fetches of the step below.  The change's own code runs
          # in this job, so it can use that token -- with contents: read, on the repository the change is already in,
          # and the plan job above runs this same code with contents: read and pull-requests: read.
          persist-credentials: true
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            dev/stream
            .github
            tools/oft
            tools/publish
            tools/enroll/ci
      - name: this commit's whole history, and no other branch's
        working-directory: head
        run: exec bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/head/.github/scripts/pr/stream-tools-history.sh"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # shellcheck, one of the four tools this job needs, is pinned as the other three are (the step after these
      # four), by version and by the hash of the file that is unpacked, except that it is not a Python package and so
      # cannot come out of the lock: the official release tarball, checked against its sha256 and put on PATH.  What
      # stood here was `apt-get install -y -qq shellcheck`, so the version was whatever the runner image carried --
      # 0.9.0 on ubuntu-24.04, while every box runs 0.11.0 (mise), and the two do not number the same code the same
      # way.
      # Measured over the 239 shell files this check holds, at the commit this pin was written against: 0.9.0 and
      # 0.10.0 each report 1,547 findings, of which 786 are SC2317 and none SC2329; 0.11.0 reports 760, of which 4
      # are SC2317 and 71 SC2329, and SC2015 falls from 153 to 77.  No other code moves, and 0.11.0 raises no class
      # 0.9.0 does not.  So a `# shellcheck disable=SC2317` that works in CI today is read by a box as a disable of
      # nothing, a `disable=SC2329` is the other way about (the stream's gate-suite script), and the day the runner
      # image moves every one of them changes meaning at once with no commit here -- 1 finding by hand against 90
      # in CI on pull request 1918.  The pin is the boxes' version, so one answer is given in both places.  Raise
      # it by editing the two lines below; the hash is `sha256sum` of the tarball the release page names.
      #
      # WHY IT IS CACHED.  Unlike the three after it, this one is fetched from github.com rather than from PyPI:
      # github.com/koalaman/shellcheck/releases is not the Actions cache and not a GitHub API this run's token
      # reaches -- it is a redirect to objects.githubusercontent.com, and it fails like any other third-party
      # fetch.  On 2026-11-09 at 05:50Z it answered HTTP 504 four times in a row inside one step, `curl --retry 3`
      # gave up on the fourth, and the merge group of pull request 2426 failed and left the queue (run
      # 42568205325, job 129003351013).  The job had judged nothing yet: the failure was a tool install.  So the
      # tarball is kept in the Actions cache under a key that names the version AND the hash, and a run that finds
      # it downloads nothing.
      #
      # These four steps are written here and not in a composite action of their own, although this is the one job
      # that installs shellcheck, because a new file is dearer than it looks: a path under .github/actions/ fails
      # the lint of every pull request that adds it, since a pull request is judged by the base's rules and the
      # base's tools/oft/paths.py does not know that path; and a path under tools/ moves keys.checker, which
      # re-keys every unit and may merge only in an announced re-key window (rule D11, the rekey job).  A second
      # job that needs shellcheck is the point at which an action earns one of those two prices.
      #
      # WHY THEY COME FIRST.  The four steps run, and the entry is saved, before any code of the change runs in this
      # job: the install after them runs the change's dev/stream/uv.lock (uv reads the change's pyproject.toml, and
      # pip installs what the lock names, a wheel's .pth file running in every later `python`), and everything after
      # that is the change's own checker and tests.  Code that runs as this job's user can rewrite the cache
      # directory between the hash check and the save, so a save after it would keep what the change wrote under
      # the pinned key.  Here the entry is the one tarball the step before the save hashed, whichever run saves it.
      - name: the key of the pinned shellcheck tarball
        id: shellcheck_key
        env:
          VERSION: "0.11.0"
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          # The key names both halves of the pin, so raising either one asks for an entry that does not exist yet
          # and no stale tarball can be served under it. There is no restore-keys prefix for the same reason: a
          # near match is the wrong file, and the only thing to do with it would be to fail on its hash.
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::not a shellcheck version: '$VERSION'"; exit 1; }
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::not a sha256: '$SHA256'"; exit 1; }
          echo "key=shellcheck-$VERSION-$SHA256" >> "$GITHUB_OUTPUT"
      # A cache that cannot be read is a miss, which costs one download, never a failed job: actions/cache's own
      # restoreCache catches everything but a ValidationError (a key or a path this file got wrong) and warns, so
      # the step passes with no hit.  For the same reason there is no `fail-on-cache-miss`.
      - name: the pinned shellcheck tarball, where a run before this one kept it
        id: shellcheck_restore
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/shellcheck-cache
          key: ${{ steps.shellcheck_key.outputs.key }}
      # WHY A HIT IS STILL HASHED.  Anyone with read access to the repository can read a cache entry, and a run of
      # a pull request may write one in its own scope, so a cache entry is not evidence of anything by itself. The
      # sha256 is checked on every run, on a hit exactly as on a miss, and a hit whose bytes do not match fails the
      # job naming the entry rather than quietly downloading over it: the entry is the only thing that could have
      # put those bytes there, and a job that passed over it would hide a cache nobody can trust.
      - name: shellcheck on PATH, hashed whichever way it came
        id: shellcheck
        env:
          VERSION: "0.11.0"
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          BIN: ${{ runner.temp }}/tools-bin
          STORE: ${{ runner.temp }}/shellcheck-cache
          KEY: ${{ steps.shellcheck_key.outputs.key }}
          RESTORED: ${{ steps.shellcheck_restore.outputs.cache-hit }}
        run: |
          set -euo pipefail
          tarball="$STORE/shellcheck-v$VERSION.linux.x86_64.tar.xz"
          hit=false
          if [ -e "$tarball" ]; then
            hit=true
          elif [ "$RESTORED" = true ]; then
            # The entry was restored and the file it is supposed to hold is not there: the two disagree, and
            # "nothing to find" is not the same answer as "not found". Downloading over it would hide that.
            echo "::error::the cache entry $KEY was restored and holds no $tarball"
            exit 1
          fi
          if [ "$hit" = false ]; then
            mkdir -p "$STORE"
            # --retry-all-errors, which `--retry` alone does not cover: curl retries a 5xx on its own, but not a
            # connection that was refused or reset, and the 504s of 2026-11-09 came back as both. --retry-max-time
            # bounds the whole sequence, so a release host that is down costs 120 s and a clear failure rather
            # than a step that hangs; --connect-timeout bounds each attempt's handshake.
            curl --silent --show-error --fail --location \
              --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 120 --connect-timeout 20 \
              --output "$tarball" \
              "https://github.com/koalaman/shellcheck/releases/download/v$VERSION/shellcheck-v$VERSION.linux.x86_64.tar.xz"
          fi
          # On a hit as on a miss. The two failures are not the same thing and do not read the same way: a bad
          # download is the release host or the network, a bad entry is the cache serving bytes nobody pinned.
          if ! echo "$SHA256  $tarball" | sha256sum --check --strict --status; then
            if [ "$hit" = true ]; then
              echo "::error::the cache entry $KEY holds a tarball that is not the pinned shellcheck"\
                   "$VERSION: its sha256 is $(sha256sum < "$tarball" | cut -d' ' -f1), not $SHA256."\
                   "Nothing is run from it; delete the entry (gh cache delete '$KEY') and run this job again."
            else
              echo "::error::the shellcheck $VERSION tarball downloaded from github.com is not the pinned file:"\
                   "its sha256 is $(sha256sum < "$tarball" | cut -d' ' -f1), not $SHA256"
            fi
            exit 1
          fi
          mkdir -p "$BIN"
          tar --extract --xz --file "$tarball" --directory "$BIN" \
            --strip-components=1 "shellcheck-v$VERSION/shellcheck"
          # $GITHUB_PATH is read by the steps after this one, not by this one, so the version line below names the
          # file itself: a PATH that did not take would otherwise be read here as the runner's shellcheck.
          echo "$BIN" >> "$GITHUB_PATH"
          echo "cache-hit=$hit" >> "$GITHUB_OUTPUT"
          if [ "$hit" = true ]; then
            echo "shellcheck $VERSION out of the cache entry $KEY, sha256 checked"
          else
            echo "shellcheck $VERSION downloaded from github.com, sha256 checked; kept as $KEY"
          fi
          "$BIN/shellcheck" --version
      # ONE ENTRY, IN MAIN'S SCOPE.  A cache entry belongs to the ref that saved it, and a run reads its own ref's
      # scope, then its base branch's, then the default branch's. So the entry main keeps is the one every pull
      # request and every merge queue group restores, and once main holds it no other run ever reaches this step --
      # its restore hits first; only a run on main (a push this workflow checks by its own diff) saves into main's
      # scope. Until then a pull request keeps one in its own scope, which is what makes a second
      # run of the same pull request download nothing; the entry is 2,560,674 B as GitHub stored it (run
      # 42599253138), against the repository's 10 GiB cap and the 2.43 GiB that pull request 2380's object store
      # leaves free, and GitHub drops an entry no run has read for 7 days.
      # A pull request from a fork is skipped: GitHub refuses a cache write from a low-trust trigger, and a refusal
      # is not this job's verdict -- actions/cache's saveCache catches it and warns, as the restore above does, so
      # the step passes either way.
      - name: keep the pinned shellcheck tarball for the runs after this one
        if: ${{ steps.shellcheck.outputs.cache-hit == 'false' && github.event.pull_request.head.repo.fork != true }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ${{ runner.temp }}/shellcheck-cache
          key: ${{ steps.shellcheck_key.outputs.key }}
      - name: ruff, pytest and uv, which the check and the tests need, pinned and hashed
        run: exec bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/head/.github/scripts/pr/stream-tools-pins.sh"
      # The paths under dev/stream/ this change touches, as the plan job's reach step found them: a `dev/stream/<path>`
      # row each.  This job runs only when the plan job wrote that list, so an artifact that is missing fails here,
      # never reads as "everything".  The list names no path when only the files of tools/publish/ in the reach step's
      # `held` changed: the checker then reads this repository's own code whole, and an imported file only on the lines
      # that differ from its import.
      - name: the paths under dev/stream/ this change touches, from the plan job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: stream-changed
          path: ${{ runner.temp }}/stream-changed
      # And the lines: a `dev/stream/<path>:<start>-<end>` row per run of lines the change wrote since the base the
      # plan resolved, after the plan's rows.  The checker reads an imported file only where this change wrote it, so
      # the hunks are what make a tool this pull request rewrites answer for the lines it rewrote; without them the
      # measured debt could never fall (dev/stream/src/ossv/tools_check.py).  They come from the checker's own parser
      # of `git diff --unified=0` (`--write-changed`), which is the change's code, as the check below is: so it runs
      # here and not in the plan job, whose answers decide which judging jobs run (its reach step says why).  The
      # history above holds the base (a pull request's merge commit has it as its first parent, a merge queue group's
      # base is main below the group, a push's `before` is main below it); a base it does not hold, as after a force
      # push, is fetched as that history was.  A run with no base to compare with has no lines to write; a change
      # that deletes the checker fails here.
      - name: the lines this change wrote under dev/stream/, by its own checker
        working-directory: head
        env:
          BASE: ${{ needs.plan.outputs.base }}
          ROUTED: ${{ needs.plan.outputs.routed }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/stream-changed/stream-changed.txt"
          if [ "$ROUTED" = true ]; then
            [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the plan named no base commit: '$BASE'"; exit 1; }
            git cat-file -e "$BASE^{commit}" 2> /dev/null || git fetch -q --filter=blob:none --no-tags origin "$BASE"
            python ./dev/stream/bin/ossv-tools-check --root dev/stream --changed-since "$BASE" --write-changed - \
              >> "$changed"
          fi
          echo "the stream tools check reads $(grep -c ':[0-9]*-[0-9]*$' "$changed" || true) hunk(s)"
      - name: the stream tools' check
        working-directory: head
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/stream-changed/stream-changed.txt"
          echo "the change touches $(grep -c . "$changed" || true) path(s) under dev/stream/"
          ./dev/stream/bin/ossv-tools-check --require-tools --changed-paths "$changed"
      # !cancelled(): a failure of the checker above must not hide this answer, and this step reads nothing the checker
      # writes.  The two were one `set -e` script until run 41359875763 (pull request 682): the checker failed on 254
      # findings of its own, and the tests, which no run on this branch had yet reached, did not run either.  One red
      # with one cause hid a check with another purpose.  The job still fails when the checker fails -- a failed step
      # fails the job whatever runs after it, and `required` reads the job's result (stream_tools=true needs
      # `success`) -- so this shows both answers and lets neither one excuse the other.  It does read what the install
      # step above put there: without pytest and the `ci` group the run fails on its imports, not on the tree.
      #
      # --continue-on-collection-errors: ONE file that cannot be imported must not take the whole directory's answer
      # with it.  Without it pytest stops the session at collection -- `Interrupted: 1 error during collection` -- and
      # runs nothing: 0 of 2,011 tests on 2026-11-09 (pull request 2422, run 42560175158) and 0 of 2,123 the next day
      # (pull request 2434, run 42602367205), both for a test file that imported numpy, which the `ci` group does not
      # install.  The job was red both times, and the red named the import, so the suite's own answer was given by
      # nobody and every guard that lives in that directory (test_outside_tests_listed.py, test_repo_checks.py,
      # test_launchers.py, test_tree_root.py) was silent while the job failed for another reason.  With the flag
      # pytest reports the error, runs the rest, prints both counts and exits 1, so the step is still red: a
      # collection error is a failure here, never a file quietly left out.
      #
      # --durations=50: this step is the largest and the fastest-growing part of this job -- 260 s on 2026-11-03
      # against a median of 921 s on 2026-11-11, from the jobs API over 42 runs -- and until this flag no run
      # recorded which TEST that time went to.  The step's progress rows do place a file roughly, between the row
      # that first names it and the row that first names the next -- approximate at either end, since the row
      # that names this file already carries 35 of its tests -- and that is how it is put at about 500 s of run
      # 42980491140 against about 1,030 s of 42985586929.  But a file is as fine as the log gets, and this one
      # holds over 250 tests.  With the flag pytest ranks the 50 slowest phases -- setup, call and teardown, not
      # 50 distinct tests -- from durations it records anyway, and the report itself is one sort and fifty
      # printed lines at the end of the run.  That ranked list is what a later change to how this suite runs has
      # to be argued from (Dispatch issue OSSV-276).
      - name: the stream tools' tests
        if: ${{ !cancelled() }}
        working-directory: head
        env:
          OSSV_FIND_TEST_PG: host=127.0.0.1 port=5432 user=postgres dbname=postgres
          OSSV_TEST_PG: host=127.0.0.1 port=5432 user=postgres dbname=postgres
        # -rs prints each skipped case with its reason, so a database case that no longer runs here is named
        # (Dispatch issue OSSV-686, R5), as the bin/ and lane/ step below prints its own.
        run: python -m pytest dev/stream/tests --continue-on-collection-errors --durations=50 -rs
      # The count of tests each directory collects, against the base's, which is the one number that tells a suite
      # that passed from a suite that never ran (dev/stream/tests/collected_counts.py says what it reads and why).
      # The base's count is read by running the head's program over the base's tree, so both numbers are measured
      # the same way rather than kept by hand anywhere.
      #
      # The base is the base of this change, as the plan job's base step reads it: the first parent of the merge
      # commit GitHub built for a pull request, EVENT_BASE for a merge queue group or a push.  Its commit and trees
      # are already here -- the unshallow above fetched this commit's whole history with `--filter=blob:none`, which
      # keeps every commit and tree and no blob -- so this is a worktree of that commit, cut to four of the five paths
      # this job checks out (not tools/enroll/ci, which no collection reads), exactly as the plan job takes the base it
      # routes by.  A checkout of a promisor clone fetches the blobs it is missing in one batch, which a path list of
      # this program's own would not: cut to what a collection reads, the base failed to import 17 modules, because
      # `ossv.tree` walks up for a directory holding manifest.d/ and there was none (measured, 2026-11-09, which is how
      # the comparison says it cannot read the base rather than counting a missing file as a deleted test).  A push
      # that made the branch has no base (EVENT_BASE all zeros): the counts are then printed against nothing, and the
      # import of every file is still checked.
      - name: the base of this change, whose collected tests the next step counts
        id: base_tree
        if: ${{ !cancelled() }}
        working-directory: head
        run: exec bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/head/.github/scripts/pr/stream-tools-base-tree.sh"
      - name: the tests each counted directory collects, against the base's
        if: ${{ !cancelled() }}
        working-directory: head
        env:
          BASE_TREE: ${{ steps.base_tree.outputs.tree }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_TREE" ]; then
            python dev/stream/tests/collected_counts.py --base "$BASE_TREE"
          else
            python dev/stream/tests/collected_counts.py
          fi
      # The proofs clone the lane/tools tests of the namespace rename read (NS_TEST_REPO): test_combine_rewrite,
      # test_merge_pr_checkeronly, test_ns_imagetools and test_oft_calls read NS_TEST_OLD (and test_oft_calls
      # NS_TEST_T1, both in the job's env above); test_ns_generators reads hub commit 10ae79ead9 (zreloc.DONOR_COMMIT),
      # test_axiom_diff commit 8d1244e48efc (OFT_COMMIT).  Without the clone those cases skip and test nothing.
      #
      # It is not the head checkout above: the tests read other commits, and refs added to head are refs the checker
      # would see.  Four commits at depth 1, trees only (15 MB), then in one fetch the blobs of the paths the tests
      # read (981 blobs).  A blob not in that list is still fetched when a test asks for it, one at a time, with the
      # token the checkout keeps.  The tests run `git archive --worktree-attributes`: plain `git archive REV -- PATHS`
      # reads attributes from an index of REV's whole tree and so fetched every blob of it, 2.5 GB, in a local run.
      # Measured locally with this clone and no credential (so no lazy fetch could happen): every case ran and passed,
      # test_combine_rewrite in 226 s, the other six files in 7 to 34 s each, and .git stayed at 15 MB.
      - name: a proofs clone of the four commits the lane/tools tests read
        if: ${{ !cancelled() }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: proofs
          ref: ${{ env.NS_TEST_OLD }}
          persist-credentials: true
          fetch-depth: 1
          filter: blob:none
          # one file in the working tree, the root's: the tests read commits, not files
          sparse-checkout: /release.yaml
          sparse-checkout-cone-mode: false
      - name: the other three commits, and the blobs the tests read
        if: ${{ !cancelled() }}
        working-directory: proofs
        run: |
          set -euo pipefail
          hub=10ae79ead9f8846eae27df0e4d2ee867a22e37aa   # test_ns_generators: zreloc.DONOR_COMMIT
          oft=8d1244e48efce2f4240a1fb7c78f519bb7743a68   # test_axiom_diff: OFT_COMMIT
          git fetch --filter=blob:none --no-tags --depth=1 origin "$NS_TEST_T1" "$hub" "$oft"
          { git ls-tree -r "$NS_TEST_OLD" -- release.yaml dune-project dune dune-file dune-workspace theories \
              toolchain projects/zlib/project.yaml projects/zlib/checksum_fuzzer tools
            git ls-tree -r "$NS_TEST_T1" -- tools
            git ls-tree -r "$hub" -- release.yaml proofs/zlib/checksum_fuzzer/lib
            git ls-tree -r "$oft" -- tools/oft
          } | awk '$2 == "blob" {print $3}' | sort -u > "$RUNNER_TEMP/proofs-blobs.txt"
          echo "blobs the tests read: $(wc -l < "$RUNNER_TEMP/proofs-blobs.txt")"
          git fetch --no-tags --no-write-fetch-head --stdin origin < "$RUNNER_TEMP/proofs-blobs.txt"
          du -sh .git
      # The test files outside dev/stream/tests: bin/ and lane/ hold about a hundred, which nothing ran until
      # Dispatch issue OSSV-276, and bin/test_ossv_vm_delete_gate.py failed 23 of 24 on main after two ossv-vm changes
      # (df5625836d, abc7236f9b) that nothing saw.  dev/stream/tests/outside_tests.tsv names every one of them and says
      # how it runs, or why it does not; tests/test_outside_tests_listed.py, in the step above, fails when a file is in
      # no row.  A case that needs a lane VM or gcloud skips naming it (-rs prints each skip), and a file that collects
      # nothing fails.  NS_TEST_REPO is the proofs clone above; a revision it lacks fails the case, naming it.  One
      # process per file, three at a time.  !cancelled() for the reason above.
      - name: the bin/ and lane/ tests that need no lane VM
        if: ${{ !cancelled() }}
        working-directory: head
        env:
          NS_TEST_REPO: ${{ github.workspace }}/proofs
        run: python dev/stream/tests/run_outside_tests.py --jobs 3
      # The defect no test of dev/stream/tests can hold: an entry point whose import form works where its tests run
      # and not in the layout it is deployed into.  Commit eee39305fbc copied three files off the box whole, and the
      # box's copies use flat imports (`import ossv_dashboard_page`, `import ossv_statements`) of modules this
      # directory keeps in the package `ossv` (src/ossv/).  Every one of those files passed its tests, because pytest
      # reads `pythonpath = ["src"]` AND prepends each test file's own directory, so bin/ is on the path there; and
      # `python -m pytest dev/stream/tests` above never runs an entry point at all.  The breakage lives in the
      # relationship between an entry point's import form and the package root it runs from, so only an entry point
      # run from that root can see it.  `--help` is the cheapest thing that forces a file's module-level imports,
      # and on every one of the 11 subjects it touches nothing else: no subprocess, no socket, no file opened for
      # writing, about a quarter of a second a file.  That is measured, not assumed -- a `sys.addaudithook`
      # sitecustomize over `subprocess.Popen`, `socket.*`, `os.system` and write-mode `open` reports zero events
      # for all 11.  It was NOT true when this step was written: the stream-numbers tool scanned sys.argv by
      # hand with no parser on its default path, so `--help` fell into the measurement and made two `git fetch`
      # calls to github.com, a `git init --bare` and 12 git subprocesses in 12.5 s, under this very comment
      # saying it touched nothing (the review of pull request 667, finding 3d).  That tool now has a parser.
      # A subject that acquires such a path again must be given a line of its own here, never a skip; `timeout 60`
      # is what makes it fail the job rather than hang it, and note that a tool's own timeout may be longer than
      # 60 s (`statements.GIT_TIMEOUT` is 300), so the step's timeout is a backstop and not that tool's.
      #
      # !cancelled(): a failure of the checker or of pytest above must not hide this answer, and this step reads
      # nothing either of them writes.  It does read what the install step above put there: without `pyyaml` four
      # subjects fail on `import yaml` inside src/ossv/statements.py, so a failed install is read here as four
      # layout failures.  The install step is pinned and hashed and fails loudly of itself.
      #
      # What this step does NOT cover: it runs each entry point from the source tree with src/ on the path, so the
      # package resolves at dev/stream/src/ossv.  On a box the package is installed into the tree's own .venv
      # (src/ossv/tools.py, install_package), and a module that finds files relative to its own `__file__` resolves
      # them inside site-packages there.  That defect killed `ossv-work-events loop` for 31 hours on 2026-11-07..08
      # with this step green; dev/stream/tests/test_tree_root.py builds that layout and is what holds it.
      - name: every entry point that names the ossv package imports with only src/ on the path
        if: ${{ !cancelled() }}
        working-directory: head/dev/stream
        run: exec bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/head/.github/scripts/pr/stream-tools-entry-points.sh"
  farm_tests:
    # The test files of dev/stream/bin/ that the stream_tools job leaves out (dev/stream/tests/outside_tests.tsv): the
    # farm runner's, whose one process takes over 900 s, and the N6 driver's.  Until this job nothing in CI ran them,
    # and authors ran the first by hand in 6 build-farm shards (pull request 1713).  The plan's reach step names the
    # legs, one {file, index, count} each, from its farm suites table (which says what each file reads, and why its
    # count): only the files whose paths, or this job, changed.  Every leg of a file collects the same cases, in the
    # file's order, and runs every count-th of them from its own index, so the legs together run each case exactly
    # once and no list of cases is kept anywhere to fall behind the file.
    name: farm_tests (${{ matrix.leg.file }}, ${{ matrix.leg.index }})
    needs: [plan, lint]
    # as the tests job: !cancelled() and plan's and lint's own results (that job says why)
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success'
      && needs.plan.outputs.farm_tests == 'true' }}
    strategy:
      # a failure in one leg must not cancel the others: each leg's answer is about other cases
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.farm_legs) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # dev/stream/ alone, one commit: the tests read their files of bin/, conftest.py and pyproject.toml, and no history
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: dev/stream
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: pytest, pinned and hashed, as the stream_tools job installs it
        run: |
          set -euo pipefail
          # the stream_tools job's install step says why uv is pinned here and everything else comes from
          # dev/stream/uv.lock's `ci` group, with --locked
          cat > "$RUNNER_TEMP/uv-requirement.txt" <<'UV_REQUIREMENT'
          uv==0.13.6 \
              --hash=sha256:22759b8895e1103578de6fb4cd27e94b4399d021023378d29f01333717751fba
          UV_REQUIREMENT
          python -m pip install --quiet --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/uv-requirement.txt"
          uv export --project dev/stream --locked --only-group ci --no-emit-project \
            --output-file "$RUNNER_TEMP/stream-tools-requirements.txt"
          python -m pip install --quiet --require-hashes --only-binary=:all: \
            -r "$RUNNER_TEMP/stream-tools-requirements.txt"
          python -m pytest --version
      # From dev/stream, as tests/run_outside_tests.py runs a pytest row, so conftest.py points every live-path default
      # at /nonexistent/, with a git identity (the N6 cases commit in scratch repositories, and a runner has none):
      # GitHub Actions' own bot's, whose noreply address is the one shape of address lint's private-data rule takes.
      # A collection that fails, or a leg left with no case, fails the leg; --durations=0 prints each case's time,
      # which is what the reach step's counts were measured from.
      - name: this leg's share of its file's tests
        working-directory: dev/stream
        env:
          FILE: ${{ matrix.leg.file }}
          LEG: ${{ matrix.leg.index }}
          LEGS: ${{ matrix.leg.count }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          [[ "$FILE" =~ ^test_[a-z0-9_]+\.py$ && -f "bin/$FILE" ]] || { echo "::error::no test file bin/$FILE"; exit 1; }
          pytest=(python -m pytest -p no:cacheprovider -o testpaths=)
          "${pytest[@]}" -q --collect-only "bin/$FILE" > "$RUNNER_TEMP/collected.txt"
          grep '::' "$RUNNER_TEMP/collected.txt" > "$RUNNER_TEMP/all.txt" || true
          awk -v leg="$LEG" -v legs="$LEGS" '(NR - 1) % legs == leg' "$RUNNER_TEMP/all.txt" > "$RUNNER_TEMP/leg.txt"
          echo "bin/$FILE, leg $LEG of $LEGS (from 0): $(grep -c . "$RUNNER_TEMP/leg.txt" || true) of $(grep -c . "$RUNNER_TEMP/all.txt" || true) case(s)"
          [ -s "$RUNNER_TEMP/leg.txt" ] || { echo "::error::leg $LEG of $LEGS has no case to run"; exit 1; }
          mapfile -t cases < "$RUNNER_TEMP/leg.txt"
          "${pytest[@]}" -q -rs --durations=0 "${cases[@]}"

  # The made-from records.  A unit's made-from record, projects/<p>/<h>/proofs/provenance/evidence/licence/
  # made-from.tsv, has a generator beside it, made_from.py.  Its --check runs the generator again on this checkout and
  # compares the result with the record.  The script is the head's, the change's own file, as the record is: the base
  # cannot know a generator that the change brings.
  #
  # Why a job of its own: a step of the lint job ran these checks before, with 900 s for each generator.  Under the
  # rule of Dispatch issue OSSV-400, the --check of curl/fuzz_bufq takes about five times as long as it did then.  It
  # took 466 s on ubuntu-24.04, after 2,288 s to restore the unit's proofs into the sparse checkout of lint (job
  # 128779696455), and 137 s on 16 cores (job 128575304746).  Five times 466 s does not fit in 900 s.  So this job
  # takes the 16-core runner and the whole tree, as the tests job takes it for its whole-tree lint.
  #
  # What starts it: the plan's reach step.  Its block between `# made-from records` and `# end of made-from records`
  # names the units in two lists and says why.  The job checks a unit for one of two reasons:
  #   * strict: a unit of made_from_units.  A change under the proofs/provenance/ of a unit, or to its images/dune,
  #     names that unit when the unit's head tree holds a made_from.py or a made-from.tsv under its
  #     proofs/provenance/.  A change that can move every record names every unit that has a made-from.tsv
  #     (made_from_every), and then this job also runs the tests of dev/licence/.
  #   * proofs only: a unit of made_from_proofs that made_from_units does not hold.  made_from_proofs holds each unit
  #     whose head tree holds a made-from.tsv under its proofs/provenance/ and whose proofs/ the change touches
  #     outside proofs/provenance/ (Dispatch issue OSSV-348).
  # The job runs when made_from is true (made_from_units is not empty), or when made_from_proofs is not empty and the
  # plan's hold is none.  So on a pull request without the label check, it checks no unit for the second reason.  A
  # merge queue group is never held, so it checks them.  The job waits for lint, as the tests job does.  So a draft,
  # and a push that the merge queue checked, skip it with lint.
  #
  # Time: each --check gets 1,800 s, and the job gets 120 minutes.  Each --unit-file gets 60 s: it reads one small
  # file, so a call that hangs stops after 60 s.  The tests of dev/licence/ get 900 s: Dispatch issue OSSV-400's plan
  # keeps them under 10 minutes on 2 CPUs.  A call that does not finish in its time fails the job.  The slowest
  # whole-tree checkout of the tests job took 813 s (job 126172236153).  Without dev/licence/made_from.py, no
  # --unit-file and no tests run, and 813 s and three runs of 1,800 s make 103.6 minutes.  With it, 813 s, three
  # runs of 1,800 s and 900 s make 118.6 minutes.  The three --unit-file calls can add 3 minutes, which makes 121.6.
  # Then the job's own 120-minute limit can stop the last call, which fails the job and so required too.
  #
  # What the job holds while the change's code runs:
  #   * No git credential.  The checkout keeps no token (persist-credentials: false).  The records step and the tests
  #     step also fail, before they run any code of the change, when head/.git/config holds an http extraheader.
  #   * The job's token (actions: write).  The runner's processes hold it in every event, and the runner's user has
  #     passwordless sudo on GitHub's hosted runners, so the change's code can reach it.  In a merge queue group the
  #     watch also holds it in a process of the same user while made_from.py runs.  The lint job had the same
  #     exposure when it ran these checks (the header says so).
  #   * One output guard, and no command files.  The log shows all that --unit-file, --check and the tests write, on
  #     stdout and stderr, between ::stop-commands:: and a new random token for each block, so the runner reads no
  #     workflow command in it.  The three calls run with GITHUB_OUTPUT, GITHUB_ENV, GITHUB_PATH, GITHUB_STATE and
  #     GITHUB_STEP_SUMMARY removed from their environment.  The code can still find those files under $RUNNER_TEMP, and
  #     the runner's user has passwordless sudo (the bullet above).  So these two keep the job's own commands out of the
  #     code's output and environment.  They are no wall against a change that tries to reach those files.
  #   * KIND=contributor: the job runs no code of the change, so no --unit-file, no --check and no tests.  Code that an
  #     outside contributor brings runs only in the tests job.  The rule of the records step still holds for each unit
  #     that the step checks: a made_from.py or a made-from.tsv under its proofs/provenance/ anywhere but
  #     evidence/licence/ fails the unit, and so does one of the two there without the other.  The job checks the rule
  #     without opening a file of the change.
  #
  # First, the records step reads the three inputs that the plan gives it: UNITS (made_from_units) and PROOFS
  # (made_from_proofs), each a JSON list of projects/<p>/<h>, and HOLD (the plan's hold: none, draft or label).  Any
  # other value fails the step before it runs any code of the change.  It also reads KIND (the bullet above).  The step
  # checks each strict unit.  It checks a proofs-only unit only when HOLD is none.  For any other hold, it prints one
  # line for the unit that says so, and does nothing more with it.
  #
  # Then the step finds each made_from.py and each made-from.tsv under the proofs/provenance/ of each unit it checks,
  # before it runs any code of the change.  A made_from.py counts a fixed number of directories up from its own
  # place to find the top of the checkout, and its --check reads its unit's proofs/provenance/evidence/licence/
  # made-from.tsv from there.  The strip check of lint also reads a unit's record only at that path.  So no check reads
  # a record in another directory.  When a change moves a unit's made_from.py and its record together to another
  # directory, the --check of that made_from.py has no record to compare.  A unit's own copy then only warns (exit 2),
  # and the shared generator of Dispatch issue OSSV-400 refuses the unit (exit 4).
  #
  # So the step accepts the two files only at proofs/provenance/evidence/licence/, and there only together.  A unit
  # fails, with an error that names the unit and the file, when it holds:
  #   * a made_from.py or a made-from.tsv in any other directory under proofs/provenance/.  A change that moves the
  #     generator, the record or both to another directory under proofs/provenance/ must not stop the check.
  #   * a record at evidence/licence/ and no made_from.py there.  A change that deletes the generator must not stop
  #     the check.
  #   * a made_from.py at evidence/licence/ and no record there.  Its --check has no record to compare: a unit's own
  #     copy can only warn (exit 2), and the shared generator refuses the unit (exit 4).  A change that deletes the
  #     record must not stop the check either.
  # The step runs no made_from.py of a unit that fails here.  A unit that the step checks and that holds neither file
  # passes with one line.  The reach step lists no unit that a change deletes whole, and no unit whose two files a
  # change deletes or moves out of proofs/provenance/ (plan decision 3): the job does not check such a unit.
  #
  # Then the step checks the made_from.py of each other unit: the strict units, then the proofs-only units, each in
  # sorted order.  So one log shows each refusal and the answer for each other unit, and a refusal still fails the
  # job.  When dev/licence/made_from.py is in the checkout (the shared generator of OSSV-400), the step first runs its
  # --unit-file on each made_from.py.  Exit 0 says that the file holds only its data and the call of the shared
  # generator.  Any other exit fails the job and shows the reason, and the step runs no --check of that file.  So the
  # job runs no generator that --unit-file refuses.
  # Then the step runs the file's --check.  Each call works from the top of the checkout, with the path from that top.
  # The log names each unit, its file, the exit of --check, its seconds and its reason.
  #
  # The exits of --check: 0 the record matches, 1 it does not (its output lists the rows + and -), 2 the check could not
  # decide (an argparse error is 2 too), which warns and passes, 3 the record names no path twice, and every row that
  # differs is one a run gives again, for a file that the record holds in no row of another kind (the module docstring
  # of dev/licence/made_from.py says which rows), 4 the generator refused the unit, 124 the time-out.  Any other exit
  # fails.  Exit 3 fails a strict unit, as exit 1 does.  For a proofs-only unit, exit 3 gives one warning that names the
  # unit and gives the number of rows that differ (the lines of the output that start with "- " or "+ ") and the first
  # 20 of them, and the job does not fail for it.  Each other exit means the same for both kinds of unit.
  #
  # What the failure says, and what it must not say: a record that differs from its generator is a question for the
  # unit's owner, not a file to make again.  A generator reads what two files hold in common.  That is evidence of a
  # copy, not proof of one.  So a lane that has shown that a file's content is its own declares the file, with its
  # reason, where the generator reads it (curl/fuzz_bufq: provenance/evidence/licence/left-bare.tsv, one path and one
  # reason to a row).  The generator then gives that file a row that the check compares like any other.  So an exit 1
  # has one of three causes, and this job is for all three: the tree changed and nobody made the record current, a
  # file lost its licence lines and nothing declares it, or a person changed a row by hand.  `made_from.py --apply`
  # must clear none of them: it writes Anthropic's lines onto a file whose content came from another place.  The
  # error names the rows, the three causes and the declaration that a lane writes for a file of its own.  It says
  # not to clear the failure with --apply, and it never tells a reader to run the generator again and commit what it
  # writes.  It names the module docstring of dev/licence/made_from.py as the place that says what the record reports,
  # and what it does not.  Exit 3 is narrower than exit 1: the record names no path twice, and every row that differs is
  # one that a run gives again, for a file that the record holds in no row of another kind.  So its error and its
  # warning say that made_from.py --record brings the record up to date, as the generator's own output does.
  made_from:
    needs: [plan, lint]
    # as the tests job: !cancelled() and plan's and lint's own results (that job says why).  Then the plan's two
    # reasons: a strict unit always, and a unit whose proofs changed only when the plan's hold is none.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success'
      && (needs.plan.outputs.made_from == 'true'
      || (needs.plan.outputs.made_from_proofs != '[]' && needs.plan.outputs.hold == 'none')) }}
    runs-on: ubuntu-24.04-16core
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read   # the workflow's own, which a job's permissions replace
      actions: write   # the merge queue group's watch: `gh run cancel` of this run once its group is gone
    steps:
      # The merge queue group's watch, the same step as the lint job's and the check job's (the concurrency comment
      # says why)
      - name: cancel this run once its merge queue group is gone
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          EVERY: "120"
          CONFIRM: "10"
        run: |
          set -euo pipefail
          # In the background for the rest of the job, whose end stops it (the runner stops a job's leftover
          # processes).  It reads the branch over git's own protocol, not the REST API, so it spends none of the
          # token's API budget; with the token in a header, as tools/oft/ci/facts-review-gather passes it, never in a
          # URL or an argument; from RUNNER_TEMP, outside every checkout, whose persisted header would be a second one.
          cat > "$RUNNER_TEMP/group-watch" <<'EOF'
          #!/bin/bash
          set -uo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_TERMINAL_PROMPT=0
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          cd "$RUNNER_TEMP" || exit 1
          # 2 is git ls-remote --exit-code's answer for a branch that does not exist (measured: 0 for a live group's
          # branch, 2 for a dropped group's, 128 without a usable token); any other failure is no answer
          gone() {
            local rc=0
            git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF" > /dev/null 2>&1 || rc=$?
            [ "$rc" -eq 2 ]
          }
          while :; do
            if gone && sleep "$CONFIRM" && gone; then
              echo "$(date -u +%FT%TZ) $GITHUB_REF does not exist, twice $CONFIRM s apart: the queue dropped this group, so run $GITHUB_RUN_ID is cancelled"
              gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"
              exit
            fi
            sleep "$EVERY"
          done
          EOF
          chmod +x "$RUNNER_TEMP/group-watch"
          setsid "$RUNNER_TEMP/group-watch" >> "$RUNNER_TEMP/group-watch.log" 2>&1 < /dev/null &
          echo "watching $GITHUB_REF every $EVERY s: this run is cancelled once that branch is gone"
      # The object store of main (.github/workflows/images.yml, git_objects), for the whole-tree checkout below.  The
      # lint job's two steps say what it is and what a run that finds none does.
      - id: git_objects
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: head/.git
          key: git-objects-v1-
          restore-keys: git-objects-v1-
      - if: steps.git_objects.outputs.cache-matched-key != ''
        name: the object store this checkout starts from
        env:
          STORE: ${{ steps.git_objects.outputs.cache-matched-key }}
        run: echo "$STORE, $(du -sh head/.git | cut -f1), main at $(git -C head rev-parse refs/ossv-git-cache/base)"
      # The whole tree, with no sparse set and no filter: a record is made from its unit's proofs (proofs/lib/), and
      # the shared generator reads the head's tools (dev/licence/made_from.py reads tools/oft/rocq.py).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          persist-credentials: false   # the change's code runs here, and this job fetches nothing more
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # The plan's two lists give each unit its kind (the job's comment says why):
      #   * a strict unit is in UNITS: its provenance tree or its images/dune changed, or the change can move every
      #     record.
      #   * a proofs-only unit is in PROOFS and not in UNITS: its proofs changed outside proofs/provenance/.  The step
      #     checks it only when HOLD, the plan's hold, is none.
      # Exit 3 of --check (the record names no path twice, and every row that differs is one a run gives again, for a
      # file that the record holds in no row of another kind) fails a strict unit, and gives a proofs-only unit one
      # warning.  Exits 0, 1, 2, 4 and 124, and any other exit, mean the same for both kinds.
      - name: each made-from record the plan named equals its generator's (the head's made_from.py --check)
        env:
          UNITS: ${{ needs.plan.outputs.made_from_units }}
          PROOFS: ${{ needs.plan.outputs.made_from_proofs }}
          HOLD: ${{ needs.plan.outputs.hold }}
        run: exec bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/head/.github/scripts/pr/made-from-records.sh"
      # The tests of dev/licence/, the shared generator's, when the plan named every unit with a record: a change that
      # can move every record can break the generator too.  A step of its own, which runs whatever the records step
      # concluded, so that a red record does not hide the tests.
      - name: the tests of dev/licence/, when every made-from record is checked
        if: ${{ !cancelled() }}
        env:
          EVERY: ${{ needs.plan.outputs.made_from_every }}
        run: exec bash --noprofile --norc -eo pipefail "$GITHUB_WORKSPACE/head/.github/scripts/pr/made-from-tests.sh"
      # what the merge queue group's watch saw, also when it cancelled this run
      - name: the merge queue group's watch, its log
        if: always() && github.event_name == 'merge_group'
        run: cat -- "$RUNNER_TEMP/group-watch.log" 2> /dev/null || true

  # The record of the fuzz targets a public release carried before their project's hold began
  # (tools/publish/public-before-hold.tsv): a kept file of a release may name such a fuzz target while its project is
  # held (tools/oft/disclosure.py).  This job checks each row when the change touches the record, and only then (the
  # reach step's public_rows), by tools/oft/tests/public_before_hold_rows.py: the release it names is published,
  # holds the fuzz target and is the first that does (GitHub's API, over the public repository), and its pull
  # request's merge into main set the project's `release: private` after that release came out (this commit's
  # first-parent history).  A row it cannot check fails, naming the row and why.  So it takes the history as the
  # stream_tools job does, which says why not `fetch-depth: 0`: one commit, blobless, then this commit's whole history
  # and no other branch's, with the token the checkout persists for the lazy fetch of the project.yaml blobs a row
  # reads.  The test gets this job's token as GH_TOKEN: contents: read on this repository, and the API answers a
  # public repository's releases and contents to it too (publish.yml's cut step reads the public
  # theorem-labs/oss-verify with its job's token), at the authenticated rate.  On a pull request, HEAD is the merge
  # commit GitHub builds, which names no pull request: the test takes this pull request's number
  # (OFT_CHANGE_PULL_REQUEST) and reads a row whose hold is this pull request at HEAD, so a hold's pull request can
  # add its own rows; a merge queue group's commit, and main's after the merge, name their pull request.  The
  # change's own code runs here, after lint, as in the stream_tools job.  required reads its result.
  public_rows:
    needs: [plan, lint]
    # as the tests job: !cancelled() and plan's and lint's own results (that job says why)
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success'
      && needs.plan.outputs.public_rows == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read   # this commit's history and its lazy blob fetches, and the public repository through the API
    env:
      # a fetch with no usable credential fails rather than waits (the stream_tools job says why)
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          # the token of the history fetch and of the lazy blob fetches below: contents: read, on the repository the
          # change is already in, as the stream_tools job's
          persist-credentials: true
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools/oft
            tools/publish
      - name: this commit's whole history, and no other branch's
        working-directory: head
        run: |
          set -euo pipefail
          git fetch --filter=blob:none --no-tags --unshallow origin "$(git rev-parse HEAD)"
          # a shallow clone would read no hold's merge, and every row would fail by name rather than be read
          [ "$(git rev-parse --is-shallow-repository)" = false ] || {
            echo "::error::the clone is still shallow: no hold's merge to read the rows against"; exit 1; }
          echo "history: $(git rev-list --count --first-parent HEAD) commit(s) on HEAD's first-parent line"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: the tools' dependencies (PyYAML, idna), hash-pinned, at this change
        run: python -m pip install --quiet --require-hashes -r head/tools/oft/requirements.txt
      - name: each row of tools/publish/public-before-hold.tsv against its release and its hold's merge
        working-directory: head/tools
        env:
          GH_TOKEN: ${{ github.token }}
          OFT_CHANGE_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: python -B -m unittest -v oft.tests.public_before_hold_rows

  # Rule D11 (OSS Verify, OSSV-162): until the platform tag, and outside an announced re-key window, nothing that moves
  # keys.checker merges into main, since the checker's id is in every unit's key and a new one re-keys every unit
  # (on 2026-11-03 #605 and #602 moved it twice after OSSV-162 part 2, a894ad9d to aef8df57 to 05744fab).  So for a
  # pull request and a merge queue group this job computes three ids: keys.checker of the base by the base's tools,
  # and of this change's head twice, by the base's tools and by the change's own tools (the id its check jobs
  # record).  The base's tools judge the change, as everywhere in this file: a change supplies the code of checker()
  # and of what it imports, so its own tools could give the base's id for a tree whose checker moved; and every file
  # of that code is a checker file by the base's rule, so the base's tools see any change to it as a move.  It fails
  # when either head id differs from the base's and the re-key window is not open.  The verdict on the base's tools'
  # id, and the window, are one step that runs no code of the change; the change's own id comes in the step after it,
  # which a failed verdict skips, so that code can add a failure and never remove one.  The window is the file
  # .github/rekey-window in the tree of the run's base, the plan job's base: merge_group.base_sha in the merge queue
  # (the head of the entry before it, so an entry that opens or closes the window does so for the entries behind it),
  # and the merge commit's first parent for a pull request (OSSV-413).  It is open only when its content,
  # with trailing newlines removed, is exactly `open`: a missing file is a closed window, as are an entry that is no
  # regular file (a symbolic link, a directory) and any other content, and a file that exists but cannot be read
  # fails with an error that names it and the base.  A change that adds, edits or deletes the file and also moves
  # keys.checker fails whatever the window reads, so no change opens a window for itself.  The verdict step reads the
  # file and decides on its bytes, and no code of the change has run by then.  The same rule holds for every head, a
  # release/* one too.  It holds a merge into main of this repository only: a pull request into another base, and
  # theorem-labs/oss-verify-proofs, whose checker moves only by releases cut here, get the ids and a notice.  It sees
  # pull requests and merge queue groups only: a push to main by a ruleset bypass skips it, as it skips every check of
  # record.  All three ids are in the job summary, equal or not, but the change's own when the verdict failed.  It
  # reads git objects and tools/oft alone, no tree beside them; it runs the change's own code (its keys.py), so only
  # after lint has accepted the change, as the tests job does, and a draft, which lint skips, skips it too (required
  # says when that passes).  required reads its result.
  rekey:
    needs: [plan, lint]
    # as the tests job: !cancelled() and plan's and lint's own results (that job says why)
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.lint.result == 'success'
      && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read   # the base commit, and the lazy blob fetches of the blobless checkouts below
    steps:
      # tools/oft alone, blobless: keys.checker lists tools/ from the commit's tree, and the import needs only oft
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          filter: blob:none
          sparse-checkout: tools/oft
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: the base's tools, beside this change
        id: base
        env:
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          set -euo pipefail
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the plan named no base commit ('$BASE')"; exit 1; }
          git -C head fetch --no-tags --depth=1 --filter=blob:none origin "$BASE"
          git -C head worktree add --no-checkout --detach "$GITHUB_WORKSPACE/base" "$BASE"
          git -C base sparse-checkout set --cone tools/oft
          git -C base checkout --detach "$BASE"
      - name: the tools' dependencies (PyYAML, idna), hash-pinned, from the base
        run: python -m pip install --quiet --require-hashes -r base/tools/oft/requirements.txt
      # The verdict of rule D11, by the base's tools alone: the re-key window, keys.checker of the base and of this
      # change's head.  This step runs no code of the change.  Code that runs in a step can rewrite the rest of that
      # step's script, which bash reads from its file under RUNNER_TEMP as it goes, and the rest of its state, so a
      # verdict made after it would be the change's (a head whose keys.py did so turned this failure into a pass:
      # tools/oft/tests/test_workflow_verdicts.py, RekeyGuardTest.REWRITE).  A move that may not merge fails the job
      # here, and the step after this one, which runs the change's own keys.py, is skipped then, as every step after
      # a failed one is.
      - name: keys.checker moves only in an announced re-key window (rule D11), by the base's tools
        id: rekey
        env:
          BASE: ${{ needs.plan.outputs.base }}
          # a pull request's base branch (empty for a merge queue group, which is main's)
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # keys.checker of a commit of head/, by the base's tools: one id of 64 hexadecimal characters, or a failure
          checker_of() {
            local out
            out=$(PYTHONPATH=base/tools python -c 'import sys; from oft import keys
          print(keys.checker(sys.argv[1], sys.argv[2]))' head "$1") || return 1
            [[ "$out" =~ ^[0-9a-f]{64}$ ]] || return 1
            echo "$out"
          }
          head=$(git -C head rev-parse HEAD)
          # The re-key window: .github/rekey-window's entry in the base's tree and in the head's (the trees are local:
          # the checkouts filter out blobs alone), then, for a regular file at the base, its blob (which the blobless
          # checkout fetches now), whether it opens the window, and the line that shows it.
          window=.github/rekey-window
          # the file $1 on one line (git's message, in a state or an error)
          one_line() { tr '\r\n' '  ' < "$1" | sed -e 's/  */ /g' -e 's/^ //' -e 's/ $//'; }
          # the error $1, in the log and in the summary, and the step fails
          fail() { echo "::error::$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          state='' open=false read_error='' head_error='' base_listed=true
          # reported only where the same-change rule below needs the head's entry
          head_entry=$(git -C head ls-tree "$head" -- "$window" 2> "$RUNNER_TEMP/rekey-window-head.err") ||
            head_error=$(one_line "$RUNNER_TEMP/rekey-window-head.err")
          if ! base_entry=$(git -C head ls-tree "$BASE" -- "$window" 2> "$RUNNER_TEMP/rekey-window-base.err"); then
            base_listed=false
            read_error=$(one_line "$RUNNER_TEMP/rekey-window-base.err")
          elif [ -z "$base_entry" ]; then
            state=missing
          else
            # <mode> <type> <object id><TAB><path>
            read -r mode type oid _ <<< "$base_entry"
            if [ "$type" != blob ] || { [ "$mode" != 100644 ] && [ "$mode" != 100755 ]; }; then
              state="not a file ($type, mode $mode)"
            elif git -C head cat-file blob "$oid" > "$RUNNER_TEMP/rekey-window" \
                 2> "$RUNNER_TEMP/rekey-window-blob.err"; then
              # Python, not bash, reads the bytes: $(...) drops a NUL byte, so `op\0en` would read as open.  It prints
              # ASCII alone, on one line: open or closed, then ascii() of at most 256 bytes.  ascii() can still hold
              # `::` or `##[`; the file is the base's, which main's own review admits.  -I -S: no site, PYTHONPATH or
              # working directory on its path.
              if read_out=$(python -I -S -c 'import sys
          data = open(sys.argv[1], "rb").read()
          print("open" if data.rstrip(b"\n") == b"open" else "closed")
          print(ascii(data[:256]) + (" (%d bytes)" % len(data) if len(data) > 256 else ""))
          ' "$RUNNER_TEMP/rekey-window"); then
                if [ "${read_out%%$'\n'*}" = open ]; then open=true; fi
                state=${read_out#*$'\n'}
              else
                read_error="python could not read the blob $oid"
              fi
            else
              read_error=$(one_line "$RUNNER_TEMP/rekey-window-blob.err")
            fi
          fi
          if [ -n "$read_error" ]; then state="unreadable ($read_error)"; fi
          from=$(checker_of "$BASE") ||
            { echo "::error::the base's tools could not compute keys.checker of the base $BASE"; exit 1; }
          to_base=$(checker_of "$head") ||
            { echo "::error::the base's tools could not compute keys.checker of this change's head $head"; exit 1; }
          echo "keys.checker of the base $BASE (the base's tools): $from"
          echo "keys.checker of this change $head (the base's tools): $to_base"
          { echo "### keys.checker (rule D11)"
            echo "- the base $BASE, by the base's tools: \`$from\`"
            echo "- this change $head, by the base's tools: \`$to_base\`"; } >> "$GITHUB_STEP_SUMMARY"
          # Whether a move of keys.checker may merge here, and the error it gets where it may not; the step after this
          # one holds the change's own id to the same answer.  Rule D11 holds a merge into main of the internal
          # repository alone: a pull request into another base, and theorem-labs/oss-verify-proofs, whose checker
          # moves only by releases cut here, get the ids and a notice.  There, a change that also adds, edits or
          # deletes the window file, or whose head's entry cannot be read, a window that cannot be read, and a window
          # that is not open, each hold a move.
          outside=false may_move=false why=''
          if [ "$GITHUB_REPOSITORY" = theorem-labs/oss-verify-proofs ] ||
             { [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$BASE_REF" != main ]; }; then
            outside=true may_move=true
          elif [ "$base_listed" = true ] && [ -n "$head_error" ]; then
            why="$window could not be read at this change's head $head, so whether it also changes the re-key window"
            why="$why is not known (rule D11): $head_error"
          # the mode, type and object id of each entry (none: the file is missing)
          elif [ "$base_listed" = true ] && [ "${base_entry%%$'\t'*}" != "${head_entry%%$'\t'*}" ]; then
            why="it also changes $window, and no change may both change the re-key window and move keys.checker"
            why="$why (rule D11)"
          elif [ -n "$read_error" ]; then
            why="the re-key window, $window at the base $BASE, could not be read: $read_error"
          elif [ "$open" = true ]; then
            may_move=true
          else
            why="it can merge only in an announced re-key window (rule D11); ask the CI/CD lead"
          fi
          { echo "from=$from"; echo "to_base=$to_base"; echo "outside=$outside"; echo "may_move=$may_move"
            echo "why=$why"; echo "state=$state"; } >> "$GITHUB_OUTPUT"
          if [ "$from" = "$to_base" ]; then
            echo "keys.checker is unchanged by the base's tools at this change's head" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          moves="this change moves keys.checker from $from to $to_base (re-keys every unit)"
          if [ "$outside" = true ]; then
            echo "::notice::$moves; rule D11 holds a merge into main of the internal repository, and this is none"
            echo "$moves; rule D11 holds a merge into main of the internal repository, and this is none" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "the re-key window: $window at the base $BASE: $state" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$may_move" = true ]; then
            echo "::notice::$moves; the re-key window is open ($window at the base $BASE reads open)"
            echo "$moves; the re-key window is open ($window at the base $BASE reads open)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          fail "$moves; $why"
      # keys.checker of this change's head by its own tools, the id its check jobs record where the base pins those
      # tools, in the job summary beside the base's two.  This runs the change's keys.py, so it comes after the verdict
      # above and runs only when that passed: it can fail the job and cannot pass one the verdict failed.  Where the
      # base's tools see no move and the change's own do, the move is held by the verdict's answer for this merge
      # (may_move, and why not); where the base's tools see one, the verdict judged it.
      - name: keys.checker of this change by its own tools, after the base's verdict
        id: own
        env:
          BASE: ${{ needs.plan.outputs.base }}
          FROM: ${{ steps.rekey.outputs.from }}
          TO_BASE: ${{ steps.rekey.outputs.to_base }}
          OUTSIDE: ${{ steps.rekey.outputs.outside }}
          MAY_MOVE: ${{ steps.rekey.outputs.may_move }}
          WHY: ${{ steps.rekey.outputs.why }}
          STATE: ${{ steps.rekey.outputs.state }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          head=$(git -C head rev-parse HEAD)
          to_own=$(PYTHONPATH=head/tools python -c 'import sys; from oft import keys
          print(keys.checker(sys.argv[1], sys.argv[2]))' head "$head") ||
            { echo "::error::this change's tools could not compute keys.checker of its head $head"; exit 1; }
          [[ "$to_own" =~ ^[0-9a-f]{64}$ ]] ||
            { echo "::error::this change's tools could not compute keys.checker of its head $head"; exit 1; }
          echo "keys.checker of this change $head (its own tools): $to_own"
          echo "- this change $head, by its own tools: \`$to_own\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TO_BASE" != "$to_own" ]; then
            echo "::warning::the base's tools and this change's own give its head different ids: $TO_BASE and $to_own"
            echo "the base's tools and this change's own give its head different ids: $TO_BASE and $to_own" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$to_own" = "$FROM" ] && [ "$TO_BASE" = "$FROM" ]; then
            echo "keys.checker is unchanged: this change re-keys no unit" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # a move the base's tools saw is the verdict's, and no move by the change's own tools is none
          if [ "$TO_BASE" != "$FROM" ] || [ "$to_own" = "$FROM" ]; then exit 0; fi
          moves="this change moves keys.checker from $FROM to $to_own (re-keys every unit)"
          if [ "$OUTSIDE" = true ]; then
            echo "::notice::$moves; rule D11 holds a merge into main of the internal repository, and this is none"
            echo "$moves; rule D11 holds a merge into main of the internal repository, and this is none" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "the re-key window: .github/rekey-window at the base $BASE: $STATE" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$MAY_MOVE" in
            true)
              echo "::notice::$moves; the re-key window is open (.github/rekey-window at the base $BASE reads open)"
              echo "$moves; the re-key window is open (.github/rekey-window at the base $BASE reads open)" \
                >> "$GITHUB_STEP_SUMMARY" ;;
            false) fail "$moves; $WHY" ;;
            *) fail "the verdict gave no answer for whether keys.checker may move here ('$MAY_MOVE')" ;;
          esac

  # The release window (OSSV-122).  A platform release is cut from a candidate commit of main, and publication stays
  # off until its content pull request has merged and moved tools/publish/bootstrap-public-commit.txt.  A change that
  # merges in between and changes what a project's check or rendering reads would leave main differing from the
  # release in what only a platform release may change, so every publication after it would wait for the next
  # release (publish.yml's drift job, tools/publish/overlay.py platform_drift).  So the Release lane opens a window
  # with the tag refs/tags/ossv/release-window (lightweight, on any commit: only its existence counts) before it
  # chooses the candidate, and deletes the tag once the content pull request has merged
  # (dev/stream/publish/runbook-push.md).  While the tag exists this job fails a change in which the base and the
  # head differ in a path platform_drift reports, run by the base's tools/publish/overlay.py on sparse checkouts of
  # the paths publish.yml's drift job reads; a change to projects/ alone, and the content pull request (release.yaml's
  # release, date and counts, the bootstrap file, the port list), pass.  It also keeps the release window and a re-key
  # window (rule D11: .github/rekey-window, read as the rekey job reads it) from being open together.  While the tag
  # exists it fails a change whose head reads open: every change while the base reads open, and the change that opens
  # a window.  The change that closes a window (its head reads anything else, or has no such file) passes, since
  # failing it would leave no way out but deleting the tag.  A tag that cannot be read fails the job: a failed read is
  # never an absent tag.  The job prints the state of both windows on every run, before any verdict.  It needs the
  # plan alone, not lint, so that a draft, which lint skips, runs it and prints both windows too; it runs the base's
  # code alone, never the change's.  Without the tag it checks out no file but the head's window file, and reads the
  # base's from the base commit's tree.  Like rekey, it holds a merge into main of the internal repository only: a
  # pull request into another base, and theorem-labs/oss-verify-proofs, get a notice.  required reads its result.
  release_window:
    needs: [plan]
    # !cancelled() and plan's own result, as rekey; lint's is not read, so a draft runs it too (the header says why)
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-24.04
    # publish.yml's drift job's limit for the same two sparse checkouts, each of which reads an index of some 290,000
    # entries: a rehearsal of this job on the tree of internal #2444 took about two minutes on two cores
    timeout-minutes: 15
    permissions:
      contents: read   # the tag, the base commit, and the lazy blob fetches of the blobless checkout below
    steps:
      # the head's .github/rekey-window alone, blobless: a blob outside it is fetched only when a step reads it
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github/rekey-window
      - name: the release window and a re-key window are not open together
        id: window
        env:
          BASE: ${{ needs.plan.outputs.base }}
          # a pull request's base branch (empty for a merge queue group, which is main's)
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the plan named no base commit ('$BASE')"; exit 1; }
          tag=refs/tags/ossv/release-window
          window=.github/rekey-window
          # the file $1 on one line (git's message, in a state or an error)
          one_line() { tr '\r\n' '  ' < "$1" | sed -e 's/  */ /g' -e 's/^ //' -e 's/ $//'; }
          # the error $1, in the log and in the summary, and the step fails; the error line escapes it as the runner's
          # workflow-command rules say (`%` first, then CR and LF), since a state holds this change's text
          fail() {
            local line="${1//%/%25}" && line="${line//$'\r'/%0D}" && line="${line//$'\n'/%0A}"
            echo "::error::$line"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 1
          }
          # the line $1 in the summary, and in the log between ::stop-commands:: and a random token that resumes them:
          # a window's state is the ascii() of a window file's bytes, this change's text at its head, and the runner
          # reads a line that starts with :: (after white space) or holds ##[ anywhere as a workflow command
          show() {
            local token
            token=$(openssl rand -hex 16)
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "::stop-commands::$token"; echo "$1"; echo "::$token::"
          }
          echo "### the release window (tag ossv/release-window) and the re-key window" >> "$GITHUB_STEP_SUMMARY"
          # The tag, read first.  With --exit-code git exits 2 when the remote has no such ref; a failure to read it
          # (the network, the token) exits with another code, so exit 2 alone is an absent tag.
          rc=0
          listed=$(git -C head ls-remote --exit-code origin "$tag" 2> "$RUNNER_TEMP/release-window.err") || rc=$?
          case $rc in
            0) release=open state="open (the tag exists: $(tr '\t\n' '  ' <<< "$listed" | sed 's/ *$//'))" ;;
            2) release=closed state="closed (no such tag)" ;;
            *) release=unread error="git ls-remote exited $rc: $(one_line "$RUNNER_TEMP/release-window.err")"
               state="unreadable ($error)" ;;
          esac
          echo "the release window: $tag: $state" | tee -a "$GITHUB_STEP_SUMMARY"
          git -C head fetch --no-tags --depth=1 --filter=blob:none origin "$BASE"
          head=$(git -C head rev-parse HEAD)
          # .github/rekey-window at the commit $1, read as the rekey job reads it: `state` is missing, not a file, the
          # ascii() of its bytes, or unreadable with git's message (then `unread` is true); `open` is true only for a
          # regular file whose bytes, trailing newlines removed, are exactly `open`.  The trees are local (the
          # checkout filters out blobs alone); the blob of a regular file is fetched as it is read.
          read_window() {
            local entry mode type oid out error=''
            state='' open=false unread=false
            if ! entry=$(git -C head ls-tree "$1" -- "$window" 2> "$RUNNER_TEMP/rekey-window.err"); then
              error=$(one_line "$RUNNER_TEMP/rekey-window.err")
            elif [ -z "$entry" ]; then
              state=missing
            else
              # <mode> <type> <object id><TAB><path>
              read -r mode type oid _ <<< "$entry"
              if [ "$type" != blob ] || { [ "$mode" != 100644 ] && [ "$mode" != 100755 ]; }; then
                state="not a file ($type, mode $mode)"
              elif git -C head cat-file blob "$oid" > "$RUNNER_TEMP/rekey-window" \
                   2> "$RUNNER_TEMP/rekey-window.err"; then
                # Python, not bash, reads the bytes, as in the rekey job: $(...) drops a NUL byte, so `op\0en` would
                # read as open.  It prints ASCII alone, one line, which show() prints with workflow commands stopped.
                if out=$(python3 -I -S -c 'import sys
          data = open(sys.argv[1], "rb").read()
          print("open" if data.rstrip(b"\n") == b"open" else "closed")
          print(ascii(data[:256]) + (" (%d bytes)" % len(data) if len(data) > 256 else ""))
          ' "$RUNNER_TEMP/rekey-window"); then
                  if [ "${out%%$'\n'*}" = open ]; then open=true; fi
                  state=${out#*$'\n'}
                else
                  error="python could not read the blob $oid"
                fi
              else
                error=$(one_line "$RUNNER_TEMP/rekey-window.err")
              fi
            fi
            if [ -n "$error" ]; then state="unreadable ($error)" unread=true; fi
          }
          read_window "$BASE"
          base_open=$open
          show "the re-key window: $window at the base $BASE: $state"
          read_window "$head"
          head_open=$open head_unread=$unread head_state=$state
          show "the re-key window: $window at this change's head $head: $state"
          if [ "$GITHUB_REPOSITORY" = theorem-labs/oss-verify-proofs ] ||
             { [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$BASE_REF" != main ]; }; then
            said="the release-window rule holds a merge into main of the internal repository, and this is none"
            echo "::notice::$said"
            echo "$said" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case $release in
            unread) fail "the release window, $tag, could not be read (a failed read is never an absent tag): $error" ;;
            closed) echo "the release window is closed: this rule holds no change back" | tee -a "$GITHUB_STEP_SUMMARY"
                    exit 0 ;;
          esac
          overlap="the release window (tag ossv/release-window) and a re-key window must not be open together"
          if [ "$head_unread" = true ]; then
            said="the release window (tag ossv/release-window) is open, and $window could not be read at this"
            fail "$said change's head $head, so whether it opens a re-key window is not known: $head_state"
          fi
          if [ "$head_open" = true ]; then
            if [ "$base_open" = true ]; then
              said="$overlap: $window reads open at the base $BASE and at this change's head; only the change that"
              fail "$said closes the re-key window can merge until the tag is deleted"
            fi
            fail "$overlap: this change makes $window read open at its head $head, which opens a re-key window"
          fi
          if [ "$base_open" = true ]; then
            echo "this change closes the re-key window: $window reads open at the base and not at its head" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "the release window is open: the next steps compare the base and this change in what only a platform release may change" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "release_window=open" >> "$GITHUB_OUTPUT"
      - name: the base's and this change's files that platform_drift reads
        if: steps.window.outputs.release_window == 'open'
        env:
          BASE: ${{ needs.plan.outputs.base }}
          # the paths publish.yml's drift job checks out, which platform_drift reads
          DRIFT_PATHS: /tools/ /theories/ /toolchain/ /tests/ /dune-project /release.yaml .gitattributes
        run: |
          set -euo pipefail
          read -r -a paths <<< "$DRIFT_PATHS"
          git -C head worktree add --no-checkout --detach "$GITHUB_WORKSPACE/base" "$BASE"
          git -C base sparse-checkout set --no-cone "${paths[@]}"
          git -C base checkout --detach "$BASE"
          git -C head sparse-checkout set --no-cone "${paths[@]}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: steps.window.outputs.release_window == 'open'
        with:
          python-version: "3.12"
      - name: the base's tools' dependencies (PyYAML, idna), hash-pinned
        if: steps.window.outputs.release_window == 'open'
        run: python -m pip install --quiet --require-hashes -r base/tools/oft/requirements.txt
      - name: no change to what only a platform release may change while the release window is open
        id: drift
        if: steps.window.outputs.release_window == 'open'
        run: |
          set -euo pipefail
          # the base's overlay.py, which runs the base's oft: no code of this change runs here.  Each path as it is,
          # ended by a NUL byte, the one byte no path holds: a path is this change's text and may hold a line break.
          python -I - base head > "$RUNNER_TEMP/drift.txt" <<'PY'
          import sys
          sys.path.insert(0, "base/tools/publish")
          import overlay
          for path in overlay.platform_drift(sys.argv[1], sys.argv[2]):
              print(path, end="\0")
          PY
          if [ ! -s "$RUNNER_TEMP/drift.txt" ]; then
            echo "this change changes no path that only a platform release may change: it may merge while the release window is open" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # each path on one line, its \, CR and LF escaped, for the log and the summary alone
          shown=() bs="\\"
          while IFS= read -r -d '' path; do
            path="${path//"$bs"/"$bs$bs"}" && path="${path//$'\r'/"${bs}r"}" && path="${path//$'\n'/"${bs}n"}"
            shown+=("$path")
          done < "$RUNNER_TEMP/drift.txt"
          said="this change changes ${#shown[@]} path(s) that only a platform release may change"
          said="$said (tools/publish/overlay.py platform_drift), and the release window (tag ossv/release-window) is"
          said="$said open; it can merge after the release's content pull request merges and the tag"
          said="$said ossv/release-window is deleted"
          echo "::error::$said"
          # The runner reads a line that starts with :: (after white space) or holds ##[ anywhere as a workflow
          # command: the log's list sits between ::stop-commands:: and a random token that resumes them.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          printf '  %s\n' "${shown[@]}"
          echo "::$token::"
          { echo "$said:"; printf -- '- %s\n' "${shown[@]}"; } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  required:
    needs: [queue_run, plan, lint, tests, fetch-drafts, check, controls, lps_pin, stream_tools, rekey, release_window,
            farm_tests, made_from, public_rows]
    # always: on a push whose jobs queue_run skipped, it collects queue_run's finding, the merge queue runs that passed
    # main-gate on the commits of this push, and names those runs (its step below)
    if: always()
    runs-on: ubuntu-slim
    # the stale base steps of a pull request no merge queue checks again take a sparse checkout of this change and
    # fetch two trees of the base branch, which on this tree is about a minute
    timeout-minutes: 10
    permissions:
      # a check held for the label: the pull request's comments, for merge-pr.sh's evidence comment (GitHub's "List
      # issue comments" accepts this scope)
      pull-requests: read
      # the base branch's tip and the two trees the stale base step compares, and its checkout of this change
      contents: read
    steps:
      - name: a pull request into theorem-labs/oss-verify-proofs is a pull request into main
        if: github.repository == 'theorem-labs/oss-verify-proofs' && github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: '[ "$BASE" = main ] || { echo "::error::the base is $BASE: this repository takes pull requests into main"; exit 1; }'
      # Every job of this run read the base as it was when the run started: the first parent of the merge commit
      # GitHub built for it, refs/pull/<n>/merge.  The base's tools ran the plan, the lint and the check, the base's
      # facts were the statements each proof was checked against, and the base's copy of .github/actions/ ran inside
      # the jobs.  (This workflow is the merge commit's copy, as GitHub runs a pull request's workflow; a base change
      # to it is in the merge that lands and in every run after this one.)  When the base then takes such a change,
      # this run's green is about a base that is gone, and nothing re-checks it: a pull request into a branch with no
      # merge queue merges on the verdict of its own run (#438 passed its tools' tests on the base before #416 and
      # failed on the line after it).  So this step compares that base with the tip of the base branch now and fails
      # when they differ in a path the checks read (tools/oft/tests/stale_base.py says which, and why those).  A base
      # that moved only by another fuzz target's proofs, counterexamples or findings, or by the pages a merge
      # renders, passes.
      # A pull request that a merge queue checks again after this run (QUEUED in the last step: a pull request into
      # main, but on theorem-labs/oss-verify-proofs) skips these steps: the queue's group run judges it on the base as
      # it is then, with the base's tools of then.
      # The runner is the base's copy, like the tools every other judging step runs (the plan job's base step, whose
      # words are "nothing trusted to judge with"): a GitHub App can change tools/ with the Contents permission
      # alone, and this file only with the Workflows permission as well, so a change's own copy of the runner must
      # not decide whether that change may merge.  As with the shared actions, it must land on the base before the
      # step that calls it, and the step says so when it has not.
      - name: the change, and the base's copy of the runner that judges it
        if: >-
          github.event_name == 'pull_request'
          && (github.event.pull_request.base.ref != 'main' || github.repository == 'theorem-labs/oss-verify-proofs')
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: head
          # the runner and the module it reads the change files from (tools/oft/layout.py); the diff it makes reads
          # the two trees, which it fetches with no blob
          filter: blob:none
          sparse-checkout: tools/oft
      - name: the base's tools, as the plan job takes them
        if: >-
          github.event_name == 'pull_request'
          && (github.event.pull_request.base.ref != 'main' || github.repository == 'theorem-labs/oss-verify-proofs')
        run: |
          set -euo pipefail
          # the first parent of the merge commit checked out, read as the plan job's base step reads it: a commit
          # names its parents even in a clone one commit deep, while `git rev-parse HEAD^1` there answers nothing
          # (.git/shallow hides them).  A HEAD with one parent is no merge commit and must not pass as one.
          read -r -a parents <<< "$(git -C head cat-file -p HEAD | sed -n 's/^parent //p' | tr '\n' ' ')"
          [ "${#parents[@]}" = 2 ] || {
            echo "::error::HEAD has ${#parents[@]} parent(s): not the merge commit GitHub builds for a pull request"; exit 1; }
          base="${parents[0]}"
          git -C head fetch --no-tags --depth=1 --filter=blob:none origin "$base"
          git -C head worktree add --no-checkout --detach "$GITHUB_WORKSPACE/base" "$base"
          git -C base sparse-checkout set --cone tools/oft
          git -C base checkout --detach "$base"
          [ -f base/tools/oft/tests/stale_base.py ] || {
            echo "::error::the base branch has no tools/oft/tests/stale_base.py: required runs the base's copy of the runner, so it must land on the base first"; exit 1; }
      - name: the base this run was built on is still the tip of the base branch
        if: >-
          github.event_name == 'pull_request'
          && (github.event.pull_request.base.ref != 'main' || github.repository == 'theorem-labs/oss-verify-proofs')
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          # what the plan's reach step answered: whether this run read every file of the tree
          PLANNED_TESTS: ${{ needs.plan.outputs.tests }}
          PLANNED_REPOSITORY_LINT: ${{ needs.plan.outputs.repository_lint }}
        run: |
          set -euo pipefail
          # A run that ran the tools' tests read every file of the tree (the whole-tree lint among them), so a move
          # of the base in any fuzz target's facts can change what it found; a run that did not read only its own
          # fuzz targets' facts.  Anything but a plain `false` from the plan is read as "it did" (a plan that
          # failed or answered nothing must not narrow the rule).
          whole=(--whole-tree)
          if [ "$PLANNED_TESTS" = false ] && [ "$PLANNED_REPOSITORY_LINT" = false ]; then whole=(); fi
          PYTHONPATH="$GITHUB_WORKSPACE/base/tools" python3 -m oft.tests.stale_base \
            --root head --repo "$GITHUB_REPOSITORY" --base-ref "$BASE_REF" "${whole[@]}"
      # A push whose jobs queue_run skipped: its commits' verdicts are the merge queue runs that checked each of them
      # against its own parent, and this step says which runs those are.  Nothing else ran here to collect.
      - name: a push the merge queue checked, by the merge queue runs of its commits
        if: needs.queue_run.outputs.checked == 'true'
        env:
          QUEUE_RESULT: ${{ needs.queue_run.result }}
          QUEUE_RUNS: ${{ needs.queue_run.outputs.runs }}
        run: |
          set -euo pipefail
          [ "$QUEUE_RESULT" = success ] || { echo "::error::queue_run did not succeed ($QUEUE_RESULT)"; exit 1; }
          [[ "$QUEUE_RUNS" =~ ^[0-9]+( [0-9]+)*$ ]] || { echo "::error::queue_run named no merge queue run ('$QUEUE_RUNS')"; exit 1; }
          for run in $QUEUE_RUNS; do
            echo "merge queue run $run passed main-gate on a commit of this push, made on that commit's parent"
            echo "a check of this push: merge queue run $run ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run)" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: every job green, and something checked when the plan named anything
        if: needs.queue_run.outputs.checked != 'true'
        env:
          DRAFTS_LISTED: ${{ needs.plan.outputs.draft_legs != '[]' }}
          FETCH_DRAFTS_RESULT: ${{ needs.fetch-drafts.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          TESTS: ${{ needs.plan.outputs.tests }}
          CONTROLS: ${{ needs.plan.outputs.controls }}
          # whether this change touches release.yaml, toolchain/ or theories/, and how the job that holds such a change
          # to the pinned model and checker and runner images ended (the lps_pin job; the verdict is below, before the
          # draft's, since a draft runs that job)
          LPS_PIN: ${{ needs.plan.outputs.lps_pin }}
          LPS_PIN_RESULT: ${{ needs.lps_pin.result }}
          REPOSITORY_LINT: ${{ needs.plan.outputs.repository_lint }}
          UNITS: ${{ needs.plan.outputs.units }}
          HOLD: ${{ needs.plan.outputs.hold }}
          # whether a merge queue checks this pull request after this run: a pull request into main, except on
          # theorem-labs/oss-verify-proofs, whose main merges with no queue (no other base has one)
          QUEUED: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
            && github.repository != 'theorem-labs/oss-verify-proofs' }}
          PLANNED_TOOLS: ${{ needs.plan.outputs.tools }}
          LINT_RESULT: ${{ needs.lint.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          CONTROLS_RESULT: ${{ needs.controls.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          STREAM_TOOLS: ${{ needs.plan.outputs.stream_tools }}
          STREAM_TOOLS_RESULT: ${{ needs.stream_tools.result }}
          # of a matrix, the result of every leg together: success only when each leg succeeded
          FARM_TESTS: ${{ needs.plan.outputs.farm_tests }}
          FARM_TESTS_RESULT: ${{ needs.farm_tests.result }}
          # whether the plan named a unit for the made_from job, the units whose proofs changed, and how that job
          # ended.  The plan names a unit when a changed path is under its proofs/provenance/, or is its images/dune,
          # and the head tree holds a made_from.py or a made-from.tsv under its proofs/provenance/.  It names every unit
          # with a record when the change touches a path of MADE_FROM_READS, that line, the made_from job, a
          # .gitattributes or a path git quotes, or when the run has no base.  MADE_FROM_PROOFS (a JSON list) holds each
          # unit with a made-from.tsv whose proofs/ the change touches outside proofs/provenance/.  The job is wanted
          # when MADE_FROM is true, or when MADE_FROM_PROOFS is not [] and HOLD is none (the job's if:).
          MADE_FROM: ${{ needs.plan.outputs.made_from }}
          MADE_FROM_PROOFS: ${{ needs.plan.outputs.made_from_proofs }}
          MADE_FROM_RESULT: ${{ needs.made_from.result }}
          # whether the change touches tools/publish/public-before-hold.tsv, and how the public_rows job that then
          # checks each row of it ended
          PUBLIC_ROWS: ${{ needs.plan.outputs.public_rows }}
          PUBLIC_ROWS_RESULT: ${{ needs.public_rows.result }}
          # a check held for the label: merge-pr.sh's evidence comment on this pull request, for this head (below)
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VM_EVIDENCE_BY: sjawhar-agent[bot]
          # the parts this run planned and a check of record outside it checked: its note (below)
          CHECKED_ELSEWHERE: ${{ needs.plan.outputs.checked_elsewhere }}
          CHECKED_ELSEWHERE_NOTE: ${{ needs.plan.outputs.checked_elsewhere_note }}
        run: |
          set -euo pipefail
          [ "$PLAN_RESULT" = success ] || { echo "::error::the plan failed"; exit 1; }
          # The router's answers, each one it must give: an empty or other answer would read as "not needed" below and
          # pass a job that did not run, so it fails here.
          for answer in "tests=$TESTS" "controls=$CONTROLS" "repository_lint=$REPOSITORY_LINT" \
                        "lps_pin=$LPS_PIN" \
                        "checked_elsewhere=$CHECKED_ELSEWHERE" "stream_tools=$STREAM_TOOLS" "farm_tests=$FARM_TESTS" \
                        "made_from=$MADE_FROM" "public_rows=$PUBLIC_ROWS"; do
            case "${answer#*=}" in true|false) ;; *)
              echo "::error::the plan answered ${answer%%=*} '${answer#*=}', neither true nor false"; exit 1 ;;
            esac
          done
          [[ "$UNITS" =~ ^[0-9]+$ ]] || { echo "::error::the plan answered units '$UNITS', not a count"; exit 1; }
          case "$MADE_FROM_PROOFS" in '['*']') ;; *)
            echo "::error::the plan answered made_from_proofs '$MADE_FROM_PROOFS', not a JSON list"; exit 1 ;;
          esac
          # which tools lint and check ran (the plan step's migration pin): the base's or, where the base pins it, this
          # change's
          case "$PLANNED_TOOLS" in base|head) ;; *)
            echo "::error::the plan answered tools '$PLANNED_TOOLS', neither base nor head"; exit 1 ;;
          esac
          case "$HOLD" in none|draft|label) ;; *)
            echo "::error::the plan answered hold '$HOLD', none of none, draft and label"; exit 1 ;;
          esac
          # the whole-tree lint test is one of the tools' tests: it cannot run when they do not
          [ "$REPOSITORY_LINT" = false ] || [ "$TESTS" = true ] || {
            echo "::error::the plan answered repository_lint true and tests false"; exit 1; }
          # The model and the images a change to release.yaml, toolchain/ or theories/ is held to.  This verdict
          # comes before the draft's: lps_pin waits for the plan alone, so a draft runs it, and a theories/ change no
          # job compiled is a failure, never a pass with everything skipped (Dispatch issue OSSV-440, the red team on
          # #2360).
          if [ "$LPS_PIN" = true ]; then
            [ "$LPS_PIN_RESULT" = success ] || {
              echo "::error::this change touches release.yaml, toolchain/ or theories/, and the job that holds it to the pinned model and checker and runner images failed or did not run (lps_pin: $LPS_PIN_RESULT)"
              echo "release.yaml, toolchain/ or theories/ changed and lps_pin did not pass ($LPS_PIN_RESULT)" >> "$GITHUB_STEP_SUMMARY"
              exit 1; }
            echo "release.yaml, toolchain/ or theories/ changed: lps_pin held the model's two pins to one hash and the checker and runner images to their attestations"
          else
            [ "$LPS_PIN_RESULT" = skipped ] || {
              echo "::error::no release.yaml, toolchain/ or theories/ file changed, yet lps_pin ran ($LPS_PIN_RESULT)"; exit 1; }
            echo "no release.yaml, toolchain/ or theories/ file changed: the LPS pin check did not run"
          fi
          # A draft: lint did not run, nor any job after it (lint's `if:`, and the header's paragraph on the hold).  Each
          # must have been skipped.  As for a held check: into this repository's main the merge queue group, which a
          # draft cannot enter and which is never held, lints the change and runs every other job before it merges,
          # so this run passes and says so; into any other base nothing judges it after this run, so it fails until
          # the pull request is marked ready for review, which runs this workflow again in full.
          if [ "$HOLD" = draft ]; then
            for job in "lint=$LINT_RESULT" "tests=$TESTS_RESULT" "controls=$CONTROLS_RESULT" \
                       "stream_tools=$STREAM_TOOLS_RESULT" "farm_tests=$FARM_TESTS_RESULT" \
                       "made_from=$MADE_FROM_RESULT" "public_rows=$PUBLIC_ROWS_RESULT" \
                       "fetch-drafts=$FETCH_DRAFTS_RESULT" "check=$CHECK_RESULT"; do
              [ "${job#*=}" = skipped ] || { echo "::error::a draft, yet ${job%%=*} ran (${job#*=})"; exit 1; }
            done
            if [ "$QUEUED" != true ]; then
              echo "::error::a draft: lint and the jobs after it did not run at this head; mark it ready for review"
              echo "a draft: lint and the jobs after it did not run at this head; mark it ready for review" \
                >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "lint skipped: a draft (the merge queue lints it and runs every other job; marking it ready for review runs them here)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$LINT_RESULT" = success ] || { echo "::error::lint failed"; exit 1; }
          if [ "$TESTS" = true ]; then
            [ "$TESTS_RESULT" = success ] || { echo "::error::the tools' tests failed or did not run"; exit 1; }
          else
            [ "$TESTS_RESULT" = skipped ] || { echo "::error::nothing the tools' tests read changed, yet they ran"; exit 1; }
          fi
          if [ "$DRAFTS_LISTED" = true ] && [ "$HOLD" = none ]; then
            [ "$FETCH_DRAFTS_RESULT" = success ] || { echo "::error::fetching the draft binaries failed or did not run"; exit 1; }
          else
            [ "$FETCH_DRAFTS_RESULT" = skipped ] || { echo "::error::no draft binary listed (or check held), yet fetch-drafts ran"; exit 1; }
          fi
          if [ "$CONTROLS" = true ]; then
            [ "$CONTROLS_RESULT" = success ] || { echo "::error::the controls failed or did not run"; exit 1; }
          else
            [ "$CONTROLS_RESULT" = skipped ] || { echo "::error::no input of the controls changed, yet they ran"; exit 1; }
          fi
          if [ "$STREAM_TOOLS" = true ]; then
            [ "$STREAM_TOOLS_RESULT" = success ] || {
              echo "::error::the stream tools' check failed or did not run"; exit 1; }
          else
            [ "$STREAM_TOOLS_RESULT" = skipped ] || {
              echo "::error::nothing under dev/stream/ changed, nor tools/publish/held-match-cases.tsv," \
                   "tools/publish/withheld.yaml, tools/publish/private-harnesses.txt" \
                   "or tools/publish/release_pins.py, yet the stream tools' check ran"; exit 1; }
          fi
          if [ "$FARM_TESTS" = true ]; then
            [ "$FARM_TESTS_RESULT" = success ] || {
              echo "::error::the farm runner's tests failed or did not run"; exit 1; }
          else
            [ "$FARM_TESTS_RESULT" = skipped ] || {
              echo "::error::nothing the farm runner's tests read changed, yet they ran"; exit 1; }
          fi
          # the made_from job's own if: a strict unit, or a unit whose proofs changed when nothing is held
          if [ "$MADE_FROM" = true ] || { [ "$MADE_FROM_PROOFS" != '[]' ] && [ "$HOLD" = none ]; }; then
            [ "$MADE_FROM_RESULT" = success ] || {
              echo "::error::the made-from records' check failed or did not run"; exit 1; }
          else
            [ "$MADE_FROM_RESULT" = skipped ] || {
              if [ "$MADE_FROM_PROOFS" = '[]' ]; then
                echo "::error::the plan named no unit for the made_from job, yet it ran"
              else
                echo "::error::the plan named only units whose proofs changed outside proofs/provenance/, and its hold is $HOLD, not none, yet the made_from job ran"
              fi
              exit 1; }
          fi
          if [ "$PUBLIC_ROWS" = true ]; then
            [ "$PUBLIC_ROWS_RESULT" = success ] || {
              echo "::error::the public-before-hold rows' check failed or did not run"; exit 1; }
          else
            [ "$PUBLIC_ROWS_RESULT" = skipped ] || {
              echo "::error::tools/publish/public-before-hold.tsv did not change, yet the public_rows job ran"; exit 1; }
          fi
          if [ "$CHECKED_ELSEWHERE" = true ]; then
            # The parts this run planned and did not check here, because a check of record outside it checked them
            # (the plan job's elsewhere step, which says what it measured): the tree the base pins with a deferred
            # check, whichever tools judged it, or a merge queue group or a pull request whose every pull request
            # was checked on a VM at a tree with these parts' keys.  Whatever the hold (a draft was answered above),
            # since a check of record answers for them, and with no check job and no fetch-drafts leg run: the plan
            # file is empty.
            [ "$CHECK_RESULT" = skipped ] || { echo "::error::the checks are of record elsewhere, yet check ran"; exit 1; }
            [ "$FETCH_DRAFTS_RESULT" = skipped ] || {
              echo "::error::the checks are of record elsewhere, yet fetch-drafts ran"; exit 1; }
            [ -n "$CHECKED_ELSEWHERE_NOTE" ] || {
              echo "::error::the checks are of record elsewhere, and the plan named no check of record"; exit 1; }
            echo "checks not run here: $UNITS harnesses planned; $CHECKED_ELSEWHERE_NOTE" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$UNITS" != 0 ] && [ "$HOLD" != none ]; then
            # check held: a draft, or no label `check` (the header says why)
            [ "$CHECK_RESULT" = skipped ] || { echo "::error::check was held ($HOLD), yet it ran"; exit 1; }
            why="$([ "$HOLD" = draft ] && echo "a draft" || echo "no label \`check\`")"
            if [ "$QUEUED" != true ]; then
              # no merge queue checks it after this run: it must not look green without its checks.  Held for the label
              # only (never a draft): the held check is accepted when merge-pr.sh's evidence comment is on this pull
              # request, posted by its App (user.type Bot), whose first line is exactly the marker for this head.  The
              # step checks that comment, not the VM check it reports.  A marker for another commit never counts; any
              # other comment, or comments that cannot be read, leave the failure below.
              if [ "$HOLD" = label ]; then
                VM_PR="$PR" VM_HEAD="$HEAD_SHA"
                # vm evidence
                # merge-pr.sh's VM evidence comment on pull request VM_PR for the commit VM_HEAD: posted by the App
                # (user.type Bot), its first line exactly `<!-- vm-evidence head=<VM_HEAD> mode=<pvc|xh|checklog> -->`,
                # and changed since by nobody but the App either (GitHub keeps every editor in userContentEdits, which only
                # GraphQL gives).  `said` becomes that comment's "(mode): <its url>", its node id, and one
                # `key <unit> <key>` line for each `<!-- vm-evidence-key unit=<project>/<harness> key=<64 hex> -->` line
                # after the marker in it, the unit's build key at the tree its check of record ran on, and one
                # `checker <id>` line for each `<!-- vm-evidence-checker id=<64 hex> -->` line after the marker, the
                # keys.checker of the tree that check of record ran on: a key says nothing about the tools that
                # computed it, so the marker names them, and a marker with no such line, with more than one, or with
                # another id than this tree's is refused where the keys are read (plan.vm_evidence_checker).
                # Of the comments
                # that carry the marker the newest answers, since a later run of merge-pr.sh posts a later comment:
                # --slurp hands the whole list to one jq program, so `last` is the newest of every page, not of each;
                # the CLI refuses --slurp with its own --jq, so the pages go through jq here, with HEAD_SHA exported.
                # A marker for another commit, by anyone else, or not on the first line counts for nothing, and so does
                # a comment anyone else changed and a read that fails: `said` is empty then.  What is checked is the
                # comment, not the VM check it reports.
                # shellcheck disable=SC2016  # a jq program: $lines and $mode are jq's, not the shell's
                said="$(export HEAD_SHA="$VM_HEAD"
                  gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$VM_PR/comments?per_page=100" | jq -r '
                  [ .[][] | select(.user.login == env.VM_EVIDENCE_BY and .user.type == "Bot")
                    | (.body | split("\n")) as $lines
                    | first(("pvc", "xh", "checklog")
                            | select($lines[0] == "<!-- vm-evidence head=\(env.HEAD_SHA) mode=\(.) -->")) as $mode
                    | {mode: $mode, url: .html_url, node: .node_id,
                       keys: [$lines[1:][]
                              | capture("^<!-- vm-evidence-key unit=(?<unit>[^ ]+) key=(?<key>[0-9a-f]{64}) -->$")],
                       checker: [$lines[1:][]
                                 | capture("^<!-- vm-evidence-checker id=(?<id>[0-9a-f]{64}) -->$").id]}
                  ] | last // empty
                  | "(\(.mode)): \(.url)", "node \(.node)", (.keys[] | "key \(.unit) \(.key)"),
                    (.checker[] | "checker \(.)")')" || said=
                if [ -n "$said" ]; then
                  # The comment's author and every editor of it are the App: GraphQL names an App `Bot` and gives its
                  # login without the `[bot]` REST appends, so the author must be a Bot whose login and `[bot]` is
                  # VM_EVIDENCE_BY and every editor a Bot of that same login.  An edit list that is no list, more edits
                  # than this one page holds, and a read that fails all count as a stranger; a read that fails says so
                  # with the error, since a token refused this field would otherwise look like a comment someone changed.
                  err="$(mktemp)"   # the read's stderr, apart from its answer: a warning on success must not change it
                  # shellcheck disable=SC2016  # a GraphQL query: $id is GraphQL's, not the shell's
                  strangers="$(gh api graphql -f query='query($id: ID!) { node(id: $id) { ... on IssueComment {
                      author { __typename login }
                      userContentEdits(first: 100) { totalCount nodes { editor { __typename login } } } } } }' \
                    -F id="$(sed -n 's/^node //p' <<< "$said" | head -n 1)" \
                    --jq '.data.node as $c | ($c.author.login // "") as $who
                          | [ (if $c.author.__typename == "Bot" and ($who + "[bot]") == env.VM_EVIDENCE_BY
                               then 0 else 1 end),
                              (if ($c.userContentEdits.nodes | type) == "array" then 0 else 1 end),
                              (if ($c.userContentEdits.totalCount // 0) > 100 then 1 else 0 end),
                              ([$c.userContentEdits.nodes[]?
                                | select(.editor.__typename != "Bot" or (.editor.login // "") != $who)] | length)
                           ] | add' 2> "$err")" \
                   || { echo "::warning::the editors of pull request $VM_PR's evidence comment cannot be read:"\
                          "$(tr '\r\n' '  ' < "$err")"; strangers=unread; }
                  rm -f "$err"
                  [ "$strangers" = 0 ] || said=
                fi
                # end of vm evidence
                evidence="${said%%$'\n'*}"
                if [ -n "$evidence" ]; then
                  echo "held check accepted on merge-pr.sh's VM evidence comment $evidence" | tee -a "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
              fi
              echo "::error::planned checks not run at this head ($why, $UNITS harnesses planned): add the label \`check\` and re-run all jobs"
              echo "planned checks not run at this head ($why, $UNITS harnesses planned): add the label \`check\` and re-run all jobs" \
                >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "checks skipped: $why ($UNITS harnesses planned; the merge queue checks them; add the label \`check\` and re-run all jobs to check them here)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$UNITS" != 0 ]; then
            [ "$CHECK_RESULT" = success ] || { echo "::error::a check failed or did not run"; exit 1; }
            echo "harnesses checked: $UNITS"
          else
            [ "$CHECK_RESULT" = skipped ] || { echo "::error::no harness planned, yet check ran"; exit 1; }
            echo "harnesses checked: $UNITS"
          fi
      # Rule D11: the rekey job's verdict, on a pull request and a merge queue group, the events it runs for (that job
      # says why).  A draft skips it with lint, and the step above already judged the draft: it passes only into a
      # main whose merge queue group, which runs rekey, is still to come.
      - name: keys.checker moved only in an announced re-key window (rule D11)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          REKEY_RESULT: ${{ needs.rekey.result }}
          HOLD: ${{ needs.plan.outputs.hold }}
        run: |
          set -euo pipefail
          [ "$REKEY_RESULT" = success ] && exit 0
          [ "$REKEY_RESULT" = skipped ] && [ "$HOLD" = draft ] && exit 0
          echo "::error::the re-key guard (job rekey, rule D11) did not pass ($REKEY_RESULT): its log says why"
          exit 1
      # The release window (OSSV-122): the release_window job's verdict, on a pull request and a merge queue group,
      # the events it runs for.  It waits for the plan alone, so a draft runs it too, and nothing but success passes.
      - name: no platform change merged while the release window was open
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          RELEASE_WINDOW_RESULT: ${{ needs.release_window.result }}
        run: |
          set -euo pipefail
          [ "$RELEASE_WINDOW_RESULT" = success ] && exit 0
          echo "::error::the release-window rule (job release_window) did not pass ($RELEASE_WINDOW_RESULT): its log says why"
          exit 1
      # Last, with no `if:`: it runs only once every step before it passed, so a failed job still shows as its own
      # failure first.  The plan's hold step read the label from the pull request as it was then (see the header); a
      # push and a merge queue group carry no label, and a push whose jobs queue_run skipped has no plan, so this
      # passes on each of them.
      - name: a pull request with the label do-not-merge does not pass
        env:
          DO_NOT_MERGE: ${{ needs.plan.outputs.do_not_merge }}
        run: |
          if [ "$DO_NOT_MERGE" = true ]; then
            echo "::error::this pull request has the label do-not-merge (a rehearsal or a pipeline test): remove the label, then re-run all jobs of this head's newest run, or push"
            exit 1
          fi

  # The status a main that merges through a merge queue requires, of each pull request into main, each queue group and
  # each push to main.  On a pull request into any other base it is skipped: required is that run's verdict, and a
  # main-gate that failed there for its base alone (on a pull request into another branch, where required passed)
  # made its red mean nothing.  A skipped job reports success, so the skipped job takes another name and leaves its
  # head no main-gate: a pull request made green against another branch and then retargeted at main (which starts no
  # run, see the header) must not carry that green into the merge queue, whose group runs as a release (KIND), where
  # lint's paths rules for a pull request's kind and the check on the base's statements are not applied.  GitHub names
  # a skipped job by its `name:` as written, unevaluated (github.com/orgs/community/discussions/13261), which is not
  # main-gate either.  Both conditions read the event name first: a merge queue group and a push have no pull_request
  # and so no base.ref (github.base_ref is empty on both), and they run main-gate.  GitHub's == ignores case, and the
  # base step does not, so a pull request into a branch named Main still fails here.
  main-gate:
    name: >-
      ${{ (github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'main') && 'main-gate'
      || 'main-gate (skipped: the base is not main)' }}
    needs: [required]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: required passed
        env:
          REQUIRED: ${{ needs.required.result }}
        run: '[ "$REQUIRED" = success ] || { echo "::error::required did not pass"; exit 1; }'
      - name: a pull request's base is main
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: '[ "$BASE" = main ] || { echo "::error::the base is $BASE, not main"; exit 1; }'
