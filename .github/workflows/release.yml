# release.yml: a tag v<release> publishes that release, and a tag
# v<release>-src publishes its source release.
#
# A GitHub release holds at most 1,000 files, so a release's files may be split
# over two GitHub releases: v<release> with the binaries (<project>-bin.tar.zst),
# and v<release>-src with the source assets (<project>-src.tar.zst and
# <project>-src.MANIFEST.tsv) and the build recipe that the release adds.  Each
# record in the facts names the release its file is attached to.  Where nothing
# is attached to v<release>-src, v<release> holds every file.
#
# A draft GitHub release for the tag holds the files the facts attach to it
# (the rows of `./oft fetch --all --list` whose first field is the tag): a
# maintainer opens it, or the enrollment workflow's upload (tools/enroll/upload)
# makes it for a project's archives.  A maintainer pushes the tag on a commit
# of main once the publishing gate has passed that commit.  This workflow publishes it only if
#   - the tag is v<release> or v<release>-src, for the release that
#     release.yaml at the tag describes;
#   - the tagged commit is on main and the publishing gate passed exactly that
#     commit (its check run, below);
#   - the draft holds exactly the files the facts attach to this tag, each
#     with the SHA-256 the facts pin, and still does just before it is
#     published (a GPL or LGPL binary archive never ships without its source
#     archive: `oft lint` refuses such facts);
# then writes the CHANGELOG section as the release notes and publishes.  Each
# of the two tags is checked and published on its own.  A release that adds
# proofs or documents and no binaries (a patch release, docs/versioning.md)
# attaches no file and needs no draft: this workflow creates its v<release>
# when there is none, and it has no v<release>-src.  Once every release the
# facts attach a file to is published, it runs the weekly sweep against the
# files as published.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write   # to publish the tag's release, or create it when it attaches no file: nothing else is written
      checks: read      # to read the publishing gate's check run on the tagged commit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet --require-hashes -r tools/oft/requirements.txt
      - name: the tag is the release release.yaml describes, or its source release
        run: |
          set -euo pipefail
          want="v$(python -c 'import yaml; print(yaml.safe_load(open("release.yaml"))["release"])')"
          [ "$GITHUB_REF_NAME" = "$want" ] || [ "$GITHUB_REF_NAME" = "$want-src" ] || {
            echo "::error::tag $GITHUB_REF_NAME, but release.yaml says $want (or $want-src, its source release)"; exit 1; }
      - name: the tagged commit is on main, and the publishing gate passed exactly it
        env:
          GH_TOKEN: ${{ github.token }}
          # The publishing gate, outside this repository, checks the whole release commit before it is pushed here, and
          # then creates one check run of this name on it, with its own GitHub App.  Only a check run of this name made
          # by this App counts: a check run is bound to the App whose token created it, and any account or workflow with
          # write access can create one of any name (a workflow's token creates it as the github-actions App), so the
          # name alone proves nothing.
          GATE_CHECK: ossv-gate/publish
          GATE_APP_ID: "5447700"
        run: |
          set -euo pipefail
          # The gate's PASS is the evidence, not a run of this repository's workflows: pr.yml's and release-check.yml's
          # runs of a push check what that push changes, and a run can be cancelled or stopped by a runner limit while
          # the commit it would have checked is the one the gate passed.  The gate's newest check run of the name on
          # the commit decides, so the gate can withdraw a PASS by creating another.
          on_main="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)"
          case "$on_main" in
            identical|behind) ;;
            *) echo "::error::$GITHUB_SHA is not on main ($on_main): tag a commit of main"; exit 1 ;;
          esac
          # every check run of that name and App on exactly this commit; the newest (the highest id) decides
          gate="$(gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
                    -f check_name="$GATE_CHECK" -f app_id="$GATE_APP_ID" -f filter=all -f per_page=100 --jq \
                    '.check_runs[] | select(.name == env.GATE_CHECK and (.app.id | tostring) == env.GATE_APP_ID
                                           and .head_sha == env.GITHUB_SHA)
                     | [.id, .status, .conclusion // "none", .output.title // ""] | @tsv' \
                  | LC_ALL=C sort -t $'\t' -k1,1nr | awk 'NR == 1')"
          IFS=$'\t' read -r id status conclusion title <<< "$gate"
          [ "${status:-}" = completed ] && [ "${conclusion:-}" = success ] || {
            echo "::error::the publishing gate has not passed $GITHUB_SHA: its newest $GATE_CHECK check run (App $GATE_APP_ID) is ${id:+$id, }${status:-missing}${conclusion:+ $conclusion}${title:+ ($title)}; run the gate on this commit, then re-run this workflow"; exit 1; }
          echo "the publishing gate passed $GITHUB_SHA: $GATE_CHECK check run $id (App $GATE_APP_ID): $title"
      - name: the facts are well formed and their rendering is current
        run: |
          set -euo pipefail
          ./oft lint --release
          ./oft generate --check
      - name: the draft holds exactly the pinned archives
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # every file the facts pin, in any release; this tag's are those whose release is the tag, with their SHA-256
          ./oft fetch --all --list | awk -v t="$GITHUB_REF_NAME" '$1 == t {print $2, "sha256:" $3}' | LC_ALL=C sort \
            > "$RUNNER_TEMP/want.txt"
          # drafts are listed only to a token that can push, which this job's is
          state="$(gh release list --limit 1000 --json tagName,isDraft --jq '.[] | "\(.tagName)\t\(.isDraft)"' \
                   | awk -F '\t' -v t="$GITHUB_REF_NAME" '$1 == t {print ($2 == "true" ? "draft" : "published")}')"
          case "$state" in
            published) echo "::error::release $GITHUB_REF_NAME is published: published assets are never replaced"; exit 1 ;;
            draft) ;;
            "")
              [ ! -s "$RUNNER_TEMP/want.txt" ] || {
                echo "::error::no draft release $GITHUB_REF_NAME: attach the files the facts pin to a draft first"; exit 1; } ;;
            *) echo "::error::more than one release for $GITHUB_REF_NAME: $state"; exit 1 ;;
          esac
          if [ -n "$state" ]; then
            # each asset's name and the SHA-256 GitHub recorded when it was uploaded
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
              | jq -r --arg t "$GITHUB_REF_NAME" '.[] | select(.tag_name == $t) | .assets[] | "\(.name) \(.digest)"' \
              | LC_ALL=C sort > "$RUNNER_TEMP/have.txt"
            diff "$RUNNER_TEMP/want.txt" "$RUNNER_TEMP/have.txt" || {
              echo "::error::the draft's assets differ from the archives the facts pin (< pinned, > attached)"; exit 1; }
          fi
          echo "exists=$([ -n "$state" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [ ! -s "$RUNNER_TEMP/want.txt" ]; then
            case "$GITHUB_REF_NAME" in
              *-src) echo "::error::the facts attach no file to $GITHUB_REF_NAME: a source release with no files is never published"; exit 1 ;;
            esac
            echo "the facts attach no file to $GITHUB_REF_NAME: it publishes proofs and documents only"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/assets"
          ./oft fetch --release "$GITHUB_REF_NAME" --assets-only --source "$RUNNER_TEMP/assets"
      - name: release notes from CHANGELOG.md, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="${GITHUB_REF_NAME#v}"
          release="${release%-src}"
          awk -v r="## $release " 'index($0, r) == 1 {p = 1; print; next} /^## / {p = 0} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::CHANGELOG.md has no section for $release"; exit 1; }
          if [ "$GITHUB_REF_NAME" = "v$release-src" ]; then
            { printf 'The upstream source trees, their MANIFESTs and the build recipe that release %s adds. Its new binaries are in release v%s, and each project page links the release of every file.\n\n' \
                "$release" "$release"; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/notes-src.md"
            mv "$RUNNER_TEMP/notes-src.md" "$RUNNER_TEMP/notes.md"
          fi
          if [ "${{ steps.draft.outputs.exists }}" = true ]; then
            # the files and their SHA-256 once more, just before publishing: nothing attached or replaced since the check
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
              | jq -r --arg t "$GITHUB_REF_NAME" '.[] | select(.tag_name == $t) | .assets[] | "\(.name) \(.digest)"' \
              | LC_ALL=C sort | diff "$RUNNER_TEMP/want.txt" - || {
                echo "::error::the draft's assets changed after they were checked (< pinned, > attached)"; exit 1; }
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --draft=false
          else
            # a release candidate is a pre-release, as its draft would have been marked, and never the latest
            case "$release" in
              *-rc.*) kind=(--prerelease --latest=false) ;;
              *) kind=() ;;
            esac
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$release" "${kind[@]}" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  # the sweep checks every file the facts pin, in every release they name: it runs once all of those are published
  ready:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      all: ${{ steps.published.outputs.all }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet --require-hashes -r tools/oft/requirements.txt
      - id: published
        name: is every release the facts attach a file to published?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./oft fetch --all --list > "$RUNNER_TEMP/pinned.txt"
          awk '{print $1}' "$RUNNER_TEMP/pinned.txt" | LC_ALL=C sort -u > "$RUNNER_TEMP/releases.txt"
          [ -s "$RUNNER_TEMP/releases.txt" ] || { echo "::error::the facts attach no file to any release"; exit 1; }
          all=true
          while read -r rel; do
            draft="$(gh release view "$rel" --json isDraft --jq .isDraft || echo missing)"
            echo "$rel: isDraft=$draft"
            [ "$draft" = false ] || all=false
          done < "$RUNNER_TEMP/releases.txt"
          echo "all=$all" >> "$GITHUB_OUTPUT"

  sweep:
    needs: ready
    if: needs.ready.outputs.all == 'true'
    permissions:
      contents: read
      packages: read   # weekly.yml pulls the pinned images from ghcr.io; a called workflow gets no more than this
    uses: ./.github/workflows/weekly.yml
    with:
      release: ${{ github.ref_name }}
