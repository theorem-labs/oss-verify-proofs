# ledger.yml: a push to a proofs/ branch.  A proof branch takes pushes and merges, not pull requests, so a finding
# can be added there and deleted or rewritten before any pull request compares two trees; this workflow holds every
# commit of the branch to the findings ledger (oft ledger, tools/oft/README.md).  It is not pr.yml's lint job: a
# proof branch takes over a hundred pushes a day, and the ledger reads commits and trees and a few finding files, in
# seconds.  It judges main..push, not event.before..push: main..push holds every commit the branch's release pull
# request will bring, as that pull request's lint job judges it.  The tools are main's, as a pull request's are its
# base's: a push never brings the rules it is judged by.  The ledger reads only the history the branch has, so a
# forced push, which can drop the commits that had a finding, fails the job.
name: ledger
on:
  push:
    branches: ["proofs/**"]
permissions:
  contents: read   # it pulls no image
concurrency:
  # each push has a run of its own that nothing cancels
  group: ledger-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: a proof branch is never rewritten
        env:
          FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          if [ "$FORCED" = true ]; then
            echo "::error::$GITHUB_REF_NAME was force-pushed: a proof branch is never rewritten, since a rewrite can" \
              "drop the commits that had a finding, which no check then sees"
            exit 1
          fi
      - name: main's tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
          sparse-checkout: tools
      - name: the history main..push, as commits and trees, without file contents
        id: main
        run: |
          set -euo pipefail
          main="$(git rev-parse HEAD)"
          # GitHub at times fails to serve an old tree of main ("bad tree object", then "bad pack header"; seen four
          # times on 2026-11-02, each passing on a re-run), so the fetch is tried 3 times, 30 s then 90 s apart.  A
          # failed try can leave the clone unshallowed, and --unshallow on a complete clone is an error, so each try
          # asks git whether the clone is still shallow.
          for attempt in 1 2 3; do
            unshallow=()
            [ "$(git rev-parse --is-shallow-repository)" = true ] && unshallow=(--unshallow)
            if git fetch --no-tags --filter=blob:none "${unshallow[@]}" origin "$main" "$GITHUB_SHA"; then
              break
            fi
            [ "$attempt" = 3 ] && { echo "::error::the history fetch failed 3 times"; exit 1; }
            echo "::warning::the history fetch failed (attempt $attempt of 3); GitHub's intermittent tree-serving fault of 2026-11-02 (bad tree object) is the known cause; trying again"
            sleep $((attempt == 1 ? 30 : 90))
          done
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "main..push: $(git rev-list --count "$main..$GITHUB_SHA") commit(s)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: the tools' dependencies (PyYAML, idna), hash-pinned, from main
        run: python -m pip install --quiet --require-hashes -r tools/oft/requirements.txt
      - name: every record main..push had is in the push, with the evidence of its anchor
        env:
          MAIN: ${{ steps.main.outputs.main }}
        run: PYTHONPATH=tools python -m oft --root . ledger --base "$MAIN" --tip "$GITHUB_SHA"
