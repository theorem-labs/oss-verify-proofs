flags:
  note: as written in the recipe; a library's own build system adds its flags after these (e.g. CMake Release appends
    -O3 -DNDEBUG), see the pin and recipes.sh
  lines:
  - 'recipe/tools/build-body.sh:58: OFT_NO_BUILTIN_ALLOC="-fno-builtin-malloc -fno-builtin-calloc -fno-builtin-realloc
    -fno-builtin-reallocarray -fno-builtin-free -fno-builtin-aligned_alloc -fno-builtin-posix_memalign -fno-builtin-memalign
    -fno-builtin-valloc -fno-builtin-strdup -fno-builtin-strndup"'
  - 'recipe/tools/build-body.sh:59: BASE_CFLAGS="-march=rv64g -mabi=lp64d -Os -g -ffunction-sections -fdata-sections
    -fno-stack-protector -fno-plt -Wdate-time $OFT_NO_BUILTIN_ALLOC"'
  - 'recipe/tools/build-body.sh:65: SAN=""'
  - 'recipe/tools/build-body.sh:560: SAN="-fsanitize=address"'
  - 'recipe/tools/build-body.sh:577: SAN="-fsanitize=address -fsanitize=undefined -fno-sanitize-recover=all -fsanitize-trap=all
    -fno-sanitize=function"'
  - 'recipe/tools/build-body.sh:586: SAN="-fsanitize=undefined -fno-sanitize-recover=all -fsanitize-trap=all -fno-sanitize=function"'
  - 'recipe/tools/build-body.sh:590: SAN=""'
  - 'recipe/tools/build-body.sh:618: CFLAGS="$BASE_CFLAGS $SAN -fmacro-prefix-map=$LIBROOT/=/work/build/lib/FLAVOUR/"'
  - 'recipe/tools/build-body.sh:431: ''clang --config=/opt/asan-static/musl.cfg'''
  - 'recipe/tools/build-body.sh:441: ''clang++ --config=/opt/asan-static/musl.cfg -stdlib=libc++'''
  - 'recipe/tools/build-body.sh:478: SEALED_CFG=/opt/asan-static/asan-musl-sealed.cfg'
  - 'recipe/tools/build-body.sh:1019: SILENT_LD=""'
  - 'recipe/tools/build-body.sh:1021: SILENT_LD="-Wl,--defsym=__sanitizer_silent_reports=1"'
  - 'recipe/tools/build-body.sh:1027: SILENT_LD=""'
  - 'recipe/tools/build-body.sh:1049: "$CC" $BASE_CFLAGS -static -no-pie -Wl,--gc-sections ${OFT_STRIP--Wl,--strip-all}
    \'
  - 'recipe/tools/build-body.sh:1054: "$CC" $BASE_CFLAGS -static -no-pie -Wl,--gc-sections ${OFT_STRIP--Wl,--strip-all}
    \'
  - 'recipe/targets/json-c-json_object_fuzzer/pin:41: LIB_CFLAGS=""'
licence:
  components:
  - component: json-c
    files: arraylist.c, json_object.c, json_tokener.c, json_util.c, json_visit.c, linkhash.c, printbuf.c, random_seed.c,
      strerror_override.c; harness fuzz/json_object_fuzzer.cc
    licence: MIT
    evidence: 'COPYING:2-20 (Copyright (c) 2009-2012 Eric Haszlakiewicz, MIT) and 24-42 (Copyright (c) 2004, 2005
      Metaparadigm Pte Ltd, MIT) of the repository at the pinned commit; the linked files say "it under the terms
      of the MIT license. See COPYING for details.": arraylist.c:7-8, json_object.c:6-7, json_tokener.c:7-8, json_util.c:7-8,
      json_visit.c:4-5, linkhash.c:8-9, printbuf.c:7-8, random_seed.c:7-8; json_object.c:4 and linkhash.c:6 add
      Hewlett-Packard, json_tokener.c:11-13 and printbuf.c:11-13 add Yahoo! Inc. under the MIT License (LICENSES/json-c-file-copyright-notice.txt);
      strerror_override.c and the harness fuzz/json_object_fuzzer.cc have no licence header, so COPYING covers them
      [inferred]; the project headers in their include closure carry the same MIT line (e.g. json.h.cmakein:4-9,
      json_object.h:4-9); the harness includes LLVM''s <fuzzer/FuzzedDataProvider.h> (fuzz/json_object_fuzzer.cc:1;
      compiler-rt/include/fuzzer/FuzzedDataProvider.h:3-5 at llvmorg-20.1.8: Apache-2.0 WITH LLVM-exception), whose
      inline code is compiled into harness.o (see notes); linkhash.c:68-442 is Bob Jenkins'' public-domain lookup3
      (next row); no patch of patches/series.tsv applies to this target'
    texts:
    - LICENSES/json-c-COPYING
    - LICENSES/json-c-file-copyright-notice.txt
  - component: lookup3 hashlittle (Bob Jenkins), in json-c linkhash.c
    files: linkhash.c:68-442 (hashlittle with its rot/mix/final macros; called by lh_char_hash at linkhash.c:491;
      archive member linkhash.c.o)
    licence: LicenseRef-lookup3-public-domain
    evidence: 'linkhash.c:69 "hashlittle from lookup3.c, by Bob Jenkins, May 2006, Public Domain."; linkhash.c:77-83
      "You can use this free for any purpose.  It''s in the public domain.  It has no warranty."; linkhash.c:246-247
      "You may use this code any way you wish, private, educational, or commercial.  It''s free." (LICENSES/json-c-lookup3-notice.txt):
      public domain, no conditions; in the binaries: hashlittle''s initial state 0xdeadbeef + length + initval (linkhash.c:265:
      lui 0xdeadc, addi -0x111, then the alignment test andi ..., 3 of linkhash.c:268) occurs once in each of the
      four and in none of the 12 binaries of cjson, pupnp and varnish (negative control; disassembly)'
    texts:
    - LICENSES/json-c-lookup3-notice.txt
  - component: musl libc (static)
    files: '-'
    licence: MIT
    evidence: musl COPYRIGHT; linked in every build
    texts:
    - LICENSES/musl-COPYRIGHT
  - component: 'LLVM runtimes: compiler-rt builtins; in ASan builds the sanitizer runtime and libunwind; libc++/libc++abi
      in C++ programs'
    files: '-'
    licence: Apache-2.0 WITH LLVM-exception
    evidence: LICENSE.TXT of compiler-rt, libunwind, libc++ and libc++abi at llvmorg-20.1.8 (87f0227c)
    texts:
    - LICENSES/llvm-compiler-rt-LICENSE.TXT
    - LICENSES/llvm-libunwind-LICENSE.TXT
    - LICENSES/llvm-libcxx-LICENSE.TXT
    - LICENSES/llvm-libcxxabi-LICENSE.TXT
  - component: static-asan patches compiled into the ASan runtime and musl
    files: '-'
    licence: MIT
    evidence: LICENSE of theorem-labs/static-asan at b0506135 (MIT for Theorem Labs work; the LLVM and musl code
      it patches keeps its own licence)
    texts:
    - LICENSES/static-asan-LICENSE
  - component: Theorem Labs file-input driver and build recipe (recipe/src/, recipe/targets/*/plugin.c)
    files: '-'
    licence: MIT
    evidence: LICENSE of this repository (MIT, Theorem Labs, PBC)
    texts:
    - LICENSES/oss-fuzz-theorems-LICENSE
  source_bundle: not required by the licences; the upstream source is `json-c-src.tar.zst` of release `v2026.10.0-src`
