proofs:
  origin: final-anthropic-opensource-formal-verification-proofs-package-2026-10-21 (sha256 4c6c152f61ce538e439b9d2adef439f4dbe1a2d446767d84ac7c3946d7c6687a),
    libraries/json-c/proofs/submission-1, libraries/openssl-b/proofs/submission-1 and libraries/pupnp/proofs/submission-1
  licence: Apache-2.0 OR MIT
  texts:
  - LICENSES/anthropic-proofs-LICENSE
  - LICENSES/anthropic-proofs-LICENSE-MIT
  - LICENSES/anthropic-proofs-NOTICE
  texts_location: the repository's top directory
  modified: each changed file carries one line under its licence header saying so
  written_here:
