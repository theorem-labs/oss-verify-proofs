upstream:
  name: jsoncons
  repository: https://github.com/danielaparker/jsoncons
  commit: af497a1c1ea9043f4ad8d799617b7d00d6676153
  licence: BSL-1.0
  licence_evidence: 'header-only library: the link record of this build shows only the harness object from the library
    build; LICENSE:1-4 of the repository (Daniel Parker, Boost Software License 1.0) and the headers'' own notices
    (e.g. include/jsoncons_ext/ubjson/ubjson.hpp:1-3); the harness has no licence header, so the repository licence
    covers it [inferred]; include/jsoncons/utility/unicode_traits.hpp (BSL-1.0, lines 1-3) includes code derived
    from Unicode, Inc.''s ConvertUTF, which Unicode grants the right to use freely in products (lines 7-14; LICENSES/jsoncons-unicode-ConvertUTF-notice.txt);
    its trailing_bytes_for_utf8 table (line 174) occurs in all four binaries; detail/grisu3.hpp and the RFC 7049
    decode_half of config/compiler_support.hpp are not in these binaries (grisu3''s tables are absent; no such decoder
    in the disassembly)'
  licence_in_release_records: BSL-1.0
oss_fuzz:
  repository: https://github.com/google/oss-fuzz
  commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
  path: projects/jsoncons
harness:
  origin: upstream
  source:
    files:
    - source/fuzz_ubjson_parser_max.cpp
    from:
      repository: https://github.com/danielaparker/jsoncons
      commit: af497a1c1ea9043f4ad8d799617b7d00d6676153
      path: fuzzers/fuzz_ubjson_parser_max.cpp
    modified: false
    licence: BSL-1.0
  modifications:
  - Linked against jsoncons at commit af497a1c.
  - In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends
    only on its input.
  - A small driver reads the input file, calls the harness one to four times and prints each return value.
