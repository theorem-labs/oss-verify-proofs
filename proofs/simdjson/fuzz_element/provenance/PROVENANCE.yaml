proofs:
  origin: final-anthropic-opensource-formal-verification-proofs-package-2026-10-21 (sha256 4c6c152f61ce538e439b9d2adef439f4dbe1a2d446767d84ac7c3946d7c6687a),
    libraries/simdjson/proofs/submission-7, libraries/jsoncons/proofs/submission-7 and libraries/openssl-b/proofs/submission-1
  licence: Apache-2.0 OR MIT
  texts:
  - LICENSES/anthropic-proofs-LICENSE
  - LICENSES/anthropic-proofs-LICENSE-MIT
  - LICENSES/anthropic-proofs-NOTICE
  texts_location: the repository's top directory
  modified: each changed file carries one line under its licence header saying so
  written_here:
  - asan_agrees
  - ubsan_agrees
flags:
  note: as written in the recipe; a library's own build system adds its flags after these (e.g. CMake Release appends
    -O3 -DNDEBUG), see the pin and recipes.sh
  lines:
  - 'recipe/tools/build-body.sh:58: OFT_NO_BUILTIN_ALLOC="-fno-builtin-malloc -fno-builtin-calloc -fno-builtin-realloc
    -fno-builtin-reallocarray -fno-builtin-free -fno-builtin-aligned_alloc -fno-builtin-posix_memalign -fno-builtin-memalign
    -fno-builtin-valloc -fno-builtin-strdup -fno-builtin-strndup"'
  - 'recipe/tools/build-body.sh:59: BASE_CFLAGS="-march=rv64g -mabi=lp64d -Os -g -ffunction-sections -fdata-sections
    -fno-stack-protector -fno-plt -Wdate-time $OFT_NO_BUILTIN_ALLOC"'
  - 'recipe/tools/build-body.sh:65: SAN=""'
  - 'recipe/tools/build-body.sh:560: SAN="-fsanitize=address"'
  - 'recipe/tools/build-body.sh:577: SAN="-fsanitize=address -fsanitize=undefined -fno-sanitize-recover=all -fsanitize-trap=all
    -fno-sanitize=function"'
  - 'recipe/tools/build-body.sh:586: SAN="-fsanitize=undefined -fno-sanitize-recover=all -fsanitize-trap=all -fno-sanitize=function"'
  - 'recipe/tools/build-body.sh:590: SAN=""'
  - 'recipe/tools/build-body.sh:618: CFLAGS="$BASE_CFLAGS $SAN -fmacro-prefix-map=$LIBROOT/=/work/build/lib/FLAVOUR/"'
  - 'recipe/tools/build-body.sh:431: ''clang --config=/opt/asan-static/musl.cfg'''
  - 'recipe/tools/build-body.sh:441: ''clang++ --config=/opt/asan-static/musl.cfg -stdlib=libc++'''
  - 'recipe/tools/build-body.sh:478: SEALED_CFG=/opt/asan-static/asan-musl-sealed.cfg'
  - 'recipe/tools/build-body.sh:1019: SILENT_LD=""'
  - 'recipe/tools/build-body.sh:1021: SILENT_LD="-Wl,--defsym=__sanitizer_silent_reports=1"'
  - 'recipe/tools/build-body.sh:1027: SILENT_LD=""'
  - 'recipe/tools/build-body.sh:1049: "$CC" $BASE_CFLAGS -static -no-pie -Wl,--gc-sections ${OFT_STRIP--Wl,--strip-all}
    \'
  - 'recipe/tools/build-body.sh:1054: "$CC" $BASE_CFLAGS -static -no-pie -Wl,--gc-sections ${OFT_STRIP--Wl,--strip-all}
    \'
  - 'recipe/targets/simdjson-fuzz_element/pin:41: LIB_CFLAGS=""'
licence:
  components:
  - component: simdjson
    files: 'src/simdjson.cpp (singleheader/simdjson.cpp shares the name but is not built: CMakeLists.txt:204-206,
      501-503); src/simdjson.cpp includes src/to_chars.cpp, src/from_chars.cpp, src/internal/{error,jsoncharutils,numberparsing}_tables.cpp,
      src/implementation.cpp and src/fallback.cpp (the only kernel built for riscv64); headers include/simdjson.h
      and include/simdjson/ (also compiled into the harness object); harness fuzz/fuzz_element.cpp, fuzz/FuzzUtils.h'
    licence: Apache-2.0 OR MIT
    evidence: 'LICENSE:1-3 (Apache License 2.0) with LICENSE:189 "Copyright 2018-2025 The simdjson authors", and
      LICENSE-MIT:1-18 (MIT, same holder); README.md:265 "This code is made available under the Apache License 2.0
      as well as under the MIT License. As a user, you can pick the license you prefer." The archive member simdjson.cpp.o
      is src/simdjson.cpp: all 40 build logs compile only CMakeFiles/simdjson.dir/src/simdjson.cpp.o and merge one
      archive (CMakeLists.txt:204-206; singleheader/ is added only in developer mode, :501-503 and :534-536). Only
      the fallback kernel is compiled: the recipe pins -march=rv64g (recipe tools/build-body.sh:59, shim :186 and
      :351), so include/simdjson/portability.h:46-60 sets no RVV macro and implementation_detection.h:131-143 enables
      FALLBACK alone (src/simdjson.cpp:23-49); in all 40 binaries the fallback implementation''s strings (include/simdjson/fallback/implementation.h:18-19)
      and typeinfo occur and the rvv_vls description does not. The compiled sources carry no other licence notices
      except the third-party code in the rows below. The harness (fuzz/fuzz_element.cpp, 134 lines) and fuzz/FuzzUtils.h
      have no licence header, so the repository licence covers them [inferred]'
    texts:
    - LICENSES/simdjson-LICENSE
    - LICENSES/simdjson-LICENSE-MIT
  - component: fast_float v8.2.10 (vendored in simdjson include/simdjson/internal/fast_float.h)
    files: include/simdjson/internal/fast_float.h (header-only; included by src/from_chars.cpp:6, compiled through
      src/simdjson.cpp:8); routines adapted from fast_float in include/simdjson/generic/numberparsing.h:315-492
      (compute_float_32) and :593-603 (is_made_of_four_digits_fast)
    licence: Apache-2.0 OR BSL-1.0 OR MIT
    evidence: 'fast_float.h:1-5 "Vendored from fast_float v8.2.10 ... Licensed under Apache-2.0 OR MIT OR BSL-1.0,
      at your option" and its MIT, Apache and Boost notices at lines 38-111 (LICENSES/simdjson-fast_float-notice.txt);
      tools/vendor_fast_float.sh:44-47 renames every fast_float identifier, which also turned the holder "The fast_float
      authors" into "The simdjson_fast_float authors" (fast_float.h:46,74), so fast_float''s own licence files are
      added (LICENSES/fast_float-LICENSE-*, byte-identical to LICENSE-APACHE, LICENSE-BOOST and LICENSE-MIT of fast_float
      v8.2.10, 34164f54); numberparsing.h:318-320 and 593-596 mark two routines as adapted from fast_float. In the
      binaries: fast_float''s bigint table large_power_of_5 (fast_float.h:3894-3896, 40 bytes) occurs once in each
      of the four, and the 128-bit power-of-five table occurs twice in each (simdjson''s own, src/internal/numberparsing_tables.cpp:26,
      and fast_float''s, fast_float.h:2606; the values are equal), with simdjson''s fallback strings as the positive
      control'
    texts:
    - LICENSES/simdjson-fast_float-notice.txt
    - LICENSES/fast_float-LICENSE-APACHE
    - LICENSES/fast_float-LICENSE-BOOST
    - LICENSES/fast_float-LICENSE-MIT
  - component: UTF-8 validator based on code from Google Fuchsia, in simdjson src/fallback.cpp
    files: src/fallback.cpp:422-483 (fallback::implementation::validate_utf8; compiled through src/simdjson.cpp:48)
    licence: Apache-2.0
    evidence: 'src/fallback.cpp:422 "// credit: based on code from Google Fuchsia (Apache Licensed)" (LICENSES/simdjson-fallback-utf8-Fuchsia-notice.txt;
      the Apache License 2.0 text is LICENSES/simdjson-LICENSE); the file carries no further notice and the Fuchsia
      original was not located, so the licence is the one simdjson states [unsettled, see notes]. In the binaries:
      slot 5 of simdjson::fallback::implementation''s vtable (include/simdjson/implementation.h:56-128, validate_utf8
      last) points in each of the four to a function that loads the 16-byte ASCII mask 0x8080808080808080 and uses
      the lead-byte masks 0xe0, 0xf0, 0xf8 against 0xc0, 0xe0, 0xf0, the continuation test 0xc0/0x80 and the four-byte
      range bound 0x10000..0x10ffff (fallback.cpp:429-475)'
    texts:
    - LICENSES/simdjson-fallback-utf8-Fuchsia-notice.txt
  - component: NulStreambuf and NulOStream from Stack Overflow answer 8244052 (James Kanze), in simdjson fuzz/NullBuffer.h
    files: fuzz/NullBuffer.h:6-21 (header-only; compiled into the harness object)
    licence: CC-BY-SA-3.0
    evidence: 'fuzz_element.cpp:7 includes NullBuffer.h; NullBuffer.h:6 names its source, Stack Overflow answer
      8244052 (stackoverflow.com/a/8244052); the Stack Exchange API (api.stackexchange.com/2.3/answers/8244052?site=stackoverflow)
      gives the answer''s author James Kanze, posted 2011-11-23, last edited 2013-07-18, content_license "CC BY-SA
      3.0"; lines 7-21 are the answer''s two classes with layout changes, `override final`, `final` and a non-const
      rdbuf() (LICENSES/simdjson-NullBuffer-StackOverflow-notice.txt, with the CC BY-SA 3.0 legal code). In the
      binaries: the typeinfo names 12NulStreambuf and 10NulOStream occur once in each of the four, and in none of
      the binaries of the six harnesses that do not include NullBuffer.h'
    texts:
    - LICENSES/simdjson-NullBuffer-StackOverflow-notice.txt
  - component: musl libc (static)
    files: '-'
    licence: MIT
    evidence: musl COPYRIGHT; linked in every build
    texts:
    - LICENSES/musl-COPYRIGHT
  - component: 'LLVM runtimes: compiler-rt builtins; in ASan builds the sanitizer runtime and libunwind; libc++/libc++abi
      in C++ programs'
    files: '-'
    licence: Apache-2.0 WITH LLVM-exception
    evidence: LICENSE.TXT of compiler-rt, libunwind, libc++ and libc++abi at llvmorg-20.1.8 (87f0227c)
    texts:
    - LICENSES/llvm-compiler-rt-LICENSE.TXT
    - LICENSES/llvm-libunwind-LICENSE.TXT
    - LICENSES/llvm-libcxx-LICENSE.TXT
    - LICENSES/llvm-libcxxabi-LICENSE.TXT
  - component: static-asan patches compiled into the ASan runtime and musl
    files: '-'
    licence: MIT
    evidence: LICENSE of theorem-labs/static-asan at b0506135 (MIT for Theorem Labs work; the LLVM and musl code
      it patches keeps its own licence)
    texts:
    - LICENSES/static-asan-LICENSE
  - component: Theorem Labs file-input driver and build recipe (recipe/src/, recipe/targets/*/plugin.c)
    files: '-'
    licence: MIT
    evidence: LICENSE of this repository (MIT, Theorem Labs, PBC)
    texts:
    - LICENSES/oss-fuzz-theorems-LICENSE
  source_bundle: not required by the licences; the upstream source is `simdjson-src.tar.zst` of release `v2026.10.0-src`
