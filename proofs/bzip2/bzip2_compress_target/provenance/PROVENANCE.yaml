schema: oss-verify-proofs build record v1
entry_point:
  project: bzip2
  harness: bzip2_compress_target
  function: LLVMFuzzerTestOneInput
  records:
  - projects/bzip2/project.yaml
  - projects/bzip2/bzip2_compress_target/harness.yaml
release:
  repository: https://github.com/theorem-labs/oss-verify-proofs
  binaries_release: v2026.10.0
  sources_release: v2026.10.0-src
upstream:
  name: bzip2
  repository: https://sourceware.org/git/bzip2
  commit: f5dfc96063fef2d9c5446d0733867d899ef9b942
  licence: bzip2-1.0.6
  licence_evidence: 'file headers of the 7 linked files blocksort.c, bzlib.c, compress.c, crctable.c, decompress.c,
    huffman.c and randtable.c and of the headers they include (bzlib.h, bzlib_private.h), lines 7-19 of each: "bzip2/libbzip2
    version 1.0.8 of 13 July 2019, Copyright (C) 1996-2019 Julian Seward ... released under the terms of the license
    contained in the file LICENSE" (e.g. blocksort.c:11-18); LICENSE:4-40 of the repository (copyright (C) 1996-2019
    Julian R Seward, four conditions: the bzip2-1.0.6 licence)'
  licence_in_release_records: bzip2-1.0.6
oss_fuzz:
  repository: https://github.com/google/oss-fuzz
  commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
  path: projects/bzip2
harness:
  origin: oss-fuzz
  source:
    files:
    - source/bzip2_compress_target.c
    from:
      repository: https://github.com/google/oss-fuzz
      commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
      path: projects/bzip2/bzip2_compress_target.c
    modified: false
    licence: Apache-2.0
  modifications:
  - Linked against bzip2 at commit f5dfc960.
  - In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends
    only on its input.
  - A small driver reads the input file, calls the harness one to four times and prints each return value.
recipe:
  asset:
    release: v2026.10.0-src
    file: recipe.tar.zst
    bytes: 938459
    sha256: 0339bf3221b15cd39513d46abe99062bac9cce874ed7ba5947753f75b6219ae5
  target: bzip2-bzip2_compress_target
  overlay: null
  files: 'recipe/ (recipe/MANIFEST.tsv: every file with its sha256 in recipe.tar.zst; rows of kind upstream are
    laid down from the -src asset; recipe/UPSTREAM-CARRIED.tsv gives the origin and licence of upstream text in
    files of kind ours+upstream)'
  patches: []
  build_system: custom
  how_to_rebuild: 'as docs/reproducing.md: with recipe/ as /work, unpack the project''s -src asset where its MANIFEST
    says, apply recipe/series.tsv in order, and run recipe/tools/build-body.sh in the builder image, with the environment
    of recipe/tools/build-env.tsv and the network off'
toolchain:
  clang: 20.1.8
  builder_image: ghcr.io/theorem-labs/oss-fuzz-theorems-toolchain@sha256:6a6b4816865c7ec61801ae0fcab6d9c81a599ffcb20616576a9c668abd8b0a7b
  images:
  - ghcr.io/theorem-labs/oss-fuzz-theorems-toolchain@sha256:6a6b4816865c7ec61801ae0fcab6d9c81a599ffcb20616576a9c668abd8b0a7b
  - ghcr.io/theorem-labs/oss-fuzz-theorems-toolchain@sha256:c7c5abdc2676e121ca7532b553a83148b384001a553b6ffea63b1911848fd711
  static_asan:
    repository: https://github.com/theorem-labs/static-asan
    commit: b05061352064fa2be1813ac5429149f3de5f057d
    note: 'the published source of the compiler image''s static AddressSanitizer: its toolchain/ and patches/ are
      those the image was built from, with comments and patch descriptions edited for publication (toolchain-src.tar.zst
      holds this commit). Building it gives the image''s libclang_rt.builtins.a and musl libc.a byte for byte; its
      libclang_rt.asan.a and asan_cxx.a differ from the image''s only in DWARF line tables, which --strip-all removes
      from the binaries'
    image_runtime_md5:
      libclang_rt.asan.a: 91ba024da5ddacd96dc1c7588e5763b3
      libclang_rt.asan_cxx.a: 2c6e776abd494934481b3f47ff030052
      libclang_rt.builtins.a: 1f3d379aa7d4de2dcf11254b8f493a29
      libc.a: 485eb64c0b7397bfea554a9cdf8e352c
