upstream:
  name: zstd
  repository: https://github.com/facebook/zstd
  commit: 82d322c4973d9e2968d94047a40892bc6d9a9bdf
  licence: BSD-3-Clause OR GPL-2.0-only
  licence_evidence: 'Every file whose objects the link record of this build shows carries the zstd header ''This
    source code is licensed under both the BSD-style license (found in the LICENSE file ...) and the GPLv2 (found
    in the COPYING file ...). You may select, at your option, one of the above-listed licenses'': lib/common/entropy_common.c:3,9-12,
    lib/common/fse_decompress.c:3,9-12, lib/decompress/huf_decompress.c:4,9-12, lib/common/xxhash.c:3,5-8, lib/common/zstd_common.c:2,5-8,
    lib/decompress/zstd_ddict.c:2,5-8, lib/decompress/zstd_decompress.c:2,5-8, lib/decompress/zstd_decompress_block.c:2,5-8;
    the harness siblings tests/fuzz/fuzz_data_producer.c:2,5-8 and tests/fuzz/fuzz_helpers.c:2,5-8 (recipes.sh oft_build_harness:2068-2095
    compiles each .c beside the harness that defines neither LLVMFuzzerTestOneInput nor main into lib/liboft.a as
    oftsib-<name>.o; the link record takes these two); harness tests/fuzz/simple_decompress.c:2,5-8. Every repository
    file these sources include (closure of quoted #includes, ignoring #if: 42 files) carries the same header. LICENSE:1-30
    is the BSD licence for Zstandard (Copyright Meta Platforms, Inc. and affiliates, line 5; the three conditions
    at lines 10-19 are BSD-3-Clause); COPYING:1-2 is the GNU General Public License version 2; the headers offer
    ''the GPLv2'' with no later-version option, so GPL-2.0-only [inferred]; README.md:238 ''Zstandard is dual-licensed
    under BSD OR GPLv2''; xxhash.c instantiates lib/common/xxhash.h (xxhash.c:11-18), whose header (xxhash.h:4,6-9)
    is the same dual licence; its code is in all four binaries (the XXH64 primes)'
  licence_in_release_records: NOASSERTION
oss_fuzz:
  repository: https://github.com/google/oss-fuzz
  commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
  path: projects/zstd
harness:
  origin: upstream
  source:
    files:
    - source/simple_decompress.c
    from:
      repository: https://github.com/facebook/zstd
      commit: 82d322c4973d9e2968d94047a40892bc6d9a9bdf
      path: tests/fuzz/simple_decompress.c
    modified: false
    licence: BSD-3-Clause OR GPL-2.0-only
    licence_evidence: 'header of tests/fuzz/simple_decompress.c:1-9: copyright at line 2; lines 5-8 license it under
      both the BSD-style licence (LICENSE) and the GPLv2 (COPYING), at the user''s option (GPL version 2 only [inferred])'
    licence_in_release_records: NOASSERTION
  modifications:
  - Linked against zstd at commit 82d322c4.
  - In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends
    only on its input.
  - A small driver reads the input file, calls the harness one to four times and prints each return value.
recipe:
  asset:
    release: v2026.10.0-src
    file: recipe.tar.zst
    bytes: 938459
    sha256: 0339bf3221b15cd39513d46abe99062bac9cce874ed7ba5947753f75b6219ae5
  target: zstd-simple_decompress
  overlay: null
  files: 'recipe/ (recipe/MANIFEST.tsv: every file with its sha256 in recipe.tar.zst; rows of kind upstream are
    laid down from the -src asset; recipe/UPSTREAM-CARRIED.tsv gives the origin and licence of upstream text in
    files of kind ours+upstream)'
  patches: []
  build_system: cmake
  how_to_rebuild: 'as docs/reproducing.md: with recipe/ as /work, unpack the project''s -src asset where its MANIFEST
    says, apply recipe/series.tsv in order, and run recipe/tools/build-body.sh in the builder image, with the environment
    of recipe/tools/build-env.tsv and the network off'
toolchain:
  clang: 20.1.8
  builder_image: ghcr.io/theorem-labs/oss-fuzz-theorems-toolchain@sha256:6a6b4816865c7ec61801ae0fcab6d9c81a599ffcb20616576a9c668abd8b0a7b
  images:
  - ghcr.io/theorem-labs/oss-fuzz-theorems-toolchain@sha256:6a6b4816865c7ec61801ae0fcab6d9c81a599ffcb20616576a9c668abd8b0a7b
  - ghcr.io/theorem-labs/oss-fuzz-theorems-toolchain@sha256:c7c5abdc2676e121ca7532b553a83148b384001a553b6ffea63b1911848fd711
  static_asan:
    repository: https://github.com/theorem-labs/static-asan
    commit: b05061352064fa2be1813ac5429149f3de5f057d
    note: 'the published source of the compiler image''s static AddressSanitizer: its toolchain/ and patches/ are
      those the image was built from, with comments and patch descriptions edited for publication (toolchain-src.tar.zst
      holds this commit). Building it gives the image''s libclang_rt.builtins.a and musl libc.a byte for byte; its
      libclang_rt.asan.a and asan_cxx.a differ from the image''s only in DWARF line tables, which --strip-all removes
      from the binaries'
    image_runtime_md5:
      libclang_rt.asan.a: 91ba024da5ddacd96dc1c7588e5763b3
      libclang_rt.asan_cxx.a: 2c6e776abd494934481b3f47ff030052
      libclang_rt.builtins.a: 1f3d379aa7d4de2dcf11254b8f493a29
      libc.a: 485eb64c0b7397bfea554a9cdf8e352c
