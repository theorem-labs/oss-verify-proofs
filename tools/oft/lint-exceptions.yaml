# Reviewed occurrences that are correct where they are: a `private-data`
# finding inside an upstream source copy, such as a host path in its authors'
# comments, or inside a build record's copy of the port's project.yaml, or an
# e-mail address in another file of that record's copy of the port's project
# files (port/projects/<project>/), such as its author's copyright line, or a
# key or token under dev/stream/, which the rule still reads there (lint.py,
# internal_only), such as the stand-in in a test of the stream's own secret
# scanner.
# Each entry: {path, rule, key, count, reason}; the key is the one the finding
# names.  An entry that clears fewer occurrences than its count is itself a
# finding.  A `proofs` entry also names the line and the exact message, its key
# is the notation's string literal, and its count is 1.  No entry clears a
# finding of a file's licence lines.
# A `licence-pending` entry, {unit, rule, due, series, reason}, lists a fuzz
# target whose licence lines its own series applies: lint reports the unit's
# licence findings as pending and does not fail on them.  Its series is the
# number of that series' pull request, or `pending`.  The series removes the
# entry: an entry is a finding when its unit has Rocq files and no licence
# finding left; it may wait for a unit whose proofs have not come yet.  After
# its due date it fails a pull request that touches its unit or adds or
# changes the entry, and a lint with no change to judge, and warns any other
# pull request; deleting another entry trips none.  A pull
# request that changes proof files adds no entry, a pull request of the tools
# adds one and its review judges it, and a release carries none.
schema: oss-fuzz-theorems/lint-exceptions/1
