# Reviewed occurrences that are correct where they are: a `private-data`
# finding inside an upstream source copy, such as a host path in its authors'
# comments, or inside a build record's copy of the port's project.yaml, or an
# e-mail address in another file of that record's copy of the port's project
# files (port/projects/<project>/), such as its author's copyright line.
# Each entry: {path, rule, key, count, reason}; the key is the one the finding
# names.  An entry that clears fewer occurrences than its count is itself a
# finding.  A `proofs` entry also names the line and the exact message, its key
# is the notation's string literal, and its count is 1.
schema: oss-fuzz-theorems/lint-exceptions/1
exceptions:
  - path: projects/xmlsec/xmlsec_enc_fuzzer/source/xmlsec_enc_target.c
    rule: private-data
    key: 8bcac7908eb95041
    count: 1
    reason: >-
      xmlsec's own fuzz harness (apps/oss-fuzz/xmlsec_enc_target.c at e4b8614f,
      git blob 05ce8219) embeds the public RSA test key of xmlsec's test suite
      (tests/merlin-xmlenc-five/rsapriv.pem), as its comment says.
  - path: projects/perfetto/end_to_end_shared_memory_fuzzer/source/end_to_end_shared_memory_fuzzer.cc
    rule: private-data
    key: b459ea2c66e1747d
    count: 1
    reason: >-
      perfetto's own fuzz harness (test/end_to_end_shared_memory_fuzzer.cc at
      40b52992, git blob fa2b5e90) names the Android device directory where its
      test daemons create their socket, under an Android-only #if.
  - path: proofs/jsoncons/fuzz_msgpack_encoder/lib/LeanFeed2.v
    rule: proofs
    line: 4
    message: >-
      a notation token with a '"', or a '(' after anything but '.', '`' or ':',
      is not allowed in a proof
    key: "\"'LF2CBN(' t ')'\""
    count: 1
    reason: >-
      Released in v2026.10.1. Every use of LF2CBN( in this library is followed
      by a space and an identifier, and git grep 'LF2CBN(\*' finds nothing, so
      no comment opener and no hidden command can form.
