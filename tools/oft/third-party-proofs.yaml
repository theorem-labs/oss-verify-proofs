# Third-party proof files: files of a fuzz target's proofs folder that come from another project's proofs and keep
# that project's licence (docs/adding-a-proof.md, requirement 7, case 3).  `oft lint` (tools/oft/lint.py,
# load_third_party) accepts a proof file whose SPDX-License-Identifier line is LGPL-2.1-or-later only when its path is
# a row here and the SHA-256 of its bytes is the row's, and it refuses a row's file whose bytes are not the row's.  A
# row may come before its file: a row whose file the tree does not hold publishes nothing.  The lines of the upstream
# author's notice, which name the author's address, are the one part of a row's file that the private-data rule does
# not read, for any of its shapes; the row names them by number, and the pinned bytes fix what they hold.  Only lint.py
# reads this file (tools/oft/keys.py, NOT_THE_CHECKER).  A maintainer adds a row, and review judges it; a contributor's
# pull request changes nothing here.
#
# Each row has the form tools/oft/schemas/third-party-proofs.yaml defines.  What that schema cannot say, lint.py
# (load_third_party) checks: the table is one mapping whose one key, `files`, is the list of rows; a row's path is a
# Rocq file of a fuzz target's proofs folder (lint.proof_rocq); its notice's first line is not after its last; and no
# two rows name one path, in either layout.
#
# coq-community/huffman: the 18 files of the Huffman library under each of three proof folders of
# zlib/compress_fuzzer.  Its licence file, LICENSES/coq-community-huffman-LICENSE, comes into the tree with the files;
# lint pins its bytes (PINNED_VERBATIM).
