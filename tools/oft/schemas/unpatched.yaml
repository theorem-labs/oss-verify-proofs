# projects/<project>/unpatched.yaml (findings/<project>/unpatched.yaml in the old layout): the binaries a project's
# findings run on, built without their patches.  One archive, <project>-unpatched-bin.tar.zst on the internal release
# findings-<project>, pinned by SHA-256, and every file in it pinned again, as project.yaml and harness.yaml pin the
# published binaries.  `oft fetch --findings` unpacks it into projects/<project>/unpatched-bin/<harness>/.
tag: oss-fuzz-theorems/unpatched/1
root: {type: ref, name: unpatched}
defs:
  file:
    type: object
    fields:
      file: {type: str, pattern: '^[A-Za-z0-9._+-]+\.(plain|ubsan|asan|asan-ubsan)$'}
      bytes: {type: int, min: 1}
      sha256: {type: sha256}
  unpatched:
    type: object
    fields:
      schema: {type: const, value: oss-fuzz-theorems/unpatched/1}
      asset:
        type: object
        fields:
          release: {type: asset-release-tag}
          file: {type: str, pattern: '^[a-z0-9][a-z0-9_-]*-unpatched-bin\.tar\.zst$'}
          bytes: {type: int, min: 1}
          sha256: {type: sha256}
      harnesses:
        type: map
        keys: harness-name
        values:
          type: map
          keys: build-name
          values: {type: ref, name: file}
