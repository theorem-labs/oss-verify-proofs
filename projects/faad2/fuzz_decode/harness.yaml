schema: oss-fuzz-theorems/harness/1
project: faad2
harness: fuzz_decode
rocq: OSSVerify.faad2.fuzz_decode
origin: upstream
summary: Splits the input into a fuzzed NeAACDecConfiguration, flags and three parts; NeAACDecInit or
  Init2 on part1, optional DRM init and post-seek resets, NeAACDecDecode on part2 and Decode or Decode2
  on part3; frame info and PCM output are discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_decode.c
  from:
    repository: https://github.com/knik0/faad2
    commit: 6918ebb51b8f7e86278da15884bd7114e4b9661e
    path: fuzz/fuzz_decode.c
  modified: false
  licence: GPL-2.0-or-later
library:
  repository: https://github.com/knik0/faad2
  commit: 6918ebb51b8f7e86278da15884bd7114e4b9661e
  version: 2.11.3
  licence: GPL-2.0-or-later
modifications:
- Linked against faad2 2.11.3 at commit 6918ebb5.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
