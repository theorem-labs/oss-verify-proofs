project: boost-json
harness: fuzz_parse
rocq: OSSVerify.boost_json.fuzz_parse
origin: upstream
summary: boost::json::parse(sv, ec). Returns jv.is_number(), which the entry point discards; catch(...).
entry: LLVMFuzzerTestOneInput
source:
  files: []
  modified: true
  licence: NOASSERTION
