checks:
- kind: invariant
  strength: partial
  stops_with: return-only
  live: unknown
  where: source/fuzz_rng.c:128
  what: After each RLE, the running offset plus the entry length reported by libdwarf must not pass the
    context's end offset; if it does the harness returns DW_DLV_ERROR (1). Checks only the reported length
    against the bound, not the decoded values.
