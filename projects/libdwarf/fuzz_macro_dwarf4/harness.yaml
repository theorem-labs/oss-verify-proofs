harness: fuzz_macro_dwarf4
rocq: OSSVerify.libdwarf.fuzz_macro_dwarf4
origin: upstream
summary: Walks DWARF4 .debug_macinfo with dwarf_get_macro_details (limit 500000) until it stops returning
  OK.
entry: LLVMFuzzerTestOneInput
