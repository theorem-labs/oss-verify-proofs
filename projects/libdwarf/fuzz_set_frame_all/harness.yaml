schema: oss-fuzz-theorems/harness/1
project: libdwarf
harness: fuzz_set_frame_all
rocq: OSSVerify.libdwarf.fuzz_set_frame_all
origin: upstream
summary: 'For each of 5 frame-rule setters x {SHRT_MIN, SHRT_MAX, 0}: reads .debug_frame and .eh_frame,
  every CIE/FDE, selected register rules, the full register table and expanded frame instructions, printing
  everything. The ''Compiler or libdwarf botch'' and ''Internal error in libdwarf'' lines are printf only.'
entry: LLVMFuzzerTestOneInput
