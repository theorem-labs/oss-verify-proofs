schema: oss-fuzz-theorems/harness/1
project: libxls
harness: fuzz_xls
rocq: OSSVerify.libxls.fuzz_xls
origin: upstream
summary: xls_open_buffer, then xls_getWorkSheet + xls_parseWorkSheet + xls_close_WS for every sheet, xls_close_WB;
  parsed cells never inspected.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_xls.c
  from:
    repository: https://github.com/libxls/libxls
    commit: 881f6ec3dabb017af878949a6ed7167613bd7a69
    path: fuzz/fuzz_xls.c
  modified: false
  licence: BSD-2-Clause
library:
  repository: https://github.com/libxls/libxls
  commit: 881f6ec3dabb017af878949a6ed7167613bd7a69
  licence: BSD-2-Clause
modifications:
- Linked against libxls at commit 881f6ec3.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
