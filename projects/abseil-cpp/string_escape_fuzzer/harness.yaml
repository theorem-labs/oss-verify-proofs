project: abseil-cpp
harness: string_escape_fuzzer
rocq: OSSVerify.abseil_cpp.string_escape_fuzzer
origin: oss-fuzz
summary: 'Checks 4 properties (listed below); the first, a round trip: CUnescape(CHexEscape(s)) == s,
  CUnescape(CEscape(s)) == s, CUnescape(Utf8SafeCEscape(s)) == s and CUnescape(Utf8SafeCHexEscape(s))
  == s for every input byte string (CUnescape return value ignored, but the full output is compared).'
entry: LLVMFuzzerTestOneInput
