licence: NOASSERTION
checks:
- kind: roundtrip
  strength: full
  stops_with: abort
  live: unknown
  where: source/string_escape_fuzzer.cc:24-42
  what: CUnescape(CHexEscape(s)) == s, CUnescape(CEscape(s)) == s, CUnescape(Utf8SafeCEscape(s)) == s
    and CUnescape(Utf8SafeCHexEscape(s)) == s for every input byte string (CUnescape return value ignored,
    but the full output is compared)
- kind: roundtrip
  strength: weak
  stops_with: abort
  live: unknown
  where: source/string_escape_fuzzer.cc:44-48
  what: Meant as Base64Escape/Base64Unescape round trip, but line 47 compares str against `unescaped`,
    which still holds CUnescape(Utf8SafeCHexEscape(str)) from lines 39-40 (not the CHexEscape result).
    Line 41 has already required that to equal str, so this check is always true and the Base64 round
    trip is never checked (a bug in the harness)
- kind: roundtrip
  strength: full
  stops_with: abort
  live: unknown
  where: source/string_escape_fuzzer.cc:50-53
  what: WebSafeBase64Unescape(WebSafeBase64Escape(s)) == s
- kind: roundtrip
  strength: weak
  stops_with: abort
  live: unknown
  where: source/string_escape_fuzzer.cc:55-59
  what: Meant as HexStringToBytes(BytesToHexString(s)) == s, but the check compares str against `decoded`
    (the WebSafeBase64 result) instead of `bytes_result`, so the hex round trip is never checked (a bug
    in the harness)
