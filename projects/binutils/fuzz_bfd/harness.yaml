schema: oss-fuzz-theorems/harness/1
project: binutils
harness: fuzz_bfd
rocq: OSSVerify.binutils.fuzz_bfd
origin: oss-fuzz
summary: Writes the input to a temp file, bfd_openr with the default target, bfd_check_format(bfd_archive);
  nothing is checked.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_bfd.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/binutils/fuzz_bfd.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://sourceware.org/git/binutils-gdb
  commit: d36318737a3882fcae672a6f2da5cfdb792721a7
  licence: NOASSERTION
modifications:
- Linked against binutils-gdb at commit d3631873.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
