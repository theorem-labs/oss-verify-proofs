schema: oss-fuzz-theorems/harness/1
project: libvpx
harness: vpx_enc_fuzzer_vp9
rocq: OssFuzzTheorems.libvpx.vpx_enc_fuzzer_vp9
origin: upstream
summary: Byte 0 picks keyframe interval, deadline and one of 6 tiny frame sizes; the rest is copied into
  I420 planes frame by frame (up to 150/300 frames) and encoded with vpx_codec_encode; compressed packets
  are fwrite()n to /dev/null and never decoded back (no encode->decode check).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/vpx_enc_fuzzer.cc
  from:
    repository: https://chromium.googlesource.com/webm/libvpx
    commit: 5c880e08d21386049adec8e5537c4e726458b563
    path: examples/vpx_enc_fuzzer.cc
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://chromium.googlesource.com/webm/libvpx
  commit: 5c880e08d21386049adec8e5537c4e726458b563
  licence: BSD-3-Clause
modifications:
- Linked against libvpx at commit 5c880e08.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
