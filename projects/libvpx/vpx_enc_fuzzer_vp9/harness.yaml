checks:
- kind: invariant
  strength: weak
  stops_with: assert
  live: true
  where: source/vpx_enc_fuzzer.cc:104
  what: assert(img->bit_depth == 8) in fuzz_vpx_img_read; the image is always allocated as 8-bit VPX_IMG_FMT_I420,
    so this is trivially true.
- kind: api-contract
  strength: weak
  stops_with: abort
  live: unknown
  where: source/vpx_enc_fuzzer.cc:184
  what: vpx_codec_enc_config_default must succeed; called with constant arguments before any input byte
    is used, so it is input-independent.
failure_handlers: none
