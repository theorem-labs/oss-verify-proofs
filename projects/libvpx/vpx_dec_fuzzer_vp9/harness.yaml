schema: oss-fuzz-theorems/harness/1
project: libvpx
harness: vpx_dec_fuzzer_vp9
rocq: OSSVerify.libvpx.vpx_dec_fuzzer_vp9
origin: upstream
summary: Parses an IVF container by hand (32-byte file header, 12-byte frame headers), picks thread count
  / postproc / loop-filter options from header byte 32, calls vpx_codec_peek_stream_info and vpx_codec_decode
  per frame and drains vpx_codec_get_frame; every return code is ignored (static_cast<void>(err)) and
  decoded frames are not inspected.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/vpx_dec_fuzzer.cc
  from:
    repository: https://chromium.googlesource.com/webm/libvpx
    commit: 5c880e08d21386049adec8e5537c4e726458b563
    path: examples/vpx_dec_fuzzer.cc
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://chromium.googlesource.com/webm/libvpx
  commit: 5c880e08d21386049adec8e5537c4e726458b563
  licence: BSD-3-Clause
modifications:
- Linked against libvpx at commit 5c880e08.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
