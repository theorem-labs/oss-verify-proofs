project: pupnp
harness: FuzzHttp
rocq: OSSVerify.pupnp.FuzzHttp
origin: upstream
summary: first byte selects HTTP request or response parser (parser_request_init / parser_response_init
  GET); parser_append feeds the rest; parse status and message discarded, then httpmsg_destroy.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/FuzzHttp.c
  from:
    repository: https://github.com/pupnp/pupnp
