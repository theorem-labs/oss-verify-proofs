licence: NOASSERTION
checks:
- kind: invariant
  strength: weak
  stops_with: return-only
  live: unknown
  where: source/FuzzIxml.c:23-27
  what: if a document parsed, ixmlPrintDocument must return a non-empty string, else CheckXML returns
    1 (and LLVMFuzzerTestOneInput returns it); trivially true because ixmlPrintDocument always emits the
    <?xml version="1.0"?> prolog (ixml/src/ixml.c:404), so only an allocation failure could make it NULL
rejects:
- where: source/FuzzIxml.c:41-43
  what: An input shorter than 10 bytes or longer than 5120 is returned 1 without being parsed
- where: source/FuzzIxml.c:18-21
  what: An input ixmlLoadDocumentEx does not parse is returned its nonzero IXML error code
