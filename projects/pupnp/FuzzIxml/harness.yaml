schema: oss-fuzz-theorems/harness/1
project: pupnp
harness: FuzzIxml
rocq: OSSVerify.pupnp.FuzzIxml
origin: upstream
summary: writes the input (10..5120 bytes) to /tmp/libfuzzer.<pid>, ixmlLoadDocumentEx parses it, ixmlPrintDocument
  serialises it, then frees; the printed text is not compared to anything.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/FuzzIxml.c
  from:
    repository: https://github.com/pupnp/pupnp
    commit: b46bc77ac9ae2ff1351d0f4ce544d97283b6e149
    path: fuzzer/FuzzIxml.c
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/pupnp/pupnp
  commit: b46bc77ac9ae2ff1351d0f4ce544d97283b6e149
  licence: BSD-3-Clause
modifications:
- Linked against pupnp at commit b46bc77a.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
