project: openssh
harness: sshsig_fuzz
rocq: OSSVerify.openssh.sshsig_fuzz
origin: upstream
summary: sshsig_verifyb() of the input as an SSHSIG over a fixed message, namespace "castle"; result discarded.
entry: LLVMFuzzerTestOneInput
