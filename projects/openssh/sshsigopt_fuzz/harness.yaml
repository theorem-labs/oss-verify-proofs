  - source/sshsigopt_fuzz.cc
  from:
    repository: https://github.com/openssh/openssh-portable
    commit: 0ef0f5a839831c213f24e3f2ae434765c607fb50
    path: regress/misc/fuzz-harness/sshsigopt_fuzz.cc
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/openssh/openssh-portable
  commit: 0ef0f5a839831c213f24e3f2ae434765c607fb50
  licence: BSD-3-Clause
modifications:
- Linked against openssh-portable at commit 0ef0f5a8.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
