project: openssh
harness: sshsigopt_fuzz
rocq: OSSVerify.openssh.sshsigopt_fuzz
origin: upstream
summary: sshsigopt_parse() of the NUL-terminated input; result only freed.
entry: LLVMFuzzerTestOneInput
source:
