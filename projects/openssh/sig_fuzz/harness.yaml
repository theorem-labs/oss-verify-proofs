schema: oss-fuzz-theorems/harness/1
project: openssh
harness: sig_fuzz
rocq: OSSVerify.openssh.sig_fuzz
origin: upstream
summary: sshkey_verify() of the input as a signature over a fixed message under freshly generated RSA-2048
  / ECDSA-256/384/521 / Ed25519 keys; the verify result is discarded (a forged signature that verifies
  would not be caught).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/sig_fuzz.cc
  from:
    repository: https://github.com/openssh/openssh-portable
    commit: 0ef0f5a839831c213f24e3f2ae434765c607fb50
    path: regress/misc/fuzz-harness/sig_fuzz.cc
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/openssh/openssh-portable
  commit: 0ef0f5a839831c213f24e3f2ae434765c607fb50
  licence: BSD-3-Clause
modifications:
- Linked against openssh-portable at commit 0ef0f5a8.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
