    path: contrib/oss-fuzz/libpng_read_fuzzer.cc
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/pnggroup/libpng
  commit: ed217e3e601d8e462f7fd1e04bed43ac42212429
  version: 1.6.43
  licence: NOASSERTION
modifications:
- Linked against libpng 1.6.43 at commit ed217e3e.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
