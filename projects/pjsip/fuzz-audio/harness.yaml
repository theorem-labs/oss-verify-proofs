    commit: 708f894e9cb2fa47d3d119d46105b786495ba5a1
    path: tests/fuzz/fuzz-audio.c
  modified: false
  licence: GPL-2.0-or-later
library:
  repository: https://github.com/pjsip/pjproject
  commit: 708f894e9cb2fa47d3d119d46105b786495ba5a1
  licence: NOASSERTION
modifications:
- Linked against pjproject at commit 708f894e with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
