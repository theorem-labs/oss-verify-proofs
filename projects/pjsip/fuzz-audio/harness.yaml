schema: oss-fuzz-theorems/harness/1
project: pjsip
harness: fuzz-audio
rocq: OSSVerify.pjsip.fuzz_audio
origin: upstream
summary: 'For each registered audio codec (G.711 A/U-law, G.722, GSM, Speex, iLBC, L16 8/16/48 kHz, Opus
  when built) on a non-overlapping chunk: codec modify (VAD bit from input), decode the chunk, re-encode
  the decoded PCM, encode the chunk as PCM, parse, and PLC recover twice; then pjmedia_linear2alaw/ulaw
  and alaw2linear/ulaw2linear/alaw2ulaw/ulaw2alaw over the remaining bytes. Every result is discarded:
  decode->encode and linear->alaw->linear look like round trips but nothing is compared.'
entry: LLVMFuzzerTestOneInput
