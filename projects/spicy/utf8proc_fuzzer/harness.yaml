schema: oss-fuzz-theorems/harness/1
project: spicy
harness: utf8proc_fuzzer
rocq: OSSVerify.spicy.utf8proc_fuzzer
origin: upstream
summary: Requires a NUL-terminated input of at most 64 KiB, then iterates codepoints through utf8proc_iterate
  and calls the case/category/width/grapheme-break queries, then utf8proc_NFD/NFC/NFKD/NFKC/NFKC_Casefold
  and five utf8proc_map option sets; every result is freed or discarded, nothing is compared. The normalize_utf32
  block is dead code (copy is non-NULL only when size < 4, and then size/4 == 0).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzzer.c
  from:
    repository: https://github.com/JuliaStrings/utf8proc
    commit: e5e799221b45bbb90f5fdc5c69b6b8dfbf017e78
    path: test/fuzzer.c
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/zeek/spicy
  commit: 877b266d1846ac4651cd3c440cfb142ad49df4d5
  licence: BSD-3-Clause
modifications:
- Linked against spicy at commit 877b266d with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
