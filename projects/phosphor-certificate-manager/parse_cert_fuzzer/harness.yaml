  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/openbmc/phosphor-certificate-manager
  commit: 9d6ea17f3926d1143765129384a8afc2c7fe42c3
  licence: Apache-2.0
modifications:
- Linked against phosphor-certificate-manager at commit 9d6ea17f.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
