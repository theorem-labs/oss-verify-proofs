checks:
- kind: invariant
  strength: weak
  stops_with: assert
  live: unknown
  where: source/pffft_fuzzer.cc:71-72
  what: 'assert(number_of_bytes <= size) where number_of_bytes = (size / kSizeOfOneSample) * kSizeOfOneSample:
    true by integer division for every size, so it checks nothing about pffft (trivially true).'
distribution:
  file: Distribution.v
  argv0: pffft_real_fuzzer
  input_file: input.bin
  prefix_hex: '000000000000'
  payload:
    length: geometric
    p: 1/4097
    mean_bytes: 4096
    alphabet: bytes
  components:
    payload: 9/10
    wrong_argc: 1/50
    missing_file: 1/50
    full_support: 3/50
  mass: '1'
