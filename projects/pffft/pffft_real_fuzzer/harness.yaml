schema: oss-fuzz-theorems/harness/1
project: pffft
harness: pffft_real_fuzzer
rocq: OSSVerify.pffft.pffft_real_fuzzer
origin: oss-fuzz
summary: Forward pffft_transform, pffft_zconvolve_accumulate(out,out,out) and backward pffft_transform_ordered
  are run on the fuzzed floats; the outputs are never compared to the input (no inverse/round-trip check,
  no Parseval check, no comparison against fftpack).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/pffft_fuzzer.cc
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/pffft/pffft_fuzzer.cc
  modified: false
  licence: Apache-2.0
library:
  repository: https://bitbucket.org/jpommier/pffft
  commit: 0aec0327a6912e1a0ec5326eef737c2ce19bc836
  licence: NOASSERTION
modifications:
- Linked against pffft at commit 0aec0327.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
