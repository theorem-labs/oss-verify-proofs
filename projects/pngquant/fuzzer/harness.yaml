schema: oss-fuzz-theorems/harness/1
project: pngquant
harness: fuzzer
rocq: OSSVerify.pngquant.fuzzer
origin: upstream
summary: Writes the input to /tmp/libfuzzer.png and calls pngquant's read_image() (libpng decode into
  a liq_image); the return code is ignored, nothing is quantized or compared.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzzer.c
  from:
    repository: https://github.com/kornelski/pngquant
    commit: 22918da1f4ae56b4300dfb30137f0f29cc8a0866
    path: test/fuzzer.c
  modified: true
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/kornelski/pngquant
  commit: 22918da1f4ae56b4300dfb30137f0f29cc8a0866
  licence: GPL-3.0-or-later
modifications:
- Linked against pngquant at commit 22918da1 with 2 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
