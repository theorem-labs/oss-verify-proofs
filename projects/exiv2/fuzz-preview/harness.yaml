harness: fuzz-preview
rocq: OssFuzzTheorems.exiv2.fuzz_preview
origin: upstream
summary: readMetadata, then PreviewManager::getPreviewProperties and formatting each preview's mime type/size
  into a string stream; nothing compared.
entry: LLVMFuzzerTestOneInput
