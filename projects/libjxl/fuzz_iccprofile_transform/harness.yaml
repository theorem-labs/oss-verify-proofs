  - source/fuzz_iccprofile_transform.c
  from:
    repository: https://github.com/google/skcms
    commit: 96d9171c94b937a1b5f0293de7309ac16311b722
    path: fuzz/fuzz_iccprofile_transform.c
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/libjxl/libjxl
  commit: aea3a06e281fdee13e04815bfbf4f4132e7f59ea
  licence: BSD-3-Clause
modifications:
- Linked against libjxl at commit aea3a06e.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
