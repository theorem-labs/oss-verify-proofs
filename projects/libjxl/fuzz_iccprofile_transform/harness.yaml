schema: oss-fuzz-theorems/harness/1
project: libjxl
harness: fuzz_iccprofile_transform
rocq: OssFuzzTheorems.libjxl.fuzz_iccprofile_transform
origin: upstream
summary: skcms_Parse of the input profile, then skcms_Transform of a fixed 64-pixel RGBA ramp sRGB->profile
  and profile->sRGB for all alpha formats, before and after skcms_MakeUsableAsDestination; transformed
  pixels and return values ignored (no round-trip comparison).
entry: LLVMFuzzerTestOneInput
source:
