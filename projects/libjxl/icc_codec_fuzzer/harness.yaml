licence: NOASSERTION
checks:
- kind: api-contract
  strength: full
  stops_with: trap
  live: true
  where: source/icc_codec_fuzzer.cc:93
  what: PredictICC (the writer) must succeed on every byte string ("Writing should support any random
    bytestream so must succeed").
- kind: roundtrip
  strength: full
  stops_with: trap
  live: true
  where: source/icc_codec_fuzzer.cc:95
  what: 'For every input whose first byte is non-zero: UnpredictICC(PredictICC(x)) reproduces x exactly
    (same size and memcmp equal) -- the ICC predictive codec is lossless on ARBITRARY bytes, not only
    on valid profiles.'
- kind: invariant
  strength: full
  stops_with: trap
  live: true
  where: source/icc_codec_fuzzer.cc:101
  what: 'Every allocation the library made through the harness TrackingMemoryManager was freed by the
    end of the run (num_allocations==0, allocation map empty, bytes_in_use==0): a leak check on the JxlMemoryManager
    path that holds without LeakSanitizer.'
failure_handlers: none
distribution:
  file: Distribution.v
  argv0: icc_codec_fuzzer
  input_file: input.bin
  prefix_hex: '000000000000'
  payload:
    length: geometric
    p: 1/257
    mean_bytes: 256
    alphabet: bytes
  components:
    payload: 9/10
    wrong_argc: 1/50
    missing_file: 1/50
    full_support: 3/50
  mass: '1'
