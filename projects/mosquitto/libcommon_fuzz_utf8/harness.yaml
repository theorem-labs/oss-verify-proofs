    path: fuzzing/libcommon/libcommon_fuzz_utf8.cpp
  modified: false
  licence: EPL-2.0 OR BSD-3-Clause
library:
  repository: https://github.com/eclipse-mosquitto/mosquitto
  commit: d5b453a8b5940b01db1cfb30e27d15e80f7737ba
  licence: EPL-2.0 OR BSD-3-Clause
modifications:
- Linked against mosquitto at commit d5b453a8.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
