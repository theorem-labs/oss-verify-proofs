schema: oss-fuzz-theorems/harness/1
project: libjpeg-turbo
harness: transform_fuzzer
rocq: OSSVerify.libjpeg_turbo.transform_fuzzer
origin: upstream
summary: tj3Transform lossless transforms (none/progressive, transpose+gray+crop+optimize, rot90+trim+arithmetic,
  a DCT-negating custom filter plus rot180 into two outputs); outputs only summed, never decoded or compared
  with each other. The "sum > bound" test after touching output bytes only prevents dead-code elimination
  for MSan; its branch is goto bailout -> return 0, not a check.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/transform.cc
  from:
    repository: https://github.com/libjpeg-turbo/libjpeg-turbo
    commit: 2646fa33f8d67373c27b558b47e77b2d8d517e31
    path: fuzz/transform.cc
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/libjpeg-turbo/libjpeg-turbo
  commit: 2646fa33f8d67373c27b558b47e77b2d8d517e31
  licence: BSD-3-Clause
modifications:
- Linked against libjpeg-turbo at commit 2646fa33.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
