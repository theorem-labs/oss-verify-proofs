schema: oss-fuzz-theorems/harness/1
project: libjpeg-turbo
harness: compress_fuzzer
rocq: OSSVerify.libjpeg_turbo.compress_fuzzer
origin: upstream
summary: tj3Compress8 on a BMP/PPM/GIF/TGA image loaded from the input (or raw bytes after a 2-byte size
  header) under 7 option sets (colorspace, subsampling, DCT, quality, progressive, arithmetic, restart
  rows, ICC); compressed output is only summed, never decoded or compared. The "sum > bound" test after
  touching output bytes only prevents dead-code elimination for MSan; its branch is goto bailout -> return
  0, not a check.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/compress.cc
  from:
    repository: https://github.com/libjpeg-turbo/libjpeg-turbo
    commit: 2646fa33f8d67373c27b558b47e77b2d8d517e31
    path: fuzz/compress.cc
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/libjpeg-turbo/libjpeg-turbo
  commit: 2646fa33f8d67373c27b558b47e77b2d8d517e31
  licence: BSD-3-Clause
modifications:
- Linked against libjpeg-turbo at commit 2646fa33.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
