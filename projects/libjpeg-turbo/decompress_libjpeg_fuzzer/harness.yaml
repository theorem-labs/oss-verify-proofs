schema: oss-fuzz-theorems/harness/1
project: libjpeg-turbo
harness: decompress_libjpeg_fuzzer
rocq: OSSVerify.libjpeg_turbo.decompress_libjpeg_fuzzer
origin: upstream
summary: 'libjpeg API decode: float IDCT, buffered-image mode, skip_scanlines, marker saving, a custom
  APP3 marker processor, RGB565 and colour quantisation; errors longjmp out; output only summed. The "sum
  > bound" test after touching output bytes only prevents dead-code elimination for MSan; its branch is
  goto bailout -> return 0, not a check.'
entry: LLVMFuzzerTestOneInput
