schema: oss-fuzz-theorems/harness/1
project: mupdf
harness: fuzz_quadratic
rocq: OSSVerify.mupdf.fuzz_quadratic
origin: upstream
summary: 'cmark-gfm quadratic-behaviour fuzzer: a 10-byte config prefix (splitpoint, repeatlen) expands
  the input by repeating a slice up to 512 KiB, parses it with the autolink/strikethrough/table/tagfilter
  extensions and GitHub options, and renders HTML, XML, man, CommonMark, plaintext and LaTeX; every rendering
  is freed unread (no parse(render_commonmark(doc)) round trip).'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_quadratic.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/ArtifexSoftware/mupdf
  commit: 5fe54cef1e233e4823ae743eacd00c35e96f1062
  licence: NOASSERTION
modifications:
- Linked against mupdf at commit 5fe54cef.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
