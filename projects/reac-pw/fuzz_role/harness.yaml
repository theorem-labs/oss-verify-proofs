licence: NOASSERTION
checks:
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_role.c:65-76
  what: A Props write with no role key returns 0 and leaves the caller's role unchanged.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_role.c:78-89
  what: 0 asks for the master and 1 for the slave, as an Int or a Float with that nearest integer; the first role key answers,
    and the parse returns 1.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_role.c:91-105
  what: Any other role value, a value that is not a number, or an object that is not a Props object returns -1 and leaves
    the caller's role unchanged.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_role.c:107-119
  what: The running role asserted again is no change and is applied; the other role is a change and is pending.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_role.c:121-131
  what: A refusal publishes its code from the shared vocabulary ("malformed"), and no refusal is "none".
failure_handlers: unknown
