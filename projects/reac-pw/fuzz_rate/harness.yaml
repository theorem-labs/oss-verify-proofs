checks:
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_rate.c:130-141
  what: A Props write with no rate key returns 0 and leaves the caller's rate unchanged.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_rate.c:143-156
  what: A rate key holding an Int, or a Float whose nearest integer fits an int, returns 1 and that rate (the first such key's).
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_rate.c:158-173
  what: A rate key with no usable number, or an object that is not a Props object, returns -1 and leaves the caller's rate
    unchanged.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_rate.c:175-188
  what: The decision refuses a slave first, then a rate off the closed list (44100, 48000, 96000), then a rate outside the
    drivable mask, and accepts every other rate.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_rate.c:190-200
  what: Each refusal publishes its own code from the shared vocabulary.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_rate.c:202-215
  what: A rate's bit is its place in the closed list, it is in the list exactly when it has a bit, and the best drivable rate
    is the highest one in the mask.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_rate.c:217-229
  what: The drivable list is the drivable rates in ascending order, comma separated; the length returned is the whole list's
    and the buffer holds as much as fits, NUL-terminated.
failure_handlers: unknown
