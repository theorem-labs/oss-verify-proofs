schema: oss-fuzz-theorems/harness/1
project: reac-pw
harness: fuzz_rate
rocq: OSSVerify.reac_pw.fuzz_rate
origin: upstream
summary: Builds a PipeWire Props object from the input and parses its sample-rate key; then decides the parsed rate and a
  second input rate for a master or slave with a fuzz-chosen drivable mask, and writes the drivable-rate list into a fuzz-sized
  buffer, comparing each answer with the closed rate list and the record of the object written. The key and the refusal enumeration
  come from libreac's configuration header; the harness works out each rate's bit from its own closed list and names
  each refusal code itself.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_rate.c
  - source/fuzz.h
  - source/pod.h
  from:
    repository: https://github.com/FreeREAC/reac-pw
    commit: f86a30a3d06e84e8a7d6ec647cae77c4cbc9137b
    path: fuzz/fuzz_rate.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/FreeREAC/reac-pw
  commit: f86a30a3d06e84e8a7d6ec647cae77c4cbc9137b
  version: 1.0.42
  licence: GPL-3.0-or-later
modifications:
- Linked against a static library of reac-pw's nine input readers and the harness's box-model table, built from source with
  libreac's and PipeWire SPA's headers only; neither library is linked.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the fuzz target one to four times and prints each return value.
