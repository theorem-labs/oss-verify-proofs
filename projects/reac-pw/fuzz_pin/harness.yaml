checks:
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_pin.c:30-42
  what: The pin is accepted exactly when the arguments are present, the text is not empty and the text before its first colon
    is a whole model token of the box-model table.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_pin.c:44-53
  what: An accepted pin names the table row of its token.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_pin.c:55-69
  what: The label is the text after the first colon, or the model's display name when there is none.
failure_handlers: unknown
