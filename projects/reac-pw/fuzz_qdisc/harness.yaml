schema: oss-fuzz-theorems/harness/1
project: reac-pw
harness: fuzz_qdisc
rocq: OSSVerify.reac_pw.fuzz_qdisc
origin: upstream
summary: Computes up to seven catch-up budgets under the etf qdisc, each from a lead in microseconds and a frame rate (from
  a fixed list that includes zero, a negative rate and the largest int) taken from the input, and compares each with the harness's
  own arithmetic. The qdisc counter read this harness used to drive is now libreac's and is not part of this program.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_qdisc.c
  - source/fuzz.h
  from:
    repository: https://github.com/FreeREAC/reac-pw
    commit: f86a30a3d06e84e8a7d6ec647cae77c4cbc9137b
    path: fuzz/fuzz_qdisc.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/FreeREAC/reac-pw
  commit: f86a30a3d06e84e8a7d6ec647cae77c4cbc9137b
  version: 1.0.42
  licence: GPL-3.0-or-later
modifications:
- Linked against a static library of reac-pw's nine input readers and the harness's box-model table, built from source with
  libreac's and PipeWire SPA's headers only; neither library is linked.
- The harness defines stand-ins for four libreac-transport qdisc functions the reader's file refers to; the harness never
  calls that part, and the stand-ins answer as a host with no qdisc support.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the fuzz target one to four times and prints each return value.
