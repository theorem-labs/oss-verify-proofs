  live: unknown
  where: source/fuzz_qdisc.c:72-87
  what: The catch-up budget is the lead past the qdisc's 300 microsecond delta in slots at the frame rate, rounded down, from
    1 to 1000000; a frame rate of zero or less gives 1.
