schema: oss-fuzz-theorems/harness/1
project: reac-pw
harness: fuzz_link
rocq: OSSVerify.reac_pw.fuzz_link
origin: upstream
summary: 'Runs a sequence of input-chosen operations against a fake kernel netlink socket: read an interface''s alias and
  link kind, write an alias, mark and unmark served interfaces, and decide a verdict from a kind and alias; checks requests,
  return codes, buffer bounds, socket use and the kept marks against a model of the kernel and the marking policy. The harness
  points the marking code''s messages at a fixed buffer in memory, so the run writes none of them; no check depends on them.'
entry: LLVMFuzzerTestOneInput
