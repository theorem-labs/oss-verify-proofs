checks:
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_link.c:487-496
  what: Every socket the reader opens it closes before it returns, and it sends, receives and closes only that socket.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_link.c:498-517
  what: Each operation sends exactly the netlink requests it owes, in order and byte for byte.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_link.c:519-530
  what: A read or write that cannot be made (no name, an empty name, an alias too long, an interface with no index) opens
    no socket.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_link.c:532-553
  what: A read answers the reply's code, and on success the link kind and alias the reply carries, cut to the buffers.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_link.c:555-566
  what: A text written into a buffer ends in a NUL inside it, and the byte after the buffer is unchanged.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_link.c:568-577
  what: A write answers the reply's code, and refuses an alias too long for the kernel with -ENAMETOOLONG.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_link.c:579-593
  what: The verdict on an interface follows its alias (one set by the host is left alone, one of this daemon's is its own),
    then its link kind.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_link.c:595-606
  what: A mark answers its verdict, or the error of the read or write that stopped it, and -EINVAL with no marks or no name.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_link.c:608-623
  what: The marks kept are the interfaces this daemon marked, or found marked by an earlier run of its own, each once, at
    most 32; the unmark clears them all.
failure_handlers: unknown
