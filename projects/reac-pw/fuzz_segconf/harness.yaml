checks:
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_segconf.c:407-429
  what: The segments listed are the names the sections opened, each once, in the order first opened, with any past the 32-segment
    bound counted as overflow, as the harness's own line-by-line reading of the files predicts.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_segconf.c:431-455
  what: Each segment's role is the last one its files pinned, after the rule that a box with no model falls back to auto,
    as the harness's reading predicts.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_segconf.c:457-468
  what: Each segment's model is a token of the box-model table folded to lower case, kept only on a segment whose role is
    box.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_segconf.c:470-483
  what: A segment is switched off exactly when the last file to say ignore said yes, true or 1.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_segconf.c:485-500
  what: The role and the ignore answer of each segment name the file that gave them.
- kind: reference-oracle
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_segconf.c:502-514
  what: A kept refusal of a `knock` line, whatever its value, says that the knock takes no plan.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_segconf.c:516-529
  what: Every line the grammar cannot use is refused and counted, and the first ones (up to the kept bound) are kept.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_segconf.c:531-542
  what: 'Each kept refusal starts with its address: the file and the line, or the file alone for a rule that needed every
    file read.'
- kind: api-contract
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_segconf.c:544-554
  what: A name no section opened has no entry and no role, ignore or model answer, for each opened name with one byte
    added and for the fixed name nosuch0 when no section opened it.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_segconf.c:556-577
  what: The declared VLANs are the segments named parent.vid that are not switched off, with a valid VLAN id, each once and
    within the table capacity given.
failure_handlers: unknown
