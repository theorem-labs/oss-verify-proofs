schema: oss-fuzz-theorems/harness/1
project: reac-pw
harness: fuzz_segconf
rocq: OSSVerify.reac_pw.fuzz_segconf
origin: upstream
summary: Reads one to four operator configuration texts made from the input (drop-in files under fuzz-chosen labels, then
  the main file) with the configuration reader, then compares every segment, role, model, ignore switch, provenance, refusal
  and declared VLAN with what the harness predicts from its own reading of the documented grammar, checks that a `knock` line
  is refused with its reason, and probes names no section opened.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_segconf.c
  - source/catalogue.c
  - source/catalogue.h
  - source/fuzz.h
  from:
    repository: https://github.com/FreeREAC/reac-pw
    commit: f86a30a3d06e84e8a7d6ec647cae77c4cbc9137b
    path: fuzz/fuzz_segconf.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/FreeREAC/reac-pw
  commit: f86a30a3d06e84e8a7d6ec647cae77c4cbc9137b
  version: 1.0.42
  licence: GPL-3.0-or-later
modifications:
- Linked against a static library of reac-pw's nine input readers and the harness's box-model table, built from source with
  libreac's and PipeWire SPA's headers only; neither library is linked.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the fuzz target one to four times and prints each return value.
