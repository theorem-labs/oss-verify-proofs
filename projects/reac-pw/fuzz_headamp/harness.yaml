licence: NOASSERTION
checks:
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_headamp.c:183-192
  what: The reader writes no cell past the capacity it was given; the guard cell after the last one is unchanged.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_headamp.c:194-205
  what: The return is -1 or a count from 0 to the capacity, and the result reports that count with at least as many head-amp
    keys seen.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_headamp.c:207-219
  what: Every cell handed on addresses a channel of the head-amp channel space with a real parameter and a value that parameter
    takes.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_headamp.c:221-237
  what: The reader returns -1 exactly for a missing object or one that is not a Props object, and then reports no cells, keys
    or refusal.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_headamp.c:239-259
  what: The cells are exactly the well-formed ones the object carries, in the order written, up to the capacity.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_headamp.c:261-271
  what: Every key under the head-amp prefix that the walk reached is counted, refused ones included.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_headamp.c:273-285
  what: The refusal reported is the first thing wrong with a key, and none only when every key was accepted.
- kind: differential
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_headamp.c:297-309
  what: The parse without a result object returns the same count and writes the same cells as the parse with one.
failure_handlers: unknown
