schema: oss-fuzz-theorems/harness/1
project: kea
harness: fuzz_util
rocq: OSSVerify.kea.fuzz_util
origin: upstream
summary: 'One payload string to eleven libkea-util calls in a fixed order: str::tokens, quotedStringToBinary,
  decodeFormattedHexString, decodeColonSeparatedHexString, decodeSeparatedHexString, trim, lowercase+uppercase,
  CSVRow readAt/readAtEscaped, encodeUtf8, then (if the payload parses as a boost posix_time via time_from_string
  or from_iso_extended_string) ptimeToText/durationToText. isc::Exception and boost::exception are swallowed
  and every result is discarded; nothing is fed back or compared.'
entry: LLVMFuzzerTestOneInput
