    path: src/fuzz/fuzz_util.cc
  modified: false
  licence: MPL-2.0
library:
  repository: https://gitlab.isc.org/isc-projects/kea
  commit: 9ae6618c2bfa78aad01c1bf366199ce64d2ecb74
  version: 3.3.1
  licence: MPL-2.0
modifications:
- Linked against kea 3.3.1 at commit 9ae6618c.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
