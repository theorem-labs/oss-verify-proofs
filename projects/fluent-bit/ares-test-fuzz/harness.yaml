    path: lib/c-ares-1.34.6/test/ares-test-fuzz.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/fluent/fluent-bit
  commit: 37c279fc47f41c2e069163186d660e9998900b64
  licence: Apache-2.0
modifications:
- Linked against fluent-bit at commit 37c279fc.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
