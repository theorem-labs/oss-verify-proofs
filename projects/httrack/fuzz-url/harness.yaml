schema: oss-fuzz-theorems/harness/1
project: httrack
harness: fuzz-url
rocq: OSSVerify.httrack.fuzz_url
origin: upstream
summary: ident_url_absolute splits the URL; fil_simplifie normalises a copy in place; results discarded
  (no idempotence check of fil_simplifie).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz-url.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/xroche/httrack
  commit: 6e29ab3bf216a503823fef14689b11c61c5303d9
  licence: GPL-3.0-or-later
modifications:
- Linked against httrack at commit 6e29ab3b.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
