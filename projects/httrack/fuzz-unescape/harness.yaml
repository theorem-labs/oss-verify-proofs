schema: oss-fuzz-theorems/harness/1
project: httrack
harness: fuzz-unescape
rocq: OSSVerify.httrack.fuzz_unescape
origin: upstream
summary: unescape_http / unescape_http_unharm(0,1) into a 1..8192-byte buffer, then unescape_amp in place;
  results discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz-unescape.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/xroche/httrack
  commit: 6e29ab3bf216a503823fef14689b11c61c5303d9
  licence: GPL-3.0-or-later
modifications:
- Linked against httrack at commit 6e29ab3b.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
