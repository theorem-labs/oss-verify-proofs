schema: oss-fuzz-theorems/harness/1
project: fmt
harness: chrono-duration-fuzzer
rocq: OSSVerify.fmt.chrono_duration_fuzzer
origin: upstream
summary: format_to(runtime(fuzz format), std::chrono::duration<Rep, Period>(fuzz rep)) for 12 reps x 15
  periods; std::exception swallowed.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/chrono-duration.cc
  from:
    repository: https://github.com/fmtlib/fmt
    commit: 21d4cc15c8a2a3536aab5623258ba3b3dae573ce
    path: test/fuzzing/chrono-duration.cc
  modified: false
  licence: MIT
library:
  repository: https://github.com/fmtlib/fmt
  commit: 21d4cc15c8a2a3536aab5623258ba3b3dae573ce
  licence: MIT
modifications:
- Linked against fmt at commit 21d4cc15.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
