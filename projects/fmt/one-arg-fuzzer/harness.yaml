schema: oss-fuzz-theorems/harness/1
project: fmt
harness: one-arg-fuzzer
rocq: OSSVerify.fmt.one_arg_fuzzer
origin: upstream
summary: format_to(fuzz format, one fuzz value) for 14 types incl. std::tm via localtime; std::exception
  swallowed.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/one-arg.cc
  from:
    repository: https://github.com/fmtlib/fmt
    commit: 21d4cc15c8a2a3536aab5623258ba3b3dae573ce
    path: test/fuzzing/one-arg.cc
  modified: false
  licence: MIT
library:
  repository: https://github.com/fmtlib/fmt
  commit: 21d4cc15c8a2a3536aab5623258ba3b3dae573ce
  licence: MIT
modifications:
- Linked against fmt at commit 21d4cc15.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
