schema: oss-fuzz-theorems/harness/1
project: fmt
harness: float-fuzzer
rocq: OssFuzzTheorems.fmt.float_fuzzer
origin: upstream
summary: 'Checks 3 properties (listed below); the first, a round trip: For the 8 input bytes read as a
  double v (non-NaN), strtod(format("{}", v)) must equal v (shortest round-trip repr) and likewise for
  "{:.50g}" (forces the fallback formatter).'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/float.cc
  from:
    repository: https://github.com/fmtlib/fmt
    commit: 21d4cc15c8a2a3536aab5623258ba3b3dae573ce
    path: test/fuzzing/float.cc
  modified: false
  licence: MIT
library:
  repository: https://github.com/fmtlib/fmt
  commit: 21d4cc15c8a2a3536aab5623258ba3b3dae573ce
  licence: MIT
modifications:
- Linked against fmt at commit 21d4cc15.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
