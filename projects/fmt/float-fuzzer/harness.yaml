licence: NOASSERTION
checks:
- kind: reference-oracle
  strength: full
  stops_with: throw
  live: true
  where: source/float.cc:19
  what: A NaN must format exactly as "nan" or "-nan" according to its sign bit.
- kind: roundtrip
  strength: full
  stops_with: throw
  live: true
  where: source/float.cc:26
  what: For the 8 input bytes read as a double v (non-NaN), strtod(format("{}", v)) must equal v (shortest
    round-trip repr) and likewise for "{:.50g}" (forces the fallback formatter).
- kind: invariant
  strength: full
  stops_with: throw
  live: true
  where: source/float.cc:28
  what: strtod must consume the whole formatted output (no trailing unparsed characters).
failure_handlers: none
distribution:
  file: Distribution.v
  argv0: float-fuzzer
  input_file: input.bin
  prefix_hex: '000000000000'
  payload:
    length: geometric
    p: 1/257
    mean_bytes: 256
    alphabet: bytes
  components:
    payload: 9/10
    wrong_argc: 1/50
    missing_file: 1/50
    full_support: 3/50
  mass: '1'
