checks:
- kind: invariant
  strength: partial
  stops_with: abort
  live: unknown
  where: source/cbor_load_fuzzer.cc:38-40
  what: 'allocator ownership: the harness installs counting malloc/realloc/free wrappers (1 GiB cap) and
    aborts if libcbor ever frees or reallocs a pointer the wrapper did not hand out (catches double free
    / foreign free even in a plain build)'
