schema: oss-fuzz-theorems/harness/1
project: mysql-server
harness: cbor_load_fuzzer
rocq: OSSVerify.mysql_server.cbor_load_fuzzer
origin: upstream
summary: cbor_load of the input; on success cbor_describe, cbor_serialize_alloc and cbor_copy are run
  and their results discarded (the serialized bytes are freed unread).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/cbor_load_fuzzer.cc
  from:
    repository: https://github.com/mysql/mysql-server
    commit: 23e360a7fac718d80b9e6a79f7d5a7bf37aa3bbc
    path: extra/libcbor/libcbor-0.11.0/oss-fuzz/cbor_load_fuzzer.cc
  modified: false
  licence: BSL-1.0
library:
  repository: https://github.com/mysql/mysql-server
  commit: 23e360a7fac718d80b9e6a79f7d5a7bf37aa3bbc
  licence: BSL-1.0
modifications:
- Linked against mysql-server at commit 23e360a7 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
