schema: oss-fuzz-theorems/harness/1
project: quickjs
harness: fuzz_regexp
rocq: OSSVerify.quickjs.fuzz_regexp
origin: upstream
summary: Splits the input at the first NUL into pattern and subject, lre_compile(pattern) and lre_exec(subject)
  with a 100-tick timeout; the match result and capture count are discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_regexp.c
  from:
    repository: https://github.com/bellard/quickjs
    commit: 04be246001599f5995fa2f2d8c91a0f198d3f34c
    path: fuzz/fuzz_regexp.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/bellard/quickjs
  commit: 04be246001599f5995fa2f2d8c91a0f198d3f34c
  licence: MIT
modifications:
- Linked against quickjs at commit 04be2460.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
