    path: third-party/json-c/fuzz/tokener_parse_ex_fuzzer.cc
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/ntop/ntopng
  commit: 69f8cc78a211b89f69a9ad17a65b1a3315484723
  licence: GPL-3.0-or-later
modifications:
- Linked against ntopng at commit 69f8cc78 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
