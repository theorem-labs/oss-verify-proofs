- kind: invariant
  strength: full
  stops_with: abort
  live: true
  where: source/bn_div.cc:61
  what: Remainder bound |r| < |d| (BN_ucmp).
- kind: algebraic
  strength: full
  stops_with: abort
  live: true
  where: source/bn_div.cc:63-66
  what: 'Division law: after BN_div(q, r, n, d), checks q*d + r == n exactly (BN_mul, BN_add, BN_cmp).'
