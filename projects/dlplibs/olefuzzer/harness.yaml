project: dlplibs
harness: olefuzzer
rocq: OSSVerify.dlplibs.olefuzzer
origin: upstream
summary: RVNGStringStream -> fuzz::testStructuredStream (enumerate OLE/zip substreams by id and by name
  and read each fully); bytes read are copied to a scratch buffer and never compared.
entry: LLVMFuzzerTestOneInput
source:
  files:
