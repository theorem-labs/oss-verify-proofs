schema: oss-fuzz-theorems/harness/1
project: meshoptimizer
harness: simplifyfuzz
rocq: OSSVerify.meshoptimizer.simplifyfuzz
origin: upstream
summary: Same vertex/index construction; runs meshopt_simplify with 6 option sets, simplifyWithAttributes
  and (last) simplifyWithUpdate; returned index counts and result buffers are discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/simplifyfuzz.cpp
  from:
    repository: https://github.com/zeux/meshoptimizer
    commit: b5b2c4391cb62d434d44e7f6ffb96194605fae2f
    path: tools/simplifyfuzz.cpp
  modified: false
  licence: MIT
library:
  repository: https://github.com/zeux/meshoptimizer
  commit: b5b2c4391cb62d434d44e7f6ffb96194605fae2f
  licence: MIT
modifications:
- Linked against meshoptimizer at commit b5b2c439.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
