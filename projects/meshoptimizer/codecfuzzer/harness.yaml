schema: oss-fuzz-theorems/harness/1
project: meshoptimizer
harness: codecfuzzer
rocq: OssFuzzTheorems.meshoptimizer.codecfuzzer
origin: upstream
summary: decodeIndexBuffer/decodeIndexSequence/decodeVertexBuffer on raw input and decodeMeshlet/decodeMeshletRaw
  into buffers placed at the end of fixed arrays (memory safety within documented write limits); return
  codes ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/codecfuzz.cpp
  from:
    repository: https://github.com/zeux/meshoptimizer
    commit: b5b2c4391cb62d434d44e7f6ffb96194605fae2f
    path: tools/codecfuzz.cpp
  modified: false
  licence: MIT
library:
  repository: https://github.com/zeux/meshoptimizer
  commit: b5b2c4391cb62d434d44e7f6ffb96194605fae2f
  licence: MIT
modifications:
- Linked against meshoptimizer at commit b5b2c439.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
