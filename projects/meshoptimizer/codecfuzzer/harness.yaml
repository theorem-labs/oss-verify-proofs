licence: NOASSERTION
checks:
- kind: invariant
  strength: partial
  stops_with: assert
  live: true
  where: source/codecfuzz.cpp:29-30
  what: 'Encoded size is within the advertised bound: 0 < res <= meshopt_encodeVertexBufferBound(count,
    stride)'
- kind: invariant
  strength: partial
  stops_with: assert
  live: true
  where: source/codecfuzz.cpp:32-35
  what: 'Determinism: re-encoding the same input into a buffer of exactly res bytes placed at the end
    of the allocation returns the same size (and exercises encoder bounds safety)'
- kind: roundtrip
  strength: full
  stops_with: assert
  live: true
  where: source/codecfuzz.cpp:69-113
  what: 'Meshlet index round trip modulo rotation: encodeMeshlet(triangles) then decodeMeshlet (both 4-byte
    and 3-byte triangle outputs) returns every triangle equal to the input triangle up to a cyclic rotation
    (abc, bca or cab)'
- kind: roundtrip
  strength: full
  stops_with: assert
  live: true
  where: source/codecfuzz.cpp:115-141
  what: 'Meshlet vertex round trip: 32-bit vertex references decode back exactly, and the 16-bit decode
    equals the low 16 bits of each input reference'
failure_handlers: none
