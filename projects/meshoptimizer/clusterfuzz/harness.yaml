schema: oss-fuzz-theorems/harness/1
project: meshoptimizer
harness: clusterfuzz
rocq: OSSVerify.meshoptimizer.clusterfuzz
origin: upstream
summary: Builds 100 pseudo-random vertices from srand(buffer[0]) and up to 333 triangles from the input
  bytes, then runs meshopt_buildMeshlets, buildMeshletsScan, buildMeshletsFlex (4 configs), buildMeshletsSpatial
  (6 configs) and partitionClusters; every output (meshlet counts, vertex/triangle arrays) is discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/clusterfuzz.cpp
  from:
    repository: https://github.com/zeux/meshoptimizer
    commit: b5b2c4391cb62d434d44e7f6ffb96194605fae2f
    path: tools/clusterfuzz.cpp
  modified: false
  licence: MIT
library:
  repository: https://github.com/zeux/meshoptimizer
  commit: b5b2c4391cb62d434d44e7f6ffb96194605fae2f
  licence: MIT
modifications:
- Linked against meshoptimizer at commit b5b2c439.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
