schema: oss-fuzz-theorems/harness/1
project: expat
harness: xml_parse_fuzzer_UTF-8
rocq: OssFuzzTheorems.expat.xml_parse_fuzzer_UTF_8
origin: upstream
summary: Runs the input through four parsers (plain for ENCODING_FOR_FUZZING, namespace-aware, external-entity
  "e1", external DTD), each XML_Parse non-final then final, with a hash salt derived from siphash of the
  input; status, error string and line number are discarded; odd sizes also exercise XML_ParserReset.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/xml_parse_fuzzer.c
  from:
    repository: https://github.com/libexpat/libexpat
    commit: f31adfd584b7f6c50bbf4d22eb928538ffc9145a
    path: expat/fuzz/xml_parse_fuzzer.c
  modified: true
  licence: Apache-2.0
library:
  repository: https://github.com/libexpat/libexpat
  commit: f31adfd584b7f6c50bbf4d22eb928538ffc9145a
  version: 2.7.5
  licence: MIT
modifications:
- Linked against libexpat 2.7.5 at commit f31adfd5 with 1 patch to the library (listed on the project
  page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
