schema: oss-fuzz-theorems/harness/1
project: tmux
harness: input-fuzzer
rocq: OssFuzzTheorems.tmux.input_fuzzer
origin: upstream
summary: input_parse_buffer feeds the input (<=512 bytes) to an 80x25 pane's terminal-escape parser, then
  drains the command queue and runs the libevent loop once.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/input-fuzzer.c
  from:
    repository: https://github.com/tmux/tmux
    commit: f763f94556fbd68685c02d6eea306c1a6982270e
    path: fuzz/input-fuzzer.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/tmux/tmux
  commit: f763f94556fbd68685c02d6eea306c1a6982270e
  licence: NOASSERTION
modifications:
- Linked against tmux at commit f763f945.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
