project: tmux
harness: style-fuzzer
rocq: OSSVerify.tmux.style_fuzzer
origin: upstream
summary: style_parse on the NUL-terminated input (<=512 bytes) into a zeroed style/grid_cell; the return
  code and result are ignored.
entry: LLVMFuzzerTestOneInput
