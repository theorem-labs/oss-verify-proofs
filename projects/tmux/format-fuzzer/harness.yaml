project: tmux
harness: format-fuzzer
rocq: OSSVerify.tmux.format_fuzzer
origin: upstream
summary: format_expand on the NUL-terminated input with eight fixed format variables; the expansion is
  freed unread.
entry: LLVMFuzzerTestOneInput
