schema: oss-fuzz-theorems/harness/1
project: speex
harness: speex_encode_fuzzer_float
rocq: OSSVerify.speex.speex_encode_fuzzer_float
origin: upstream
summary: Encoder configured from fuzzed mode/rate/channels/quality/complexity/VBR/ABR/VAD/DTX/highpass,
  then fuzzed PCM encoded frame by frame with speex_encode_int (+ stereo); bitstream bytes written to
  a local buffer and discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/speexenc_fuzzer.cc
  from:
    repository: https://gitlab.xiph.org/xiph/speex
    commit: a1b872e6704cc5825750098ce0e0c0b4aacaef4d
    path: contrib/oss-fuzz/speexenc_fuzzer.cc
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://gitlab.xiph.org/xiph/speex
  commit: a1b872e6704cc5825750098ce0e0c0b4aacaef4d
  licence: BSD-3-Clause
modifications:
- Linked against speex at commit a1b872e6.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
