schema: oss-fuzz-theorems/harness/1
project: ntpsec
harness: FuzzClient
rocq: OSSVerify.ntpsec.FuzzClient
origin: oss-fuzz
summary: For 20..1024 input bytes, runs nts_client_process_response_core (NTS-KE client response parser)
  on a zero-ish peer and returns its bool as the LLVMFuzzerTestOneInput result.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/FuzzClient.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/ntpsec/fuzz/FuzzClient.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://gitlab.com/NTPsec/ntpsec
  commit: 9e79f1923b0e53e694767b7ea3e7dfbf36d2e028
  licence: NOASSERTION
modifications:
- Linked against ntpsec at commit 9e79f192.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
