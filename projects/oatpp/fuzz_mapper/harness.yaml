schema: oss-fuzz-theorems/harness/1
project: oatpp
harness: fuzz_mapper
rocq: OSSVerify.oatpp.fuzz_mapper
origin: upstream
summary: mapper.readFromString<Object<Test1>>(input) then mapper.writeToString(dto); the output string
  is thrown away and catch(...) swallows every exception, so only memory errors / crashes count.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/ObjectMapper.cpp
  from:
    repository: https://github.com/oatpp/oatpp
    commit: f83d648fd82dc222ef88aabbafb68efbd7d7bf50
    path: fuzzers/oatpp/json/ObjectMapper.cpp
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/oatpp/oatpp
  commit: f83d648fd82dc222ef88aabbafb68efbd7d7bf50
  licence: Apache-2.0
modifications:
- Linked against oatpp at commit f83d648f.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
