project: skia
harness: skjson
rocq: OSSVerify.skia.skjson
origin: upstream
summary: skjson::DOM parse of the bytes, then dom.write() into a memory stream; the written text is never
  reparsed or compared.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/FuzzJSON.cpp
  from:
    repository: https://skia.googlesource.com/skia
    commit: 24a8072e40466cd656fa017d1753621be84093e1
    path: fuzz/oss_fuzz/FuzzJSON.cpp
  modified: true
  licence: BSD-3-Clause
library:
  repository: https://skia.googlesource.com/skia
  commit: 24a8072e40466cd656fa017d1753621be84093e1
  licence: BSD-3-Clause
modifications:
- Linked against skia at commit 24a8072e with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
