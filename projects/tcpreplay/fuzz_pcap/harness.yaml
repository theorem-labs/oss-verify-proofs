schema: oss-fuzz-theorems/harness/1
project: tcpreplay
harness: fuzz_pcap
rocq: OSSVerify.tcpreplay.fuzz_pcap
origin: upstream
summary: Opens the input as a pcap via fmemopen/pcap_fopen_offline and runs get_l2len_protocol and get_layer4_v4/v6
  / get_ipv6_l4proto on up to 512 packets; results ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_pcap.c
  modified: false
  licence: GPL-3.0-only
library:
  repository: https://github.com/appneta/tcpreplay
  commit: c3f6049a1de91e7d3b81543d0ecb01e465b05214
  licence: NOASSERTION
modifications:
- Linked against tcpreplay at commit c3f6049a.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
