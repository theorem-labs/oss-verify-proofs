project: libressl
harness: asn1parse
rocq: OSSVerify.libressl.asn1parse
origin: upstream
summary: ASN1_parse_dump of the input to a /dev/null BIO; return value cast to void.
entry: FuzzerTestOneInput
source:
  files:
  - source/driver.c
  modified: true
  licence: NOASSERTION
library:
  repository: https://github.com/libressl/portable
  commit: 08415b6730901ab159dc7b1bc5ab2563188713e2
  licence: BSD-4-Clause
modifications:
- Linked against portable at commit 08415b67 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
- This copy of the harness could not be matched to an upstream file at a pinned commit, so it is marked
  modified; it is the file as built.
