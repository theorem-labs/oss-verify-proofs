schema: oss-fuzz-theorems/harness/1
project: nccl
harness: fuzz_xml
rocq: OSSVerify.nccl.fuzz_xml
origin: oss-fuzz
summary: writes the input to /tmp/libfuzzer.<pid> and parses it with ncclTopoGetXmlFromFile into a calloc'd
  ncclXml; the return code and the parsed tree are ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_xml.cpp
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/nccl/fuzz_xml.cpp
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/NVIDIA/nccl
  commit: fd168324a3dc0c9080fd4881b6c7f4bb252a95a2
  licence: Apache-2.0
modifications:
- Linked against nccl at commit fd168324.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
