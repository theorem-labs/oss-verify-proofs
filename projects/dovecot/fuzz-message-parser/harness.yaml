schema: oss-fuzz-theorems/harness/1
project: dovecot
harness: fuzz-message-parser
rocq: OSSVerify.dovecot.fuzz_message_parser
origin: upstream
summary: MIME message_parser over the fuzz bytes until parse_next_block returns -1, then deinit; blocks
  and parts discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz-message-parser.c
  from:
    repository: https://github.com/dovecot/core
    commit: 25eb82b31e0283c2b4b8f23f71e527dce57de292
    path: src/lib-mail/fuzz-message-parser.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/dovecot/core
  commit: 25eb82b31e0283c2b4b8f23f71e527dce57de292
  licence: NOASSERTION
modifications:
- Linked against core at commit 25eb82b3 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
