project: leptonica
harness: maze_fuzzer
rocq: OSSVerify.leptonica.maze_fuzzer
origin: upstream
summary: pixReadMemSpix, then pixSearchBinaryMaze and pixSearchGrayMaze from (1,2) to (3,4); the paths
  are discarded (not checked to be connected or within the image).
entry: LLVMFuzzerTestOneInput
