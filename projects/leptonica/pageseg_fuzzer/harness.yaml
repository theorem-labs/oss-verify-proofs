project: leptonica
harness: pageseg_fuzzer
rocq: OSSVerify.leptonica.pageseg_fuzzer
origin: upstream
summary: pixReadMemSpix, then pixDecideIfTable, pixGetRegionsBinary, pixFindPageForeground (input also
  parsed as a pixacomp) and pixSplitIntoCharacters; outputs discarded.
entry: LLVMFuzzerTestOneInput
