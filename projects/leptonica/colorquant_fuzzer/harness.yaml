schema: oss-fuzz-theorems/harness/1
project: leptonica
harness: colorquant_fuzzer
rocq: OSSVerify.leptonica.colorquant_fuzzer
origin: upstream
summary: pixReadMemSpix, then a chain of colour quantisers (pixThresholdTo4bpp, pixColorGray, pixOctcubeQuantFromCmap,
  pixMedianCutQuant x4, pixFewColors*QuantMixed, pixOctreeQuantByPopulation, pixColorSegment, pixOctreeColorQuant
  for 128..256 colours, pixFixedOctcubeQuant256, pixQuantFromCmap 10x10 grid) plus pixDeskew and a write
  to /tmp/fuzzfile1; outputs discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/colorquant_fuzzer.cc
  from:
    repository: https://github.com/DanBloomberg/leptonica
    commit: 10bdea2f19240ffe8c931701b0b7340f41c6b256
    path: prog/fuzzing/colorquant_fuzzer.cc
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/DanBloomberg/leptonica
  commit: 10bdea2f19240ffe8c931701b0b7340f41c6b256
  licence: NOASSERTION
modifications:
- Linked against leptonica at commit 10bdea2f.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
