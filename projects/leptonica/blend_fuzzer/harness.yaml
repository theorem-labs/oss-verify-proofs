schema: oss-fuzz-theorems/harness/1
project: leptonica
harness: blend_fuzzer
rocq: OSSVerify.leptonica.blend_fuzzer
origin: upstream
summary: pixReadMemSpix, then pixBlend (10 fractions, incl. blending a pix with itself), pixAddAlphaToBlend,
  pixBlendBackgroundToColor, pixBlendCmap, pixBlendColorByChannel, GrayAdapt, GrayInverse, HardLight,
  pixFadeWithGray, pixLinearEdgeFade, pixMultiplyByColor, pixSetAlphaOverWhite; outputs discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/blend_fuzzer.cc
  from:
    repository: https://github.com/DanBloomberg/leptonica
    commit: 10bdea2f19240ffe8c931701b0b7340f41c6b256
    path: prog/fuzzing/blend_fuzzer.cc
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/DanBloomberg/leptonica
  commit: 10bdea2f19240ffe8c931701b0b7340f41c6b256
  licence: NOASSERTION
modifications:
- Linked against leptonica at commit 10bdea2f.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
