schema: oss-fuzz-theorems/harness/1
project: leptonica
harness: compare_fuzzer
rocq: OSSVerify.leptonica.compare_fuzzer
origin: upstream
summary: pixReadMemSpix, pixCopy, then pixGetPerceptualDiff, pixEqualWithAlpha and pixCompareBinary (XOR,
  SUBTRACT) of the image against its own copy. psame (1 for an identical copy) and the XOR fraction (0
  whenever the call succeeds, which needs a 1 bpp image) are computed and never checked.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/compare_fuzzer.cc
  from:
    repository: https://github.com/DanBloomberg/leptonica
