schema: oss-fuzz-theorems/harness/1
project: c-ares
harness: ares_parse_reply_fuzzer
rocq: OSSVerify.c_ares.ares_parse_reply_fuzzer
origin: upstream
summary: ares_dns_parse, then walks every question/RR/key through the getters into a printed buffer, then
  ares_dns_write back to wire format; the written bytes are neither compared with the input nor re-parsed,
  and write failure is silently accepted.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/ares-test-fuzz.c
  from:
    repository: https://github.com/c-ares/c-ares
    commit: 1ff6b69eb10f3a0eedeaef22d84af87e3a457832
    path: test/ares-test-fuzz.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/c-ares/c-ares
  commit: 1ff6b69eb10f3a0eedeaef22d84af87e3a457832
  licence: MIT
modifications:
- Linked against c-ares at commit 1ff6b69e.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
