    path: test/ossfuzz/json_load_dump_fuzzer.cc
  modified: false
  licence: MIT
library:
  repository: https://github.com/akheron/jansson
  commit: 851a2145e3256f2e67e5dfe24b0e456bf198b741
  licence: MIT
modifications:
- Linked against jansson at commit 851a2145.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
