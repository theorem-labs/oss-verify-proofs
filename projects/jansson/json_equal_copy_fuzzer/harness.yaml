schema: oss-fuzz-theorems/harness/1
project: jansson
harness: json_equal_copy_fuzzer
rocq: OSSVerify.jansson.json_equal_copy_fuzzer
origin: upstream
summary: 'json_loadb with 5 fuzz-selected load flags, then one of: json_deep_copy + json_equal(root, copy);
  json_copy + json_equal(root, shallow); json_equal(root, root); json_object_update into an empty object;
  json_object_update_existing between two deep copies. Every json_equal return value is DISCARDED, so
  a deep copy that differs from its source is not detected.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/json_equal_copy_fuzzer.cc
  from:
    repository: https://github.com/akheron/jansson
    commit: 851a2145e3256f2e67e5dfe24b0e456bf198b741
    path: test/ossfuzz/json_equal_copy_fuzzer.cc
  modified: false
  licence: MIT
library:
  repository: https://github.com/akheron/jansson
  commit: 851a2145e3256f2e67e5dfe24b0e456bf198b741
  licence: MIT
modifications:
- Linked against jansson at commit 851a2145.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
