schema: oss-fuzz-theorems/harness/1
project: jansson
harness: json_pack_unpack_fuzzer
rocq: OSSVerify.jansson.json_pack_unpack_fuzzer
origin: upstream
summary: json_loadb (DECODE_ANY|ALLOW_NUL), json_deep_copy (freed unread), json_dumps under one of 5 flag
  sets, then json_loads of the dump; the comment calls this a 'round-trip check' but the reparsed value
  is only freed, never compared, and a NULL reparse is ignored. Then json_unpack with "o", "{s?o}" and
  "[o!]", results unused.
entry: LLVMFuzzerTestOneInput
