schema: oss-fuzz-theorems/harness/1
project: bzip2
harness: bzip2_fd
rocq: OSSVerify.bzip2.bzip2_fd
origin: oss-fuzz
summary: BZ2_bzWrite the input to a temp file, then BZ2_bzRead it back through BZ2_bzdopen; the bytes
  read are discarded, never compared with the input (a missed round-trip opportunity).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/bzip2_fd.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/bzip2/bzip2_fd.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://sourceware.org/git/bzip2
  commit: f5dfc96063fef2d9c5446d0733867d899ef9b942
  licence: bzip2-1.0.6
modifications:
- Linked against bzip2 at commit f5dfc960.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
