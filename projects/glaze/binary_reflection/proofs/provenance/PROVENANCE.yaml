proofs:
  origin: final-anthropic-opensource-formal-verification-proofs-package-2026-10-21 (sha256 4c6c152f61ce538e439b9d2adef439f4dbe1a2d446767d84ac7c3946d7c6687a),
    libraries/glaze/proofs/submission-1 and libraries/openssl-b/proofs/submission-1
  licence: Apache-2.0 OR MIT
  texts:
  - LICENSES/anthropic-proofs-LICENSE
  - LICENSES/anthropic-proofs-LICENSE-MIT
  - LICENSES/anthropic-proofs-NOTICE
  texts_location: the repository's top directory
  modified: each changed file carries one line under its licence header saying so
flags:
  note: as written in the recipe; a library's own build system adds its flags after these (e.g. CMake Release appends
    -O3 -DNDEBUG), see the pin and recipes.sh
  lines:
  - 'recipe/tools/build-body.sh:58: OFT_NO_BUILTIN_ALLOC="-fno-builtin-malloc -fno-builtin-calloc -fno-builtin-realloc
    -fno-builtin-reallocarray -fno-builtin-free -fno-builtin-aligned_alloc -fno-builtin-posix_memalign -fno-builtin-memalign
    -fno-builtin-valloc -fno-builtin-strdup -fno-builtin-strndup"'
  - 'recipe/tools/build-body.sh:59: BASE_CFLAGS="-march=rv64g -mabi=lp64d -Os -g -ffunction-sections -fdata-sections
    -fno-stack-protector -fno-plt -Wdate-time $OFT_NO_BUILTIN_ALLOC"'
  - 'recipe/tools/build-body.sh:65: SAN=""'
  - 'recipe/tools/build-body.sh:560: SAN="-fsanitize=address"'
  - 'recipe/tools/build-body.sh:577: SAN="-fsanitize=address -fsanitize=undefined -fno-sanitize-recover=all -fsanitize-trap=all
    -fno-sanitize=function"'
  - 'recipe/tools/build-body.sh:586: SAN="-fsanitize=undefined -fno-sanitize-recover=all -fsanitize-trap=all -fno-sanitize=function"'
  - 'recipe/tools/build-body.sh:590: SAN=""'
  - 'recipe/tools/build-body.sh:618: CFLAGS="$BASE_CFLAGS $SAN -fmacro-prefix-map=$LIBROOT/=/work/build/lib/FLAVOUR/"'
  - 'recipe/tools/build-body.sh:431: ''clang --config=/opt/asan-static/musl.cfg'''
  - 'recipe/tools/build-body.sh:441: ''clang++ --config=/opt/asan-static/musl.cfg -stdlib=libc++'''
  - 'recipe/tools/build-body.sh:478: SEALED_CFG=/opt/asan-static/asan-musl-sealed.cfg'
  - 'recipe/tools/build-body.sh:1019: SILENT_LD=""'
  - 'recipe/tools/build-body.sh:1021: SILENT_LD="-Wl,--defsym=__sanitizer_silent_reports=1"'
  - 'recipe/tools/build-body.sh:1027: SILENT_LD=""'
  - 'recipe/tools/build-body.sh:1049: "$CC" $BASE_CFLAGS -static -no-pie -Wl,--gc-sections ${OFT_STRIP--Wl,--strip-all}
    \'
  - 'recipe/tools/build-body.sh:1054: "$CC" $BASE_CFLAGS -static -no-pie -Wl,--gc-sections ${OFT_STRIP--Wl,--strip-all}
    \'
  - 'recipe/targets/glaze-binary_reflection/pin:41: LIB_CFLAGS=""'
licence:
  components:
  - component: glaze
    files: header-only library (include/glaze/); harness fuzzing/binary_reflection.cpp
    licence: MIT
    evidence: 'header-only library: the link record of this build shows only the harness object from the library
      build (recipe pin: the second build_lib, pin:96-103, calls oft_build_header_only, recipes.sh:687-700); LICENSE:1-21
      of the repository (MIT, Copyright (c) 2019 - present, Stephen Berry) and include/glaze/glaze.hpp:1-31, the
      notice that every glaze header points to on its line 2 (''For the license information refer to glaze.hpp''),
      which adds an optional exception for portions embedded in object code (lines 25-30); the harness has no licence
      header, so the repository licence covers it [inferred]; the harness translation unit reads 132 headers under
      include/glaze/ (clang 20 preprocessor with the include flags of recipes.sh:1884-1926 and -std=c++23, the standard
      plain.log:5 records); the third-party code among them that is in the binaries has its own rows below'
    texts:
    - LICENSES/glaze-LICENSE
  - component: zmij (Victor Zverovich), ported in glaze include/glaze/util/zmij.hpp
    files: include/glaze/util/zmij.hpp (header-only; glz::to_chars for float and double, zmij.hpp:1116-1120, called
      from include/glaze/core/write_chars.hpp:318-321)
    licence: BSL-1.0 OR MIT
    evidence: 'zmij.hpp:4-9: header-only port of Victor Zverovich''s zmij, ''Distributed under the upstream MIT
      license (see github.com/vitaut/zmij/blob/main/LICENSE) or alternatively the Boost Software License, Version
      1.0'', Copyright (c) 2025 - present, Victor Zverovich (LICENSES/glaze-zmij-notice.txt, lines 1-22); the upstream
      LICENSE (MIT, Copyright (c) 2025 Victor Zverovich) is LICENSES/zmij-LICENSE, from github.com/vitaut/zmij at
      26b4aae7, unchanged since (same blob 0af4df9c at main a9d63631, read 2026-10-20), and upstream zmij.cc:3-5
      states the same dual licence; the BSL-1.0 text is LICENSES/boost-LICENSE_1_0.txt; the JSON writer reaches
      it for every float and double (beve_to_json.hpp:29 -> json/write.hpp:832 -> core/write_chars.hpp:318-321);
      in the binaries: its 618-entry pow10_significands table (9,888 bytes, recomputed from zmij.hpp:372-397 by
      the code of :407-436) occurs in .rodata of all four, and not in the msgpack-c or json-c binaries of this release'
    texts:
    - LICENSES/glaze-zmij-notice.txt
    - LICENSES/zmij-LICENSE
    - LICENSES/boost-LICENSE_1_0.txt
  - component: integer-to-text code from YaoYuan's itoa_yy.c (c_numconv_benchmark), refactored in glaze include/glaze/util/itoa.hpp
      and itoa_40kb.hpp
    files: include/glaze/util/itoa.hpp:73-181 and include/glaze/util/itoa_40kb.hpp:47-250 (header-only; integer
      output of include/glaze/core/write_chars.hpp:339-372)
    licence: MIT
    evidence: 'glaze''s itoa.hpp said ''Refactored from: github.com/ibireme/c_numconv_benchmark/blob/master/src/itoa/itoa_yy.c''
      and carried YaoYuan''s notice (LICENSES/glaze-itoa-yy-notice.txt) from glaze 8a71d081 (2022-11-16) to 820a66d5
      (2025-02-07) (lines 6 and 31-32 there); glaze 080bc362 (2026-01-05) dropped the notice and kept the code:
      at dce5e0f7 itoa.hpp:73-181 has itoa_yy.c''s decomposition (u64_len_8, u64_len_4, u64_len_1_8, u64_len_5_8
      against itoa_impl_len_8/_4/_1_to_8/_5_to_8, itoa_yy.c:172-275), its variable names and its division constants
      (*5243>>19, *429497>>32, *109951163>>40, *3518437209>>45), and itoa_40kb.hpp:8-9 still names itoa_yy.c as
      its source; that the current code is still a derivative is [inferred] from this; itoa_yy.c:24-25 and the repository''s
      LICENSE (MIT, Copyright (c) 2020 YaoYuan; LICENSES/c_numconv_benchmark-LICENSE, from github.com/ibireme/c_numconv_benchmark
      at bdacf333; notice quoted in LICENSES/glaze-itoa-yy-notice.txt); in the binaries: the products with those
      constants shifted right by 19, 32 and 40 occur in .text of all four (18-19, 8 and 6-21 sites per binary),
      in none of the msgpack-c or json-c binaries of this release, and itoa_40kb''s 40,000-byte digit_quads table
      (itoa_40kb.hpp:30-45) is in .rodata of all four'
    texts:
    - LICENSES/glaze-itoa-yy-notice.txt
    - LICENSES/c_numconv_benchmark-LICENSE
