schema: oss-fuzz-theorems/harness/1
project: arduinojson
harness: json_fuzzer
rocq: OSSVerify.arduinojson.json_fuzzer
origin: upstream
summary: deserializeJson into a JsonDocument; if it succeeded, serializeJson to a std::string. The re-serialised
  text is never compared to the input or re-parsed (no roundtrip check).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/json_fuzzer.cpp
  from:
    repository: https://github.com/bblanchon/ArduinoJson
    commit: 1cd478f48e7c4cd142a0bd26ee17d63d70d04e3f
    path: extras/fuzzing/json_fuzzer.cpp
  modified: false
  licence: MIT
library:
  repository: https://github.com/bblanchon/ArduinoJson
  commit: 1cd478f48e7c4cd142a0bd26ee17d63d70d04e3f
  licence: MIT
modifications:
- Linked against ArduinoJson at commit 1cd478f4.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
