schema: oss-fuzz-theorems/harness/1
project: arduinojson
harness: msgpack_fuzzer
rocq: OSSVerify.arduinojson.msgpack_fuzzer
origin: upstream
summary: deserializeMsgPack into a JsonDocument; if it succeeded, serializeMsgPack to a std::string; output
  never compared.
entry: LLVMFuzzerTestOneInput
source:
