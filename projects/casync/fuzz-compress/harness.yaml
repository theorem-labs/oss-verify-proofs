schema: oss-fuzz-theorems/harness/1
project: casync
harness: fuzz-compress
rocq: OSSVerify.casync.fuzz_compress
origin: upstream
summary: 24-byte header picks the compression alg; compressor_start_decode/compressor_input/compressor_decode
  into a MAX(size,128)-byte buffer; every error is log_debug_errno + return 0 and the decoded bytes are
  never inspected.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz-compress.c
  from:
    repository: https://github.com/systemd/casync
    commit: b4b7e5606f785572b78a43626a27a45fe3df2fbd
    path: test/fuzz/fuzz-compress.c
  modified: false
  licence: LGPL-2.1+
library:
  repository: https://github.com/systemd/casync
  commit: b4b7e5606f785572b78a43626a27a45fe3df2fbd
  licence: NOASSERTION
modifications:
- Linked against casync at commit b4b7e560 with 5 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
