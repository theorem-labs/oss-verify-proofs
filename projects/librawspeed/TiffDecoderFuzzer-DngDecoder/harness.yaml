project: librawspeed
harness: TiffDecoderFuzzer-DngDecoder
rocq: OSSVerify.librawspeed.TiffDecoderFuzzer_DngDecoder
origin: upstream
summary: TiffParser::parse, isAppropriateDecoder (result ignored), then the chosen TIFF-based decoder
  (Arw, Cr2, Dcr, Dcs, Dng, Erf, Iiq, Kdc, Mef, Mos, Nef, Orf, Pef, Rw2, Srw, Sti, Threefr) decodeRaw
  + decodeMetaData with empty camera metadata; output never checked.
entry: LLVMFuzzerTestOneInput
