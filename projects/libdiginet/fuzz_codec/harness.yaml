checks:
- kind: reference-oracle
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_codec.c:256-281
  what: Each desk personality is the one the protocol documentation describes and is found by its announce name; three
    other names ("CNTRL|2", "MAINUNITS" and the empty name) give no desk.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_codec.c:283-291
  what: The sysex encoder never succeeds for the system-family function 0x70.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_codec.c:293-314
  what: Each encoder succeeds exactly for the arguments its header comment allows, otherwise fails with the documented code
    and leaves the output command untouched.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_codec.c:316-344
  what: Each successful encoder writes the message the protocol documentation gives for the control, byte for byte, with a
    key naming its address, and marks only scribble and counter writes as display writes.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_codec.c:431-452
  what: The scribble text helper writes the documented characters and reports how many input bytes it used.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_codec.c:454-466
  what: The seven-segment helper lights, for each character, the segments a seven-segment display shows for it.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_codec.c:468-490
  what: The counter text helper places digits and dots as the header documents.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_codec.c:492-519
  what: The meter mask and segment count and the ring dot and fill helpers light exactly what they name.
