schema: oss-fuzz-theorems/harness/1
project: libdiginet
harness: fuzz_codec
rocq: OSSVerify.libdiginet.fuzz_codec
origin: upstream
summary: Reads the input as up to 256 operations, each calling one of the library's control encoders (fader, button, touch,
  V-Pot, jog, ring, meter, LEDs, scribble strip, counter, sysex) or text and display helpers with arguments taken from the
  input, for no desk, a Control|24 or a ProControl. Each result is compared with the bytes and ranges the protocol documentation
  and the library's header give, worked out by the harness itself. Inputs of 64 MiB or more are ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_codec.c
  - source/fuzz.h
  - source/spec.h
  from:
    repository: https://github.com/FreeMixer/libdiginet
    commit: 835f336ccb7abac683681c5791a5715041c71e32
    path: fuzz/fuzz_codec.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/FreeMixer/libdiginet
  commit: 835f336ccb7abac683681c5791a5715041c71e32
  version: 0.1.1
  licence: GPL-3.0-or-later
modifications:
- 'Linked against libdiginet at commit 835f336c: the frame, command cursor, controls and decoder sources and the session state
  machine, built into one static library. The packet socket and descriptor io are not built; the library''s own libFuzzer
  build uses the same sources.'
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the fuzz target one to four times and prints each return value.
