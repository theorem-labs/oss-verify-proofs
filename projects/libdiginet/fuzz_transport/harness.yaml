schema: oss-fuzz-theorems/harness/1
project: libdiginet
harness: fuzz_transport
rocq: OSSVerify.libdiginet.fuzz_transport
origin: upstream
summary: 'Runs the library''s control-surface session state machine with the harness as its network io and clock. A config
  is read from the input, then up to 1024 operations: raw or built desk frames, announces, time passing, submitted commands,
  wake, close, a failing send, and polls. The harness runs its own model of the documented session alongside and holds every
  frame sent, every notice, the state, the timers and the command queue to that model. Inputs of 64 MiB or more are ignored.'
entry: LLVMFuzzerTestOneInput
