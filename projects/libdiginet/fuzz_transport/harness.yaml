  from:
    repository: https://github.com/FreeMixer/libdiginet
    commit: 835f336ccb7abac683681c5791a5715041c71e32
    path: fuzz/fuzz_transport.c
  modified: true
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/FreeMixer/libdiginet
  commit: 835f336ccb7abac683681c5791a5715041c71e32
  version: 0.1.1
  licence: GPL-3.0-or-later
modifications:
- 'Changed by OSS Verify in one file, fuzz/fuzz_transport.c (in source/ as built): io_recv() runs the harness''s model on
  each frame it hands to the session, just before the session reads it, and the poll''s tick alone on an empty frame; receive()
  no longer runs the model before diginet_session_poll(). No library code changes.'
- 'Why: when the input has poll''s recv hand over the same frame twice, the model judged the second copy against the frame
  in flight before the poll. When that copy is the desk''s acknowledgement of a command the poll''s tick sent, the session''s
  acked notice is right, and the harness aborted on it.'
- 'Linked against libdiginet at commit 835f336c: the frame, command cursor, controls and decoder sources and the session state
  machine, built into one static library. The packet socket and descriptor io are not built; the library''s own libFuzzer
  build uses the same sources.'
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the fuzz target one to four times and prints each return value.
