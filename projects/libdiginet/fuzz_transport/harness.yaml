checks:
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_transport.c:1160-1167
  what: The session accepts every configuration the harness builds, each within the documented ranges.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_transport.c:398-420
  what: Every frame the session sends is a well-formed frame from this host to the known desk, zero-padded to 60 bytes, with
    the right header sum, and never holds the system family F0 13 xx 70.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_transport.c:422-430
  what: Each acknowledgement the session sends echoes the send counter of the desk frame it answers, with no body and retry
    0.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_transport.c:432-495
  what: A new data frame goes only while online, with nothing in flight and no back-off holding; a retransmission is the frame
    in flight again, byte for byte but its retry field, which counts 1, 2, ... never past the retry limit, and goes no sooner
    than the timeout; the acked notice names the frame in flight; the ack-lost notice comes for it after exactly the retry
    limit.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_transport.c:497-569
  what: Online only after the desk acknowledges the wake frame and an e1 names this host since then; no wake frame while the
    desk is in a session with another host, and a wake returns the documented code; each desk announce notice carries the
    place of this host address, the desk type, the version and the name, and each desk data notice its body, counter and retry.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_transport.c:571-580
  what: 'A keepalive goes only when due on its own clock, while online, with nothing in flight and no back-off holding: never
    early.'
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_transport.c:582-654
  what: Each sent data frame stays within the command and body limits and carries the host counter advanced by its commands;
    with tagged commands, its count is right, it carries only commands submitted and still pending, and a frame with display
    writes follows the last by at least the configured gap.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_transport.c:656-676
  what: Submit refuses a command holding F0 13 xx 70 and nothing else as such, and refuses for a full queue only when 512
    commands are pending.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_transport.c:680-688
  what: After each operation, the session has acknowledged each desk data frame owed an acknowledgement once each time it
    came, and no other frame.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_transport.c:690-742
  what: After each operation, a wake frame went exactly when the host woke and a close frame exactly when owed; each desk
    data frame but a keepalive or a repeat, each announce and each foreign session was noticed as owed; and the state changed
    exactly as the header diagram says, in order, each change naming its reason.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_transport.c:744-771
  what: After each operation, an acknowledgement of the frame in flight was taken and noticed, a frame in flight still unacknowledged
    after the timeout was sent again or dropped, and the reported deadline is from now to one second away and never later
    than the next retransmission.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_transport.c:773-783
  what: 'After each operation, with tagged commands, a keepalive due while online with nothing in flight and no back-off holding
    has gone: never skipped.'
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_transport.c:785-819
  what: With tagged commands, after each operation the queue holds exactly the pending commands in order, a newer command
    in its key place, and after a tick a command that may go has gone.
