checks:
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_decode.c:41-115
  what: 'The command cursor gives each step the grammar gives: the end only at the end, each message with its place, length,
    status, running-status flag and data bytes or sysex payload, and each refusal with the cursor and running status the grammar
    leaves.'
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_decode.c:152-263
  what: The decoder turns each step into the control the protocol documentation describes (keys, touches, faders with their
    low byte, jog and V-Pot deltas, rings, meters, LEDs, scribble and counter writes, system and other messages), with every
    field right.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_decode.c:265-276
  what: The body check refuses a body exactly when it holds the system-family sequence F0 13 xx 70, whole or cut short.
failure_handlers: none
