schema: oss-fuzz-theorems/harness/1
project: libdiginet
harness: fuzz_decode
rocq: OSSVerify.libdiginet.fuzz_decode
origin: upstream
summary: The first byte picks a desk type (none, Control|24 or ProControl) and whether the rest is a whole Ethernet frame
  or just a frame body; the rest is copied into an allocation of its exact length, and in frame mode the body the grammar
  reads in it is used. The harness steps through the command stream with the library cursor and decoder and with its own reader
  written from the protocol grammar, comparing every message, refusal, cursor position and decoded control, and checks the
  system-family refusal of the whole body. Inputs of 64 MiB or more are ignored.
entry: LLVMFuzzerTestOneInput
