checks:
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_frame.c:34-63
  what: The parser refuses exactly the frames the protocol grammar refuses (too short, wrong EtherType, a length field under
    16 or past the buffer), each with its documented error code.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_frame.c:65-112
  what: For an accepted frame, every header field, both MAC addresses, the EtherType, the body and its padding, the 16-bit
    body sum and whether the header carries it, the Digidesign OUI test of the source address and the keepalive test are what
    the protocol grammar reads at the same offsets.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_frame.c:114-200
  what: From the fields the grammar reads, the frame builder makes, in both sum modes, exactly the frame the harness builds
    itself from the protocol (sum or zero, padding to 60 bytes included); it refuses a body past 1484 bytes, a body holding
    the system family and a buffer one byte short, and writes nothing into a refused buffer.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_frame.c:212-263
  what: The announce reader accepts only an e0 or e1 frame of at least 33 body bytes and reads the unknown bytes, the version
    and the name at their documented offsets, each cut and terminated as documented.
failure_handlers: none
