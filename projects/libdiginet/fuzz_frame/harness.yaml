schema: oss-fuzz-theorems/harness/1
project: libdiginet
harness: fuzz_frame
rocq: OSSVerify.libdiginet.fuzz_frame
origin: upstream
summary: Treats the input as one Ethernet frame (checksum excluded), copied into an allocation of its exact length. It parses
  the frame with the library and with its own reader written from the protocol grammar, then compares the refusal codes and
  every header field, rebuilds the frame from the parsed fields and compares it byte for byte with the grammar's frame, and
  checks the announce reader on announce frames. Inputs of 64 MiB or more are ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_frame.c
  - source/fuzz.h
  - source/spec.h
  from:
    repository: https://github.com/FreeMixer/libdiginet
    commit: 835f336ccb7abac683681c5791a5715041c71e32
    path: fuzz/fuzz_frame.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/FreeMixer/libdiginet
  commit: 835f336ccb7abac683681c5791a5715041c71e32
  version: 0.1.1
  licence: GPL-3.0-or-later
modifications:
- 'Linked against libdiginet at commit 835f336c: the frame, command cursor, controls and decoder sources and the session state
  machine, built into one static library. The packet socket and descriptor io are not built; the library''s own libFuzzer
  build uses the same sources.'
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the fuzz target one to four times and prints each return value.
