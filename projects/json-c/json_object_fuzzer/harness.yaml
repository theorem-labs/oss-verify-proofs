schema: oss-fuzz-theorems/harness/1
project: json-c
harness: json_object_fuzzer
rocq: OSSVerify.json_c.json_object_fuzzer
origin: upstream
summary: Parses a short string, calls every json_object_get_* getter, json_c_visit, every setter with
  fuzzed values, then json_object_deep_copy; no result is compared (e.g. set then get is not checked).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/json_object_fuzzer.cc
  from:
    repository: https://github.com/json-c/json-c
    commit: d17ad9d1863ebbf39993706140bf67847b7add0f
    path: fuzz/json_object_fuzzer.cc
  modified: false
  licence: MIT
library:
  repository: https://github.com/json-c/json-c
  commit: d17ad9d1863ebbf39993706140bf67847b7add0f
  licence: MIT
modifications:
- Linked against json-c at commit d17ad9d1.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
