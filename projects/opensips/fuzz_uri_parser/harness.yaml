schema: oss-fuzz-theorems/harness/1
project: opensips
harness: fuzz_uri_parser
rocq: OSSVerify.opensips.fuzz_uri_parser
origin: upstream
summary: parse_uri on a NUL-terminated copy of the input into a stack sip_uri; return code and parsed
  fields ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_uri_parser.c
  from:
    repository: https://github.com/OpenSIPS/opensips
    commit: 61ae3165203824c59c4bd6724502d31018d6d46f
    path: test/fuzz/fuzz_uri_parser.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/OpenSIPS/opensips
  commit: 61ae3165203824c59c4bd6724502d31018d6d46f
  licence: NOASSERTION
modifications:
- Linked against opensips at commit 61ae3165 with 2 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
