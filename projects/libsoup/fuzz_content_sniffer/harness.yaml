project: libsoup
harness: fuzz_content_sniffer
rocq: OSSVerify.libsoup.fuzz_content_sniffer
origin: upstream
summary: soup_content_sniffer_sniff over the input bytes under seven declared Content-Types; the sniffed
  type is freed unexamined.
entry: LLVMFuzzerTestOneInput
source:
  files:
