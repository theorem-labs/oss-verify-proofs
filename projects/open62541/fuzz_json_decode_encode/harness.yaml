licence: NOASSERTION
checks:
- kind: roundtrip
  strength: full
  stops_with: assert
  live: false
  where: source/fuzz_json_decode_encode.cc:45-53
  what: decodeJson(encodeJson(v)) == v for any Variant v that decodeJson accepted, compared with UA_order
    == UA_ORDER_EQ (full deep equality); the second decode must also return GOOD (BADOUTOFMEMORY excused).
- kind: idempotence
  strength: full
  stops_with: assert
  live: false
  where: source/fuzz_json_decode_encode.cc:67-68
  what: 'encodeJson is stable across a decode/encode cycle: the second encoding is byte-identical to the
    first (length and memcmp).'
