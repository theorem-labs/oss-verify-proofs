project: open62541
harness: fuzz_json_decode_encode
rocq: OSSVerify.open62541.fuzz_json_decode_encode
origin: upstream
summary: 'Checks 3 properties (listed below); the first, a round trip: decodeJson(encodeJson(v)) == v
  for any Variant v that decodeJson accepted, compared with UA_order == UA_ORDER_EQ (full deep equality);
  the second decode must also return GOOD (BADOUTOFMEMORY excused).'
entry: LLVMFuzzerTestOneInput
