licence: NOASSERTION
checks:
- kind: api-contract
  strength: full
  stops_with: assert
  live: false
  where: source/fuzz_attributeoperand.cc:40-53
  what: For any successfully parsed operand, print succeeds, re-parsing the printed text succeeds and
    re-printing succeeds (only BADOUTOFMEMORY from the payload-driven allocation budget is excused).
- kind: roundtrip
  strength: full
  stops_with: assert
  live: false
  where: source/fuzz_attributeoperand.cc:45-56
  what: 'parse(print(parse(s))) is structurally equal to parse(s): UA_AttributeOperand_parse of the printed
    operand gives an operand UA_equal to the first parse.'
- kind: idempotence
  strength: full
  stops_with: assert
  live: false
  where: source/fuzz_attributeoperand.cc:50-55
  what: 'print is a fixed point after one parse/print cycle: print(parse(print(ao))) == print(ao), full
    string equality.'
