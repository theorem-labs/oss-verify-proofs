    path: tests/fuzz/fuzz_attributeoperand.cc
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/open62541/open62541
  commit: 12b72510faae152bb9ec9fc7084063d7e1b00da3
  licence: NOASSERTION
modifications:
- Linked against open62541 at commit 12b72510.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
