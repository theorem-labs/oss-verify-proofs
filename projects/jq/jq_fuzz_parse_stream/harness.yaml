schema: oss-fuzz-theorems/harness/1
project: jq
harness: jq_fuzz_parse_stream
rocq: OSSVerify.jq.jq_fuzz_parse_stream
origin: upstream
summary: Streaming jv_parser over the input; every value is freed unchecked until the parser returns an
  invalid value.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/jq_fuzz_parse_stream.c
  from:
    repository: https://github.com/jqlang/jq
    commit: 41b8edfe5437fcd25a072081c05f9f770f9e9b85
    path: tests/jq_fuzz_parse_stream.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/jqlang/jq
  commit: 41b8edfe5437fcd25a072081c05f9f770f9e9b85
  licence: MIT
modifications:
- Linked against jq at commit 41b8edfe.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
