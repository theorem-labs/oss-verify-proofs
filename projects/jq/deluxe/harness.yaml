project: jq
harness: deluxe
rocq: OSSVerify.jq.deluxe
origin: upstream
summary: onig_new_deluxe with fuzzed pattern/target encodings, then onig_search; results and errors only
  printed to stdout.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/deluxe.c
  from:
    repository: https://github.com/kkos/oniguruma
