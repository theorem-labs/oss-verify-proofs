schema: oss-fuzz-theorems/harness/1
project: jq
harness: base
rocq: OSSVerify.jq.base
origin: upstream
summary: Otherwise compile a fuzzed pattern with fuzzed encoding/options and search two strings (the pattern
  bytes and the remaining input); match results only printed under STANDALONE.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/base.c
  from:
    repository: https://github.com/kkos/oniguruma
    commit: 4ef89209a239c1aea328cf13c05a2807e5c146d1
    path: harnesses/base.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/jqlang/jq
  commit: 41b8edfe5437fcd25a072081c05f9f770f9e9b85
  licence: MIT
modifications:
- Linked against jq at commit 41b8edfe.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
