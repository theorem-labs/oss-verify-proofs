project: libidn
harness: libidn_tounicode_fuzzer
rocq: OSSVerify.libidn.libidn_tounicode_fuzzer
origin: upstream
summary: idna_to_unicode_44i/_4z4z/_8z4z (4-byte-aligned sizes) and idna_to_unicode_8z8z/_8zlz/_lzlz with
  two flag sets; outputs freed unchecked (no to_ascii/to_unicode roundtrip).
entry: LLVMFuzzerTestOneInput
