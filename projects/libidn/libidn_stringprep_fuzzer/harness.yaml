schema: oss-fuzz-theorems/harness/1
project: libidn
harness: libidn_stringprep_fuzzer
rocq: OSSVerify.libidn.libidn_stringprep_fuzzer
origin: upstream
summary: Runs the NUL-terminated input (<=2048 B) through stringprep_profile(Nodeprep), pr29_8z, tld_*
  checks (WITH_TLD), stringprep_utf8_nfkc_normalize, utf8<->unichar, stringprep nameprep (with and without
  NO_UNASSIGNED) and, for 4-byte-aligned sizes, stringprep_4zi xmpp_nodeprep and tld_*_4z; every result
  is ignored or only freed.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/libidn_stringprep_fuzzer.c
  from:
    repository: https://git.savannah.gnu.org/git/libidn
    commit: 7ade613c681d4a24d657110f7bdef28639e884cb
    path: fuzz/libidn_stringprep_fuzzer.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://git.savannah.gnu.org/git/libidn
  commit: 7ade613c681d4a24d657110f7bdef28639e884cb
  licence: NOASSERTION
modifications:
- Linked against libidn at commit 7ade613c.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
