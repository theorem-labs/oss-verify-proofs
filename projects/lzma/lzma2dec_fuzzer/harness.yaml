    path: lzma2dec_fuzzer.cc
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/fancycode/lzma-fuzz
  commit: d25e63d8f6b8186d04146cb19405bc5ad565412e
  licence: NOASSERTION
modifications:
- Linked against lzma-fuzz at commit d25e63d8 with 2 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
