schema: oss-fuzz-theorems/harness/1
project: arrow
harness: arrow-ipc-file-fuzz
rocq: OSSVerify.arrow.arrow_ipc_file_fuzz
origin: upstream
summary: 'Checks 2 properties (listed below); the first, a differential check: Differential IPC reading:
  the file reader without and with PreBufferMetadata, and (when the file read succeeded, schemas match
  incl. metadata, batch counts and endianness agree) the stream reader over the same bytes, must produce
  identical batches (RecordBatch::Equals with nans_equal) and identical custom metadata; a mismatch aborts.'
entry: LLVMFuzzerTestOneInput
