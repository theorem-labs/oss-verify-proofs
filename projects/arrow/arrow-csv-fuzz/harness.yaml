schema: oss-fuzz-theorems/harness/1
project: arrow
harness: arrow-csv-fuzz
rocq: OSSVerify.arrow.arrow_csv_fuzz
origin: upstream
summary: Five readers (serial table, threaded table, streaming, CountRowsAsync with and without newlines_in_values)
  run on the same bytes; their tables / row counts are NOT compared with each other.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz.cc
  from:
    repository: https://github.com/apache/arrow
    commit: 70f5c269ae8d154f57f7a7ec6babe6e0685ed6ec
    path: cpp/src/arrow/csv/fuzz.cc
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/apache/arrow
  commit: 70f5c269ae8d154f57f7a7ec6babe6e0685ed6ec
  licence: NOASSERTION
modifications:
- Linked against arrow at commit 70f5c269.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
