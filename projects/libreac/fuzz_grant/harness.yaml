checks:
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_grant.c:201-253
  what: 'A head-amp cell is set exactly when its channel and value are legal and then reads back as set, an unknown parameter
    has no value, and every unset cell carries the stated enrolling default: phantom off, pad off, and a SENS that is not
    zero.'
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_grant.c:256-294
  what: A box is admitted, at the base and width it asked for, exactly when its slots are a positive width of at most REAC_GRANT_MAX_WIDTH
    inside the head-amp space; a refused one leaves the caller's allocation unchanged.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_grant.c:94-113
  what: Every sweep row is a cd ea link-4 SINGLE block whose bytes from offset 2 sum to zero.
- kind: roundtrip
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_grant.c:116-170
  what: A group-A row, framed as a master stamps it, parses back as a HEADAMP record of its channel, parameter and the value
    the input last set for that cell (or the default), with its record and block checksums closed.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_grant.c:301-358
  what: A sweep has REAC_GRANT_SWEEP_LEN rows or is refused for a smaller buffer; its two head frames are the measured ones
    byte for byte, its group-A rows are one per allocated channel per parameter in the measured order, and group B is the
    identity poll for the addresses and sizes the header names.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_grant.c:373-385
  what: The sweep builder admits a hand-built allocation on the same terms as reac_grant_allocate and refuses NULL arguments.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_grant.c:398-448
  what: The head-amp scheduler only emits a channel, parameter and value the table can hold, with the value the input last
    set (or the default), for a cell the input set or one inside the armed scene, and sends an unset cell at most once.
