schema: oss-fuzz-theorems/harness/1
project: libreac
harness: fuzz_ctrl
rocq: OSSVerify.libreac.fuzz_ctrl
origin: upstream
summary: 'Reads the payload as our MAC, a mode byte and up to 256 length-prefixed frames, each in its own allocation, and
  runs every frame through libreac''s control-plane parsers: reac_ctrl_parse, the checksum and head-amp record checks, the
  box classifier, the identity reply, the two-fragment identity reassembly and the catalogue match, and for a frame of at
  least 50 bytes with EtherType 0x8819 the port-table decode. When the mode byte asks, it first builds a catalogue row''s
  blocks with reac_ctrl_build_as and parses them back.'
entry: LLVMFuzzerTestOneInput
