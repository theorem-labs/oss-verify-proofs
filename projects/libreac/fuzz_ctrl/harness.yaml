checks:
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_ctrl.c:285-305
  what: reac_ctrl_parse answers NONE exactly for a frame shorter than 50 bytes or not 0x8819, gives the same verdict with
    a NULL output, and its verdict is the kind it stores, which always has a name.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_ctrl.c:414-466
  what: The parser reads the addresses and counter where the frame holds them and calls a frame FILLER exactly for type 00
    00; the block and head-amp record checksum checks agree with sums the harness computes, and a head-amp record is only
    a link-4 SINGLE.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_ctrl.c:98-171
  what: Both port decoders refuse the same blocks, leaving the output untouched; a decoded port table counts each slot code
    as its own kind in whole 4-channel slots, accounts for all twelve slots, names the first unknown code, and gives the head-amp
    base from the chassis strap.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_ctrl.c:310-405
  what: An identity reply comes only from a frame with a closed block checksum, its payload lies where the record puts it
    inside the frame, its record checksum closes and its address is the record's own; a reassembled record lies inside the
    reassembly buffer, closes its checksum and carries the joined record's own address (its bytes 9 and 10), and a corrupt
    frame leaves the reassembly state unchanged.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_ctrl.c:470-513
  what: The box classifier answers only for a Roland-OUI source that is not us, with a closed block checksum outside FILLER,
    and with one of its six events; only a config-announce matches a catalogue row, and it is the first row whose declaration
    is the frame's block.
- kind: roundtrip
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_ctrl.c:531-653
  what: Every block reac_ctrl_build_as emits for a catalogue row has a legal geometry and parses back as its kind; the config
    block's checksum closes, it is the row's declaration, the catalogue match recognises it and it declares the row's widths;
    its identity replies and reassembled records give the row's firmware, REAC version and, where the row has an identity
    record, model name.
- kind: api-contract
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_ctrl.c:669-725
  what: The catalogue is not empty, the documented refusals of a bad argument hold (NULL pointers are refused, reac_ports_unknown
    clears its code, an out-of-range kind is named "?"), and an ingested model name is NUL-terminated.
