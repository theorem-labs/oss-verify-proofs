schema: oss-fuzz-theorems/harness/1
project: libreac
harness: fuzz_disco
rocq: OSSVerify.libreac.fuzz_disco
origin: upstream
summary: 'Reads the payload as our MAC, a setup byte and up to 512 operations on a clock the input moves back and forth: classify
  a frame (each in its own allocation) and pass it through the announce gate into the discovery table, offer it to the hunt,
  or age the table, serialise it as JSON into a buffer of an input-chosen size and step the hunt.'
entry: LLVMFuzzerTestOneInput
