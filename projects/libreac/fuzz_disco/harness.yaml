checks:
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_disco.c:181-237
  what: A sighting comes from a frame of at least 50 bytes, is the frame's own source and never our MAC, its geometry is the
    frame length's (at least that, for the hunt), its role is in range, outside FILLER its block checksum closes, and a declared
    width is at most REAC_MAX_CHANNELS.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_disco.c:106-158
  what: The gate, the table and the hunt's table never hold more than REAC_DISCO_MAX peers or the same MAC twice, and every
    table role is in range.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_disco.c:251-276
  what: An observe reports 0 or 1, the table's seq moves by that report plus one on the first refusal for room, and an entry
    the table holds as a box never becomes a master.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_disco.c:277-356
  what: 'An observe changes the table as the harness calculates: a known entry takes each fact that sharpens it and the new
    time, reporting a change exactly when a fact changed; a new MAC gets an entry with the sighting''s facts; a full table
    refuses a new MAC and marks itself overflowed.'
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_disco.c:703-735
  what: Ageing removes exactly the entries a forward clock shows unheard for longer than the stale limit (none when the clock
    stepped back) and moves the table's seq on by one exactly when it removed some; a hunt step reports 0 or 1 and every verdict
    has a name.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_disco.c:749-784
  what: Classify, the gate and the hunt's observe answer only their documented values, and the hunt never reports as a master
    a peer its table holds as a box.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_disco.c:556-648
  what: A table always serialises into a buffer of REAC_DISCO_JSON_MAX bytes, and a successful serialisation is one NUL-terminated
    JSON array of the length returned with one object per entry, holding that entry's MAC, role, model, width, owned flag
    and age in ms.
