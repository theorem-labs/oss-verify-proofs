checks:
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_decode.c:152-233
  what: 'Downstream: a frame is valid only as a 1492-byte 0x8819 frame ending C2 EA with its counter at bytes 14-15; reac_decode
    decodes exactly a valid frame of a fitting even-width geometry and reac_decode_plain_le a valid fitting one, each returning
    the samples per packet, a refused decode leaves its output untouched, and each plain-LE sample is the straight copy.'
- kind: roundtrip
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_decode.c:118-125
  what: Decoding a frame's audio and braiding it again with reac_braid_encode gives back the audio region byte for byte, downstream
    and upstream, for a geometry of 12 samples or fewer.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_decode.c:88-98
  what: Every decoded sample, downstream and upstream, is the three bytes the documented braid map puts it in, the map written
    out in the harness rather than taken from the library.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_decode.c:251-303
  what: 'Upstream: reac_upstream_channels is the frame''s geometry restricted to box widths, NULL arguments are refused, and
    reac_upstream_decode succeeds exactly on a 0x8819 frame of a box geometry ending C2 EA, leaving its output untouched when
    it refuses.'
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_decode.c:334-356
  what: reac_frame_is_reac is true exactly for a frame of at least 14 bytes with EtherType 0x8819, and reac_frame_clean_len
    strips a two-byte FCS residue exactly when the length is two more than a legal geometry, and nothing else.
