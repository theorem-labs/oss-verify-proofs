schema: oss-fuzz-theorems/harness/1
project: libreac
harness: fuzz_decode
rocq: OSSVerify.libreac.fuzz_decode
origin: upstream
summary: 'Decodes the payload after its three header bytes as one REAC audio frame, in its own allocation of exactly its length,
  with libreac''s frame decoders: reac_frame_inspect, reac_decode and reac_decode_plain_le downstream, reac_upstream_decode
  upstream, and the two helpers every ingest path calls first, reac_frame_is_reac and reac_frame_clean_len. The low two bits
  of byte 0 pick the 44.1, 48 or 96 kHz mode or a geometry built from bytes 1 and 2 read as signed. A rejected frame is an
  ordinary result.'
entry: LLVMFuzzerTestOneInput
source:
