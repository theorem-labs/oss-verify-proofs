checks:
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_boxreg.c:115-159
  what: At most REAC_BOXREG_MAX_BOXES boxes, each of an even width of 2 to 40 (a rule the harness writes out itself) with
    its slice inside the fabric and a NUL-terminated name; no two slices overlap and no MAC is registered twice.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_boxreg.c:161-185
  what: No call moves a box, changes its width or its pinned flag, unbinds or rebinds its MAC, or changes any name but the
    one set_name sets.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_boxreg.c:218-283
  what: A declaration is refused for a bad width, a full table or no free range, and otherwise lands at the next index with
    the width asked for, at the pinned base or the lowest free range, pinned exactly when a base was given, unbound, with
    the name given; a refused one adds no box.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_boxreg.c:291-360
  what: add refuses a bad width or the all-zero MAC, and otherwise gives the MAC's own box, then the first unbound box of
    that width, then a new unpinned box at the lowest free range; it is idempotent and find finds what it registered.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_boxreg.c:366-382
  what: find answers -1 or the index of a box holding exactly that MAC, and never finds the all-zero MAC.
- kind: api-contract
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_boxreg.c:388-396
  what: set_name stores the name given, or the empty name for NULL, at a valid index.
