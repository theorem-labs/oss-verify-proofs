schema: oss-fuzz-theorems/harness/1
project: libreac
harness: fuzz_boxreg
rocq: OSSVerify.libreac.fuzz_boxreg
origin: upstream
summary: 'Runs up to 64 operations of the multi-box registry, reac_boxreg, from the payload: a fabric size, then declare,
  add, find and set_name calls with input-chosen widths, bases, MACs and names (each name its own allocation), on a registry
  in its own allocation. Before each call it works out the answer the header promises from the table as it was, and after
  every call it checks the whole registry.'
entry: LLVMFuzzerTestOneInput
source:
