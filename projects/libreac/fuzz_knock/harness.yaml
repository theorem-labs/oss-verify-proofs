checks:
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_knock.c:59-68
  what: init starts a knock that listens, has no licence, and opened at the start time.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_knock.c:87-113
  what: A step answers NONE or DRIVE; DRIVE comes at most once and with the licence set, and only at least REAC_KNOCK_LISTEN_NS
    after the wire came up and after the last frame heard.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_knock.c:115-129
  what: 'The licence is not withheld: a step at or after that time, with nothing heard since and no licence yet granted, drives.'
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_knock.c:131-154
  what: granted is set exactly when DRIVE has come, and a later frame does not revoke it; the state is PROVEN after DRIVE,
    else CANCELLED after a frame, else LISTENING.
