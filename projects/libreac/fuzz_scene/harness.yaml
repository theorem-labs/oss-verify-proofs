schema: oss-fuzz-theorems/harness/1
project: libreac
harness: fuzz_scene
rocq: OSSVerify.libreac.fuzz_scene
origin: upstream
summary: 'Builds a scene body of an input-chosen length (its own allocation) from libreac''s placeholder scene XORed with
  the payload, then calls the scene-push framing on it: reac_ctrl_build_scene_step at an input-chosen step, optionally the
  whole 343-step transfer, reac_ctrl_scene_set_mac and reac_ctrl_scene_build. A refused body or step is an ordinary result.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_scene.c
  from:
    repository: https://github.com/FreeREAC/libreac
    commit: d16f3f4eba605ee2cb9e7a70bf72685f1b7b5d25
    path: fuzz/fuzz_scene.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/FreeREAC/libreac
  commit: d16f3f4eba605ee2cb9e7a70bf72685f1b7b5d25
  version: 1.9.0
  licence: GPL-3.0-or-later
modifications:
- Linked against a static libreac.a of every src/*.c of libreac 1.9.0 at commit d16f3f4e, compiled with each build's flags,
  as libreac's Makefile builds its fuzz targets but with this toolchain in place of a native clang and libFuzzer.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the fuzz target one to four times and prints each return value.
