checks:
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_scene.c:236-254
  what: The step builder accepts exactly a body of REAC_SCENE_BYTES and a step in [0, REAC_SCENE_STEPS), refuses everything
    else, and a refused step writes nothing into the block.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_scene.c:83-137
  what: A built step is a cd ea link-1 bulk block whose bytes sum to zero, carries its FIRST, MIDDLE or LAST segment, declares
    its share of the body and carries the body's bytes at that offset; the LAST step ends with the fixed 12-byte trailer.
- kind: roundtrip
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_scene.c:140-163
  what: reac_ctrl_parse reads every built step back as SCENE_TRANSFER with the link, segment, opcode and length it was built
    with, and its block checksum check accepts it.
- kind: roundtrip
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_scene.c:175-202
  what: A whole body is accepted at every step, the step payloads concatenated in order are the body byte for byte, and their
    lengths sum to the total the first step declares.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_scene.c:266-329
  what: set_mac and scene_build each accept exactly a REAC_SCENE_BYTES body, and a refused call writes nothing; set_mac writes
    the MAC at REAC_SCENE_MAC_OFF and nothing else, and scene_build makes the body zeros, the three tags and the MAC.
