schema: oss-fuzz-theorems/harness/1
project: libreac
harness: fuzz_identity
rocq: OSSVerify.libreac.fuzz_identity
origin: upstream
summary: Reads the payload as up to 64 identity-page records (a 16-bit address, biased onto the three modelled ones, and a
  payload in its own allocation) fed to reac_identity_ingest, each a second time with a guard byte after it, then as the box
  family, channel widths, capacities and a firmware value with which it calls the firmware and REAC-version formatters, reac_box_name
  and the catalogue defect check, each output buffer its own allocation of the chosen size.
entry: LLVMFuzzerTestOneInput
source:
