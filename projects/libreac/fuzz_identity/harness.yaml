checks:
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_identity.c:180-237
  what: The decode reads no byte past the length it is given (a guard byte after the payload changes nothing), an ignored
    record changes nothing, and a well-formed firmware, REAC-version or model-name record is never ignored.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_identity.c:239-332
  what: An accepted firmware reply is four decimal digits printed as D.DDD, a model name is the payload's text after its first
    byte, up to its first NUL or the name field's capacity, and never empty, and a REAC-version record keeps its eight bytes,
    decodes the last three words big-endian and prints as major.minor with a patch of two digits or more; no other address
    is accepted.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_identity.c:167-175
  what: Each formatter either refuses or writes a NUL-terminated string of the length it returns inside the capacity it was
    given.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_identity.c:395-411
  what: The firmware formatter prints any value as its whole part, '.', and three digits, also when the whole part has two
    digits.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_identity.c:367-374
  what: The box family is the one the last accepted REAC-version record names in the documented table, and UNKNOWN with no
    such record or one no row names.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_identity.c:413-530
  what: reac_box_name refuses a NULL name buffer or a bad width, and with good widths succeeds exactly when each buffer holds
    its string; the name is the sent name or family stem plus the two-digit widths, the token is the name lower-cased with
    its first '-' dropped, the display is "<name> (<in> in / <out> out)", and the catalogue defect mask flags exactly a width
    or display mismatch.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_identity.c:341-355
  what: The documented refusals of NULL arguments hold.
