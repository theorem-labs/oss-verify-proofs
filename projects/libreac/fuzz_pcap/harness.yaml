schema: oss-fuzz-theorems/harness/1
project: libreac
harness: fuzz_pcap
rocq: OSSVerify.libreac.fuzz_pcap
origin: upstream
summary: Reads the payload as a record-buffer capacity and a pcap file, which pcap_source_open opens through a stand-in for
  fopen that answers one path with fmemopen over a copy of that file. It reads every record that fits into a buffer of exactly
  that capacity (its own allocation), walking the file alongside the reader to know what each should be, then closes, reopens
  and reads the first record again without a timestamp, and closes once more.
entry: LLVMFuzzerTestOneInput
source:
  files:
