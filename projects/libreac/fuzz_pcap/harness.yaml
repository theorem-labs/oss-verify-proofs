checks:
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_pcap.c:92-118
  what: Open accepts exactly a file of at least 24 bytes with one of the two classic magics, notes the byte order, and a reader
    that failed to open holds no stream.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_pcap.c:132-203
  what: Each record handed back fits the buffer, is the file's next record that fits and is not empty, with the original length,
    and an 802.1Q tag stripped exactly when the record carries one, its VID kept; reading stops within one record per 16 bytes
    of file.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_pcap.c:205-213
  what: The timestamp of each record handed back is the record header's seconds and microseconds.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_pcap.c:219-269
  what: The walk ends with 0 exactly at the end of the file and with -1 on a cut record or header, never with any other answer.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_pcap.c:273-295
  what: After close the reader holds no stream and answers -1; it reopens, and the reopened reader gives the same first answer
    as before.
