    path: fuzzer/avc_dec_fuzzer.cpp
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/ittiam-systems/libavc
  commit: 54eb5b09bfe483b2b0b504bca7f59476ad85d80f
  licence: NOASSERTION
modifications:
- Linked against libavc at commit 54eb5b09.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
