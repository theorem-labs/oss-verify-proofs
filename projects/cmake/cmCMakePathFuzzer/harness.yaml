schema: oss-fuzz-theorems/harness/1
project: cmake
harness: cmCMakePathFuzzer
rocq: OSSVerify.cmake.cmCMakePathFuzzer
origin: upstream
summary: cmCMakePath queries (Has*/Is*), component getters, Normal(), operator/ and operator== on two
  halves; all results discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/cmCMakePathFuzzer.cxx
  from:
    repository: https://gitlab.kitware.com/cmake/cmake
    commit: 313ad95baaeda2de05008c0d28d13eda6fe58550
    path: Tests/Fuzzing/cmCMakePathFuzzer.cxx
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://gitlab.kitware.com/cmake/cmake
  commit: 313ad95baaeda2de05008c0d28d13eda6fe58550
  licence: BSD-3-Clause
modifications:
- Linked against cmake at commit 313ad95b with 2 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
