    path: fuzzer/mpeg2_dec_fuzzer.cpp
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/ittiam-systems/libmpeg2
  commit: e2dbb98d7819a8225687d3a0b7f3d818784e451c
  licence: NOASSERTION
modifications:
- Linked against libmpeg2 at commit e2dbb98d.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
