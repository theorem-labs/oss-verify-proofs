schema: oss-fuzz-theorems/harness/1
project: libplist
harness: xplist_fuzzer
rocq: OSSVerify.libplist.xplist_fuzzer
origin: upstream
summary: Calls plist_from_xml on the raw input and frees the resulting node; the return code and tree
  are never inspected (no re-serialisation).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/xplist_fuzzer.cc
  from:
    repository: https://github.com/libimobiledevice/libplist
    commit: 32428abacb909988e8e960a8845a6430b17b6a60
    path: fuzz/xplist_fuzzer.cc
  modified: false
  licence: LGPL-2.1-or-later
library:
  repository: https://github.com/libimobiledevice/libplist
  commit: 32428abacb909988e8e960a8845a6430b17b6a60
  licence: NOASSERTION
modifications:
- Linked against libplist at commit 32428aba.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
