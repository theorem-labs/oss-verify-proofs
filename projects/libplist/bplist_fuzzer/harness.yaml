project: libplist
harness: bplist_fuzzer
rocq: OSSVerify.libplist.bplist_fuzzer
origin: upstream
summary: Calls plist_from_bin on the raw input and frees the resulting node; the return code and tree
  are never inspected (no re-serialisation).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/bplist_fuzzer.cc
  from:
    repository: https://github.com/libimobiledevice/libplist
