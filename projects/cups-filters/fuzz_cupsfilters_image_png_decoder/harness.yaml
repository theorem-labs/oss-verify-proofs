schema: oss-fuzz-theorems/harness/1
project: cups-filters
harness: fuzz_cupsfilters_image_png_decoder
rocq: OSSVerify.cups_filters.fuzz_cupsfilters_image_png_decoder
origin: upstream
summary: Budget-checks a PNG/JPEG/TIFF header, decodes with cupsImageOpenFP-equivalent _cupsImageRead{PNG,JPEG,TIFF}
  under a hash-selected colour space/LUT, reads 3 rows and 3 columns and folds them into a hash that is
  never compared (except in the compiled-out TIFF oracle below).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_cupsfilters_image_codec.c
  modified: true
  licence: Apache-2.0
library:
  repository: https://github.com/OpenPrinting/cups-filters
  commit: dce9940269ab3aa9e67030ed056a8c2d7232f04d
  licence: MIT
modifications:
- Linked against cups-filters at commit dce99402 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
- This copy of the harness could not be matched to an upstream file at a pinned commit, so it is marked
  modified; it is the file as built.
