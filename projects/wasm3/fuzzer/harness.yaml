project: wasm3
harness: fuzzer
rocq: OSSVerify.wasm3.fuzzer
origin: upstream
summary: 'inputs 8 B..256 KiB: m3_ParseModule, m3_LoadModule into a runtime with a 64 MiB memory cap,
  m3_FindFunction("fib"); the call is commented out (TODO) at this pin; results discarded.'
entry: LLVMFuzzerTestOneInput
