schema: oss-fuzz-theorems/harness/1
project: llhttp
harness: fuzz_parser
rocq: OSSVerify.llhttp.fuzz_parser
origin: upstream
summary: llhttp_execute() over the input with lenient flags taken from the first bytes; the parse result
  and error code are ignored; the only callback (on_message_complete) returns 0.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_parser.c
  modified: true
  licence: MIT
library:
  repository: https://github.com/nodejs/llhttp
  commit: 0e815792b167a9bd8ace259b95b7da953776c288
  licence: MIT
modifications:
- Linked against llhttp at commit 0e815792 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
- This copy of the harness could not be matched to an upstream file at a pinned commit, so it is marked
  modified; it is the file as built.
