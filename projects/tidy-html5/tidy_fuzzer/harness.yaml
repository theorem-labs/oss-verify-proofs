checks:
- kind: api-contract
  strength: weak
  stops_with: abort
  live: unknown
  where: source/tidy_fuzzer.c:27-28
  what: abort() if tidySetErrorBuffer returns < 0. It only fails on allocation failure, so this is a setup
    check rather than a property of the parser (relevant only under an allocation-failure model).
