schema: oss-fuzz-theorems/harness/1
project: tidy-html5
harness: tidy_config_fuzzer
rocq: OSSVerify.tidy_html5.tidy_config_fuzzer
origin: oss-fuzz
summary: Writes the input to a temp file and calls tidyLoadConfig on it; return value ignored. fuzzer_temp_file.h
  aborts only on temp-file I/O failure (environment, not a property).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/tidy_config_fuzzer.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/tidy-html5/tidy_config_fuzzer.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/htacg/tidy-html5
  commit: d08ddc2860aa95ba8e301343a30837f157977cba
  licence: NOASSERTION
modifications:
- Linked against tidy-html5 at commit d08ddc28.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
