rocq: OSSVerify.tidy_html5.tidy_xml_fuzzer
origin: oss-fuzz
summary: 'XML mode (XmlOut, XmlTags, utf8, numeric entities): parse string, clean, diagnostics, save;
  nothing is compared.'
