    path: src/fuzz/fuzz_compression_sav.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/WizardMac/ReadStat
  commit: da9fcaa48a78107774ecc7efe83fc77050c68ad8
  licence: MIT
modifications:
- Linked against ReadStat at commit da9fcaa4.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
