rocq: OSSVerify.zydis.ZydisFuzzDecoder
origin: upstream
summary: 'After decoding, formatting, tokenizing, single-operand format/tokenize, ZydisCalcAbsoluteAddress,
  mnemonic/register/feature/segment helpers on control-block values: all results ignored.'
