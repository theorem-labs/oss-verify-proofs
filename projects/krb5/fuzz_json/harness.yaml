schema: oss-fuzz-theorems/harness/1
project: krb5
harness: fuzz_json
rocq: OSSVerify.krb5.fuzz_json
origin: upstream
summary: k5_json_decode then k5_json_encode of the decoded value; the re-encoded text is freed without
  being compared to (or re-decoded against) the input.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_json.c
  from:
    repository: https://github.com/krb5/krb5
    commit: 473b51b640bef2e97c490d6f2985658befa89c16
    path: src/tests/fuzzing/fuzz_json.c
  modified: false
  licence: BSD-2-Clause
library:
  repository: https://github.com/krb5/krb5
  commit: 473b51b640bef2e97c490d6f2985658befa89c16
  licence: ISC
modifications:
- Linked against krb5 at commit 473b51b6.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
