schema: oss-fuzz-theorems/harness/1
project: libhevc
harness: hevc_dec_fuzzer
rocq: OSSVerify.libhevc.hevc_dec_fuzzer
origin: upstream
summary: Creates an ihevcd decoder with a fuzzer-picked output colour format, architecture and core count,
  decodes the header then up to 100 frames into allocated output buffers; return codes and output pixels
  are ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/hevc_dec_fuzzer.cpp
  from:
    repository: https://github.com/ittiam-systems/libhevc
    commit: 1a3c8d651a7ec18ff777de1ad8af40ae48ed914c
    path: fuzzer/hevc_dec_fuzzer.cpp
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/ittiam-systems/libhevc
  commit: 1a3c8d651a7ec18ff777de1ad8af40ae48ed914c
  licence: NOASSERTION
modifications:
- Linked against libhevc at commit 1a3c8d65.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
