schema: oss-fuzz-theorems/harness/1
project: rabbitmq-c
harness: fuzz_url
rocq: OSSVerify.rabbitmq_c.fuzz_url
origin: upstream
summary: NUL-terminates a copy of the input and calls amqp_parse_url(); the return code and the parsed
  amqp_connection_info are ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_url.c
  from:
    repository: https://github.com/alanxz/rabbitmq-c
    commit: 6ddbdb2d8c1f63dcd3eb65c7a33d36b1d6417eed
    path: fuzz/fuzz_url.c
  modified: false
  licence: mit
library:
  repository: https://github.com/alanxz/rabbitmq-c
  commit: 6ddbdb2d8c1f63dcd3eb65c7a33d36b1d6417eed
  licence: MIT
modifications:
- Linked against rabbitmq-c at commit 6ddbdb2d.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
