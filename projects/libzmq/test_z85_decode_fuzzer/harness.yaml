project: libzmq
harness: test_z85_decode_fuzzer
rocq: OSSVerify.libzmq.test_z85_decode_fuzzer
origin: upstream
summary: truncate the input to a multiple of 5 and zmq_z85_decode it into a size*4/5 buffer; the decoded
  key and the NULL-on-error return are both discarded.
entry: LLVMFuzzerTestOneInput
