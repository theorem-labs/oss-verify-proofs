schema: oss-fuzz-theorems/harness/1
project: opencensus-cpp
harness: grpc_trace_bin_fuzzer
rocq: OSSVerify.opencensus_cpp.grpc_trace_bin_fuzzer
origin: upstream
summary: FromGrpcTraceBinHeader; if valid, ToGrpcTraceBinHeader into a 29-byte buffer that is never compared
  to the input (the natural round trip is unchecked).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/grpc_trace_bin_fuzzer.cc
  from:
    repository: https://github.com/census-instrumentation/opencensus-cpp
    commit: 50eb5de762e5f87e206c011a4f930adb1a1775b1
    path: opencensus/trace/internal/grpc_trace_bin_fuzzer.cc
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/census-instrumentation/opencensus-cpp
  commit: 50eb5de762e5f87e206c011a4f930adb1a1775b1
  licence: Apache-2.0
modifications:
- Linked against opencensus-cpp at commit 50eb5de7 with 1 patch to the library (listed on the project
  page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
