schema: oss-fuzz-theorems/harness/1
project: trafficserver
harness: fuzz_proxy_protocol
rocq: OSSVerify.trafficserver.fuzz_proxy_protocol
origin: upstream
summary: Views the input (size_data from 8 to 1024 bytes) in place as a swoc::TextView and passes it with
  a new ProxyProtocol to proxy_protocol_parse, which parses a PROXY protocol v1 or v2 header when the
  input begins with that version's preface and has at least 15 (v1) or 16 (v2) bytes; it drops the returned
  length and the parsed fields. Before the call it installs a new Diags object with DiagsPtr::set, and
  it deletes that object after. It returns -1 for an input with size_data below 8 or above 1024.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_proxy_protocol.cc
  from:
    repository: https://github.com/apache/trafficserver
    commit: 97d2831fbd38c8f43b39e3ed996d9bd6e3173384
    path: tests/fuzzing/fuzz_proxy_protocol.cc
  modified: true
  licence: NOASSERTION
library:
  repository: https://github.com/apache/trafficserver
  commit: 97d2831fbd38c8f43b39e3ed996d9bd6e3173384
  licence: NOASSERTION
modifications:
- Linked against trafficserver at commit 97d2831f with 3 patches to the library (listed on the project
  page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- 'The harness source is modified: source/fuzz_proxy_protocol.cc is trafficserver 97d2831f''s tests/fuzzing/fuzz_proxy_protocol.cc
  with one Theorem Labs change: its length check returns -1, not 1, for an input outside its limits (libFuzzer
  rejects the input; the driver exits 0, not 78).'
