schema: oss-fuzz-theorems/harness/1
project: trafficserver
harness: fuzz_rec_http
rocq: OSSVerify.trafficserver.fuzz_rec_http
origin: upstream
summary: Copies the input (Size from 8 to 1024 bytes) into a string and, after ts_session_protocol_well_known_name_indices_init
  registers the well-known protocol names, converts it, read as a comma-separated list of ALPN protocol
  names, to ALPN wire format with convert_alpn_to_wire_format into a 30-byte (MAX_ALPN_STRING) buffer,
  and drops the result and the buffer. Before those calls it installs a new Diags object with DiagsPtr::set,
  and it deletes that object after. It returns -1 for an input with Size below 8 or above 1024.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_rec_http.cc
  from:
    repository: https://github.com/apache/trafficserver
    commit: 97d2831fbd38c8f43b39e3ed996d9bd6e3173384
    path: tests/fuzzing/fuzz_rec_http.cc
  modified: true
  licence: NOASSERTION
library:
  repository: https://github.com/apache/trafficserver
  commit: 97d2831fbd38c8f43b39e3ed996d9bd6e3173384
  licence: NOASSERTION
modifications:
- Linked against trafficserver at commit 97d2831f with 3 patches to the library (listed on the project
  page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- 'The harness source is modified: source/fuzz_rec_http.cc is trafficserver 97d2831f''s tests/fuzzing/fuzz_rec_http.cc
  with one Theorem Labs change: its length check returns -1, not 1, for an input outside its limits (libFuzzer
  rejects the input; the driver exits 0, not 78).'
