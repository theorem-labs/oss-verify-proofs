schema: oss-fuzz-theorems/harness/1
project: trafficserver
harness: fuzz_json
rocq: OSSVerify.trafficserver.fuzz_json
origin: upstream
summary: Copies the input (size_data from 5 to 1024 bytes) into a string and passes it as a JSON-RPC 2.0
  message to rpc::JsonRPCManager::handle_call, with a default-constructed rpc::Context, on a new manager
  to which the harness adds no handlers (only the manager's own show_registered_handlers and get_service_descriptor
  methods are registered), and drops the response. Before the call it installs a new Diags object with
  DiagsPtr::set, and it deletes that object after. It returns -1 for an input with size_data below 5 or
  above 1024.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_json.cc
  from:
    repository: https://github.com/apache/trafficserver
    commit: 97d2831fbd38c8f43b39e3ed996d9bd6e3173384
    path: tests/fuzzing/fuzz_json.cc
  modified: true
  licence: NOASSERTION
library:
  repository: https://github.com/apache/trafficserver
  commit: 97d2831fbd38c8f43b39e3ed996d9bd6e3173384
  licence: NOASSERTION
modifications:
- Linked against trafficserver at commit 97d2831f with 3 patches to the library (listed on the project
  page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- 'The harness source is modified: source/fuzz_json.cc is trafficserver 97d2831f''s tests/fuzzing/fuzz_json.cc
  with one Theorem Labs change: its length check returns -1, not 1, for an input outside its limits (libFuzzer
  rejects the input; the driver exits 0, not 78).'
