schema: oss-fuzz-theorems/harness/1
project: fribidi
harness: fribidi-fuzzer
rocq: OSSVerify.fribidi.fribidi_fuzzer
origin: upstream
summary: Treats the input as size/4 FriBidiChar code points; fribidi_get_bidi_types, fribidi_get_bracket_types
  and fribidi_get_par_embedding_levels_ex; the returned max level is discarded -- the only assert is `if
  ((0)) assert (level);`, dead code in every build.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fribidi-fuzzer.c
  from:
    repository: https://github.com/fribidi/fribidi
    commit: 58895678b768ceaf8d8b3bc69f5c6f56c8e1513d
    path: bin/fribidi-fuzzer.c
  modified: false
  licence: LGPL-2.1-or-later
library:
  repository: https://github.com/fribidi/fribidi
  commit: 58895678b768ceaf8d8b3bc69f5c6f56c8e1513d
  licence: LGPL-2.1-or-later
modifications:
- Linked against fribidi at commit 58895678.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
