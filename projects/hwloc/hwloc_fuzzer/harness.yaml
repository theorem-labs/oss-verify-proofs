schema: oss-fuzz-theorems/harness/1
project: hwloc
harness: hwloc_fuzzer
rocq: OSSVerify.hwloc.hwloc_fuzzer
origin: oss-fuzz
summary: hwloc_encode_to_base64(input -> 100-byte target), then hwloc_decode_from_base64 of the RAW INPUT
  (not the encoded text) into the same buffer; nothing compared.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/hwloc_fuzzer.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/hwloc/hwloc_fuzzer.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/open-mpi/hwloc
  commit: 3b37b024aa3fe368dd82008eea7e1ad9dca97d2c
  licence: BSD-3-Clause
modifications:
- Linked against hwloc at commit 3b37b024.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
