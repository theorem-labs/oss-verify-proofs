proofs:
  origin: contributed by Rares Buhai in https://github.com/theorem-labs/oss-verify-proofs/pull/3 (commit 1e39b0fbb06ac789e9fc93f7fe923e9688d79912),
    written with an AI coding agent; 369 of its 408 Rocq files carry Anthropic's licence header
    and were made from the library files of the cgif and Varnish proofs of release 2026.10.0 (proofs/cgif/cgif_file_fuzzer/lib,
    proofs/cgif/cgif_rgb_fuzzer/lib and proofs/varnish/esi_parse_fuzzer/lib) at commit 98e995d4daced70a0a4aa2c810854b88720735f1
    of https://github.com/theorem-labs/oss-verify-proofs, the parent of the contributed commit; those came from
    final-anthropic-opensource-formal-verification-proofs-package-2026-10-21 (sha256 4c6c152f61ce538e439b9d2adef439f4dbe1a2d446767d84ac7c3946d7c6687a).
    The proof plain_halts_may_fail and the 218 files of lib/MayFail/ were contributed by Rares Buhai in
    https://github.com/theorem-labs/oss-verify-proofs/pull/7 (commit c6257b072eba3bea2f5e69b5d26285b662c379cc,
    parent 1045cd75d83eacd942040cb611c98305f33dea59 of that repository), also written with an AI coding agent;
    lib/MayFail/ is a may-fail runtime copy of this harness's own lib/ files of the same names, and 208 of its
    218 files carry the Anthropic licence header of the lib/ file each was made from, with one more line saying
    what changed in it; 197 say only that its module paths changed, 10 also name the may-fail change they carry,
    and ZImage.v also names the doc comment it expanded. The binaries and the statement are unchanged, so nothing
    of the build below changes
  licence: Apache-2.0 OR MIT for the 369 library files of lib/ and the 208 of lib/MayFail/ that carry Anthropic's
    licence header; MIT, the repository's licence (LICENSE), for the other files, which the contributor wrote
  texts:
  - LICENSES/anthropic-proofs-LICENSE
  - LICENSES/anthropic-proofs-LICENSE-MIT
  - LICENSES/anthropic-proofs-NOTICE
  texts_location: the repository's top directory
  modified: each changed file carries one line under its licence header saying so; the 11 files that are byte for
    byte their source carry none
  sources:
  - 'lib/Checksum/: generic proof tactics, the CRC algebra and the frame of the certificates come from the Varnish
    proof (proofs/varnish/esi_parse_fuzzer/lib); CrcGenInner.v and CrcCombinedGenInner.v are made from its V_crc32.v
    for zlib''s instruction layout and register allocation, CrcLib.v changes the address of the x2n table, and BWorld.v
    keeps only the generic budget definitions of its BWorld.v; CrcGenModel.v is a new mathematical model'
  - 'lib/Reusable/: generic lemmas and binary-specific certificates from the cgif proof (proofs/cgif/cgif_file_fuzzer/lib
    and proofs/cgif/cgif_rgb_fuzzer/lib); each certificate is checked against zlib''s own binary, not taken on trust
    from cgif''s'
  - 'lib/ZImage.v: the image setup of the cgif proof, for zlib''s plain binary'
  - 'lib/MayFail/: the may-fail runtime copy of this harness''s lib/ files of the same names, from pull request 7;
    most of its files differ from the lib/ file they were made from only in their module paths and the layout of
    their imports, and the ones that also change proof content say so in a line under their licence header'
flags:
  note: as written in the recipe; a library's own build system adds its flags after these (e.g. CMake Release appends
    -O3 -DNDEBUG), see the pin and recipes.sh
  lines:
  - 'recipe/tools/build-body.sh:58: OFT_NO_BUILTIN_ALLOC="-fno-builtin-malloc -fno-builtin-calloc -fno-builtin-realloc
    -fno-builtin-reallocarray -fno-builtin-free -fno-builtin-aligned_alloc -fno-builtin-posix_memalign -fno-builtin-memalign
    -fno-builtin-valloc -fno-builtin-strdup -fno-builtin-strndup"'
  - 'recipe/tools/build-body.sh:59: BASE_CFLAGS="-march=rv64g -mabi=lp64d -Os -g -ffunction-sections -fdata-sections
    -fno-stack-protector -fno-plt -Wdate-time $OFT_NO_BUILTIN_ALLOC"'
  - 'recipe/tools/build-body.sh:65: SAN=""'
  - 'recipe/tools/build-body.sh:560: SAN="-fsanitize=address"'
  - 'recipe/tools/build-body.sh:577: SAN="-fsanitize=address -fsanitize=undefined -fno-sanitize-recover=all -fsanitize-trap=all
    -fno-sanitize=function"'
  - 'recipe/tools/build-body.sh:586: SAN="-fsanitize=undefined -fno-sanitize-recover=all -fsanitize-trap=all -fno-sanitize=function"'
  - 'recipe/tools/build-body.sh:590: SAN=""'
  - 'recipe/tools/build-body.sh:618: CFLAGS="$BASE_CFLAGS $SAN -fmacro-prefix-map=$LIBROOT/=/work/build/lib/FLAVOUR/"'
  - 'recipe/tools/build-body.sh:431: ''clang --config=/opt/asan-static/musl.cfg'''
  - 'recipe/tools/build-body.sh:441: ''clang++ --config=/opt/asan-static/musl.cfg -stdlib=libc++'''
  - 'recipe/tools/build-body.sh:478: SEALED_CFG=/opt/asan-static/asan-musl-sealed.cfg'
  - 'recipe/tools/build-body.sh:1019: SILENT_LD=""'
  - 'recipe/tools/build-body.sh:1021: SILENT_LD="-Wl,--defsym=__sanitizer_silent_reports=1"'
  - 'recipe/tools/build-body.sh:1027: SILENT_LD=""'
  - 'recipe/tools/build-body.sh:1049: "$CC" $BASE_CFLAGS -static -no-pie -Wl,--gc-sections ${OFT_STRIP--Wl,--strip-all}
    \'
  - 'recipe/tools/build-body.sh:1054: "$CC" $BASE_CFLAGS -static -no-pie -Wl,--gc-sections ${OFT_STRIP--Wl,--strip-all}
    \'
  - 'recipe/targets/zlib-checksum_fuzzer/pin:40: LIB_CFLAGS=""'
