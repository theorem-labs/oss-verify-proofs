schema: oss-fuzz-theorems/harness/1
project: zlib
harness: checksum_fuzzer
rocq: OssFuzzTheorems.zlib.checksum_fuzzer
origin: oss-fuzz
summary: 'Checks 6 properties (listed below); the first, an algebraic law: CRC-32 combine law, per chunk
  (chunk size = data[0], min 1): crc32_combine_op(crc_so_far, crc32(0,chunk), crc32_combine_gen(chunk_len))
  must equal crc32_z(crc_so_far, chunk).'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/checksum_fuzzer.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/zlib/checksum_fuzzer.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/madler/zlib
  commit: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
  version: 1.3.1
  licence: Zlib
modifications:
- Linked against zlib 1.3.1 at commit 51b7f2ab.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
