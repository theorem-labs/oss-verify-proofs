licence: NOASSERTION
checks:
- kind: algebraic
  strength: full
  stops_with: assert
  live: true
  where: source/checksum_fuzzer.c:33-38
  what: 'CRC-32 combine law, per chunk (chunk size = data[0], min 1): crc32_combine_op(crc_so_far, crc32(0,chunk),
    crc32_combine_gen(chunk_len)) must equal crc32_z(crc_so_far, chunk).'
- kind: differential
  strength: full
  stops_with: assert
  live: true
  where: source/checksum_fuzzer.c:39-43
  what: Chunked crc32_z over the whole input (chunk size data[0]) must equal the one-shot crc32(0, data,
    len).
- kind: algebraic
  strength: weak
  stops_with: assert
  live: true
  where: source/checksum_fuzzer.c:44-50
  what: 'crc32_combine(crc1,crc2,len)==crc32_combine(crc1,crc1,len) and crc32_combine_op(crc1,crc2,op)==crc32_combine_op(crc2,crc1,op):
    trivially true, since crc1 == crc2 was just asserted.'
- kind: differential
  strength: full
  stops_with: assert
  live: true
  where: source/checksum_fuzzer.c:47-52
  what: 'crc32_combine(crc1, crc2, len) must equal crc32_combine_op(crc2, crc1, crc32_combine_gen(len)):
    the two combine APIs agree (operands swapped, but equal by the previous assert).'
- kind: differential
  strength: full
  stops_with: assert
  live: true
  where: source/checksum_fuzzer.c:55-61
  what: Chunked adler32_z over the input must equal the one-shot adler32(1, data, len).
- kind: algebraic
  strength: weak
  stops_with: assert
  live: true
  where: source/checksum_fuzzer.c:62-63
  what: 'adler32_combine(adler1, adler2, len) == adler32_combine(adler1, adler1, len): trivially true,
    since adler1 == adler2 was just asserted.'
failure_handlers: none
