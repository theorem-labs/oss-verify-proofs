  stops_with: print-only
  live: unknown
  where: source/example_large_fuzzer.c:48-72
  what: deflate must be greedy (avail_in == 0 after the first call) and Z_FINISH must return Z_STREAM_END;
    print + return 0.
- kind: invariant
  strength: partial
  stops_with: print-only
  live: unknown
  where: source/example_large_fuzzer.c:108-111
  what: Deflate a zero buffer, then already-compressed bytes at level 0, then the zero buffer again; inflate
    total_out must equal exactly 2*uncomprLen + diff. Length only; failure prints + returns 0.
