schema: oss-fuzz-theorems/harness/1
project: zlib
harness: zlib_uncompress_fuzzer
rocq: OSSVerify.zlib.zlib_uncompress_fuzzer
origin: oss-fuzz
summary: uncompress into a 256 KiB static buffer; the return code is tested but both branches return 0.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/zlib_uncompress_fuzzer.cc
  from:
    repository: https://github.com/google/oss-fuzz
    commit: fadbcdfb9e96aaa26734fbc936ab64a6f4f18ab4
    path: projects/zlib/zlib_uncompress_fuzzer.cc
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/madler/zlib
  commit: 99623ef7097352da7993ba614161fd6a311e046e
  version: '1.4'
  licence: Zlib
modifications:
- Linked against zlib 1.4 at commit 99623ef7.
- zlib carries the public inflate fix https://github.com/madler/zlib/pull/1390 in every build.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
