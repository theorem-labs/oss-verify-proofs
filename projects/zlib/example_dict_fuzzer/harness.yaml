schema: oss-fuzz-theorems/harness/1
project: zlib
harness: example_dict_fuzzer
rocq: OSSVerify.zlib.example_dict_fuzzer
origin: oss-fuzz
summary: 'Checks 2 properties (listed below); the first, a round trip: deflateInit2 (level/windowBits/memLevel/strategy
  from data[0]) with a preset dictionary = first data[0] bytes of the input, then inflate supplying the
  dictionary on Z_NEED_DICT; output memcmp-compared with the input. A mismatch only prints and returns
  0.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/example_dict_fuzzer.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/zlib/example_dict_fuzzer.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/madler/zlib
  commit: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
  version: 1.3.1
  licence: Zlib
modifications:
- Linked against zlib 1.3.1 at commit 51b7f2ab.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
