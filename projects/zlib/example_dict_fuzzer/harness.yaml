checks:
- kind: api-contract
  strength: partial
  stops_with: print-only
  live: true
  where: source/example_dict_fuzzer.c:79-123
  what: deflate(Z_FINISH) must report Z_STREAM_END; the dictionary id inflate asks for must equal the
    Adler-32 recorded after deflateSetDictionary; every other call Z_OK (CHECK_ERR). All print + return
    0.
- kind: roundtrip
  strength: full
  stops_with: print-only
  live: unknown
  where: source/example_dict_fuzzer.c:129-132
  what: deflateInit2 (level/windowBits/memLevel/strategy from data[0]) with a preset dictionary = first
    data[0] bytes of the input, then inflate supplying the dictionary on Z_NEED_DICT; output memcmp-compared
    with the input. A mismatch only prints and returns 0.
