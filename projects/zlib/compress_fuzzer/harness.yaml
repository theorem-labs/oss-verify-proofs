schema: oss-fuzz-theorems/harness/1
project: zlib
harness: compress_fuzzer
rocq: OSSVerify.zlib.compress_fuzzer
origin: oss-fuzz
summary: 'check_decompress: uncompress of the input behind a synthesized 2-byte zlib header; result ignored.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/compress_fuzzer.c
  from:
    repository: https://github.com/google/oss-fuzz
