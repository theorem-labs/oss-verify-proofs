    path: projects/zlib/compress_fuzzer.c
  modified: true
  licence: Apache-2.0
library:
  repository: https://github.com/madler/zlib
  commit: 99623ef7097352da7993ba614161fd6a311e046e
  version: '1.4'
  licence: Zlib
modifications:
- Linked against zlib 1.4 at commit 99623ef7.
- zlib carries the public inflate fix https://github.com/madler/zlib/pull/1390 in every build.
- The harness source differs from the upstream file at the pinned commit, by the OSS-Fuzz harness fix
  google/oss-fuzz pull request 16582; the copy in source/ is the file as built.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
