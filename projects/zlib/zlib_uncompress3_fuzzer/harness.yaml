schema: oss-fuzz-theorems/harness/1
project: zlib
harness: zlib_uncompress3_fuzzer
rocq: OSSVerify.zlib.zlib_uncompress3_fuzzer
origin: oss-fuzz
summary: uncompress2 with an output length from the first 3 bytes (clamped to 256 KiB); return code ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/zlib_uncompress3_fuzzer.cc
  from:
    repository: https://github.com/google/oss-fuzz
