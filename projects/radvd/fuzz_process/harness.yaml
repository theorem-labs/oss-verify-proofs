    path: projects/radvd/fuzz_process.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/radvd-project/radvd
  commit: fbbacdcbd12f829453deb33ed50a5a49a3c42b05
  licence: NOASSERTION
modifications:
- Linked against radvd at commit fbbacdcb.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
