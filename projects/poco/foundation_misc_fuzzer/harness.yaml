    path: Foundation/fuzzing/MiscFuzzing.cpp
  modified: false
  licence: BSL-1.0
library:
  repository: https://github.com/pocoproject/poco
  commit: 3f0c291d56751b12ba95ca545706061bd4d35aeb
  licence: BSL-1.0
modifications:
- Linked against poco at commit 3f0c291d.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
