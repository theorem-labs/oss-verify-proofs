schema: oss-fuzz-theorems/harness/1
project: poco
harness: foundation_misc_fuzzer
rocq: OSSVerify.poco.foundation_misc_fuzzer
origin: upstream
summary: First byte selects URI (parse, resolve, normalize, query params, toString), Path (tryParse, absolute,
  expand, toString/assign across styles), UUID (parse, then UUID(uuid1.toString()) -- a re-parse of its
  own output whose failure would throw SyntaxException into the catch), or UTF8 unescape/escape/toUpper/toLower.
  Every step is inside try { } catch (const std::exception&) { }.
entry: LLVMFuzzerTestOneInput
