schema: oss-fuzz-theorems/harness/1
project: p11-kit
harness: conf_fuzzer
rocq: OSSVerify.p11_kit.conf_fuzzer
origin: upstream
summary: Drives the config-file lexer (p11_lexer_init / p11_lexer_next until false) over the input; tokens
  and the failed flag are ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/conf_fuzzer.c
  from:
    repository: https://github.com/p11-glue/p11-kit
    commit: 120050e353e8f43d7c40bbcc047f667f903f4de5
    path: fuzz/conf_fuzzer.c
  modified: true
  licence: BSD-3-Clause
library:
  repository: https://github.com/p11-glue/p11-kit
  commit: 120050e353e8f43d7c40bbcc047f667f903f4de5
  version: 0.26.5
  licence: BSD-3-Clause
modifications:
- Linked against p11-kit 0.26.5 at commit 120050e3 with 2 patches to the library (listed on the project
  page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
