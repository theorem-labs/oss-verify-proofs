schema: oss-fuzz-theorems/harness/1
project: libpsl
harness: libpsl_load_fuzzer
rocq: OSSVerify.libpsl.libpsl_load_fuzzer
origin: upstream
summary: Loads the input as a public-suffix list via fmemopen+psl_load_fp, queries psl_is_public_suffix(psl,
  ".ü.com"), frees it, and loads /dev/null; no result is checked.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/libpsl_load_fuzzer.c
  from:
    repository: https://github.com/rockdaboot/libpsl
    commit: c486db8d221cbac55f87508d4da4db4497760997
    path: fuzz/libpsl_load_fuzzer.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/rockdaboot/libpsl
  commit: c486db8d221cbac55f87508d4da4db4497760997
  version: 0.23.3
  licence: MIT
modifications:
- Linked against libpsl 0.23.3 at commit c486db8d with 2 patches to the library (listed on the project
  page).
- In every build, getenv() returns NULL and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
