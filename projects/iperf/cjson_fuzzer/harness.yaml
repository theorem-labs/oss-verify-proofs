schema: oss-fuzz-theorems/harness/1
project: iperf
harness: cjson_fuzzer
rocq: OSSVerify.iperf.cjson_fuzzer
origin: oss-fuzz
summary: NUL-terminates the input, cJSON_Parse()s it and cJSON_Delete()s the tree if non-NULL. The parse
  result is never inspected (no print/re-parse).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/cjson_fuzzer.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/iperf/cjson_fuzzer.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/esnet/iperf
  commit: c9b74229d0d9bfec6d2307b66b43c29a7665ad0b
  licence: MIT
modifications:
- Linked against iperf at commit c9b74229.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
