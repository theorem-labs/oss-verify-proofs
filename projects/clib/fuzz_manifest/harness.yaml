schema: oss-fuzz-theorems/harness/1
project: clib
harness: fuzz_manifest
rocq: OSSVerify.clib.fuzz_manifest
origin: upstream
summary: Writes the input to ./libfuzzer.json and calls clib_package_load_from_manifest (parson JSON parse
  + package struct fill); the package is freed unexamined.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_manifest.c
  from:
    repository: https://github.com/clibs/clib
    commit: ebc642f6c6fc2b3920e8898df8f680b86db9e71e
    path: test/fuzzing/fuzz_manifest.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/clibs/clib
  commit: ebc642f6c6fc2b3920e8898df8f680b86db9e71e
  licence: MIT
modifications:
- Linked against clib at commit ebc642f6.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
