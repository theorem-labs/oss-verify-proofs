schema: oss-fuzz-theorems/harness/1
project: libgit2
harness: packfile_fuzzer
rocq: OSSVerify.libgit2.packfile_fuzzer
origin: upstream
summary: Feeds the input (minus a flag byte) to a git_indexer backed by an in-memory mempack ODB, optionally
  appending the SHA1 trailer, then git_indexer_commit and unlinks the written .idx/.pack; results only
  choose cleanup.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/packfile_fuzzer.c
  from:
    repository: https://github.com/libgit2/libgit2
    commit: 0551dfd4ad989b6a3d5683c0d4cf326c6efef929
    path: fuzzers/packfile_fuzzer.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/libgit2/libgit2
  commit: 0551dfd4ad989b6a3d5683c0d4cf326c6efef929
  licence: NOASSERTION
modifications:
- Linked against libgit2 at commit 0551dfd4 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
