checks:
- kind: api-contract
  strength: weak
  stops_with: abort
  live: unknown
  where: source/packfile_fuzzer.c:74-101
  what: 'Per-input setup must succeed or abort(): after git_mempack_reset, git_odb_write of a constant
    2-byte blob, git_indexer_new(".") and git_object_id_from_buffer over the input. Input-independent
    or trivially-true (except that mempack reset leaves the ODB writable)'
distribution:
  file: Distribution.v
  argv0: packfile_fuzzer
  input_file: input.bin
  prefix_hex: 000000000000805041434b0000000200000001
  payload:
    length: geometric
    p: 1/65
    mean_bytes: 64
    alphabet: bytes
  envp:
  - LC_ALL=C
  - HOME=/
  - TZ=UTC
  components:
    payload: 22/25
    wrong_argc: 1/50
    missing_file: 1/50
    envp: 1/50
    full_support: 3/50
  mass: '1'
