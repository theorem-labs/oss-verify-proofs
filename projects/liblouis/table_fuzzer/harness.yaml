    path: tests/fuzzing/table_fuzzer.cc
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/liblouis/liblouis
  commit: d1f57dcfcff78106a46ce648f864d960c754b5f6
  licence: NOASSERTION
modifications:
- Linked against liblouis at commit d1f57dcf.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
