schema: oss-fuzz-theorems/harness/1
project: liblouis
harness: table_fuzzer
rocq: OSSVerify.liblouis.table_fuzzer
origin: upstream
summary: Writes the input to /tmp/libfuzzer.uti and compiles "include /tmp/libfuzzer.uti" into empty.ctb
  with lou_compileString; result ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/table_fuzzer.cc
  from:
    repository: https://github.com/liblouis/liblouis
