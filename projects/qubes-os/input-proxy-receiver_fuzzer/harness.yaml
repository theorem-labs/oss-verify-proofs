    path: fuzz/input-proxy-receiver_fuzzer.c
  modified: false
  licence: GPL-2.0-or-later
library:
  repository: https://github.com/QubesOS/qubes-app-linux-input-proxy
  commit: ea8710166c6ac29dd4183cdf155bc9a1da34cf4a
  version: 1.0.46
  licence: NOASSERTION
modifications:
- Linked against qubes-app-linux-input-proxy 1.0.46 at commit ea871016.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
