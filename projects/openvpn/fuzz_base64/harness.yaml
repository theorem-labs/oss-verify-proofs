schema: oss-fuzz-theorems/harness/1
project: openvpn
harness: fuzz_base64
rocq: OSSVerify.openvpn.fuzz_base64
origin: oss-fuzz
summary: openvpn_base64_encode(data) and openvpn_base64_decode(data as string) are called independently;
  neither result is inspected and the encode output is never decoded or compared (no round trip).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_base64.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/openvpn/fuzz_base64.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/OpenVPN/openvpn
  commit: af6a79c6a83739ca9542e52a02a3449a2f292758
  licence: NOASSERTION
modifications:
- Linked against openvpn at commit af6a79c6 with 3 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
