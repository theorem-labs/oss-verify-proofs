schema: oss-fuzz-theorems/harness/1
project: netcdf
harness: fuzz_open
rocq: OSSVerify.netcdf.fuzz_open
origin: upstream
summary: nc_open_mem() of the input as an in-memory netCDF file; nc_close() on success; nothing is read
  back or checked.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_open.c
  from:
    repository: https://github.com/Unidata/netcdf-c
    commit: f0b888daa449363ab0a8aba0ae4da1b49446fb93
    path: fuzz/fuzz_open.c
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/Unidata/netcdf-c
  commit: f0b888daa449363ab0a8aba0ae4da1b49446fb93
  licence: BSD-3-Clause
modifications:
- Linked against netcdf-c at commit f0b888da.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
