schema: oss-fuzz-theorems/harness/1
project: brpc
harness: fuzz_http_parser
rocq: OSSVerify.brpc.fuzz_http_parser
origin: upstream
summary: A mode byte picks http_parser_execute (request or response, all callbacks return 0) or http_parser_parse_url
  (connect 0/1). Return values and parser state are discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_http_parser.cpp
  from:
    repository: https://github.com/apache/brpc
    commit: e7f08670688617d51263e391b20d213e8d0af7f2
    path: test/fuzzing/fuzz_http_parser.cpp
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/apache/brpc
  commit: e7f08670688617d51263e391b20d213e8d0af7f2
  licence: NOASSERTION
modifications:
- Linked against brpc at commit e7f08670 with 2 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
