checks:
- kind: differential
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_state.c:133-155
  what: 'The text decoded from three copies with different bytes after its NUL gets the same answer each time, and the same
    bytes whenever two of them decode: the decoder reads nothing past the NUL.'
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_state.c:157-163
  what: For a text of n characters the decoder holds at most n / 4 * 3 + 3 bytes.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_state.c:165-186
  what: The decoder refuses exactly the texts the harness's own reading of RFC 4648 base64 refuses, and decodes every other
    text to the bytes the harness reads from it.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_state.c:188-202
  what: A refused text returns no body, leaves the length it was handed unwritten, and gives back every byte the decoder allocated.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_state.c:206-226
  what: Any text decoded with its allocation failing is refused cleanly in the same way, and a body encoded with the encoder's
    allocation failing returns no text and holds no memory.
- kind: roundtrip
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_state.c:278-314
  what: A decoded body encodes to the padded RFC 4648 text of (len + 2) / 3 * 4 characters, letter for letter the harness's
    own encoding, equal to the input when the input (without whitespace) is already that encoding, and decodes back to the
    same bytes.
- kind: roundtrip
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_state.c:229-264
  what: The encoded body set as state.bytes of a preset document, written and read back, decodes to the same bytes.
