schema: oss-fuzz-theorems/harness/1
project: omx-clap-core
harness: fuzz_state
rocq: OSSVerify.omx_clap_core.fuzz_state
origin: upstream
summary: Takes the input up to its first NUL, of at most 3 MiB, as the base64 text of a preset's state body and decodes it
  with preset_base64_decode, checking the answer against the harness's own reading of RFC 4648 base64 (whitespace skipped,
  padding optional). A decoded body is encoded again with preset_base64_encode, compared with the harness's own encoding,
  decoded back, and carried as state.bytes through a whole preset document written and read again. The text is then decoded,
  and the body encoded, with the allocation failing.
entry: LLVMFuzzerTestOneInput
source:
