    path: fuzz/fuzz_state.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/FreeMixer/omx-clap-core
  commit: 246923f04ac0ff2adb189bb9280816670c05b36c
  version: 0.20.1
  licence: GPL-3.0-or-later
modifications:
- Linked against a static libomx-clap-readers.a of src/preset_file.c and src/lv2_locate.c of omx-clap-core 0.20.1 at commit
  246923f0, and fuzz/alloc.c, compiled with each build's flags, as omx-clap-core's Makefile builds its fuzz targets but with
  this toolchain in place of a native clang and libFuzzer.
- As in omx-clap-core's own fuzz build, the readers are compiled with fuzz/alloc.h forced on them, so their malloc, calloc,
  realloc, strdup and free go to fuzz/alloc.c, which counts the bytes the reader holds and can make one chosen allocation
  fail; the harness's own allocations use the C library directly.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the fuzz target one to four times and prints each return value.
