schema: oss-fuzz-theorems/harness/1
project: omx-clap-core
harness: fuzz_preset
rocq: OSSVerify.omx_clap_core.fuzz_preset
origin: upstream
summary: Hands the input, as a whole preset file of at most 3 MiB, to the JSON reader pj_parse, and checks the result against
  the harness's own reading of the JSON grammar the header states (nesting at most 32 deep). An accepted file is written back
  compact and pretty with pj_write, compared byte for byte with the harness's own rendering, read again to the same tree,
  and rewritten with its modifiedAt member set as a save does. The file is then read again, and written again, with one allocation
  failing, chosen by the input's bytes.
entry: LLVMFuzzerTestOneInput
