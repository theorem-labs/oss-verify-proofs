  version: 0.20.1
  licence: GPL-3.0-or-later
modifications:
- 'Changed by OSS Verify in two files, fuzz/fuzz_preset.c and fuzz/alloc.c (both in source/ as built): once malloc or realloc
  returns NULL, to the harness or to the reader, the call ends and returns 0, after a reading that ran out is checked to be
  refused cleanly. A NULL on a request of more than PJ_ALLOC_BOUND of the input is not memory running out: the checks judge
  it. No library code changes.'
- 'Why: in the ASan builds each size class of the allocator has a fixed region of 3.5 GiB, and freed memory is held in quarantine,
  so on a large input (3 MB of nested arrays) a reading can run out of memory where the plain build does not. The reader then
  refuses the file correctly, and the harness aborted on that correct refusal.'
- Linked against a static libomx-clap-readers.a of src/preset_file.c and src/lv2_locate.c of omx-clap-core 0.20.1 at commit
  246923f0, and the changed fuzz/alloc.c (source/alloc.c), compiled with each build's flags, as omx-clap-core's Makefile builds
  its fuzz targets but with this toolchain in place of a native clang and libFuzzer.
- As in omx-clap-core's own fuzz build, the readers are compiled with fuzz/alloc.h forced on them, so their malloc, calloc,
  realloc, strdup and free go to fuzz/alloc.c, which counts the bytes the reader holds and can make one chosen allocation
  fail; the harness's own allocations use the C library directly.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the fuzz target one to four times and prints each return value.
