checks:
- kind: differential
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_preset.c:499-559
  what: 'The file read from three copies followed by different bytes (''1'', ''2'', NUL) gets the same answer each time, and
    the same tree whenever two of them are accepted: the reader reads nothing past the end of the file. The three are compared
    only when memory did not run out; a reading that ran out must be refused cleanly instead.'
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_preset.c:561-567
  what: While reading a file of n bytes the reader holds at most 256 n bytes plus a constant for the 32 open containers and
    4096 more.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_preset.c:570-590
  what: 'The reader accepts exactly the files the harness''s own grammar reads (JSON with nesting at most 32 deep, no \u0000,
    surrogates only in pairs, the stated number form), and reads each to the tree the harness reads from it: types, member
    names in order, string bytes, number text and value.'
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_preset.c:592-609
  what: A refused file leaves the tree all zero bytes and gives back every byte the reader allocated while refusing it.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_preset.c:614-665
  what: The file read again with one of its allocations failing is refused cleanly in the same way; a write, pretty or compact,
    with one of the writer's allocations failing returns no text and holds no memory.
- kind: roundtrip
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_preset.c:669-711
  what: An accepted tree written compact and pretty is, byte for byte, the harness's rendering of the writer's format, and
    reads back to the same tree.
- kind: roundtrip
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_preset.c:715-769
  what: Setting modifiedAt on an accepted object, then writing and reading it back, keeps every other member with its name,
    value and place, sets an existing modifiedAt in place or appends a new one, and holds the value set.
