checks:
- kind: differential
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_manifest.c:176-189
  what: 'The manifest and URI followed after their NUL by a name character or by NULs get the same answer: the reader reads
    nothing past either string.'
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_manifest.c:191-197
  what: The reader holds at most the URI's length plus 3 bytes.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_manifest.c:199-215
  what: The reader says the manifest names the URI exactly when the harness's own reading of the stated rule does, including
    the limit of 16 namespace declarations read.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_manifest.c:217-234
  what: Whatever the answer, the reader gives back every byte it allocated, also when asked with its allocation failing.
- kind: roundtrip
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_manifest.c:236-291
  what: The empty text names nothing; a manifest written from the URI as "<uri>", and at each split into a namespace and a
    plain local name as an @prefix, a SPARQL PREFIX or an empty-prefix declaration with its prefixed name, names it; the same
    spellings with one more name character answer as the rule says.
