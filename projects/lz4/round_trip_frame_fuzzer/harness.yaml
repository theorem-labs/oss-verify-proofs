schema: oss-fuzz-theorems/harness/1
project: lz4
harness: round_trip_frame_fuzzer
rocq: OSSVerify.lz4.round_trip_frame_fuzzer
origin: upstream
summary: 'Checks 3 properties (listed below); the first, a round trip: LZ4F_compressFrame with fuzzed
  preferences into a buffer of LZ4F_compressFrameBound must succeed, and the frame must decompress to
  exactly the input.'
entry: LLVMFuzzerTestOneInput
source:
