schema: oss-fuzz-theorems/harness/1
project: lz4
harness: compress_frame_fuzzer
rocq: OSSVerify.lz4.compress_frame_fuzzer
origin: upstream
summary: 'Checks 2 properties (listed below); the first, a round trip: LZ4F_compressFrame with fuzzed
  preferences (block size/mode, checksums, level -3..12, autoFlush, favorDecSpeed) into a fuzzed capacity
  in [0, bound]; IF it succeeds, the frame must decompress to exactly size bytes equal to the input.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/compress_frame_fuzzer.c
  from:
    repository: https://github.com/lz4/lz4
    commit: 0774d05537f9762f838f7ab541b7765f1a729cb5
    path: ossfuzz/compress_frame_fuzzer.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/lz4/lz4
  commit: 0774d05537f9762f838f7ab541b7765f1a729cb5
  licence: NOASSERTION
modifications:
- Linked against lz4 at commit 0774d055.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
