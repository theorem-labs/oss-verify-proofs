schema: oss-fuzz-theorems/harness/1
project: lz4
harness: decompress_frame_fuzzer
rocq: OSSVerify.lz4.decompress_frame_fuzzer
origin: upstream
summary: Decodes the input as an LZ4 frame four times (stableDst 0/1, with and without a zeroed dictionary
  of fuzzed size) into a fuzzed capacity in [0, 4*size]; return codes and output ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/decompress_frame_fuzzer.c
  from:
    repository: https://github.com/lz4/lz4
    commit: 0774d05537f9762f838f7ab541b7765f1a729cb5
    path: ossfuzz/decompress_frame_fuzzer.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/lz4/lz4
  commit: 0774d05537f9762f838f7ab541b7765f1a729cb5
  licence: NOASSERTION
modifications:
- Linked against lz4 at commit 0774d055.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
