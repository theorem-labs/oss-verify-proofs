schema: oss-fuzz-theorems/harness/1
project: lz4
harness: round_trip_stream_fuzzer
rocq: OSSVerify.lz4.round_trip_stream_fuzzer
origin: upstream
summary: 'Checks 2 properties (listed below); the first, a round trip: Eight streaming modes run in turn
  (prefix, extDict alternating between the input and a heap copy of it, loadDict, attachDict, and the
  four HC counterparts at a seeded level); the input is cut into seeded chunks, each compressed with *_continue
  and immediately decoded with LZ4_decompress_safe_continue; after each mode the concatenated output must
  have exactly the input''s length and bytes.'
entry: LLVMFuzzerTestOneInput
