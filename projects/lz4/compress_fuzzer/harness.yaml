schema: oss-fuzz-theorems/harness/1
project: lz4
harness: compress_fuzzer
rocq: OssFuzzTheorems.lz4.compress_fuzzer
origin: upstream
summary: 'Checks 2 properties (listed below); the first, a round trip: LZ4_compress_default into a fuzzed
  capacity in [0, LZ4_compressBound]; if it returns >0, LZ4_decompress_safe must regenerate exactly size
  bytes equal to the input.'
entry: LLVMFuzzerTestOneInput
