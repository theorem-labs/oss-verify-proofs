    path: ossfuzz/round_trip_hc_fuzzer.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/lz4/lz4
  commit: 0774d05537f9762f838f7ab541b7765f1a729cb5
  licence: NOASSERTION
modifications:
- Linked against lz4 at commit 0774d055.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
