checks:
- kind: roundtrip
  strength: full
  stops_with: abort
  live: true
  where: source/round_trip_fuzzer.c:55-62
  what: LZ4_compress_default into a bound-sized buffer must succeed and LZ4_decompress_safe must regenerate
    exactly the input.
- kind: roundtrip
  strength: full
  stops_with: abort
  live: true
  where: source/round_trip_fuzzer.c:64-81
  what: 'Partial-decompression law: LZ4_decompress_safe_partial with targetOutputSize = a fuzzed partialCapacity
    in [0, size] must return exactly partialCapacity bytes equal to the input''s prefix.'
failure_handlers: none
