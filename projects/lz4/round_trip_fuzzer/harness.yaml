project: lz4
harness: round_trip_fuzzer
rocq: OssFuzzTheorems.lz4.round_trip_fuzzer
origin: upstream
summary: 'Checks 3 properties (listed below); the first, a round trip: LZ4_compress_default into a bound-sized
  buffer must succeed and LZ4_decompress_safe must regenerate exactly the input.'
entry: LLVMFuzzerTestOneInput
