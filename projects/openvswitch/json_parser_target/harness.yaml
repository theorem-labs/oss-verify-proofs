    path: tests/oss-fuzz/json_parser_target.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/openvswitch/ovs
  commit: 1d4157643ca16ef8d84c8a27fe524aedb7b538d0
  licence: NOASSERTION
modifications:
- Linked against ovs at commit 1d415764.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
