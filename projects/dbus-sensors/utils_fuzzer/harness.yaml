schema: oss-fuzz-theorems/harness/1
project: dbus-sensors
harness: utils_fuzzer
rocq: OSSVerify.dbus_sensors.utils_fuzzer
origin: oss-fuzz
summary: 'FuzzedDataProvider-driven calls into dbus-sensors helpers: getDeviceBusAddr, escapePathForDbus,
  getPathForUnits, getPowerState/getPollRate/getPermitSet on a fuzzed config map, escapeName, splitFileName,
  findLimits, loadVariant<T> (exceptions swallowed with catch(...)), parseThresholdsFromConfig, sensorNameFind.
  Every result is (void)-discarded.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/utils_fuzzer.cpp
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/dbus-sensors/utils_fuzzer.cpp
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/openbmc/dbus-sensors
  commit: b979de6092651d9459bbff2666ba8f5cc9bedcf3
  licence: Apache-2.0
modifications:
- Linked against dbus-sensors at commit b979de60.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
