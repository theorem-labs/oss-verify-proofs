schema: oss-fuzz-theorems/harness/1
project: tink-cc
harness: tink_encrypt_fuzzer
rocq: OSSVerify.tink_cc.tink_encrypt_fuzzer
origin: oss-fuzz
summary: 'Checks one property, an API contract: AES-SIV EncryptDeterministically with a fixed valid 64-byte
  key must succeed on every message: ct.value() on a non-OK StatusOr throws absl::BadStatusOrAccess (uncaught
  -> std::terminate) or aborts when exceptions are off. (res.value() on New(key) is the same check on
  a constant key, trivially true.).'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/tink_encrypt_decrypt_fuzzer.cc
  from:
    repository: https://github.com/google/oss-fuzz
