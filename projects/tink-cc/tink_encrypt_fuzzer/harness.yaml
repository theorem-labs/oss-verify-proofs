    path: projects/tink-cc/tink_encrypt_decrypt_fuzzer.cc
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/tink-crypto/tink-cc
  commit: 527baad6ccd9957da349a4dbd46428110db54974
  licence: Apache-2.0
modifications:
- Linked against tink-cc at commit 527baad6 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
