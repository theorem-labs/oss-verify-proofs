    licence: LGPL-3.0-or-later
    evidence: fuzz/asn1_get_length_der_fuzzer.c:1-21 at 2b2065b2 (Copyright(c) 2020 Free Software Foundation,
      Inc.) names the GNU Lesser General Public License version 3 or later, which is the LGPLv3 additional
