proofs:
  origin: 'contributed by Trevor Hansen in https://github.com/theorem-labs/oss-verify-proofs/pull/19 (head
    289763e0107c895179efa27aa9710652a520f5e7); every one of the 393 of its 403 Rocq files that carry Anthropic''s
    copyright line and the tag Apache-2.0 OR MIT carries a `Modified by Trevor Hansen, 2026-11` line as
    well, and 10 files carry no licence lines. The pull request''s section "Files and where they came
    from" gives the mapping, and proofs.sources below repeats it. The proofs come from two fuzz targets
    of this repository, cgif/cgif_rgb_fuzzer and cjson/cjson_read_fuzzer, and through them from final-anthropic-opensource-formal-verification-proofs-package-2026-10-21
    (sha256 4c6c152f61ce538e439b9d2adef439f4dbe1a2d446767d84ac7c3946d7c6687a), which both of those fuzz
    targets'' build records name as where their own Anthropic-headered files came from. The copies can
    be checked against the tree: 386 of the 400 files of lib/ match a file of the same name in this repository
    in 90% of their lines or more, once licence lines, module paths and numbers are set aside'
  sources:
  - 'lib/C/<name>.v (359 files): projects/cgif/cgif_rgb_fuzzer/proofs/lib/<name>.v, 281 of them changed
    in module names only and 78 also in addresses and numbers, each one''s Modified by line saying how
    (the pull request lists the 78 by name); the two changes that go beyond restating values are malloc''s
    read-only tables as two image chunks (R_tabs, TABS_LEN in xO1v, xO1h and xO1i), because libtasn1''s
    link pads one byte between the de Bruijn table and size_classes, and two fetch facts for the jal words
    that differ in libtasn1''s binaries (xO3q)'
  - 'lib/J/<path>.v (29 files): projects/cjson/cjson_read_fuzzer/proofs/lib/<path>.v, changed in module
    names only'
  - 'lib/B/TopP.v, lib/B/TopU.v and lib/B/TopZZ.v: cgif_rgb_fuzzer''s YZ02.v, UZ02.v and UZZ0.v, with
    this harness''s contract in place of cgif''s library'
  - 'lib/B/LibP.v and lib/B/LibU.v: one lemma each (plain_find_high, ubsan_find_high) made from rn_find_segment_high
    of cgif_rgb_fuzzer''s UI39.v; the rest of each file is new'
  - 'lib/B/ConstAccept.v: cgif_rgb_fuzzer''s ConstAccept.v, with its two ASan corollaries replaced by
    UBSan ones built from lib/B/TopZZ.v'
  - 'lib/B/RegsExt.v, lib/B/Runs.v, lib/H/*.v and each statement''s Proof.v: written for this fuzz target'
  licence: Apache-2.0 OR MIT for the 393 files that carry Anthropic's copyright line and that tag. Of
    the 10 files with no licence lines, lib/B/ConstAccept.v is cgif_rgb_fuzzer's ConstAccept.v, which
    carries none either; that file was written in this repository, so both are MIT,
    this repository's LICENSE; lib/H/GldHarness.v, lib/H/GldPlainProof.v and lib/H/GldProof.v restate
    instruction words of the program and so begin with the one-line comment of that kind and carry no
    licence lines of their own (requirement 7, case 1); the other 6 (lib/B/RegsExt.v, lib/B/Runs.v, lib/H/GldUbsan.v
    and the three statements' Proof.v files) were written by the contributor, under MIT, this repository's
    licence (LICENSE)
  texts:
  - LICENSES/anthropic-proofs-LICENSE
  - LICENSES/anthropic-proofs-LICENSE-MIT
  - LICENSES/anthropic-proofs-NOTICE
  texts_location: the repository's top directory
  modified: each changed file that has licence lines carries one line under them saying so; lib/B/ConstAccept.v,
    which has none, carries no such line, and what was changed in it is in proofs.sources above
