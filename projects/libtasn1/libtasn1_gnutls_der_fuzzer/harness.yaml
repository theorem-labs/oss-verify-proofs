schema: oss-fuzz-theorems/harness/1
project: libtasn1
harness: libtasn1_gnutls_der_fuzzer
rocq: OSSVerify.libtasn1.libtasn1_gnutls_der_fuzzer
origin: upstream
summary: DER-decodes the input as GNUTLS.DHParameter and as GNUTLS.GOSTParameters (after asn1_write_value
  on digestParamSet), then re-encodes the GOST structure with asn1_der_coding (size query then encode);
  the re-encoding is not compared with anything and its return code is ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/libtasn1_gnutls_der_fuzzer.c
  from:
    repository: https://gitlab.com/gnutls/libtasn1
    commit: 2b2065b2383aebe138c7d0f7b5646369e5f56ec3
    path: fuzz/libtasn1_gnutls_der_fuzzer.c
  modified: false
  licence: LGPL-3.0-or-later
library:
  repository: https://gitlab.com/gnutls/libtasn1
  commit: 2b2065b2383aebe138c7d0f7b5646369e5f56ec3
  licence: NOASSERTION
modifications:
- Linked against libtasn1 at commit 2b2065b2.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
