schema: oss-fuzz-theorems/harness/1
project: numactl
harness: fuzz_parse_str
rocq: OSSVerify.numactl.fuzz_parse_str
origin: upstream
summary: numa_parse_nodestring and numa_parse_cpustring on the NUL-terminated input; the returned bitmasks
  are only freed (and passed to numa_node_to_cpus_v2, whose return value is ignored). No result is checked.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_parse_str.c
  from:
    repository: https://github.com/numactl/numactl
    commit: 13fb3bf75097d8407d15bb321fa797e0443b6d44
    path: fuzz/fuzz_parse_str.c
  modified: true
  licence: NOASSERTION
library:
  repository: https://github.com/numactl/numactl
  commit: 13fb3bf75097d8407d15bb321fa797e0443b6d44
  licence: NOASSERTION
modifications:
- Linked against numactl at commit 13fb3bf7 with 2 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
