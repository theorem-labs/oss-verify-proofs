schema: oss-fuzz-theorems/harness/1
project: libzip
harness: zip_read_metadata_fuzzer
rocq: OSSVerify.libzip.zip_read_metadata_fuzzer
origin: upstream
summary: 'open the input as an in-memory archive (ZIP_RDONLY) and call every metadata accessor per entry:
  zip_stat_index, external attributes, file comment, extra fields by index (local+central, <=64) and by
  6 well-known IDs; every result is discarded.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/zip_read_metadata_fuzzer.c
  from:
    repository: https://github.com/nih-at/libzip
    commit: 1d4b30ac5b1a1c8288b8dcb2add27214e9829453
    path: ossfuzz/zip_read_metadata_fuzzer.c
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/nih-at/libzip
  commit: 1d4b30ac5b1a1c8288b8dcb2add27214e9829453
  licence: BSD-3-Clause
modifications:
- Linked against libzip at commit 1d4b30ac.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
