schema: oss-fuzz-theorems/harness/1
project: dropbear
harness: fuzzer-cliconf
rocq: OSSVerify.dropbear.fuzzer_cliconf
origin: upstream
summary: Fuzz buffer supplies two booleans (username/port set) and a config-file string that is parsed
  by read_config_file via fmemopen; cli_opts results discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzzer-cliconf.c
  from:
    repository: https://github.com/mkj/dropbear
    commit: 1442f00d3f0d755d9f8ba83c5edcd893aa4d71db
    path: fuzz/fuzzer-cliconf.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/mkj/dropbear
  commit: 1442f00d3f0d755d9f8ba83c5edcd893aa4d71db
  licence: MIT
modifications:
- Linked against dropbear at commit 1442f00d with 4 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
