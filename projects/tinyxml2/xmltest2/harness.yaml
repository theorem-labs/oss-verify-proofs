schema: oss-fuzz-theorems/harness/1
project: tinyxml2
harness: xmltest2
rocq: OSSVerify.tinyxml2.xmltest2
origin: oss-fuzz
summary: Writes the input to /tmp/libfuzzer.<pid>, XMLDocument::LoadFile on it, unlinks it; the load result
  is discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/xmltest2.cpp
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/tinyxml2/xmltest2.cpp
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/leethomason/tinyxml2
  commit: 8224e427b655b83dae5e2298f1e6919523a78737
  licence: Zlib
modifications:
- Linked against tinyxml2 at commit 8224e427.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
