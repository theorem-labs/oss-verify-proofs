schema: oss-fuzz-theorems/harness/1
project: c-blosc
harness: compress_fuzzer
rocq: OSSVerify.c_blosc.compress_fuzzer
origin: upstream
summary: blosc_compress with level/filter/compressor/blocksize/splitmode from the first 5 bytes, then
  blosc_decompress of the result into a buffer of cbytes; decompress return value ignored and output never
  compared with the input.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_compress.c
  from:
    repository: https://github.com/Blosc/c-blosc
    commit: c8072c21dcce8daf6dd19a0bbae8c53458ad68cc
    path: tests/fuzz/fuzz_compress.c
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/Blosc/c-blosc
  commit: c8072c21dcce8daf6dd19a0bbae8c53458ad68cc
  licence: BSD-3-Clause
modifications:
- Linked against c-blosc at commit c8072c21.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
