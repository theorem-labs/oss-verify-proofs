project: c-blosc
harness: decompress_fuzzer
rocq: OSSVerify.c_blosc.decompress_fuzzer
origin: upstream
summary: header sanity (cbytes==size, nbytes!=0, blosc_cbuffer_validate) as input filters, then blosc_decompress;
  result ignored.
entry: LLVMFuzzerTestOneInput
source:
