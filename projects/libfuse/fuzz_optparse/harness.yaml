schema: oss-fuzz-theorems/harness/1
project: libfuse
harness: fuzz_optparse
rocq: OSSVerify.libfuse.fuzz_optparse
origin: oss-fuzz
summary: ada_fuzz_header draws two option strings, ten argv strings and an int; fuse_opt_parse runs over
  the 10-element argv with a 4-entry option_spec; the parsed options are freed and never inspected; return
  value only picks a cleanup path.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_optparse.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/libfuse/fuzz_optparse.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/libfuse/libfuse
  commit: 7e69009a6c7b6d5d865fe42482d33bad9a6dde9d
  licence: NOASSERTION
modifications:
- Linked against libfuse at commit 7e69009a.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
