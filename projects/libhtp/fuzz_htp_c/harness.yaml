    path: test/fuzz/fuzz_htp.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/OISF/libhtp
  commit: 90c42f0c2ecd641cc059dacca09aa98e3c810177
  licence: NOASSERTION
modifications:
- Linked against libhtp at commit 90c42f0c with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
