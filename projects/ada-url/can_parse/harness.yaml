schema: oss-fuzz-theorems/harness/1
project: ada-url
harness: can_parse
rocq: OSSVerify.ada_url.can_parse
origin: upstream
summary: 'Checks 3 properties (listed below); the first, an API contract: can_parse(source) == parse<url_aggregator>(source).has_value()
  == parse<url>(source).has_value(); with a base: can_parse(source,&base) == parse(source,&base).has_value(),
  and can_parse_with_base must be false when the base itself does not parse.'
entry: LLVMFuzzerTestOneInput
