    path: fuzz/can_parse.cc
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/ada-url/ada
  commit: e67544784e8df244a7d999f7423bc8680b9ccdca
  licence: NOASSERTION
modifications:
- Linked against ada at commit e6754478.
- In every build, getenv() returns NULL and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
