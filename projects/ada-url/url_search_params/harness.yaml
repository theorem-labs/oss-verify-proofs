schema: oss-fuzz-theorems/harness/1
project: ada-url
harness: url_search_params
rocq: OSSVerify.ada_url.url_search_params
origin: upstream
summary: 'Checks 2 properties (listed below); the first, an idempotence law: application/x-www-form-urlencoded
  serialisation is a fixed point: url_search_params(s).to_string() == s for s = to_string() of (a) params
  built from fuzz input, (b) params after append/set/remove/sort/reset/copy/move, and (c) params taken
  from a URL whose query is the fuzz input.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/url_search_params.cc
  from:
    repository: https://github.com/ada-url/ada
    commit: e67544784e8df244a7d999f7423bc8680b9ccdca
    path: fuzz/url_search_params.cc
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/ada-url/ada
  commit: e67544784e8df244a7d999f7423bc8680b9ccdca
  licence: NOASSERTION
modifications:
- Linked against ada at commit e6754478.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
