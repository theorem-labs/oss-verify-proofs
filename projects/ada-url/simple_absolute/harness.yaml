project: ada-url
harness: simple_absolute
rocq: OSSVerify.ada_url.simple_absolute
origin: upstream
summary: 'Checks 3 properties (listed below); the first, an idempotence law: Re-parsing href succeeds
  and yields the identical href, for both representations.'
entry: LLVMFuzzerTestOneInput
source:
