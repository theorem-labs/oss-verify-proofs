licence: NOASSERTION
checks:
- kind: differential
  strength: full
  stops_with: assert
  live: true
  where: source/parse.cc:287-313
  what: All ten components (protocol, href, hostname, pathname, search, hash, port, username, password,
    host) are equal between ada::url and ada::url_aggregator (asserts at 287-304). After set_href(source)
    on both, ONLY href is compared again (assert at 313), not the other nine components
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/parse.cc:450-479
  what: 'clear_port/clear_search/clear_hash postconditions: has_x() becomes false and get_x() becomes
    empty'
- kind: differential
  strength: full
  stops_with: abort
  live: unknown
  where: source/parse.cc:582-643
  what: After every step of a fuzz-chosen sequence of up to 8 setters (protocol/username/password/hostname/host/pathname/search/hash/port)
    applied to both representations, their hrefs are identical
- kind: idempotence
  strength: full
  stops_with: abort
  live: unknown
  where: source/parse.cc:653-668
  what: Re-parsing the href of a successful url_aggregator parse must succeed and give the identical href
- kind: idempotence
  strength: full
  stops_with: abort
  live: unknown
  where: source/parse.cc:681-708
  what: 'url_search_params serialisation is a fixed point: url_search_params(sp.to_string()).to_string()
    == sp.to_string() (sp taken from a URL whose query is the fuzz input, plus an appended pair)'
failure_handlers: none
