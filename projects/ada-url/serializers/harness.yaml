origin: upstream
summary: 'Checks 5 properties (listed below); the first, a round trip: IPv4: if try_parse_ipv4_fast(s)
  = v <= 0xFFFFFFFF then try_parse_ipv4_fast(serializers::ipv4(v)) == v.'
entry: LLVMFuzzerTestOneInput
