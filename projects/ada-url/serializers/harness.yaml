checks:
- kind: roundtrip
  strength: full
  stops_with: abort
  live: unknown
  where: source/serializers.cc:61-77
  what: 'IPv4: if try_parse_ipv4_fast(s) = v <= 0xFFFFFFFF then try_parse_ipv4_fast(serializers::ipv4(v))
    == v'
- kind: roundtrip
  strength: full
  stops_with: abort
  live: unknown
  where: source/serializers.cc:149-167
  what: percent_decode(percent_encode(s, PATH_PERCENT_ENCODE)) == s for sources containing no %; and percent_encode
    is the identity when it emits no %
- kind: invariant
  strength: full
  stops_with: abort
  live: true
  where: source/serializers.cc:222-230
  what: is_normalized_windows_drive_letter(s) implies is_windows_drive_letter(s)
- kind: idempotence
  strength: full
  stops_with: abort
  live: unknown
  where: source/serializers.cc:281-298
  what: A URL built from the serialized fuzzed IPv6 address, if it parses, re-parses to the identical
    href
failure_handlers: none
