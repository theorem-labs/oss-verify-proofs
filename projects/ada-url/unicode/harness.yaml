licence: NOASSERTION
checks:
- kind: invariant
  strength: full
  stops_with: abort
  live: true
  where: source/unicode.cc:27-70
  what: 'Per-byte classification subset laws: forbidden_host => forbidden_domain, ascii_digit => ascii_hex_digit,
    lowercase_hex => ascii_hex_digit, and convert_hex_to_binary(c) <= 15 for hex digits'
- kind: invariant
  strength: full
  stops_with: abort
  live: true
  where: source/unicode.cc:99-109
  what: is_double_dot_path_segment and is_single_dot_path_segment are never both true
- kind: invariant
  strength: partial
  stops_with: assert
  live: true
  where: source/unicode.cc:137-196
  what: 'Length/position bounds: prune_hash, trim_c0_whitespace and remove_ascii_tab_or_newline never
    lengthen; find_authority_delimiter(_special) and get_host_delimiter_location return positions <= size'
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/unicode.cc:154-166
  what: remove_ascii_tab_or_newline leaves no \t, \n or \r in its output
failure_handlers: none
distribution:
  file: Distribution.v
  argv0: unicode
  input_file: input.bin
  prefix_hex: '000000000000'
  payload:
    length: geometric
    p: 1/257
    mean_bytes: 256
    alphabet: bytes
  components:
    payload: 9/10
    wrong_argc: 1/50
    missing_file: 1/50
    full_support: 3/50
  mass: '1'
