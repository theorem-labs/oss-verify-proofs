schema: oss-fuzz-theorems/harness/1
project: ada-url
harness: max_length
rocq: OSSVerify.ada_url.max_length
origin: upstream
summary: 'Checks one property, an invariant: With ada::set_max_input_length(512), no parse, base-relative
  parse, fuzz-chosen setter sequence (up to 16 steps) or percent-encoding-expanding setter can yield get_href_size()
  > 512, for both ada::url and ada::url_aggregator.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/max_length.cc
  from:
    repository: https://github.com/ada-url/ada
    commit: e67544784e8df244a7d999f7423bc8680b9ccdca
    path: fuzz/max_length.cc
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/ada-url/ada
  commit: e67544784e8df244a7d999f7423bc8680b9ccdca
  licence: NOASSERTION
modifications:
- Linked against ada at commit e6754478.
- In every build, getenv() returns NULL and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
