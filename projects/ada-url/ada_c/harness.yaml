licence: NOASSERTION
checks:
- kind: invariant
  strength: partial
  stops_with: abort
  live: unknown
  where: source/ada_c.cc:69-88
  what: ada_get_host_type() <= 2 and ada_get_scheme_type() <= 6 (enum range)
- kind: invariant
  strength: partial
  stops_with: abort
  live: unknown
  where: source/ada_c.cc:100-114
  what: Every url component offset (protocol_end .. hash_start) is either omitted (0xffffffff) or <= href
    length
- kind: idempotence
  strength: full
  stops_with: abort
  live: unknown
  where: source/ada_c.cc:127-142
  what: After a sequence of fuzzed setters and clear_* calls on a valid URL, ada_parse(href) must be valid
    and its href must equal the original href byte for byte
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/ada_c.cc:159-178
  what: 'C API: ada_can_parse(input) must equal ada_is_valid(ada_parse(input)); same for ada_can_parse_with_base
    vs ada_parse_with_base'
- kind: api-contract
  strength: weak
  stops_with: abort
  live: unknown
  where: source/ada_c.cc:207-271
  what: ada_get_version() is non-null; can_parse/parse agreement also re-checked on 4 fixed anchor URLs
    (constant inputs)
distribution:
  file: Distribution.v
  argv0: ada_c
  input_file: input.bin
  prefix_hex: '000000000000'
  payload:
    length: geometric
    p: 1/1025
    mean_bytes: 1024
    alphabet: bytes
  components:
    payload: 9/10
    wrong_argc: 1/50
    missing_file: 1/50
    full_support: 3/50
  mass: '1'
