schema: oss-fuzz-theorems/harness/1
project: libheif
harness: box_fuzzer
rocq: OSSVerify.libheif.box_fuzzer
origin: upstream
summary: Reads ISOBMFF boxes in a loop from a memory BitstreamRange with a 2 GiB total-memory limit and
  calls get_type/get_type_string/dump on each; dump output is discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/box_fuzzer.cc
  from:
    repository: https://github.com/strukturag/libheif
    commit: 1a3583bcce77de6d3f8701c0758e3954863681ba
    path: fuzzing/box_fuzzer.cc
  modified: false
  licence: LGPL-3.0-or-later
library:
  repository: https://github.com/strukturag/libheif
  commit: 1a3583bcce77de6d3f8701c0758e3954863681ba
  licence: LGPL-3.0-or-later
modifications:
- Linked against libheif at commit 1a3583bc.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
