schema: oss-fuzz-theorems/harness/1
project: libldac
harness: libldac_encode_fuzzer
rocq: OSSVerify.libldac.libldac_encode_fuzzer
origin: upstream
summary: FuzzedDataProvider picks channel mode, sample format, EQMID and rate, then loops calling ldacBT_encode
  over the whole input, sampling-frequency/bitrate/version getters; encoded stream and return codes ignored.
entry: LLVMFuzzerTestOneInput
source:
  files: []
  modified: true
  licence: NOASSERTION
  pending: true
library:
  repository: https://android.googlesource.com/platform/external/libldac
  commit: eeee1a3f5f8df1282e3a6d297085885fd886737b
  licence: NOASSERTION
modifications:
- Linked against libldac at commit eeee1a3f.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source was modified for these builds; the modified copy is not in this release yet.
