schema: oss-fuzz-theorems/harness/1
project: systemd
harness: fuzz-bus-label
rocq: OSSVerify.systemd.fuzz_bus_label
origin: upstream
summary: bus_label_unescape_n(data) then bus_label_escape(result); escape(unescape(x)) is never compared
  with x.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz-bus-label.c
  modified: false
  licence: LGPL-2.1-or-later
library:
  repository: https://github.com/systemd/systemd
  commit: 91927a2a1281be60f931e90d78e851d8ffd0688f
  licence: NOASSERTION
modifications:
- Linked against systemd at commit 91927a2a with 2 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
