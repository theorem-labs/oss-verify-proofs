checks:
- kind: invariant
  strength: partial
  stops_with: abort
  live: unknown
  where: source/base64.cpp:41-49
  what: 'Decode path: binary_length_from_base64 never exceeds maximal_binary_length_from_base64, for arbitrary
    (mostly invalid) base64 text in char or char16_t.'
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/base64.cpp:60-67
  what: Under loose last-chunk handling, a successful base64_to_binary must report exactly binary_length_from_base64
    bytes.
- kind: invariant
  strength: partial
  stops_with: assert
  live: true
  where: source/base64.cpp:103-125
  what: 'base64_to_binary_safe with a fuzzed output-buffer size: written length <= buffer size (assert);
    on OUTPUT_BUFFER_TOO_SMALL and BASE64_INPUT_REMAINDER the reported input count <= input size (abort);
    on INVALID_BASE64_CHARACTER the error position < input size (assert).'
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/base64.cpp:184-190
  what: base64_length_from_binary(n, option) must equal the number of characters binary_to_base64 actually
    writes.
failure_handlers: none
