rocq: OssFuzzTheorems.simdutf.base64
origin: upstream
summary: 'Checks 7 properties (listed below); the first, an API contract: base64_length_from_binary(n,
  option) must equal the number of characters binary_to_base64 actually writes.'
entry: LLVMFuzzerTestOneInput
