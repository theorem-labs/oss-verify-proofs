schema: oss-fuzz-theorems/harness/1
project: cppcheck
harness: oss-fuzz-client
rocq: OSSVerify.cppcheck.oss_fuzz_client
origin: upstream
summary: generateCode2 (oss-fuzz/type2.cpp) turns the bytes into C++ source, CppCheck::checkBuffer analyses
  it with all checks enabled; diagnostics go to a DummyErrorLogger and are dropped.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/main.cpp
  from:
    repository: https://github.com/cppcheck-opensource/cppcheck
    commit: 5e7baff38ff8fbb87c4a25de33345436386febb5
    path: oss-fuzz/main.cpp
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/cppcheck-opensource/cppcheck
  commit: 5e7baff38ff8fbb87c4a25de33345436386febb5
  licence: GPL-3.0-or-later
modifications:
- Linked against cppcheck at commit 5e7baff3.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
