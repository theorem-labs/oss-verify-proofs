schema: oss-fuzz-theorems/harness/1
project: ndpi
harness: fuzz_alg_crc32_md5
rocq: OSSVerify.ndpi.fuzz_alg_crc32_md5
origin: upstream
summary: runs CRC16 variants, CRC32, one-shot and two-chunk MD5, murmur/quick hashes, popcount, bin2hex->hex2bin
  and hex_encode->hex_decode over the input; every result is discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_alg_crc32_md5.c
  from:
    repository: https://github.com/ntop/nDPI
    commit: 2b26905efaae62a631fdb7d96224213a1300c47c
    path: fuzz/fuzz_alg_crc32_md5.c
  modified: false
  licence: LGPL-3.0-or-later
library:
  repository: https://github.com/ntop/nDPI
  commit: 2b26905efaae62a631fdb7d96224213a1300c47c
  licence: LGPL-3.0-or-later
modifications:
- Linked against nDPI at commit 2b26905e.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
