    path: fuzzing/cjson_read_fuzzer.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/DaveGamble/cJSON
  commit: acc76239bee01d8e9c858ae2cab296704e52d916
  version: 1.7.18
  licence: MIT
modifications:
- Linked against cJSON 1.7.18 at commit acc76239.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
