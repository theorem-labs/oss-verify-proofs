  licence: Apache-2.0 OR MIT
  texts:
  - LICENSES/anthropic-proofs-LICENSE
  - LICENSES/anthropic-proofs-LICENSE-MIT
  - LICENSES/anthropic-proofs-NOTICE
  texts_location: the repository's top directory
  modified: each changed file carries one line under its licence header saying so
flags:
  note: as written in the recipe; a library's own build system adds its flags after these (e.g. CMake Release appends
    -O3 -DNDEBUG), see the pin and recipes.sh
  lines:
  - 'recipe/tools/build-body.sh:58: OFT_NO_BUILTIN_ALLOC="-fno-builtin-malloc -fno-builtin-calloc -fno-builtin-realloc
    -fno-builtin-reallocarray -fno-builtin-free -fno-builtin-aligned_alloc -fno-builtin-posix_memalign -fno-builtin-memalign
    -fno-builtin-valloc -fno-builtin-strdup -fno-builtin-strndup"'
  - 'recipe/tools/build-body.sh:59: BASE_CFLAGS="-march=rv64g -mabi=lp64d -Os -g -ffunction-sections -fdata-sections
    -fno-stack-protector -fno-plt -Wdate-time $OFT_NO_BUILTIN_ALLOC"'
  - 'recipe/tools/build-body.sh:65: SAN=""'
  - 'recipe/tools/build-body.sh:560: SAN="-fsanitize=address"'
  - 'recipe/tools/build-body.sh:577: SAN="-fsanitize=address -fsanitize=undefined -fno-sanitize-recover=all -fsanitize-trap=all
    -fno-sanitize=function"'
  - 'recipe/tools/build-body.sh:586: SAN="-fsanitize=undefined -fno-sanitize-recover=all -fsanitize-trap=all -fno-sanitize=function"'
  - 'recipe/tools/build-body.sh:590: SAN=""'
  - 'recipe/tools/build-body.sh:618: CFLAGS="$BASE_CFLAGS $SAN -fmacro-prefix-map=$LIBROOT/=/work/build/lib/FLAVOUR/"'
  - 'recipe/tools/build-body.sh:431: ''clang --config=/opt/asan-static/musl.cfg'''
  - 'recipe/tools/build-body.sh:441: ''clang++ --config=/opt/asan-static/musl.cfg -stdlib=libc++'''
  - 'recipe/tools/build-body.sh:478: SEALED_CFG=/opt/asan-static/asan-musl-sealed.cfg'
  - 'recipe/tools/build-body.sh:1019: SILENT_LD=""'
  - 'recipe/tools/build-body.sh:1021: SILENT_LD="-Wl,--defsym=__sanitizer_silent_reports=1"'
  - 'recipe/tools/build-body.sh:1027: SILENT_LD=""'
  - 'recipe/tools/build-body.sh:1049: "$CC" $BASE_CFLAGS -static -no-pie -Wl,--gc-sections ${OFT_STRIP--Wl,--strip-all}
    \'
  - 'recipe/tools/build-body.sh:1054: "$CC" $BASE_CFLAGS -static -no-pie -Wl,--gc-sections ${OFT_STRIP--Wl,--strip-all}
    \'
  - 'recipe/targets/cjson-cjson_read_fuzzer/pin:40: LIB_CFLAGS=""'
  - 'recipe/targets/cjson-cjson_read_fuzzer/pin:74: oft_build_cmake -DENABLE_CUSTOM_COMPILER_FLAGS=OFF -DENABLE_CJSON_TEST=OFF
    -DENABLE_CJSON_UTILS=ON'
