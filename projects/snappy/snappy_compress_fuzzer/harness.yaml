licence: NOASSERTION
checks:
- kind: api-contract
  strength: full
  stops_with: assert
  live: true
  where: source/snappy_compress_fuzzer.cc:45-50
  what: The size returned by Compress equals the size of the output string it wrote
- kind: invariant
  strength: full
  stops_with: assert
  live: true
  where: source/snappy_compress_fuzzer.cc:51
  what: Compressed length never exceeds the documented worst-case bound MaxCompressedLength(input.size())
- kind: self-validation
  strength: full
  stops_with: assert
  live: true
  where: source/snappy_compress_fuzzer.cc:52-53
  what: The just-produced compressed buffer is accepted by the validator IsValidCompressedBuffer
- kind: roundtrip
  strength: full
  stops_with: assert
  live: true
  where: source/snappy_compress_fuzzer.cc:55-61
  what: 'For every compression level MinCompressionLevel()..MaxCompressionLevel(): Uncompress(Compress(input,
    level)) == input, full std::string equality'
- kind: api-contract
  strength: full
  stops_with: assert
  live: unknown
  where: source/snappy_compress_fuzzer.cc:60
  what: Uncompress of a buffer produced by Compress reports success
failure_handlers: none
