    path: tests/fuzz_test_sig_stfl_lms.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/open-quantum-safe/liboqs
  commit: 8979276ad1eb008215aa78a3c56b3649f604bbb1
  licence: MIT
modifications:
- Linked against liboqs at commit 8979276a.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
