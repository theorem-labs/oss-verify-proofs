project: liboqs
harness: fuzz_test_kem
rocq: OssFuzzTheorems.liboqs.fuzz_test_kem
origin: upstream
summary: 'Checks one property, a round trip: KEM correctness: for the fuzz-selected algorithm (all OQS_KEM_algs)
  and a fuzz-seeded RNG, keypair -> encaps -> decaps and the decapsulated shared secret must equal the
  encapsulated one byte-for-byte.'
