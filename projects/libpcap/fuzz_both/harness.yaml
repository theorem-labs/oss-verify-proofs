schema: oss-fuzz-theorems/harness/1
project: libpcap
harness: fuzz_both
rocq: OSSVerify.libpcap.fuzz_both
origin: upstream
summary: Byte 0 = filter length; the filter string is pcap_compile-d against a pcap file built from the
  rest (written to /tmp), and pcap_offline_filter is evaluated on every packet; the verdict is only fprintf-ed
  to /dev/null.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_both.c
  from:
    repository: https://github.com/the-tcpdump-group/libpcap
    commit: 7fc0bcd48aee89f0b09fdc1c10346fe55b386a80
    path: testprogs/fuzz/fuzz_both.c
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/the-tcpdump-group/libpcap
  commit: 7fc0bcd48aee89f0b09fdc1c10346fe55b386a80
  licence: BSD-3-Clause
modifications:
- Linked against libpcap at commit 7fc0bcd4.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
