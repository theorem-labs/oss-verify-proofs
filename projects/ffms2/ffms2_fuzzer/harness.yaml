schema: oss-fuzz-theorems/harness/1
project: ffms2
harness: ffms2_fuzzer
rocq: OSSVerify.ffms2.ffms2_fuzzer
origin: oss-fuzz
summary: Writes the input to /tmp/libfuzzer.<pid>, creates an indexer and indexes it (FFMS_IEH_ABORT),
  asks for the first video track; the index and track number are discarded and no frame is decoded.
entry: LLVMFuzzerTestOneInput
source:
  files: []
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/ffms2/ffms2_fuzzer.cc
  modified: true
  licence: Apache-2.0
  pending: true
library:
  repository: https://github.com/FFMS/ffms2
  commit: 3af2ef2ae47bc30b64597c9e419e5b19c4bda7d8
  licence: MIT
modifications:
- Linked against ffms2 at commit 3af2ef2a.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source was modified for these builds; the modified copy is not in this release yet.
