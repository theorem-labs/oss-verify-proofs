schema: oss-fuzz-theorems/harness/1
project: libucl
harness: ucl_add_string_fuzzer
rocq: OSSVerify.libucl.ucl_add_string_fuzzer
origin: upstream
summary: ucl_parser_add_string on the (non-NUL-terminated) input with its length; returns early (leaking
  the parser, hence detect_leaks=0 in the .options) on a parse error; the parsed object is never inspected.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/ucl_add_string_fuzzer.c
  from:
    repository: https://github.com/vstakhov/libucl
    commit: 04e5e70b700d219701abda220f06beca7bff1e25
    path: tests/fuzzers/ucl_add_string_fuzzer.c
  modified: false
  licence: BSD-2-Clause
library:
  repository: https://github.com/vstakhov/libucl
  commit: 04e5e70b700d219701abda220f06beca7bff1e25
  licence: BSD-2-Clause
modifications:
- Linked against libucl at commit 04e5e70b.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
