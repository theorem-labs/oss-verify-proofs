    path: projects/piex/piex_fuzzer.cc
  modified: false
  licence: Apache-2.0
library:
  repository: https://android.googlesource.com/platform/external/piex
  commit: eaddfa72c1693728db64101701431421371c38da
  licence: Apache-2.0
modifications:
- Linked against piex at commit eaddfa72.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
