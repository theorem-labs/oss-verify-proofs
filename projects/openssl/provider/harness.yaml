schema: oss-fuzz-theorems/harness/1
project: openssl
harness: provider
rocq: OSSVerify.openssl.provider
origin: upstream
summary: Picks a digest/cipher/KDF/MAC/RAND algorithm from all providers by input index, fills its settable
  params from the input, runs a fixed operation; sig/asym/KEM/keyexch/keymgmt ops are stubs returning
  0; results ignored.
entry: FuzzerTestOneInput
source:
  files:
  - source/provider.c
  from:
    repository: https://github.com/openssl/openssl
    commit: 47aae188a6bdc65675ea9c2a9e770bef48a5d781
    path: fuzz/provider.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/openssl/openssl
  commit: 47aae188a6bdc65675ea9c2a9e770bef48a5d781
  licence: Apache-2.0
modifications:
- Linked against openssl at commit 47aae188.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
