licence: NOASSERTION
checks:
- kind: api-contract
  strength: partial
  stops_with: assert
  live: true
  where: source/quic-client.c:164-170
  what: After SSL_read returns n > 0 into a 1024-byte buffer, n <= sizeof(buffer) (SSL_read never reports
    more bytes than requested); the echo SSL_write then reuses n.
- kind: invariant
  strength: weak
  stops_with: assert
  live: true
  where: source/quic-client.c:217-218
  what: 'Harness bookkeeping after each state step: the current stream is non-NULL and its index is below
    the stream count (checks the harness''s own accept/create/swap stream logic).'
failure_handlers: none
