schema: oss-fuzz-theorems/harness/1
project: openssl
harness: hashtable
rocq: OssFuzzTheorems.openssl.hashtable
origin: upstream
summary: 'Checks 3 properties (listed below); the first, a reference oracle: OP_FOREACH: ossl_ht_foreach_until
  finds the key''s value iff the prediction table marks it allocated; OP_FILTER: ossl_ht_filter returns
  exactly 0 or 1 matching value as predicted. Only an empty table in a single-input run.'
entry: FuzzerTestOneInput
source:
  files:
  - source/hashtable.c
  from:
    repository: https://github.com/openssl/openssl
    commit: 47aae188a6bdc65675ea9c2a9e770bef48a5d781
    path: fuzz/hashtable.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/openssl/openssl
  commit: 47aae188a6bdc65675ea9c2a9e770bef48a5d781
  licence: Apache-2.0
modifications:
- Linked against openssl at commit 47aae188.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
