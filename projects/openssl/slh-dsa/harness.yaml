schema: oss-fuzz-theorems/harness/1
project: openssl
harness: slh-dsa
rocq: OSSVerify.openssl.slh_dsa
origin: upstream
summary: 'Checks 2 properties (listed below); the first, a self-validation: Sign-then-verify with an in-harness
  SLH-DSA key over the input message, with context-string / message-encoding / deterministic params chosen
  by the input; verify failure only fprintf(stderr).'
entry: FuzzerTestOneInput
source:
  files:
  - source/slh-dsa.c
  from:
    repository: https://github.com/openssl/openssl
    commit: 47aae188a6bdc65675ea9c2a9e770bef48a5d781
    path: fuzz/slh-dsa.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/openssl/openssl
  commit: 47aae188a6bdc65675ea9c2a9e770bef48a5d781
  licence: Apache-2.0
modifications:
- Linked against openssl at commit 47aae188.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
