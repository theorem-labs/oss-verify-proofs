schema: oss-fuzz-theorems/harness/1
project: openssl
harness: asn1
rocq: OSSVerify.openssl.asn1
origin: upstream
summary: 'For 144 ASN.1 item types (111 unconditional, 33 under OPENSSL_NO_CMS/OCSP/RFC3779/DH/EC/DEPRECATED_3_0
  guards that the default Configure leaves enabled) plus TS/ESS/DH/DSA/RSA/EC/EVP_PKEY/SSL_SESSION d2i
  functions: d2i, print to a null BIO, i2d; outputs discarded (a d2i->i2d shape with no comparison).'
entry: FuzzerTestOneInput
source:
  files:
  - source/asn1.c
  from:
    repository: https://github.com/openssl/openssl
    commit: 47aae188a6bdc65675ea9c2a9e770bef48a5d781
    path: fuzz/asn1.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/openssl/openssl
  commit: 47aae188a6bdc65675ea9c2a9e770bef48a5d781
  licence: Apache-2.0
modifications:
- Linked against openssl at commit 47aae188.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
