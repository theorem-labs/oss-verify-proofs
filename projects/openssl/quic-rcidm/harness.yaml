rocq: OSSVerify.openssl.quic_rcidm
origin: upstream
summary: Command interpreter over ossl_quic_rcidm_* (add from initial/retry/NCID, handshake complete,
  packet sent, roll, pop/peek retire, preferred DCID); results ignored.
entry: FuzzerTestOneInput
