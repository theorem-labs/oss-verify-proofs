schema: oss-fuzz-theorems/harness/1
project: openssl
harness: quic-srtm
rocq: OSSVerify.openssl.quic_srtm
origin: upstream
summary: 'Checks one property, an invariant: After every successful add/remove/cull/lookup the harness
  calls the library''s ossl_quic_srtm_check(): both hash indexes (by opaque/seq and by blinded token)
  must hold the same items (token marking + count equality), with no duplicate (opaque, seq) pair and
  seq numbers strictly decreasing along each opaque''s chain. Structural consistency, not a content model.'
entry: FuzzerTestOneInput
source:
  files:
  - source/quic-srtm.c
  from:
    repository: https://github.com/openssl/openssl
    commit: 47aae188a6bdc65675ea9c2a9e770bef48a5d781
    path: fuzz/quic-srtm.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/openssl/openssl
  commit: 47aae188a6bdc65675ea9c2a9e770bef48a5d781
  licence: Apache-2.0
modifications:
- Linked against openssl at commit 47aae188.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
