schema: oss-fuzz-theorems/harness/1
project: openssl
harness: bignum
rocq: OSSVerify.openssl.bignum
origin: upstream
summary: 'Checks one property, a differential check: BN_mod_exp (optimised) vs BN_mod_exp_simple (reference)
  on the same a, b, m decoded from the input; a mismatch only prints the five numbers to stdout and the
  function still returns 0 (the OPENSSL_assert(success) was removed by c263ea553c, 2026-07-15).'
entry: FuzzerTestOneInput
source:
  files:
  - source/bignum.c
  from:
    repository: https://github.com/openssl/openssl
