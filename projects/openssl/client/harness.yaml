project: openssl
harness: client
rocq: OSSVerify.openssl.client
origin: upstream
summary: TLS client handshake over a memory BIO fed the input, then SSL_read until error; nothing compared.
entry: FuzzerTestOneInput
source:
  files:
  - source/client.c
  from:
    repository: https://github.com/openssl/openssl
