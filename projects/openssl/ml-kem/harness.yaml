checks:
- kind: roundtrip
  strength: full
  stops_with: print-only
  live: unknown
  where: source/ml-kem.c:269-323
  what: Encapsulate a random 32-byte secret to an in-harness ML-KEM key, decapsulate, compare with memcmp;
    a mismatch only fprintf(stderr) "mismatch on secret comparison".
distribution:
  file: Distribution.v
  argv0: ml-kem
  input_file: input.bin
  prefix_hex: '000000000000'
  payload:
    length: geometric
    p: 1/257
    mean_bytes: 256
    alphabet: bytes
  components:
    payload: 9/10
    wrong_argc: 1/50
    missing_file: 1/50
    full_support: 3/50
  mass: '1'
