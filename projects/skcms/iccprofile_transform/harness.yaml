schema: oss-fuzz-theorems/harness/1
project: skcms
harness: iccprofile_transform
rocq: OSSVerify.skcms.iccprofile_transform
origin: upstream
summary: skcms_Transform RGBA_8888 in both directions between the parsed profile and sRGB for every src/dst
  alpha format, before and after skcms_MakeUsableAsDestination; the returned bool and the destination
  pixels are never checked.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_iccprofile_transform.c
  from:
    repository: https://skia.googlesource.com/skcms
    commit: 9c10699e8884c14c3161b7afc5996d29b6cb7845
    path: fuzz/fuzz_iccprofile_transform.c
  modified: true
  licence: BSD-3-Clause
library:
  repository: https://skia.googlesource.com/skcms
  commit: 9c10699e8884c14c3161b7afc5996d29b6cb7845
  licence: BSD-3-Clause
modifications:
- Linked against skcms at commit 9c10699e with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
