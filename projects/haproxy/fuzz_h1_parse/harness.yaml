schema: oss-fuzz-theorems/harness/1
project: haproxy
harness: fuzz_h1_parse
rocq: OSSVerify.haproxy.fuzz_h1_parse
origin: oss-fuzz
summary: First byte selects request/response; h1_headers_to_hdr_list over a NUL-terminated copy of the
  rest into a 101-entry header list; the return value, parsed start line and headers are discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_h1_parse.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/haproxy/fuzz_h1_parse.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/haproxy/haproxy
  commit: cb1eebf9d985a2100c6eff4368cde539d89fd845
  licence: NOASSERTION
modifications:
- Linked against haproxy at commit cb1eebf9 with 2 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
