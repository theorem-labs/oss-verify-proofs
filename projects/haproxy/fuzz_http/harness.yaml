schema: oss-fuzz-theorems/harness/1
project: haproxy
harness: fuzz_http
rocq: OSSVerify.haproxy.fuzz_http
origin: oss-fuzz
summary: 'First byte (mod 7) selects one group of src/http.c helpers: URI scheme/authority/path parsing,
  Content-Length parsing (twice, to hit duplicate detection), cookie extraction, header/start-line/status
  parsing, host/port/method/qvalue/etag helpers, URL-parameter search, cookie-value end. All results are
  discarded.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_http.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/haproxy/fuzz_http.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/haproxy/haproxy
  commit: cb1eebf9d985a2100c6eff4368cde539d89fd845
  licence: NOASSERTION
modifications:
- Linked against haproxy at commit cb1eebf9 with 2 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
