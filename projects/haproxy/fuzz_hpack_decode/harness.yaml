schema: oss-fuzz-theorems/harness/1
project: haproxy
harness: fuzz_hpack_decode
rocq: OSSVerify.haproxy.fuzz_hpack_decode
origin: upstream
summary: Allocates a 4096-byte dynamic header table and runs hpack_decode_frame on the fuzzed bytes into
  a 1000-entry header list; the return code and decoded headers are discarded (no HPACK encode/decode
  round-trip).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_hpack_decode.c
  modified: true
  licence: Apache-2.0
library:
  repository: https://github.com/haproxy/haproxy
  commit: cb1eebf9d985a2100c6eff4368cde539d89fd845
  licence: NOASSERTION
modifications:
- Linked against haproxy at commit cb1eebf9 with 2 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
- This copy of the harness could not be matched to an upstream file at a pinned commit, so it is marked
  modified; it is the file as built.
