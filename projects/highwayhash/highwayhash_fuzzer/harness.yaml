schema: oss-fuzz-theorems/harness/1
project: highwayhash
harness: highwayhash_fuzzer
rocq: OSSVerify.highwayhash.highwayhash_fuzzer
origin: upstream
summary: First 32 bytes become a 256-bit HHKey; HighwayHash64 of the rest via InstructionSets::Run<HighwayHash>;
  the result is never read.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/highwayhash_fuzzer.cc
  from:
    repository: https://github.com/google/highwayhash
    commit: f8381f3331d9c56a9792f9b4a35f61c41108c39e
    path: highwayhash/highwayhash_fuzzer.cc
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/google/highwayhash
  commit: f8381f3331d9c56a9792f9b4a35f61c41108c39e
  licence: Apache-2.0
modifications:
- Linked against highwayhash at commit f8381f33.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
