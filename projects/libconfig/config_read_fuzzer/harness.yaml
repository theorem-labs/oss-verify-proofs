schema: oss-fuzz-theorems/harness/1
project: libconfig
harness: config_read_fuzzer
rocq: OSSVerify.libconfig.config_read_fuzzer
origin: upstream
summary: 'The input is a packed header (lookup type, content size, path size) + NUL-terminated config
  text + NUL-terminated path: config_read_string, recursive search for a setting named by the path, a
  typed lookup (float/bool/int/int64/string/const) chosen by the header, then set-or-add a float member
  1.234 at the path, config_write to /dev/null and config_setting_remove. No looked-up or written value
  is checked (e.g. that the float just set reads back as 1.234, or that config_write output re-parses).'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_config_read.c
  from:
    repository: https://github.com/hyperrealm/libconfig
    commit: e485a729d2cf27321a560a61af0816b123337d00
    path: fuzz/fuzz_config_read.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/hyperrealm/libconfig
  commit: e485a729d2cf27321a560a61af0816b123337d00
  licence: NOASSERTION
modifications:
- Linked against libconfig at commit e485a729.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
