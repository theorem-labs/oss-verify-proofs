harness: wat2wasm_fuzzer
rocq: OSSVerify.wabt.wat2wasm_fuzzer
origin: upstream
summary: WastLexer over the input, ParseWatModule with default features; module and errors discarded (no
  wasm is written despite the name).
entry: LLVMFuzzerTestOneInput
