project: zstd
harness: huf_decompress
rocq: OSSVerify.zstd.huf_decompress
origin: upstream
summary: HUF_readDTableX1/X2 of the input (errors skip), then HUF_decompress1X/4X_usingDTable with random
  flags and buffer size; result ignored.
entry: LLVMFuzzerTestOneInput
