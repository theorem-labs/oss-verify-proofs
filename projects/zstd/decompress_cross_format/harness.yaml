checks:
- kind: differential
  strength: full
  stops_with: abort
  live: true
  where: source/decompress_cross_format.c:58-86
  what: 'One-shot: the same frame decoded as standard zstd1 (magic prepended) and as ZSTD_f_zstd1_magicless
    must agree on acceptance in both directions, and when both accept, on decompressed size and bytes.'
- kind: differential
  strength: full
  stops_with: abort
  live: true
  where: source/decompress_cross_format.c:88-119
  what: 'Streaming: the same comparison with one ZSTD_decompressStream call per format: both return 0
    or neither; if both, out.pos equal and output bytes equal.'
failure_handlers: none
