rocq: OssFuzzTheorems.zstd.simple_compress
origin: upstream
summary: 'Checks one property, an API contract: ZSTD_compressCCtx into a random-size buffer in [0, compressBound]:
  any failure must be exactly ZSTD_error_dstSize_tooSmall.'
