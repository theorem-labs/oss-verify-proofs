schema: oss-fuzz-theorems/harness/1
project: zstd
harness: huf_round_trip
rocq: OssFuzzTheorems.zstd.huf_round_trip
origin: upstream
summary: 'Checks 2 properties (listed below); the first, a round trip: Histogram, build and write a Huffman
  CTable, read it back as a DTable (X1, or X2 falling back to X1), HUF_compress1X/4X then decompress:
  if compression produced output, decompression must succeed, regenerate the size and match. RLE and incompressible
  inputs (cSize == 0, or table write failure) are skipped.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/huf_round_trip.c
  from:
    repository: https://github.com/facebook/zstd
    commit: 82d322c4973d9e2968d94047a40892bc6d9a9bdf
    path: tests/fuzz/huf_round_trip.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/facebook/zstd
  commit: 82d322c4973d9e2968d94047a40892bc6d9a9bdf
  licence: NOASSERTION
modifications:
- Linked against zstd at commit 82d322c4.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
