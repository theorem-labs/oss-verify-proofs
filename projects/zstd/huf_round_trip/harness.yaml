checks:
- kind: api-contract
  strength: partial
  stops_with: abort
  live: true
  where: source/huf_round_trip.c:71-109
  what: HIST_count, HUF_buildCTable_wksp and HUF_readDTable must succeed, HUF_optimalTableLog must return
    <= 12, maxSymbol <= 255.
- kind: roundtrip
  strength: full
  stops_with: abort
  live: true
  where: source/huf_round_trip.c:111-128
  what: 'Histogram, build and write a Huffman CTable, read it back as a DTable (X1, or X2 falling back
    to X1), HUF_compress1X/4X then decompress: if compression produced output, decompression must succeed,
    regenerate the size and match. RLE and incompressible inputs (cSize == 0, or table write failure)
    are skipped.'
failure_handlers: none
