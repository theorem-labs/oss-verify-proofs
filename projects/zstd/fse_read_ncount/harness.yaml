schema: oss-fuzz-theorems/harness/1
project: zstd
harness: fse_read_ncount
rocq: OssFuzzTheorems.zstd.fse_read_ncount
origin: upstream
summary: 'Checks 2 properties (listed below); the first, a round trip: Build a random valid FSE normalized
  count (sum = 1<<tableLog), FSE_writeNCount it, append random trailing bytes, FSE_readNCount: must succeed,
  consume exactly the written size, and return the same maxSymbolValue, tableLog and every count.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fse_read_ncount.c
  from:
    repository: https://github.com/facebook/zstd
    commit: 82d322c4973d9e2968d94047a40892bc6d9a9bdf
    path: tests/fuzz/fse_read_ncount.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/facebook/zstd
  commit: 82d322c4973d9e2968d94047a40892bc6d9a9bdf
  licence: NOASSERTION
modifications:
- Linked against zstd at commit 82d322c4.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
