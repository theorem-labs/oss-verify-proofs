checks:
- kind: api-contract
  strength: partial
  stops_with: abort
  live: true
  where: source/fse_read_ncount.c:62-66
  what: FSE_writeNCount must succeed within FSE_NCountWriteBound.
- kind: roundtrip
  strength: full
  stops_with: abort
  live: true
  where: source/fse_read_ncount.c:84-94
  what: 'Build a random valid FSE normalized count (sum = 1<<tableLog), FSE_writeNCount it, append random
    trailing bytes, FSE_readNCount: must succeed, consume exactly the written size, and return the same
    maxSymbolValue, tableLog and every count.'
failure_handlers: none
