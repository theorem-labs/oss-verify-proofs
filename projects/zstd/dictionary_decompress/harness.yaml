checks:
- kind: api-contract
  strength: weak
  stops_with: abort
  live: unknown
  where: source/dictionary_decompress.c:44-57
  what: Creating/loading/referencing the trained dictionary must succeed (FUZZ_ASSERT(ddict) / FUZZ_ZASSERT);
    near-trivially true because loading is lazy and any bytes are a valid raw-content dictionary.
distribution:
  file: Distribution.v
  argv0: dictionary_decompress
  input_file: input.bin
  prefix_hex: 00000000000028b52ffd
  payload:
    length: geometric
    p: 1/1025
    mean_bytes: 1024
    alphabet: bytes
  components:
    payload: 9/10
    wrong_argc: 1/50
    missing_file: 1/50
    full_support: 3/50
  mass: '1'
