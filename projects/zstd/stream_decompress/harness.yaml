schema: oss-fuzz-theorems/harness/1
project: zstd
harness: stream_decompress
rocq: OSSVerify.zstd.stream_decompress
origin: upstream
summary: Streaming decompression with fuzzer-sized input/output chunks (optionally stableOutBuffer); errors
  break out; nothing compared. The FUZZ_ASSERTs only check the harness's own buffer arithmetic.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/stream_decompress.c
  from:
    repository: https://github.com/facebook/zstd
    commit: 82d322c4973d9e2968d94047a40892bc6d9a9bdf
    path: tests/fuzz/stream_decompress.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/facebook/zstd
  commit: 82d322c4973d9e2968d94047a40892bc6d9a9bdf
  licence: NOASSERTION
modifications:
- Linked against zstd at commit 82d322c4.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
