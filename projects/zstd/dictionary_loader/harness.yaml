schema: oss-fuzz-theorems/harness/1
project: zstd
harness: dictionary_loader
rocq: OssFuzzTheorems.zstd.dictionary_loader
origin: upstream
summary: 'Checks 2 properties (listed below); the first, a round trip: The input is both the dictionary
  (random load method, content type auto/raw/full, loadDictionary vs refPrefix) and the data: if ZSTD_compress2
  succeeds, decompression with the same dictionary must succeed, regenerate the input size and match byte
  for byte.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/dictionary_loader.c
  from:
    repository: https://github.com/facebook/zstd
    commit: 82d322c4973d9e2968d94047a40892bc6d9a9bdf
    path: tests/fuzz/dictionary_loader.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/facebook/zstd
  commit: 82d322c4973d9e2968d94047a40892bc6d9a9bdf
  licence: NOASSERTION
modifications:
- Linked against zstd at commit 82d322c4.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
