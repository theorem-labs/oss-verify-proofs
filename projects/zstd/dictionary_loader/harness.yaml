checks:
- kind: roundtrip
  strength: full
  stops_with: abort
  live: true
  where: source/dictionary_loader.c:88-98
  what: 'The input is both the dictionary (random load method, content type auto/raw/full, loadDictionary
    vs refPrefix) and the data: if ZSTD_compress2 succeeds, decompression with the same dictionary must
    succeed, regenerate the input size and match byte for byte.'
- kind: api-contract
  strength: full
  stops_with: abort
  live: true
  where: source/dictionary_loader.c:90-93
  what: With ZSTD_dct_rawContent, compression must never fail ("Raw must always succeed!").
failure_handlers: none
distribution:
  file: Distribution.v
  argv0: dictionary_loader
  input_file: input.bin
  prefix_hex: '000000000000'
  payload:
