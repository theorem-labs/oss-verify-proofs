schema: oss-fuzz-theorems/harness/1
project: zstd
harness: block_decompress
rocq: OSSVerify.zstd.block_decompress
origin: upstream
summary: ZSTD_decompressBegin + ZSTD_decompressBlock of the raw input into a FUZZ_malloc_rand buffer;
  result ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/block_decompress.c
  from:
    repository: https://github.com/facebook/zstd
    commit: 82d322c4973d9e2968d94047a40892bc6d9a9bdf
    path: tests/fuzz/block_decompress.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/facebook/zstd
