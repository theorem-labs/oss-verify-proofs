schema: oss-fuzz-theorems/harness/1
project: zstd
harness: sequence_compression_api
rocq: OssFuzzTheorems.zstd.sequence_compression_api
origin: upstream
summary: 'Checks 2 properties (listed below); the first, a round trip: Random valid sequence list (offsets
  within the window, optional 1 GiB raw dictionary, explicit or no block delimiters) -> the harness''s
  own decodeSequences builds the source -> ZSTD_compressSequences with validateSequences=1 -> ZSTD_decompressDCtx:
  must succeed, regenerate the size and match byte for byte.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/sequence_compression_api.c
  from:
    repository: https://github.com/facebook/zstd
    commit: 82d322c4973d9e2968d94047a40892bc6d9a9bdf
    path: tests/fuzz/sequence_compression_api.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/facebook/zstd
  commit: 82d322c4973d9e2968d94047a40892bc6d9a9bdf
  licence: NOASSERTION
modifications:
- Linked against zstd at commit 82d322c4.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
