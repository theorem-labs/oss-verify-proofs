checks:
- kind: roundtrip
  strength: full
  stops_with: abort
  live: true
  where: source/sequence_compression_api.c:316-333
  what: 'Random valid sequence list (offsets within the window, optional 1 GiB raw dictionary, explicit
    or no block delimiters) -> the harness''s own decodeSequences builds the source -> ZSTD_compressSequences
    with validateSequences=1 -> ZSTD_decompressDCtx: must succeed, regenerate the size and match byte
    for byte.'
- kind: api-contract
  strength: partial
  stops_with: abort
  live: unknown
  where: source/sequence_compression_api.c:319-328
  what: ZSTD_compressSequences must accept every generated sequence list; only dstSize_tooSmall in explicit-block-delimiter
    mode is excused.
failure_handlers: none
