schema: oss-fuzz-theorems/harness/1
project: thrift-cpp
harness: FuzzRoundtripBinary
rocq: OSSVerify.thrift_cpp.FuzzRoundtripBinary
origin: upstream
summary: 'Checks one property, a round trip: Parse a FuzzTest struct with TBinaryProtocol, serialize it
  back with the same protocol, re-parse the bytes, and require the two structs to be equal (generated
  operator==, every field incl. containers, unions, recursive struct); the only tolerance is NaN in basic.double_field.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/FuzzRoundtripBinary.cpp
  from:
    repository: https://github.com/apache/thrift
    commit: 588053de15907d2b769aeb4662e1e3c142000fe9
    path: lib/cpp/test/fuzz/FuzzRoundtripBinary.cpp
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/apache/thrift
  commit: 588053de15907d2b769aeb4662e1e3c142000fe9
  licence: NOASSERTION
modifications:
- Linked against thrift at commit 588053de.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
