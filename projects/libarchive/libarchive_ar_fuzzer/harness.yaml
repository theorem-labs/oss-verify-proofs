schema: oss-fuzz-theorems/harness/1
project: libarchive
harness: libarchive_ar_fuzzer
rocq: OSSVerify.libarchive.libarchive_ar_fuzzer
origin: upstream
summary: Reads the input as an ar archive (+ all filters); per entry calls pathname, size, mtime, mode,
  uid, gid and drains archive_read_data. Every return value is discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
