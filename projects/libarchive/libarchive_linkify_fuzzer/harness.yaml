schema: oss-fuzz-theorems/harness/1
project: libarchive
harness: libarchive_linkify_fuzzer
rocq: OSSVerify.libarchive.libarchive_linkify_fuzzer
origin: upstream
summary: Builds up to 32 entries (fuzz pathname, ino, dev, nlink 1..5, file/dir, size, ids) and runs them
  through archive_entry_linkify with a fuzz-chosen tar/cpio strategy, then drains the resolver; only tracks
  ownership so every entry is freed exactly once. No hardlink-pairing result is checked.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/libarchive_linkify_fuzzer.cc
  from:
    repository: https://github.com/libarchive/libarchive
    commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
    path: contrib/oss-fuzz/libarchive_linkify_fuzzer.cc
  modified: false
  licence: BSD-2-Clause
library:
  repository: https://github.com/libarchive/libarchive
  commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
  licence: BSD-2-Clause
modifications:
- Linked against libarchive at commit 3670ecf7.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
