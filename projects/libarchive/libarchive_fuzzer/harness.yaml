schema: oss-fuzz-theorems/harness/1
project: libarchive
harness: libarchive_fuzzer
rocq: OSSVerify.libarchive.libarchive_fuzzer
origin: oss-fuzz
summary: Reads the input from memory (archive_read_open_memory) with all filters and formats plus raw
  and empty, the options zip:ignorecrc32, tar:read_concatenated_archives and tar:mac-ext, and the passphrase
  'secret'. Per entry it calls 17 metadata accessors and reads the data a page at a time. It stops at
  ARCHIVE_EOF or ARCHIVE_FATAL from archive_read_next_header or ARCHIVE_FATAL from archive_read_data.
  Then it calls has_encrypted_entries, format_capabilities, file_count and seek_data on the archive and
  frees it. Nothing is compared. Each call first ignores SIGPIPE, as bsdtar and bsdcpio do.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/libarchive_fuzzer.cc
  from:
    repository: https://github.com/google/oss-fuzz
    commit: 955c6866c152471d78c7472c0f1f354343548b9f
    path: projects/libarchive/libarchive_fuzzer.cc
  modified: true
  licence: Apache-2.0
library:
  repository: https://github.com/libarchive/libarchive
  commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
  licence: NOASSERTION
modifications:
- Linked against libarchive at commit 3670ecf7.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- 'The harness source is modified: source/libarchive_fuzzer.cc is OSS-Fuzz 955c6866''s projects/libarchive/libarchive_fuzzer.cc
  with one Theorem Labs change. It ignores SIGPIPE at the start of each call, as libarchive''s bsdtar
  and bsdcpio do, so a write to a filter program that stopped reading fails with EPIPE instead of killing
  the run.'
