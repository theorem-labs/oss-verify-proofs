schema: oss-fuzz-theorems/harness/1
project: libarchive
harness: libarchive_string_fuzzer
rocq: OSSVerify.libarchive.libarchive_string_fuzzer
origin: upstream
summary: First byte selects one of 10 string paths (set/get pathname, symlink, hardlink, uname, gname
  in MBS/WCS/UTF-8; copy_*; update_*_utf8; fflags text; ACL from_text in three types; mbstowcs + *_w setters)
  on the rest of the input, then archive_entry_clone. The comment says 'Clone and compare' but the clone
  is freed without any comparison; all conversions' results discarded.
entry: LLVMFuzzerTestOneInput
