schema: oss-fuzz-theorems/harness/1
project: libarchive
harness: libarchive_write_fuzzer
rocq: OSSVerify.libarchive.libarchive_write_fuzzer
origin: upstream
summary: Writes up to 10 fuzz entries (file/dir/symlink, ids, mtime, <= 1 KiB data) in one of 8 formats
  (pax_restricted, gnutar, ustar, cpio newc, zip, 7zip, xar, pax) through one of gzip/bzip2/xz/zstd/none
  into a vector it never reads. It returns early if archive_write_new returns NULL or archive_write_open
  does not return ARCHIVE_OK, stops adding entries if archive_entry_new returns NULL, writes a file's data
  only when archive_write_header returns ARCHIVE_OK and the data is non-empty, and drops every other
  libarchive result. write_callback returns -1 if appending to the vector throws std::bad_alloc.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/libarchive_write_fuzzer.cc
  from:
    repository: https://github.com/libarchive/libarchive
    commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
    path: contrib/oss-fuzz/libarchive_write_fuzzer.cc
  modified: true
  licence: BSD-2-Clause
library:
  repository: https://github.com/libarchive/libarchive
  commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
  licence: BSD-2-Clause
modifications:
- Linked against libarchive at commit 3670ecf7.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- 'The harness source is modified: source/libarchive_write_fuzzer.cc is libarchive 3670ecf7''s contrib/oss-fuzz/libarchive_write_fuzzer.cc
  with one Theorem Labs change. It catches std::bad_alloc from the harness''s own allocation inside write_callback,
  which then returns -1, so libarchive''s write fails and no exception passes through libarchive''s C
  code.'
