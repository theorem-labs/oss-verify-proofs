schema: oss-fuzz-theorems/harness/1
project: libarchive
harness: libarchive_write_fuzzer
rocq: OSSVerify.libarchive.libarchive_write_fuzzer
origin: upstream
summary: Writes up to 10 fuzz entries (file/dir/symlink, ids, mtime, <= 1 KiB data) in one of 8 formats
  (pax_restricted, gnutar, ustar, cpio newc, zip, 7zip, xar, pax) through one of gzip/bzip2/xz/zstd/none
  into an in-memory vector. The produced archive is never read back or inspected; header/data return codes
  ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/libarchive_write_fuzzer.cc
  from:
    repository: https://github.com/libarchive/libarchive
    commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
    path: contrib/oss-fuzz/libarchive_write_fuzzer.cc
  modified: false
  licence: BSD-2-Clause
library:
  repository: https://github.com/libarchive/libarchive
  commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
  licence: BSD-2-Clause
modifications:
- Linked against libarchive at commit 3670ecf7.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
