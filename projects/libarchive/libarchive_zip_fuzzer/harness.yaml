schema: oss-fuzz-theorems/harness/1
project: libarchive
harness: libarchive_zip_fuzzer
rocq: OSSVerify.libarchive.libarchive_zip_fuzzer
origin: upstream
summary: Reads the input as a ZIP archive (passphrases password/test/empty, zip:ignorecrc32, all filters);
  per entry calls pathname(_w), size, mtime, mode, encryption predicates, format/filter names and drains
  archive_read_data. Every return value is discarded; CRC checking is explicitly disabled by the ignorecrc32
  option.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/libarchive_zip_fuzzer.cc
  from:
    repository: https://github.com/libarchive/libarchive
    commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
    path: contrib/oss-fuzz/libarchive_zip_fuzzer.cc
  modified: false
  licence: BSD-2-Clause
library:
  repository: https://github.com/libarchive/libarchive
  commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
  licence: BSD-2-Clause
modifications:
- Linked against libarchive at commit 3670ecf7.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
