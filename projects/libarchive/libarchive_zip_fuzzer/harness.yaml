schema: oss-fuzz-theorems/harness/1
project: libarchive
harness: libarchive_zip_fuzzer
rocq: OSSVerify.libarchive.libarchive_zip_fuzzer
origin: upstream
summary: Reads the input as a ZIP archive (passphrases password/test/empty, zip:ignorecrc32, all filters).
  It returns early if archive_read_new returns NULL or archive_read_open does not return ARCHIVE_OK. While
  archive_read_next_header returns ARCHIVE_OK, it calls pathname(_w), size, mtime, mode, encryption predicates
  and format/filter names, then reads the data while archive_read_data returns more than 0. It drops every
  other result and the data read. If allocating its data buffer throws std::bad_alloc, it frees the archive
  and returns 0. Each call first ignores SIGPIPE, as bsdtar and bsdcpio do.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/libarchive_zip_fuzzer.cc
  from:
    repository: https://github.com/libarchive/libarchive
    commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
    path: contrib/oss-fuzz/libarchive_zip_fuzzer.cc
  modified: true
  licence: BSD-2-Clause
library:
  repository: https://github.com/libarchive/libarchive
  commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
  licence: BSD-2-Clause
modifications:
- Linked against libarchive at commit 3670ecf7.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- 'The harness source is modified: source/libarchive_zip_fuzzer.cc is libarchive 3670ecf7''s contrib/oss-fuzz/libarchive_zip_fuzzer.cc
  with two Theorem Labs changes. On std::bad_alloc it frees any open archive and returns 0; the original
  aborts. It ignores SIGPIPE, as bsdtar and bsdcpio do, so a write to a filter program that stopped reading
  fails with EPIPE instead of killing the run.'
