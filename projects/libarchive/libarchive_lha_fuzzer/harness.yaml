schema: oss-fuzz-theorems/harness/1
project: libarchive
harness: libarchive_lha_fuzzer
rocq: OSSVerify.libarchive.libarchive_lha_fuzzer
origin: upstream
summary: Reads the input as an LHA archive (+ all filters); per entry calls pathname(_w), size, mtime,
  mode, uid, gid and drains archive_read_data. Every return value is discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/libarchive_lha_fuzzer.cc
