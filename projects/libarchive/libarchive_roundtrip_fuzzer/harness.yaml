schema: oss-fuzz-theorems/harness/1
project: libarchive
harness: libarchive_roundtrip_fuzzer
rocq: OSSVerify.libarchive.libarchive_roundtrip_fuzzer
origin: upstream
summary: 'Despite the name and its header comment (''tests write/read consistency''), NO round-trip property
  is checked: writes <= 5 regular-file entries (fuzz pathname <= 32 chars, uid/gid, <= 256 data bytes)
  as pax_restricted/ustar/cpio newc/zip/gnutar into a memory buffer, then reads the buffer back with all
  formats and drains the data, never comparing the read-back pathname, size, ids or bytes with what was
  written.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/libarchive_roundtrip_fuzzer.cc
  from:
    repository: https://github.com/libarchive/libarchive
    commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
    path: contrib/oss-fuzz/libarchive_roundtrip_fuzzer.cc
  modified: false
  licence: BSD-2-Clause
library:
  repository: https://github.com/libarchive/libarchive
  commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
  licence: BSD-2-Clause
modifications:
- Linked against libarchive at commit 3670ecf7.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
