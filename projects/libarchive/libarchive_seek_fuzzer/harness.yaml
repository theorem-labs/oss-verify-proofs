schema: oss-fuzz-theorems/harness/1
project: libarchive
harness: libarchive_seek_fuzzer
rocq: OSSVerify.libarchive.libarchive_seek_fuzzer
origin: upstream
summary: Reads zip_seekable/7zip/rar/rar5/iso9660 (+ all filters) through read/seek/skip callbacks over
  the input (4 KiB chunks, clamped seeks); per entry (<= 50) calls pathname and size and drains archive_read_data,
  which may seek. Nothing compared.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/libarchive_seek_fuzzer.cc
  from:
    repository: https://github.com/libarchive/libarchive
    commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
    path: contrib/oss-fuzz/libarchive_seek_fuzzer.cc
  modified: false
  licence: BSD-2-Clause
library:
  repository: https://github.com/libarchive/libarchive
  commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
  licence: BSD-2-Clause
modifications:
- Linked against libarchive at commit 3670ecf7.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
