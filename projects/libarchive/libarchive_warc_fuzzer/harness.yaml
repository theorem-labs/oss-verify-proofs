project: libarchive
harness: libarchive_warc_fuzzer
rocq: OSSVerify.libarchive.libarchive_warc_fuzzer
origin: upstream
summary: Reads the input as a WARC archive (+ all filters); per entry calls pathname, size, mtime and
  drains archive_read_data. Every return value is discarded.
entry: LLVMFuzzerTestOneInput
