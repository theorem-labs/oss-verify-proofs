schema: oss-fuzz-theorems/harness/1
project: libarchive
harness: libarchive_entry_fuzzer
rocq: OSSVerify.libarchive.libarchive_entry_fuzzer
origin: upstream
summary: Builds an archive_entry from fuzz fields (pathname, size, mode, ids, 4 timestamps, uname/gname,
  symlink/hardlink) plus fuzz ACL entries, then archive_entry_acl_to_text (ACCESS) and parses that text
  back with archive_entry_acl_from_text into the same entry -- a text round trip whose result is never
  compared with the original ACL; also DEFAULT/NFS4/wide to_text, pathname variants, clone, clear. All
  results discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/libarchive_entry_fuzzer.cc
  from:
    repository: https://github.com/libarchive/libarchive
    commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
    path: contrib/oss-fuzz/libarchive_entry_fuzzer.cc
  modified: false
  licence: BSD-2-Clause
library:
  repository: https://github.com/libarchive/libarchive
  commit: 3670ecf7c59a6b12fe93e6255bbe4a1f3420edf8
  licence: BSD-2-Clause
modifications:
- Linked against libarchive at commit 3670ecf7.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
