schema: oss-fuzz-theorems/harness/1
project: phosphor-host-ipmid
harness: fuzz_sensor_utils
rocq: OSSVerify.phosphor_host_ipmid.fuzz_sensor_utils
origin: oss-fuzz
summary: getSensorAttributes(max,min,...) on three fuzzed doubles; if it succeeds with mValue!=0, scaleIPMIValueFromDouble;
  then getScaledIPMIValue. Results discarded; std::out_of_range / std::runtime_error are caught (any other
  exception type would terminate).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_sensor_utils.cpp
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/phosphor-host-ipmid/fuzz_sensor_utils.cpp
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/openbmc/phosphor-host-ipmid
  commit: 3bcd5f2cc4d81f804798f04ab400a177c949e5ce
  licence: Apache-2.0
modifications:
- Linked against phosphor-host-ipmid at commit 3bcd5f2c with 3 patches to the library (listed on the project
  page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
