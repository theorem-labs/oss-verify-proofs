schema: oss-fuzz-theorems/harness/1
project: phosphor-host-ipmid
harness: fuzz_fru_area
rocq: OSSVerify.phosphor_host_ipmid.fuzz_fru_area
origin: oss-fuzz
summary: Builds a FruInventoryData (Chassis/Board/Product sections selected by the first byte, values
  from length-prefixed fuzz strings) and calls ipmi::fru::buildFruAreaData; the returned FRU bytes are
  discarded (no re-parse, no checksum check).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_fru_area.cpp
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/phosphor-host-ipmid/fuzz_fru_area.cpp
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/openbmc/phosphor-host-ipmid
  commit: 3bcd5f2cc4d81f804798f04ab400a177c949e5ce
  licence: Apache-2.0
modifications:
- Linked against phosphor-host-ipmid at commit 3bcd5f2c with 3 patches to the library (listed on the project
  page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
