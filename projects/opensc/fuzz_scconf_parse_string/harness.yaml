schema: oss-fuzz-theorems/harness/1
project: opensc
harness: fuzz_scconf_parse_string
rocq: OSSVerify.opensc.fuzz_scconf_parse_string
origin: upstream
summary: scconf_parse_string on a NUL-terminated copy of inputs up to 16,000 bytes; parse result and tree
  ignored, then scconf_free.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_scconf_parse_string.c
  from:
    repository: https://github.com/OpenSC/OpenSC
    commit: a6f4fdc0d4061a77f34826e939c44e286e592536
    path: src/tests/fuzzing/fuzz_scconf_parse_string.c
  modified: false
  licence: LGPL-2.1-or-later
library:
  repository: https://github.com/OpenSC/OpenSC
  commit: a6f4fdc0d4061a77f34826e939c44e286e592536
  licence: LGPL-2.1-or-later
modifications:
- Linked against OpenSC at commit a6f4fdc0.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
