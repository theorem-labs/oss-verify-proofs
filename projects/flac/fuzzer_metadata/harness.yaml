schema: oss-fuzz-theorems/harness/1
project: flac
harness: fuzzer_metadata
rocq: OSSVerify.flac.fuzzer_metadata
origin: upstream
summary: Writes the input to a temp .flac, runs level-0 getters, a level-1 SimpleIterator command sequence
  and a level-2 Chain/Iterator command sequence (get/insert/set/delete/resize blocks, sort/merge padding,
  write); results discarded. FLAC__metadata_object_is_equal(x, x) is computed and ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/metadata.cc
  from:
    repository: https://github.com/xiph/flac
    commit: e94ff9f68b8e7dbd3e9f8b1ac18a8eca1914f181
    path: oss-fuzz/metadata.cc
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/xiph/flac
  commit: e94ff9f68b8e7dbd3e9f8b1ac18a8eca1914f181
  licence: NOASSERTION
modifications:
- Linked against flac at commit e94ff9f6 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
