schema: oss-fuzz-theorems/harness/1
project: flac
harness: fuzzer_encoder
rocq: OSSVerify.flac.fuzzer_encoder
origin: upstream
summary: Fuzzed settings (incl. set_verify) then process_interleaved of fuzzed int32 samples; process/finish
  results are discarded, so a verify mismatch (FLAC__STREAM_ENCODER_VERIFY_MISMATCH_IN_AUDIO_DATA) is
  NOT reported by this harness.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/encoder.cc
  from:
    repository: https://github.com/xiph/flac
    commit: e94ff9f68b8e7dbd3e9f8b1ac18a8eca1914f181
    path: oss-fuzz/encoder.cc
  modified: false
  licence: MIT
library:
  repository: https://github.com/xiph/flac
  commit: e94ff9f68b8e7dbd3e9f8b1ac18a8eca1914f181
  licence: NOASSERTION
modifications:
- Linked against flac at commit e94ff9f6 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
