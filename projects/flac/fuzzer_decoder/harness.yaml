schema: oss-fuzz-theorems/harness/1
project: flac
harness: fuzzer_decoder
rocq: OSSVerify.flac.fuzzer_decoder
origin: upstream
summary: Datasource-driven FLAC++ stream decoder (ogg or native) with fuzzed metadata respond/ignore,
  md5 checking, and a random sequence of process/seek/flush/reset calls; all bool results only fed to
  memory_test (a no-op for bool). The decoder's MD5 check outcome is ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/decoder.cc
  from:
    repository: https://github.com/xiph/flac
    commit: e94ff9f68b8e7dbd3e9f8b1ac18a8eca1914f181
    path: oss-fuzz/decoder.cc
  modified: false
  licence: MIT
library:
  repository: https://github.com/xiph/flac
  commit: e94ff9f68b8e7dbd3e9f8b1ac18a8eca1914f181
  licence: NOASSERTION
modifications:
- Linked against flac at commit e94ff9f6 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
