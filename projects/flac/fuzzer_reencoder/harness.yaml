schema: oss-fuzz-theorems/harness/1
project: flac
harness: fuzzer_reencoder
rocq: OSSVerify.flac.fuzzer_reencoder
origin: upstream
summary: Decodes the fuzz stream and re-encodes each decoded frame (copying all metadata blocks); the
  re-encoded stream is never decoded or compared with the first decode, and verify-mode results are discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/reencoder.cc
  from:
    repository: https://github.com/xiph/flac
    commit: e94ff9f68b8e7dbd3e9f8b1ac18a8eca1914f181
    path: oss-fuzz/reencoder.cc
  modified: false
  licence: MIT
library:
  repository: https://github.com/xiph/flac
  commit: e94ff9f68b8e7dbd3e9f8b1ac18a8eca1914f181
  licence: NOASSERTION
modifications:
- Linked against flac at commit e94ff9f6 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
