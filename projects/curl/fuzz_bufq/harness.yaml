licence: NOASSERTION
checks:
- kind: reference-oracle
  strength: partial
  stops_with: assert
  live: true
  where: source/fuzz_bufq.cc:100
  what: Each piece Curl_bufq_pass hands its writer callback, up to the bytes the pass still asks for, follows the
    0..255 pattern from the next byte to read (upstream line 94). The pattern repeats every 256 bytes.
- kind: invariant
  strength: full
  stops_with: assert
  live: true
  where: source/fuzz_bufq.cc:175
  what: Before each operation, Curl_bufq_is_empty is true exactly when the harness's count of queued bytes is 0
    (upstream line 169).
- kind: invariant
  strength: full
  stops_with: assert
  live: true
  where: source/fuzz_bufq.cc:176
  what: Before each operation, Curl_bufq_len equals the harness's count of queued bytes (upstream line 170).
- kind: reference-oracle
  strength: partial
  stops_with: assert
  live: true
  where: source/fuzz_bufq.cc:194
  what: The bytes Curl_bufq_peek returns follow the pattern from the next byte to read (upstream line 188). The
    pattern repeats every 256 bytes.
- kind: reference-oracle
  strength: partial
  stops_with: assert
  live: true
  where: source/fuzz_bufq.cc:209
  what: The bytes Curl_bufq_peek_at returns at an offset follow the pattern from that offset (upstream line 203).
    The pattern repeats every 256 bytes.
- kind: invariant
  strength: weak
  stops_with: assert
  live: false
  where: source/fuzz_bufq.cc:225
  what: 'Always true: buffer_bytes >= 0 after a read, where buffer_bytes is a size_t (upstream line 219). The
    compiler removes it: its text is in none of the four binaries. No change to curl can make it fail.'
- kind: reference-oracle
  strength: partial
  stops_with: assert
  live: true
  where: source/fuzz_bufq.cc:228
  what: The bytes Curl_bufq_read copies out follow the pattern from the next byte to read (upstream line 222). The
    pattern repeats every 256 bytes.
- kind: invariant
  strength: full
  stops_with: assert
  live: true
  where: source/fuzz_bufq.cc:250
  what: After Curl_bufq_slurp, the harness's count of queued bytes is at most chunk_size * max_chunks (upstream line
    244).
- kind: invariant
  strength: full
  stops_with: assert
  live: true
  where: source/fuzz_bufq.cc:264
  what: After a successful Curl_bufq_sipn, the count is at most chunk_size * max_chunks (upstream line 258).
- kind: invariant
  strength: weak
  stops_with: assert
  live: false
  where: source/fuzz_bufq.cc:286
  what: 'Always true: buffer_bytes >= 0 after a pass, where buffer_bytes is a size_t (upstream line 280). The
    compiler removes it: its text is in none of the four binaries. No change to curl can make it fail.'
- kind: invariant
  strength: full
  stops_with: assert
  live: true
  where: source/fuzz_bufq.cc:311
  what: After a successful Curl_bufq_write, the count is at most chunk_size * max_chunks (upstream line 305).
- kind: invariant
  strength: weak
  stops_with: assert
  live: unknown
  where: source/fuzz_bufq.cc:320
  what: 'Never reached: assert(false) in the switch default (upstream line 314), but op_type is in 0..8 and each
    value has a case. The plain and ASan builds drop it; the UBSan and ASan+UBSan builds keep it, so it is neither
    live nor compiled out in all four. No change to curl can make it fail.'
