schema: oss-fuzz-theorems/harness/1
project: curl
harness: fuzz_bufq
rocq: OSSVerify.curl.fuzz_bufq
origin: upstream
summary: 'Runs a fuzzer-chosen sequence of operations on one curl byte queue (bufq) and checks it with 12 asserts
  (listed below): the bytes read, peeked and passed follow the 0..255 pattern written, the queue''s length and
  emptiness match the harness''s byte count before each operation, and the count stays within the capacity
  after each write, slurp and sipn.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_bufq.cc
  - source/fuzz_bufq.h
  from:
    repository: https://github.com/curl/curl-fuzzer
    commit: 4768d8de6f3209bb5dd761cd24ff7ccbfbb6b5b8
    path: fuzz_bufq.cc
  modified: true
  licence: curl
library:
  repository: https://github.com/curl/curl
  commit: f190aa8ecea728e6ce7fb7a6250e03df4d4eaca5
  licence: NOASSERTION
modifications:
- Linked against curl at commit f190aa8e.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source is modified for these builds. source/fuzz_bufq.cc is curl-fuzzer 4768d8de's fuzz_bufq.cc with
  projects/curl/fuzz_bufq/proofs/provenance/recipe/targets/curl-fuzz_bufq/fuzz_bufq-no-syscalls.patch applied;
  source/fuzz_bufq.h is unmodified.
- The patch makes the harness's template buffer a constant table in read-only data, built at compile time, in place
  of the mmap(MAP_SHARED) and mprotect(PROT_READ) buffer its first call made, and removes its signal(SIGPIPE, SIG_IGN).
