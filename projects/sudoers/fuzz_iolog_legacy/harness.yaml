schema: oss-fuzz-theorems/harness/1
project: sudoers
harness: fuzz_iolog_legacy
rocq: OSSVerify.sudoers.fuzz_iolog_legacy
origin: upstream
summary: fmemopen()s the input and calls iolog_parse_loginfo_legacy() into a calloc'd eventlog, then eventlog_free();
  result ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_iolog_legacy.c
  from:
    repository: https://github.com/sudo-project/sudo
    commit: 2e18923c2e959fff57b60207a261080daa2ebee9
    path: lib/iolog/regress/fuzz/fuzz_iolog_legacy.c
  modified: false
  licence: Zlib
library:
  repository: https://github.com/sudo-project/sudo
  commit: 2e18923c2e959fff57b60207a261080daa2ebee9
  licence: Zlib
modifications:
- Linked against sudo at commit 2e18923c.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
