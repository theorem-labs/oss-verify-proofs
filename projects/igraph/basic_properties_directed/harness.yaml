schema: oss-fuzz-theorems/harness/1
project: igraph
harness: basic_properties_directed
rocq: OSSVerify.igraph.basic_properties_directed
origin: upstream
summary: 'Checks 4 properties (listed below); the first, a differential check: is_simple must equal !(has_multiple
  || has_loop): two independent predicate APIs must agree.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/basic_properties_directed.cpp
  from:
    repository: https://github.com/igraph/igraph
    commit: e8e03b245424a13352ea304e4173385373ecdc9d
    path: fuzzing/basic_properties_directed.cpp
  modified: false
  licence: GPL-2.0-or-later
library:
  repository: https://github.com/igraph/igraph
  commit: e8e03b245424a13352ea304e4173385373ecdc9d
  licence: GPL-2.0-or-later
modifications:
- Linked against igraph at commit e8e03b24 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
