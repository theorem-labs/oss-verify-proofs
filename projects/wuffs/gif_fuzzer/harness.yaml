schema: oss-fuzz-theorems/harness/1
project: wuffs
harness: gif_fuzzer
rocq: OSSVerify.wuffs.gif_fuzzer
origin: upstream
summary: 'Checks 2 properties (listed below); the first, an invariant: fuzz_image_decoder: after every
  decode_frame the decoder''s dirty_rect must lie inside the frame_config bounds, and after a successful
  frame it must equal them exactly; otherwise an "internal error:" status is returned and fuzzlib segfaults.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/gif_fuzzer.c
  from:
    repository: https://github.com/google/wuffs
    commit: c4df79d82ea6de3a3380fae7ba5bc9c9abf2324a
    path: fuzz/c/std/gif_fuzzer.c
  modified: false
  licence: Apache-2.0 OR MIT
library:
  repository: https://github.com/google/wuffs
  commit: c4df79d82ea6de3a3380fae7ba5bc9c9abf2324a
  licence: NOASSERTION
modifications:
- Linked against wuffs at commit c4df79d8.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
