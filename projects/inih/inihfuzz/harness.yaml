project: inih
harness: inihfuzz
rocq: OSSVerify.inih.inihfuzz
origin: oss-fuzz
summary: ini_parse_string on an 8..512-byte NUL-terminated copy; the handler only records the section
  name; return code ignored.
entry: LLVMFuzzerTestOneInput
source:
