rocq: OSSVerify.yara.tlsh_fuzzer
origin: upstream
summary: 'TLSH: tlsh_update on the first half, tlsh_final on the second, tlsh_get_hash(true/false), reset,
  free; all results ignored.'
entry: LLVMFuzzerTestOneInput
