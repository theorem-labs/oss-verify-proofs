schema: oss-fuzz-theorems/harness/1
project: brunsli
harness: fuzz_decode_streaming
rocq: OSSVerify.brunsli.fuzz_decode_streaming
origin: upstream
summary: Feeds the input to internal::dec::ProcessJpeg one byte longer at a time. It expects NOT_ENOUGH_DATA
  before the end and OK at the end, but on any other status it silently returns 0. Then WriteJpeg to a
  discarding sink.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_decode_streaming.cc
  from:
    repository: https://github.com/google/brunsli
    commit: 40249cd3963616f21e4102bf03110d20ff0ecf70
    path: c/tests/fuzz_decode_streaming.cc
  modified: false
  licence: MIT
library:
  repository: https://github.com/google/brunsli
  commit: 40249cd3963616f21e4102bf03110d20ff0ecf70
  licence: MIT
modifications:
- Linked against brunsli at commit 40249cd3 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
