schema: oss-fuzz-theorems/harness/1
project: xz
harness: fuzz_encode_stream
rocq: OSSVerify.xz.fuzz_encode_stream
origin: upstream
summary: 'Checks 3 properties (listed below); the first, an API contract: lzma_code() driven to completion
  on the .xz stream ENCODER (LZMA2, CRC64, preset chosen by input[0]) never returns LZMA_PROG_ERROR (liblzma''s
  "API misuse / internal inconsistency" code) for any input; every other return code, including data and
  memory-limit errors, is accepted.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_encode_stream.c
  from:
    repository: https://github.com/tukaani-project/xz
    commit: 3d078b52adbff566ccfc51067dfbf742ecf3ef86
    path: tests/ossfuzz/fuzz_encode_stream.c
  modified: false
  licence: 0BSD
library:
  repository: https://github.com/tukaani-project/xz
  commit: 3d078b52adbff566ccfc51067dfbf742ecf3ef86
  version: 5.8.2
  licence: NOASSERTION
modifications:
- Linked against xz 5.8.2 at commit 3d078b52.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
