  strength: weak
  stops_with: abort
  live: unknown
  where: source/fuzz_encode_stream.c:55-58
  what: 'lzma_lzma_preset() succeeds for the five fixed presets the first byte selects (0, 1, 5, 0|EXTREME,
    3|EXTREME): trivially true for constant valid presets'
