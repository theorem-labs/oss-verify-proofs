schema: oss-fuzz-theorems/harness/1
project: msgpack-c
harness: unpack_pack_fuzzer
rocq: OSSVerify.msgpack_c.unpack_pack_fuzzer
origin: upstream
summary: msgpack::unpack with all six unpack_limit fields set to 1000, then msgpack::pack of the unpacked
  object into an sbuffer. The packed bytes are NEVER compared to the input (nor re-unpacked), so this
  is an unchecked unpack->pack round trip; every exception is swallowed by catch (...).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/unpack_pack_fuzzer.cpp
  from:
    repository: https://github.com/msgpack/msgpack-c
    commit: a5250ecbcae1d34346c7445345774b0abbd651bc
    path: fuzz/unpack_pack_fuzzer.cpp
  modified: false
  licence: BSL-1.0
library:
  repository: https://github.com/msgpack/msgpack-c
  commit: a5250ecbcae1d34346c7445345774b0abbd651bc
  version: 8.0.0
  licence: BSL-1.0
modifications:
- Linked against msgpack-c 8.0.0 at commit a5250ecb.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
