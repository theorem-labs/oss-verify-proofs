schema: oss-fuzz-theorems/harness/1
project: quantlib
harness: DateParserFuzzer
rocq: OSSVerify.quantlib.DateParserFuzzer
origin: upstream
summary: DateParser::parseFormatted(s, "%Y-%m-%d") and DateParser::parseISO(s2) on two fuzzed strings
  (<=100 chars); results cast to void, std::exception caught. No format->parse round trip.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/dateparserfuzzer.cpp
  from:
    repository: https://github.com/lballabio/QuantLib
    commit: 2a13d455048c748b9fb5c2ff3bb4f4cf56dfb9a9
    path: fuzz-test-suite/dateparserfuzzer.cpp
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/lballabio/QuantLib
  commit: 2a13d455048c748b9fb5c2ff3bb4f4cf56dfb9a9
  licence: BSD-3-Clause
modifications:
- Linked against QuantLib at commit 2a13d455.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
