schema: oss-fuzz-theorems/harness/1
project: jsoncons
harness: fuzz_bigint
rocq: OSSVerify.jsoncons.fuzz_bigint
origin: upstream
summary: bigint(input) then a % b and b % a against a fixed 38-digit constant, for inputs < 5000 bytes;
  results discarded; std::runtime_error swallowed.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_bigint.cpp
  from:
    repository: https://github.com/danielaparker/jsoncons
    commit: af497a1c1ea9043f4ad8d799617b7d00d6676153
    path: fuzzers/fuzz_bigint.cpp
  modified: false
  licence: BSL-1.0
library:
  repository: https://github.com/danielaparker/jsoncons
  commit: af497a1c1ea9043f4ad8d799617b7d00d6676153
  licence: BSL-1.0
modifications:
- Linked against jsoncons at commit af497a1c.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
