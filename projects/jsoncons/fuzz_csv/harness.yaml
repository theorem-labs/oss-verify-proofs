project: jsoncons
harness: fuzz_csv
rocq: OSSVerify.jsoncons.fuzz_csv
origin: upstream
summary: csv_string_reader (assume_header, n_rows mapping) into json_decoder<ojson>; result discarded;
  ser_error and two json_runtime_error variants swallowed.
entry: LLVMFuzzerTestOneInput
source:
