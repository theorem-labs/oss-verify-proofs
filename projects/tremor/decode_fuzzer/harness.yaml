schema: oss-fuzz-theorems/harness/1
project: tremor
harness: decode_fuzzer
rocq: OSSVerify.tremor.decode_fuzzer
origin: oss-fuzz
summary: ov_open_callbacks on the first 16384 input bytes, then ov_read into a 4096-byte buffer until
  it returns <= 0 (other than OV_HOLE); the decoded PCM is never inspected.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/decode_fuzzer.cc
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/tremor/decode_fuzzer.cc
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://gitlab.xiph.org/xiph/tremor
  commit: 820fb3237ea81af44c9cc468c8b4e20128e3e5ad
  licence: BSD-3-Clause
modifications:
- Linked against tremor at commit 820fb323 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
