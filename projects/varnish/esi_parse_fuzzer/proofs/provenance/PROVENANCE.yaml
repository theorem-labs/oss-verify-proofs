      calls), with lib/libvgz/crc32.h, zutil.h, zconf.h and vgz.h
    licence: Zlib
    evidence: 'crc32.c:1-3 (Copyright (C) 1995-2022 Mark Adler; "For conditions of distribution and use, see copyright
