  components:
  - component: Vinyl Cache
    files: bin/vinyld/cache/cache_esi_parse.c, bin/vinyld/cache/cache_ws_common.c, bin/vinyld/cache/cache_ws_emu.c,
      lib/libvinyl/vas.c, lib/libvinyl/vbt.c, lib/libvinyl/vct.c (the archive members of the link record, less lib/libvinyl/vsb.c
      and lib/libvgz/crc32.c, which have rows of their own); harness bin/vinyld/fuzzers/esi_parse_fuzzer.c
    licence: BSD-2-Clause
    evidence: 'LICENSE:1-30 of the repository at the pinned commit (Verdens Gang AS, Varnish Software AS, The Vinyl
      Cache Project; "SPDX-License-Identifier: BSD-2-Clause" at line 9); the linked files and the harness carry
      the BSD 2-clause notice of Varnish Software AS or Verdens Gang AS: bin/vinyld/cache/cache_esi_parse.c:2-7,
      cache_ws_common.c:2-9, cache_ws_emu.c:2-7, lib/libvinyl/vas.c:2-8, vct.c:2-7, vbt.c:2-29 (the BSD 2-clause
      text without an SPDX line) and the harness bin/vinyld/fuzzers/esi_parse_fuzzer.c:2-7; the three bin/vinyld/cache
      objects are program objects of esi_parse_fuzzer (bin/vinyld/Makefile.am:224-234), which the pin adds to the
      archive (targets/varnish-esi_parse_fuzzer/pin:85-92); include/vend.h:1-29 (Poul-Henning Kamp, BSD-2-Clause,
      from FreeBSD''s sys/endian.h) supplies the inline vbe16enc, vbe64enc, vbe64dec and vbe32enc that cache_esi_parse.c:265-291
      calls (LICENSES/varnish-vend-notice.txt; in the binaries: that code''s assertion text "(ssize_t)vbe64dec(buf
      + 1) == l" of cache_esi_parse.c:271 occurs in all four); the other project headers in the include closure
      carry BSD-2-Clause notices, some with further holders (include/vdef.h:3 Fastly Inc, include/tbl/beresp_esi_flags.h:2
      and include/tbl/well_known_methods.h:2 UPLEX - Nils Goroll Systemoptimierung, include/vtree.h:7 Niels Provos,
      whose tree code none of these files generates); the third-party code of lib/libvinyl/vsb.c, include/vqueue.h,
      include/miniobj.h and lib/libvgz/crc32.c is in the rows below; the VTest2 tree (bin/vinyltest/vtest2) contributes
      no object to this link (link record); no patch of patches/series.tsv applies to this target'
    texts:
    - LICENSES/varnish-LICENSE
    - LICENSES/varnish-vend-notice.txt
  - component: VSB string buffers from FreeBSD (Poul-Henning Kamp, Dag-Erling Smørgrav), in vinyl-cache lib/libvinyl/vsb.c
    files: lib/libvinyl/vsb.c (archive member libvinyl_la-vsb.o), include/vsb.h
    licence: BSD-2-Clause-pos-unchanged
    evidence: 'vsb.c:1-30: Copyright (c) 2000-2008 Poul-Henning Kamp and Dag-Erling Coïdan Smørgrav, a two-clause
      BSD licence whose first clause keeps the notice "in this position and unchanged" (lines 11-13), FreeBSD id
      at line 29; include/vsb.h:1-31 the same (LICENSES/varnish-vsb-notice.txt); the file''s tag "SPDX-License-Identifier:
      BSD-2-Clause-FreeBSD" (vsb.c:6) is an identifier the SPDX License List deprecated in version 3.10, whose text
      adds the FreeBSD Project''s "views and conclusions" sentence that vsb.c lacks; BSD-2-Clause-pos-unchanged
      (SPDX License List 3.29.0, spdx/license-list-data json/details/BSD-2-Clause-pos-unchanged.json) is the two-clause
      text with this first clause (its disclaimer names "THE AUTHOR" where vsb.c says "THE AUTHOR AND CONTRIBUTORS");
      in the binaries: vsb.c''s _assert_VSB_integrity (line 82) with its check "s->magic == 0x4a82dd8a" (line 89;
      VSB_MAGIC, include/vsb.h:41) occurs in all four, in none of the 12 binaries of json-c, cjson and pupnp'
    texts:
    - LICENSES/varnish-vsb-notice.txt
  - component: queue macros from 4.4BSD (The Regents of the University of California), in vinyl-cache include/vqueue.h
    files: include/vqueue.h (header; its VTAILQ macros expand in bin/vinyld/cache/cache_ws_emu.c, lines 50-568)
    licence: BSD-3-Clause
    evidence: 'vqueue.h:1-33: "SPDX-License-Identifier: BSD-3-Clause", Copyright (c) 1991, 1993 The Regents of the
      University of California, queue.h 8.5 (Berkeley) by way of FreeBSD (lines 31-32) (LICENSES/varnish-vqueue-notice.txt);
      cache_ws_emu.c uses VTAILQ_ENTRY, VTAILQ_HEAD, VTAILQ_FOREACH, VTAILQ_NEXT, VTAILQ_INIT, VTAILQ_REMOVE, VTAILQ_LAST
      and VTAILQ_INSERT_TAIL (lines 50-568); in the binaries: the assertion text "(((wa)->list.vtqe_next)) == 0",
