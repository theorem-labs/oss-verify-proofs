schema: oss-fuzz-theorems/harness/1
project: varnish
harness: esi_parse_fuzzer
rocq: OSSVerify.varnish.esi_parse_fuzzer
origin: upstream
summary: sets four ESI parser flags from the first input bytes, then VEP_Init/VEP_Parse/VEP_Finish over
  the whole input with a 1 KiB workspace; the produced ESI vsb is destroyed unread.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/esi_parse_fuzzer.c
  from:
    repository: https://code.vinyl-cache.org/vinyl-cache/vinyl-cache
    commit: bc9eaf713fe9bd86fa39eee1774650e9d2386f84
    path: bin/vinyld/fuzzers/esi_parse_fuzzer.c
  modified: false
  licence: BSD-2-Clause
library:
  repository: https://code.vinyl-cache.org/vinyl-cache/vinyl-cache
  commit: bc9eaf713fe9bd86fa39eee1774650e9d2386f84
  licence: BSD-2-Clause
modifications:
- Linked against vinyl-cache at commit bc9eaf71.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
