schema: oss-fuzz-theorems/harness/1
project: unit
harness: fuzz_basic
rocq: OSSVerify.unit.fuzz_basic
origin: upstream
summary: 'For 4..128-byte inputs, calls 12 helpers in sequence: base64 validate+decode, djb/murmur hashes,
  int/size/off_t/number parsers, SHA-1 (once and twice-updated), term/time parsers, URI decode/decode_plus/encode,
  UTF-8 decode + casecmp against a fixed string, websocket base64 encode and frame header readers; every
  result is discarded.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/nxt_basic_fuzz.c
  from:
    repository: https://github.com/nginx/unit
    commit: 76b39e928bd29f09278b60c3878b9f3d032b45b6
    path: fuzzing/nxt_basic_fuzz.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/nginx/unit
  commit: 76b39e928bd29f09278b60c3878b9f3d032b45b6
  licence: NOASSERTION
modifications:
- Linked against unit at commit 76b39e92 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
