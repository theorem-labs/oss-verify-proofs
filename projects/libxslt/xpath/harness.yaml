schema: oss-fuzz-theorems/harness/1
project: libxslt
harness: xpath
rocq: OSSVerify.libxslt.xpath
origin: upstream
summary: Parses an XML document (recover mode), sets up an XSLT transform context with EXSLT namespaces
  and variables, compiles the fuzzed XPath expression and evaluates it with xmlXPathCompiledEval under
  allocation limits; the result object is freed unexamined.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/xpath.c
  from:
    repository: https://gitlab.gnome.org/GNOME/libxslt
    commit: ec95343e75c503523b91495f021d109173e169c4
    path: tests/fuzz/xpath.c
  modified: false
  licence: MIT
library:
  repository: https://gitlab.gnome.org/GNOME/libxslt
  commit: ec95343e75c503523b91495f021d109173e169c4
  licence: MIT
modifications:
- Linked against libxslt at commit ec95343e.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
