schema: oss-fuzz-theorems/harness/1
project: dnsmasq
harness: fuzz_util
rocq: OSSVerify.dnsmasq.fuzz_util
origin: oss-fuzz
summary: Builds a fuzzed struct daemon, then calls hostname_isequal, legal_hostname, canonicalise, parse_hex
  (x2), wildcard_match(n), hostname_issubdomain, is_name_synthetic on two fuzzed names; every return value
  discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_util.cc
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/dnsmasq/fuzz_util.cc
  modified: false
  licence: Apache-2.0
library:
  repository: https://thekelleys.org.uk/dnsmasq
  commit: cf9c9c74e047b9203222d46e9df81d72f103cc7f
  licence: NOASSERTION
modifications:
- Linked against dnsmasq at commit cf9c9c74.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
