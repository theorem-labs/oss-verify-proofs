schema: oss-fuzz-theorems/harness/1
project: mpg123
harness: read_fuzzer
rocq: OSSVerify.mpg123.read_fuzzer
origin: oss-fuzz
summary: Writes the input to a mkstemp file, mpg123_open + mpg123_read loop (<=10000 frames, <=1 MiB stream)
  into a 2*size buffer; decoded bytes discarded. abort() only on temp-file setup failure.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/read_fuzzer.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/mpg123/read_fuzzer.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://www.mpg123.de/snapshot
  archive_sha256: 441bbb7d82ff7cbd765694125d25efad100e7ee28b206c41146cc3da6387aa2c
  licence: NOASSERTION
modifications:
- Linked against snapshot from the release archive 441bbb7d.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
