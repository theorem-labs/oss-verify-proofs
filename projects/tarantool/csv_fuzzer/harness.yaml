schema: oss-fuzz-theorems/harness/1
project: tarantool
harness: csv_fuzzer
rocq: OSSVerify.tarantool.csv_fuzzer
origin: upstream
summary: csv_parse_chunk + csv_finish_parsing over a NUL-terminated copy; nothing checked.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/csv_fuzzer.c
  modified: false
  licence: BSD-2-Clause
library:
  repository: https://github.com/tarantool/tarantool
  commit: 4f9b172d129981dc6661d4427040137fd55b1608
  licence: BSD-2-Clause
modifications:
- Linked against tarantool at commit 4f9b172d with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
