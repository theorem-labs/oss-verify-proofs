schema: oss-fuzz-theorems/harness/1
project: simdjson
harness: fuzz_element
rocq: OSSVerify.simdjson.fuzz_element
origin: upstream
summary: parse strings[1], then one of 31 dom::element accessors selected by the first byte (type, get_*,
  is_*, is<T>, get<T>, tie, casts, at_pointer, at, at_key, at_key_case_insensitive, dump_raw_tape); every
  result discarded, exceptions caught.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_element.cpp
  from:
    repository: https://github.com/simdjson/simdjson
    commit: f807de973580fb22cc0db6b3b896716684b0266c
    path: fuzz/fuzz_element.cpp
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/simdjson/simdjson
  commit: f807de973580fb22cc0db6b3b896716684b0266c
  licence: NOASSERTION
modifications:
- Linked against simdjson at commit f807de97 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
