schema: oss-fuzz-theorems/harness/1
project: lighttpd
harness: fuzz_utils
rocq: OSSVerify.lighttpd.fuzz_utils
origin: oss-fuzz
summary: 'first byte % 12 picks one buffer utility on the rest: urldecode_path, path_simplify, is_valid_UTF8,
  to_lower, to_upper, append_string_encoded (REL_URI / HTML), c_escaped, bs_escaped, bs_escaped_json,
  base64 encode, base64 decode; every output is freed unread.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_utils.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/lighttpd/fuzz_utils.c
  modified: true
  licence: Apache-2.0
library:
  repository: https://github.com/lighttpd/lighttpd1.4
  commit: 2ddc51389a139d2b08daf310596c951c1d53dc8d
  licence: BSD-3-Clause
modifications:
- Linked against lighttpd1.4 at commit 2ddc5138.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
