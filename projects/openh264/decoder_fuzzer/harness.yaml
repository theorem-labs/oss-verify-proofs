schema: oss-fuzz-theorems/harness/1
project: openh264
harness: decoder_fuzzer
rocq: OSSVerify.openh264.decoder_fuzzer
origin: oss-fuzz
summary: Splits the input at Annex-B start codes and feeds each NAL slice to ISVCDecoder::DecodeFrameNoDelay
  (ERROR_CON_SLICE_COPY, AVC); decoded frames and return codes ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/decoder_fuzzer.cpp
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/openh264/decoder_fuzzer.cpp
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/cisco/openh264
  commit: 8ed656019aab87820ffb876353db9e6a598b4d00
  licence: BSD-2-Clause
modifications:
- Linked against openh264 at commit 8ed65601.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
