schema: oss-fuzz-theorems/harness/1
project: spdlog
harness: levels_fuzzer
rocq: OSSVerify.spdlog.levels_fuzzer
origin: oss-fuzz
summary: cfg::load_env_levels + cfg::load_argv_levels over up to 255 fuzzed argv strings, then spdlog::info;
  output goes to a basic_file_sink on /dev/null and is never read; fmt format errors are caught by spdlog's
  internal error handler.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/levels_fuzzer.cc
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/spdlog/fuzz/levels_fuzzer.cc
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/gabime/spdlog
  commit: f5f173a1a57d0e2e0115f2ed71ee7ea316516853
  licence: MIT
modifications:
- Linked against spdlog at commit f5f173a1.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
