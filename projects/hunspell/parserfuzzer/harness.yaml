schema: oss-fuzz-theorems/harness/1
project: hunspell
harness: parserfuzzer
rocq: OSSVerify.hunspell.parserfuzzer
origin: upstream
summary: TextParser tokenises a fuzzed line (utf8/url flags from byte 0) and change_token()s tokens with
  fuzzed replacements; results discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/parserfuzzer.cxx
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/hunspell/hunspell
  commit: f143a42a0b95578c39f8657101624ed44dea6514
  licence: NOASSERTION
modifications:
- Linked against hunspell at commit f143a42a.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
