project: libxml2
harness: xpath
rocq: OssFuzzTheorems.libxml2.xpath
origin: upstream
summary: 'Checks one property, an API contract: OOM reporting contract for xmlXPathContextSetCache and
  xmlXPtrEval (lastError.code == XML_ERR_NO_MEMORY iff an injected failure occurred). The document is
  parsed before injection is armed.'
entry: LLVMFuzzerTestOneInput
