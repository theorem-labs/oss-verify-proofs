checks:
- kind: differential
  strength: partial
  stops_with: abort
  live: unknown
  where: source/xml.c:170-182
  what: Pull parser (xmlCtxtReadMemory) and push parser (xmlParseChunk with fuzzed chunk size) agree on
    success vs failure (errNo == XML_ERR_OK) whenever neither hit OOM/IO.
- kind: differential
  strength: full
  stops_with: abort
  live: unknown
  where: source/xml.c:191-227
  what: When both parsers succeed (and XML_PARSE_NOBLANKS is off), the xmlSaveDoc serializations of the
    pull-parsed and push-parsed documents are byte-identical.
