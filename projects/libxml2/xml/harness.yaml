schema: oss-fuzz-theorems/harness/1
project: libxml2
harness: xml
rocq: OSSVerify.libxml2.xml
origin: upstream
summary: 'Checks 3 properties (listed below); the first, an API contract: Error-reporting contract under
  malloc/IO failure injection: xmlCtxtReadMemory, xmlSaveDoc/xmlSaveFinish and the push parser (xmlParseChunk)
  report XML_ERR_NO_MEMORY / XML_IO_EIO if and only if an injected allocation / IO failure actually occurred.
  xmlFuzzCheckFailureReport (fuzz/fuzz.c:167-180) abort()s when the library reports an OOM/IO error that
  was not injected, or fails to report one that was.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/xml.c
  from:
    repository: https://gitlab.gnome.org/GNOME/libxml2
    commit: c63248941708bc1d2e3a4292954593312212f6ca
    path: fuzz/xml.c
  modified: false
  licence: MIT
library:
  repository: https://gitlab.gnome.org/GNOME/libxml2
  commit: c63248941708bc1d2e3a4292954593312212f6ca
  licence: MIT
modifications:
- Linked against libxml2 at commit c6324894.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
