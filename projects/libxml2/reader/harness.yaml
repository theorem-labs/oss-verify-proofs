schema: oss-fuzz-theorems/harness/1
project: libxml2
harness: reader
rocq: OSSVerify.libxml2.reader
origin: upstream
summary: 'Checks one property, an API contract: After a fuzzed program of up to 1000 xmlTextReader API
  calls (57 opcodes), the reader''s last error is XML_ERR_NO_MEMORY iff an injected allocation failed
  and XML_IO_EIO iff an injected IO failure happened (OOM direction disabled after the three ops known
  to swallow OOM). xmlFuzzCheckFailureReport (fuzz/fuzz.c:167-180) abort()s when the library reports an
  OOM/IO error that was not injected, or fails to report one that was.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/reader.c
  from:
    repository: https://gitlab.gnome.org/GNOME/libxml2
    commit: c63248941708bc1d2e3a4292954593312212f6ca
    path: fuzz/reader.c
  modified: false
  licence: MIT
library:
  repository: https://gitlab.gnome.org/GNOME/libxml2
  commit: c63248941708bc1d2e3a4292954593312212f6ca
  licence: MIT
modifications:
- Linked against libxml2 at commit c6324894.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
