schema: oss-fuzz-theorems/harness/1
project: libxml2
harness: api
rocq: OSSVerify.libxml2.api
origin: upstream
summary: 'Checks one property, an API contract: Register-VM over ~160 tree.h API functions (244 opcodes):
  after every op, the op-specific OOM signal (NULL result / negative return, set per op as oomReport =
  1/0/-1) must match whether an injected allocation failure occurred. xmlFuzzCheckFailureReport (fuzz/fuzz.c:167-180)
  abort()s when the library reports an OOM/IO error that was not injected, or fails to report one that
  was.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/api.c
  from:
    repository: https://gitlab.gnome.org/GNOME/libxml2
    commit: c63248941708bc1d2e3a4292954593312212f6ca
    path: fuzz/api.c
  modified: false
  licence: MIT
library:
  repository: https://gitlab.gnome.org/GNOME/libxml2
  commit: c63248941708bc1d2e3a4292954593312212f6ca
  licence: MIT
modifications:
- Linked against libxml2 at commit c6324894.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
