project: libxml2
harness: regexp
rocq: OSSVerify.libxml2.regexp
origin: upstream
summary: 'Checks one property, an API contract: If an injected malloc failure happened during xmlRegexpCompile,
  it must return NULL (one direction only: a spurious NULL is not flagged).'
entry: LLVMFuzzerTestOneInput
source:
