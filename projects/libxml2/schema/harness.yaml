schema: oss-fuzz-theorems/harness/1
project: libxml2
harness: schema
rocq: OSSVerify.libxml2.schema
origin: upstream
summary: Parses the main entity as an XSD (xmlSchemaParse) under failure injection and, if it compiles,
  validates the secondary entity with xmlSchemaValidateDoc; no failure-report check and the validation
  result is ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/schema.c
  from:
    repository: https://gitlab.gnome.org/GNOME/libxml2
    commit: c63248941708bc1d2e3a4292954593312212f6ca
    path: fuzz/schema.c
  modified: false
  licence: MIT
library:
  repository: https://gitlab.gnome.org/GNOME/libxml2
  commit: c63248941708bc1d2e3a4292954593312212f6ca
  licence: MIT
modifications:
- Linked against libxml2 at commit c6324894.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
