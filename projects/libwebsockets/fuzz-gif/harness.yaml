schema: oss-fuzz-theorems/harness/1
project: libwebsockets
harness: fuzz-gif
rocq: OSSVerify.libwebsockets.fuzz_gif
origin: upstream
summary: First byte selects hold_at_metadata; the rest is fed to the stateful GIF decoder (lws_gif_emit_next_line)
  line by line until OK/FATAL/stall, then lws_gif_restart and a second full pass; return codes only steer
  the loop, pixels are not checked (the two passes are not compared).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/main.c
  from:
    repository: https://github.com/warmcat/libwebsockets
    commit: 1b5cc65f94dafc610603a7a09d9b2f2c947c9094
    path: fuzz/fuzz-gif/main.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/warmcat/libwebsockets
  commit: 1b5cc65f94dafc610603a7a09d9b2f2c947c9094
  licence: Zlib
modifications:
- Linked against libwebsockets at commit 1b5cc65f.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
