checks:
- kind: invariant
  strength: weak
  stops_with: abort
  live: unknown
  where: source/fuzzer.c:382-387
  what: abort() if an SRTP profile's master key + salt length exceeds SRTP_MAX_KEY_LEN ("Shouldn't happen
    for a public profile") -- a check over the library's fixed profile table, trivially true.
