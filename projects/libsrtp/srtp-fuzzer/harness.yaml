schema: oss-fuzz-theorems/harness/1
project: libsrtp
harness: srtp-fuzzer
rocq: OSSVerify.libsrtp.srtp_fuzzer
origin: upstream
summary: Builds an SRTP session from input-derived policies (profile, SSRC, keys, MKIs, header-extension
  ids, window), adds/removes streams, sets and gets ROCs, then repeatedly runs an input-chosen protect/unprotect
  (RTP or RTCP) and a second input-chosen operation on the result. Status codes only steer control flow;
  protect->unprotect output is never compared with the original packet, and the ROC read back after srtp_stream_set_roc
  is not compared with the value set.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzzer.c
  from:
    repository: https://github.com/cisco/libsrtp
    commit: 2cb11879b40f9d5031958d2f9a10a8c2237ced7f
    path: fuzzer/fuzzer.c
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/cisco/libsrtp
  commit: 2cb11879b40f9d5031958d2f9a10a8c2237ced7f
  licence: BSD-3-Clause
modifications:
- Linked against libsrtp at commit 2cb11879.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
