schema: oss-fuzz-theorems/harness/1
project: opusfile
harness: opusfile_fuzzer
rocq: OSSVerify.opusfile.opusfile_fuzzer
origin: oss-fuzz
summary: op_open_memory, then op_read_stereo to EOF touching link/tag/picture accessors, then 32 deterministic
  pseudo-random op_pcm_seek + op_read_stereo; the samples read after a seek are not compared with the
  samples at that offset from the linear pass, and totals/tell values are ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/opusfile_fuzzer.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/opusfile/opusfile_fuzzer.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://gitlab.xiph.org/xiph/opusfile
  commit: 6dfd29e7adb87f2e193575fc3fa88cbf1a0b27df
  licence: BSD-3-Clause
modifications:
- Linked against opusfile at commit 6dfd29e7 with 2 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
