schema: oss-fuzz-theorems/harness/1
project: re2
harness: re2_fuzzer
rocq: OSSVerify.re2.re2_fuzzer
origin: upstream
summary: FDP-chosen RE2::Options, anchor, pattern and text; after cost filters (char-class count, subexpression/substring
  walkers, program size and fanout <= limits) exercises FullMatch/PartialMatch/Consume/FindAndConsume
  (typed captures), Replace/GlobalReplace, PossibleMatchRange, NamedCapturingGroups, QuoteMeta, RE2::Set
  and FilteredRE2. Every result is discarded or summed into the global 'dummy'; no cross-API agreement
  is checked (e.g. Set.Match vs PartialMatch, or PossibleMatchRange bounds vs actual matches).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/re2_fuzzer.cc
  from:
