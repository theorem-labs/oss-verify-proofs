schema: oss-fuzz-theorems/harness/1
project: selinux
harness: secilc-fuzzer
rocq: OSSVerify.selinux.secilc_fuzzer
origin: upstream
summary: CIL text -> cil_compile -> cil_build_policydb -> optimize -> write to /dev/null; every failure
  is a goto exit.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/secilc-fuzzer.c
  from:
    repository: https://github.com/SELinuxProject/selinux
    commit: efd1aa519e2f75baab5ea91f81d18e0bbeadd191
    path: libsepol/fuzz/secilc-fuzzer.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/SELinuxProject/selinux
  commit: efd1aa519e2f75baab5ea91f81d18e0bbeadd191
  licence: NOASSERTION
modifications:
- Linked against selinux at commit efd1aa51.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
