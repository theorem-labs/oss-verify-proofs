checks:
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/binpolicy-fuzzer.c:53
  what: A kernel policy that policydb_read accepted must still pass policydb_validate after policydb_optimize
    (optimisation preserves validity).
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/binpolicy-fuzzer.c:69-107
  what: Any binary policy that was read successfully must be writable (policydb_write) and, for kernel
    policies, convertible to policy.conf and CIL; module/base policies must convert to CIL; an expanded
    base must also write and convert.
