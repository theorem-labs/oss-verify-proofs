project: selinux
harness: binpolicy-fuzzer
rocq: OSSVerify.selinux.binpolicy_fuzzer
origin: upstream
summary: 'Checks 2 properties (listed below); the first, an invariant: A kernel policy that policydb_read
  accepted must still pass policydb_validate after policydb_optimize (optimisation preserves validity).'
entry: LLVMFuzzerTestOneInput
