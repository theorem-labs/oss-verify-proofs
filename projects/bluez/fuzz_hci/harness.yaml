schema: oss-fuzz-theorems/harness/1
project: bluez
harness: fuzz_hci
rocq: OSSVerify.bluez.fuzz_hci
origin: oss-fuzz
summary: Copies up to 8 input bytes into a NUL-terminated buffer that nothing reads (the lmp_featurestostr
  and hci_commandstostr calls are commented out), then calls bt_compidtostr on a 16-bit id and ignores
  the result.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_hci.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/bluez/fuzz_hci.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/bluez/bluez
  commit: ebbb4ee31ad7011cead3d6394c68d10076ab55fc
  licence: NOASSERTION
modifications:
- Linked against bluez at commit ebbb4ee3.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
