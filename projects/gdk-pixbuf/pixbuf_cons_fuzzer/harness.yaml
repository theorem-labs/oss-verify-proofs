schema: oss-fuzz-theorems/harness/1
project: gdk-pixbuf
harness: pixbuf_cons_fuzzer
rocq: OSSVerify.gdk_pixbuf.pixbuf_cons_fuzzer
origin: oss-fuzz
summary: Requires >= 800 input bytes and uses them as the pixel bytes of a 10x20, 3-channel, rowstride-40
  pixbuf, then runs scale_simple, rotate_simple, flip, composite_color_simple, set_option/get_option with
  the input as key and value, new_from_data and a second flip; every result is unref'd unread (get_option's
  return value is stored but never compared with what was set).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/pixbuf_cons_fuzzer.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/gdk-pixbuf/targets/pixbuf_cons_fuzzer.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://gitlab.gnome.org/GNOME/gdk-pixbuf
  commit: 8c2942509b02fccabaefcef48d2e0328b497fc5d
  licence: NOASSERTION
modifications:
- Linked against gdk-pixbuf at commit 8c294250 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
