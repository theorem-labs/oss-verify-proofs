licence: NOASSERTION
checks:
- kind: api-contract
  strength: weak
  stops_with: assert
  live: true
  where: source/driver_url.cc:39-42
  what: If h2o_url_parse succeeds (ret != -1), the parsed url must have a non-NULL scheme.
- kind: invariant
  strength: weak
  stops_with: assert
  live: true
  where: source/driver_url.cc:50-52
  what: 'After a successful parse, the count of non-NUL bytes across url.authority, url.host and url.path
    must be at most 2*Size: a loose sanity bound on the parsed component lengths (it touches every byte
    of each component, so ASan also checks they are readable).'
failure_handlers: none
