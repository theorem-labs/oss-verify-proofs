schema: oss-fuzz-theorems/harness/1
project: spirv-tools
harness: spvtools_as_fuzzer
rocq: OSSVerify.spirv_tools.spvtools_as_fuzzer
origin: upstream
summary: Picks a target env from the input, then assembles the input text twice with spvTextToBinaryWithOptions
  (default options, then PRESERVE_NUMERIC_IDS); diagnostics are printed and destroyed, binaries destroyed.
  The two results are never compared.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/spvtools_as_fuzzer.cpp
  from:
    repository: https://github.com/KhronosGroup/SPIRV-Tools
    commit: 47c74f488bad1136559f382ce99e8e52d7a392cd
    path: test/fuzzers/spvtools_as_fuzzer.cpp
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/KhronosGroup/SPIRV-Tools
  commit: 47c74f488bad1136559f382ce99e8e52d7a392cd
  licence: Apache-2.0
modifications:
- Linked against SPIRV-Tools at commit 47c74f48.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
