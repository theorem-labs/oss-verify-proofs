schema: oss-fuzz-theorems/harness/1
project: spirv-tools
harness: spvtools_dis_fuzzer
rocq: OSSVerify.spirv_tools.spvtools_dis_fuzzer
origin: upstream
summary: Packs the input into 32-bit words and disassembles it with spvBinaryToText under every option
  bitmask from NONE (bit 0) up to, not including, the OR of PRINT|COLOR|INDENT|SHOW_BYTE_OFFSET|NO_HEADER|FRIENDLY_NAMES
  (bits 1-6); text and diagnostics are destroyed unread.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/spvtools_dis_fuzzer.cpp
  from:
    repository: https://github.com/KhronosGroup/SPIRV-Tools
    commit: 47c74f488bad1136559f382ce99e8e52d7a392cd
    path: test/fuzzers/spvtools_dis_fuzzer.cpp
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/KhronosGroup/SPIRV-Tools
  commit: 47c74f488bad1136559f382ce99e8e52d7a392cd
  licence: Apache-2.0
modifications:
- Linked against SPIRV-Tools at commit 47c74f48.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
