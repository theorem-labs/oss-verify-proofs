project: sleuthkit
harness: fls_ext_fuzzer
rocq: OSSVerify.sleuthkit.fls_ext_fuzzer
origin: upstream
summary: mem_open wraps the input as a raw 512-byte-sector image; tsk_fs_open_img(FSTYPE) then tsk_fs_fls(FULL,
  root, RECURSE) with a NULL output path; results unused.
entry: LLVMFuzzerTestOneInput
