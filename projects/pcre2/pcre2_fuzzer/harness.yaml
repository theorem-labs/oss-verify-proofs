schema: oss-fuzz-theorems/harness/1
project: pcre2
harness: pcre2_fuzzer
rocq: OSSVerify.pcre2.pcre2_fuzzer
origin: upstream
summary: pcre2_dfa_match runs twice (fuzzed and zero options) and its result is not compared with pcre2_match;
  match results in general are discarded outside the SUPPORT_DIFF_FUZZ block.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/pcre2_fuzzsupport.c
  from:
    repository: https://github.com/PCRE2Project/pcre2
    commit: 92baa6cb647d89385aa9d550bc6614df881d8c2b
    path: src/pcre2_fuzzsupport.c
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/PCRE2Project/pcre2
  commit: 92baa6cb647d89385aa9d550bc6614df881d8c2b
  licence: NOASSERTION
modifications:
- Linked against pcre2 at commit 92baa6cb.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
