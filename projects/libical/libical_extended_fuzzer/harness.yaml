project: libical
harness: libical_extended_fuzzer
rocq: OSSVerify.libical.libical_extended_fuzzer
origin: oss-fuzz
summary: icalcomponent_new_from_string then icalcomponent_normalize on the result; the normalised tree
  is never compared, re-serialised or normalised twice (no idempotence check).
entry: LLVMFuzzerTestOneInput
