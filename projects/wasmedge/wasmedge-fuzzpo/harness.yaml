schema: oss-fuzz-theorems/harness/1
project: wasmedge
harness: wasmedge-fuzzpo
rocq: OSSVerify.wasmedge.wasmedge_fuzzpo
origin: upstream
summary: Splits the input on the 4-byte separator DE AD BE EF into an argv vector and runs WasmEdge's
  PO::ArgumentParser over the full wasmedge CLI option table (output to /dev/null). The parse outcome
  only selects the return value (EXIT_FAILURE / EXIT_SUCCESS); nothing about the parsed options is checked.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/po.cpp
  from:
    repository: https://github.com/WasmEdge/WasmEdge
    commit: ab9a3d78b20c071388fe26e6995d2df687de6e77
    path: tools/fuzz/po.cpp
  modified: true
  licence: Apache-2.0
library:
  repository: https://github.com/WasmEdge/WasmEdge
  commit: ab9a3d78b20c071388fe26e6995d2df687de6e77
  licence: NOASSERTION
modifications:
- Linked against WasmEdge at commit ab9a3d78 with 2 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
