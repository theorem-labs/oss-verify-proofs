licence: NOASSERTION
checks:
- kind: invariant
  strength: partial
  stops_with: assert
  live: unknown
  where: source/fuzz-consume-record.c:56-57
  what: a record parsed from the packet (avahi_dns_packet_consume_record) must satisfy avahi_record_is_valid
- kind: api-contract
  strength: partial
  stops_with: assert
  live: true
  where: source/fuzz-consume-record.c:67-72
  what: the rdata of any successfully parsed record must serialize into an AVAHI_DNS_RDATA_MAX buffer
    without error
- kind: roundtrip
  strength: full
  stops_with: assert
  live: unknown
  where: source/fuzz-consume-record.c:77-84
  what: rdata serialize -> avahi_rdata_parse into a fresh record with the same name/class/type/ttl ->
    avahi_record_equal_no_ttl(original, reparsed) must hold (type-aware full rdata equality). A re-parse
    FAILURE is not flagged (goto finish)
- kind: invariant
  strength: partial
  stops_with: assert
  live: unknown
  where: source/fuzz-consume-record.c:80-81
  what: the re-parsed record must satisfy avahi_record_is_valid
- kind: roundtrip
  strength: full
  stops_with: assert
  live: true
  where: source/fuzz-consume-record.c:86-88
  what: 'second comparator on the same roundtrip: avahi_record_lexicographical_compare(original, reparsed)
    == 0 (under #ifndef HAVE_NALLOCFUZZ, i.e. live by default)'
- kind: api-contract
  strength: full
  stops_with: assert
  live: true
  where: source/fuzz-consume-record.c:94-99
  what: avahi_record_copy(r) must be equal_no_ttl to r and lexicographically compare 0 against it
failure_handlers: none
