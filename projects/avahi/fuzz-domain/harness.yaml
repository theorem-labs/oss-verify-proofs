checks:
- kind: api-contract
  strength: partial
  stops_with: assert
  live: unknown
  where: source/fuzz-domain.c:46-49
  what: if the input is a valid domain name (avahi_is_valid_domain_name) then avahi_normalize_name_strdup
    must succeed
- kind: invariant
  strength: full
  stops_with: assert
  live: unknown
  where: source/fuzz-domain.c:50-51
  what: 'normalization preserves identity: for a valid domain name s, avahi_domain_equal(s, normalize(s))
    (label-wise unescape + case-insensitive compare)'
- kind: invariant
  strength: full
  stops_with: assert
  live: true
  where: source/fuzz-domain.c:56-57
  what: for ANY input whose normalization succeeds, avahi_domain_equal(s, normalize(s)) must hold
