licence: NOASSERTION
checks:
- kind: invariant
  strength: partial
  stops_with: assert
  live: true
  where: source/fuzz-strlst.c:46-47
  what: avahi_string_list_to_string of a parsed TXT string list is valid UTF-8
- kind: api-contract
  strength: partial
  stops_with: assert
  live: true
  where: source/fuzz-strlst.c:57-58
  what: bytes written by avahi_string_list_serialize equal the size the sizing call reported
- kind: roundtrip
  strength: full
  stops_with: assert
  live: unknown
  where: source/fuzz-strlst.c:60-64
  what: 'parse -> serialize -> parse: avahi_string_list_equal(original, reparsed) (element sizes and bytes,
    in order). A re-parse FAILURE is not flagged (goto finish)'
- kind: api-contract
  strength: full
  stops_with: assert
  live: unknown
  where: source/fuzz-strlst.c:67-71
  what: avahi_string_list_copy(a) is avahi_string_list_equal to a
failure_handlers: none
distribution:
