schema: oss-fuzz-theorems/harness/1
project: avahi
harness: fuzz-strlst
rocq: OssFuzzTheorems.avahi.fuzz_strlst
origin: upstream
summary: 'Checks 5 properties (listed below); the first, a round trip: parse -> serialize -> parse: avahi_string_list_equal(original,
  reparsed) (element sizes and bytes, in order). A re-parse FAILURE is not flagged (goto finish).'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz-strlst.c
  from:
    repository: https://github.com/avahi/avahi
    commit: b1a83592590445fc3b88d3b3fdda69b5103956a9
    path: fuzz/fuzz-strlst.c
  modified: false
  licence: LGPL-2.1-or-later
library:
  repository: https://github.com/avahi/avahi
  commit: b1a83592590445fc3b88d3b3fdda69b5103956a9
  licence: LGPL-2.1-or-later
modifications:
- Linked against avahi at commit b1a83592.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
