schema: oss-fuzz-theorems/harness/1
project: hoextdown
harness: hoedown_fuzzer
rocq: OSSVerify.hoextdown.hoedown_fuzzer
origin: upstream
summary: Renders the input as Markdown to HTML with a fixed, large set of extensions and HTML flags; the
  output buffer is freed without being inspected (the fwrite to stdout is commented out).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/hoedown_fuzzer.c
  from:
    repository: https://github.com/kjdev/hoextdown
    commit: 1ef9a71957570c2a65b7daa1b2f693ad87daf385
    path: test/hoedown_fuzzer.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/kjdev/hoextdown
  commit: 1ef9a71957570c2a65b7daa1b2f693ad87daf385
  version: 3.0.7.22
  licence: MIT
modifications:
- Linked against hoextdown 3.0.7.22 at commit 1ef9a719.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
