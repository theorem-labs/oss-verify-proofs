schema: oss-fuzz-theorems/harness/1
project: lcms
harness: fuzzers
rocq: OSSVerify.lcms.fuzzers
origin: upstream
summary: Opens an ICC profile from memory; reads and decodes every tag, reads every raw tag (size query
  only), fetches four info strings, reads input/output/devicelink LUTs for all four intents, detects destination
  black points and TAC, generates PostScript CSA and CRD. All results are discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzzers.c
  from:
    repository: https://github.com/mm2/Little-CMS
    commit: a1a25a00bc5e5f13186a9cf134ffcc0566a8215c
    path: fuzzers/fuzzers.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/mm2/Little-CMS
  commit: a1a25a00bc5e5f13186a9cf134ffcc0566a8215c
  licence: MIT
modifications:
- Linked against Little-CMS at commit a1a25a00.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
