schema: oss-fuzz-theorems/harness/1
project: wt
harness: fuzz-eval
rocq: OSSVerify.wt.fuzz_eval
origin: upstream
summary: Copies the input (Size from 10 to 5120 bytes) into a string and evaluates it as a plural-case
  expression with n = 0 through Wt::WMessageResources::evalPluralCase, catching and dropping WInvalidFormatException
  and WInvalidOperationException, and drops the result. It returns -1 for an input with Size below 10
  or above 5120.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz-eval.C
  from:
    repository: https://github.com/emweb/wt
    commit: 0ec92b6bfc41be037dcf3ddfc72664ca261821bd
    path: fuzz/fuzz-eval.C
  modified: true
  licence: NOASSERTION
library:
  repository: https://github.com/emweb/wt
  commit: 0ec92b6bfc41be037dcf3ddfc72664ca261821bd
  licence: NOASSERTION
modifications:
- Linked against wt at commit 0ec92b6b.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- 'The harness source is modified: source/fuzz-eval.C is wt 0ec92b6b''s fuzz/fuzz-eval.C with one Theorem
  Labs change: its length check returns -1, not 1, for an input outside its limits (libFuzzer rejects
  the input; the driver exits 0, not 78).'
