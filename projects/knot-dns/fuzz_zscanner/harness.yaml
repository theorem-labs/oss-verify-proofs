schema: oss-fuzz-theorems/harness/1
project: knot-dns
harness: fuzz_zscanner
rocq: OSSVerify.knot_dns.fuzz_zscanner
origin: upstream
summary: zs_init + zs_set_input_string + zs_parse_all over the zone-file text; no callback is installed
  and the parse result is ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_zscanner.c
  from:
    repository: https://gitlab.nic.cz/knot/knot-dns
    commit: b343eba7297f50d186f47f0f5f3b13abe0dc5db1
    path: tests-fuzz/fuzz_zscanner.c
  modified: false
  licence: GPL-2.0-or-later
library:
  repository: https://gitlab.labs.nic.cz/knot/knot-dns
  commit: b343eba7297f50d186f47f0f5f3b13abe0dc5db1
  licence: GPL-2.0-or-later
modifications:
- Linked against knot-dns at commit b343eba7.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
