licence: NOASSERTION
checks:
- kind: invariant
  strength: partial
  stops_with: exit
  exit_status: 1
  exit_reaches_guard: true
  live: unknown
  where: source/large_fuzzer.c:54-58
  what: deflate(Z_NO_FLUSH) with ample output space must consume all input ('deflate not greedy' -> exit
    1)
- kind: api-contract
  strength: partial
  stops_with: exit
  exit_status: 1
  exit_reaches_guard: true
  live: unknown
  where: source/large_fuzzer.c:66-74
  what: deflate(Z_FINISH) after feeding its own compressed output back in must report Z_STREAM_END; deflateInit/deflate/deflateEnd
    must return Z_OK
- kind: self-validation
  strength: partial
  stops_with: exit
  exit_status: 1
  exit_reaches_guard: true
  live: true
  where: source/large_fuzzer.c:97-109
  what: The deflate stream just produced must inflate to Z_STREAM_END without any inflate error (output
    discarded, not compared)
failure_handlers: none
distribution:
  file: Distribution.v
  argv0: large_fuzzer
  input_file: input.bin
  prefix_hex: '000000000000'
  payload:
    length: geometric
    p: 1/16385
    mean_bytes: 16384
    alphabet: bytes
  components:
    payload: 9/10
    wrong_argc: 1/50
    missing_file: 1/50
    full_support: 3/50
  mass: '1'
