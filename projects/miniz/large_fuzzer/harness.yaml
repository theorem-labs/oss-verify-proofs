project: miniz
harness: large_fuzzer
rocq: OssFuzzTheorems.miniz.large_fuzzer
origin: upstream
summary: 'Checks 3 properties (listed below); the first, an invariant: deflate(Z_NO_FLUSH) with ample
  output space must consume all input (''deflate not greedy'' -> exit 1).'
entry: LLVMFuzzerTestOneInput
