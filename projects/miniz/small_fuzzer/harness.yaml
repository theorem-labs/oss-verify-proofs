schema: oss-fuzz-theorems/harness/1
project: miniz
harness: small_fuzzer
rocq: OSSVerify.miniz.small_fuzzer
origin: upstream
summary: 'Checks 2 properties (listed below); the first, a round trip: Deflate the input with 1-byte in/out
  buffers, inflate it back with 1-byte buffers, and the result must equal the input byte-for-byte (memcmp
  over dataLen).'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/small_fuzzer.c
  from:
    repository: https://github.com/richgel999/miniz
    commit: 77d0dce8627735138c51770d1799a1ef48f2117d
    path: tests/small_fuzzer.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/richgel999/miniz
  commit: 77d0dce8627735138c51770d1799a1ef48f2117d
  version: 3.1.2
  licence: MIT
modifications:
- Linked against miniz 3.1.2 at commit 77d0dce8.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
