project: miniz
harness: compress_fuzzer
rocq: OSSVerify.miniz.compress_fuzzer
origin: upstream
summary: 'check_decompress: prepends a synthetic 2-byte zlib header to the raw input and uncompress()es
  it; result ignored.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/compress_fuzzer.c
  from:
    repository: https://github.com/richgel999/miniz
