    path: tests/compress_fuzzer.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/richgel999/miniz
  commit: 77d0dce8627735138c51770d1799a1ef48f2117d
  version: 3.1.2
  licence: MIT
modifications:
- Linked against miniz 3.1.2 at commit 77d0dce8.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
