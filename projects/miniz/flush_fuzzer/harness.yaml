schema: oss-fuzz-theorems/harness/1
project: miniz
harness: flush_fuzzer
rocq: OSSVerify.miniz.flush_fuzzer
origin: upstream
summary: 'Checks one property, an API contract: deflateInit, deflate(Z_FULL_FLUSH) on the first 3 bytes,
  deflate(Z_FINISH) on the rest (after corrupting compr[3] of the already-emitted output), and deflateEnd
  must each return Z_OK (or Z_STREAM_END for the finish); anything else exits 1.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/flush_fuzzer.c
  from:
    repository: https://github.com/richgel999/miniz
    commit: 77d0dce8627735138c51770d1799a1ef48f2117d
    path: tests/flush_fuzzer.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/richgel999/miniz
  commit: 77d0dce8627735138c51770d1799a1ef48f2117d
  version: 3.1.2
  licence: MIT
modifications:
- Linked against miniz 3.1.2 at commit 77d0dce8.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
