schema: oss-fuzz-theorems/harness/1
project: lzo
harness: lzo_compress_target
rocq: OssFuzzTheorems.lzo.lzo_compress_target
origin: oss-fuzz
summary: 'Checks 2 properties (listed below); the first, a round trip: For compressible input (compressed_len
  < size), lzo1x_decompress into size+1 bytes must return LZO_E_OK and produce exactly size bytes. ONLY
  THE LENGTH is compared: the decompressed content is never memcmp''d against the input, so a decoder
  that returned the right number of wrong bytes would pass.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/lzo_compress_target.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/lzo/lzo_compress_target.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz
  archive_sha256: c0f892943208266f9b6543b3ae308fab6284c5c90e627931446fb49b4221a072
  licence: GPL-2.0-or-later
modifications:
- Linked against lzo from the release archive c0f89294.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
