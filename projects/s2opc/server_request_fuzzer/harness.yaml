schema: oss-fuzz-theorems/harness/1
project: s2opc
harness: server_request_fuzzer
rocq: OSSVerify.s2opc.server_request_fuzzer
origin: upstream
summary: Feeds the input as TCP bytes to a server-side secure-connection chunk decoder (SC_Chunks_DecodeReceivedBuffer
  / SC_Chunks_TreatTcpPayload) until either returns false.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_server_request.c
  from:
    repository: https://gitlab.com/systerel/S2OPC
    commit: bad930a6f63cb23cde9666b3e46384c5b9f4352f
    path: tests/ClientServer/unit_tests/fuzzing/fuzz_server_request.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://gitlab.com/systerel/S2OPC
  commit: bad930a6f63cb23cde9666b3e46384c5b9f4352f
  licence: NOASSERTION
modifications:
- Linked against S2OPC at commit bad930a6.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
