project: s2opc
harness: sub_fuzzer
rocq: OSSVerify.s2opc.sub_fuzzer
origin: upstream
summary: Decodes the input as a UADP PubSub NetworkMessage against a fixed two-reader-group subscriber
  configuration; result deleted unchecked.
entry: LLVMFuzzerTestOneInput
source:
