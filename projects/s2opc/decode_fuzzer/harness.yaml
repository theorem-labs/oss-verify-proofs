licence: NOASSERTION
checks:
- kind: api-contract
  strength: full
  stops_with: assert
  live: true
  where: source/fuzz_decoder.c:125-158
  what: For a fuzz-selected OPC UA encodeable type (6 type groups, byte 0/1 select group/type), if Decode
    of the input succeeds then Encode of the decoded value must succeed, and Decode of that encoding must
    succeed.
- kind: roundtrip
  strength: full
  stops_with: assert
  live: true
  where: source/fuzz_decoder.c:161
  what: 'decode(x)=v, encode(v)=b1, decode(b1)=v2, encode(v2)=b2: b1 and b2 must be byte-identical (length
    and memcmp), i.e. encode.decode is idempotent on the canonical encoding (the input itself is deliberately
    not compared).'
failure_handlers: none
distribution:
  file: Distribution.v
  argv0: decode_fuzzer
  input_file: input.bin
  prefix_hex: '000000000000'
  payload:
