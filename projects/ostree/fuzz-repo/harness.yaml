schema: oss-fuzz-theorems/harness/1
project: ostree
harness: fuzz-repo
rocq: OSSVerify.ostree.fuzz_repo
origin: oss-fuzz
summary: Creates an archive-mode repo in a temp dir, sets config key [input] input=input, writes, reloads
  the config and reads min-free-space-bytes; all return values and errors ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz-repo.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/ostree/fuzz-repo.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/ostreedev/ostree
  commit: 1d5a312a3189b0fbd70fe6769aadb19a366fedb2
  licence: NOASSERTION
modifications:
- Linked against ostree at commit 1d5a312a.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
