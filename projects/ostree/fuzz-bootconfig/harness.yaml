schema: oss-fuzz-theorems/harness/1
project: ostree
harness: fuzz-bootconfig
rocq: OSSVerify.ostree.fuzz_bootconfig
origin: oss-fuzz
summary: Writes the input to a temp bootloader-entry file (optionally using a '+'-prefixed input prefix
  as the tries-counter filename suffix), parses it with ostree_bootconfig_parser_parse_at, calls the tries/get
  getters, writes it back with ostree_bootconfig_parser_write_at and clones it; every result and error
  is discarded. The written-back file is never re-parsed or compared (a parse->write->parse roundtrip
  was available but not checked).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz-bootconfig.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/ostree/fuzz-bootconfig.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/ostreedev/ostree
  commit: 1d5a312a3189b0fbd70fe6769aadb19a366fedb2
  licence: NOASSERTION
modifications:
- Linked against ostree at commit 1d5a312a.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
