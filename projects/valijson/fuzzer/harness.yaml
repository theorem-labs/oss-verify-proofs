schema: oss-fuzz-theorems/harness/1
project: valijson
harness: fuzzer
rocq: OSSVerify.valijson.fuzzer
origin: upstream
summary: rapidjson-parses the input as a JSON-Schema-Test-Suite style array; for each {schema, tests}
  case populates a Schema (draft4 or draft7 by input-size parity) and validates every test.data against
  it; the ValidationResults and the suite's own expected "valid" flag are both ignored, std::exception
  swallowed.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzzer.cpp
  from:
    repository: https://github.com/tristanpenman/valijson
    commit: d358f9674adc47358733abafdc0fb2a45df8d963
    path: tests/fuzzing/fuzzer.cpp
  modified: false
  licence: BSD-2-Clause
library:
  repository: https://github.com/tristanpenman/valijson
  commit: d358f9674adc47358733abafdc0fb2a45df8d963
  licence: BSD-2-Clause
modifications:
- Linked against valijson at commit d358f967.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
