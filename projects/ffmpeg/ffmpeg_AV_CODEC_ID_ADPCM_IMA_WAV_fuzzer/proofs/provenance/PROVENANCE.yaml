  written without a rebuild of them
proofs:
  origin: contributed in https://github.com/theorem-labs/oss-verify-proofs/pull/24 (head 5092ffbe06f135c79d97c06dc521468cd492f691).
    Of its 277 Rocq files, 270 carry Anthropic's copyright line and the tag Apache-2.0 OR MIT, 6 are tagged
    MIT and 1 carries no licence lines. 264 of the 270 say in a line under their licence header that they
    were copied from projects/zlib/checksum_fuzzer/proofs/lib with their module paths changed, and 262
    of those also name proofs/cgif/cgif_file_fuzzer/lib and 2 proofs/cgif/cgif_rgb_fuzzer/lib as where
    the zlib files themselves came from; the zlib record names final-anthropic-opensource-formal-verification-proofs-package-2026-10-21
    (sha256 4c6c152f61ce538e439b9d2adef439f4dbe1a2d446767d84ac7c3946d7c6687a) as the package those cgif
    files came from
  licence: Apache-2.0 OR MIT for the 270 files that carry Anthropic's copyright line and that tag; MIT,
    this repository's licence (LICENSE), for the other 7, which the contributor wrote
  texts:
  - LICENSES/anthropic-proofs-LICENSE
  - LICENSES/anthropic-proofs-LICENSE-MIT
  - LICENSES/anthropic-proofs-NOTICE
  texts_location: the repository's top directory
  modified: each changed file carries one line under its licence header saying so
