oss_fuzz:
  repository: https://github.com/google/oss-fuzz
  commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
  path: projects/ffmpeg
harness:
  origin: upstream
  source:
    files:
    - source/target_enc_fuzzer.c
    from:
      repository: https://github.com/FFmpeg/FFmpeg
      commit: bbd37149e4b1bd9730a70f06b72d1c1f9b95bc0f
      path: tools/target_enc_fuzzer.c
    modified: false
    licence: LGPL-2.1-or-later
  modifications:
  - Linked against FFmpeg at commit bbd37149.
  - In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the
    program depends only on its input.
  - A small driver reads the input file, calls the harness one to four times and prints each return value.
