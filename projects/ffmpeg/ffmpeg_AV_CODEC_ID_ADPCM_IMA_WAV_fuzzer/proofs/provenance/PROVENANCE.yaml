  licence: GPL-2.0-or-later
  licence_evidence: LICENSE.md of FFmpeg/FFmpeg at bbd37149 states that FFmpeg is under the LGPL version
    2.1 or later, and that the GPL version 2 or later applies to all of FFmpeg once a GPL part is used;
    the recipe that built these binaries configures the build with --enable-gpl (recipe/targets/ffmpeg-ffmpeg_AV_CODEC_ID_ADPCM_IMA_WAV_fuzzer/pin,
