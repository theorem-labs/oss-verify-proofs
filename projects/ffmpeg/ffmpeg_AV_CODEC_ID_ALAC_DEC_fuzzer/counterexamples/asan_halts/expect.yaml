observed:
  build: asan
  exit: 134
  signal: SIGABRT
message: "Assertion ret != (-(int)(('B') | (('U') << 8) | (('G') << 16) | ((unsigned)('!') << 24))) failed"
control:
  input: control.bin
  exit: 0
disclosure: public
note: >-
  The harness's av_assert0(ret != AVERROR_BUG) (tools/target_dec_fuzzer.c) aborts. The 36-byte extradata carries a sample rate of 0, which alac_decode_init() (libavcodec/alac.c) copies into the context without a check; the alac decoder sets AV_CODEC_CAP_CHANNEL_CONF, so avcodec_open2() does not reject it. One uncompressed packet then outputs a frame with sample_rate 0, which frame_validate() (libavcodec/decode.c) turns into AVERROR_BUG. control.bin is the same input with 44100 as the sample rate in the extradata. The same payload fails a native x86-64 fuzz build of FFmpeg master; a fix is proposed in FFmpeg pull request 25954 on FFmpeg's Forgejo.
