schema: oss-fuzz-theorems/harness/1
project: libcups
harness: fuzzhttp
rocq: OSSVerify.libcups.fuzzhttp
origin: upstream
summary: NUL-terminated input through httpSeparateURI; on success httpAssembleURI rebuilds a URI from
  the parts, but the rebuilt string is never compared with the input (the comment says round-trip, nothing
  checks it). Then httpDecode64 and httpGetDateTime with results ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzzhttp.c
  modified: true
  licence: Apache-2.0
library:
  repository: https://github.com/OpenPrinting/libcups
  commit: 2b2786a670f7282979d87483d361026a15297af6
  licence: NOASSERTION
modifications:
- Linked against libcups at commit 2b2786a6.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
- This copy of the harness could not be matched to an upstream file at a pinned commit, so it is marked
  modified; it is the file as built.
