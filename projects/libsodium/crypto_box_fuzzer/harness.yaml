schema: oss-fuzz-theorems/harness/1
project: libsodium
harness: crypto_box_fuzzer
rocq: OssFuzzTheorems.libsodium.crypto_box_fuzzer
origin: oss-fuzz
summary: 'Checks 3 properties (listed below); the first, a round trip: crypto_box_open_easy(crypto_box_easy(m))
  must succeed and reproduce m exactly (message from input, nonce from input, keypair 1 from an input
  seed, keypair 2 from the input-seeded deterministic RNG).'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/crypto_box_fuzzer.cc
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/libsodium/crypto_box_fuzzer.cc
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/jedisct1/libsodium
  commit: 2c61b499e7cea2d873a9afee220c946601f78beb
  licence: ISC
modifications:
- Linked against libsodium at commit 2c61b499.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
