schema: oss-fuzz-theorems/harness/1
project: libsodium
harness: crypto_kx_fuzzer
rocq: OSSVerify.libsodium.crypto_kx_fuzzer
origin: oss-fuzz
summary: Seed keypair, then client and server session keys against an input public key; returns and keys
  ignored. The natural law (client rx == server tx and vice versa for a matched pair) is not checked --
  the harness even reuses the same keypair for both roles and overwrites rx/tx.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/crypto_kx_fuzzer.cc
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/libsodium/crypto_kx_fuzzer.cc
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/jedisct1/libsodium
  commit: 2c61b499e7cea2d873a9afee220c946601f78beb
  licence: ISC
modifications:
- Linked against libsodium at commit 2c61b499.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
