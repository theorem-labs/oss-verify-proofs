checks:
- kind: self-validation
  strength: full
  stops_with: assert
  live: true
  where: source/crypto_sign_fuzzer.cc:47-52
  what: An Ed25519 detached signature just made over the input message with an input-seeded key must verify
    under the matching public key.
- kind: self-validation
  strength: full
  stops_with: assert
  live: true
  where: source/crypto_sign_fuzzer.cc:54-68
  what: Multi-part (Ed25519ph) signature built with init/update(two halves)/final_create must verify with
    a fresh init/update(same halves)/final_verify.
failure_handlers: none
distribution:
  file: Distribution.v
  argv0: crypto_sign_fuzzer
  input_file: input.bin
  prefix_hex: '000000000000'
  payload:
