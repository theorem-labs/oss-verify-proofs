    path: test/fuzzing/hb-subset-fuzzer.cc
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/harfbuzz/harfbuzz
  commit: cf30f712e73937b3954c57d9521e2e021671527c
  licence: NOASSERTION
modifications:
- Linked against harfbuzz at commit cf30f712.
- In every build, getenv() returns NULL and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
