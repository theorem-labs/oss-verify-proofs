schema: oss-fuzz-theorems/harness/1
project: harfbuzz
harness: hb-subset-fuzzer
rocq: OSSVerify.harfbuzz.hb_subset_fuzzer
origin: upstream
summary: Loads the fuzzed font and runs hb_subset_or_fail with a fixed codepoint set, then (legacy mode)
  with codepoints/flags/pinned axis locations read from the input tail, or (extended "HBSUBFZ2" mode)
  with an op stream editing flags, sets, text and axis ranges. hb_face_collect_unicodes is also called.
entry: LLVMFuzzerTestOneInput
