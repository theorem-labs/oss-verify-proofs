- kind: invariant
  strength: weak
  stops_with: abort
  live: unknown
  where: source/hb-subset-fuzzer.cc:39-42
  what: A successful, non-empty subset blob must not be all zero bytes (the loop exists to touch every
    output byte; any real sfnt header is non-zero).
