  from:
    repository: https://github.com/harfbuzz/harfbuzz
    commit: 485df9d5751b531363a9ad3ee6c6186f83a85abd
    path: test/fuzzing/hb-repacker-fuzzer.cc
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/harfbuzz/harfbuzz
  commit: 485df9d5751b531363a9ad3ee6c6186f83a85abd
  licence: NOASSERTION
modifications:
- Linked against harfbuzz at commit cf30f712.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
