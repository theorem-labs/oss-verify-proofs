schema: oss-fuzz-theorems/harness/1
project: harfbuzz
harness: hb-repacker-fuzzer
rocq: OSSVerify.harfbuzz.hb_repacker_fuzzer
origin: upstream
summary: Decodes a table tag, an object list (blobs) and a link list from the input into hb_subset_serialize_object_t
  graph nodes and calls hb_subset_serialize_or_fail (the repacker); the packed blob is destroyed unread,
  so the repacker's output is never checked for overflow-freedom or for preserving the graph.
entry: LLVMFuzzerTestOneInput
source:
  files:
