schema: oss-fuzz-theorems/harness/1
project: harfbuzz
harness: hb-shape-fuzzer
rocq: OSSVerify.harfbuzz.hb_shape_fuzzer
origin: upstream
summary: Loads the fuzzed font, shapes a fixed ASCII string and then a 16-codepoint UTF-32 string derived
  from the input (plus test_font() from test/api/test-ot-face.c, which calls most hb_ot_* / hb_font_*
  getters and discards the results).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/hb-shape-fuzzer.cc
  from:
    repository: https://github.com/harfbuzz/harfbuzz
    commit: cf30f712e73937b3954c57d9521e2e021671527c
    path: test/fuzzing/hb-shape-fuzzer.cc
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/harfbuzz/harfbuzz
  commit: cf30f712e73937b3954c57d9521e2e021671527c
  licence: NOASSERTION
modifications:
- Linked against harfbuzz at commit cf30f712.
- In every build, getenv() returns NULL and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
