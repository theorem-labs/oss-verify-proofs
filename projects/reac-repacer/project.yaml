schema: oss-fuzz-theorems/project/1
project: reac-repacer
description: 'reac-repacer is the de-jitter relay of FreeREAC: between a Wi-Fi link and the REAC stageboxes of a Roland mixer,
  it buffers the bursty stream of REAC audio frames and re-emits it at a steady cadence. The fuzz targets drive the code that
  reads bytes from the network and from its configuration.'
