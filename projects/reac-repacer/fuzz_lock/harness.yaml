schema: oss-fuzz-theorems/harness/1
project: reac-repacer
harness: fuzz_lock
rocq: OSSVerify.reac_repacer.fuzz_lock
origin: upstream
summary: Takes a rate selector byte, a name-length byte (its value modulo 16), an interface name of that many bytes (an empty
  name, or one holding a NUL, space, tab, CR or LF, is rejected), and then the text of a warm-start lock file. It asks the
  lock reader for the saved frame period of that interface at that rate, checks that the answer is the same when the byte
  after the text is "0" and when it is a space, and compares it with the period the harness finds itself by parsing the record
  grammar (port, period, rate label, within 5% of the standard period, last record wins, at most 65536 bytes).
entry: LLVMFuzzerTestOneInput
