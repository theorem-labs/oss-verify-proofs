  - source/fuzz_lock.c
  - source/fuzz.h
  from:
    repository: https://github.com/FreeREAC/reac-repacer
    commit: 3ac1cf1017c847fe2272fce7f2f93306f8a23b42
    path: fuzz/fuzz_lock.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/FreeREAC/reac-repacer
  commit: 3ac1cf1017c847fe2272fce7f2f93306f8a23b42
  version: 0.2.3
  licence: GPL-3.0-or-later
modifications:
- Linked against a static library of src/repace_wire.c and src/repace_conf.c, and one of libreac's src/reac.c, the files reac-repacer's
  own libFuzzer build compiles; built as a static riscv64 program for the standard driver in place of libFuzzer.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the fuzz target one to four times and prints each return value.
