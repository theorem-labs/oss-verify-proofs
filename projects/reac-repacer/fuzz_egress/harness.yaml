schema: oss-fuzz-theorems/harness/1
project: reac-repacer
harness: fuzz_egress
rocq: OSSVerify.reac_repacer.fuzz_egress
origin: upstream
summary: 'Takes a slot byte, a 32-bit output counter, twelve 32-bit samples and then a frame of at most 1600 bytes. It runs
  every write the daemon makes into a frame it emits: the counter restamp, the mute used during a rate change, the gate that
  decides whether a frame holds the injected slot, and the slot sample writer. It compares each resulting frame with one the
  harness builds itself from the REAC frame layout.'
entry: LLVMFuzzerTestOneInput
