checks:
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_egress.c:39-61
  what: After a restamp, a frame of 18 bytes or more carries the low 16 bits of the counter at bytes 14-15, little-endian,
    and every other byte is unchanged.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_egress.c:63-87
  what: The mute zeroes an audio frame of more than 18 bytes from byte 18 to its end and keeps bytes 0-17; any other frame
    is unchanged.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_egress.c:97-107
  what: The gate answers the frame's width exactly when the frame is audio and its width, by the frame law, holds the slot,
    and -1 otherwise.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_egress.c:109-141
  what: The writer writes exactly when the gate lets it; the frame then carries the low 24 bits of each sample at the braid
    bytes for that slot and time-sample, and every other byte is unchanged.
