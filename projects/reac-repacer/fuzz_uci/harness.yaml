schema: oss-fuzz-theorems/harness/1
project: reac-repacer
harness: fuzz_uci
rocq: OSSVerify.reac_repacer.fuzz_uci
origin: upstream
summary: Takes a ring-size bit and then, for each of the five hot parameters, a running value and a configuration reply of
  up to 255 bytes. It reads each reply as an integer, checks that the value is the same when the byte after the reply is "0"
  and when it is a space, compares it with the value the harness parses itself, and then checks that holding the five values
  to their ranges gives the ranges the harness defines itself.
entry: LLVMFuzzerTestOneInput
