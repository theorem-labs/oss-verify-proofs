checks:
- kind: invariant
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_uci.c:82-103
  what: 'A reply''s value depends only on the reply''s bytes: the same reply followed by "0" and followed by a space gives
    the same value.'
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_uci.c:105-133
  what: The value is the one the reply grammar gives (blanks, an optional sign, decimal digits, then blanks or a CR, on the
    first line) when it fits an int, and the running value otherwise.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_uci.c:135-173
  what: Each of the five parameters is held to its range, the adaptive maximum to at least the adaptive minimum, and the margin
    to the ring size less 64.
failure_handlers: none
