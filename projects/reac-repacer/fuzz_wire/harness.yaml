schema: oss-fuzz-theorems/harness/1
project: reac-repacer
harness: fuzz_wire
rocq: OSSVerify.reac_repacer.fuzz_wire
origin: upstream
summary: 'Takes one flag byte (the broadcast-only switch and a channel slot from -2 to 125) and then a frame, cut to the 1600
  bytes of the daemon''s receive buffer. It runs the frame through every reader the daemon applies to a frame from the wire:
  the forward classifier, the return relay, the downstream listener, the clock meter, the counter read, the channel-width
  rule, the tag-removing copy reader and the slot sample reader. It compares each answer with one the harness computes itself
  from the REAC frame layout.'
entry: LLVMFuzzerTestOneInput
