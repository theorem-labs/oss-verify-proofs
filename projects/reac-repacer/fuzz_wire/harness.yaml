checks:
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_wire.c:50-70
  what: The forward reader queues a REAC frame of 18 bytes or more (with broadcast-only, only one whose destination starts
    with 0xff) as audio when its type is 00 00 and as control otherwise, and drops every other frame.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_wire.c:72-84
  what: The return relay passes exactly the REAC frames of 14 bytes or more.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_wire.c:86-98
  what: The downstream listener accepts exactly the REAC frames of 18 bytes or more, untagged or behind one 802.1Q VLAN tag.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_wire.c:100-131
  what: The clock meter counts exactly the REAC frames of 1000 bytes or more, untagged or tagged, reads the frame counter
    as the two little-endian bytes after the EtherType, and leaves the counter unchanged for a frame it skips.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_wire.c:133-144
  what: For a frame of 18 bytes or more, the counter read is bytes 14-15, little-endian.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_wire.c:146-168
  what: The channel width of a frame length is the frame law's (52 bytes plus 36 per channel, for an even width from 2 to
    40, or 2 bytes more with an FCS residue), and no negative length has a width.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_wire.c:184-210
  what: The copy reader keeps exactly the REAC audio frames of 50 bytes or more; a tagged one loses its four tag bytes and
    nothing else moves.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_wire.c:212-251
  what: A slot is read only when the frame is audio and its width holds the slot; the 12 samples read are the ones the REAC
    braid layout places there, sign-extended from 24 bits; a declined read leaves the samples unchanged.
