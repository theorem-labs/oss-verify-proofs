schema: oss-fuzz-theorems/harness/1
project: pcapplusplus
harness: FuzzWriter
rocq: OSSVerify.pcapplusplus.FuzzWriter
origin: upstream
summary: 'Reads every packet of the input capture and writes it to a pcap/pcapng writer (converter shape:
  .pcap in -> .pcapng out for FuzzWriter, .pcapng in -> .pcap out for FuzzWriterNg), prints writer stats.
  The written file is never read back or compared with the input, so the conversion is NOT a round-trip
  check.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/FuzzWriter.cpp
  from:
    repository: https://github.com/seladb/PcapPlusPlus
    commit: 7f99131913bbd82e697e8c3f2a567e2bddfbc365
    path: Tests/Fuzzers/FuzzWriter.cpp
  modified: true
  licence: Unlicense
library:
  repository: https://github.com/seladb/PcapPlusPlus
  commit: 7f99131913bbd82e697e8c3f2a567e2bddfbc365
  licence: Unlicense
modifications:
- Linked against PcapPlusPlus at commit 7f991319 with 2 patches to the library (listed on the project
  page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
