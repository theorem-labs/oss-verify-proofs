schema: oss-fuzz-theorems/harness/1
project: pycryptodome
harness: aes_fuzzer
rocq: OSSVerify.pycryptodome.aes_fuzzer
origin: upstream
summary: Key size from ConsumeEnum (16/24/32), AES_start_operation, then encrypt(data) and, separately,
  decrypt(data) of the SAME whole input into two buffers. It is not decrypt(encrypt(x)); both outputs
  and both return codes are discarded (a size not a multiple of 16 just returns ERR_NOT_ENOUGH_DATA).
entry: LLVMFuzzerTestOneInput
source:
  files: []
  modified: true
  licence: Apache-2.0
  pending: true
library:
  repository: https://github.com/Legrandin/pycryptodome
  commit: a1e52c70302a51077e9d6a20a6abc6a04da1b5e6
  licence: BSD-2-Clause
modifications:
- Linked against pycryptodome at commit a1e52c70.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source was modified for these builds; the modified copy is not in this release yet.
