schema: oss-fuzz-theorems/harness/1
project: gpsd
harness: FuzzDriversStructured
rocq: OSSVerify.gpsd.FuzzDriversStructured
origin: upstream
summary: Byte 0 selects one of 10 GNSS protocols (SiRF, UBX, Zodiac, GeoStar, Navcom, NMEA, RTCM3, TSIP,
  GREIS, Skytraq); the harness frames the rest as a packet with a VALID checksum/CRC so it passes the
  lexer, writes it to a pipe and runs gpsd_poll() up to 100 times. The checksums are generated, not checked;
  nothing about the decoded state is asserted.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/FuzzDriversStructured.c
  modified: true
  licence: Apache-2.0
library:
  repository: https://gitlab.com/gpsd/gpsd
  commit: 46977faa8f94eb036ca68c24a3fc0d233732e707
  licence: BSD-2-Clause
modifications:
- Linked against gpsd at commit 46977faa.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
- This copy of the harness could not be matched to an upstream file at a pinned commit, so it is marked
  modified; it is the file as built.
