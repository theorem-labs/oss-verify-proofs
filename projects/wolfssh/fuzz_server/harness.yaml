schema: oss-fuzz-theorems/harness/1
project: wolfssh
harness: fuzz_server
rocq: OSSVerify.wolfssh.fuzz_server
origin: upstream
summary: Server-side wolfSSH_accept over a recv callback that serves the input (sends discarded, user
  auth always succeeds); the accept result is explicitly ignored ("we only care about memory-safety issues").
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_server.c
  modified: true
  licence: Apache-2.0
library:
  repository: https://github.com/wolfssl/wolfssh
  commit: bfe6fe0f2d63f2048e7080ed6afb0f4c9da34efd
  licence: NOASSERTION
modifications:
- Linked against wolfssh at commit bfe6fe0f.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
- This copy of the harness could not be matched to an upstream file at a pinned commit, so it is marked
  modified; it is the file as built.
