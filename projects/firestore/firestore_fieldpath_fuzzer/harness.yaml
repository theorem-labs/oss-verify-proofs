rocq: OSSVerify.firestore.firestore_fieldpath_fuzzer
origin: upstream
summary: FieldPath::FromServerFormat(input); the StatusOr is discarded; all C++ exceptions swallowed.
entry: LLVMFuzzerTestOneInput
