schema: oss-fuzz-theorems/harness/1
project: pugixml
harness: fuzz_parse
rocq: OSSVerify.pugixml.fuzz_parse
origin: upstream
summary: xml_document::load_buffer of the input three times (default, parse_minimal, parse_full flags);
  the xml_parse_result and the tree are discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_parse.cpp
  from:
    repository: https://github.com/zeux/pugixml
