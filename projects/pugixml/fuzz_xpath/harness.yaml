schema: oss-fuzz-theorems/harness/1
project: pugixml
harness: fuzz_xpath
rocq: OSSVerify.pugixml.fuzz_xpath
origin: upstream
summary: compiles a fuzzed XPath expression with up to 50 fuzzed variables, parses a fuzzed XML buffer
  (parse_full), and evaluates the query as boolean/number/string/node/node_set; results discarded; pugi::xpath_exception
  caught, any other exception aborts.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_xpath.cpp
  from:
    repository: https://github.com/zeux/pugixml
    commit: 27b68329de32cf9c601ca8eb6c588fd639960c40
    path: tests/fuzz_xpath.cpp
  modified: false
  licence: MIT
library:
  repository: https://github.com/zeux/pugixml
  commit: 27b68329de32cf9c601ca8eb6c588fd639960c40
  licence: MIT
modifications:
- Linked against pugixml at commit 27b68329.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
