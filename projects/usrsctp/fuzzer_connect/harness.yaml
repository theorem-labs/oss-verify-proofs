schema: oss-fuzz-theorems/harness/1
project: usrsctp
harness: fuzzer_connect
rocq: OSSVerify.usrsctp.fuzzer_connect
origin: upstream
summary: Client socket, connect, optionally injects canned INIT-ACK / COOKIE-ACK / DATA per data[0] bits,
  then injects data[1..] as one SCTP packet behind a canned common header; nothing about the processing
  of that packet is checked.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzzer_connect.c
  from:
    repository: https://github.com/sctplab/usrsctp
    commit: fd070e05a7474f38c7fecdf4d4b6005d2547ee00
    path: fuzzer/fuzzer_connect.c
  modified: true
  licence: BSD-3-Clause
library:
  repository: https://github.com/sctplab/usrsctp
  commit: fd070e05a7474f38c7fecdf4d4b6005d2547ee00
  licence: BSD-3-Clause
modifications:
- Linked against usrsctp at commit fd070e05 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
