licence: NOASSERTION
checks:
- kind: api-contract
  strength: weak
  stops_with: abort
  live: unknown
  where: source/fuzzer_connect.c:279-405
  what: Every socket-setup call (usrsctp_socket, 12 setsockopt, bind, connect == 0 or EINPROGRESS, SCTP_RESET_STREAMS
    after the canned handshake) must succeed. All run BEFORE the fuzzed packet is injected and depend
    on the input only through the 8 flag bits of data[0], so this is a finite setup sanity check, not
    a property of the fuzzed packet.
distribution:
