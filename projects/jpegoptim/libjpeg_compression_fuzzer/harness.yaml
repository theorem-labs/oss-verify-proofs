schema: oss-fuzz-theorems/harness/1
project: jpegoptim
harness: libjpeg_compression_fuzzer
rocq: OSSVerify.jpegoptim.libjpeg_compression_fuzzer
origin: upstream
summary: Writes the input to a /dev/shm mkstemp file and calls jpegoptim's whole CLI pipeline optimize()
  on it (decode, recompress at target size -75%, keep if smaller), logging to /dev/null. optimize()'s
  result and the output file are never inspected. It returns -1 (reject from corpus, not a crash) if lstat,
  fopen or fwrite fail.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_compression.c
  from:
    repository: https://github.com/tjko/jpegoptim
    commit: 14a3155acccdcbbfa4ea0d1d2fa11ffb9a373191
    path: fuzz/fuzz_compression.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/tjko/jpegoptim
  commit: 14a3155acccdcbbfa4ea0d1d2fa11ffb9a373191
  licence: GPL-3.0-or-later
modifications:
- Linked against jpegoptim at commit 14a3155a.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
