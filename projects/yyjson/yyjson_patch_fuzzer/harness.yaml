schema: oss-fuzz-theorems/harness/1
project: yyjson
harness: yyjson_patch_fuzzer
rocq: OSSVerify.yyjson.yyjson_patch_fuzzer
origin: upstream
summary: Splits the input by a u16 prefix into base JSON and RFC 6902 JSON Patch, applies the patch with
  yyjson_patch (immutable inputs) and yyjson_mut_patch (mutable copies), writes each result and discards
  it; the two results are never compared.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/patch_fuzzer.c
  from:
    repository: https://github.com/ibireme/yyjson
    commit: db37a64d63d38a8ddea35aa811b1163831028490
    path: fuzz/patch_fuzzer.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/ibireme/yyjson
  commit: db37a64d63d38a8ddea35aa811b1163831028490
  licence: MIT
modifications:
- Linked against yyjson at commit db37a64d.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
