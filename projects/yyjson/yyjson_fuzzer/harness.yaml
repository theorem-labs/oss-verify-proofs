schema: oss-fuzz-theorems/harness/1
project: yyjson
harness: yyjson_fuzzer
rocq: OSSVerify.yyjson.yyjson_fuzzer
origin: upstream
summary: 'Under two read/write flag sets (default; JSON5 read + pretty/escape-unicode/escape-slashes/inf-nan
  write) parses the input, copies it to a mutable doc, writes BOTH the immutable and the mutable doc to
  JSON and frees both strings unread: the two serialisations are never compared and nothing is re-parsed.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzzer.c
  from:
    repository: https://github.com/ibireme/yyjson
    commit: db37a64d63d38a8ddea35aa811b1163831028490
    path: fuzz/fuzzer.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/ibireme/yyjson
  commit: db37a64d63d38a8ddea35aa811b1163831028490
  licence: MIT
modifications:
- Linked against yyjson at commit db37a64d.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
