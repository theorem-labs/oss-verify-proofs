project: yyjson
harness: yyjson_merge_patch_fuzzer
rocq: OSSVerify.yyjson.yyjson_merge_patch_fuzzer
origin: upstream
summary: Same split as the patch fuzzer, applying an RFC 7386 JSON Merge Patch with yyjson_merge_patch
  and yyjson_mut_merge_patch; results written and discarded, never compared.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/merge_patch_fuzzer.c
  from:
    repository: https://github.com/ibireme/yyjson
    commit: db37a64d63d38a8ddea35aa811b1163831028490
    path: fuzz/merge_patch_fuzzer.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/ibireme/yyjson
  commit: db37a64d63d38a8ddea35aa811b1163831028490
  licence: MIT
modifications:
- Linked against yyjson at commit db37a64d.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
