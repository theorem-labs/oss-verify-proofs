licence: NOASSERTION
checks:
- kind: api-contract
  strength: full
  stops_with: assert
  live: true
  where: source/croaring_fuzzer_cc.cc:151-153
  what: Roaring::write() must write exactly getSizeInBytes() bytes
- kind: roundtrip
  strength: full
  stops_with: assert
  live: true
  where: source/croaring_fuzzer_cc.cc:154-156
  what: serialize (write) then readSafe must reproduce a bitmap equal to b (after ~25 set operations on
    fuzzed data)
failure_handlers: none
distribution:
