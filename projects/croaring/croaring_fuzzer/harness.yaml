  - source/croaring_fuzzer.c
  from:
    repository: https://github.com/RoaringBitmap/CRoaring
    commit: 0489dd47c1ffcd5a43f90f44f5f10e92b4fceaec
    path: fuzz/croaring_fuzzer.c
  modified: true
  licence: Apache-2.0
library:
  repository: https://github.com/RoaringBitmap/CRoaring
  commit: 0489dd47c1ffcd5a43f90f44f5f10e92b4fceaec
  version: 5.1.0
  licence: Apache-2.0
modifications:
- Linked against CRoaring 5.1.0 at commit 0489dd47 with 1 patch to the library (listed on the project
  page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
