schema: oss-fuzz-theorems/harness/1
project: spirv-cross
harness: parser_fuzzer
rocq: OSSVerify.spirv_cross.parser_fuzzer
origin: oss-fuzz
summary: Requires size >= 20 and a multiple of 4, overwrites words 0 and 1 with the SPIR-V magic and version
  1.6, and runs spirv_cross::Parser::parse(); every exception is swallowed by catch(...). The parsed IR
  is never inspected (ir, current_function and current_block are unused).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/parser_fuzzer.cpp
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/spirv-cross/parser_fuzzer.cpp
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/KhronosGroup/SPIRV-Cross
  commit: 9c3c8e2cefdd8194b193bb8ed2fdff4d5527e382
  licence: Apache-2.0
modifications:
- Linked against SPIRV-Cross at commit 9c3c8e2c.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
