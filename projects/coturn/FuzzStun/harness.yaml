schema: oss-fuzz-theorems/harness/1
project: coturn
harness: FuzzStun
rocq: OSSVerify.coturn.FuzzStun
origin: upstream
summary: 8 sub-harnesses (message-integrity check under all SHA types, attribute iteration, attribute
  append, legacy STUN, challenge-response builder, address-string parser, MESSAGE-INTEGRITY append); every
  return value is discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/FuzzStun.c
  from:
    repository: https://github.com/coturn/coturn
    commit: 70ca74e0bd8300e22a179e9a7beead862763ca5c
    path: fuzzing/FuzzStun.c
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/coturn/coturn
  commit: 70ca74e0bd8300e22a179e9a7beead862763ca5c
  licence: BSD-3-Clause
modifications:
- Linked against coturn at commit 70ca74e0.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
