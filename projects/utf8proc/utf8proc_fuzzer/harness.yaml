schema: oss-fuzz-theorems/harness/1
project: utf8proc
harness: utf8proc_fuzzer
rocq: OSSVerify.utf8proc.utf8proc_fuzzer
origin: upstream
summary: Iterates codepoints of the NUL-terminated input calling case/category/width/grapheme-break queries,
  then NFD/NFC/NFKD/NFKC/NFKC_Casefold and five utf8proc_map option sets; every return value is ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzzer.c
  from:
    repository: https://github.com/JuliaStrings/utf8proc
    commit: 0075ed7d0adba45682ee6bf7a83b10f8fd110163
    path: test/fuzzer.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/JuliaStrings/utf8proc
  commit: 0075ed7d0adba45682ee6bf7a83b10f8fd110163
  licence: MIT
modifications:
- Linked against utf8proc at commit 0075ed7d.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
