schema: oss-fuzz-theorems/harness/1
project: spdk
harness: crc_fuzz_test
rocq: OSSVerify.spdk.crc_fuzz_test
origin: upstream
summary: 'First byte selects one of 26 CRC16/32/64 functions (optimised multibinary and _base reference
  variants: t10dif, t10dif_copy, ieee, gzip_refl, iscsi, ecma/iso/jones/rocksoft refl/norm); leading 2/4/8
  bytes are the initial CRC, the rest the data; every CRC result is discarded.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/crc_fuzz_test.c
  from:
    repository: https://github.com/intel/isa-l
    commit: 7c3479e0a9dac17f448603ec1ad64c7c625f530c
    path: tests/fuzz/crc_fuzz_test.c
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/spdk/spdk
  commit: f0b63ed866f0e4d3c56e73bd4a98d0042956147a
  licence: NOASSERTION
modifications:
- Linked against spdk at commit f0b63ed8.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
