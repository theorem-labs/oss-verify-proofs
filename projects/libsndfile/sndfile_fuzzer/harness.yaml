project: libsndfile
harness: sndfile_fuzzer
rocq: OSSVerify.libsndfile.sndfile_fuzzer
origin: upstream
summary: Opens the input through sf_open_virtual and reads one frame at a time with sf_readf_float until
  EOF; data discarded.
entry: LLVMFuzzerTestOneInput
