schema: oss-fuzz-theorems/harness/1
project: libsndfile
harness: sndfile_alt_fuzzer
rocq: OSSVerify.libsndfile.sndfile_alt_fuzzer
origin: upstream
summary: Opens the input through sf_open_virtual (read-only virtual IO over the buffer) and, by the first
  byte mod 3, drains it with sf_read_short / sf_read_int / sf_read_double; the samples are discarded ("Do
  nothing with the data").
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/sndfile_alt_fuzzer.cc
  from:
    repository: https://github.com/libsndfile/libsndfile
    commit: 7ff854d1e0bd9a751a9ff52ed980c62afced91fe
    path: ossfuzz/sndfile_alt_fuzzer.cc
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/libsndfile/libsndfile
  commit: 7ff854d1e0bd9a751a9ff52ed980c62afced91fe
  licence: NOASSERTION
modifications:
- Linked against libsndfile at commit 7ff854d1.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
