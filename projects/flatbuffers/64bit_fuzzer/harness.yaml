schema: oss-fuzz-theorems/harness/1
project: flatbuffers
harness: 64bit_fuzzer
rocq: OSSVerify.flatbuffers.h_64bit_fuzzer
origin: upstream
summary: 'Verify-then-access: every field of a verified RootTable (vectors, 64-bit vectors, strings, nested
  root) is read and hashed; the hash is discarded, so the property is only that verified buffers are memory-safe
  to read.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/flatbuffers_64bit_fuzzer.cc
  from:
    repository: https://github.com/google/flatbuffers
    commit: 5761d6e67af841d15ee21bc1ce9a78ffa9cf939e
    path: tests/fuzzer/flatbuffers_64bit_fuzzer.cc
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/google/flatbuffers
  commit: 5761d6e67af841d15ee21bc1ce9a78ffa9cf939e
  licence: Apache-2.0
modifications:
- Linked against flatbuffers at commit 5761d6e6 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
