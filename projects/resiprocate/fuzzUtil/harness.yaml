schema: oss-fuzz-theorems/harness/1
project: resiprocate
harness: fuzzUtil
rocq: OSSVerify.resiprocate.fuzzUtil
origin: upstream
summary: Wraps the input in a shared resip::Data and calls DnsUtil::isIpV4Address and DnsUtil::isIpV6Address;
  both booleans are discarded (no cross-check against another address parser).
entry: LLVMFuzzerTestOneInput
source:
  files: []
  from:
    repository: https://github.com/resiprocate/resiprocate
    commit: 3a783e1aebdd7c725cbedba9a21bfc985d94a8bb
    path: rutil/test/fuzzUtil.cxx
  modified: true
  licence: BSD-2-Clause
  pending: true
library:
  repository: https://github.com/resiprocate/resiprocate
  commit: 3a783e1aebdd7c725cbedba9a21bfc985d94a8bb
  licence: BSL-1.0
modifications:
- Linked against resiprocate at commit 3a783e1a with 3 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source was modified for these builds; the modified copy is not in this release yet.
