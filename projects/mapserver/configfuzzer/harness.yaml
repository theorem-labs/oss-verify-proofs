schema: oss-fuzz-theorems/harness/1
project: mapserver
harness: configfuzzer
rocq: OSSVerify.mapserver.configfuzzer
origin: upstream
summary: Writes the input (Size from 10 to 10240 bytes) to a new file named by CPLGenerateTempFilename(NULL)
  with .config appended, loads it as a MapServer config file with msLoadConfig and frees what that returns
  with msFreeConfig, then deletes the file with VSIUnlink, frees the name and clears MapServer's error
  list with msResetErrorList. It returns -1 for an input with Size below 10 or above 10240, returns 0
  without loading anything when fopen cannot open the file for writing, and drops the results of fwrite,
  fclose and VSIUnlink.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/configfuzzer.c
  from:
    repository: https://github.com/MapServer/MapServer
    commit: fbcb5754b105707bd8cb639512e15f5b12ebd88c
    path: fuzzers/configfuzzer.c
  modified: true
  licence: Apache-2.0
library:
  repository: https://github.com/MapServer/MapServer
  commit: fbcb5754b105707bd8cb639512e15f5b12ebd88c
  licence: NOASSERTION
modifications:
- Linked against MapServer at commit fbcb5754.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- 'The harness source is modified: source/configfuzzer.c is MapServer fbcb5754''s fuzzers/configfuzzer.c
  with two Theorem Labs changes: its length check returns -1, not 1, for an input outside its limits (libFuzzer
  rejects the input; the driver exits 0, not 78), and it returns 0, not 1, when fopen cannot open the
  temporary file, so the driver does not exit with status 78 for that call.'
