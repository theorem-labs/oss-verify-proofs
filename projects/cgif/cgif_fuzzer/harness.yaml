schema: oss-fuzz-theorems/harness/1
project: cgif
harness: cgif_fuzzer
rocq: OSSVerify.cgif.cgif_fuzzer
origin: upstream
summary: Input decoded as a CGIF_Config + up to 16 frame configs (palettes, pixel data); cgif_newgif/cgif_addframe/cgif_close
  with a write callback that discards output; return codes ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/cgif_fuzzer.c
  from:
    repository: https://github.com/dloebl/cgif
    commit: b1facf77a226e971fdd9c0f2fd616ab9b03562d9
    path: fuzz/cgif_fuzzer.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/dloebl/cgif
  commit: b1facf77a226e971fdd9c0f2fd616ab9b03562d9
  licence: MIT
modifications:
- Linked against cgif at commit b1facf77.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
