rocq: OssFuzzTheorems.zlib_ng.fuzzer_example_small
origin: upstream
summary: 'Checks 2 properties (listed below); the first, a round trip: deflate then inflate with 1-byte
  in/out buffers; output must memcmp-equal the input.'
entry: LLVMFuzzerTestOneInput
