licence: NOASSERTION
checks:
- kind: algebraic
  strength: full
  stops_with: assert
  live: true
  where: source/fuzzer_checksum.c:33-40
  what: 'CRC-32 combine law per chunk (chunk size data[0], min 1): crc32_combine_op(crc_so_far, crc32_z(0,chunk),
    crc32_combine_gen(len)) == crc32_z(crc_so_far, chunk).'
- kind: differential
  strength: full
  stops_with: assert
  live: true
  where: source/fuzzer_checksum.c:41-45
  what: Chunked crc32_z over the input must equal one-shot crc32_z (exercises zlib-ng's SIMD/folding CRC
    kernels at arbitrary chunk boundaries).
- kind: algebraic
  strength: weak
  stops_with: assert
  live: true
  where: source/fuzzer_checksum.c:48-56
  what: 'crc32_combine(crc1,crc2,len)==crc32_combine(crc1,crc1,len) and combine_op(crc1,crc2)==combine_op(crc2,crc1):
    trivially true because crc1 == crc2 was just asserted.'
- kind: differential
  strength: full
  stops_with: assert
  live: true
  where: source/fuzzer_checksum.c:53-59
  what: 'crc32_combine(crc1, crc2, len) == crc32_combine_op(crc2, crc1, crc32_combine_gen(len)): the two
    combine APIs agree.'
- kind: differential
  strength: full
  stops_with: assert
  live: true
  where: source/fuzzer_checksum.c:62-68
  what: Chunked adler32_z must equal one-shot adler32_z (SIMD Adler kernels at arbitrary chunk boundaries).
- kind: algebraic
  strength: weak
  stops_with: assert
  live: true
  where: source/fuzzer_checksum.c:71-73
  what: 'adler32_combine(adler1, adler2, len) == adler32_combine(adler1, adler1, len): trivially true
    since adler1 == adler2.'
failure_handlers: none
