schema: oss-fuzz-theorems/harness/1
project: lodepng
harness: lodepng_fuzzer
rocq: OSSVerify.lodepng.lodepng_fuzzer
origin: upstream
summary: decodes with CRC/adler/nlen checks disabled, then (if that worked) decodes twice more with colour
  conversion; decode errors and pixels are ignored, nothing is compared across the three decodes.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/lodepng_fuzzer.cpp
  from:
    repository: https://github.com/lvandeve/lodepng
    commit: ed6fe5825c6a4fbb7f58ab35a4231c7543cd452a
    path: lodepng_fuzzer.cpp
  modified: false
  licence: Zlib
library:
  repository: https://github.com/lvandeve/lodepng
  commit: ed6fe5825c6a4fbb7f58ab35a4231c7543cd452a
  licence: Zlib
modifications:
- Linked against lodepng at commit ed6fe582.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
