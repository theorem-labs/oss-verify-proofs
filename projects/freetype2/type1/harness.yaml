schema: oss-fuzz-theorems/harness/1
project: freetype2
harness: type1
rocq: OSSVerify.freetype2.type1
origin: upstream
summary: template.cpp calls `(void) target.run(data, size)` on a static freetype::Type1FuzzTarget; the
  FuzzTarget/FaceFuzzTarget framework (fuzzing/src/targets, iterators/, visitors/) loads faces, named
  instances, sizes and glyphs, renders, and queries tables; every FT_Error is only logged via LOG_FT_ERROR,
  and LOG/LOG_IF expand to `; if (0) std::cout` because glog is not built. The only asserts (e.g. `assert(
  face != nullptr )`, `assert( glyphs > 0 )`) are preconditions on the harness's own objects, not library
  outputs.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/template.cpp
  from:
    repository: https://github.com/freetype/freetype2-testing
    commit: db8ae87fead2ede5487e242dd9f5a129ca5e9fd2
    path: fuzzing/src/fuzzers/template.cpp
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/freetype/freetype2-testing
  commit: db8ae87fead2ede5487e242dd9f5a129ca5e9fd2
  licence: NOASSERTION
modifications:
- Linked against freetype2-testing at commit db8ae87f.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
