schema: oss-fuzz-theorems/harness/1
project: freetype2
harness: ftfuzzer
rocq: OSSVerify.freetype2.ftfuzzer
origin: upstream
summary: 'Parses the input (optionally as a tar archive of font + attachments via libarchive), then for
  up to 20 faces x 20 named instances x 10 strikes: FT_New_Memory_Face, FT_Attach_Stream, FT_Set_Char_Size/FT_Select_Size,
  setIntermediateAxis, and FT_Load_Glyph for every glyph; every error is a `continue`. The only assert
  is `assert( !InitResult )` (FT_Init_FreeType succeeded in a static initializer), a harness-setup check,
  not a property of the input.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/ftfuzzer.cc
  from:
    repository: https://github.com/freetype/freetype2-testing
    commit: db8ae87fead2ede5487e242dd9f5a129ca5e9fd2
    path: fuzzing/src/legacy/ftfuzzer.cc
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/freetype/freetype2-testing
  commit: db8ae87fead2ede5487e242dd9f5a129ca5e9fd2
  licence: NOASSERTION
modifications:
- Linked against freetype2-testing at commit db8ae87f.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
