schema: oss-fuzz-theorems/harness/1
project: libiec61850
harness: fuzz_mms_encode
rocq: OSSVerify.libiec61850.fuzz_mms_encode
origin: upstream
summary: Decode an MmsValue, ask MmsValue_encodeMmsData for the size, allocate, and encode into the buffer.
  The encoded bytes are never compared with the input and the second call's length is not compared with
  dataSize, so this is decode->encode with NO roundtrip check.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_mms_encode.c
  from:
    repository: https://github.com/mz-automation/libiec61850
    commit: 664aa00b447292afdf86330745df1b25328aa98f
    path: fuzz/fuzz_mms_encode.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/mz-automation/libiec61850
  commit: 664aa00b447292afdf86330745df1b25328aa98f
  licence: GPL-3.0-or-later
modifications:
- Linked against libiec61850 at commit 664aa00b.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
