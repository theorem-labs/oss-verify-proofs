schema: oss-fuzz-theorems/harness/1
project: lldpd
harness: fuzz_lldp
rocq: OSSVerify.lldpd.fuzz_lldp
origin: upstream
summary: lldp_decode() on the raw frame. A frame that gives no chassis or no port returns 1. Otherwise the result
  is only freed, and nothing about the decoded chassis/port is checked.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_lldp.c
  from:
    repository: https://github.com/lldpd/lldpd
    commit: c91f4e2943aa2522dd2f490385217c538376baba
    path: tests/fuzz_lldp.c
  modified: false
  licence: ISC
library:
  repository: https://github.com/lldpd/lldpd
  commit: c91f4e2943aa2522dd2f490385217c538376baba
  licence: ISC
modifications:
- Linked against lldpd at commit c91f4e29.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
