schema: oss-fuzz-theorems/harness/1
project: nghttp2
harness: nghttp2_fuzzer
rocq: OSSVerify.nghttp2.nghttp2_fuzzer
origin: upstream
summary: Server session with no-op callbacks; submits a SETTINGS frame, drains output with nghttp2_session_mem_send2,
  feeds the whole input to nghttp2_session_mem_recv2 and drains output again; return codes ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_target.cc
  from:
    repository: https://github.com/nghttp2/nghttp2
    commit: b6729c46cf134a59940a20de534b7f44fdb0e877
    path: fuzz/fuzz_target.cc
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/nghttp2/nghttp2
  commit: b6729c46cf134a59940a20de534b7f44fdb0e877
  licence: NOASSERTION
modifications:
- Linked against nghttp2 at commit b6729c46.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
