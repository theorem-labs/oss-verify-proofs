    path: fuzz/fuzz_target_fdp.cc
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/nghttp2/nghttp2
  commit: b6729c46cf134a59940a20de534b7f44fdb0e877
  licence: NOASSERTION
modifications:
- Linked against nghttp2 at commit b6729c46.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
