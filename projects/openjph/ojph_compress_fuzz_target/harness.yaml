  - source/ojph_compress_fuzz_target.cpp
  from:
    repository: https://github.com/aous72/OpenJPH
    commit: 96f6d3937232a15d7f53fca450f3bf97cd58343a
    path: fuzzing/fuzz_targets/ojph_compress_fuzz_target.cpp
  modified: false
  licence: BSD-2-Clause
library:
  repository: https://github.com/aous72/OpenJPH
  commit: 96f6d3937232a15d7f53fca450f3bf97cd58343a
  licence: BSD-2-Clause
modifications:
- Linked against OpenJPH at commit 96f6d393.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
