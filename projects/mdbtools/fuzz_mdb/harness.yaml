schema: oss-fuzz-theorems/harness/1
project: mdbtools
harness: fuzz_mdb
rocq: OSSVerify.mdbtools.fuzz_mdb
origin: upstream
summary: mdb_open_buffer on the input; reads the table catalog, then for each table reads the columns,
  rewinds and fetches every row; nothing checked.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_mdb.c
  from:
    repository: https://github.com/mdbtools/mdbtools
    commit: b81b1c92715727c58adda2647ec1f2d61a2566c7
    path: src/fuzz/fuzz_mdb.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/mdbtools/mdbtools
  commit: b81b1c92715727c58adda2647ec1f2d61a2566c7
  version: 1.0.1
  licence: NOASSERTION
modifications:
- Linked against mdbtools 1.0.1 at commit b81b1c92.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
