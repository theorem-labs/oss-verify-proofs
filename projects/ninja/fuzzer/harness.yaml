schema: oss-fuzz-theorems/harness/1
project: ninja
harness: fuzzer
rocq: OSSVerify.ninja.fuzzer
origin: upstream
summary: Writes the input to /tmp/build.ninja and runs ManifestParser::Load on it; the return value and
  err string are discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/manifest_fuzzer.cc
  from:
    repository: https://github.com/ninja-build/ninja
    commit: b51a1e37c2fb89bbefa600bd155e1ce13983f09d
    path: misc/manifest_fuzzer.cc
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/ninja-build/ninja
  commit: b51a1e37c2fb89bbefa600bd155e1ce13983f09d
  licence: Apache-2.0
modifications:
- Linked against ninja at commit b51a1e37.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
