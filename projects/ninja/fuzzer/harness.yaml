checks: []
distribution:
  file: Distribution.v
  argv0: fuzzer
  input_file: input.bin
  prefix_hex: '000000000000'
  payload:
    length: geometric
    p: 1/65
    mean_bytes: 64
    alphabet: custom
    alphabet_size: 96
  envp:
  - LC_ALL=C
  - HOME=/
  - TZ=UTC
  components:
    payload: 22/25
    wrong_argc: 1/50
    missing_file: 1/50
    envp: 1/50
    full_support: 3/50
  mass: '1'
