schema: oss-fuzz-theorems/harness/1
project: kamailio
harness: fuzz_basex
rocq: OSSVerify.kamailio.fuzz_basex
origin: upstream
summary: data[0] % 5 selects base16 / base64 / q_base64 / base58 / base64url; the rest is encoded and,
  when encoding succeeds, the encoding is decoded into a fresh buffer, which is freed WITHOUT being compared
  to the input (encode->decode round trip with no comparison).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_basex.c
  from:
    repository: https://github.com/kamailio/kamailio
    commit: 0bc6630b06931603ab32674722b2827d94401509
    path: misc/fuzz/fuzz_basex.c
  modified: false
  licence: NOASSERTION
library:
  repository: https://github.com/kamailio/kamailio
  commit: 0bc6630b06931603ab32674722b2827d94401509
  licence: NOASSERTION
modifications:
- Linked against kamailio at commit 0bc6630b.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
