schema: oss-fuzz-theorems/harness/1
project: vorbis
harness: decode_fuzzer
rocq: OSSVerify.vorbis.decode_fuzzer
origin: upstream
summary: ov_open_callbacks over an in-memory read callback, then ov_read (16-bit LE signed) until EOF
  or error; decoded PCM discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/decode_fuzzer.cc
  from:
    repository: https://gitlab.xiph.org/xiph/vorbis
