schema: oss-fuzz-theorems/harness/1
project: vorbis
harness: encode_fuzzer
rocq: OSSVerify.vorbis.encode_fuzzer
origin: upstream
summary: VBR-encodes fuzzed float PCM (fuzzed 1-8 channels except 6, sample rate, quality) into Ogg pages;
  the encoded stream is never decoded or compared with the input (no encode->decode roundtrip).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/encode_fuzzer.cc
  from:
    repository: https://gitlab.xiph.org/xiph/vorbis
    commit: 1b75110b5a2754ba1931d82dd83cb822b266a21d
    path: contrib/oss-fuzz/encode_fuzzer.cc
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://gitlab.xiph.org/xiph/vorbis
  commit: 1b75110b5a2754ba1931d82dd83cb822b266a21d
  licence: BSD-3-Clause
modifications:
- Linked against vorbis at commit 1b75110b.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
