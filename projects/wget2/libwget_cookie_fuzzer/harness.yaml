schema: oss-fuzz-theorems/harness/1
project: wget2
harness: libwget_cookie_fuzzer
rocq: OSSVerify.wget2.libwget_cookie_fuzzer
origin: upstream
summary: wget_cookie_parse_setcookie, check_psl, normalize, store, create_request_header, and a cookie-db
  save to <pid>.tmp followed by a load into a second db; the reloaded db is never compared with the saved
  one.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/libwget_cookie_fuzzer.c
  from:
    repository: https://gitlab.com/gnuwget/wget2
    commit: ea0f0e1940fcadd08d146771efceaecc62d0425b
    path: fuzz/libwget_cookie_fuzzer.c
  modified: false
  licence: LGPL-3.0-or-later
library:
  repository: https://gitlab.com/gnuwget/wget2
  commit: ea0f0e1940fcadd08d146771efceaecc62d0425b
  licence: NOASSERTION
modifications:
- Linked against wget2 at commit ea0f0e19.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
