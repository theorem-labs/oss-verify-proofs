schema: oss-fuzz-theorems/harness/1
project: crow
harness: json_fuzzer
rocq: OSSVerify.crow.json_fuzzer
origin: upstream
summary: crow::json::load of the input; if it parses, walks top-level keys or list items calling .t();
  catch (...) swallows every exception. The dump-back roundtrip is commented out.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/json_fuzzer.cpp
  from:
    repository: https://github.com/CrowCpp/Crow
    commit: 2366edbadb568f9cc3d0ba035a6c1d6e55382adf
    path: tests/fuzz/json_fuzzer.cpp
  modified: false
  licence: BSD-3-Clause
library:
  repository: https://github.com/CrowCpp/Crow
  commit: 2366edbadb568f9cc3d0ba035a6c1d6e55382adf
  licence: BSD-3-Clause
modifications:
- Linked against Crow at commit 2366edba.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
