library:
  repository: https://github.com/FreeMixer/plugin-hostd
  commit: 65cd2b02e8306f7e5f98fa0adfd0b3f8c1df6a5c
  version: 0.10.0
  licence: GPL-3.0-or-later
modifications:
- Linked against a static libplugin-hostd.a of src/verbs.c of plugin-hostd 0.10.0 at commit 65cd2b02 and the harness's recorder,
  fuzz/recorder.c, compiled with mod-host's protocol headers as FreeMixer ships them, as plugin-hostd's Makefile builds its
  fuzz targets but with this toolchain in place of a native clang and libFuzzer.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the fuzz target one to four times and prints each return value.
