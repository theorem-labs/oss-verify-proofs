checks:
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_command.c:199-259
  what: Every message gets exactly one reply, a NUL-terminated string with no earlier NUL. When a recorded call answered,
    the reply is that answer unchanged; otherwise it is a refusal or the "resp 0" of quit. A refusal is "resp <code>" of a
    declared error code, and any other reply has the shape its verb declares or mod-host's "resp 0".
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_command.c:271-297
  what: A verb the daemon parses itself (its own verbs, and mod-host's remove, connect, disconnect and quit) is acted on only
    with an argument count its declared syntax allows, counting at most 64 words; a line passed on to every worker for the
    workers to refuse is exempt.
- kind: reference-oracle
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_command.c:299-444
  what: Each recorded call gets the message's words where the verb's declaration puts them (as written, as atoi reads them,
    or the whole line with single spaces), and add's placement and client, chain's members and their count, and pin_set's
    verdict are the ones the harness works out from the words. Other arguments are not checked.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_command.c:446-456
  what: 'A refused command (a reply with a negative code) leaves the recorded state as it was: no accepted call, no descriptor
    scan or other follow-up, and no quit.'
- kind: roundtrip
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_command.c:458-503
  what: A command the daemon acted on, sent again from the same state as its words joined by one space, makes the same calls
    with the same arguments, the same reply, the same state and host settings, and quits the same.
- kind: invariant
  strength: weak
  stops_with: abort
  live: unknown
  where: source/recorder.c:263-267
  what: The reply shape each verb declares, filled in, fits one line of the protocol (4096 bytes).
