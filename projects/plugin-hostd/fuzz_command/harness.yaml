schema: oss-fuzz-theorems/harness/1
project: plugin-hostd
harness: fuzz_command
rocq: OSSVerify.plugin_hostd.fuzz_command
origin: upstream
summary: 'Reads the input as up to 32 messages, each a flags byte, a two-byte length and up to 8192 bytes, copies each into
  an allocation of exactly its length and hands it to verbs_receive, plugin-hostd''s command parser and dispatcher. A recorder
  stands in for the supervisor, the pins, the descriptor scans and the socket: it records every call and, as the flags byte
  chooses, accepts it with the verb''s declared reply or refuses it with a declared error code. After each message the harness
  checks the reply and the calls, then sends the message again as its words joined by one space.'
entry: LLVMFuzzerTestOneInput
