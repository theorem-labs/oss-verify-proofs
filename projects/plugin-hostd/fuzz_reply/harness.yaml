schema: oss-fuzz-theorems/harness/1
project: plugin-hostd
harness: fuzz_reply
rocq: OSSVerify.plugin_hostd.fuzz_reply
origin: upstream
summary: 'Opens one worker feedback source in plugin-hostd''s relay, src/relay.c, then reads the input as up to 512 operations:
  add a source (at most four), have a source write bytes, read a source, close or remove a source, remove an instance, interrupt
  a receive, send an event of the daemon''s own, limit or interrupt the controller''s sends, or make the controller go away.
  Its own recv and send stand in for the sockets, so no socket or thread is used. A reference splitter follows what each source
  wrote. At the end the relay is shut down.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_reply.c
  - source/fuzz.h
  from:
    repository: https://github.com/FreeMixer/plugin-hostd
    commit: 65cd2b02e8306f7e5f98fa0adfd0b3f8c1df6a5c
    path: fuzz/fuzz_reply.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/FreeMixer/plugin-hostd
  commit: 65cd2b02e8306f7e5f98fa0adfd0b3f8c1df6a5c
  version: 0.10.0
  licence: GPL-3.0-or-later
modifications:
- 'No library is linked: the harness includes src/relay.c of plugin-hostd 0.10.0 at commit 65cd2b02 in its own source, with
  recv, send, shutdown, close and fcntl renamed to the harness''s own and a line limit of 6000 bytes, as plugin-hostd''s Makefile
  builds it, but with this toolchain in place of a native clang and libFuzzer.'
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the fuzz target one to four times and prints each return value.
