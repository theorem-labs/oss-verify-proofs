checks:
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_reply.c:337-355
  what: After every operation each source's buffer holds at most 6000 bytes of an unfinished line, never more than its capacity,
    and its capacity stays under 20192 bytes.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_reply.c:403-432
  what: After each read, and when a source or an instance is removed, the controller reads every complete line the source
    wrote that is 6000 bytes or shorter, once each, unchanged and in order; while the controller is gone nothing reaches it.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_reply.c:434-445
  what: After a read, and when a source or an instance is removed, the relay has taken every byte the worker wrote to each
    source it still reads.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_reply.c:454-493
  what: When a source goes, or an instance, or the relay shuts down, the relay writes one "param_gesture <instance> <symbol>
    end" line for each gesture that source's lines began and did not end (for an instance, only its own), and no other line.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_reply.c:495-527
  what: An event of the daemon's own reaches the controller as one line, exactly as written, and after each operation the
    controller has read no line the reference does not account for.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_reply.c:357-374
  what: 'What the controller reads in each operation ends on a whole line: no line is cut short.'
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_reply.c:278-285
  what: The relay sends only on the controller's socket, never on a worker's.
- kind: api-contract
  strength: weak
  stops_with: abort
  live: unknown
  where: source/fuzz_reply.c:587-591
  what: The relay follows each new worker socket it is handed.
