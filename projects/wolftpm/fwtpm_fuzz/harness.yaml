schema: oss-fuzz-theorems/harness/1
project: wolftpm
harness: fwtpm_fuzz
rocq: OSSVerify.wolftpm.fwtpm_fuzz
origin: upstream
summary: Raw TPM command packet (10 bytes .. FWTPM_MAX_COMMAND_SIZE) into FWTPM_ProcessCommand of a persistent
  firmware-TPM context (after TPM2_Startup, reset every 1000 iterations); the response and rspSize are
  ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fwtpm_fuzz.c
  from:
    repository: https://github.com/wolfSSL/wolfTPM
    commit: 29074915dc330bfd200a621bb15aa782fde4ea2f
    path: tests/fuzz/fwtpm_fuzz.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/wolfSSL/wolfTPM
  commit: 29074915dc330bfd200a621bb15aa782fde4ea2f
  licence: NOASSERTION
modifications:
- Linked against wolfTPM at commit 29074915.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
