schema: oss-fuzz-theorems/harness/1
project: wget
harness: wget_cookie_fuzzer
rocq: OSSVerify.wget.wget_cookie_fuzzer
origin: upstream
summary: cookie_handle_set_cookie three times (ports 81, 81, 80; paths p, p/d/) into a fresh cookie jar,
  then cookie_jar_delete.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/wget_cookie_fuzzer.c
  from:
    repository: https://git.savannah.gnu.org/git/wget
    commit: e9697d98e7249b0f68a6be040a4f3dcc5bc101fa
    path: fuzz/wget_cookie_fuzzer.c
  modified: true
  licence: GPL-3.0-or-later
library:
  repository: https://git.savannah.gnu.org/git/wget
  commit: e9697d98e7249b0f68a6be040a4f3dcc5bc101fa
  licence: NOASSERTION
modifications:
- Linked against wget at commit e9697d98 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
