schema: oss-fuzz-theorems/harness/1
project: openweave
harness: FuzzCertificateConversion
rocq: OSSVerify.openweave.FuzzCertificateConversion
origin: upstream
summary: detects the input certificate format and converts it to each of X509 PEM/DER and Weave base64/raw
  (PEM->DER, base64 decode, X509<->Weave, DER->PEM, base64 encode); conversion failures just exit the
  loop, outputs are never converted back or compared.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/FuzzCertificateConversion.cpp
  from:
    repository: https://github.com/openweave/openweave-core
    commit: e3c8ca3d416a2e1687d6f5b7cec0b7d0bf1e590e
    path: src/test-apps/fuzz/FuzzCertificateConversion.cpp
  modified: true
  licence: Apache-2.0
library:
  repository: https://github.com/openweave/openweave-core
  commit: e3c8ca3d416a2e1687d6f5b7cec0b7d0bf1e590e
  licence: Apache-2.0
modifications:
- Linked against openweave-core at commit e3c8ca3d with 1 patch to the library (listed on the project
  page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source differs from the upstream file at the pinned commit; the copy in source/ is the file
  as built.
