schema: oss-fuzz-theorems/harness/1
project: spice-usbredir
harness: usbredirfilterfuzz
rocq: OSSVerify.spice_usbredir.usbredirfilterfuzz
origin: upstream
summary: usbredirfilter_string_to_rules with fuzzed token/rule separators. A rule string that it refuses, or that
  gives no rules, returns 1. Otherwise usbredirfilter_verify, usbredirfilter_print to /dev/null,
  usbredirfilter_rules_to_string and usbredirfilter_check against fuzzed device/interface descriptors, with each
  result discarded.
entry: LLVMFuzzerTestOneInput
