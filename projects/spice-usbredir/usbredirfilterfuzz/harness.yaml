    abort: signal
    status: suspected-false
    basis: reading
    reason: The fuzz target calls abort() when fopen("/dev/null", "wb") fails (source/usbredirfilterfuzz.cc:41-44),
      and musl's fopen calls openat before it allocates (musl f21a9653, src/stdio/fopen.c:21-26). In LPS f1006fe8,
      openat is a file-system call (Run.v:1363) that may fail at random under both readings, because
      alloc-forced-only restricts only memory requests (Run.v:1315-1316; Shapes.v:79, :88-90), and the open of
      /dev/null may fail with ENOMEM, EACCES, EMFILE or ENFILE (Sys/Fs/Open.v:946-959, :268-273). The statement
      forbids death by SIGABRT (Shapes.v:182-195).
