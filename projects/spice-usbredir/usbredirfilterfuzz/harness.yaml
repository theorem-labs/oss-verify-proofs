  files:
  - source/usbredirfilterfuzz.cc
  from:
    repository: https://gitlab.freedesktop.org/spice/usbredir
    commit: f4406c506726853d1795eba428256b3922e1a6ad
    path: fuzzing/usbredirfilterfuzz.cc
  modified: false
  licence: GPL-2.0-or-later
library:
  repository: https://gitlab.freedesktop.org/spice/usbredir
  commit: f4406c506726853d1795eba428256b3922e1a6ad
  licence: NOASSERTION
modifications:
- Linked against usbredir at commit f4406c50.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
