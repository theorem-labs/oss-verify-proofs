schema: oss-fuzz-theorems/harness/1
project: wolfmqtt
harness: broker_fuzz
rocq: OSSVerify.wolfmqtt.broker_fuzz
origin: upstream
summary: Feeds the input as a raw MQTT byte stream into the broker via mocked accept/read/write callbacks
  and up to 7 MqttBroker_Step calls, then tears the broker down and re-initialises it; nothing is checked.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/broker_fuzz.c
  from:
    repository: https://github.com/wolfSSL/wolfMQTT
    commit: 81a6a08511504e95a2b333ebc7ec23d11585cd1e
    path: tests/fuzz/broker_fuzz.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/wolfSSL/wolfMQTT
  commit: 81a6a08511504e95a2b333ebc7ec23d11585cd1e
  licence: NOASSERTION
modifications:
- Linked against wolfMQTT at commit 81a6a085.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
