schema: oss-fuzz-theorems/harness/1
project: postfix
harness: fuzz_tok822
rocq: OSSVerify.postfix.fuzz_tok822
origin: oss-fuzz
summary: tok822_parse_limit(input, 10) then tok822_internalize and two tok822_externalize calls into one
  VSTRING; the externalized address is never re-parsed or compared with the input (no parse->externalize
  round trip check).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_tok822.c
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/postfix/fuzz_tok822.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/vdukhovni/postfix
  commit: 17830e5c13c160d51c95cb971d137a46de84e48c
  licence: NOASSERTION
modifications:
- Linked against postfix at commit 17830e5c with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
