schema: oss-fuzz-theorems/harness/1
project: proftpd
harness: fuzzer
rocq: OSSVerify.proftpd.fuzzer
origin: upstream
summary: NUL-terminates the input and calls pr_json_object_from_text on it, then on four fixed strings
  (trailing comma, 4 keys, 4-deep nesting, invalid UTF-8); every returned object is freed unexamined.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/json_fuzzer.c
  from:
    repository: https://github.com/proftpd/proftpd
    commit: a8a98dc59743ea56f36d545c4c98c8545fe731f2
    path: tests/fuzzing/json_fuzzer.c
  modified: false
  licence: GPL-2.0-or-later
library:
  repository: https://github.com/proftpd/proftpd
  commit: a8a98dc59743ea56f36d545c4c98c8545fe731f2
  licence: NOASSERTION
modifications:
- Linked against proftpd at commit a8a98dc5.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
