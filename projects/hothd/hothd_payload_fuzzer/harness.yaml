schema: oss-fuzz-theorems/harness/1
project: hothd
harness: hothd_payload_fuzzer
rocq: OSSVerify.hothd.hothd_payload_fuzzer
origin: oss-fuzz
summary: FuzzedDataProvider picks up to 20 PayloadUpdateImpl actions (initiate/erase/read/verify/getStatus/activate/send/confirm)
  over a mocked Sys (file = fuzzer bytes) and a HostCommand mock that always returns EC_RES_SUCCESS; results
  discarded and every exception swallowed by catch(...).
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/hothd_payload_fuzzer.cc
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/hothd/hothd_payload_fuzzer.cc
  modified: false
  licence: Apache-2.0
library:
  repository: https://gbmc.googlesource.com/hothd
  commit: 3df388909541ab189fd667c280c2429d74ef7e7a
  licence: Apache-2.0
modifications:
- Linked against hothd at commit 3df38890.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
