schema: oss-fuzz-theorems/harness/1
project: libspng
harness: spng_write_fuzzer
rocq: OSSVerify.libspng.spng_write_fuzzer
origin: upstream
summary: 'Checks one property, an API contract: After encoding an input-described image (IHDR, PLTE, tRNS,
  cHRM, gAMA, sBIT, sRGB, bKGD, hIST, pHYs, tIME and raw pixels, all from the input), spng_get_png_buffer
  must return a non-NULL buffer iff png_size != 0, and on error neither a buffer nor a size.'
entry: LLVMFuzzerTestOneInput
