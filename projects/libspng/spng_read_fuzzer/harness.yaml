checks:
- kind: invariant
  strength: partial
  stops_with: return-only
  live: unknown
  where: source/spng_read_fuzzer.c:115-135
  what: Every tEXt/zTXt/iTXt entry spng_get_text returns has non-NULL text, language_tag and translated_keyword,
    a non-empty keyword, and a NUL within the 80-byte keyword field; then strlen(text) is computed as
    a further read check.
- kind: invariant
  strength: partial
  stops_with: return-only
  live: unknown
  where: source/spng_read_fuzzer.c:141-157
  what: Every sPLT entry has a non-empty name, a non-NULL entries array and a NUL within the 80-byte name
    field.
- kind: invariant
  strength: partial
  stops_with: return-only
  live: unknown
  where: source/spng_read_fuzzer.c:159-174
  what: Every unknown chunk kept by SPNG_KEEP_UNKNOWN_CHUNKS has data != NULL iff length != 0.
