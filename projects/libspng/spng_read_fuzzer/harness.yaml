schema: oss-fuzz-theorems/harness/1
project: libspng
harness: spng_read_fuzzer
rocq: OSSVerify.libspng.spng_read_fuzzer
origin: upstream
summary: 'Checks 3 properties (listed below); the first, an invariant: Every tEXt/zTXt/iTXt entry spng_get_text
  returns has non-NULL text, language_tag and translated_keyword, a non-empty keyword, and a NUL within
  the 80-byte keyword field; then strlen(text) is computed as a further read check.'
entry: LLVMFuzzerTestOneInput
source:
