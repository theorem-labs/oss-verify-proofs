rocq: OSSVerify.cpp_httplib.multipart_parser_fuzzer
origin: upstream
summary: FormDataParser fed in fuzz-sized chunks with accept-all callbacks; parse() result only used to
  stop.
entry: LLVMFuzzerTestOneInput
