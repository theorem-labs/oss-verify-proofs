    path: test/fuzzing/header_parser_fuzzer.cc
  modified: false
  licence: MIT
library:
  repository: https://github.com/yhirose/cpp-httplib
  commit: 6494edd8c03c55165825ae3078e2f55c595d8cb6
  licence: MIT
modifications:
- Linked against cpp-httplib at commit 6494edd8.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
