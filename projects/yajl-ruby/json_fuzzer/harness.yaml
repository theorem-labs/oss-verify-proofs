rocq: OSSVerify.yajl_ruby.json_fuzzer
origin: oss-fuzz
summary: 'Checks 2 properties (listed below); the first, an invariant: Every number token delivered to
  the number callback has length > 0 (essentially guaranteed by the lexer).'
