schema: oss-fuzz-theorems/harness/1
project: muduo
harness: muduo_http_fuzzer
rocq: OSSVerify.muduo.muduo_http_fuzzer
origin: oss-fuzz
summary: Appends the NUL-terminated input (so bytes after an embedded NUL are dropped) to a muduo Buffer
  and runs HttpContext::parseRequest; the bool result and the parsed HttpRequest are ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/muduo_http_fuzzer.cpp
  from:
    repository: https://github.com/google/oss-fuzz
    commit: bd2ce21991a94a362b92fb1bf25f86d5a1a60842
    path: projects/muduo/muduo_http_fuzzer.cpp
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/chenshuo/muduo
  commit: f1fc77e0c13b80e5086ff457362c8a86d1b609d4
  licence: BSD-3-Clause
modifications:
- Linked against muduo at commit f1fc77e0 with 3 patches to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
