  modified: true
  licence: Apache-2.0
  pending: true
library:
  repository: https://github.com/openbmc/estoraged
  commit: af712a4430ca3aaa418fbc0e7eaa03b20505aa9e
  licence: Apache-2.0
modifications:
- Linked against estoraged at commit af712a44.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
- The harness source was modified for these builds; the modified copy is not in this release yet.
