    path: projects/cfengine/string_fuzzer.c
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/cfengine/core
  commit: b14a380d0dcc9305f8e2a7d6018d01e41593b57d
  licence: NOASSERTION
modifications:
- Linked against core at commit b14a380d.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
