project: opendnp3
harness: fuzzdecoder
rocq: OSSVerify.opendnp3.fuzzdecoder
origin: upstream
summary: Decoder::DecodeLPDU on the raw input with a no-op IDecoderCallbacks and a NOTHING-level logger;
  nothing is inspected.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzzdecoder.cpp
  from:
    repository: https://github.com/dnp3/opendnp3
