schema: oss-fuzz-theorems/harness/1
project: nanopb
harness: fuzztest_io_errors
rocq: OssFuzzTheorems.nanopb.fuzztest_io_errors
origin: upstream
summary: 'Checks 7 properties (listed below); the first, an API contract: if the first pb_decode succeeded,
  the roundtrip decode must succeed, the re-encode must succeed unless the only error is "stream full",
  decoding the canonical bytes must succeed and encoding them again must succeed.'
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzztest.c
  from:
    repository: https://github.com/nanopb/nanopb
    commit: d21fa5084287ab67da2f166f4def045bedcb535e
    path: tests/fuzztest/fuzztest.c
  modified: false
  licence: Zlib
library:
  repository: https://github.com/nanopb/nanopb
  commit: d21fa5084287ab67da2f166f4def045bedcb535e
  licence: Zlib
modifications:
- Linked against nanopb at commit d21fa508 with 1 patch to the library (listed on the project page).
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
