schema: oss-fuzz-theorems/harness/1
project: md4c
harness: fuzz-mdhtml
rocq: OSSVerify.md4c.fuzz_mdhtml
origin: upstream
summary: The first 8 bytes are read as parser_flags and renderer_flags, and md_html renders the rest;
  the output callback is a no-op and the return value is ignored.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz-mdhtml.c
  from:
    repository: https://github.com/mity/md4c
    commit: 3e7ace20d262028baf702db9850520f017c25591
    path: test/fuzzers/fuzz-mdhtml.c
  modified: false
  licence: MIT
library:
  repository: https://github.com/mity/md4c
  commit: 3e7ace20d262028baf702db9850520f017c25591
  licence: MIT
modifications:
- Linked against md4c at commit 3e7ace20.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
