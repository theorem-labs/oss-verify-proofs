schema: oss-fuzz-theorems/harness/1
project: omx-dsp
harness: fuzz_laws
rocq: OSSVerify.omx_dsp.fuzz_laws
origin: upstream
summary: Reads up to 64 calls, each picked by a selector byte. Its arguments are raw float words where a law takes any value,
  two-byte values mapped onto a law's travel, selector bytes (block lengths, pan leg, rate) and single bits (mutes). The calls
  cover the clamps and unit knob, dB to linear and back in both forms, the pan and balance laws, the fader coefficient, the
  linear ramp, the wet/dry mix and cross-fade, and the one-pole constructors, rescale and step. Each result is checked against
  its law, and the contract ledger is read after each call.
entry: LLVMFuzzerTestOneInput
source:
