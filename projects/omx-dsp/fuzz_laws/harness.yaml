    path: fuzz/fuzz_laws.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/FreeMixer/omx-dsp
  commit: a0ee1dfeefff63c25bf37e95d31683ec12c0f690
  version: 0.27.0
  licence: GPL-3.0-or-later
modifications:
- Linked against libomxdsp.a, which build.sh compiles from omx-dsp's five src/*.c files with -DOMX_CONTRACTS and -ffp-contract=off;
  the laws are inline in the headers. The Makefile's own fuzz build uses native clang with libFuzzer, which this build replaces
  with the standard driver.
- omx-contract's headers are pinned to the tag v3.4.0 (1169c701), where the library's Makefile uses whichever omx-contract
  is installed, at or above its packaging floor of 3.1.0.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the fuzz target one to four times and prints each return value.
