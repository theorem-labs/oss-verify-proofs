checks:
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_laws.c:61-103
  what: omx_clampf, omx_clamp_or and omx_unit land inside their travel for any word. A word already inside comes back unchanged,
    and a non-finite word given to omx_clamp_or reads as the declared default.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_laws.c:109-162
  what: dB to linear is never negative and, inside +-150 dB, finite and positive, in both the libm and polynomial forms. Linear
    to dB keeps its floor and stays finite for any finite word; the polynomial form stays finite.
- kind: roundtrip
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_laws.c:125-132
  what: Inside +-150 dB, converting dB to linear and back gives the original dB to within 0.01 dB.
- kind: algebraic
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_laws.c:168-174
  what: 'The pan law is constant power: the squares of the two legs add up to 1 (to 1e-5) on [-1, 1].'
- kind: invariant
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_laws.c:178-211
  what: 'The balance law never boosts: both legs are in [0, 1] and one of them is 1, at any pan word. The fader coefficient
    is finite and not negative, and 0 when the strip or the DCA is muted, for a fader level on a 16-bit grid of [-200, 60]
    dB and send and DCA gains capped at 1e6.'
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_laws.c:226-250
  what: A ramp starts at the applied value (0 when that is not finite), never leaves the span of its two ends, and ends on
    its target.
- kind: invariant
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_laws.c:260-281
  what: For samples on a 16-bit grid of [-8, 8], the wet/dry mix lies between the dry and wet samples, to 1e-5. For bodies
    on a 16-bit grid of [-4, 4], each cross-fade sample lies between the outgoing and incoming bodies, to 1e-5.
- kind: invariant
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_laws.c:288-320
  what: The time and corner constructors give a pole in [0, 1) for any finite argument, and a rescaled pole stays in [0, 1].
    For a state and an input on a 16-bit grid of [-4, 4], one filter step lies between the input and the state (to 1e-5),
    and the step returns the new state.
- kind: self-validation
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz.h:160-168
  what: After each call, no contract of the library is recorded as broken, except the crossover token bands-partition-unity,
    which this harness never reaches.
failure_handlers: unknown
