checks:
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_eq.c:86-100
  what: The head filters write at most four sections. Each section is stable (Jury conditions, computed by the harness) and
    has finite numerator coefficients.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_eq.c:118-131
  what: The bank has at most as many sections as bands, exactly one per band that is on, and none when the EQ is off.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_eq.c:135-149
  what: Every section of the bank is stable by the harness's own reading of its coefficients, and every coefficient is finite.
- kind: reference-oracle
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_eq.c:153-169
  what: Section i belongs to the i-th band that is on. It is parked exactly when that band is a peaking or shelf band at 0
    dB, and its gain at DC matches the band kind's closed form to a relative tolerance of 1e-3.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_eq.c:177-192
  what: The bank's magnitude in dB is finite at every frequency asked, and it is exactly 0 dB when no section is live.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_eq.c:208-229
  what: The cascade gives finite samples for finite samples. A bank with no live section leaves the block unchanged, bit for
    bit, on each leg it runs.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_eq.c:237-252
  what: The bandwidth-to-Q conversion gives a finite Q that is not negative for any finite width above 0. The octaves-to-Q
    conversion gives a finite positive Q for any finite width.
- kind: self-validation
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz.h:160-168
  what: After each stage, no contract of the library is recorded as broken. rate-is-declared is skipped at a rate that is
    not declared.
failure_handlers: unknown
