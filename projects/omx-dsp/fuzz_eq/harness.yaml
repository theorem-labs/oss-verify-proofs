schema: oss-fuzz-theorems/harness/1
project: omx-dsp
harness: fuzz_eq
rocq: OSSVerify.omx_dsp.fuzz_eq
origin: upstream
summary: Reads a rate (from the oracle grid or any rate from 8 to 768 kHz) and designs the head high-pass and low-pass from
  raw double corners. It then reads 1 to 24 bands, each with a kind, an on switch, a raw double corner and Q, and a gain within
  +-24 dB or exactly 0, and designs the bank. It evaluates the bank's magnitude at four frequencies, runs a finite block of
  1 to 255 samples through the mono or stereo cascade, and calls the two bandwidth-to-Q conversions.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_eq.c
  - source/fuzz.h
  from:
