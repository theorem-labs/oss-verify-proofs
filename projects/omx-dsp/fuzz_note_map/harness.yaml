schema: oss-fuzz-theorems/harness/1
project: omx-dsp
harness: fuzz_note_map
rocq: OSSVerify.omx_dsp.fuzz_note_map
origin: upstream
summary: 'Builds a valid note leg (channel, key range, transpose, velocity curve, fixed velocity) from six bytes. It then
  runs records until the input ends: three raw MIDI bytes through the map, a set_leg with six raw ints (or a valid leg from
  bytes), or a release_all with a cap of 1 to 4. A model of the downstream synth''s sounding notes, the harness''s own copy
  of the leg in force and its own table of held keys check each output. At the end it releases everything and checks every
  velocity curve.'
entry: LLVMFuzzerTestOneInput
