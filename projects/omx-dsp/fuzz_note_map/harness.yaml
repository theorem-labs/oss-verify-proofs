checks:
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_note_map.c:87-128
  what: A call writes no more messages than it has room for. Each message is a channel message with 7-bit data bytes, a note
    on has a velocity of 1 or more on a channel the leg takes, and a note off is for a key the model has sounding.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_note_map.c:146-152
  what: The leg the harness builds from the first bytes is one the library accepts as valid.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_note_map.c:177-211
  what: A note on that the leg takes, with a transposed key inside 0..127, is delivered. Every delivered note on is inside
    the leg's key range and makes one message, or two when its key was held. The last message sounds the transposed key, and
    out_of_range equals the harness's own count.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_note_map.c:231-244
  what: set_leg accepts a leg exactly when the harness's own reading finds it valid. An accepted leg becomes the policy, and
    a refused one leaves the old policy.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_note_map.c:251-287
  what: release_all writes no more than its cap and only note offs. Afterwards nothing is held and the model has nothing sounding.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_note_map.c:289-302
  what: After each record, held_count equals the held table's population, and the table holds as many keys as the harness's
    own count of what was played.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_note_map.c:310-325
  what: The release at the end of the input leaves nothing held and no note sounding in the model.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_note_map.c:330-344
  what: Every velocity curve maps each velocity 1..127 into 1..127, and the linear curve is the identity.
- kind: self-validation
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz.h:160-168
  what: At the end of the input, no contract of the library is recorded as broken.
failure_handlers: unknown
