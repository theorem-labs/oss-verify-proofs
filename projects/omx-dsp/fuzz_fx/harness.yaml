schema: oss-fuzz-theorems/harness/1
project: omx-dsp
harness: fuzz_fx
rocq: OSSVerify.omx_dsp.fuzz_fx
origin: upstream
summary: Picks one of the 25 effect instance faces from the first byte, then a rate from the oracle grid or any rate from
  8 to 768 kHz. It creates two instances at that rate. For up to eight steps it reads a bypass bit, the face's control ports
  as raw float or int words (NaN and infinities included), a block length of 1 to 512 frames and two channels of samples (finite
  at a chosen loudness, or any float word in hostile mode). Both instances get the same ports; one runs the block in place
  and the other out of place.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_fx.c
  - source/fuzz.h
  from:
    repository: https://github.com/FreeMixer/omx-dsp
    commit: a0ee1dfeefff63c25bf37e95d31683ec12c0f690
    path: fuzz/fuzz_fx.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/FreeMixer/omx-dsp
  commit: a0ee1dfeefff63c25bf37e95d31683ec12c0f690
  version: 0.27.0
  licence: GPL-3.0-or-later
modifications:
- Linked against libomxdsp.a, which build.sh compiles from omx-dsp's five src/*.c files with -DOMX_CONTRACTS and -ffp-contract=off
  as the library's Makefile does; the effect code is inline in the headers. The Makefile's own fuzz build uses native clang
  with libFuzzer, which this build replaces with the standard driver.
- omx-contract's headers are pinned to the tag v3.4.0 (1169c701), where the library's Makefile uses whichever omx-contract
  is installed, at or above its packaging floor of 3.1.0.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the fuzz target one to four times and prints each return value.
