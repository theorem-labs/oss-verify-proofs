checks:
- kind: invariant
  strength: weak
  stops_with: abort
  live: unknown
  where: source/fuzz_fx.c:271-277
  what: Two inits of the same face at the same rate return the same answer.
- kind: self-validation
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz.h:160-168
  what: 'After init, after each resolve and after each run, no PRE, POST or invariant contract of the library is recorded
    as broken. Two tokens are skipped: rate-is-declared at a rate that is not declared, and bands-partition-unity. The ledger
    is not read in hostile mode.'
- kind: differential
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_fx.c:300-306
  what: Running a block in place gives the same samples, bit for bit, as running it out of place on a twin instance that got
    the same ports.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_fx.c:307-314
  what: When init refused the rate, run() is the identity, bit for bit, whatever the ports say.
- kind: invariant
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_fx.c:315-323
  what: An instance that accepted its rate and was given finite samples returns only finite samples, at any port value.
