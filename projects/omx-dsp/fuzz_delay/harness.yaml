checks:
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_delay.c:99-134
  what: A ring takes a line exactly when the order is 3 or 5 and the ring is longer than the kernel's reach. A refusal returns
    the code that names its cause and leaves the line unarmed.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_delay.c:150-165
  what: An unarmed line reports a latency of 0 and leaves the block unchanged, bit for bit.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_delay.c:170-192
  what: The delay delivered is finite and inside the ring's longest delay, and a non-finite request reads as 0. The delay
    also equals the harness's own reading of the rule in the library's comment.
- kind: invariant
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_delay.c:202-215
  what: Every sample from the fractional line is finite and no larger than the absolute sum of the Lagrange weights times
    the take's peak.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_delay.c:218-226
  what: A whole-sample delay outputs the take delayed by that many samples, bit for bit, with zero before the take starts.
- kind: reference-oracle
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_delay.c:232-238
  what: A fractional delay outputs the Lagrange sum, computed by the harness over its copy of the take, to within a tolerance
    scaled by the weights and the peak.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_delay.c:261-302
  what: omx_idelay_samples is inside the ring. It is the rounded delay saturated at the ring's last slot, and 0 for a delay
    of no length. This holds both for any finite ms and rate and for the grid's ms and declared rates.
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_delay.c:318-347
  what: A steady integer delay on either leg outputs the take delayed, bit for bit.
- kind: invariant
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_delay.c:329-356
  what: While the integer delay moves, each sample on either leg stays between the old tap and the new tap it fades across.
- kind: self-validation
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz.h:160-168
  what: At the end of the input, no contract of the library is recorded as broken. The ledger is emptied after the calls whose
    PRE the harness breaks on purpose.
failure_handlers: unknown
