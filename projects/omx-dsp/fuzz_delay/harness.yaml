schema: oss-fuzz-theorems/harness/1
project: omx-dsp
harness: fuzz_delay
rocq: OSSVerify.omx_dsp.fuzz_delay
origin: upstream
summary: Reads a flags byte and a ring size of 1 to 4096. The fractional mode arms a Lagrange delay line of order 3, order
  5 or any signed byte, and runs up to 12 finite blocks, each with any float delay. The integer mode runs up to 12 blocks
  of a stereo or mono integer delay pair, with delays in tenths of a millisecond at a declared rate. It can also check the
  ms-to-samples conversion for any finite ms and rate. The harness keeps its own copy of the take as the oracle.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/fuzz_delay.c
  - source/fuzz.h
  from:
    repository: https://github.com/FreeMixer/omx-dsp
    commit: a0ee1dfeefff63c25bf37e95d31683ec12c0f690
    path: fuzz/fuzz_delay.c
  modified: false
  licence: GPL-3.0-or-later
library:
  repository: https://github.com/FreeMixer/omx-dsp
  commit: a0ee1dfeefff63c25bf37e95d31683ec12c0f690
  version: 0.27.0
  licence: GPL-3.0-or-later
modifications:
- Linked against libomxdsp.a, which build.sh compiles from omx-dsp's five src/*.c files with -DOMX_CONTRACTS and -ffp-contract=off;
  both delay lines are inline in the headers. The Makefile's own fuzz build uses native clang with libFuzzer, which this build
  replaces with the standard driver.
- omx-contract's headers are pinned to the tag v3.4.0 (1169c701), where the library's Makefile uses whichever omx-contract
  is installed, at or above its packaging floor of 3.1.0.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program depends only on
  its input.
- A small driver reads the input file, calls the fuzz target one to four times and prints each return value.
