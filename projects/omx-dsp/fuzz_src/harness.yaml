schema: oss-fuzz-theorems/harness/1
project: omx-dsp
harness: fuzz_src
rocq: OSSVerify.omx_dsp.fuzz_src
origin: upstream
summary: 'Reads a source and destination rate as any 32-bit words and asks for a conversion plan; when the plan is refused,
  the run ends there. Otherwise it designs the polyphase table and reads up to 16 blocks of finite samples, 0 to 512 each.
  It converts the take twice: once in a single call, and once either whole or cut into the blocks the input gave, with or
  without a final flush. The two outputs, the plan and the table are then checked.'
entry: LLVMFuzzerTestOneInput
