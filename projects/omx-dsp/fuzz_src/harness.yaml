checks:
- kind: reference-oracle
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_src.c:86-101
  what: The plan is refused exactly when a rate is 0 or the reduced interpolation factor (computed with the harness's own
    gcd) exceeds the limit.
- kind: algebraic
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_src.c:102-115
  what: 'The plan is the reduced ratio: gcd(l, m) is 1 and l times the source rate equals m times the destination rate.'
- kind: differential
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_src.c:152-158
  what: The take run in the blocks the input gives yields the same samples, bit for bit and in the same count, as the take
    run whole.
- kind: invariant
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_src.c:160-175
  what: Without a flush, no more samples come out than a whole file's frames plus half the filter length. No take makes more
    samples than the capacity of what went in.
- kind: invariant
  strength: partial
  stops_with: abort
  live: unknown
  where: source/fuzz_src.c:176-184
  what: Every output is finite and no larger than the input's peak times the table's worst per-phase absolute coefficient
    sum.
- kind: api-contract
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_src.c:185-192
  what: An identity plan returns the input samples unchanged.
- kind: invariant
  strength: full
  stops_with: abort
  live: unknown
  where: source/fuzz_src.c:196-203
  what: The coefficients of each phase of the table sum to 1, to within 1e-4.
- kind: self-validation
  strength: weak
  stops_with: abort
  live: unknown
  where: source/fuzz.h:160-168
  what: At the end of the conversion, no contract of the library is recorded as broken. The converter states no contracts,
    so nothing on this path records one and the check cannot fail.
failure_handlers: unknown
