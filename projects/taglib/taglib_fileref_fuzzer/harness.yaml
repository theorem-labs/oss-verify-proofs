project: taglib
harness: taglib_fileref_fuzzer
rocq: OSSVerify.taglib.taglib_fileref_fuzzer
origin: upstream
summary: FileRef over a ByteVectorStream, then touches every standard tag field, PICTURE complex property
  and audio properties; values discarded.
entry: LLVMFuzzerTestOneInput
source:
  files:
  - source/taglib_fileref_fuzzer.cpp
  modified: false
  licence: Apache-2.0
library:
  repository: https://github.com/taglib/taglib
  commit: 0faf7291ca654760b69599efdc3b21e6fbb28afa
  licence: NOASSERTION
modifications:
- Linked against taglib at commit 0faf7291.
- In every build, getenv() returns NULL, getpid() returns 1 and mkstemp() uses a fixed name, so the program
  depends only on its input.
- A small driver reads the input file, calls the harness one to four times and prints each return value.
